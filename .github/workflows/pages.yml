name: Deploy public site to GitHub Pages

# Deploys /public/ as the public-facing UAP Files site, alongside the small
# verified-data manifests + extracted text. The PDF/video binaries stay in
# the GitHub Release; the dashboard fetches from there.
#
# Note: Pages requires a public repo on free tier; works automatically on
# Pro/Team/Enterprise for private repos. If the repo stays private and free,
# use Cloudflare Pages or Vercel — see docs/deployment.md.

on:
  push:
    branches: [master]
    paths:
      - 'public/**'
      - 'extract/release-manifest.jsonl'
      - 'extract/public/**'
      - 'extract/text/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Stage site
        run: |
          set -e
          mkdir -p _site/extract _site/extract/text _site/extract/public
          # Public site files
          cp -r public/. _site/
          # Public-facing data the site reads
          cp extract/release-manifest.jsonl _site/extract/ 2>/dev/null || true
          cp -r extract/public/. _site/extract/public/ 2>/dev/null || true
          cp -r extract/text/. _site/extract/text/ 2>/dev/null || true
          # Headers for cleaner CDN behaviour
          cat > _site/_headers <<'EOF'
          /extract/*
            Cache-Control: public, max-age=300, must-revalidate
          /*.html
            Cache-Control: public, max-age=60, must-revalidate
          /*.css
            Cache-Control: public, max-age=86400
          EOF

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
