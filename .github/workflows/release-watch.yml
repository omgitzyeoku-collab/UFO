name: release-watch

# Polls war.gov uap-data.csv every 4h. If it changed, runs the
# differential mirror + downstream pipeline, commits, and pushes.
# Vercel auto-deploys from main.

on:
  schedule:
    - cron: '7 */4 * * *'   # every 4 hours at minute 7
  workflow_dispatch:           # also manually triggerable

permissions:
  contents: write   # to push the auto-update commit

concurrency:
  group: release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # pdftotext. Without it extract-pdf-text.mjs fails on every PDF the
      # automated path touches, and the release ships with no document text,
      # no full-text index entry and no QA — which is how 22 Release 5 PDFs
      # went live with "_notext": true.
      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v

      - name: Run release watcher
        id: watch
        run: |
          set +e
          node crawler/release-watch.mjs
          ec=$?
          if [ $ec -eq 0 ]; then
            echo "result=no-change-or-success" >> "$GITHUB_OUTPUT"
          else
            echo "result=error-$ec" >> "$GITHUB_OUTPUT"
            exit $ec
          fi

      - name: Detect changes
        id: diff
        run: |
          # Guard against a heartbeat-only change. The watcher used to rewrite
          # last_check every run, which made this step fire on all 6 daily runs and
          # commit "new release detected" 304 times without a single real release.
          # The crawler no longer writes on the no-change path; this is the backstop.
          CHANGED="$(git status --porcelain)"
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change — nothing to commit."
          elif [ "$(git diff --name-only; git ls-files -o --exclude-standard)" = "docs/release-watch-state.json" ]                && [ -z "$(git diff -U0 -- docs/release-watch-state.json | grep -E '^[+-]\s*"' | grep -v last_check)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Only last_check moved — heartbeat, not a release. Discarding."
            git checkout -- docs/release-watch-state.json
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short | head -20
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "uap-files-bot"
          git config user.email "bot@uapfiles.org"
          git add -A
          git commit -m "release-watch: new release detected at $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Auto-generated by .github/workflows/release-watch.yml — pulled new
          uap-data.csv from war.gov, ran differential mirror + pipeline.
          See docs/release-watch-state.json for the diff summary."
          git push origin HEAD:master

      # Vercel deploys automatically on master push via the Git integration.

      - name: Notify (placeholder)
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "::notice::Release watcher detected new content. Site will update via Vercel."
          # TODO: when notify-list endpoint is wired, fan out emails to
          # subscribers here (curl POST to a webhook with the diff summary).

      # A failed watcher leaves the CSV SHA unadvanced and commits nothing, so
      # the only trace is a red tick in the Actions tab. Without this the
      # pipeline can stop ingesting silently — which is how the last one did.
      - name: Alarm on failure
        if: failure()
        run: |
          echo "::error title=release-watch failed::The mirror did not complete. \
          Exit code from the watcher step: ${{ steps.watch.outputs.result }}. \
          docs/release-watch-state.json was NOT advanced if acquisition failed, so the \
          next scheduled run will retry. If this repeats, the pipeline has stopped ingesting."
