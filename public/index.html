<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>

<script>
// ===================================================================== state
let corpus = [], qaIndex = new Map(), connections = { nodes: [], edges: [] }, geocoded = {};
let activeFilters = { source: '', tier: '', agency: null, type: null, region: null };
let currentView = 'grid';
let currentDetailIdx = -1, filteredDocs = [];

// ===================================================================== utils
async function loadJsonl(url) {
  const r = await fetch(url);
  if (!r.ok) return [];
  return (await r.text()).trim().split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
}
function fmt(b) { if (!b && b!==0) return '—'; if (b<1024) return b+' B'; if (b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function escapeHtml(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, '&#96;'); }
function agencyShort(a) { if (!a) return '?'; if (a==='Department of War') return 'DOW'; if (a==='Department of State') return 'DOS'; if (a==='FBI') return 'FBI'; if (a==='NASA') return 'NASA'; if (a==='AARO') return 'AARO'; return a; }
function dateYear(s) { if (!s||s==='N/A') return null; let m=s.match(/(\d{4})/); if (m) return parseInt(m[1]); m=s.match(/\/(\d{2})$/); if (m) return 2000+parseInt(m[1]); return null; }
function uniq(a) { return [...new Set(a)].filter(x=>x).sort(); }

// ===================================================================== loading
async function loadAll() {
  const raw = await loadJsonl('extract/release-manifest.jsonl');
  const map = new Map();
  for (const r of raw) if (r.sha256 && !map.has(r.sha256)) map.set(r.sha256, r);
  corpus = [...map.values()];

  await Promise.all(corpus.map(async d => {
    try { const r = await fetch(`extract/public/${d.sha256}.json`); if (r.ok) qaIndex.set(d.sha256, await r.json()); } catch {}
  }));

  // connections
  try {
    const conn = await loadJsonl('extract/connections.jsonl');
    connections.nodes = conn.filter(r => r.kind === 'node');
    connections.edges = conn.filter(r => r.kind === 'edge');
  } catch {}

  // geocoded locations
  try {
    const gc = await loadJsonl('extract/geocoded.jsonl');
    for (const g of gc) if (g.lat && g.lon) geocoded[g.location] = g;
  } catch {}
}

// ===================================================================== filtering
function getFiltered() {
  const q = document.getElementById('q').value.toLowerCase().trim();
  return corpus.filter(d => {
    if (activeFilters.source) {
      const src = d.source || 'war.gov';
      if (src.indexOf(activeFilters.source) === -1) return false;
    }
    const qa = qaIndex.get(d.sha256);
    if (activeFilters.tier === 'green' && qa?.tier !== 'green') return false;
    if (activeFilters.tier === 'amber' && qa?.tier !== 'amber') return false;
    if (activeFilters.tier === 'awaiting' && qa) return false;
    if (activeFilters.agency && d.agency !== activeFilters.agency) return false;
    if (activeFilters.type && (d.type || 'PDF') !== activeFilters.type) return false;
    if (activeFilters.region && d.incident_location !== activeFilters.region) return false;
    if (q) {
      const tldr = qa?.public_tldr || '';
      const headline = qa?.public_headline || '';
      const hay = [d.title, d.agency, d.incident_location, d.description, headline, tldr, d.name].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

// ===================================================================== sidebar render
function renderSidebar() {
  const verified = [...qaIndex.values()].filter(q => q.tier === 'green').length;
  document.getElementById('stat-docs').textContent = corpus.length;
  document.getElementById('stat-verified').textContent = verified;

  // facets
  const byAgency = {}, byType = {}, byRegion = {};
  for (const d of corpus) {
    if (d.agency) byAgency[d.agency] = (byAgency[d.agency]||0) + 1;
    const t = d.type || 'PDF';
    byType[t] = (byType[t]||0) + 1;
    const r = d.incident_location && d.incident_location !== 'N/A' ? d.incident_location : null;
    if (r) byRegion[r] = (byRegion[r]||0) + 1;
  }
  function facet(elId, kvs, filterKey, max = 30) {
    const el = document.getElementById(elId);
    el.innerHTML = Object.entries(kvs).sort((a,b) => b[1]-a[1]).slice(0, max).map(([k,n]) => `
      <div class="facet-item ${activeFilters[filterKey] === k ? 'active' : ''}" data-key="${escapeAttr(k)}" data-fk="${filterKey}">
        <span class="name">${escapeHtml(k)}</span><span class="count">${n}</span>
      </div>`).join('');
    for (const it of el.querySelectorAll('.facet-item')) {
      it.addEventListener('click', () => {
        const k = it.dataset.key;
        activeFilters[filterKey] = (activeFilters[filterKey] === k) ? null : k;
        renderSidebar(); renderCurrentView();
      });
    }
  }
  facet('facet-agency', byAgency, 'agency');
  facet('facet-type', byType, 'type', 6);
  facet('facet-region', byRegion, 'region', 25);
}

// ===================================================================== grid view
function renderGrid() {
  filteredDocs = getFiltered();
  document.getElementById('result-count').textContent = `${filteredDocs.length} documents`;
  const grid = document.getElementById('grid');
  if (!filteredDocs.length) { grid.innerHTML = `<div class="empty">no documents match your filters</div>`; return; }

  // Sort by year desc, then verified first
  filteredDocs.sort((a,b) => {
    const yA = dateYear(a.incident_date) || 0, yB = dateYear(b.incident_date) || 0;
    if (yB !== yA) return yB - yA;
    return (qaIndex.get(b.sha256)?.tier === 'green' ? 1 : 0) - (qaIndex.get(a.sha256)?.tier === 'green' ? 1 : 0);
  });

  grid.innerHTML = filteredDocs.map((d, i) => {
    const qa = qaIndex.get(d.sha256);
    const tier = qa?.tier;
    const headline = qa?.public_headline || d.title || d.name;
    const tldr = qa?.public_tldr || (d.description || '').slice(0, 220);
    const tierBadge = tier === 'green'
      ? '<span class="tag-pill tier-green"><span class="swatch"></span>verified</span>'
      : tier === 'amber'
      ? '<span class="tag-pill tier-amber"><span class="swatch"></span>partial</span>'
      : '<span class="tag-pill faded">queued</span>';
    return `<article class="card" data-i="${i}" data-sha="${d.sha256}">
      <div class="card-meta">
        <span class="tag-pill agency-${agencyShort(d.agency)}"><span class="swatch"></span>${escapeHtml(agencyShort(d.agency))}</span>
        ${tierBadge}
        ${d.type === 'VID' ? '<span class="tag-pill">video</span>' : ''}
        ${d.type === 'IMG' ? '<span class="tag-pill">image</span>' : ''}
      </div>
      <h3>${escapeHtml(headline)}</h3>
      <p class="tldr">${escapeHtml(tldr.slice(0, 260))}</p>
      <div class="card-foot">
        ${d.incident_date && d.incident_date !== 'N/A' ? `<span>${escapeHtml(d.incident_date)}</span>` : '<span>—</span>'}
        ${d.incident_location && d.incident_location !== 'N/A' ? `<span class="dot">·</span><span>${escapeHtml(d.incident_location)}</span>` : ''}
        <span style="margin-left:auto;">${fmt(d.bytes)}</span>
      </div>
    </article>`;
  }).join('');
  for (const c of grid.querySelectorAll('.card')) {
    c.addEventListener('click', () => openDetail(parseInt(c.dataset.i)));
  }
}

// ===================================================================== map view
let mapInst = null, mapCluster = null;
function renderMap() {
  filteredDocs = getFiltered();
  document.getElementById('result-count').textContent = `${filteredDocs.length} documents`;
  if (!mapInst) {
    mapInst = L.map('map', { worldCopyJump: true, zoomControl: true });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap, © CARTO', subdomains: 'abcd', maxZoom: 19,
    }).addTo(mapInst);
    mapInst.setView([20, 30], 2);
  }
  if (mapCluster) mapInst.removeLayer(mapCluster);
  mapCluster = L.markerClusterGroup({ chunkedLoading: true, showCoverageOnHover: false });
  let count = 0;
  for (const d of filteredDocs) {
    const g = geocoded[(d.incident_location || '').trim()];
    if (!g) continue;
    const qa = qaIndex.get(d.sha256);
    const headline = qa?.public_headline || d.title || d.name;
    const m = L.circleMarker([g.lat, g.lon], {
      radius: 7, fillColor: qa?.tier === 'green' ? '#6cc28a' : '#d97757',
      color: '#000', weight: 1, opacity: 1, fillOpacity: 0.85,
    });
    m.bindPopup(`<div><strong>${escapeHtml(headline)}</strong><br><small>${escapeHtml(d.agency||'')} · ${escapeHtml(d.incident_date||'')} · ${escapeHtml(d.incident_location||'')}</small><br><a href="#" onclick="window._openDetail('${d.sha256}'); return false;">→ open detail</a></div>`);
    mapCluster.addLayer(m);
    count++;
  }
  mapInst.addLayer(mapCluster);
  if (count > 0) mapInst.invalidateSize();
}
window._openDetail = function(sha) {
  const i = filteredDocs.findIndex(x => x.sha256 === sha);
  if (i >= 0) openDetail(i);
};

// ===================================================================== network view
let netSim = null, netZoom = null, netSvg = null;
function renderNetwork() {
  filteredDocs = getFiltered();
  document.getElementById('result-count').textContent = `${filteredDocs.length} documents`;
  const filteredShas = new Set(filteredDocs.map(d => d.sha256));

  // Take only nodes in the filtered set
  const nodes = connections.nodes
    .filter(n => filteredShas.has(n.sha256))
    .map(n => ({ ...n }));
  const nodeIds = new Set(nodes.map(n => n.id));
  // Edges only between nodes in filtered set, top-N edges per node
  const edges = connections.edges
    .filter(e => nodeIds.has(e.a) && nodeIds.has(e.b))
    .map(e => ({ source: e.a, target: e.b, weight: e.weight, shared: e.shared }))
    .sort((a,b) => b.weight - a.weight)
    .slice(0, Math.min(800, connections.edges.length));

  const svg = d3.select('#netsvg');
  svg.selectAll('*').remove();
  const w = svg.node().clientWidth, h = svg.node().clientHeight;

  const colorBy = (n) => {
    const a = n.agency;
    if (a === 'Department of War') return '#f0a040';
    if (a === 'FBI') return '#6a9bcc';
    if (a === 'NASA') return '#e57373';
    if (a === 'Department of State') return '#c084fc';
    if (a === 'AARO') return '#6cc28a';
    return '#a8acb4';
  };

  // Legend
  const legend = document.getElementById('net-legend');
  legend.innerHTML = `
    <div class="row"><div class="swatch" style="background:#f0a040"></div>Department of War</div>
    <div class="row"><div class="swatch" style="background:#6a9bcc"></div>FBI</div>
    <div class="row"><div class="swatch" style="background:#e57373"></div>NASA</div>
    <div class="row"><div class="swatch" style="background:#c084fc"></div>Dept of State</div>
    <div class="row"><div class="swatch" style="background:#6cc28a"></div>AARO</div>
    <div class="row" style="margin-top:0.4rem;color:var(--text-dim);font-size:0.7rem">edges = shared entities (rare entities weighted higher)</div>`;

  // Container group for zoom
  const g = svg.append('g');
  netZoom = d3.zoom().scaleExtent([0.15, 6]).on('zoom', (e) => g.attr('transform', e.transform));
  svg.call(netZoom);

  const linkSel = g.append('g').selectAll('line').data(edges).enter().append('line')
    .attr('class', 'net-edge').attr('stroke-width', d => Math.max(0.5, Math.min(3, d.weight / 10)));

  const nodeSel = g.append('g').selectAll('circle').data(nodes).enter().append('circle')
    .attr('class', 'net-node')
    .attr('r', d => 4 + Math.min(8, Math.sqrt((d.entity_count || 0))))
    .attr('fill', colorBy)
    .attr('stroke', d => d.tier === 'green' ? '#6cc28a' : 'rgba(255,255,255,0.2)')
    .attr('stroke-width', d => d.tier === 'green' ? 2 : 1)
    .on('mouseover', (e, d) => showTooltip(e, d, edges, nodes))
    .on('mousemove', moveTooltip)
    .on('mouseout', hideTooltip)
    .on('click', (e, d) => {
      const i = filteredDocs.findIndex(x => x.sha256 === d.sha256);
      if (i >= 0) openDetail(i);
    });

  // Light label only on hover or for high-degree nodes
  const labelSel = g.append('g').selectAll('text').data(nodes).enter().append('text')
    .attr('class', 'net-label').attr('text-anchor', 'middle').attr('dy', -10)
    .text(d => '');

  if (netSim) netSim.stop();
  netSim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d => d.id).distance(d => 80 - Math.min(40, d.weight)).strength(0.4))
    .force('charge', d3.forceManyBody().strength(-110))
    .force('center', d3.forceCenter(w/2, h/2))
    .force('collide', d3.forceCollide().radius(d => 6 + Math.min(8, Math.sqrt((d.entity_count || 0)))))
    .alphaDecay(0.03)
    .on('tick', () => {
      linkSel
        .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
      labelSel.attr('x', d => d.x).attr('y', d => d.y);
    });
  netSvg = svg;
}

let tooltipEl = null;
function showTooltip(event, d, edges, nodes) {
  const connEdges = edges.filter(e => e.source.id === d.id || e.target.id === d.id);
  const connDocs = connEdges.length;
  if (!tooltipEl) {
    tooltipEl = document.createElement('div');
    tooltipEl.className = 'tooltip-box';
    document.body.appendChild(tooltipEl);
  }
  tooltipEl.innerHTML = `<strong>${escapeHtml(d.label || d.sha256.slice(0,12))}</strong><br>
    ${escapeHtml(d.agency||'?')} ${d.year ? '· '+d.year : ''} ${d.region ? '· '+escapeHtml(d.region) : ''}
    <div class="small">${connDocs} connection${connDocs===1?'':'s'} · click to open</div>`;
  tooltipEl.style.display = 'block';
  moveTooltip(event);
  // highlight connected edges
  d3.selectAll('.net-edge').classed('hi', e => e.source.id === d.id || e.target.id === d.id);
}
function moveTooltip(event) {
  if (!tooltipEl) return;
  const x = event.pageX + 14, y = event.pageY + 14;
  tooltipEl.style.left = x + 'px';
  tooltipEl.style.top = y + 'px';
}
function hideTooltip() {
  if (tooltipEl) tooltipEl.style.display = 'none';
  d3.selectAll('.net-edge').classed('hi', false);
}

// network controls
document.addEventListener('DOMContentLoaded', () => {});

// ===================================================================== view switch
function switchView(name) {
  currentView = name;
  for (const b of document.querySelectorAll('.view-tabs button[data-view]')) b.classList.toggle('active', b.dataset.view === name);
  for (const id of ['vb-grid','vb-map','vb-network']) document.getElementById(id).style.display = 'none';
  document.getElementById('vb-' + name).style.display = '';
  renderCurrentView();
}
function renderCurrentView() {
  if (currentView === 'grid') renderGrid();
  else if (currentView === 'map') renderMap();
  else renderNetwork();
}

// ===================================================================== detail panel
function openDetail(idx) {
  if (idx < 0 || idx >= filteredDocs.length) return;
  currentDetailIdx = idx;
  const d = filteredDocs[idx];
  const qa = qaIndex.get(d.sha256);
  const isPdf = /\.pdf$/i.test(d.name);
  const isVid = /\.mp4$/i.test(d.name) || d.type === 'VID';
  const headline = qa?.public_headline || d.title || d.name;
  const tldr = qa?.public_tldr;
  const narrative = qa?.public_narrative;
  const caveats = qa?.public_caveats || [];
  const keyFacts = qa?.key_facts || [];

  // Find related docs by edges
  const related = connections.edges
    .filter(e => e.a === d.sha256 || e.b === d.sha256)
    .sort((a,b) => b.weight - a.weight).slice(0, 8)
    .map(e => {
      const otherSha = e.a === d.sha256 ? e.b : e.a;
      const other = corpus.find(x => x.sha256 === otherSha);
      if (!other) return null;
      const oqa = qaIndex.get(otherSha);
      return { sha: otherSha, title: oqa?.public_headline || other.title || other.name, agency: other.agency, weight: e.weight };
    }).filter(Boolean);

  document.getElementById('detail-tags').innerHTML = `
    <span class="tag-pill agency-${agencyShort(d.agency)}"><span class="swatch"></span>${escapeHtml(agencyShort(d.agency))}</span>
    ${qa?.tier === 'green' ? '<span class="tag-pill tier-green"><span class="swatch"></span>verified</span>' : ''}
    ${qa?.tier === 'amber' ? '<span class="tag-pill tier-amber"><span class="swatch"></span>partial</span>' : ''}
    ${!qa ? '<span class="tag-pill faded">awaiting QA</span>' : ''}
    ${d.type === 'VID' ? '<span class="tag-pill">video</span>' : ''}
    ${d.source && d.source !== 'war.gov' ? `<span class="tag-pill">${escapeHtml(d.source)}</span>` : ''}
  `;

  document.getElementById('detail-body').innerHTML = `
    <h2>${escapeHtml(headline)}</h2>
    <div class="meta-line">
      <span><strong>Agency</strong> · ${escapeHtml(d.agency || '—')}</span>
      ${d.incident_date && d.incident_date !== 'N/A' ? `<span><strong>Date</strong> · ${escapeHtml(d.incident_date)}</span>` : ''}
      ${d.incident_location && d.incident_location !== 'N/A' ? `<span><strong>Location</strong> · ${escapeHtml(d.incident_location)}</span>` : ''}
    </div>
    ${tldr ? `<div class="tldr">${escapeHtml(tldr)}</div>` : ''}
    ${narrative ? `<div class="narrative">${narrative.split('\n\n').map(p => `<p>${escapeHtml(p)}</p>`).join('')}</div>`
      : `<div class="narrative" style="opacity:0.7;"><p>${escapeHtml(d.description || 'Plain-English summary not yet generated. The QA pipeline is still processing this document.')}</p></div>`}

    ${keyFacts.length ? `<h4>Verified facts</h4>
      <dl>${keyFacts.map(f => `
        <dt class="conf-${f.confidence}">${escapeHtml(f.field)}</dt>
        <dd class="conf-${f.confidence}">${escapeHtml(f.value)}</dd>`).join('')}
      </dl>` : ''}

    ${caveats.length ? `<div class="caveats">
      <h4>What to know</h4>
      <ul>${caveats.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>
    </div>` : ''}

    ${related.length ? `<h4>Related documents</h4>
      <div class="related-list" id="related-list">
        ${related.map(r => `<div class="related-item" data-sha="${r.sha}">
          <span class="tag-pill agency-${agencyShort(r.agency)}"><span class="swatch"></span>${escapeHtml(agencyShort(r.agency))}</span>
          <span class="title">${escapeHtml(r.title)}</span>
          <span class="weight">w=${r.weight}</span>
        </div>`).join('')}
      </div>` : ''}

    <div class="src-row">
      <a class="primary" href="${escapeAttr(d.release_url)}" target="_blank" rel="noopener">↓ Original ${isVid ? 'video' : isPdf ? 'PDF' : 'file'} (${fmt(d.bytes)})</a>
      ${d.url ? `<a href="${escapeAttr(d.url)}" target="_blank" rel="noopener">↗ Source on war.gov</a>` : ''}
      <a href="https://github.com/omgitzyeoku-collab/UFO/issues/new?template=correction.yml&title=%5BCorrection%5D+${encodeURIComponent((d.title||d.name||'').slice(0,80))}&labels=correction" target="_blank" rel="noopener">⚠ Report an error</a>
    </div>

    ${isPdf ? `<iframe class="pdf-frame" src="https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(d.release_url)}" loading="lazy" title="${escapeAttr(headline)}"></iframe>` : ''}
    ${isVid ? `<video class="pdf-frame" src="${escapeAttr(d.release_url)}" controls preload="metadata"></video>` : ''}
  `;

  for (const it of document.querySelectorAll('#related-list .related-item')) {
    it.addEventListener('click', () => {
      const i = filteredDocs.findIndex(x => x.sha256 === it.dataset.sha);
      if (i >= 0) openDetail(i);
      else { // jump even if not in current filter
        const orig = filteredDocs;
        const target = corpus.find(x => x.sha256 === it.dataset.sha);
        if (target) {
          filteredDocs = [target];
          openDetail(0);
          filteredDocs = orig;
        }
      }
    });
  }

  document.getElementById('detail-overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
  history.replaceState(null, '', '#doc/' + d.sha256);
}
function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
  document.getElementById('detail-panel').classList.remove('open');
  currentDetailIdx = -1;
  history.replaceState(null, '', location.pathname);
}
function navDetail(delta) {
  if (currentDetailIdx < 0) return;
  const next = currentDetailIdx + delta;
  if (next >= 0 && next < filteredDocs.length) openDetail(next);
}

document.getElementById('detail-overlay').addEventListener('click', closeDetail);
document.getElementById('detail-close').addEventListener('click', closeDetail);
document.getElementById('detail-prev').addEventListener('click', () => navDetail(-1));
document.getElementById('detail-next').addEventListener('click', () => navDetail(1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
  else if (e.key === 'ArrowLeft' && currentDetailIdx >= 0) navDetail(-1);
  else if (e.key === 'ArrowRight' && currentDetailIdx >= 0) navDetail(1);
  else if (e.key === '/' && document.activeElement?.tagName !== 'INPUT') {
    e.preventDefault(); document.getElementById('q').focus();
  }
});

// ===================================================================== theme
function applyTheme() {
  const saved = localStorage.getItem('uap-theme');
  const t = saved || 'dark';
  document.documentElement.classList.toggle('dark', t === 'dark');
  document.documentElement.classList.toggle('light', t === 'light');
}
document.getElementById('theme-toggle').addEventListener('click', () => {
  const isDark = document.documentElement.classList.contains('dark');
  localStorage.setItem('uap-theme', isDark ? 'light' : 'dark');
  applyTheme();
  if (currentView === 'map' && mapInst) { mapInst.invalidateSize(); }
});
applyTheme();

// ===================================================================== view tabs
for (const b of document.querySelectorAll('.view-tabs button[data-view]')) {
  b.addEventListener('click', () => switchView(b.dataset.view));
}
document.getElementById('q').addEventListener('input', () => renderCurrentView());
document.getElementById('f-source').addEventListener('change', (e) => { activeFilters.source = e.target.value; renderCurrentView(); });
document.getElementById('f-tier').addEventListener('change', (e) => { activeFilters.tier = e.target.value; renderCurrentView(); });

// network buttons
document.getElementById('net-reheat').addEventListener('click', () => { if (netSim) netSim.alpha(0.6).restart(); });
document.getElementById('net-zoom-in').addEventListener('click', () => { if (netSvg && netZoom) netSvg.transition().duration(200).call(netZoom.scaleBy, 1.4); });
document.getElementById('net-zoom-out').addEventListener('click', () => { if (netSvg && netZoom) netSvg.transition().duration(200).call(netZoom.scaleBy, 0.7); });

// ===================================================================== bootstrap
(async () => {
  try { await loadAll(); }
  catch (e) {
    document.getElementById('grid').innerHTML = `<div class="empty" style="color: var(--bad);">load failed: ${escapeHtml(e.message)}</div>`;
    return;
  }
  renderSidebar();
  renderGrid();
  // Deep-link
  const m = location.hash.match(/^#doc\/([a-f0-9]+)/);
  if (m) {
    const fi = filteredDocs.findIndex(x => x.sha256.startsWith(m[1]));
    if (fi >= 0) openDetail(fi);
  }
})();
</script>
</body>
</html>
