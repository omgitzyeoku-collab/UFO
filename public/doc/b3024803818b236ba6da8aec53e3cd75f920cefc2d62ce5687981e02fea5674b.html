  <h1>Cargo Pilot Reports Three White Lights Over Texas at 39,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b3024803818b236ba6da8aec53e3cd75f920cefc2d62ce5687981e02fea5674b.jpg" alt="Cargo Pilot Reports Three White Lights Over Texas at 39,000 Feet thumbnail" loading="lazy" />
  <p>An FAA preliminary notification records that the crew of a Canadian cargo flight reported seeing an unidentified aerial phenomenon with three white lights while cruising at 39,000 feet near Victoria, Texas on May 17, 2023. The document is a single-page operational relay with no follow-up investigation or sensor data attached.</p>
  <div class="narr">This document is a preliminary notification from the FAA Washington Operations Center — essentially an internal alert that something unusual was reported in US airspace. It is not an investigation report, and it reaches no conclusions about what the crew saw.

On May 17, 2023, at approximately 2:20 AM Central Time, the crew of CargoJet flight 906 — a Canada-registered Boeing 767-200 flying northeast from Guadalajara, Mexico to Cincinnati — reported an unidentified aerial phenomenon with three white lights off the left side of their aircraft. The plane was at flight level 390 (roughly 39,000 feet) and was about 5 nautical miles north of Victoria, Texas, at coordinates 28.85°N, 96.92°W. No evasive action was taken.

Houston Air Route Traffic Control Center relayed the pilot report to the FAA Operations Center. The document notes that no LETO (Law Enforcement Terrorism Operations) notification was provided, which suggests the event was not treated as a security concern at the time.

There is no follow-up investigation documented here, no radar data, no photographs, and no resolution. The record is exactly what it appears to be: a preliminary relay of a pilot sighting, preserved in the FAA&#39;s operational records and released as part of the Department of War&#39;s public UAP disclosure.</div>
