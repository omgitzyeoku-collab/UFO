  <h1>Pilot Reports White Oval Object at 43,000 Feet Over Arizona</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f653bae6748147fc7fe3b0ec9b94426cd26e35cc69f246e89ca2f6719d94e70a.jpg" alt="Pilot Reports White Oval Object at 43,000 Feet Over Arizona thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Gulfstream G280 pilot who spotted a white oval-shaped unidentified aerial phenomenon directly ahead of the aircraft while flying at 43,000 feet over Arizona on April 27, 2023. The report is a brief relay from air traffic control to the FAA&#39;s Washington Operations Center — no investigation findings or explanation are included.</p>
  <div class="narr">On April 27, 2023, the pilot of a Gulfstream G280 business jet (registration N899SC) flying from Santa Ana, California, to Houston, Texas, reported seeing an unidentified aerial phenomenon. The object was described as white and oval-shaped, positioned directly ahead of the aircraft at the 12 o&#39;clock position. The aircraft was heading east at flight level 430 — approximately 43,000 feet — about 20 nautical miles west of the Gila Bend VOR navigational point in Arizona.

The pilot did not take evasive action, and no law enforcement was notified. The sighting was relayed through Albuquerque Air Route Traffic Control Center (ARTCC) to the FAA Washington Operations Center, which logged it as an incident report.

The document is short and preliminary. It records only that the pilot saw something and what it looked like in broad terms. There is no description of the object&#39;s size, movement, speed, or how long it was visible. The FAA report contains no analysis, no conclusion about what the object might have been, and no indication that a follow-up investigation was conducted.

The coordinates logged in the report (approximately 32.95°N, 112.37°W) place the sighting in a sparsely populated area of southwestern Arizona desert.</div>
