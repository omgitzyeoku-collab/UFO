  <h1>Pentagon UAP Office Briefing Reveals Reporting Patterns and Mission Goals</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2d445a78c34ed96f4e40a29748a2580e530eb0c69fba4ba37c20fe5abc999337.jpg" alt="Pentagon UAP Office Briefing Reveals Reporting Patterns and Mission Goals thumbnail" loading="lazy" />
  <p>This July 2023 briefing deck from the Pentagon&#39;s All-Domain Anomaly Resolution Office (AARO) lays out the office&#39;s mission, structure, and UAP reporting statistics. Most reported UAP appear at commercial flight altitudes near US military facilities, and the office frames them primarily as a national security and safety concern.</p>
  <div class="narr">In July 2023, Dr Seán Kirkpatrick, director of the Pentagon&#39;s All-Domain Anomaly Resolution Office (AARO), presented an unclassified slide deck outlining how the US government investigates unidentified anomalous phenomena — the official term for what most people call UFOs. The presentation was cleared for public release and later reviewed for declassification under the FY24 National Defence Authorization Act in March 2025.

The slides define UAP as detections across air, sea, space, or multiple domains that cannot yet be attributed to any known source and that behave in ways sensors or observers do not readily understand. AARO&#39;s stated mission is to minimise surprise by detecting, identifying, and attributing these phenomena, working with a broad set of partners including the Department of Energy, NASA, the FAA, and international allies.

Reporting statistics in the deck show that the largest share of UAP sightings — roughly 29% — occur around 20,000 feet, with another 20% near 25,000 feet. These altitudes overlap with commercial air traffic. The Defence Department notes that most observations happen near US military facilities and operating areas, and warns that UAP near strategic assets could threaten deterrence and public safety. A separate concern raised in the slides is that foreign adversaries might mistakenly blame UAP activity on the United States.

AARO is organised into four pillars: Operations, Science and Technology, Analyses, and Strategic Communications. Its analytic process runs cases through preliminary review, scientific analysis, intelligence analysis, peer review by a Strategic Technical Advisory Group, and a final director&#39;s review. The slides also mention that AARO &quot;directs exploitation of recovered enigmatic technologies&quot; using cross-sector partnerships, though no specific recovered objects or materials are described anywhere in the document.

The briefing covers reporting trends from 1996 to 2023 and includes a morphology breakdown of UAP shapes, but the shape categories are numbered without labels, making them impossible to interpret from the text alone. A hotspot map referenced in the slides is similarly unreadable from the extracted text.</div>
