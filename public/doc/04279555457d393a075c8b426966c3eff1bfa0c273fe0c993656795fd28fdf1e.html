  <h1>Airline Crew Reported Pulsating Lights Over the Atlantic in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/04279555457d393a075c8b426966c3eff1bfa0c273fe0c993656795fd28fdf1e.jpg" alt="Airline Crew Reported Pulsating Lights Over the Atlantic in 2023 thumbnail" loading="lazy" />
  <p>This FAA operations center notification documents a UAP sighting by the crew of Omni Air International flight 573 on March 10, 2023. The crew reported stationary pulsating lights directly ahead of their aircraft while flying at 33,000 feet over the Atlantic, roughly 70 nautical miles northeast of Nantucket, Massachusetts. No evasive action was taken and no disruption to air traffic was recorded.</p>
  <div class="narr">On March 10, 2023, at approximately 2:31 a.m. Eastern time, the crew of Omni Air International flight 573 — a Boeing 777-200 bound for Shannon, Ireland — reported an unidentified aerial phenomenon to Boston Air Route Traffic Control Center (ARTCC). The aircraft was flying northeast at flight level 330, roughly 33,000 feet, about 70 nautical miles northeast of Nantucket, Massachusetts.

The crew described stationary pulsating lights directly ahead of the aircraft, at what pilots call the 12 o&#39;clock position. No evasive action was taken, and the FAA recorded no impact to the National Airspace System. No law enforcement was notified.

This document is a preliminary incident notification from the FAA&#39;s Washington Operations Center — not a full investigation report. It records what the crew reported and the initial operational response, but contains no follow-up investigation, no radar data, and no resolution. The record simply logs the sighting and closes.

One notable oddity in the document: the longitude coordinate is mislabelled as &quot;Latitude&quot; in the original FAA form, a clerical error that does not affect the substance of the report but is worth flagging for accuracy.</div>
