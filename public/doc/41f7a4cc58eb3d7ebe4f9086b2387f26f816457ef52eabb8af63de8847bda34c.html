  <h1>FBI Agents Collected UAP Video Footage From Witness in Northeastern US</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">October, 2024</span>
    <span class="badge">Northeastern United States</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/41f7a4cc58eb3d7ebe4f9086b2387f26f816457ef52eabb8af63de8847bda34c.jpg" alt="FBI Agents Collected UAP Video Footage From Witness in Northeastern US thumbnail" loading="lazy" />
  <p>This FBI investigative form records that in October 2024, special agents contacted a person in the northeastern United States who provided multiple video clips of objects described as unknown UAS (unmanned aerial systems) or UAP (unidentified aerial phenomena) near their home. The document is heavily redacted, with all names, specific locations, and organisational details blacked out.</p>
  <div class="narr">This document is an FBI FD-1057, a standard investigative activity form used to record agent contacts and evidence collection. It shows that in October 2024, FBI special agents reached out to a U.S. person in the northeastern United States who had footage of unidentified objects near their residence.

The individual provided multiple video clips showing what the form describes as objects &quot;appearing to be unknown UAS or UAP&quot; — meaning unidentified drones or aerial phenomena. The person had previously been referred to the FBI by a liaison contact, though the identity of that contact is redacted.

The FBI does not draw any conclusion in this document about what the objects are. The language is cautious: the objects only &quot;appear to be&quot; unknown. There is no determination that they are anomalous, extraterrestrial, or even unexplained — just that they were unidentified at the time of recording.

The document is heavily redacted throughout. All personal names, specific locations, and organisational details have been removed, making independent verification of the account impossible. The underlying text was extracted via OCR from an image, which introduces minor recognition errors in the source material.

This form is part of a cluster of related FBI documents (FBI-UAP-D004 through D008) and associated video files from the same general area, suggesting a localised series of sightings rather than independent reports from different regions.</div>
