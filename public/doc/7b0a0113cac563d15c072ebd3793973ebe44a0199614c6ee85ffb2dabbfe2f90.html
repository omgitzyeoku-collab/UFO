  <h1>Alaska Airlines Crew Reported Balloon-Like Object at 40,000 Feet Over Montana</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7b0a0113cac563d15c072ebd3793973ebe44a0199614c6ee85ffb2dabbfe2f90.jpg" alt="Alaska Airlines Crew Reported Balloon-Like Object at 40,000 Feet Over Montana thumbnail" loading="lazy" />
  <p>An FAA incident report documents a commercial Alaska Airlines crew (flight ASA18) reporting a balloon-like object between 40,000 and 45,000 feet while flying eastbound near Billings, Montana on 2 February 2023. The FAA classified it as an Unidentified Aerial Phenomenon and closed the case with no further explanation recorded.</p>
  <div class="narr">On 2 February 2023 at 00:09 UTC, the crew of Alaska Airlines flight ASA18 — a commercial flight from Portland (PDX) to New York (JFK) — reported an object to air traffic control. The crew described it as a balloon positioned off the left side of their aircraft, at an altitude between flight level 400 and 450 (roughly 40,000 to 45,000 feet). Their own aircraft was flying eastbound at flight level 350 (about 35,000 feet), meaning the object appeared to be 5,000 to 10,000 feet above them.

The sighting occurred approximately 10 nautical miles southeast of Billings, Montana. The FAA logged the incident under its SKYWATCH system and assigned it the primary code &quot;Unidentified Aerial Phenomenon.&quot; No radar data, photographs, or corroborating reports from other aircraft are included in this document.

The case is now closed. The report does not record any follow-up investigation, identification of the object, or conclusion about what the crew saw. No aircraft tail number is listed in the record, which is unusual but not necessarily a sign of deliberate redaction. It is worth noting that this sighting took place in early February 2023, during a period of heightened public and government attention to aerial objects following the Chinese surveillance balloon incidents.</div>
