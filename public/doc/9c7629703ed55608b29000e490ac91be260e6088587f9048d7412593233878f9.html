  <h1>1950s US-Canadian flying saucer project doubted; Newfoundland UFO baffles Air Force</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">1955</span>
    <span class="badge">Various</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/9c7629703ed55608b29000e490ac91be260e6088587f9048d7412593233878f9.jpg" alt="1950s US-Canadian flying saucer project doubted; Newfoundland UFO baffles Air Force thumbnail" loading="lazy" />
  <p>This is a 1954-1955 US Air Force file bundling intelligence memos, a Scientific Advisory Board report, and internal correspondence about the joint US-Canadian Avro &#39;Project Y2&#39; near-circular VTOL &#39;flying saucer&#39; aircraft and a July 1955 unexplained sighting near Newfoundland. Air Force review panels judged the Avro project technically unpromising and worthy of only limited support, while a separate committee could not explain a KC-97 tanker crew&#39;s visual sighting that was matched by ground radar. The committee classified the incident as a UFOB and recommended scrambling fighters to intercept any similar future objects.</p>
  <div class="narr">This document is an internal US Air Force file from 1954-1955, released under declassification authority NND 974373. It gathers together intelligence memoranda, a Scientific Advisory Board (SAB) report, and internal correspondence covering two separate but related subjects: an experimental aircraft programme and an unexplained aerial sighting.

The first subject is the joint US-Canadian Avro &#39;Project Y2&#39;, a near-circular vertical take-off and landing (VTOL) &#39;flying saucer&#39; aircraft being developed at A. V. Roe Canada Ltd. in Malton, Ontario. After reviewing the project, the Air Force&#39;s Scientific Advisory Board panels concluded it warranted no more than limited support, giving generally negative findings on its technical feasibility. That cautious verdict contrasted with an upbeat article titled &#39;The Flying Disc&#39; published in the December 1954 issue of the Air Intelligence Digest, which had conveyed an impression of technical soundness. The Avro report was submitted to Lt. Gen. D. L. Putt on 10 December 1954. The file also notes that no intelligence was available to either confirm or rule out the existence of comparable unconventional Soviet aircraft.

The second subject is an incident on 6 July 1955 near Newfoundland (roughly 49N 59.5W). The crew of a US Air Force KC-97 refuelling tanker visually reported an unidentified object, and a ground GCI (ground-controlled intercept) radar in the same area picked up a return on an object that appeared to be the same one the crew was watching.

An Air Force committee reviewed the case and could not explain how the radar returns and the crew&#39;s visual sighting occurred simultaneously. It tentatively accepted a NEAC evaluation attributing the event to an electrical phenomenon combined with aircrew misinterpretation, though the matching radar return itself was left unexplained. The committee classified the incident as a &#39;UFOB&#39; — a bureaucratic reporting category, not a claim of unusual origin — and recommended that any future incidents of this type trigger fighter scrambles without delay. The file also records that Hq MATS was responsible under AFR 200-3 for bringing commercial airlines and pilots into the CIRVIS sighting-reporting programme.

The underlying scan is affected by moderate redaction, and the original text is heavily garbled by optical character recognition (OCR) in places, so some names, ranks and figures are approximate and should be checked against the original scan.</div>
