  <h1>Pilot Reports Illuminated Unidentified Object Near Alaska Volcano in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/db3514efd1a1001c7d58758f37435ae03686b66d4098b7a7c54e723f6f793c3c.jpg" alt="Pilot Reports Illuminated Unidentified Object Near Alaska Volcano in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a pilot sighting of an unidentified, well-illuminated object near Mt. Augustine, Alaska, on 9 March 2023. The pilot was flying at 14,000 feet, saw the object slightly below the aircraft, and lost sight of it in twilight. The case is closed with no explanation offered.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form the Federal Aviation Administration uses to log unusual aerial sightings reported by pilots. It covers an event on 9 March 2023 at 05:01 UTC, involving a BE10 aircraft flying under the callsign TN479AK. The flight originated from Port Heiden (PTH) and was headed to Merrill Field (MRI) in Anchorage.

While flying northeast at 14,000 feet over coordinates 59.30N, 153.23W — in the vicinity of Mt. Augustine, a volcano in Alaska&#39;s Cook Inlet — the pilot reported an unidentified aerial phenomenon off the right side of the aircraft. The object was described as &quot;well illuminated but undefined&quot; and positioned slightly below the plane. No other air traffic was reported in the area at the time.

The pilot-in-command lost visual contact with the object in twilight conditions. The FAA&#39;s Alaska Region (ANR) was notified. The report is assigned MOR ID ZAN-M-2023/03/08-0001.

The case status is marked as Closed. The report contains no follow-up investigation, no radar or sensor data, and no conclusion about what the object was. There is minimal redaction in the document.</div>
