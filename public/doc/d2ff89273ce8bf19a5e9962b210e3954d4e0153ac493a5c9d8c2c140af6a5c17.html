  <p>This is a 1957 CIA information report about unknown flying objects observed over Budapest, Hungary. The document&#39;s text is almost entirely unreadable due to extreme redaction or degraded scan quality, leaving only the title and metadata as usable information.</p>
  <div class="narr">In 1957, the CIA (Central Intelligence Agency) produced an information report titled &quot;Unknown Flying Objects Observed Over Budapest.&quot; The report concerns UFO sightings over Budapest, Hungary, though the details of what was seen, by whom, and what the agency made of it are unknown — not because they were never recorded, but because the document is effectively unreadable.

The extracted text yields virtually no legible content. Only fragments of formatting artifacts and partial characters survived, meaning no sentences, data points, witness names, object descriptions, or conclusions can be recovered from the body of the document. The redaction or degradation is classified as extreme.

Everything known about this report comes from its metadata and catalogue description rather than from the document itself. The catalogue notes that a more heavily redacted version was previously available on the CIA&#39;s public website, implying this release may contain additional material — but the text extraction failed to capture any of it.

The document may need manual review of the original PDF or a fresh attempt at optical character recognition with different settings to recover whatever content exists beneath the damage. As it stands, the report confirms that the CIA documented UFO activity over Budapest in 1957, but tells us nothing about what was observed or what the agency concluded.</div>
