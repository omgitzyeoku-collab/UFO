  <h1>Six Dark Triangles in Southeast Asia Were Fishing Nets</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/fdfd3b9eef9f7fa93b9a928c1ac6663e1bfc2345fa68aa433b60e7d039d2d3b7.jpg" alt="Six Dark Triangles in Southeast Asia Were Fishing Nets thumbnail" loading="lazy" />
  <p>AARO investigated six dark triangular objects spotted in satellite imagery over Southeast Asian waters in 2017 and concluded they were almost certainly cone-shaped fishing nets floating on the ocean surface. The case was resolved in March 2023 and released to the public with no redactions.</p>
  <div class="narr">This document is a case resolution from the All-domain Anomaly Resolution Office (AARO), the Pentagon office responsible for investigating unidentified anomalous phenomena (UAP). It covers Case 019, titled &quot;Southeast Asia Triangles,&quot; which was formally resolved on 17 March 2023.

On 30 August 2017, an Intelligence Community member flagged satellite imagery showing six triangular objects arranged in a formation somewhere in Southeast Asia. The objects were considered potentially anomalous and a possible risk to navigation. No radar, video, or other sensor data is described — the entire case rests on satellite imagery alone.

AARO and its intelligence and science-and-technology partners reviewed the imagery, discovered additional satellite photos of the same area from 2017, and compared the objects against libraries of known shapes. They determined the six objects were almost certainly cone-shaped static fishing nets floating on the ocean surface, each measuring roughly 11 metres by 7 metres.

The document was cleared for public release on 4 October 2023 and is marked &quot;Released in Full,&quot; meaning no text was redacted. It underwent a further classification review on 6 February 2025 under authority of the FY24 National Defense Authorization Act (codified at 44 U.S.C. 2107). Despite the full release, the original satellite imagery itself is not included in this text document.</div>
