  <h1>Multiple Pilots Report Four Green-Lit Objects at 37,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f3de3889880b864c12194dca56b878ee8ad7e88bc6e35c7c7cef0509432a5cf4.jpg" alt="Multiple Pilots Report Four Green-Lit Objects at 37,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a July 2023 sighting in which multiple commercial aircraft observed four unidentified green-lighted objects rapidly climbing and descending near 37,000 feet. The objects were detected on primary radar but could not be matched to any known aircraft, and the case was closed without explanation.</p>
  <div class="narr">On 22 July 2023 at 06:05 UTC, crews aboard multiple commercial aircraft reported four unidentified aerial objects while flying northbound at 37,000 feet, roughly 130 nautical miles north-northeast of the ZFP navigation fix. The objects were described as green-lighted, climbing and descending rapidly before disappearing. The sighting was logged through the FAA&#39;s SKYWATCH reporting system, with Miami Air Route Traffic Control Center (ZMA) listed as the reporting facility.

The pilot-in-command of Avianca flight 062 — an Airbus A320 operating from Cali, Colombia (SKCL) to New York&#39;s JFK — was identified as the primary witness. The report states he recorded video of the objects on a personal device and agreed to provide the footage to ZMA&#39;s Operations Manager in Charge (OMIC). The Eastern Air Defense Sector (EADS) captured primary radar returns in the area, and both EADS and the North American Aerospace Defense Command (NORAD) were notified.

Despite the radar detections, the Air and Marine Operations Coordination Center (AMOCC) was unable to correlate the returns to any known tracked target — meaning the objects did not match any aircraft in the system. The report&#39;s status is listed as &quot;Closed&quot; with no identification or explanation of what the objects were.

The document is a single-page FAA incident form. It contains no photographs, no attached video, and no analytical conclusions. The pilot-in-command is named as Raul Salazar, with contact information consistent with Avianca being a Colombian carrier.</div>
