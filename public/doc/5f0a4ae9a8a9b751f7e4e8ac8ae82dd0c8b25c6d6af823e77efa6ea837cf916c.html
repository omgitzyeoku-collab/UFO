  <p>This is the cover page of a CIA internal history covering the U-2 and OXCART (A-12) high-altitude reconnaissance aircraft programs from 1954 to 1974. It was classified SECRET NOFORN and authored by Donald E. Welzenbach. Only the cover page is available in this release — no body text is present.</p>
  <div class="narr">This document is the cover page of a CIA History Staff publication titled &quot;The Central Intelligence Agency and Overhead Reconnaissance: The U-2 and OXCART Programs, 1954-1974.&quot; It was written by Donald E. Welzenbach and carried a classification of SECRET NOFORN, meaning it was restricted to US personnel only and not releasable to foreign nationals.

The U-2 and OXCART were high-altitude reconnaissance aircraft operated by the CIA during the Cold War. The U-2 flew at extreme altitudes to photograph denied territory; OXCART (also known as the A-12) was its faster, higher-flying successor. This document appears to be an internal agency history covering both programs across a twenty-year span.

Only the cover page of this document is present in the released image. No substantive body text, operational details, or findings are visible. The OCR rendering of the page is poor, with the author&#39;s name and program references partially garbled, though still identifiable.

A more redacted version of this same document has previously been available through the CIA&#39;s public website. The current release adds no new readable content beyond confirming the document&#39;s existence, title, author, and classification level.</div>
