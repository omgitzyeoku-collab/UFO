  <h1>Commercial Pilot Reports Unidentified Light Near Chicago at 37,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/01b1d5aa517ac77959029a33a53a04f578b39a045f9e6410668494c154084812.jpg" alt="Commercial Pilot Reports Unidentified Light Near Chicago at 37,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a Spirit Airlines pilot&#39;s sighting of an unidentified light while flying from Las Vegas to Detroit at 37,000 feet. The light appeared to climb, descend, and move laterally east of and below the aircraft near Chicago. The FAA closed the case with no explanation or identification.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00383. It records a sighting by the pilot of Spirit Airlines flight NKS2376, a commercial flight from Las Vegas (LAS) to Detroit (DTW), of an unidentified aerial phenomenon.

According to the report, the pilot observed what appeared to be a light to the east and below the aircraft while cruising at FL370 (37,000 feet). The aircraft&#39;s position at the time of the report was near Chicago O&#39;Hare, at the ORD220030 fix. The pilot described the light as appearing to climb and descend with right-to-left lateral movement. The controller at Chicago ARTCC Sector 81 was handling the flight at the time.

The pilot last reported seeing the light while over Lake Michigan on an eastbound heading toward Detroit. No corroborating radar data, sensor evidence, or reports from other pilots are referenced in the document.

The FAA marked the case as closed. No identification or resolution is noted — the phenomenon simply remains unexplained. The report is dated October 2024, though the metadata lists an incident year of 2023; the October 2024 date from the report text is considered more reliable.

Notably, no aircraft tail number is recorded, which is unusual for an FAA report. The level of redaction in the document is low.</div>
