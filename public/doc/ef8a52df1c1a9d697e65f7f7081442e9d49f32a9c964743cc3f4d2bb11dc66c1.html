  <h1>Delta crew reported multiple orbiting lights over Alabama in 2024</h1>
  <div class="meta">
    <span class="badge">FAA</span>

    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/ef8a52df1c1a9d697e65f7f7081442e9d49f32a9c964743cc3f4d2bb11dc66c1.jpg" alt="Delta crew reported multiple orbiting lights over Alabama in 2024 thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents a Delta Air Lines crew sighting multiple lights orbiting at various altitudes ahead of their aircraft near Huntsville, Alabama, on 14 February 2024. The lights were not detected on radar, and no evasive action was taken. No follow-up investigation results are included.</p>
  <div class="narr">This document is a preliminary information report from the FAA&#39;s Washington Operations Center — the agency&#39;s round-the-clock facility that logs aviation incidents nationwide. It records a UAP (Unidentified Aerial Phenomenon) sighting reported by a commercial airline flight crew.

On 14 February 2024 at approximately 3:30 a.m. Central time, the crew of Delta flight 757 — a Boeing 767-400 flying from Phoenix to Atlanta — observed multiple lights ahead of the aircraft. The lights appeared to be orbiting at various altitudes. The aircraft was cruising at 37,000 feet, roughly 50 nautical miles west of Huntsville, Alabama.

The crew did not take evasive action, indicating the lights were not perceived as an immediate collision threat. Notably, the UAP was not observed by radar, meaning only the flight crew&#39;s visual report exists as evidence.

The FAA filed this as a preliminary report. The document contains no conclusions about what the lights were, no follow-up investigation results, and no additional corroborating observations from other aircraft or ground stations. It is a record of a single crew&#39;s report, logged through standard FAA channels.</div>
