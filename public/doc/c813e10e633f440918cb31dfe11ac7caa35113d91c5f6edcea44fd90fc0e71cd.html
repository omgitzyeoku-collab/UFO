  <h1>FBI Ordered Field Offices to Investigate Flying Disc Reports in 1947</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c813e10e633f440918cb31dfe11ac7caa35113d91c5f6edcea44fd90fc0e71cd.jpg" alt="FBI Ordered Field Offices to Investigate Flying Disc Reports in 1947 thumbnail" loading="lazy" />
  <p>This is a collection of FBI internal memos, teletypes, and newspaper clippings from July–August 1947 documenting how the Bureau handled a wave of flying disc sighting reports across the United States. The reports range from a veteran pilot&#39;s sighting of ten round objects over California to a cardboard disc found at a Wisconsin fairground that was likely built by a teenager.</p>
  <div class="narr">In the summer of 1947, reports of flying discs flooded FBI field offices across the United States. On July 30, 1947, the Bureau issued Bulletin No. 42, formally directing all field offices to investigate these reports. This document — Part 01 of the FBI Vault&#39;s UFO file series — compiles the memos, teletypes, and correspondence that resulted from that directive.

The reports varied widely in credibility. Dick Rankin, a pilot with more than 7,000 hours of flying time and brother of the well-known aviator Tex Rankin, reported seeing ten round objects in formation over Bakersfield, California on June 23, 1947. He initially thought they were the Navy&#39;s XF5U-1 &quot;flying flapjack&quot; experimental aircraft, but the Navy confirmed only one was ever built and it had never left Connecticut. About two hours later, Rankin saw seven of the objects returning on a reverse course — three fewer than before. In Norfolk, Virginia, a 13-year-old schoolboy named Billy Turrentine photographed a large black object followed by two smaller objects trailing white mist on July 8, 1947, though the FBI noted the objects could have been large balloons. A Navy pilot reported seeing a mysterious object twice on the evening of August 6, 1947 while flying at 5,000 feet above Myrtle Creek, Oregon.

Not all the reports were unexplained. A 19-inch disc-shaped contraption found on the Jackson County fairgrounds near Black River Falls, Wisconsin on July 10, 1947 turned out to be made of cardboard coated in silver airplane dope, fitted with a small wooden tail rudder, an RCA photo-electric cell, and a small electric motor with a propeller. The FBI assessed it as probably made by a juvenile. The file also includes an unsolicited letter from a self-described academic in San Diego claiming the discs carried crews from an &quot;etheric planet&quot; on a peaceful mission — this was not an FBI finding or analysis, just correspondence the Bureau received.

J. Edgar Hoover personally signed a letter forwarding flying disc information to the War Department. Assistant Director D. M. Ladd was notified by telephone about the Wisconsin disc on July 11, 1947. Multiple names of military personnel and civilian informants are redacted throughout the documents.</div>
