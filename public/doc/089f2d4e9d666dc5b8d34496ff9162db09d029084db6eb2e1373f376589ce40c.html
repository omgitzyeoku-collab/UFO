  <h1>Commercial Pilot Reports Flashing Lights Above 39,000 Feet Over West Virginia</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/089f2d4e9d666dc5b8d34496ff9162db09d029084db6eb2e1373f376589ce40c.jpg" alt="Commercial Pilot Reports Flashing Lights Above 39,000 Feet Over West Virginia thumbnail" loading="lazy" />
  <p>This FAA incident report documents a commercial Air Canada flight (ACA1091) observing 3 to 5 flashing lights well above 39,000 feet while flying over West Virginia on 16 April 2023. Other aircraft in the area independently reported the same lights, but the FAA closed the case without identifying the phenomenon.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log sightings of unidentified aerial phenomena reported by pilots. It was filed under case number 237UAP00253.

On 16 April 2023, the crew of Air Canada flight ACA1091, a commercial aircraft flying northbound at flight level 390 (approximately 39,000 feet), reported seeing 3 to 5 flashing lights off the left side of the aircraft. The lights were described as being well above their altitude — meaning above 39,000 feet. The sighting occurred roughly 35 nautical miles south of Elkins, West Virginia. The flight was routing between Orlando (MCO) and Toronto (CYYZ).

The sighting was not limited to a single crew. The report notes that other aircraft in the area also reported the lights, though the identities of those aircraft are not listed in the document. A Mandatory Occurrence Report (MOR) was initiated under ID ZDC-M-2023/04/16-0001, indicating the Washington DC Air Route Traffic Control Center (ZDC) formally logged the event.

Despite the corroboration from multiple aircraft, the FAA marked the case as &quot;Closed&quot; without providing any resolution or identification of what the lights were. No radar data, sensor readings, or photographic evidence are referenced anywhere in the report — the entire record relies on pilot visual observation.</div>
