  <h1>Airline Crew Reports Multiple Lights Circling at 37,000 Feet Over Wisconsin</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b5e7d08348b9d24d08eb47991a3e6031c9470d5bac3eac95a012108d0cca51e1.jpg" alt="Airline Crew Reports Multiple Lights Circling at 37,000 Feet Over Wisconsin thumbnail" loading="lazy" />
  <p>An FAA incident notification records that the crew of a Boeing 767-300 cargo flight from Sacramento to Chicago-Rockford saw multiple lights moving and circling at or above 37,000 feet near Mauston, Wisconsin, on February 19, 2024. Air traffic control radar did not detect the objects.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — a preliminary report filed when something unusual is reported in US airspace. It is not a full investigation or a final conclusion. It records a single sighting by one flight crew.

On February 19, 2024, at 4:50 AM Central time, the crew of Air Transport 3498 — a Boeing 767-300 flying from Sacramento (SMF) to Chicago-Rockford (RFD) — reported seeing multiple lights moving and circling at or above flight level 370, roughly 37,000 feet. The pilot first observed the lights approximately 20 nautical miles east-northeast of the Mauston VOR navigation point in Wisconsin. Salt Lake City Air Route Traffic Control Center (ARTCC) relayed the report.

Notably, the objects were not detected on air traffic control radar. The document provides no description of the lights beyond their movement pattern — no shape, size, colour, or speed is recorded.

The FAA filed this as a UAP (unidentified anomalous phenomena) notification. There is no indication in the document of any follow-up investigation, explanation, or conclusion about what the crew observed.</div>
