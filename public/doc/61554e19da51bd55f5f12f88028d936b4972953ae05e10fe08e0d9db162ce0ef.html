  <h1>FAA Report: Multiple Aircraft Saw Burning Object Over Pennsylvania in 2021</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/61554e19da51bd55f5f12f88028d936b4972953ae05e10fe08e0d9db162ce0ef.jpg" alt="FAA Report: Multiple Aircraft Saw Burning Object Over Pennsylvania in 2021 thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a sighting on 4 December 2021 in which a Spirit Airlines A319 and multiple other aircraft reported what looked like burning space debris travelling eastbound over Pennsylvania. An off-duty pilot later suggested Starlink satellites or the International Space Station as possible explanations, but no official determination was recorded and the case was closed.</p>
  <div class="narr">On 4 December 2021 at 23:42 UTC, the crew of Spirit Airlines flight NKS713 — an Airbus A319 flying from LaGuardia (LGA) to Phoenix (PHX) — reported an unidentified aerial phenomenon while westbound at 18,000 feet, directly over the Broadway VOR (BWZ) navigation fix in Pennsylvania. The crew described the object as looking like space debris with burning flames entering the atmosphere from above and travelling eastbound. Multiple other aircraft in the area independently reported the same phenomenon.

Controllers checked and confirmed that no space debris re-entry was scheduled at the time. Separately, the Cleveland Air Route Traffic Control Centre (ZOB) received a phone call from an off-duty pilot at home in Carroll County who reported seeing a long white object moving west to east near the Pittsburgh area. That pilot later called back and said he believed the object was Starlink satellites. Other reports noted the International Space Station was crossing the sky at roughly the same time, possibly reflecting light.

The FAA closed the case with no further action. No radar data or imagery is referenced in the report, and no official explanation was adopted. The Starlink and ISS suggestions came from a single off-duty pilot and general public reports — they were not confirmed by any formal analysis. The initial description of burning flames entering the atmosphere does not obviously match the typical appearance of Starlink satellites, though the document does not address this discrepancy.</div>
