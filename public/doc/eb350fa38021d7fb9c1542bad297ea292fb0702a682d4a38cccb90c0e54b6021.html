  <h1>Delta Crew Reports Large Balloon at 50,000 Feet Over Missouri</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/eb350fa38021d7fb9c1542bad297ea292fb0702a682d4a38cccb90c0e54b6021.jpg" alt="Delta Crew Reports Large Balloon at 50,000 Feet Over Missouri thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Delta Air Lines crew observing a large balloon while flying at 31,000 feet near St. Joseph, Missouri on 3 February 2023. The object was estimated at approximately 50,000 feet or above and was classified as an Unidentified Aerial Phenomenon. The case is closed.</p>
  <div class="narr">On 3 February 2023, the crew of Delta Air Lines flight DAL1276 — an Airbus A321 flying from Dallas/Fort Worth (DFW) to Minneapolis-St. Paul (MSP) — reported seeing a large balloon off the left side of the aircraft. The plane was heading north at 31,000 feet, approximately 13 nautical miles northwest of St. Joseph, Missouri (STJ), within the airspace managed by Kansas City Center (ZKC).

The crew estimated the balloon was at roughly 50,000 feet or above — well above their own cruising altitude and near the upper limit of controlled airspace. Despite the crew describing the object as a &quot;large balloon,&quot; the FAA classified the incident under its primary code for Unidentified Aerial Phenomenon, meaning the object was not positively identified.

The timing is notable: 3 February 2023 falls within the period when multiple high-altitude balloon sightings were reported across the United States, including the widely publicised Chinese surveillance balloon incident. This report does not state any connection to those events, but the date and description are consistent with the broader pattern of reports from that period.

The FAA case is now closed. The document is a short administrative record — a SKYWATCH incident report — rather than a detailed investigation. There is no mention of radar data, photographs, or follow-up analysis. No crew members are named, and no aircraft tail number was recorded.</div>
