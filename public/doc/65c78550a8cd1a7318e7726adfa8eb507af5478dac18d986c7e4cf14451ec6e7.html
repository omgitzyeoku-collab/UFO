  <h1>Breeze Airways Pilot Reported Red Lights Below Aircraft Over South Carolina</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/65c78550a8cd1a7318e7726adfa8eb507af5478dac18d986c7e4cf14451ec6e7.jpg" alt="Breeze Airways Pilot Reported Red Lights Below Aircraft Over South Carolina thumbnail" loading="lazy" />
  <p>This FAA Washington Operations Center report documents a January 2024 incident in which a Breeze Airways pilot flying at 37,000 feet near Orangeburg, South Carolina, reported seeing red lights below the aircraft. The crew took no evasive action, no law enforcement was notified, and the report contains no follow-up investigation or explanation of what was observed.</p>
  <div class="narr">On 20 January 2024 at approximately 9:45 PM Eastern, the crew of Breeze Airways flight 505 — a Bombardier BCS3 operating from Sarasota to Hartford — reported an unidentified aerial phenomenon while flying northbound at 37,000 feet near Orangeburg, South Carolina. The phenomenon was described only as red lights observed below the aircraft.

The sighting was reported through Jacksonville Air Route Traffic Control Center (ARTCC), the FAA facility responsible for that airspace. The coordinates recorded in the report (33.506330, -80.855648) place the sighting over rural South Carolina, consistent with the Orangeburg area.

The crew took no evasive action in response to the sighting, and no law enforcement notification was made. The document is a preliminary operations center summary rather than a full investigation report.

No additional details about the object&#39;s size, shape, speed, or movement appear in the record. There is no indication of corroborating radar data or reports from other aircraft. The FAA document does not offer any conclusion about what the lights were.</div>
