  <h1>CIA-UAP-005, German Scientist&#39;s Article on &#39;Flying Discs&#39;</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1950</span>
    
    
  </div>
  
  <p>This 1950 CIA Information Report from Chile discusses a German scientist&#39;s article theorizing that &quot;Flying Discs&quot; could be explained as a new type of aircraft based on aerodynamic principles developed in German research facilities during and after WWI, using rotating cylinders or gas-turbines to create lift through boundary layer manipulation, rather than conventional wings. A redacted version of this report has been available on CIA&#39;s public website.</p>
