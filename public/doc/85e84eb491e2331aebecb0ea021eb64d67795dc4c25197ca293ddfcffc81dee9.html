  <h1>CIA Forwarded a German Scientist&#39;s Theory on Flying Discs in 1950</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1950</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/85e84eb491e2331aebecb0ea021eb64d67795dc4c25197ca293ddfcffc81dee9.jpg" alt="CIA Forwarded a German Scientist&#39;s Theory on Flying Discs in 1950 thumbnail" loading="lazy" />
  <p>In July 1950, the CIA circulated a translated article by a German scientist proposing an aerodynamic explanation for &#39;Flying Discs.&#39; The CIA explicitly marked the report as unevaluated information and made no judgment on its accuracy.</p>
  <div class="narr">On 31 July 1950, the Central Intelligence Agency distributed Report No. SO DD-2743 — a one-page cover sheet forwarding a translated article by a German scientist. The article, titled &#39;The Mystery of the Flying Discs, a contribution to its possible explanation,&#39; had been submitted for publication in Condor, a German-language magazine published in Chile. The information was acquired in Santiago, Chile, and dated to prior to mid-1950.

The article proposed that Flying Discs could be explained through aerodynamic principles. However, only the CIA&#39;s cover sheet survives in the extracted text — the attached translation of the scientist&#39;s full article is not included, so the details of the theory are unavailable from this document alone.

The CIA stamped the report &#39;THIS IS UNEVALUATED INFORMATION,&#39; meaning the agency passed along the article without assessing whether its claims were accurate. The source was classified as documentary. The country subject line lists both Chile and Germany, reflecting the article&#39;s origin and the scientist&#39;s nationality.

Moderate redaction is present in the classification markings and portions of the cover sheet. The scientist&#39;s name is garbled in the OCR text, making positive identification difficult.</div>
