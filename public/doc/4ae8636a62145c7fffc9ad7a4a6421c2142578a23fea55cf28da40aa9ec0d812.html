  <h1>United Airlines crew reported small red-blue object near Denver</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/4ae8636a62145c7fffc9ad7a4a6421c2142578a23fea55cf28da40aa9ec0d812.jpg" alt="United Airlines crew reported small red-blue object near Denver thumbnail" loading="lazy" />
  <p>An FAA incident report documents that the crew of United Airlines Flight 1835, an Airbus A319 flying from Denver to Knoxville, reported seeing a small red and blue unidentified object below their aircraft at 11,000 feet on June 15, 2024. The object was not picked up on air traffic control radar, and no evasive action was taken.</p>
  <div class="narr">This document is an incident report from the FAA&#39;s Washington Operations Center, relayed through Denver TRACON (Terminal Radar Approach Control, the facility that manages air traffic around Denver). It records a sighting reported by the crew of United Airlines Flight 1835, an Airbus A319 operating from Denver (DEN) to Knoxville (TYS) on June 15, 2024.

While flying southbound at 11,000 feet, approximately 10 miles south of Denver, the crew reported seeing a 4-foot red and blue unidentified anomalous phenomenon (UAP) below their aircraft. The crew did not take evasive action.

Air traffic control checked their radar and did not detect the object. The report contains a typo in the original text (&#39;OBERSVED&#39; instead of &#39;observed&#39;), suggesting this is a raw, preliminary report rather than a reviewed final document.

The FAA report does not offer any explanation or identification of the object. It simply records what the crew reported and notes the absence of radar confirmation. No additional investigation or follow-up is documented in this record.</div>
