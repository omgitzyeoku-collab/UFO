  <h1>USG-UAP-D001, Congressional, White House, UFO-related Constituent Correspondence, 1998</h1>
  <div class="meta">
    <span class="badge">U.S. Government</span>
    <span class="badge">1998</span>
    
    
  </div>
  <img class="thumb" src="/extract/thumbs/3393d62c92d9a5ad76155535caddf39cf9e76f5f19716ebfc851ba2b86b0ae3a.jpg" alt="USG-UAP-D001, Congressional, White House, UFO-related Constituent Correspondence, 1998 thumbnail" loading="lazy" />
  <p>This collection of documents, primarily from 1998, contains draft and final correspondence from the White House and the offices of members of Congress responding to constituent inquiries about Unidentified Flying Objects, or “UFOs.” These inquiries cover a diverse range of topics, including alleged UFO sightings by NASA astronauts, questions regarding the authenticity of photos collected during U.S. missions to Mars, alleged improper withholding of information by the U.S. Government, questions regarding the appropriateness of “UFO-related” governmental spending, and calls for congressional hearings regarding the nature and existence of “UFOs.” The official responses consistently state that, circa 1998, the U.S. Government is not aware of evidence supporting the existence of extraterrestrial technology, and that NASA does not actively investigate “UFOs.” The collection includes references to materials of both confirmed and unconfirmed authenticity, as provided by constituents, as well as references to historical, scientific literature addressing specific “UFO” sighting claims.</p>
