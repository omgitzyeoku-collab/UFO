  <h1>1998 Letters Show How Congress and NASA Handled UFO Inquiries</h1>
  <div class="meta">
    <span class="badge">U.S. Government</span>
    <span class="badge">1998</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3393d62c92d9a5ad76155535caddf39cf9e76f5f19716ebfc851ba2b86b0ae3a.jpg" alt="1998 Letters Show How Congress and NASA Handled UFO Inquiries thumbnail" loading="lazy" />
  <p>This document is a collection of 1998 correspondence between U.S. senators, the White House, and NASA responding to constituents who asked about UFOs and astronaut sightings. NASA&#39;s official position was that it had no UFO investigation program and had not withheld information, and it enclosed a 1976 magazine article by researcher James Oberg that offered mundane explanations for famous astronaut sighting claims.</p>
  <div class="narr">In 1998, Senator Snowe of Maine and Senator Grassley each forwarded constituent letters to the White House and NASA asking about UFOs — one about Mars-related claims, the other requesting information on UFO sightings by astronauts. The correspondence was processed through the White House&#39;s tracking system under action IDs L11998-00407 and L/1998-00729, and filed under the classification &quot;1320.4 Aeronautics:UFO.&quot;

NASA&#39;s response, signed by Edward Heffernan, Associate Administrator for Legislative Affairs, stated plainly that NASA had no program for investigating UFOs and had not withheld information on sightings. The agency noted that the Air Force had previously received and investigated UFO reports for many years but had discontinued that activity. According to NASA, most objects seen by astronauts during orbital missions were later identified through photographs or NORAD records as launch vehicle material, spacecraft debris, or water droplets. NASA also stated that no unidentified materials were observed during any Apollo lunar missions.

Enclosed with the response was a 1976 article from SEARCH magazine by space researcher James Oberg, which examined several famous astronaut UFO claims case by case. Oberg concluded that astronaut Jim McDivitt&#39;s sighting during the June 1965 Gemini-4 mission was likely the spacecraft&#39;s own Titan booster rocket — an identification missed at the time because NASA had asked NORAD to check for other satellites nearby but never asked about Gemini-4&#39;s own associated debris. Oberg also noted that McDivitt&#39;s eyes were red and teary during the sighting due to a cabin atmosphere reaction and a urine spill. A widely circulated photograph from Gemini-7 supposedly showing a UFO with a &quot;force field&quot; was identified in the article as a deliberate forgery — a retouched image of the spacecraft&#39;s own roll control thrusters. The Apollo-12 &quot;sighting&quot; was explained as a joke by astronaut Pete Conrad about the large SLA panels visible after launch, which Conrad himself confirmed in a 1976 letter to Oberg.

The constituent names throughout the correspondence are redacted under FOIA exemptions (b)(5) and (b)(6), so the original inquiries cannot be verified. The document is moderate in its level of redaction — the government responses and the enclosed article are largely readable, but the identities of the people who prompted them are blacked out.</div>
