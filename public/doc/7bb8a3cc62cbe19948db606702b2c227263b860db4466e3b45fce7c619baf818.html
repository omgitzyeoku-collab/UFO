  <h1>Military Infrared Video Shows Unidentified Object Over CENTCOM Region</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2022</span>
    <span class="badge">CENTCOM</span>
    <span class="badge">verified</span>
  </div>
  
  <p>This 21-second infrared video, catalogued as DOW-UAP-PR053, was likely captured by a U.S. military sensor in the Central Command area of responsibility in October 2022. The video was digitally altered before being uploaded to a classified network in June 2024, and it shows an unidentified object — described by the uploader as cigar-shaped or fast spherical — moving across the sensor&#39;s field of view.</p>
  <div class="narr">In October 2022, a U.S. military platform operating in the CENTCOM (United States Central Command) area of responsibility recorded a 21-second infrared video clip. The footage shows an area of contrast — an object distinguishable from its background — transiting the sensor&#39;s field of view from left to right over roughly three seconds. The uploader described it as a &quot;cigar-shaped or fast spherical&quot; unidentified aerial phenomenon (UAP), though that description reflects the uploader&#39;s own characterisation, not an official assessment.

The video was uploaded to a classified network in June 2024 — nearly two years after the incident. Notably, the Department of War&#39;s All-domain Anomaly Resolution Office (AARO) states the video was digitally altered prior to upload. The nature and extent of that alteration are not specified. AARO presents the footage &quot;as received&quot; and uses hedging language, assessing that the video &quot;likely&quot; came from an infrared military sensor rather than stating it with certainty.

This clip is one of 51 potentially UAP-related records that eight members of the U.S. House of Representatives requested access to on 6 March 2026. The records were allegedly held by the Department of War and the Intelligence Community. AARO notes that many of the responsive materials lack a substantiated chain of custody, meaning their authenticity cannot be independently verified.

The video&#39;s metadata appears truncated, suggesting incomplete information or possible redaction. No additional context — such as the specific platform, crew observations, or follow-up investigation results — is provided in the released material.</div>
