  <h1>FAA Report: Pilot Saw Three Lights Making Impossible Movements at 45,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9fec8626237b184e63599ad8b7b31c6c01a55e21f65e6ae0a4d60a599affd15f.jpg" alt="FAA Report: Pilot Saw Three Lights Making Impossible Movements at 45,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a commercial cargo pilot&#39;s observation of three white lights at approximately 45,000 feet near Victoria, Texas on 17 May 2023. The lights repeatedly travelled westbound for 3–5 seconds then instantly snapped back to their starting point. The FAA closed the case with no explanation provided.</p>
  <div class="narr">On 17 May 2023, the crew of a commercial Boeing 767 flying under callsign CJT906 reported an unidentified aerial phenomenon to Houston Air Route Traffic Control Center. The aircraft was on a cargo route from Guadalajara, Mexico (MMGL) to Cincinnati (CVG), flying northeast at FL390 — roughly 39,000 feet.

About 5 nautical miles north of the Victoria VOR (a navigation point in Texas), the crew observed three white lights to their left, travelling westbound at approximately FL450 (45,000 feet) — around 6,000 feet above them. The lights exhibited a striking repetitive behaviour: they would move west for 3 to 5 seconds, then immediately return to their starting point, over and over.

The FAA filed the observation as a SKYWATCH Incident Report under its &quot;Unidentified Aerial Phenomenon&quot; category. The case is marked as closed, but the document provides no resolution, identification, or follow-up explanation for what the crew saw.

No radar data or additional witness accounts appear in this report. The altitude of the lights is described as approximate, meaning it was a visual estimate from the cockpit rather than an instrument reading. The observation was made from a moving aircraft, likely at night or in early-morning darkness given the route and timing.</div>
