  <h1>FAA Report: Pilot Spotted Large Balloon at 50,000 Feet in February 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/8ccc4aac0a29041727a1b1c99da435b75caa230d65e0d90ddc2f2ff68b565a95.jpg" alt="FAA Report: Pilot Spotted Large Balloon at 50,000 Feet in February 2023 thumbnail" loading="lazy" />
  <p>This is a closed FAA incident report from 3 February 2023 in which a commercial flight crew (callsign MXY242) reported seeing a large balloon at approximately 50,000 feet while flying westbound from Syracuse to Las Vegas. The sighting occurred during the same period as the widely reported Chinese surveillance balloon incidents over the United States.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00169. It records a pilot sighting classified as an &quot;Unidentified Aerial Phenomenon.&quot; The case is now closed.

On 3 February 2023, the crew of a commercial aircraft with callsign MXY242, flying westbound at 36,000 feet on a route from Syracuse (SYR) to Las Vegas (LAS), reported a large balloon off the right side of the aircraft. The balloon was observed approximately 15 nautical miles north of the BQS navigation point, and the crew estimated it was at roughly 50,000 feet (FL500) or above.

The report notes that no one was paged in response to the sighting, and the case status is listed as closed. The document does not include any radar data, photographs, or other corroborating evidence beyond the crew&#39;s visual observation.

The timing is notable: this sighting took place in early February 2023, the same period when the US military tracked and ultimately shot down a Chinese surveillance balloon and several other high-altitude objects over North America. Whether this object was related to those incidents is not addressed in the report.

Several fields in the report are blank, including the operator name and aircraft tail number, which limits the ability to independently verify details of the flight.</div>
