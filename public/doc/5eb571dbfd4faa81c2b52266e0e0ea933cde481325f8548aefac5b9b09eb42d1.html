  <h1>Pentagon Office Cannot Explain 40 Percent of Orb Sightings Near Security Site</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2023</span>
    <span class="badge">Western United States</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5eb571dbfd4faa81c2b52266e0e0ea933cde481325f8548aefac5b9b09eb42d1.jpg" alt="Pentagon Office Cannot Explain 40 Percent of Orb Sightings Near Security Site thumbnail" loading="lazy" />
  <p>A June 2026 memorandum from the All-domain Anomaly Resolution Office (AARO) summarises its ongoing investigation into orange and red &quot;orbs&quot; observed by federal agents near a sensitive site in the western United States in October 2023. AARO attributes roughly 60 percent of the activity to military flares but says 40 percent remains unexplained, with no instrument data collected during the incident.</p>
  <div class="narr">In October 2023, over two days at approximately dusk, six federal law enforcement agents working in three teams of two observed unusual aerial phenomena near a sensitive national security site in the western United States. They described luminous orange &quot;mother orbs&quot; that appeared for one to two seconds before releasing clusters of two to four smaller red &quot;orbs&quot; and then vanishing. The phenomena were silent. At least one red orb reportedly remained stationary above a ridgeline for several hours.

The agents did not capture any video, photographs, or instrument data during the incident. The entire case rests on their spoken and written testimony. AARO confirmed that U.S. military aircraft were operating in the area and actively deploying infrared countermeasure flares as part of a standard exercise. The agency concluded that roughly 60 percent of the reported activity is plausibly explained by those flares. The witnesses stated the phenomena did not resemble military flares, but AARO notes the specific flare types used differ from the standard illumination flares the agents may have been familiar with.

For the remaining 40 percent of observations, radar and ADS-B tracking data showed no known aircraft within the observers&#39; estimated line of sight. AARO also noted that a red orb hovering for several hours is physically incompatible with the burn time and descent rate of any known military flare. The agency ruled out foreign intelligence activity, saying the reported behaviour diverges significantly from known adversary systems. It also ruled out misidentified aircraft exhaust, since the aircraft were flying too high for exhaust to appear as orange orbs. Weather was clear, making atmospheric anomalies unlikely.

AARO conducted what it calls a Blue Force deconfliction review — checking whether classified U.S. military technology could account for the sightings. It found that while certain characteristics align with some U.S. technologies, historical records are inconclusive on whether those technologies were present at the time and place. As of June 2026, the case remains open. AARO says it intends to apply scientific modelling and multispectral data analysis to continue the investigation. The document, dated 5 June 2026, is unclassified and shows low signs of redaction.</div>
