  <p>This FAA SKYWATCH incident report documents a general aviation pilot&#39;s sighting of an unidentified bright light above their aircraft while flying at 45,000 feet near Bimini on 9 November 2020. The case was closed with no identification or resolution noted.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under record number 237UAP00042. It records a UFO sighting reported by a general aviation pilot on 9 November 2020. The aircraft, flying from Houston Intercontinental Airport (IAH) to Piarco International Airport in Trinidad (TTPP), was at flight level 450 — roughly 45,000 feet — and heading southeast near the ZBV navigational point at Bimini when the pilot-in-command reported an unidentified object above them.

The pilot described the object as a light &quot;brighter than any star they had ever seen.&quot; No evasive action was taken. Miami Center (ZMA), the FAA facility handling the aircraft, forwarded the report to the UFO Reporting Center.

The report was categorised under the primary code &quot;OTHER&quot; and its status is listed as closed. No resolution, identification, or follow-up findings are recorded in the document. There is no mention of corroborating radar data, sensor records, or additional witnesses.

One notable discrepancy: the incident occurred in November 2020, but the record carries a 2023 designation in its metadata, suggesting it was catalogued or released well after the event took place.</div>
