  <h1>Commercial Pilot Reports Bright Erratic Object Over Pacific Near LA</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/22f1c7e81ae1a1f5cdb648b731b169721faec221857da41da98116e436503854.jpg" alt="Commercial Pilot Reports Bright Erratic Object Over Pacific Near LA thumbnail" loading="lazy" />
  <p>This is an FAA incident report documenting a sighting by a commercial aircraft crew on 18 November 2023. A Boeing 767-200 flying at 39,000 feet about 110 nautical miles southwest of Los Angeles observed a bright white, erratically moving object at roughly 45,000 feet or above, heading southeast. Air traffic control radar did not detect the object, and the case was closed without identification.</p>
  <div class="narr">On 18 November 2023, the crew of a commercial Boeing 767-200 filed what the FAA calls a SKYWATCH Incident Report — the agency&#39;s standard form for unidentified aerial phenomenon sightings. The aircraft, operating under callsign OAE1169 on a flight from Honolulu to Fort Worth, was cruising eastbound at flight level 390 (39,000 feet) when the crew spotted something off the right side of the aircraft.

The object was described as bright white and moving erratically, travelling southeast at approximately flight level 450 and above — meaning 45,000 feet or higher. That would place it well above the reporting aircraft&#39;s own altitude and above the ceiling of most conventional commercial traffic.

Air traffic control radar did not pick up the object. This is a significant detail: it means there is no independent sensor data to corroborate the visual sighting. The report rests entirely on the crew&#39;s observation.

The FAA classified the primary code as &quot;Unidentified Aerial Phenomenon&quot; and subsequently closed the case. No resolution or identification of the object is noted in the document. The report shows minimal redaction, and the key facts — location, altitude, description, and radar status — are clearly stated.

The aircraft&#39;s position at the time was roughly 110 nautical miles southwest of LAX (Los Angeles International Airport), placing it over the Pacific Ocean.</div>
