  <h1>Pentagon Office Explains How Optical Illusions Fool UAP Observers</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d2512d1c6710569d9324f546a089ec4074a209fcbb91af2053069be627a1a059.jpg" alt="Pentagon Office Explains How Optical Illusions Fool UAP Observers thumbnail" loading="lazy" />
  <p>This May 2024 information paper from the All-domain Anomaly Resolution Office (AARO) explains how two common optical phenomena — forced perspective and parallax — can cause observers and sensors to misjudge the size, speed, and movement of unidentified anomalous phenomena (UAP). It is an educational document, not an investigation of any specific incident.</p>
  <div class="narr">In May 2024, the Pentagon&#39;s All-domain Anomaly Resolution Office (AARO) published an information paper explaining how two well-known optical effects — forced perspective and parallax — can lead people to misidentify what they&#39;re seeing in the sky. The paper was reviewed by AARO&#39;s Chief of Staff on 6 February 2025 under the FY24 National Defense Authorization Act (Section 1841) and released in full with no redactions. It carries the case number 330UAP000016.

Forced perspective is the effect that makes objects appear larger or smaller than they are depending on their distance from the viewer — the paper uses the example of trick photographs where tourists appear to hold up the Leaning Tower of Pisa (noted as approximately 190 feet tall). Parallax is the apparent shift in an object&#39;s position when viewed from different angles. AARO states that these effects &quot;frequently explain excessively large sizes or high speeds described in UAP reports.&quot;

The paper emphasises that electronic sensors on airborne platforms are also susceptible to these illusions, not just the human eye. When a fast-moving sensor platform passes a distant object, parallax can make stationary objects appear to move, and slow-moving objects appear to travel at high speed. Data from a single sensor moving fast relative to a target is particularly vulnerable to these distortions.

AARO is careful to note that no single explanation covers all UAP cases, and that not all reports of fast-moving UAP are caused by these optical effects. The office also states that single-observer reports, despite their susceptibility to these phenomena, remain critical to its analyses. The paper uses only hypothetical examples — such as a 10-foot featureless sphere — and cites no specific UAP cases or real sensor data.</div>
