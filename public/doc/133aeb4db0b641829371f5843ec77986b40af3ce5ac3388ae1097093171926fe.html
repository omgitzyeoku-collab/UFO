  <h1>Pentagon Office Briefing Outlines Its Mission to Track Unidentified Phenomena</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/133aeb4db0b641829371f5843ec77986b40af3ce5ac3388ae1097093171926fe.jpg" alt="Pentagon Office Briefing Outlines Its Mission to Track Unidentified Phenomena thumbnail" loading="lazy" />
  <p>This is an unclassified briefing deck from the All-Domain Anomaly Resolution Office (AARO), the Pentagon&#39;s dedicated UAP unit, presented by its director Dr. Seán Kirkpatrick. It explains AARO&#39;s mission, calls for better reporting from military and civilian aviators, and flags national security concerns about unidentified phenomena near US military sites — but discusses no specific incidents or evidence.</p>
  <div class="narr">In early 2023, Dr. Seán Kirkpatrick, director of the All-Domain Anomaly Resolution Office (AARO), prepared a briefing deck explaining what his office does and why it exists. AARO sits under the US Department of Defense and the Office of the Director of National Intelligence. Its job is to detect, track, and resolve what the government calls unidentified anomalous phenomena — unexplained observations in the air, at sea, in space, or crossing between those domains. The document was cleared for public release on 4 January 2023.

The briefing makes clear that most Defence Department UAP sightings occur near US military facilities and operating areas. It warns that UAP near strategic capabilities could threaten deterrence and civil safety, and notes a separate concern: that adversaries might wrongly blame unexplained phenomena on the United States. Key partners listed include the Department of Justice, NASA, the FAA, the Department of Energy, and the nuclear security agency NNSA.

A recurring theme is the reporting problem. The briefing states that historical reluctance to report UAP has limited the government&#39;s ability to address aerial safety and security threats. It credits recent efforts to encourage military aviators to come forward with substantially increasing both the quantity and quality of UAP data. AARO says it is working with military, civil, and industry partners to build better reporting channels.

Notably, the document contains no specific UAP cases, no photographic or sensor evidence, and no conclusions about what any particular sighting was. It is an organisational overview — a pitch for cooperation and data sharing, not an intelligence assessment.</div>
