  <h1>Commercial Airline Crew Reported UFO Over Gulf of Mexico in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/47ad5245023ebca3bb979ca1674abfaf6707fab7ffa02de70003c9be8d1289f1.jpg" alt="Commercial Airline Crew Reported UFO Over Gulf of Mexico in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident notification records a UFO sighting by the crew of a Boeing 767-300 flying at 41,000 feet over the Gulf of Mexico on October 24, 2023. The crew reported an unidentified object 2,000 feet below their aircraft; no evasive action was taken and no further investigation is documented here.</p>
  <div class="narr">On October 24, 2023, the crew of Air Transport 3331 — a Boeing 767-300 flying eastbound at Flight Level 410 (approximately 41,000 feet) — reported an unidentified flying object roughly 2,000 feet below their aircraft. The sighting occurred over the Gulf of Mexico, at coordinates placing it well offshore, approximately 115 nautical miles west of St. Petersburg-Clearwater International Airport in Florida.

The report was relayed through Miami ARTCC (Air Route Traffic Control Center), the FAA facility responsible for that airspace. The FAA&#39;s Washington Operations Center logged the incident as a standard UAP notification.

According to the document, no evasive action was taken by the aircraft, and law enforcement notification was deemed not required. The record contains no description of the object&#39;s shape, size, colour, or behaviour beyond its position relative to the aircraft.

This document is a preliminary notification — essentially a log entry — not a full investigation report. It does not include any conclusions about what the object was, nor does it reference radar data or other sensor evidence that might corroborate the crew&#39;s visual report.</div>
