  <h1>Sheriff Reports Line of Flashing Lights Over Michigan to FAA</h1>

  <p>This FAA notification documents a February 2023 report from the Cass County Sheriff Department describing 10 to 15 flashing lights in a straight line moving northbound over Dowagiac, Michigan. No aircraft reported the incident, and the document is a preliminary relay — not a completed investigation.</p>
  <div class="narr">On the evening of 12 February 2023, the Cass County Sheriff Department contacted the FAA&#39;s Central Region Operations Center (C-ROC) to report a UAP sighting near Dowagiac, Michigan. The location was close to the intersection of US Route 12 and US Route 60.

According to the report, witnesses observed a straight line of 10 to 15 flashing lights passing northbound over Cass County at approximately 7:53 PM Eastern time. No aircraft in the area reported the incident, meaning there was no pilot or radar confirmation of the objects.

The FAA relayed the report and notified South Bend TRACON — a regional air traffic control facility responsible for the surrounding airspace. The document itself is a standard FAA Washington Operations Center incident notification, not an investigative report or analysis.

The FAA did not identify the objects or draw any conclusions in this document. There is no indication that a follow-up investigation was conducted, and the record contains minimal redaction.</div>
