  <h1>Pentagon Clears AARO Record for Partial Public Release</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/84a448efdd9b635038d1856dd762ea06f8c08fd5a6c031e26cf03c79917bd651.jpg" alt="Pentagon Clears AARO Record for Partial Public Release thumbnail" loading="lazy" />
  <p>This document is a cover sheet from the Department of Defense&#39;s prepublication review office, confirming that an All-Domain Anomaly Resolution Office (AARO) record — Case Number 330UAP000006 — was cleared for partial public release on March 25, 2024. The underlying substantive content is not included; only the clearance pages are present.</p>
  <div class="narr">This record consists of two cover pages from the Department of Defense Office of Prepublication and Security Review. The pages confirm that a document associated with AARO — the Pentagon office responsible for investigating unidentified anomalous phenomena — was reviewed and cleared for open publication on March 25, 2024. The case is numbered 330UAP000006.

The document was released only in part, with portions withheld under authority of 44 U.S.C. 2107 § 1843(a)(3), a provision from the FY24 National Defense Authorization Act governing UAP-related records. The page itself was determined to be unclassified by the Chief of Staff of AARO, acting under FY24 NDAA Section 1841(a)(1)(C).

The file name — 06_SAPCO_CAPCO_MFR — suggests the underlying document may be a Memorandum for Record related to Special Access Program security classification matters, but the actual memo content is absent from what was released. Two different review dates appear in the document (February 5, 2025 and February 14, 2025), indicating it went through multiple rounds of review before publication.

In practical terms, this release tells us that the Pentagon reviewed a UAP-related record, decided parts of it could be made public, and withheld the rest. What was withheld and why remains unknown from this document alone.</div>
