  <h1>Delta Airlines Crew Reports Unidentified Object Over Idaho at 36,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bcbd291c14e46573fc6681f11fb7260ae9424c64d66c865ba41725cc4ee65c76.jpg" alt="Delta Airlines Crew Reports Unidentified Object Over Idaho at 36,000 Feet thumbnail" loading="lazy" />
  <p>This FAA Washington Operations Center notification documents a UAP sighting reported by the crew of Delta Air Lines flight 1480 while flying westbound at 36,000 feet near Pocatello, Idaho. The crew observed an unidentified anomalous phenomenon on the right side of the aircraft; no evasive action was taken and the document contains no description of what the object looked like.</p>
  <div class="narr">This document is an incident notification from the FAA&#39;s Washington Operations Center — essentially a log entry recording that something unusual was reported during a commercial flight. It is not an investigation report or a case conclusion, just an initial record that a sighting occurred.

The crew of Delta Air Lines flight 1480, travelling from Dallas/Fort Worth to Seattle, reported observing an unidentified anomalous phenomenon (UAP) from the right side of their aircraft. The flight was at flight level 360 — roughly 36,000 feet — heading westbound, approximately 18 nautical miles east of Pocatello, Idaho. Salt Lake City Air Route Traffic Control Center (ARTCC) was advised of the report.

The crew took no evasive action, and the document notes that law enforcement notification was not required. Coordinates logged in the record (approximately 42.91°N, 112.60°W) are consistent with the area east of Pocatello.

Notably, the document includes no description of the object&#39;s shape, size, movement, colour, or behaviour. It records that something was seen, but not what it looked like. There is no mention of radar corroboration or any other sensor data backing up the visual sighting. A minor formatting issue in the original document lists the longitude value in a second latitude field.</div>
