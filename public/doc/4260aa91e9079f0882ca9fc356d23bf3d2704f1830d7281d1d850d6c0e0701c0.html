  <h1>Pilot Reports Flashing Lights Over Kansas at 28,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/4260aa91e9079f0882ca9fc356d23bf3d2704f1830d7281d1d850d6c0e0701c0.jpg" alt="Pilot Reports Flashing Lights Over Kansas at 28,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident notification records a pilot&#39;s report of an unidentified aerial phenomenon with white and red flashing lights, observed on 9 February 2023 near Chanute, Kansas. The document is a preliminary report only — no investigation or explanation is included.</p>
  <div class="narr">On the evening of 9 February 2023, at approximately 9:13 PM Central time, the pilot of a Raytheon King Air 350 (registration N378BG) reported seeing an unidentified aerial phenomenon while cruising at around 28,000 feet. The aircraft was heading northwest, roughly 15 nautical miles south of Chanute, Kansas.

The pilot described an object displaying white and red flashing lights, visible from the 9 o&#39;clock position — the left side of the aircraft. Kansas City Air Route Traffic Control Center (ARTCC) received and relayed the report to the FAA&#39;s Washington Operations Center, which logged it as incident 237UAP00456.

No injuries were reported, and no law enforcement was notified. The document is a standard FAA Operations Center notification — essentially a log entry recording that the event was reported. It contains no follow-up investigation, no radar data, and no conclusion about what the pilot saw.

The coordinates place the sighting in southeast Kansas. The aircraft was on a route from BBG to FNL. Beyond these basic details, the document offers no further analysis or resolution.</div>
