  <h1>Two Airline Crews Reported a UFO at 80,000 Feet in 2007</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f071f32d359f9051b021b70c962aa6a0c000b703e1372af68e257c6d7bebe52a.jpg" alt="Two Airline Crews Reported a UFO at 80,000 Feet in 2007 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from May 2007 in which two separate commercial airline crews — American Airlines 576 and Southwest Airlines 385 — independently reported an unidentified object within three minutes of each other. The object was located near the Maverick navigational fix at a reported altitude of possibly 80,000 feet, far above any known aircraft&#39;s ceiling. The case was marked closed with no follow-up notes included.</p>
  <div class="narr">On 13 May 2007, the FAA&#39;s Fort Worth Center (ZFW) logged a SKYWATCH incident report after two commercial flights independently reported an unidentified flying object. American Airlines flight 576, an MD-82 flying from Dallas/Fort Worth to St. Louis, reported the object at 16:29 UTC. Three minutes later, Southwest Airlines flight 385, a Boeing 737 en route from Tulsa to Houston, made a separate report at 16:32 UTC.

The object was observed off the Maverick navigational fix at a bearing of 012 degrees and 65 nautical miles. The crews reported it at possibly FL800 — aviation shorthand for flight level 800, or roughly 80,000 feet. That altitude is well above the operational ceiling of any known conventional aircraft, commercial or military. The report uses the word &quot;possibly,&quot; indicating the altitude was an estimate rather than a confirmed measurement.

The incident was processed through the Denver Point of Distribution and assigned the primary code &quot;OTHER.&quot; The report&#39;s status is marked closed. No follow-up investigation notes, radar data, or sensor records are included in the document — it is a single-page administrative log.

A note on dating: the metadata lists 2023 as the incident date, but the document itself is dated 2007. The 2023 date most likely refers to when the record was released or catalogued, not when the sighting occurred.</div>
