  <h1>CIA Report: Triangular Aircraft Launched Near Baku in 1955</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">November, 1955</span>
    <span class="badge">Baku, Azerbaijan</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/eaa9a2e8a96ab61bf2a4e1bac1a68b6a896f2fec16fb2b11a158072d9e9ba58e.jpg" alt="CIA Report: Triangular Aircraft Launched Near Baku in 1955 thumbnail" loading="lazy" />
  <p>A formerly secret CIA information report documents a US corporate executive&#39;s eyewitness account of a triangular aircraft being launched from an airfield near Baku, Azerbaijan in October 1955. The object spiralled into the sky at extreme speed while a Soviet security officer ordered the train&#39;s window blinds shut.</p>
  <div class="narr">This CIA information report, originally classified SECRET, records the debriefing of a 41-year-old American corporate executive who witnessed an unusual aircraft launch while travelling by train through Soviet Azerbaijan in 1955. The observer — a vice president of publicity and advertising with a political science background but no aviation training — was visiting the USSR as a tourist at the invitation of a senior Soviet official.

On 4 October 1955, the witness boarded a train in Baku bound for Tiflis (now Tbilisi) with three other US nationals. Roughly two hours and forty minutes after departure, he spotted a large airfield between the railway and the Caspian Sea coast, approximately 50 to 65 miles south of Baku. A powerful searchlight illuminated a triangular object on the ground. He described it as squat, shaped like an equilateral triangle, roughly the size of a US jet fighter, with three lights — one at each point of the triangle.

The object was then launched in what the witness described as a missile-like ejection rather than a normal takeoff. It made between three and seven rapid spirals before climbing at roughly 45 degrees at extreme speed, tracked by the searchlight throughout. A companion in the next compartment reported seeing a second launch in rapid succession. Shortly after, a Soviet MVD (Ministry of Internal Affairs) officer who had been aboard since departure ordered all window blinds drawn.

The CIA filed this as unevaluated information — meaning the agency recorded the account but did not assess whether it was accurate. The witness&#39;s identity and some distribution details are redacted. Notably, the group had been told by INTOURIST (the Soviet state travel agency) in Baku that no flights existed between Baku and Tiflis, but upon arrival in Tiflis, INTOURIST staff there said several flights operated daily — raising the possibility the group was deliberately routed by train past the area, or prevented from overflying it.</div>
