  <h1>FAA pilot report: unidentified object near New Jersey airport, no radar confirmation</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5dd1c9a4fa79ce91f82262aae89547da456ec973b9d72e1f341d1e4395fbd3a1.jpg" alt="FAA pilot report: unidentified object near New Jersey airport, no radar confirmation thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from November 2023 in which a general aviation pilot reported seeing an unidentified aerial phenomenon — described ambiguously as a &#39;contrail or object&#39; — within 500 feet while flying near SBJ airport. Air traffic control radar did not detect anything, no other aircraft were nearby to confirm the sighting, and the case was closed without resolution.</p>
  <div class="narr">On 24 November 2023 at 16:15, a general aviation pilot flying a Cirrus SF50 light jet (callsign N197LL) reported an unidentified aerial phenomenon to the FAA while in the vicinity of Solberg Airport (SBJ) in New Jersey. The aircraft was travelling from Westchester County Airport (HPN) to Columbia Metropolitan Airport (CAE).

The pilot described the phenomenon ambiguously as a &#39;contrail or object&#39; encountered within 500 feet and one nautical mile of the aircraft. The FAA classified this under its SKYWATCH incident reporting system with the primary code &#39;Unidentified Aerial Phenomenon&#39;.

Critically, the phenomenon was not detected on any air traffic control radar system, and no other aircraft were in the area to independently confirm the sighting. The report is a single-source observation from one pilot without any instrumented sensor data to support it.

The FAA marked the case as Closed. No resolution or identification of the phenomenon is noted in the document — it was simply logged and filed. There is low evidence of redaction in this record.</div>
