  <h1>17-Second Infrared Video Shows Brief Unidentified Object Over CENTCOM Area</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">CENTCOM</span>
    <span class="badge">verified</span>
  </div>
  
  <p>This is a 17-second infrared video titled &#39;AFSOC Kabul UAP Jul 2017,&#39; released by the Department of War as part of its PURSUE collection. Only two seconds contain visible content — a brief area of contrast moving across the frame — and the video lacks a verified chain of custody.</p>
  <div class="narr">In March 2026, eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records held by the government. The All-domain Anomaly Resolution Office (AARO) identified responsive materials on a classified network, and this video — catalogued as DOW-UAP-PR064 — was among them.

The video is 17 seconds long and was originally uploaded to a classified network in June 2024. Its title, &#39;AFSOC Kabul UAP Jul 2017,&#39; was assigned by whoever uploaded it, not by AARO or any other official body. AARO assesses the footage likely comes from an infrared sensor aboard a U.S. military platform operating within the United States Central Command (CENTCOM) area of responsibility.

The first 13 seconds of the video show nothing. Between seconds 14 and 15, an area of contrast enters the sensor&#39;s field of view from the left, moves to the right, and exits the frame. That is the entirety of the observable content.

AARO has noted that many of the released materials, including this one, lack a substantiated chain of custody — meaning there is no verified record of who handled the video or how it moved between systems before it reached the classified network in 2024.</div>
