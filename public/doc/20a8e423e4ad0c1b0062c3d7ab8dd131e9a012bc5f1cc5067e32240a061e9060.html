  <p>The United States Indo-Pacific Command submitted a report of an unidentified anomalous phenomenon to the All-domain Anomaly Resolution Office (AARO) consisting of 1 minute and 46 seconds of video footage from an infrared sensor aboard a U.S. military platform in 2024.

Video Description: 
00:01-00:12: The sensor tracks an area of contrast, keeping it generally within the center of the frame.
00:13-00:28: The sensor zooms in and tracks an elongated area of contrast, keeping it generally to the left of the center of the frame.
00:29-00:33: The sensor zooms in again. The area of contrast appears as a “line” of several areas of contrast moving across the sensor field-of-view from the bottom right to the top left.
00:34-01:44: The sensor pans to track the areas of contrast for approximately 1 minute. They become less distinct over time as their distance from the sensor increases. 

This video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.</p>
