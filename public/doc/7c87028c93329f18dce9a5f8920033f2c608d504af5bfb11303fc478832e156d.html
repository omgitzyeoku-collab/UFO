  <h1>Four Airline Crews Reported a Bright Light Over Virginia in 2022</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7c87028c93329f18dce9a5f8920033f2c608d504af5bfb11303fc478832e156d.jpg" alt="Four Airline Crews Reported a Bright Light Over Virginia in 2022 thumbnail" loading="lazy" />
  <p>An FAA incident report documents four commercial aircraft crews observing a bright, stationary light in the upper atmosphere over Virginia on 17 August 2022. The pilot in command suggested it may have been Starlink satellites reflecting sunlight, but the FAA closed the case without confirming or denying that explanation.</p>
  <div class="narr">This is an FAA SKYWATCH incident report (record 237UAP00105) describing an unidentified aerial phenomenon observed on 17 August 2022 at around 05:00 UTC — roughly 1:00 a.m. Eastern time, during pre-dawn hours. The primary report came from Southwest Airlines flight SWA2826, a Boeing 737 MAX 8 flying from Fort Myers (RSW) to Baltimore (BWI) at 39,000 feet. The crew reported a bright light in a holding pattern in the upper atmosphere near coordinates 37:49N/78:01W, approximately 40 nautical miles northwest of Richmond, Virginia.

Three additional aircraft independently confirmed the same object within roughly 50 minutes. Southwest flight SWA1875, flying Miami to Baltimore, observed it from a different angle at 39,000 feet. Two other flights — SWG603 and SWG411, both northbound international routes — also reported the object from altitudes of 38,000 and 37,000 feet respectively. The fact that crews at different positions saw the object from multiple directions (front and left side) suggests it was stationary or slow-moving.

The pilot in command of the primary aircraft offered an explanation: Starlink satellites reflecting sunlight. The pre-dawn timing is consistent with conditions where satellites can catch sunlight while the ground below is still dark. However, the FAA report neither confirmed nor denied this assessment.

The case was closed with no indication of further investigation or any formal conclusion. The report notes that &quot;TY/AWO&quot; were notified, though these abbreviations are not explained in the document. No radar data, imagery, or independent sensor data is referenced — the entire record is based on pilot observations relayed through Washington Center (ZDC) air traffic control.</div>
