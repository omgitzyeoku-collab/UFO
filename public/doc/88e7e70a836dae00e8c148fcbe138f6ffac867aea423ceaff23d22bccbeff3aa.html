  <h1>Pilot reports three pulsing lights on flight from Dallas to Rapid City</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/88e7e70a836dae00e8c148fcbe138f6ffac867aea423ceaff23d22bccbeff3aa.jpg" alt="Pilot reports three pulsing lights on flight from Dallas to Rapid City thumbnail" loading="lazy" />
  <p>An FAA incident report documents a crew sighting of three white/yellow lights that appeared to move vertically and change brightness during a November 2023 commercial flight. Air traffic control radar showed stationary returns in the area, and a local source identified a wind farm at that location. The case is closed.</p>
  <div class="narr">This is an FAA SKYWATCH incident report filed under case number 237UAP00320. It documents a sighting by the crew of flight ENY3567, an Embraer E170 regional jet flying from Dallas/Fort Worth (DFW) to Rapid City (RAP) on 22 November 2023.

At 03:43, while cruising northwest at flight level 340 (34,000 feet) approximately 29 nautical miles southeast of the HCT navigation fix, the crew reported seeing three white or yellow lights off the left side of the aircraft. The lights appeared to move up and down vertically and to brighten and dim.

Air traffic control radar systems detected stationary primary targets in the general area of the sighting. A person described as familiar with the area stated that a wind farm exists at that location — offering a straightforward potential explanation for lights that could appear to shift position and intensity when viewed from altitude at night.

The FAA marked the case as closed. The report contains no indication of follow-up investigation, corroborating imagery, or additional sensor data beyond the stationary radar returns. No redactions are evident in the document.</div>
