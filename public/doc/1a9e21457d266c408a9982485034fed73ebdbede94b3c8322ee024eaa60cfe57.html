  <h1>FBI Files Document 1947 Flying Disc Reports and a Fatal Plane Crash</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/1a9e21457d266c408a9982485034fed73ebdbede94b3c8322ee024eaa60cfe57.jpg" alt="FBI Files Document 1947 Flying Disc Reports and a Fatal Plane Crash thumbnail" loading="lazy" />
  <p>This FBI file compiles military intelligence reports and witness accounts of flying disc sightings from mid-1947, including the Maury Island incident near Tacoma, Washington. The two primary witnesses later admitted in signed statements that their debris had no connection to flying discs, and two Army officers who investigated the claims died in a B-25 crash attributed to engine fire, not sabotage.</p>
  <div class="narr">This file is a collection of FBI investigative memos and military intelligence reports from the summer of 1947 — the period when &quot;flying disc&quot; sightings swept the United States. It covers several separate incidents: a prospector named F.M. Johnson who said he saw the same objects that pilot Kenneth Arnold famously reported on June 24, 1947, near Mt. Adams; three enlisted men who observed two crescent-shaped objects over Harmon Field, Guam, on August 14; a family near Twin Falls, Idaho, who described a 20-foot-long sky-blue object moving at roughly 1,000 mph; and cast iron fragments found in New Hampshire that MIT determined were ordinary metal subjected to very high heat. A scientist noted that similar cylinders had been used in guided missile research in New Mexico.

The bulk of the file concerns the Maury Island incident. Harold Dahl and Fred Crisman claimed that in June 1947, five flying discs descended over Maury Island near Tacoma, Washington, and dropped material onto a boat. Ray Palmer, editor of a fantasy magazine publisher called Venture Press, paid pilot Kenneth Arnold $200 to travel to Tacoma and investigate. Army intelligence officers Captain William Davidson and Lieutenant Frank Brown also looked into the claims. On August 1, 1947, their B-25 crashed near Kelso, Washington, after the left engine caught fire and the wing separated. Both officers were killed; two others on board survived by parachute. The FBI found no evidence the crash was caused by sabotage.

Five anonymous phone calls to the Tacoma Times and United Press between July 31 and August 2 claimed the B-25 had been shot down because it carried disc fragments. Investigators never definitively identified the caller. The investigating officer also found no newspaper reports corroborating the Maury Island sighting despite its supposed proximity to Tacoma, and noted the boat showed old weathered paint inconsistent with recent damage claims.

The case collapsed when Dahl and Crisman admitted in signed statements that the rock material they had sent to Ray Palmer came from a gravel pit on Maury Island and had no connection to flying discs. Fred Crisman&#39;s credibility was further questioned — investigators recommended revoking his Air Reserve commission as unreliable. FBI records also flagged that a Harold Dahl had previously been charged with illegal wearing of a military uniform and theft of national property. A note in the file records that General Twining at Wright Field gave the impression the Army Air Forces investigation aimed to rule out disc reports, since the objects were determined not to be of AAF origin.</div>
