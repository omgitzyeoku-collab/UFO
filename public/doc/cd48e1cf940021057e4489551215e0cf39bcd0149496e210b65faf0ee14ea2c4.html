  <h1>Business Jet Crew Reports Five Converging Lights at 45,000 Feet Over Georgia</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/cd48e1cf940021057e4489551215e0cf39bcd0149496e210b65faf0ee14ea2c4.jpg" alt="Business Jet Crew Reports Five Converging Lights at 45,000 Feet Over Georgia thumbnail" loading="lazy" />
  <p>This FAA operations centre notification records a UAP sighting by the crew of a Gulfstream business jet flying at 45,000 feet near Dublin, Georgia on 20 March 2024. The crew described a group of five converging lights; no evasive action was taken and no investigation findings are included.</p>
  <div class="narr">On 20 March 2024, at 11:45 PM Eastern time, the crew of a Gulfstream GA5C business jet (registration N231TJ) reported an unidentified aerial phenomenon to air traffic control while flying northbound at 45,000 feet in the vicinity of Dublin, Georgia. They described what they saw as a group of five converging lights.

The sighting was relayed by Jacksonville Air Route Traffic Control Center (ARTCC) to the FAA Washington Operations Center, which logged it as incident 237UAP00622. The crew took no evasive action, and no law enforcement notification was reported.

The document itself is a brief preliminary operational notification — essentially a short-form log entry — rather than a full investigation report. It contains no radar data, no sensor evidence, and no weather information. There is no description of how the lights moved, how long they were visible, or at what distance they appeared.

No conclusions are drawn in this document. It records what the crew reported and nothing more. Redaction appears minimal — the record reads as a standard FAA operations centre notification rather than a redacted investigative file.</div>
