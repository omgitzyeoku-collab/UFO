  <h1>Southwest Airlines Pilot Reported Flashing Lights at 41,000 Feet</h1>

  <p>An FAA incident report documents a Southwest Airlines pilot observing unexplained flashing lights above the aircraft while flying at 41,000 feet on a route from Fort Myers to Baltimore in March 2023. The case was closed with no identification or resolution noted.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00244. It records an observation made by the crew of Southwest Airlines flight SWA1307, a commercial flight travelling northbound from Southwest Florida International Airport (RSW) to Baltimore-Washington International Airport (BWI) on 22 March 2023.

While cruising at flight level 410 (41,000 feet), the crew reported an unidentified aerial phenomenon approximately 100 nautical miles off the left side of the aircraft. The phenomenon was described as flashing lights positioned above the aircraft. No evasive action was taken by the crew.

The report was flagged through the FAA&#39;s internal paging system, with the Denver (DEN) operations centre noted in the record. The case status is listed as closed, but the document does not record any identification or explanation for what the crew observed.

No corroborating radar data, sensor readings, or additional witness accounts are mentioned in the report. The document contains minimal detail about the phenomenon itself — there is no description of its size, shape, speed, or how long it was visible.</div>
