  <h1>FBI Interviewed a Witness About Repeated UAP Sightings in the Northeast</h1>
  <div class="meta">
    <span class="badge">FBI</span>

  <img class="thumb" src="/extract/thumbs/a0de108fbb2db413bb5c8d4b429132683e81061bd0dc50071b51b560783c0003.jpg" alt="FBI Interviewed a Witness About Repeated UAP Sightings in the Northeast thumbnail" loading="lazy" />
  <p>This is an FBI interview form from October 2024 documenting a conversation with a US person who reported multiple sightings of unidentified lights in the northeastern United States, the first occurring in November 2021. The document is so heavily redacted that almost no specific details — names, exact locations, dates, or the FBI&#39;s own conclusions — are recoverable.</p>
  <div class="narr">This document is an FBI FD-1057 Electronic Communication — a standard form the Bureau uses to record investigative interviews. It was created in October 2024 and concerns sightings classified under Unidentified Aerial Phenomenon (UAP) in the northeastern United States.

The person interviewed described their first UAP sighting as occurring in November 2021. They reported noticing unexplained lights while exercising at around 5 a.m. The sightings were observed from a property, though the specific location is redacted. Before this interview, the witness had already provided the FBI with a presentation and videos related to the sightings.

The document also notes that current and former colleagues of the witness were aware of sightings from the same property, suggesting multiple people may have observed the phenomena. However, no independent corroboration is documented in the visible portion of the text.

The redaction level is extreme. Names, the witness&#39;s employer, specific dates, exact locations, the FBI case ID, and the names of FBI personnel who drafted or approved the document are all obscured. Only the first page or a portion of the full interview is visible in this release, so whatever the FBI concluded — if anything — is not available here.

This document is part of a linked series (referenced as D004 through D008 and PR001 through PR003) covering the same area, meaning companion files may provide additional context not visible in this single page.</div>
