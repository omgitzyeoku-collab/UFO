  <h1>JetBlue Crew Reports Flashing Lights Over Kansas at 36,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/6d1864a3f4875c689e8e86c01ae8f456cc0fc18d70033eb1a7ffa922b68c7120.jpg" alt="JetBlue Crew Reports Flashing Lights Over Kansas at 36,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a JetBlue pilot sighting of multi-colored flashing lights with a visible trail while flying over Kansas in February 2023. A second aircraft from Southwest Airlines independently observed the same phenomenon but suggested it could be satellite reflections. The case was closed with no further investigation noted.</p>
  <div class="narr">On 4 February 2023 at 03:35 UTC, the crew of JetBlue flight 1211 — an Airbus A321neo flying from New York&#39;s JFK to Las Vegas — reported seeing something unusual while cruising westbound at 36,000 feet, roughly 36 nautical miles south of Kansas City. They described multi-colored flashing lights with what appeared to be a contrail or wake trailing behind it.

The sighting was not isolated. A Southwest Airlines flight (SWA2520), a Boeing 737 travelling from St. Louis to Phoenix at 38,000 feet, was trailing behind the JetBlue aircraft and reported seeing the same thing. However, the Southwest crew offered a possible conventional explanation: reflections from a satellite.

Neither crew took evasive action, suggesting the object was not perceived as an immediate collision threat. The incident was reported through Kansas City Air Route Traffic Control Centre (ZKC), and the FAA&#39;s UFO Hotline was notified.

The case is marked as closed. The report contains no mention of radar data, photographs, or any sensor evidence beyond the two crews&#39; visual observations. No formal conclusion about what the phenomenon was — or was not — appears in the document.</div>
