  <h1>AARO Explains Why Most UAP Data Stays Classified</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/58f3f1562985217a3921fce6948894a20ecc72a140a9c430095e371797d30912.jpg" alt="AARO Explains Why Most UAP Data Stays Classified thumbnail" loading="lazy" />
  <p>This September 2025 information paper from the All-domain Anomaly Resolution Office (AARO) explains why UAP-related data is typically classified — to protect military sensors and methods, not the UAP subject matter itself. AARO reiterates it has found no evidence of extraterrestrial beings or technology to date and describes the multi-step process required to declassify UAP records.</p>
  <div class="narr">In September 2025, the All-domain Anomaly Resolution Office (AARO) — the U.S. Department of Defense office responsible for investigating unidentified anomalous phenomena (UAP) — published an information paper explaining how UAP-related data gets classified and what it takes to release it to the public.

The core message is straightforward: most UAP imagery and reports are classified not because the objects themselves are secret, but because the footage reveals details about the military platforms, sensor capabilities, and intelligence methods used to capture it. AARO uses a hypothetical example involving an F-35 fighter jet to illustrate how even a mundane sighting can carry classified context. The office also notes that the vast majority of UAP reports are eventually identified as ordinary objects — balloons, satellites, birds — once reviewed.

On the question of extraterrestrial origin, AARO states plainly that it has found no evidence of extraterrestrial beings or technology to date. The paper references a screenshot from the &quot;Al Taqaddum Object&quot; video, popularly known as the &quot;jellyfish video,&quot; but provides no analytical conclusions about that object.

The paper also explains why declassification is slow: AARO cannot release classified information on its own. The originating office — whichever military or intelligence entity created the data — holds primary declassification authority. Once reviewed, material goes through the Defense Office of Prepublication and Security Review (DOPSR) before any public release. Three outcomes are possible: full release, partial release with redactions, or the information stays classified entirely.

AARO adds that it is working with the National Archives and Records Administration (NARA) to transfer UAP-related records for permanent storage and public access.</div>
