  <h1>Los Alamos Astronomy Club Invited Physicist to Speak on UFOs in 1986</h1>
  <div class="meta">
    <span class="badge">Department of Energy</span>
    <span class="badge">5/20/86</span>
    <span class="badge">New Mexico</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/89ecb1163e42d3e8a215033b88e87ae3befe82a8dad1db112fae7e760bb756f4.jpg" alt="Los Alamos Astronomy Club Invited Physicist to Speak on UFOs in 1986 thumbnail" loading="lazy" />
  <p>This 1986 letter invited members of the Pajarito Astronomers club in Los Alamos, New Mexico, to a meeting featuring a talk titled &quot;Why Should a Scientist be Concerned about UFO&#39;s?&quot; by Dr. John Warren, a physicist associated with a Los Alamos National Laboratory division. No record of the actual presentation survives.</p>
  <div class="narr">On May 20, 1986, the Pajarito Astronomers — a local astronomy club based in Los Alamos, New Mexico — sent a letter to its members announcing an upcoming meeting. The meeting was scheduled for Thursday, May 29, 1986, at 7:30 p.m. in the Ranch Room at Fuller Lodge.

The featured guest speaker was Dr. John Warren, identified as being from AT-6, a division of Los Alamos National Laboratory (LANL). His talk was titled &quot;Why Should a Scientist be Concerned about UFO&#39;s?&quot; The document does not make clear whether Dr. Warren was appearing in an official laboratory capacity or on his own time.

The document itself is only an invitation — it tells us a talk was planned, but no record of what Dr. Warren actually said has survived. LANL has stated the event was not officially hosted by the laboratory and that it has no record of the discussion. Some names in the club&#39;s leadership section appear to be partially redacted or code-masked.

The document was released by the Department of Energy as part of the PURSUE public disclosure. It is notable mainly because it shows that a scientist at one of the country&#39;s premier nuclear weapons laboratories was willing to give a public talk urging scientific attention to UFOs, at a time when the subject carried significant professional stigma.</div>
