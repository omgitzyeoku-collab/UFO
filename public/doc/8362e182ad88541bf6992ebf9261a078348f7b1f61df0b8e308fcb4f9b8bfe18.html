  <h1>AARO Documents Repeated Failed Attempts to Interview UFO Whistleblower Grusch</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>A January 2024 memo from the All-domain Anomaly Resolution Office (AARO) records at least eleven attempts between June 2023 and January 2024 to interview David Grusch about his claims that the U.S. Government possesses extraterrestrial material. Every attempt failed — Grusch raised security-classification concerns, questioned AARO&#39;s authority, and ultimately did not sit for the interview.</p>
  <div class="narr">This document is an unclassified memorandum for record dated January 8, 2024, authored by AARO — the Pentagon office responsible for investigating unidentified anomalous phenomena (UAP). Its subject is straightforward: AARO&#39;s efforts to get David Grusch, a former intelligence official turned whistleblower, to sit down for an interview about his claims of U.S. Government possession of extraterrestrial material and reverse-engineering programs. The interview was intended to support a Congressionally directed Historical Record Report.

The memo chronicles a months-long back-and-forth. Starting in June 2023, AARO Director Sean Kirkpatrick and his staff tried to reach Grusch through direct contact and intermediaries, including former intelligence official Chris Mellon, who described Grusch as &quot;sincere and credible.&quot; On November 10, 2023, Grusch finally agreed to be interviewed in Arlington, Virginia, on November 14. He did not show up. In emails the day before, he had raised detailed questions about AARO&#39;s ability to handle sensitive compartmented information, including specific programs designated by acronyms like HCS-O and MNTK, and asked whether AARO had policies to receive certain types of special access programs from the Department of Energy and National Security Council.

AAR0 responded by providing Grusch memorandums from both the Department of Defense Special Access Programs Central Office and the Office of the Director of National Intelligence confirming its legal authority to receive information at any classification level. A formal November 19 invitation, coordinated with the DoD Office of General Counsel, cited the FY2023 National Defense Authorization Act as its legal basis. None of this moved Grusch. He stated he was not convinced AARO was authorized to receive the information and also suggested Kirkpatrick might be a target of an ongoing criminal investigation. The memo notes personal animosity between Grusch and Kirkpatrick dating back to 2015.

AAR0&#39;s conclusion is blunt: Grusch had no intention of providing information. The document was cleared for open publication on June 13, 2025, well after the events it describes. Several names are redacted under privacy exemptions, and the document is released in part, meaning some content was withheld.</div>
