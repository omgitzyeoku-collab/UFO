  <h1>Southwest Airlines crew reported bright lights near LAX; FAA linked them to Starlink</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/add28a80ccce0c0bbe5761aae8d00fd4062a65006b3c2150ac9f56c6ce1a9f85.jpg" alt="Southwest Airlines crew reported bright lights near LAX; FAA linked them to Starlink thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Southwest Airlines Boeing 737 crew sighting bright lights while flying at 40,000 feet near Los Angeles on 1 October 2024. The lights were not picked up on radar, and the FAA&#39;s own assessment attributed them to a Starlink satellite pass, closing the case.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — the system the Federal Aviation Administration uses to log pilot sightings of unidentified aerial phenomena (UAP). It records an event reported by the crew of Southwest Airlines flight SWA986, a Boeing 737 flying from San Diego to Oakland.

At 05:21 UTC on 1 October 2024, while heading north at 40,000 feet roughly 16 nautical miles southwest of Los Angeles International Airport (LAX), the crew reported bright lights off the left side of the aircraft. The lights were described as both orbiting and stationary, estimated at approximately 60,000 feet altitude. Los Angeles Air Route Traffic Control Centre (ZLA) was the reporting facility.

Air traffic control radar did not detect the objects. The FAA&#39;s assessment noted that the objects correlated with a Starlink satellite map, attributing the sighting to a pass of SpaceX&#39;s Starlink satellite constellation. The case is marked as closed.

There is a date discrepancy worth noting: the archive catalogue lists the incident year as 2023, but the report itself is clearly dated 1 October 2024. The document carries minimal redaction.</div>
