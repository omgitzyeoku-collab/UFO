  <h1>American Airlines Crew Reported High-Altitude Balloon at 50,000 Feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f45e8b7ebb37af705b34721901c9b57f0218498d5485dc9f28bf30aa7e524544.jpg" alt="American Airlines Crew Reported High-Altitude Balloon at 50,000 Feet in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from 3 February 2023 in which the crew of American Airlines flight AAL799 reported observing a large balloon at approximately 50,000 feet or above while cruising at 35,000 feet. The FAA classified the sighting as an Unidentified Aerial Phenomenon, and the case is now closed.</p>
  <div class="narr">This document is an FAA SKYWATCH Incident Report — a standardised form used by the Federal Aviation Administration to log unusual aerial sightings reported by pilots. It was classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On 3 February 2023, the crew of American Airlines flight AAL799 — an Airbus A321 flying eastbound from San Diego to Philadelphia at flight level 350 (approximately 35,000 feet) — reported seeing a large balloon off the left side of the aircraft. The object was located approximately 10 nautical miles northeast of the navigation point BQS. The crew estimated the balloon was at flight level 500 (approximately 50,000 feet) or above.

The sighting was reported to Kansas City Center (ZKC), the air traffic control facility covering that airspace. The case status is listed as closed. No resolution or identification of the object is provided in the report beyond the crew&#39;s own description of it as a &quot;large balloon.&quot;

It is worth noting that this incident occurred during the same period in early February 2023 when multiple high-altitude balloon incursions over US airspace were widely reported in the news. However, the report itself does not draw any connection to those events.</div>
