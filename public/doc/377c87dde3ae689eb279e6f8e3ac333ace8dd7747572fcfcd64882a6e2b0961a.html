  <h1>Commercial Pilot Reports String of Lights Over Connecticut in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/377c87dde3ae689eb279e6f8e3ac333ace8dd7747572fcfcd64882a6e2b0961a.jpg" alt="Commercial Pilot Reports String of Lights Over Connecticut in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a commercial airline crew observing a string of lights moving southeast at high altitude above their aircraft on 13 February 2023. The FAA correlated the sighting to Starlink satellites over Massachusetts and closed the case.</p>
  <div class="narr">On 13 February 2023, at 23:39, the crew of Piedmont Airlines flight PDT6044 reported an unidentified aerial phenomenon while flying westbound at flight level 260 (approximately 26,000 feet) over Connecticut. They described a string of lights moving southeast, high above their aircraft.

The FAA logged the report under its SKYWATCH system with the primary code &quot;Unidentified Aerial Phenomenon&quot; and assigned it case number 237UAP00216. The operator was identified as commercial.

The FAA&#39;s own assessment correlated the sighting to Starlink satellites passing over Massachusetts. The case was closed with no further action indicated. No radar or sensor data is referenced in the report — the account relies solely on what the flight crew observed.

The aircraft&#39;s tail number field is blank in the report, which limits the ability to independently verify which specific aircraft was involved. The incident location is listed under the Denver (DEN) point of departure, though the sighting itself occurred over Connecticut.</div>
