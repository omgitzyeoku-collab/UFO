  <h1>Alaska Airlines crew reported white lights ahead at 38,000 feet over Wyoming</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d3bca18834077eeac737f6c3cce898edb5d674eb629aff6ef0e64ab8b1a8b904.jpg" alt="Alaska Airlines crew reported white lights ahead at 38,000 feet over Wyoming thumbnail" loading="lazy" />
  <p>This FAA Washington Operations Center notification documents a UAP sighting by the crew of Alaska Airlines flight 440 on 24 January 2024. Flying a Boeing 737-800 from Miami to Portland at 38,000 feet, the crew reported an unidentified aerial phenomenon with white lights directly ahead of the aircraft over southern Wyoming. No evasive action was taken and no law enforcement was notified.</p>
  <div class="narr">This document is an incident notification from the FAA Washington Operations Center — essentially a short internal alert that a UAP sighting was reported through official channels. It is not a completed investigation or a final conclusion about what the crew saw.

On 24 January 2024 at 23:47 Eastern time, the crew of Alaska Airlines flight 440 — a Boeing 737-800 flying from Miami to Portland — reported an unidentified aerial phenomenon with white lights at their 12 o&#39;clock position (directly ahead). The aircraft was westbound at flight level 380, approximately 38,000 feet. The coordinates place the sighting over southern Wyoming, within Denver Air Route Traffic Control Center (ARTCC) airspace.

The crew took no evasive action in response to the sighting. No law enforcement agencies were notified. The notification was logged under FAA reference WOC 7-3333 TB/JF.

The document contains no analysis of what the object might have been, no radar data, and no follow-up investigation findings. It is a preliminary operations center record — a formal note that the report was received and logged, nothing more.</div>
