  <h1>Airline Crew Reported Jetpack Sighting Near New York at 8,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/602cc398f2a8b9e7107da7071335d901b90eb66ed00b9c99bba28fccb693d0af.jpg" alt="Airline Crew Reported Jetpack Sighting Near New York at 8,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Republic Airways crew spotting what they described as a manned jetpack hovering at roughly 8,000 feet, about 29 nautical miles southwest of LaGuardia Airport on 22 October 2022. Both the New Jersey Counter Terrorism Task Force and NYPD Aviation Unit were notified; the case is now closed with no public resolution.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under the category &quot;Unidentified Aerial Phenomenon.&quot; It records a sighting reported by the crew of Republic Airways flight RPA5764, operating an Embraer E75S aircraft, on 22 October 2022 at 18:30.

The crew was flying eastbound at 10,000 feet, approximately 29 nautical miles southwest of LaGuardia Airport (LGA), when they observed what they described as a manned jetpack hovering at roughly 8,000 feet. Air traffic control facility N90 clarified that the incident occurred over New York, not New Jersey.

Two law enforcement agencies were notified: the New Jersey Counter Terrorism Task Force and the NYPD Aviation Unit. The report&#39;s status is listed as closed, but the document contains no explanation of what the object was, no corroborating radar data, and no follow-up findings.

This sighting is part of a broader pattern of jetpack reports near the New York metropolitan area dating back to 2020, none of which have been publicly explained. The FAA&#39;s own classification — &quot;Unidentified Aerial Phenomenon&quot; — means the object was never formally identified, despite the crew&#39;s description.</div>
