  <h1>Military Infrared Video Shows Brief Unidentified Object Over Africa in 2020</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2020</span>
    <span class="badge">AFRICOM</span>
    <span class="badge">verified</span>
  </div>
  
  <p>This nearly five-minute infrared video, recorded by a U.S. military platform operating in Africa in October 2020, contains only about five seconds of visible content: an unidentified area of contrast crossing the sensor&#39;s view. It was among 51 UAP-related records requested by members of Congress in March 2026, and the reviewing office notes it lacks a verified chain of custody.</p>
  <div class="narr">On 18 October 2020, a U.S. military platform operating within the United States Africa Command (AFRICOM) area of responsibility captured infrared video that was later flagged as potentially showing an unidentified anomalous phenomenon (UAP). The video was uploaded to a classified network that same month. Its title includes a redacted military callsign, meaning the specific aircraft or unit involved cannot be publicly identified.

The video runs for four minutes and fifty-nine seconds, but nearly all of it is blank. The only visible content appears between the 00:58 and 01:03 marks — roughly five seconds — during which an area of contrast moves across the sensor&#39;s field of view from the upper left to the lower right. No details about the object&#39;s size, speed, altitude, or identity are provided in the record.

The All-domain Anomaly Resolution Office (AARO), the Pentagon body responsible for investigating UAP reports, assessed that the footage is &quot;likely&quot; from an infrared sensor on a U.S. military platform. The use of &quot;likely&quot; indicates less than full certainty about the source. AARO also notes that many of the materials in this collection lack a substantiated chain of custody, meaning their origins and handling cannot be fully verified.

This video is one of 51 potentially UAP-related records that eight members of the U.S. House of Representatives requested access to on 6 March 2026. The Department of War published it as part of a public release through its war.gov/UFO portal.</div>
