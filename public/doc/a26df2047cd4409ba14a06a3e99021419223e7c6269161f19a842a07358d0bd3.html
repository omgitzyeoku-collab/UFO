  <h1>United Airlines crew reported large white UAP near Philadelphia in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a26df2047cd4409ba14a06a3e99021419223e7c6269161f19a842a07358d0bd3.jpg" alt="United Airlines crew reported large white UAP near Philadelphia in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of United Airlines flight 1560 on 28 August 2023. While flying at 11,500 feet near Philadelphia, the crew reported a large white unidentified aerial phenomenon to their left; no evasive action was taken, and New Jersey counter-terrorism authorities were notified.</p>
  <div class="narr">On 28 August 2023 at 7:10 PM Eastern time, the crew of United Airlines flight 1560 — a Boeing 737 MAX 8 flying from San José, Costa Rica to Newark — reported seeing a large white unidentified aerial phenomenon. The object was at their 9 o&#39;clock position, meaning to the left of the aircraft, while they were heading northbound at 11,500 feet. Their position at the time was approximately 5.2 miles east-southeast of Northeast Philadelphia Airport.

The FAA&#39;s Washington Operations Center logged the report after being advised by Washington ARTCC (Air Route Traffic Control Center), the radar facility managing that airspace. The crew did not take evasive action, suggesting they did not consider the object an immediate collision threat. New Jersey State Counter Terrorism was also notified of the sighting.

The document itself is a preliminary operational notification — essentially a log entry recording that the event happened and who was told about it. It does not contain any follow-up investigation, radar data, photographs, or analysis of what the object might have been. The only description provided is &quot;large white unidentified aerial phenomenon,&quot; with no details on the object&#39;s behaviour, estimated size, speed, or how long it was visible.

No names of individual crew members appear in the report, and redaction levels are low — the document appears to be published largely as-is. The coordinates place the sighting over the Philadelphia–New Jersey border area.</div>
