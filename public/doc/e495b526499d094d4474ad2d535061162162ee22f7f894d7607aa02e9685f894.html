  <p>A 1957 CIA information report documents unknown flying objects observed over Budapest, Hungary. The document exists only as an image file so degraded or redacted that no meaningful text can be read from it, leaving its actual findings unknown.</p>
  <div class="narr">In 1957, the Central Intelligence Agency (CIA) produced an information report on unidentified flying objects seen over Budapest, Hungary. The report is catalogued as CIA-UAP-009 in the US Department of War&#39;s public release archive.

Unlike most documents in the archive, this one exists only as an image file rather than a searchable PDF. When optical character recognition (OCR) was applied to extract the text, the result was entirely garbled — no intelligible words could be recovered. This means the image is either too degraded, too low-resolution, or too heavily redacted to read by any automated method.

Because the document text is unreadable, nothing is known about what the CIA actually reported — who witnessed the objects, what they looked like, how the agency assessed the sightings, or what conclusions were drawn. Every fact available comes solely from the file&#39;s title and the catalogue metadata, not from the document&#39;s contents.

The war.gov release notes indicate that a more redacted version of this document was previously available on the CIA&#39;s own website, suggesting this version may contain additional material. However, that cannot be confirmed without a manual review of the original image file. The document is classified as having extreme redaction evidence.</div>
