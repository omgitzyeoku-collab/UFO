  <h1>Two Airliners Reported Same Stationary Lights at Very High Altitude in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/6828ea00dfee52626782329102dcbceae7935575000a7275d1c7aff4a824ca8d.jpg" alt="Two Airliners Reported Same Stationary Lights at Very High Altitude in 2023 thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report records that an American Airlines crew and a FedEx crew both observed three bright white lights on a single object at very high altitude while flying at 35,000 feet on 28 October 2023. The case was closed with no identification or explanation provided.</p>
  <div class="narr">This is a one-page FAA incident report filed under the agency&#39;s SKYWATCH system, which logs pilot sightings of unidentified aerial phenomena. The primary code assigned to the event is &quot;Unidentified Aerial Phenomenon.&quot;

On 28 October 2023, the crew of American Airlines flight 2928 — an Airbus A319 flying eastbound from Monterrey, Mexico to New York JFK at 35,000 feet — reported seeing three bright white lights on a single object. The object appeared mostly stationary at what the crew described as very high altitude (above their own cruising level of 35,000 feet). The sighting location was approximately 20 nautical miles north of the Lynchburg VOR navigation beacon in Virginia.

A second aircraft, FedEx flight 1402 — a Boeing 767-300 flying from Memphis to Newark at the same altitude — independently reported the same object. Both crews stated they had observed the lights over the previous 300 miles of their respective routes, suggesting the object remained visible for an extended period.

The FAA marked the case as closed. No resolution, identification, or follow-up investigation notes are included in the released document. No radar data or sensor recordings accompany the report.</div>
