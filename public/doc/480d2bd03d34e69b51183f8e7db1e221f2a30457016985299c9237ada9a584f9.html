  <h1>FAA Report: Pilot Spots White Oval Object at 43,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/480d2bd03d34e69b51183f8e7db1e221f2a30457016985299c9237ada9a584f9.jpg" alt="FAA Report: Pilot Spots White Oval Object at 43,000 Feet thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from April 2023 documenting a general aviation pilot&#39;s sighting of a white, oval-shaped unidentified aerial phenomenon while flying at 43,000 feet. The object appeared on the aircraft&#39;s collision-avoidance system, manoeuvred toward the aircraft before turning away and climbing, and the case was closed without identification.</p>
  <div class="narr">On 27 April 2023, the crew of a general aviation aircraft with callsign N899SC filed a report with the Federal Aviation Administration after encountering an unidentified aerial phenomenon during a flight from SNA (Santa Ana) to HOU (Houston). The aircraft was flying eastbound at flight level 430 — roughly 43,000 feet — when the crew observed the object.

According to the report, the phenomenon was white and oval in shape. It was initially travelling toward the aircraft at approximately the same altitude before turning away and climbing to about flight level 470 — around 47,000 feet, some 4,000 feet above the aircraft. The closest the object came was 10 nautical miles.

Notably, the object registered on the aircraft&#39;s TCAS (Traffic Collision Avoidance System), a radar-based system designed to detect nearby aircraft. However, the system did not issue a resolution advisory — the automated instruction pilots receive when a collision risk is imminent — suggesting the object was detected but not assessed as an immediate threat.

The FAA marked the case as closed. The report contains no resolution or identification of the object. No corroborating radar data from air traffic control is included in the document, and no tail number or operator name was recorded.</div>
