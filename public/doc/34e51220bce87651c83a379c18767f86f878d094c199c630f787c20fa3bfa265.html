  <h1>Federal Agent Describes Orange Orb Expelling Red Objects Over Western U.S.</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">October, 2023</span>
    <span class="badge">Westen United States</span>

  <img class="thumb" src="/extract/thumbs/34e51220bce87651c83a379c18767f86f878d094c199c630f787c20fa3bfa265.jpg" alt="Federal Agent Describes Orange Orb Expelling Red Objects Over Western U.S. thumbnail" loading="lazy" />
  <p>This unclassified Department of War document is a first-hand narrative from a U.S. federal law enforcement special agent (designated Witness 3) who observed unidentified anomalous phenomena over two days in October 2023 in the western United States. The agent describes a large orange orb that expelled three smaller red orbs, all silent and without exhaust trails, and a second sighting the same or following night using night vision goggles.</p>
  <div class="narr">This document, catalogued as DOW-UAP-D081, is a witness statement provided to the All-domain Anomaly Resolution Office (AARO). It records the account of Witness 3, one of several U.S. federal law enforcement special agents who reported observing unidentified anomalous phenomena (UAP) during mid-October 2023 in the western United States. The document is marked UNCLASSIFIED and dated 02 June 2026.

During the first sighting, at roughly 7:00 p.m. under clear skies, the witness was looking east when a large orange orb appeared. The orb alternated between an orange and a clear or transparent state every two to three seconds, and the witness recalls being able to faintly see its outline even during the clear phase. It moved approximately 20 degrees across the sky in three to five seconds. At about 45 degrees elevation, the orb expelled three smaller red orbs in what the witness described as a mechanical action. The red orbs moved south in a straight line, spaced about one second apart, before disappearing. The witness compared the red orbs to grapes being expelled from a basketball. The entire event lasted roughly 30 to 45 seconds. No sound or exhaust trails were observed from any of the objects. The witness&#39;s partner agent also observed the event, asking aloud whether the witness was seeing it too.

A second sighting occurred the same or following night at a different location, at approximately 8:00 to 8:30 p.m. as full darkness approached. The witness used night vision goggles to scan the sky. However, the document is truncated — the narrative of the second sighting is cut off mid-sentence, and the full account is not available.

The Department of War has not offered any conclusion or identification of what was observed. The document is purely a witness narrative with no accompanying sensor data, photographs, or instrument readings.</div>
