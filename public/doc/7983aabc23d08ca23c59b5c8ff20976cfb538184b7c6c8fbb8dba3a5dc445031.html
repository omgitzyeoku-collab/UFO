  <h1>FAA Logged Civilian Report of Glowing Sphere Over Texas</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/7983aabc23d08ca23c59b5c8ff20976cfb538184b7c6c8fbb8dba3a5dc445031.jpg" alt="FAA Logged Civilian Report of Glowing Sphere Over Texas thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a civilian caller&#39;s sighting of an amber glowing sphere near Deweyville, Texas on the evening of 26 October 2022. The object was described as moving at high speed before stopping mid-air and ascending straight up; the FAA closed the case with no identification or resolution noted.</p>
  <div class="narr">This document is a SKYWATCH Incident Report filed by the Federal Aviation Administration (FAA), coded as an &quot;Unidentified Aerial Phenomenon.&quot; It was logged at 00:45 on 26 October 2022 by FAA headquarters in Denver (HQ DEN) and is now marked as closed.

A civilian caller reported observing, from the ground, an amber glowing sphere in the vicinity of Deweyville, Texas. The caller described the object moving at a high rate of speed from southwest to northeast, then stopping in mid-air and ascending straight up. The event occurred at approximately 9:30 p.m. local time.

The FAA took the report but denied the caller&#39;s request for additional information or details about the sighting. The caller was referred to the National UFO Reporting Hotline. The case was closed with no resolution or identification of the object noted in the record.

The report is brief — a single page capturing the basics of a phone call rather than a detailed investigation. There is no mention of radar data, photographs, additional witnesses, or any follow-up inquiry by the FAA.</div>
