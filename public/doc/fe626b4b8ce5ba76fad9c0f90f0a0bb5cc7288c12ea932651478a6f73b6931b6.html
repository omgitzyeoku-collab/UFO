  <h1>Pentagon Hosted First Five Eyes UAP Meeting in May 2023</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>This document is an internal email chain between staff at the All-domain Anomaly Resolution Office (AARO) organizing the first-ever Five Eyes UAP Caucus, held at the Pentagon on 24 May 2023. The emails cover logistics and an agenda for the meeting, which brought together representatives from the U.S., U.K., Australia, Canada, and New Zealand to discuss sharing UAP data across classification levels.</p>
  <div class="narr">This PDF, released through a Freedom of Information Act (FOIA) request to AARO, contains an internal email chain from May 2023. The emails show AARO staff — including Director Dr. Sean Kirkpatrick — coordinating logistics for what the document calls the &quot;inaugural FVEY UAP Caucus.&quot; FVEY refers to the Five Eyes intelligence alliance: the United States, United Kingdom, Australia, Canada, and New Zealand.

The meeting took place on 24 May 2023 at the Pentagon, in a room rated for Top Secret/Sensitive Compartmented Information (TS/SCI) under the Office of the Under Secretary of Defense for Intelligence and Security. U.S. agencies represented included AARO, the Office of the Director of National Intelligence (ODNI), the Federal Aviation Administration (FAA), and NASA. Briefings were scheduled from AARO on operations, analysis, and strategic communications, as well as from officials identified only as NIM-A and NIM-M.

The agenda listed several collaboration topics: establishing networks to share UAP reporting at multiple classification levels (unclassified, Secret, and Top Secret), building shared databases of known objects detected by various sensors, coordinating collection planning, scheduling future meetings, and discussing emerging and disruptive technologies. The stated purpose was to build shared awareness of UAP detection, identification, and mitigation challenges across the alliance.

The document is heavily redacted. Sender names, room numbers, and individuals&#39; roles are blacked out under the (b)(6) personal privacy exemption. The email chain itself is marked as deliberative process privileged under FOIA exemption (b)(5), meaning additional content may have been withheld. No briefing content is included — only the agenda and meeting logistics are visible.</div>
