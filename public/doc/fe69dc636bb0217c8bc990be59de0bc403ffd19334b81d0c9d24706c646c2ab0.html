  <h1>Air Canada Crew Reported Unexplained Lights Over South Dakota in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/fe69dc636bb0217c8bc990be59de0bc403ffd19334b81d0c9d24706c646c2ab0.jpg" alt="Air Canada Crew Reported Unexplained Lights Over South Dakota in 2023 thumbnail" loading="lazy" />
  <p>A preliminary FAA report documents that the crew of Air Canada Rouge Flight 1704, flying from Las Vegas to Toronto on 11 February 2023, observed unexplained lights directly ahead of their aircraft at roughly 35,000–37,000 feet near Sioux Falls, South Dakota. The report was filed by the FAA Washington Operations Center; no investigation outcome or identification is included.</p>
  <div class="narr">This document is a preliminary incident report from the FAA Washington Operations Center, recording a UAP (unidentified anomalous phenomena) sighting by a commercial airline crew. It is not a final investigation — it captures the initial notification and basic facts only.

On 11 February 2023 at 03:30 CST, the crew of Air Canada Rouge Flight 1704 — an Airbus A321 en route from Las Vegas to Toronto — reported seeing lights at their 12 o&#39;clock position (directly ahead) at the same altitude or higher. The aircraft was flying eastbound between flight levels 350 and 370, which corresponds to roughly 35,000 to 37,000 feet. The sighting occurred approximately 25 nautical miles south of Sioux Falls, South Dakota, at coordinates 43.22°N, 96.74°W.

Minneapolis Air Route Traffic Control Center (ARTCC), the regional air traffic control facility, relayed the crew&#39;s report to FAA Operations. The document notes that law enforcement was not notified of the incident.

The report stops there. It contains no radar data, no sensor corroboration, no follow-up investigation, and no attempt to identify the lights. There is little evidence of redaction. What we have is a single crew observation logged through standard FAA channels — nothing more, nothing less.</div>
