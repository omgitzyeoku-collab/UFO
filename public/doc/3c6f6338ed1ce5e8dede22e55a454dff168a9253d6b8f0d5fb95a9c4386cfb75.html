  <h1>Pilot Reports Jet Pack Sighting Near Palm Springs at 3,500 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3c6f6338ed1ce5e8dede22e55a454dff168a9253d6b8f0d5fb95a9c4386cfb75.jpg" alt="Pilot Reports Jet Pack Sighting Near Palm Springs at 3,500 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a general aviation pilot&#39;s sighting of what they described as a manned jet pack flying northbound at roughly 3,500 feet, about 7 nautical miles southeast of Palm Springs. The object did not appear on air traffic control radar, and the case is now closed.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unidentified aerial phenomenon (UAP) sightings reported by pilots and air traffic controllers. It was filed under record number 237UAP00369 and is now closed.

On 16 May 2024 at 20:31, the pilot of a Cirrus SR20 light aircraft (registration N972PA) reported seeing an unidentified object while flying northwest-bound at 3,700 feet, approximately 7 nautical miles southeast of Palm Springs International Airport (PSP). The pilot described the object as a manned jet pack travelling northbound at roughly 3,500 feet — meaning it was near the same altitude as the reporting aircraft.

Air traffic control checked their radar systems but the object did not show up. The report was flagged as an Unidentified Aerial Phenomenon under the FAA&#39;s primary coding system, and a page was issued (meaning relevant personnel were notified). No further conclusions or identification are documented in the record.

The incident is notable because commercially available jet packs have limited endurance and altitude capability, making sustained flight at 3,500 feet unusual if the pilot&#39;s description is accurate. However, there is no independent confirmation of what the object was — the entire report rests on a single pilot&#39;s visual observation.</div>
