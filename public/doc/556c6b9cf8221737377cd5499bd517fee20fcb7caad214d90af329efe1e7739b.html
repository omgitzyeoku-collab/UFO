  <h1>Two Airliners Got Collision Warnings From Invisible Objects Near Kansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/556c6b9cf8221737377cd5499bd517fee20fcb7caad214d90af329efe1e7739b.jpg" alt="Two Airliners Got Collision Warnings From Invisible Objects Near Kansas thumbnail" loading="lazy" />
  <p>An FAA incident report from July 2024 documents American Airlines and United Airlines pilots both receiving automated collision alerts near Topeka, Kansas, triggered by objects that did not appear on air traffic control radar. The American Airlines crew visually observed three slow-moving, light grey aircraft-like objects, but no radar evidence of them was ever found.</p>
  <div class="narr">On 5 July 2024 at 3:35 PM Central time, the crew of American Airlines Flight 1913 — an Airbus A321 flying from Chicago O&#39;Hare to Phoenix — reported an unusual encounter while heading westbound at 26,000 feet near Topeka, Kansas. The pilot-in-command told Kansas City Air Route Traffic Control Center that the plane&#39;s TCAS (Traffic Collision Avoidance System, an onboard safety system that detects nearby aircraft and issues collision warnings) had triggered a Resolution Advisory, its most urgent alert level.

The crew visually observed what appeared to be three aircraft: two slow-moving objects flying together, followed by a single object travelling in the opposite direction at roughly 30,000 feet. All three were described as light grey in colour. The pilot used the term &#39;aircraft&#39; to describe them, suggesting they resembled conventional planes in shape, though their behaviour was not typical.

United Airlines Flight 1687 independently received its own TCAS Resolution Advisory in the same area, meaning a second aircraft&#39;s collision-avoidance system also detected something. However, the United crew did not see anything visually.

The most striking detail in the report is what was absent: Kansas City air traffic control confirmed there were no primary or secondary radar returns on their facility radar corresponding to whatever triggered the alerts. TCAS works by interrogating transponders on other aircraft, yet these objects produced no radar signature at all — an unusual combination that the report does not explain.

The document is marked as preliminary information and may have been followed by a more detailed investigation. No conclusions about what the objects were appear in the record.</div>
