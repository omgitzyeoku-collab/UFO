  <h1>Private Jet Pilot Reports White Metallic Object at 40,000 Feet Near Wilmington</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e04f403c64a6946489917f07f205928687e56de9472b11bd67a8bceb69c7da9c.jpg" alt="Private Jet Pilot Reports White Metallic Object at 40,000 Feet Near Wilmington thumbnail" loading="lazy" />
  <p>This FAA Washington Operations Center notification records a pilot on a NetJets flight reporting a white, metallic unidentified aerial phenomenon (UAP) roughly 20 nautical miles northeast of Wilmington, North Carolina, on July 27, 2024. The document is a preliminary incident log — not an investigation or conclusion — and contains no corroborating radar data or additional witness accounts.</p>
  <div class="narr">On July 27, 2024, at 12:17 PM Eastern time, the pilot of NetJets flight 627 — a Cessna Citation Longitude (C68A) flying from Morristown, New Jersey to Brunswick County, North Carolina — reported seeing an unidentified aerial phenomenon while cruising at Flight Level 400, approximately 40,000 feet. The object was described as white and metallic, spotted about 20 nautical miles northeast of Wilmington, NC (coordinates 34.27°N, 77.90°W).

The FAA&#39;s Washington Air Route Traffic Control Center (ARTCC) was notified. According to the document, no evasive action was reported by the pilot, and law enforcement notification was deemed not required.

This record is a standard FAA Operations Center incident notification — essentially a logged alert that something was reported. It is not an investigation report and reaches no conclusion about what the pilot saw. No radar data, photographs, or additional witness statements appear in the document.

One discrepancy worth noting: the archive metadata lists the incident year as 2023, but the document text clearly states July 27, 2024. The document date appears to be the accurate one.</div>
