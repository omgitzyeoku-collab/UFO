  <h1>FAA Report: Aircraft Struck Silver Balloon at 11,000 Feet in 2021</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/eba2001627049a31c34214211197af4c8e280fb273a6b8472a31d6285f56fd77.jpg" alt="FAA Report: Aircraft Struck Silver Balloon at 11,000 Feet in 2021 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a commercial aircraft (callsign GJS4582, a CRJ7 regional jet) striking a silver balloon at 11,000 feet over BWZ on 24 July 2021. The object was classified as an &quot;Unidentified Aerial Phenomenon&quot; but the report itself identifies it as a balloon, and no damage or injuries resulted.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under the primary code &quot;Unidentified Aerial Phenomenon.&quot; It records an event on 24 July 2021 at 17:28 UTC in which a CRJ7 regional jet, callsign GJS4582, struck an object while flying from Detroit (DTW) to Newark (EWR) at 11,000 feet over the BWZ navigational fix.

The report describes the object as a silver balloon travelling upward at approximately 11,000 feet. Despite the UAP classification, the report parenthetically identifies the object as a balloon — the &quot;unidentified&quot; label appears to be procedural rather than an indication of a genuinely unknown object.

No damage to the aircraft and no injuries were reported. The case status is listed as closed.

The report is a single-page administrative record. It contains no radar data, no photographs, and no corroborating witness statements beyond the flight crew&#39;s account. The processing office is listed as DEN (Denver), though the incident occurred in northeastern US airspace — this likely refers to an administrative centre, not the location of the event.</div>
