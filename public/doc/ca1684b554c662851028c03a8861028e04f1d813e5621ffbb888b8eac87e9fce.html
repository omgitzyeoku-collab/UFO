  <h1>FBI Memos Show Bureau Refused to Investigate UFO Reports in 1957–1958</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ca1684b554c662851028c03a8861028e04f1d813e5621ffbb888b8eac87e9fce.jpg" alt="FBI Memos Show Bureau Refused to Investigate UFO Reports in 1957–1958 thumbnail" loading="lazy" />
  <p>This collection of FBI internal memos and correspondence from 1957–1958 shows the Bureau repeatedly deflecting UFO sighting reports to the Air Force, responding to civilian UFO organizations, and formally establishing that investigating unidentified flying objects was not the FBI&#39;s job. The documents also capture a spike in UFO reports after the Soviet Union launched Sputnik.</p>
  <div class="narr">This set of documents comes from FBI case file 62-HQ-83894, Section 9, and spans late 1957 through late 1958. It contains internal memos, letters, and policy summaries that together paint a picture of an agency trying to distance itself from the flying saucer phenomenon while still fielding a steady stream of reports and inquiries from the public, civilian UFO groups, and other government offices.

The documents cover a range of UFO incidents. In November 1957, two witnesses in Pinar del Río, Cuba — Jose Wyieto and Carmelo Guzman — reported seeing a silent, hat-shaped disc larger than ordinary aircraft hovering over the Matahambre mines before speeding off toward the sea. The FBI&#39;s Legal Attaché in Havana noted the report but added that no corroborating reports were received and no inquiry was made. Around the same time, an internal memo noted a surge in UFO sightings following the launch of Sputnik in October 1957, listing claims including an object landing in Nebraska with six occupants who spoke to a farmer, and reports from the American Southwest of UFOs causing car engines to stop. The Air Force evaluated all of these cases and concluded they were nonauthentic or without basis.

Several documents deal with civilian UFO organizations reaching out to the FBI. Donald Keyhoe, director of the National Investigations Committee on Aerial Phenomena (NICAP) and a retired Marine, wrote to the Bureau asking about its role. FBI Director J. Edgar Hoover replied formally that the FBI does not investigate UFO sightings, does not instruct witnesses not to talk, and does not conduct character checks on witnesses. Internally, the Bureau described Keyhoe as &quot;a flamboyant writer&quot; whose material was &quot;irresponsible.&quot; Another organization, the Inter Continental Aerial Research Foundation, was soliciting newspaper editors to help set up UFO observer posts worldwide; the FBI checked its Missouri director, Robert T. Stone, and found no records — only that the address was listed to a Terrell O. Stone, an ice cream maker.

A policy summary memo lays out the Bureau&#39;s institutional history with flying discs. In 1947, the FBI initially agreed to help Army Air Forces Intelligence investigate flying disc reports, but withdrew by September of that year after concluding its resources were being wasted tracking down what the Air Force itself described as &quot;trash can covers, toilet seats and what not.&quot; A 1948 letter from the Strategic Air Command noted that a reliable source had determined the USSR had been experimenting for four years on an unknown type of flying disc, though no further details were provided. The Bureau&#39;s formal position by 1958 was clear: UFO investigation belonged to the Air Force, with all reports going to the Air Technical and Intelligence Center at Wright-Patterson Air Force Base in Ohio.

The documents also include oddities the Bureau brushed aside, such as a woman from Elkhart, Indiana — Mrs. Ferguson — who claimed outer spacemen had landed near her home and taken her newspapers. The FBI internally noted she appeared to be a &quot;mental case&quot; and recommended no reply.</div>
