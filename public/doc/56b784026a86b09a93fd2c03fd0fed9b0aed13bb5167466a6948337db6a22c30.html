  <h1>Cessna pilot reported two black balloon-like objects near Pensacola in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/56b784026a86b09a93fd2c03fd0fed9b0aed13bb5167466a6948337db6a22c30.jpg" alt="Cessna pilot reported two black balloon-like objects near Pensacola in 2023 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a general aviation pilot&#39;s sighting of two black basketball-sized objects with wires while flying at 1,500 feet near Pensacola, Florida on 25 April 2023. The FAA classified the report under the secondary code BALLOON and closed the case; no radar or sensor data is referenced.</p>
  <div class="narr">On 25 April 2023 at 13:18, the pilot of a Cessna 172 — a single-engine general aviation aircraft flying under callsign N5245K — reported an unidentified aerial phenomenon to the FAA. The pilot was southeast-bound at 1,500 feet, approximately 15 nautical miles northwest of Pensacola (PNS), Florida, on a local flight originating from and returning to Pensacola.

The pilot described seeing two black basketball-sized balloons with wires. The report notes that the direction of travel and altitude of the objects were not indicated, meaning it is unclear whether the objects were stationary or moving, or at what height they were flying.

The FAA filed this as a SKYWATCH Incident Report — a standardised format used to log unidentified aerial phenomena. The primary classification code is &quot;Unidentified Aerial Phenomenon,&quot; while the secondary code is &quot;BALLOON,&quot; suggesting the FAA provisionally categorised the objects as balloons. The case status is closed.

The report is a single page with minimal detail. No tail number or operator name was recorded for the reporting aircraft beyond the callsign, and no corroborating radar data, photographs, or additional witness accounts are referenced. The reporting facility is identified as P31, and the case was assigned the identifier P31-M-2023/04/25-0001.

There is little evidence of redaction in this document. The brevity appears to reflect the limited scope of the original report rather than information being withheld.</div>
