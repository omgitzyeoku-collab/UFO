  <p>This document is a preliminary transcript (Part II) derived from voice recordings of the Gemini 5 flight crew technical debriefing. NASA conducted this debriefing between August 30, 1965, and September 2, 1965, at the Crew Quarters, Cape Kennedy, Florida. Astronauts L. Gordon Cooper and Charles “Pete” Conrad described observing debris and “snow” and “all sorts of glittering pieces of this, that and the other thing” in the “Visual Sightings” section of the document (pages 157-220).</p>
