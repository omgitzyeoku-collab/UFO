  <h1>Air Force Report Models Space-Booster Failures, Not UFO Incidents</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">9/10/96</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0dc72877cdf9cc3a1645c3c9d282928922b00e8fd9ffd7b1daf66f46c72b2071.jpg" alt="Air Force Report Models Space-Booster Failures, Not UFO Incidents thumbnail" loading="lazy" />
  <p>This 1996 Department of the Air Force report, prepared by Research Triangle Institute, is a technical risk-engineering study on how to model unlikely space-booster failure modes for launch-area safety calculations. Despite appearing in a UAP document collection, it contains no UFO or unidentified aerial phenomena content — it covers conventional rocket failure data for Atlas, Delta, Titan, and Thor vehicles.</p>
  <div class="narr">In September 1996, the Research Triangle Institute&#39;s Launch Systems Safety Department delivered a 180-page technical report to the Air Force under contract FO4703-91-C-0112. The report, numbered RTI/5180/77-43F, was sponsored by the safety offices at Patrick Air Force Base in Florida and Vandenberg Air Force Base in California. Its purpose was narrow and practical: improve how a risk-analysis program called DAMP (facility DAMage and Personnel injury) predicts where debris might land when a rocket goes off course.

The study catalogs six possible ways a launch vehicle can behave — five failure modes and one normal mode. It focuses especially on &quot;Mode-5&quot; failures, which are rare malfunctions that cause a rocket to veer sharply from its intended path, such as executing a sustained turn away from the flight line. Though unlikely, Mode-5 failures can produce nearly all the risk to populated areas located uprange or far from the flight line, making them critical to model correctly.

To build its models, the report draws on historical launch data covering 1,186 flights — 532 Atlas, 232 Delta, 337 Titan, and 85 Thor — from the beginning of each program through August 1996. It includes specific failure case studies: an Atlas 145D in July 1962 that deviated 60 degrees in yaw due to faulty guidance equations; an Atlas 68E in December 1980 that lost pitch control and pivoted into a retrofire attitude before breaking apart; a Joust rocket in June 1991 that pitched up radically after structural failure at roughly 14 seconds into flight; and a Red Tigress sounding rocket in August 1991 that made a near 90-degree right turn within seconds of clearing the launcher at Cape Canaveral.

The document was marked unclassified but had its distribution limited to US Government agencies and contractors. Its authors include James A. Ward, Jr., Robert M. Montgomery, Martin Kinna, and Louis J. Ullian, Jr. There is low evidence of redaction in the document.</div>
