  <h1>American Airlines crew reported unidentified object at 35,000 feet over Missouri</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2881bfdeda352508e04adaa2835075f197b4274874cf61332c5776c23d157382.jpg" alt="American Airlines crew reported unidentified object at 35,000 feet over Missouri thumbnail" loading="lazy" />
  <p>This FAA operations centre log records that the crew of American Airlines flight 276, an Airbus A321 flying from San Francisco to New York JFK, observed an unidentified aerial phenomenon directly ahead of their aircraft at 35,000 feet near St Joseph, Missouri on 14 December 2022. No evasive action was taken and the UFO Reporting Center was notified.</p>
  <div class="narr">This document is a preliminary incident log from the FAA Washington Operations Center. It records a single event: on 14 December 2022 at approximately 04:10 Central time, the crew of American Airlines flight 276 reported seeing an unidentified aerial phenomenon directly ahead of their aircraft.

The flight was an Airbus A321 operating the San Francisco to New York JFK route. At the time of the sighting, the aircraft was eastbound at flight level 350 (roughly 35,000 feet), approximately 45 nautical miles east of St Joseph, Missouri. The coordinates recorded place the aircraft at 39.77°N, 94.91°W.

The crew did not take evasive action. The report notes that the regional operations centre was advised and the UFO Reporting Center was notified.

The document provides no description of the object&#39;s shape, size, speed, or behaviour — only that something was observed from the 12 o&#39;clock position (directly ahead). There is no indication in this record that the FAA conducted a follow-up investigation or reached any conclusion about what the crew saw.

This is a short operational log entry, not a full investigation report. It contains no radar data, no photographs, and no corroborating witness accounts beyond the flight crew.</div>
