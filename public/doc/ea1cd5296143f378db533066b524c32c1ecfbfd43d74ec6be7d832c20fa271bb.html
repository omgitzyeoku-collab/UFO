  <h1>DOW-UAP-PR27, Unresolved UAP Report, United Arab Emirates, October 2023</h1>

  <img class="thumb" src="/extract/thumbs/ea1cd5296143f378db533066b524c32c1ecfbfd43d74ec6be7d832c20fa271bb.jpg" alt="DOW-UAP-PR27, Unresolved UAP Report, United Arab Emirates, October 2023 thumbnail" loading="lazy" />
  <p>The United States Central Command submitted a report of an unidentified anomalous phenomenon to the All-domain Anomaly Resolution Office (AARO) consisting of four minutes and 57 seconds of video footage from an infrared (IR) sensor aboard a U.S. military platform in 2023. An accompanying mission report, DoW-UAP-D23, mentions a UAP was observed during the mission.

Video Description:
00:00-01:55: No content.
01:56: An area of contrast becomes distinguishable against the background in the center of the right side of the display.
02:04: The IR sensor pans to center on the area of contrast.
02:14: The sensor field-of-view narrows to zoom in on the area of contrast.
02:15-03:26: The area of contrast remains generally in the center of the sensor field-of-view. 
03:27-04:57: The sensor motion causes the area of contrast to move erratically across the display. Due to this motion, the sensor system repeatedly loses and reacquires the area of contrast within the center area of the display.

This video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.</p>
