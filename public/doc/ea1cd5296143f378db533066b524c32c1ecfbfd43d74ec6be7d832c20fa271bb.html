  <h1>U.S. Military Aircraft Reported Two Unidentified Objects Over the UAE in 2023</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">United Arab Emirates</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ea1cd5296143f378db533066b524c32c1ecfbfd43d74ec6be7d832c20fa271bb.jpg" alt="U.S. Military Aircraft Reported Two Unidentified Objects Over the UAE in 2023 thumbnail" loading="lazy" />
  <p>A declassified U.S. Air Force mission report documents two unidentified aerial phenomena (UAP) spotted by a single aircraft operating from Al Dhafra Air Base in the United Arab Emirates on 24 October 2023. Both objects were assessed as solid, benign, and not under intelligent control, but heavy redactions and sparse descriptions leave most details unknown.</p>
  <div class="narr">This document is a U.S. military mission report (MISREP) from the 50th Attack Squadron, operating under the 432nd Air Expeditionary Wing and U.S. Central Command (USCENTCOM). It records events from a roughly 21-hour mission flown out of Al Dhafra Air Base in the UAE on 24 October 2023, in support of Operation Spartan Shield. The aircraft took off at 0015Z and landed back at 2058Z, logging 20 hours and 43 minutes of total mission time. During the mission, the crew collected signals intelligence (SIGINT) and imagery intelligence (IMINT), and full-motion video was later analyzed by a ground exploitation unit called DGS-2.

Before the UAP sightings, at 0145Z, the crew received a radio call on the international guard frequency from Iranian Air Defense, professionally telling them to maintain safe distance from the border. The crew responded that they were a coalition aircraft conducting routine operations in international airspace.

The first UAP was observed at 0241Z. The report describes it as a solid object with a cold thermal signature, traveling at an estimated 320 MPH. No maneuverability was observed. The second UAP appeared at 0322Z, also solid, moving at an estimated 440 MPH, but with unknown sensor signatures. Both were assessed by the observer as benign and not under intelligent control. Neither was engaged, and neither had any reported effect on personnel or equipment. Size, shape, color, and markings for both objects are listed as unknown.

The document was declassified on 12 September 2025 by Major General Richard A. Harrison, USCENTCOM Chief of Staff. It is heavily redacted: the aircraft type, crew names, callsign, tail number, exact coordinates, and contact details are all blacked out under multiple classification exemptions.</div>
