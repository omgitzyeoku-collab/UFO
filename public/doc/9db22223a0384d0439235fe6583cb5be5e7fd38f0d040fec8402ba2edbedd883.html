  <h1>Unresolved 2020 Middle East UAP Video Yields Little Detail</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9db22223a0384d0439235fe6583cb5be5e7fd38f0d040fec8402ba2edbedd883.jpg" alt="Unresolved 2020 Middle East UAP Video Yields Little Detail thumbnail" loading="lazy" />
  <p>DOW-UAP-PR44 is a video recording of a UAP (unidentified anomalous phenomena) encounter in the Middle East from 2020, released by the Department of War as part of its PURSUE collection. The auto-generated transcript is nearly unintelligible, consisting almost entirely of numerical callouts with no description of the object observed.</p>
  <div class="narr">In 2020, a UAP encounter was recorded somewhere in the Middle East. The Department of War designated it DOW-UAP-PR44 and released it as part of PURSUE, the agency&#39;s public disclosure programme for UAP-related material. The case remains officially unresolved.

The released material is a video recording, but what survives in the public record is an auto-generated transcript of the audio. That transcript is almost entirely unintelligible — it captures what appears to be radio chatter dominated by disconnected numbers, likely headings, coordinates, or sensor readings. One clear reference to &quot;heading east, one, three, two&quot; is the only directional detail that can be extracted with any confidence.

No description of the object itself — its shape, movement, speed, or any other observable characteristic — can be drawn from the transcript. No sensor type is identified, no witnesses are named, and no narrative account of the encounter is present in the text.

The Department of War has not published a conclusion about what was observed. The case status is listed simply as &quot;unresolved.&quot; Without access to the original video, it is impossible to assess what was visually recorded during the incident.</div>
