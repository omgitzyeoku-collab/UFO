  <h1>U.S. Embassy Cable Reported Mexico&#39;s 2023 Congressional UAP Hearing</h1>
  <div class="meta">
    <span class="badge">Department of State</span>
    <span class="badge">9/12/03</span>
    <span class="badge">Mexico</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/022b27728e86e291e078cac1d4fd5dcf225b2f6700175db9ea8ada19147318d8.jpg" alt="U.S. Embassy Cable Reported Mexico&#39;s 2023 Congressional UAP Hearing thumbnail" loading="lazy" />
  <p>A routine weekly political briefing cable from the U.S. Embassy in Mexico reported on a September 12, 2023 Mexican congressional hearing about unidentified aerial phenomena (UAP), during which alleged alien corpses were presented alongside pilot encounter videos. The cable noted that a key witness, former U.S. Navy pilot Ryan Graves, publicly condemned the corpse display as an &quot;unsubstantiated stunt,&quot; and that scientists had previously discredited similar specimens from the same presenter.</p>
  <div class="narr">This document is a weekly political briefing cable (reference 23 MEXICO 2544) sent by the U.S. Embassy in Mexico on September 16, 2023. It covers a range of Mexican domestic political developments, with one section devoted to a congressional hearing on unidentified aerial phenomena (UAP) held on September 12, 2023.

During that hearing, the Mexican Congress heard testimony from several experts as part of a debate on the proposed Aerial Space Protection Law, which, if approved, would make Mexico the first country to formally acknowledge the presence of alien life on Earth. Among the witnesses were Mexican journalist Jaime Maussan and former U.S. Navy pilot Ryan Graves, who had previously testified before the U.S. Congress on UAP. Experts asked legislators to recognize UAP, guarantee airspace security, and allow UAP to be studied.

Two alleged alien corpses were presented to Congress during the hearing, along with videos of Mexican pilots encountering fast-moving flying objects during flight. However, Graves distanced himself from the corpse display, saying it took away from his and other pilots&#39; experiences with UAP and calling it Maussan&#39;s &quot;unsubstantiated stunt.&quot; The cable also noted that scientists had previously discredited alleged alien corpses Maussan presented as evidence of alien life.

The entire cable is marked unclassified, including the UAP section specifically. It was released by John Powers, Acting Director at the U.S. Department of State, on February 25, 2026. The UAP content occupies a small portion of a broader political briefing that primarily covers Mexican domestic politics, elections, and security matters.</div>
