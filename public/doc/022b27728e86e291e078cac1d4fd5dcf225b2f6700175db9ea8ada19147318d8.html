  <h1>State Department UAP Cable 5, Mexico, September 16, 2003</h1>
  <div class="meta">
    <span class="badge">Department of State</span>

  <img class="thumb" src="/extract/thumbs/022b27728e86e291e078cac1d4fd5dcf225b2f6700175db9ea8ada19147318d8.jpg" alt="State Department UAP Cable 5, Mexico, September 16, 2003 thumbnail" loading="lazy" />
  <p>On September 12, 20023 the Mexican Congress heard testimony on UAP from experts related to the debate about an Aerial Space Protection Law, which, if approved, would make Mexico the first country to formally acknowledge the presence of alien life on earth. Experts asked legislators to recognize UAP, guarantee airspace security, and allow UAP to be studied.  They presented to alleged alien corpses and videos of Mexican pilot’s encounters with fast-moving flying objects during flight. Disagreement about the efficacy and validity of the purported alien corpses.</p>
