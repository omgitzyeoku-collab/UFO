  <h1>Multiple Aircraft Reported Unidentified Phenomenon Above Them in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/4da73c7c9be3efcdc36000242c2a75041a8914ad54ebd5c80e92206fd952cac9.jpg" alt="Multiple Aircraft Reported Unidentified Phenomenon Above Them in 2023 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a March 2023 event in which multiple commercial aircraft reported an unidentified aerial phenomenon above their position. The report contains no descriptive details about the object — no shape, speed, or altitude — and was closed without law enforcement involvement.</p>
  <div class="narr">On 2 March 2023 at 01:09 UTC, the FAA logged a SKYWATCH incident report under record 237UAP00233. The report was filed in connection with commercial flight LET6164, operated by LET, and references a Mandatory Occurrence Report (MOR) originating from the Houston Center (ZHU) dated 1 March 2023 — suggesting the sighting occurred late on 1 March and was formally recorded the following day.

Multiple commercial aircraft reported an unidentified aerial phenomenon above their position. Despite this, FAA records noted no other reported traffic in the area at the time. The report provides no further detail about the phenomenon itself — no shape, size, speed, altitude, colour, or direction of movement is recorded.

The FAA&#39;s MOR entry states that no position or directional information about the phenomenon was provided. Law enforcement was not notified. The case status is listed as closed.

This is a procedural incident report, not an investigation file. It confirms that something was reported by multiple aircraft and logged through official channels, but it contains no analysis, no radar data, no photographs, and no conclusion about what the phenomenon was.</div>
