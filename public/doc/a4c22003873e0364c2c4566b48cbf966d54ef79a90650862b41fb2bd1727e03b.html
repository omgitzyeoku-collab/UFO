  <h1>DHS Released All Records on Terminated Program KONA BLUE to Defense Department</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>In February 2024, the Department of Homeland Security declassified and released all documents related to KONA BLUE, a prospective special access program it had terminated in 2012. The accompanying material includes justifications for restricting a related Pentagon program called AATIP, citing concerns about exotic technologies that could be weaponised by adversaries.</p>
  <div class="narr">In a letter dated February 5, 2024, the Department of Homeland Security (DHS) informed Deputy Secretary of Defense Kathleen H. Hicks that it had declassified all documents associated with a program called KONA BLUE. The letter was signed by Kristie Canegallo and responded to a September 28, 2023 request. DHS confirmed it had searched all pertinent records and found no additional material beyond what was released.

KONA BLUE was a DHS prospective special access program — meaning it was proposed but never fully stood up. It was terminated on February 10, 2012. The declassified documents use a strike-out method, leaving prior classification markings visible so readers can see what was originally restricted.

Alongside the cover letter, the release includes excerpts from a justification document for restricting AATIP (the Advanced Aerospace Threat Identification Program, a separate Pentagon effort). That justification argued for special access controls because the programme dealt with what it called exotic technologies — described as &#39;likely&#39; involving sophisticated concepts in quantum mechanics, nuclear science, electromagnetic theory, gravitics, and thermodynamics. The document warned these technologies had potential for &#39;catastrophic effects&#39; if obtained by adversaries. It also argued that public awareness of industry partners&#39; involvement could discourage their continued participation with the US government.

Some redactions remain. DHS noted these were applied after a policy and legal review, meaning not everything in the original documents made it into the public release despite the broader declassification.</div>
