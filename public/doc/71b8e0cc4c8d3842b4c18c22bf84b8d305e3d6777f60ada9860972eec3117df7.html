  <h1>Civilian Reports Cylindrical Object in New Jersey; Radar Finds Nothing</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/71b8e0cc4c8d3842b4c18c22bf84b8d305e3d6777f60ada9860972eec3117df7.jpg" alt="Civilian Reports Cylindrical Object in New Jersey; Radar Finds Nothing thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a civilian sighting of a cylindrical unidentified object near Rio Grande, New Jersey on 25 November 2023. The report was relayed through State Police to Atlantic City air traffic control, but the object was never detected on radar and the case was closed without further investigation.</p>
  <div class="narr">This document is an FAA SKYWATCH Incident Report — a standardised form used when unidentified aerial phenomena are reported to air traffic control facilities. It is classified under the primary code &quot;Unidentified Aerial Phenomenon&quot; and was logged at 18:28 on 25 November 2023.

According to the report, a civilian on the ground in Rio Grande, New Jersey contacted ACECOMM — a State Police unit located on the Airport Operations Area — to report a cylindrical object at the intersection of Route 9 and Route 47. ACECOMM then notified the Atlantic City Air Traffic Control Tower (ACY ATCT).

Air traffic control checked their radar systems but the object was not observed on any ATC facility radar, nor was it seen by ATC personnel. No altitude, speed, or direction of the object was established.

The case status is listed as &quot;Closed.&quot; No further investigation details are provided in the document, and no additional witnesses or sensor data corroborated the sighting.</div>
