  <h1>FAA Radar Tracked Unidentified Object Climbing Near Houston Airport in 2018</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/567b68988dae09bb644cf2f7806bf62d41cec6ae13d7c50a54af27e01b510b60.jpg" alt="FAA Radar Tracked Unidentified Object Climbing Near Houston Airport in 2018 thumbnail" loading="lazy" />
  <p>This is an FAA incident report from 2 March 2018 documenting an unidentified aerial object detected on radar and visually observed near Houston&#39;s William P. Hobby Airport. The object climbed from 1,000 to over 10,000 feet, hovered near a runway approach, and departed to the east-southeast before disappearing from radar — with no impact to air traffic operations reported.</p>
  <div class="narr">On the evening of 2 March 2018, FAA facility I90 — a terminal radar approach control serving the Houston area — detected an unusual radar target over the approach end of Runway 22 at Houston airport. The object was transmitting beacon code 4245 and was observed climbing rapidly from 1,000 feet to 10,100 feet before hovering over the approach end of Runway 31L.

Controllers in the Houston Air Traffic Control Tower visually confirmed the object, describing it as a &quot;large white UAS&quot; (unmanned aerial system — the FAA&#39;s term for a drone or uncrewed aircraft). No pilots in the area reported seeing it. The FAA&#39;s automated tracking system (AADS) struggled to classify the target, cycling its identification tag from &quot;AV1&quot; to &quot;UFO&quot; to &quot;TFC&quot; over the course of roughly nine minutes before the object descended and dropped off radar entirely at 2204 local time. Tower controllers lost sight of it heading east-southeast.

Houston Police Department was notified. The FAA recorded no impact to air traffic control operations, and the case was closed.

The report is categorised under the FAA&#39;s SKYWATCH programme. It is worth noting that while the National Archives metadata assigns a date of 2023 to this record, the incident itself occurred in 2018 — the later date likely reflects when the document was compiled or released as part of a broader records transfer.</div>
