  <h1>NASA Gemini 4 Crew Debriefing Transcript Covers Launch, Not UFO Sightings</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">6/9/65</span>
    <span class="badge">North Atlantic Ocean</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ca596a44820b275f3e3ba41ddabd9ed8f124b68f8c3207d4c34d8afb1a48a94c.jpg" alt="NASA Gemini 4 Crew Debriefing Transcript Covers Launch, Not UFO Sightings thumbnail" loading="lazy" />
  <p>This is Part I of a formerly classified transcript from the Gemini 4 crew debriefing, conducted aboard the USS Wasp on June 9, 1965. It covers the countdown, launch, and orbital insertion — standard mission operations — and explicitly defers the &quot;visual sightings&quot; section to Part II, which is not included in this document.</p>
  <div class="narr">On June 9, 1965, astronauts James McDivitt and Ed White sat down aboard the recovery ship USS Wasp in the North Atlantic to debrief their Gemini 4 spaceflight. The transcript was prepared a week later, on June 16, by NASA&#39;s Spacecraft Operations Branch. It was originally stamped CONFIDENTIAL under US espionage laws and later declassified in 1973.

Part I is purely operational. The crew walked through the countdown, powered flight, staging, and orbital insertion. They reported reaching 7.5 g during ascent and achieving a 153-by-57-nautical-mile orbit. McDivitt noted a brief communications dropout around ten seconds after liftoff when no one acknowledged his &quot;Roll Program&quot; call. The crew also described pogo oscillations — a known vibration issue — during the final seconds of first-stage burn, and compared the noise at maximum aerodynamic pressure to flying an F-80 jet at Mach 0.8.

At booster separation, the spacecraft rotated unexpectedly to one side rather than separating cleanly fore and aft. McDivitt described a blizzard of debris — &quot;like going through a snowstorm.&quot; White inspected the booster&#39;s nozzle skirt visually and reported no damage. A recurring frustration in the transcript is the environmental control system&#39;s water management valves: every version of the checklist the crew received listed different valve positions, and no one on the ground agreed.

Critically for anyone interested in UAP content, this document contains none. The transcript&#39;s preface states that Part II will cover &quot;visual sightings, experiments, pre-mission planning, mission control, and training.&quot; Ed White&#39;s reported observation of unexplained &quot;sparkles&quot; during the mission — the reason this document appears in UAP archives — would be in that second part, which is not included here.</div>
