  <h1>Pentagon Office Finds No Evidence of Extraterrestrial Technology in 78-Year UAP Review</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/512a472c002cc0766a8917797a49f53ed11134173021b5a05d059be566b34149.jpg" alt="Pentagon Office Finds No Evidence of Extraterrestrial Technology in 78-Year UAP Review thumbnail" loading="lazy" />
  <p>The All-domain Anomaly Resolution Office (AARO), a Department of Defense body established in July 2022, published this Volume I report in February 2024 reviewing U.S. government involvement with unidentified anomalous phenomena (UAP) from 1945 to October 2023. It found no evidence that any UAP sighting represented extraterrestrial technology and no evidence that the government or private companies have been reverse-engineering alien craft.</p>
  <div class="narr">This document is an official historical review produced by the Pentagon&#39;s All-domain Anomaly Resolution Office (AARO), published in February 2024 and released in full following a classification review on 5 February 2025. Congress directed the report under Section 6802(j) of the FY2023 National Defense Authorization Act. AARO&#39;s remit was to examine the entire record of U.S. government engagement with UAP — unidentified anomalous phenomena — spanning from 1945 to 31 October 2023.

To conduct the review, AARO identified approximately two dozen separate government investigatory efforts over that period, from early Cold War programmes like Project SIGN (which evaluated 243 UFO sightings) and Project GRUDGE (244 reports) through to modern efforts. The office conducted approximately 30 interviews with current and former government personnel and defence contractors who claimed knowledge of secret UAP-related programmes.

The report&#39;s central conclusion is that AARO found no evidence that any U.S. government investigation, academic study, or review panel has ever confirmed a UAP sighting as extraterrestrial technology. It also found no empirical evidence supporting claims that the government or private companies have been reverse-engineering alien craft. AARO states it was granted full, unrestricted access by all relevant organisations, and that none of the interviewees claiming knowledge of reverse-engineering programmes had firsthand access to or worked on those efforts. Company executives named by interviewees denied on the record ever recovering or possessing extraterrestrial technology.

The report addresses several specific claims. A metal sample alleged to come from a crashed alien spacecraft was laboratory-tested and found to be an ordinary terrestrial alloy of magnesium, zinc, and bismuth. A proposed UAP recovery and reverse-engineering programme called KONA BLUE was never approved by the Department of Homeland Security. One account of an officer touching an extraterrestrial spacecraft was traced back to the officer touching an F-117 Nighthawk stealth fighter. An alleged 1961 intelligence estimate suggesting UFOs were extraterrestrial in origin was assessed as inauthentic. AARO concludes that interviewees mistakenly associated authentic classified national security programmes — advanced aircraft, satellites, and drones — with alien activity.

This is Volume I of a two-volume report. Volume II had not been published at the time of this document&#39;s release, and AARO acknowledged that some claims were still under evaluation.</div>
