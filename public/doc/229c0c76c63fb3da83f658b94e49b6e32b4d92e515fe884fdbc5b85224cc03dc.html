  <h1>Southwest Airlines crew reported flashing lights above their 737 over Virginia</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/229c0c76c63fb3da83f658b94e49b6e32b4d92e515fe884fdbc5b85224cc03dc.jpg" alt="Southwest Airlines crew reported flashing lights above their 737 over Virginia thumbnail" loading="lazy" />
  <p>This FAA preliminary incident report documents a March 2023 sighting by the crew of Southwest Airlines flight 1307, who observed flashing lights above their aircraft at an estimated 100-mile distance while flying at 41,000 feet near Lawrenceville, Virginia. No evasive action was taken and no further investigation is recorded in this document.</p>
  <div class="narr">On 22 March 2023, the crew of Southwest Airlines flight 1307 — a Boeing 737 MAX 8 flying from Fort Myers, Florida to Baltimore, Maryland — reported an unidentified aerial phenomenon to air traffic control. The aircraft was cruising northbound at Flight Level 410 (41,000 feet) approximately 10 nautical miles east of the Lawrenceville VORTAC navigation aid in Virginia when the crew spotted flashing lights on the left side of the aircraft, above them, at an estimated distance of 100 miles.

The sighting was logged by the FAA&#39;s Washington Operations Center as preliminary information relayed through Washington ARTCC (Air Route Traffic Control Center), the facility managing that airspace. The crew reported no evasive action was taken.

The document is a standard FAA Operations Center incident report — a brief, structured form capturing the basics of what was reported. It is not an investigation finding or a conclusion about what the lights were. The FAA logged the event and recorded the crew&#39;s account, but the report contains no follow-up analysis, no radar data, and no sensor corroboration.

There is little evidence of redaction in this document. The report is simply brief by design — these preliminary logs capture who reported what, where, and when, without attempting to explain the phenomenon.</div>
