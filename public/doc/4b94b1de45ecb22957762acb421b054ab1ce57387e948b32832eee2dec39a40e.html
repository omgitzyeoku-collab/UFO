  <h1>Delta Pilots Reported Bright Lights Off California Coast in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/4b94b1de45ecb22957762acb421b054ab1ce57387e948b32832eee2dec39a40e.jpg" alt="Delta Pilots Reported Bright Lights Off California Coast in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a July 2023 sighting by the crew of a Delta Air Lines flight travelling from Seattle to San Diego. The pilots observed bright lights offshore near Oceanside, California, at roughly 21,000 feet. NORAD found nothing on their systems, and the FAA closed the case without identifying the source.</p>
  <div class="narr">On 21 July 2023 at 04:55, the crew of Delta Air Lines flight DAL2110 — a commercial service from Seattle to San Diego — reported an unidentified aerial phenomenon to Los Angeles Air Route Traffic Control Centre (ZLA). The aircraft was heading southeast at flight level 210, roughly 21,000 feet, about 15 nautical miles west-northwest of the Oceanside navigational point on the Southern California coast.

The crew described a set of bright lights offshore, visible off the right side of the aircraft. No altitude for the lights was given, and the crew took no evasive action. The FAA&#39;s headquarters in Denver asked NORAD (the North American Aerospace Defense Command) to check their systems; the result came back negative, meaning no corresponding radar track was found. The FAA&#39;s Aviation Weather Office was also advised.

The report was filed under the FAA&#39;s SKYWATCH programme, which logs pilot-reported sightings of unidentified aerial phenomena. The case is marked as closed. No identification or explanation for the lights appears in the record.

The document itself is short and administrative in nature. There is minimal redaction, but also minimal investigation documented beyond the NORAD check. No photographs, sensor data, or follow-up analysis are referenced.</div>
