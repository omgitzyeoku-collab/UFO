  <h1>FAA Report: Airline Crew Saw Twinkling Lights at 37,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ce0f78a54633378e07b70fdd9f3aebd62a5cd6f915cae725c7ef4cb7269b3135.jpg" alt="FAA Report: Airline Crew Saw Twinkling Lights at 37,000 Feet thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a United Airlines crew&#39;s observation of twinkling lights while flying at 37,000 feet near Sioux Falls, South Dakota on October 15, 2022. The crew themselves described the lights as a &#39;celestial phenomenon,&#39; and the case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under the category &quot;Unidentified Aerial Phenomenon.&quot; It records an observation made by the crew of United Airlines flight 574 (callsign UAL574), which was operating a San Francisco (SFO) to Chicago O&#39;Hare (ORD) route on October 15, 2022.

According to the report, the aircraft was heading northeast at Flight Level 370 (37,000 feet), approximately 50 nautical miles east of Sioux Falls, South Dakota, when the crew observed something off the front of the aircraft. They described it as twinkling lights moving from low on the horizon to high on the horizon. Notably, the crew themselves characterised what they saw as a &quot;celestial phenomenon&quot; — a term that suggests stars, satellites, or a similar prosaic explanation.

The FAA&#39;s internal notification process was triggered: AWO/TY were notified, and the report indicates the incident was paged out (marked &quot;Paged: YES&quot;). However, the case is now marked &quot;Closed&quot; with no resolution or explanation recorded in the document. The tail number field is blank, which limits the ability to independently verify which specific aircraft was involved.

The report is a single-page administrative filing. There is no indication of corroborating radar data, no additional witness accounts, and no follow-up analysis included in the released material.</div>
