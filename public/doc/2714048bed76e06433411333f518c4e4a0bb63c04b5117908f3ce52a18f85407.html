  <h1>FAA logged two unidentified aerial sightings in Frederick County, Maryland</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2714048bed76e06433411333f518c4e4a0bb63c04b5117908f3ce52a18f85407.jpg" alt="FAA logged two unidentified aerial sightings in Frederick County, Maryland thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents two unidentified aerial phenomenon sightings reported by the Frederick County Sheriff&#39;s Office on 2 March 2023. One sighting, near Point of Rocks, Maryland, involved a lighted object described as car-sized hovering over a truck. The case was closed with no follow-up investigation indicated.</p>
  <div class="narr">This document is an FAA (Federal Aviation Administration) SKYWATCH incident report — a standard form used to log reports of unidentified aerial phenomena. It was filed on 2 March 2023 at 02:26 and later closed.

The Frederick County Sheriff&#39;s Office contacted the FAA to relay two civilian reports of unidentified aerial phenomena. The first sighting was reported over Gambrel Park, but no description of the object was provided. The second occurred near Point of Rocks, Maryland, where a caller described a lighted object roughly the size of a car hovering over their truck.

The report was assigned the primary code &quot;Unidentified Aerial Phenomenon&quot; and marked as closed. There is no indication in the document of any follow-up investigation, resolution, or explanation for either sighting.

No radar data, sensor readings, photographs, or direct witness statements appear in the record. The reports passed through at least two intermediaries — civilian callers to the sheriff&#39;s office, then the sheriff&#39;s office to the FAA — before being logged.</div>
