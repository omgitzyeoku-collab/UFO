  <h1>FAA Report: Commercial Crew Spotted Jet Pack Near Los Angeles Airport</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f8c1c94814e25247dc57302397fab54f3aecad633cabd86d9b9808b33b2297da.jpg" alt="FAA Report: Commercial Crew Spotted Jet Pack Near Los Angeles Airport thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a commercial aircraft crew reporting an unidentified aerial phenomenon while flying westbound at 5,000 feet, about 15 nautical miles east of Los Angeles International Airport. The FAA determined the object was a jet pack and closed the case.</p>
  <div class="narr">This document is an FAA (Federal Aviation Administration) SKYWATCH incident report filed under record number 237UAP00061. It records a sighting classified under the primary code &quot;Unidentified Aerial Phenomenon&quot; — the FAA&#39;s formal category for objects aircrew cannot immediately identify.

The report concerns a commercial flight with callsign CKS363, operating from Orlando (MCO) to Los Angeles (LAX). While heading westbound at 5,000 feet, approximately 15 nautical miles east of LAX, the crew reported seeing an unidentified object. The incident was assigned the mandatory occurrence report ID SCT-M-2021/07/28-0007, dating it to late July 2021.

The FAA concluded that the unidentified phenomenon was a jet pack. The case status is listed as closed. Internal FAA notifications were sent to parties identified by the codes &quot;AWO/JH,&quot; though the document does not explain what those codes stand for. No tail number for the aircraft is provided in the report.

This sighting fits within a widely reported cluster of jet pack sightings near LAX during 2020–2021, none of which were fully explained publicly at the time. The report itself is brief and administrative in nature — it records the event and the FAA&#39;s determination, but provides no detail on how the jet pack identification was reached.</div>
