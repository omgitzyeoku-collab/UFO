  <h1>Spirit Airlines Crew Reports Blinking Lights at 35,000 Feet Over West Virginia</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/6ba619764bf95deeaf1be735e34c4b7a57b99d4a7931d5433fe7b49176fc6ed5.jpg" alt="Spirit Airlines Crew Reports Blinking Lights at 35,000 Feet Over West Virginia thumbnail" loading="lazy" />
  <p>An FAA preliminary report documents a UAP sighting by the crew of Spirit Airlines flight 128 on 18 February 2023. The crew observed an object with blinking lights roughly 2,000 feet below their aircraft while flying over West Virginia; no evasive action was taken and no follow-up investigation is recorded.</p>
  <div class="narr">This document is a preliminary information report from the FAA&#39;s Washington Operations Center. It records a sighting of an unidentified aerial phenomenon (UAP) reported by the crew of Spirit Airlines flight 128, an Airbus A320neo flying from Los Angeles to Baltimore-Washington.

On 18 February 2023 at 04:00 Eastern time, Indianapolis Air Route Traffic Control Center relayed that the Spirit Airlines crew had spotted an object with blinking lights off the left side of their aircraft. The crew was flying eastbound at flight level 370 (roughly 37,000 feet) and reported the UAP at flight level 350 (roughly 35,000 feet) — about 2,000 feet below them. The sighting occurred approximately 50 nautical miles west of the Charleston VOR navigation aid in West Virginia.

The crew did not take evasive action, and no law enforcement notification was reported. The document is marked as preliminary and contains no indication of a follow-up investigation or any conclusion about what the object was.

There is little evidence of redaction in this record. The report is brief and factual — a standard FAA operations centre log entry rather than a detailed investigation file.</div>
