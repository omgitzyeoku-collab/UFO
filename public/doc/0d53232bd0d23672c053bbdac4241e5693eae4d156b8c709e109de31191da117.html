  <h1>Air Force Files on 1948 Sightings Include Kansas Meteorite and Philippine Flying Wing</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0d53232bd0d23672c053bbdac4241e5693eae4d156b8c709e109de31191da117.jpg" alt="Air Force Files on 1948 Sightings Include Kansas Meteorite and Philippine Flying Wing thumbnail" loading="lazy" />
  <p>This document compiles US Air Force checklist reports, witness statements, and correspondence covering eleven unidentified flying object incidents from February to April 1948. The most significant case — a massive fireball over Norcatur, Kansas — was resolved as a genuine meteorite fall, while other sightings including a silver flying wing in the Philippines remained unexplained or were attributed to mundane causes like rocket flares or birds.</p>
  <div class="narr">This file, designated DOW-UAP-D088, is a batch of US Air Force investigation records covering incidents numbered 101 through 111, all from early 1948. Each incident follows a standardised checklist format — date, location, observer, description — supplemented by correspondence and follow-up analysis. The document originates from the Department of War and covers sightings across the United States and the Philippine Islands.

The centrepiece is Incident 101: on 18 February 1948, a bluish-white fireball exploded over Norcatur, Kansas, visible across five states — Oklahoma, New Mexico, Colorado, Kansas, and Nebraska. The observer, a local newspaper editor, estimated it at 30–35 miles altitude. Dr Lincoln LaPaz of the Institute of Meteoritics concluded it was a genuine meteorite fall of exceptional size. Recovery efforts beginning 24 April turned up fragments including one piece weighing roughly 109 pounds, buried two feet in a clover field. The meteorite was classified as an achondrite, an unusual type of stony meteorite. Despite this resolution, some witnesses complicated the picture: three tower personnel at McCook Field, Nebraska described the object not as a fireball but as a black object with a bright jet of flame from the rear. A citizen named Norman Markham wrote speculative letters proposing the objects were spacecraft from the Moon — a theory Dr LaPaz explicitly rejected.

Other incidents in the file are briefer. Near Green River, Utah, B-29 bomber crews from the 28th Bombardment Group saw a multi-coloured ball of fire with a dense smoke cloud on the same date as the Norcatur event. Over Smyrna, Tennessee on 7 March 1948, a yellow-orange flare-like object was watched for 45 minutes. At Belmont, North Carolina on 8 March, a credible observer — a Duke Power Company engineer with 30 years&#39; experience — reported a round metallic silver object moving at an estimated 600 miles per hour. Multiple sightings of burning, falling objects over Bakersfield, California in early March were assessed by Fourth Air Force headquarters as probable rocket flares, though no physical evidence was recovered. In Baltimore, Maryland, an unidentified woman reported hearing unusual aircraft engine sounds she described as foreign-sounding, occurring between 3:00 and 5:00 AM over six to eight weeks.

The final incident stands out. On 1 April 1948, 1st Lt Robert W. Meyers, a P-47 fighter pilot with the 67th Fighter Squadron, reported seeing a silver half-moon-shaped flying wing over the Philippine Islands. He described it as roughly 30 feet across with an indistinct dorsal fin. It made a 90-degree left turn, levelled out heading west, accelerated rapidly, and vanished in about five seconds. His three wingmen did not see it. The Far East Air Forces evaluation concluded the object was probably a bird — an assessment that sits uneasily with the pilot&#39;s description of a 30-foot silver craft with rapid acceleration.</div>
