  <h1>Navy Pilot Filed Report on Two Unidentified Objects at 26,000 Feet</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">10/27/20</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c2bd370cdadc2f17649830713d55731aa22ceb76940fd64ae7ffc86fc0559261.jpg" alt="Navy Pilot Filed Report on Two Unidentified Objects at 26,000 Feet thumbnail" loading="lazy" />
  <p>A declassified U.S. Navy Range Fouler Debrief form documents two unidentified contacts that entered controlled military airspace on October 27, 2020, during a nighttime Defensive Counter-Air mission. The pilot obtained radar lock and targeting pod video showing two infrared-significant, balloon-shaped, metallic objects with red blinking strobes — one circling the other — before both vanished from sensors in roughly 1/30th of a second.</p>
  <div class="narr">This document is a standard U.S. Navy Range Fouler Debrief form — a report filed when an unauthorized object enters controlled military airspace during operations. It was declassified by Major General Richard A. Harrison and approved for release to AARO (the All-domain Anomaly Resolution Office) by U.S. Central Command.

On the night of October 27, 2020, during a Defensive Counter-Air mission, a military operator detected two unknown contacts at approximately 26,000 feet. A command authority identified as KINGPIN directed the pilot to identify the contacts. The pilot obtained radar lock and captured targeting pod video, but was unable to close within 16.9 nautical miles. The targeting pod showed two infrared-significant contacts. The radar produced a stable trackfile on the objects.

The operator categorized the contacts as balloon-shaped, metallic, reflective, and opaque. A visual observation confirmed two red blinking strobes. One object was circling the other. The contacts were moving and their altitude was not constant, with winds at their altitude recorded at 060 degrees at 20 knots. The report also notes electronic warfare indications: false trackfiles appeared, and noise jamming was received, shown as two chevrons on the display.

Both contacts then vanished in what the operator described as approximately 1/30th of a second. The document does not offer an explanation or conclusion about what the objects were.

Significant portions of the form are redacted under privacy exemptions, including the reporter&#39;s name, squadron (partially visible as related to &quot;EFS&quot;), email address, contact coordinates, and some reference data.</div>
