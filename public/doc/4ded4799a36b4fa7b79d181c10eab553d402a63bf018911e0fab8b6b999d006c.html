  <p>This record is a CIA-held declassification cover sheet for a 1971 Australian Department of Defence document that reviewed the US Air Force&#39;s Project Blue Book UFO investigation programme. Only the cover sheet text is available — the substantive body of the document is not readable.</p>
  <div class="narr">In 2026, the CIA released this record under Section 1842 of the National Defense Authorization Act for Fiscal Year 2024. It is catalogued as an Australian Department of Defence document from 1971 that reviewed the scientific and intelligence aspects of the UFO problem, specifically examining the US Air Force&#39;s Project Blue Book — the American military&#39;s long-running programme to investigate UFO reports.

However, what is actually available here is extremely limited. The record is classified as an image file (IMG), and only the declassification cover sheet text could be extracted. The cover sheet confirms the document was approved for public release in 2026 under the NDAA provision. The substantive body — whatever the Australian Defence review actually found or concluded about Project Blue Book — is not present in the extractable text.

The extracted cover sheet text itself shows signs of poor image quality, with OCR errors such as &#39;Sithorizacion&#39; (Authorization) and &#39;Yesr&#39; (Year), suggesting the source material is heavily degraded.

The level of redaction is assessed as extreme. No named individuals, specific places, described objects, or conclusions from the Australian review are available from this release. All subject-matter details about the document&#39;s contents come from catalogue metadata rather than from the document body itself.</div>
