  <h1>Two Pilots Over Alaska Reported Same Unidentified Bright Light</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c6f58c775c00325679e38c9ee05954f9d27d3098fe935879a5c711d392de4f7f.jpg" alt="Two Pilots Over Alaska Reported Same Unidentified Bright Light thumbnail" loading="lazy" />
  <p>This FAA incident report documents a UPS cargo pilot sighting of an unexplained bright white light above their aircraft over Alaska in April 2023, corroborated by a second aircraft on a similar route. The FAA assessed it as consistent with a Starlink satellite train and closed the case.</p>
  <div class="narr">On 10 April 2023 at 11:08 UTC, a UPS commercial flight cruising at 35,000 feet reported an unidentified aerial phenomenon while flying northeast-bound over Alaska, roughly 148 nautical miles northwest of Sparrevohn. The crew described a bright white light at an unknown altitude above them, visible off the aircraft&#39;s left side. The flight was en route from Incheon, South Korea to Anchorage.

The sighting was not isolated. A second aircraft — callsign AJT1020, a Boeing 767 also flying from Incheon to Anchorage at 33,000 feet — independently reported the same light.

The FAA&#39;s assessment concluded the sighting was consistent with a train of Starlink satellites travelling over Alaska. The original document spells it &quot;Skylink,&quot; which appears to be a typo. The case was closed with no further investigation referenced.

No sensor data, radar tracks, or imagery are attached to this report. It is a single-page incident record from the FAA&#39;s SKYWATCH reporting system, not a detailed analytical product.</div>
