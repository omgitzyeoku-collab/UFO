  <h1>Seven Airline Crews Reported White Objects Near El Paso in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3694586e6193953536f9d63994f1890f365779abecaa6530f094bc5c48bc30ca.jpg" alt="Seven Airline Crews Reported White Objects Near El Paso in 2023 thumbnail" loading="lazy" />
  <p>This FAA operations center notification documents an incident on 26 August 2023 in which seven commercial flights observed white objects flying at 34,000–40,000 feet roughly 70 nautical miles east-northeast of El Paso, Texas. The objects were presumed to be Starlink satellites, but that identification was not confirmed.</p>
  <div class="narr">On the evening of 26 August 2023, the crew of United Airlines flight 1491 — a Boeing 737 MAX flying from Houston to Las Vegas — reported seeing white objects while cruising westbound at 36,000 feet. The objects were observed at altitudes between 34,000 and 40,000 feet, approximately 70 nautical miles east-northeast of El Paso, Texas.

The sighting was not limited to one aircraft. Six other flights — Alaska Airlines 25, American Airlines 2697, Southwest 4691, ABX Air 3151, Frontier 1549, and SkyWest 3147 — reported observing the same phenomenon. Albuquerque Air Route Traffic Control Center (ARTCC) was advised of the reports.

No evasive action was taken by any of the aircraft. The objects were presumed to be Starlink satellites, though the document uses the word &quot;presumed&quot; rather than &quot;confirmed.&quot; Law enforcement was not notified.

This record is a brief FAA Washington Operations Center incident notification — an internal operational log entry, not a detailed investigation report. There is no indication that a follow-up investigation was conducted, and the document contains minimal redaction.</div>
