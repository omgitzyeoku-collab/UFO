  <h1>Alaska Airlines Pilot Reported Slow-Moving Light at 40,000–50,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0a929cdf2df8ab7d272de16dc6c870d80e0a902840054c818c393f6b87c4d494.jpg" alt="Alaska Airlines Pilot Reported Slow-Moving Light at 40,000–50,000 Feet thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from February 2019 in which an Alaska Airlines pilot flying from Los Angeles to Seattle reported a slow-moving object with a white flashing light at an estimated 40,000–50,000 feet. Seattle Center radar picked up a primary target at the reported location showing just 20 knots, and the Western Air Defense Sector was notified, but the report was closed with no identification or explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under record number 237UAP00037. It records a UFO sighting made by the pilot-in-command of Alaska Airlines flight 428, a Boeing 737-900 operating from Los Angeles (LAX) to Seattle (SEA). The reporting facility was Seattle Center (ZSE), the FAA&#39;s air traffic control centre for that region.

While flying southbound at approximately 35,000 feet (flight level 350), the pilot reported seeing an object with a white flashing light moving slowly to the northeast. The pilot estimated the object was at 40,000 to 50,000 feet — above typical commercial airline cruising altitude. A Seattle Center controller then observed a primary radar target in the same area showing a groundspeed of just 20 knots, which is unusually slow for anything at that altitude.

The Western Air Defense Sector (WADS), the military unit responsible for air defence over the western United States, was notified of the sighting. Despite this, the report contains no follow-up investigation details, no identification of the object, and no resolution. The case is simply marked as closed.

The document itself is brief and administrative in nature. It contains no photographs, no detailed radar data, and no witness statements beyond the pilot&#39;s initial report. There is little evidence of redaction, but equally little evidence that any further inquiry took place.</div>
