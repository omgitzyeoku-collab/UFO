  <h1>Commercial Pilot Reports Large Balloon at 50,000 Feet Over Kansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/8f38393d144747f566bfac07e4cb5dae56e2c06f495d2146ffeab522311ff981.jpg" alt="Commercial Pilot Reports Large Balloon at 50,000 Feet Over Kansas thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a commercial airline crew observing a large balloon at an unusually high altitude while flying over the central United States on 3 February 2023. The case was closed with no identification or resolution noted.</p>
  <div class="narr">On 3 February 2023, the crew of a commercial Airbus A321 flying under callsign ROU1721 reported spotting a large balloon while travelling westbound at 32,000 feet. The aircraft was on a route from Toronto (CYYZ) to Phoenix (PHX) and was approximately 20 nautical miles north of BQS when the crew observed the object off the left side of the aircraft. They estimated the balloon was at roughly 50,000 feet or higher.

The sighting was logged through the FAA&#39;s SKYWATCH system and reported to Kansas City Center (ZKC), the air traffic control facility covering that region. The FAA classified the event under its &quot;Unidentified Aerial Phenomenon&quot; code. The report from the Denver (DEN) point of departure is brief and contains no mention of radar tracking or other sensor data that might have corroborated the visual observation.

The case status is listed as Closed, but the report includes no resolution — meaning the FAA did not record a final determination of what the object was. There is little evidence of redaction in the document itself; the record is simply short and limited in detail.

The date is notable: 3 February 2023 fell during a period when several high-altitude balloon objects were being tracked over North America, including a Chinese surveillance balloon that was shot down the following day, on 4 February 2023. Whether this sighting is connected to those events is not stated in the report.</div>
