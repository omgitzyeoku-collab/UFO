  <h1>United Airlines Pilot Reports Bright Lights Over Northern Sky</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/87833d89405c7b5ca55575dcfb2b05cdc9e3a200d33d372ad46f04c97e3038f4.jpg" alt="United Airlines Pilot Reports Bright Lights Over Northern Sky thumbnail" loading="lazy" />
  <p>This FAA incident report documents a United Airlines pilot observing bright lights appearing to orbit at high altitude near the Big Dipper constellation while flying from Chicago to Dublin on 26 September 2023. The case was closed with no explanation or resolution provided.</p>
  <div class="narr">On 26 September 2023 at 05:27, the crew of United Airlines flight 980 — a Boeing 757 flying eastbound from Chicago O&#39;Hare to Dublin, Ireland — reported seeing something unusual while cruising at 35,000 feet. The pilot described bright lights orbiting at high altitude in the vicinity of the Big Dipper constellation, visible in the northern sky and possibly over Canadian airspace.

The sighting was logged by the FAA under its SKYWATCH programme as an Unidentified Aerial Phenomenon, case number 237UAP00301. The FAA&#39;s Aviation Weather Office was notified, which suggests the agency may have considered whether atmospheric or astronomical conditions could explain the lights. No findings from that referral appear in the record.

The case is marked as Closed. No resolution, explanation, or follow-up investigation findings are included in the document. There is no mention of corroborating radar data, sensor readings, or reports from other aircraft.

The report originates from a single pilot observation. While the document confirms the flight details and the nature of the sighting, it offers no conclusion about what the lights were.</div>
