  <p>This file is an FBI-produced digital rendering — an artistic interpretation, not a photograph — of an unresolved Unidentified Anomalous Phenomena (UAP) incident reported near Colorado Springs, Colorado in 2022. The image itself contains no readable text; all factual context comes from its metadata and its parent document, FBI-UAP-D002.</p>
  <div class="narr">This document, catalogued as FBI-UAP-D003, is a digital rendering produced by the FBI. It is an artistic interpretation of a UAP incident reported near Colorado Springs, Colorado in 2022. It is not a photograph, sensor capture, or any other direct recording of an actual event.

The rendering is derived from a parent document, FBI-UAP-D002, which is an FD-1057 form — a standard FBI reporting template — containing a first-hand narrative of the incident. The details of what was observed are recorded in that parent document, not in this image.

The image file itself contains no meaningful textual content. When text-extraction tools were run against it, they produced only garbled, unreadable output — a predictable result of attempting OCR (optical character recognition) on an image rather than a text document.

The incident remains officially unresolved. The FBI has not published a conclusion about what the reported object was, based on the materials available in this release.

Readers should note that all factual context about this file — the agency, incident date, and location — comes solely from the release metadata and filename, not from any content within the image itself.</div>
