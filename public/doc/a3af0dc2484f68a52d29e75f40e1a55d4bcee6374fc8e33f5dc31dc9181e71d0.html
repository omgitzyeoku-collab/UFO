  <h1>Five Eyes Nations Held First Joint UAP Meeting at the Pentagon</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>This document is an internal email chain from AARO (the Pentagon&#39;s UAP office) coordinating the first-ever Five Eyes UAP working group meeting, held at the Pentagon on May 24, 2023. The agenda covered UAP updates from U.S. agencies and all four allied nations, plus plans for shared reporting networks and databases — but no meeting outcomes or minutes are included.</p>
  <div class="narr">In May 2023, the All-domain Anomaly Resolution Office (AARO) organized what it called the &quot;inaugural FVEY UAP Caucus Working Group&quot; — the first formal meeting on unidentified anomalous phenomena (UAP) among the Five Eyes intelligence alliance. The Five Eyes (FVEY) comprises the United States, United Kingdom, Australia, Canada, and New Zealand. The meeting was held at the Pentagon on May 24, 2023, in a room rated for Top Secret/Sensitive Compartmented Information (TS/SCI), the highest common classification level.

The released document is not a record of what happened at the meeting. It is the email chain used to plan it. AARO director Dr. Sean Kirkpatrick and other staff (whose names are redacted) coordinated the agenda, logistics, and visitor access. The agenda called for U.S. updates from AARO, the Office of the Director of National Intelligence (ODNI), the FAA, NASA, and National Intelligence Managers for Aviation and Maritime (NIM-A and NIM-M), followed by UAP updates from each of the four allied nations.

The stated purpose was to build shared awareness of each country&#39;s UAP issues, detection and identification efforts, and opportunities for collaboration. Specific discussion topics included establishing networks to share UAP reports at multiple classification levels, creating shared databases of known objects detected by various sensors, coordinating collection planning, and scheduling future meetings.

The emails are marked as deliberative process privileged under FOIA exemption (b)(5), meaning some content may have been withheld beyond the visible redactions. Multiple participants&#39; names are blacked out under personal privacy exemptions. No outcomes, conclusions, or follow-up actions from the meeting itself appear in the released material.</div>
