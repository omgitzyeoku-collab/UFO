  <h1>Federal Agent Reports Bright Orbs Expelling Red Lights Over Western US</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">October, 2023</span>
    <span class="badge">Westen United States</span>

  <img class="thumb" src="/extract/thumbs/97ceb2b4070915ec48c9d22a02e5796bb92f8255cf2864853cb727eebe825e2b.jpg" alt="Federal Agent Reports Bright Orbs Expelling Red Lights Over Western US thumbnail" loading="lazy" />
  <p>This unclassified Department of War document is a first-hand witness statement from a U.S. federal law enforcement agent who observed bright orb-like lights expelling smaller red lights over two evenings in October 2023. The agent was originally surveying for drone activity in a valley in the western United States when the sighting occurred, and multiple teams in the area confirmed seeing the same objects.</p>
  <div class="narr">This document, designated DOW-UAP-D080, is a narrative statement provided to the All-domain Anomaly Resolution Office (AARO) by a federal law enforcement special agent identified only as &quot;Witness 2.&quot; The statement describes events the witness observed in October 2023 while on assignment in a valley in the western United States, where the agent and their partner had been tasked with surveying for individuals launching drones.

At approximately 7:00 PM on a clear evening, the witness observed a bright circular orb-like light positioned roughly 35 to 45 degrees above the northern/northeastern horizon. The light had a smaller red orb-like light within it and emitted what the witness described as a bright &quot;aural&quot; glow with a slight halo effect — distinct from an artificial neon light. Over the next 30 minutes, the orb expelled groups of three or four smaller red lights approximately five times. Each group of red lights was roughly one-fifteenth the size of the main orb and accelerated instantly into coordinated horizontal formations.

After the expulsion phase ended around 7:30 PM, the red lights hovered above the southern horizon in an aligned, equally spaced formation until approximately 11:00 PM — a span of about three and a half hours. The red lights occasionally dipped below the horizon before rising back up. Other law enforcement teams positioned throughout the area independently confirmed observing the same objects.

The document is marked UNCLASSIFIED and dated 2 June 2026. It contains no photographs, sensor data, or instrument readings — it is purely observational testimony. Notably, the document appears to be truncated, ending mid-sentence, which means additional details from the witness may exist but were not captured in this release.</div>
