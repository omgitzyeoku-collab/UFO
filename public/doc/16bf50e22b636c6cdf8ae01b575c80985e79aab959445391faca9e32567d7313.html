  <h1>Commercial Pilot Reported Silver UFO at 29,000 Feet Near Raleigh-Durham</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/16bf50e22b636c6cdf8ae01b575c80985e79aab959445391faca9e32567d7313.jpg" alt="Commercial Pilot Reported Silver UFO at 29,000 Feet Near Raleigh-Durham thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a commercial airline pilot on flight AWI3763 reporting a silver unidentified flying object passing overhead at 29,000 feet, roughly 13 nautical miles southwest of Raleigh-Durham International Airport (RDU), on 26 December 2020. The case was classified under the code &quot;UAS&quot; (Unmanned Aircraft System) and is now closed, with no evasive action taken and no corroborating radar data included.</p>
  <div class="narr">On 26 December 2020, at 20:55 local time, the pilot of a CRJ2 regional jet operating as commercial flight AWI3763 reported seeing a silver unidentified flying object pass overhead. The aircraft was flying northeast at 29,000 feet, approximately 13 nautical miles southwest of Raleigh-Durham International Airport (RDU), on a route from Columbia, South Carolina (CAE) to Washington Dulles (IAD).

The pilot did not take evasive action. The FAA&#39;s UFO reporting centre was notified by headquarters in Denver (HQ DEN) at 21:45, roughly 50 minutes after the sighting. No further details about the object — its size, shape, speed, or behaviour — appear in the report beyond the word &quot;silver&quot;.

The FAA assigned the incident the primary code &quot;UAS&quot; (Unmanned Aircraft System), though this may reflect a default categorisation rather than a confirmed identification. The case status is listed as closed. The document contains no indication of follow-up investigation, radar corroboration, or additional witness accounts.

Notably, the incident itself dates to December 2020, though it was surfaced as part of the Department of War&#39;s 2023 PURSUE public release. This suggests it is a historical record included in the broader disclosure effort rather than a newly reported event.</div>
