  <h1>Commercial Pilot Reports Fast-Moving Unidentified Object at 34,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bbe3be54f39f7166a35a4194718b61c3324813489092fc1bd396a1b6b9dc56d3.jpg" alt="Commercial Pilot Reports Fast-Moving Unidentified Object at 34,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a brief sighting by the crew of a commercial flight (callsign NKS75) traveling from Newark to Los Angeles on 9 October 2022. The crew observed an unidentified object moving westbound at high speed ahead of their aircraft at 34,000 feet, but it was only visible for 10–15 seconds and the case was closed with no identification or resolution noted.</p>
  <div class="narr">On 9 October 2022 at 02:47, the crew of a commercial flight operating under callsign NKS75 — flying westbound from Newark (EWR) to Los Angeles (LAX) — reported an unidentified aerial phenomenon to Denver Air Route Traffic Control Center (ZDV). The aircraft was cruising at Flight Level 340, roughly 34,000 feet.

The crew described an unknown object directly ahead of them (at the 12 o&#39;clock position), traveling westbound at a high rate of speed. It appeared to pass between their aircraft and two other aircraft approximately 30 miles ahead. The entire observation lasted only 10–15 seconds.

The FAA logged the event through its SKYWATCH reporting system. The report is brief and contains no mention of corroborating radar data, recordings, or observations from the two aircraft ahead. Notably, the report&#39;s final sentence refers to the phenomenon as an &quot;aircraft,&quot; suggesting the crew perceived it as a physical craft, though it remains formally unidentified.

The case is marked as closed. No explanation or identification was provided in the document. There is minimal redaction — the report appears to be a short, routine incident filing rather than a detailed investigation.</div>
