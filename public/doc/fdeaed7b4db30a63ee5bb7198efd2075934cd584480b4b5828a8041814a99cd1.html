  <h1>Commercial Pilot Reports Three Spiralling Lights Over the Gulf of Mexico</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/fdeaed7b4db30a63ee5bb7198efd2075934cd584480b4b5828a8041814a99cd1.jpg" alt="Commercial Pilot Reports Three Spiralling Lights Over the Gulf of Mexico thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a February 2024 sighting by the crew of American Airlines flight AAL2054, who observed three white lights performing tight spiral manoeuvres at roughly 45,000 feet while en route from Phoenix to Miami. The lights did not appear on air traffic control radar, and the FAA closed the case without offering an explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log pilot observations of unidentified aerial phenomena (UAP). It was filed under case number 237UAP00358.

On 20 February 2024 at 10:04, the crew of American Airlines flight AAL2054, a commercial service from Phoenix (PHX) to Miami (MIA), reported seeing an unidentified aerial phenomenon off the left side of the aircraft. The plane was flying southeast at flight level 370 (37,000 feet), approximately 200 nautical miles south-southeast of Crestview, Florida — placing the sighting over or near the Gulf of Mexico.

The crew described three white lights making tight spirals at approximately flight level 450 (45,000 feet), roughly 8,000 feet above the aircraft. Air traffic control checked their radar systems and found no corresponding target — the lights were not visible on ATC radar.

The FAA marked the case as closed. The report contains no resolution, no identified explanation for what the crew observed, and no record of follow-up investigation. No tail number for the aircraft was recorded in the report.

The document carries minimal redaction. What it offers is a single, brief pilot observation logged through official channels, with no corroborating sensor data or second-source confirmation.</div>
