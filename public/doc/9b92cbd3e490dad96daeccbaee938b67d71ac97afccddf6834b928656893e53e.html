  <h1>FAA Logs Pilot Report of Fast-Moving Lights Over Massachusetts</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9b92cbd3e490dad96daeccbaee938b67d71ac97afccddf6834b928656893e53e.jpg" alt="FAA Logs Pilot Report of Fast-Moving Lights Over Massachusetts thumbnail" loading="lazy" />
  <p>This is an FAA Washington Operations Center incident report from February 2023 documenting a commercial airline crew&#39;s sighting of a &#39;string of lights moving at a high rate of speed&#39; over Chester, Massachusetts. The FAA itself noted the sighting possibly correlates with Starlink satellites over the area at that time.</p>
  <div class="narr">On 13 February 2023 at 6:20 PM Eastern, the pilot in command of Henson 6044 — an Embraer E145 regional jet flying from Boston to Harrisburg — reported seeing a string of lights moving at a high rate of speed. The aircraft was at Flight Level 260 (roughly 26,000 feet) over Chester, Massachusetts.

Boston Air Route Traffic Control Centre (ARTCC) was advised of the sighting. Other aircraft in the area also reported observing the same phenomenon, though their call signs were not obtained, which limits independent verification.

The FAA&#39;s own log entry notes that the sighting &#39;possibly correlates to Starlink satellites over Massachusetts at this time.&#39; Strings of lights are a frequently reported visual pattern associated with Starlink satellite trains shortly after launch.

This document is a preliminary operations centre log entry from the FAA Washington Operations Center — not a full investigation report. No conclusions were reached beyond the Starlink correlation note. There is little evidence of redaction in this record.</div>
