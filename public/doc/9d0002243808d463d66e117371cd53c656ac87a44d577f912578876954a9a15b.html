  <h1>Three Aircraft Crews Reported Unexplained Lights Near Birmingham, Alabama</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9d0002243808d463d66e117371cd53c656ac87a44d577f912578876954a9a15b.jpg" alt="Three Aircraft Crews Reported Unexplained Lights Near Birmingham, Alabama thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a sighting on 2 May 2023 in which a Citation V aircraft inbound to Birmingham, Alabama reported bright lights of changing intensity circling counterclockwise at high altitude north of the city. Two other aircraft — a Cessna 208 and a Pilatus PC-12 — independently reported the same lights in the same location. The case was closed with no explanation recorded.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00261. It records an unidentified aerial phenomenon (UAP) sighting that occurred on 2 May 2023 near Birmingham, Alabama.

A Citation V aircraft (callsign LN10UH), flying from Pensacola to Birmingham, reported seeing bright lights ahead of it while inbound from the south. The crew described the lights as changing in intensity and circling counterclockwise north of Birmingham at high altitude. The Birmingham reporting facility logged the event and a page was issued.

Two other aircraft independently corroborated the sighting. A Cessna 208 (registration N414CY), on a route from Birmingham to Meridian, Mississippi, and a Pilatus PC-12 (callsign SKQ37), flying from Baton Rouge to Birmingham, both reported seeing the same lights in the same location. Three separate crews observing the same phenomenon from different positions is notable for a UAP report of this kind.

The FAA marked the case as closed. No resolution, explanation, or follow-up analysis is recorded in the document. There is no reference to radar data, photographs, or sensor readings — the report is based entirely on what the pilots saw with their eyes.

The operator name and tail number fields for the primary reporting aircraft are blank, which limits full identification. The time is logged as 06:21, likely in UTC per FAA convention, though the timezone is not explicitly stated.</div>
