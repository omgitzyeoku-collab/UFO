  <h1>Navy Crew Tracked Round Cold Object Over Gulf of Aden in 2020</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">10/15/20</span>
    <span class="badge">Arabian Sea</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/c5cfbc8bacca29db64346aaa03846a6e36eab01ac09e1e93d8d50028593cf3f9.jpg" alt="Navy Crew Tracked Round Cold Object Over Gulf of Aden in 2020 thumbnail" loading="lazy" />
  <p>A U.S. Navy Range Fouler Reporting Form records a one-minute encounter with an unidentified round object detected on infrared sensors over the Gulf of Aden on October 15, 2020. The object was slow-moving at roughly 20 mph but made abrupt directional changes, and the document is heavily redacted throughout.</p>
  <div class="narr">On October 15, 2020, a military crew from the 1172 ATKS squadron was flying an intelligence, surveillance, and reconnaissance (ISR) mission at 19,073 feet above terrain over the Gulf of Aden in the Arabian Sea. At 14:18 Zulu time, their infrared sensor picked up an unauthorized object in controlled airspace. The encounter lasted approximately one minute.

The crew described the object as round and cold on infrared. Their sensor was set to &quot;black hot&quot; mode, meaning warm objects appear dark and cold objects appear bright — and this object showed up bright white, indicating it was colder than the surrounding environment. It was traveling northwest at roughly 20 miles per hour and made several abrupt directional changes during the brief observation. The sensor was pointed about 50 degrees below the aircraft, with the object at a slant range of 4.06 nautical miles and a ground range of 4.78 kilometers.

The reporting form was filed by a junior officer (O-2 rank) and documents a single crew member&#39;s observation. No corroborating sensor data or independent witnesses are referenced anywhere in the form. The document itself notes that all descriptive language reflects the reporter&#39;s subjective interpretation at the time.

The form is heavily redacted under privacy exemptions. The observer&#39;s name, email, geographic coordinates, aircraft side number, bureau number, and contact details are all blacked out. The document was approved for public release on March 27, 2026, under USCENTCOM case numbers MOR 26-0038 through 26-0046.</div>
