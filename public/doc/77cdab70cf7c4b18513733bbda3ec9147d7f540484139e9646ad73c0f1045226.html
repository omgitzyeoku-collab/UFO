  <h1>JetBlue Pilot Reported Three Stationary Lights at 36,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/77cdab70cf7c4b18513733bbda3ec9147d7f540484139e9646ad73c0f1045226.jpg" alt="JetBlue Pilot Reported Three Stationary Lights at 36,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a JetBlue commercial pilot flying an Embraer E190 who observed three lights turning on and off, stationary above the horizon, while cruising at 36,000 feet on 6 August 2022. The case was closed with no explanation provided.</p>
  <div class="narr">On 6 August 2022 at 03:47, the crew of a JetBlue commercial flight (callsign JBU1234) filed a report with the FAA describing an unidentified aerial phenomenon. The aircraft, an Embraer E190, was flying northwest-bound at 36,000 feet on a route between San Juan (SJU) and Orlando (MCO).

The crew reported seeing three lights off the right side of the aircraft, approximately 115 nautical miles southeast of the ZQA air traffic control area. The lights were described as turning on and off, stationary, and positioned above the horizon. No shape, size, or movement trajectory was recorded beyond the description of the lights being stationary.

The FAA classified the incident under its SKYWATCH programme with the primary code &quot;Unidentified Aerial Phenomenon.&quot; The TY/UFO reporting centre was notified. The case is marked as closed, but the document provides no resolution or explanation for what the lights were.

No corroborating radar data or additional witness accounts from other aircraft are included in this record. No tail number for the aircraft was logged, which limits further verification. The level of redaction in the document is low — the information is sparse rather than censored.</div>
