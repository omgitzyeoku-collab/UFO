  <h1>Delta Pilot Reports Two Lit Objects Above Flight Over Arkansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/21993b69fa7c6689c9c17cf97ab4d1b7f09cd0ca7e7d09ff8db647c14d63d52a.jpg" alt="Delta Pilot Reports Two Lit Objects Above Flight Over Arkansas thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Delta Air Lines pilot who spotted an unidentified aerial phenomenon while flying at 39,000 feet over northwest Arkansas on 14 January 2023. The pilot described what appeared to be two aircraft with red and white lights positioned above the plane at very high altitude, but no follow-up investigation or explanation is recorded.</p>
  <div class="narr">On 14 January 2023 at 4:35 AM Central Time, the pilot of Delta Flight 726 — an Airbus A330 flying from Maui to Atlanta — reported an unidentified aerial phenomenon to air traffic control. The aircraft was eastbound at flight level 390 (roughly 39,000 feet) over the Razorback VORTAC, a navigation point near Fayetteville, Arkansas, at coordinates 36.06°N, 94.16°W.

The pilot described the objects as above the aircraft at the 11 o&#39;clock position — meaning slightly to the left and ahead. According to the report, the phenomenon appeared to be two aircraft with red and white lights at a very high altitude, well above the already-high cruising altitude of the A330.

The report was filed as preliminary information by the FAA Washington Operations Center under reference WOC 7-3333 DJ/RC. It is marked as preliminary, and no follow-up investigation, radar corroboration, or final resolution appears in this record.

The document contains no redactions of note and no indication that the FAA identified the objects. The pilot&#39;s own language — that the lights &quot;appeared to be two aircraft&quot; — suggests the objects had conventional visual characteristics, though their reported altitude above 39,000 feet was unusual enough to warrant a report.</div>
