  <h1>US Air Force Ordered Standardised UFO Reporting Procedures in 1949</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/879e35dffa0b4a126fc114f6f402a2ca398bd0b6e4718e12f377e7a65e1a3170.jpg" alt="US Air Force Ordered Standardised UFO Reporting Procedures in 1949 thumbnail" loading="lazy" />
  <p>This 1949 memorandum from the US Air Force&#39;s intelligence directorate established mandatory procedures for reporting sightings of unconventional aircraft and unidentified flying objects, including &#39;Flying Discs.&#39; It is a policy document — it sets out what to collect and where to send it, but does not describe any specific sighting or incident.</p>
  <div class="narr">On 15 February 1949, the US Air Force Directorate of Intelligence issued Air Intelligence Requirements Memorandum Number 4, titled &#39;Unconventional Aircraft.&#39; Classified as RESTRICTED and signed by Major General C. P. Cabell, Director of Intelligence, the memorandum replaced earlier Army directives from January and March 1948 on the same subject. Its purpose was to standardise how the military collected and reported information about UFO sightings, including objects referred to as &#39;Flying Discs.&#39;

The memorandum instructed all military commands, air attachés, and partner agencies — including the FBI, CIA, Coast Guard, and Naval Intelligence — to forward sighting reports immediately via electrical transmission to Air Materiel Command at Wright-Patterson Air Force Base in Dayton, Ohio. Written reports were to be filed on AF Form 112.

The reporting checklist was thorough. Observers were expected to document the object&#39;s appearance, propulsion, control surfaces, sound, speed, and manner of disappearance. Investigators were told to check nearby aircraft surfaces with Geiger counters for radioactivity if a UFO came close, and to collect soil samples if an object contacted the ground. Observer reliability was to be verified through FBI records, employers, neighbours, and local police. Signed statements and any physical fragments were to be secured.

The document was distributed across the US intelligence community, with named recipients including the Director of Central Intelligence, Army and Naval Intelligence chiefs, the Coast Guard, and the FBI Director. It was later declassified under the FBI&#39;s Automatic Declassification Guide, issued 24 May 2007.

This is an administrative directive, not an investigation report. It reveals that by early 1949, the Air Force had formalised UFO reporting into a structured intelligence-collection process — but the document itself contains no observational data or conclusions about any specific sighting.</div>
