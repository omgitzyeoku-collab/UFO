  <h1>Turkish Airlines crew reported flashing object climbing and descending at 31,000 feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2b9e2111154690648bfa28656475bd1f4218d4592394cd1cf420b592eea21133.jpg" alt="Turkish Airlines crew reported flashing object climbing and descending at 31,000 feet thumbnail" loading="lazy" />
  <p>An FAA incident report documents the crew of Turkish Airlines flight TAI580 observing an unidentified aerial phenomenon with rapidly flashing white lights while flying at 31,000 feet on 11 August 2023. The pilot stated they see the same object every time they pass through the area, ruled out satellites, and three defence agencies were notified — but the case was closed with no explanation.</p>
  <div class="narr">This is an FAA SKYWATCH incident report — a standardised form the agency uses to log pilot sightings of unidentified aerial phenomena. It was filed on 11 August 2023 at 06:39 UTC by Washington Center (ZDC), the FAA facility handling air traffic in that region.

The report describes what happened aboard Turkish Airlines flight TAI580, an Airbus A320 heading to Washington Dulles Airport. While flying northbound at 31,000 feet along the RDU235030 airway, the crew observed an unknown object displaying rapidly flashing white lights that was climbing and descending. No size, shape, or distance to the object was recorded.

One detail stands out: the pilot-in-command told controllers they see this object every time they pass through this area of the United States, and did not believe it was low-Earth-orbit satellites. The report notes that three agencies were notified — EADS (Eastern Air Defense Sector), NORAD (North American Aerospace Defense Command), and NCRCC (National Capital Region Coordination Center).

The case status is listed as &quot;Closed.&quot; No resolution, identification, or follow-up findings appear in the document. There is no radar data, no corroborating sensor evidence, and no indication that the repeated-sighting claim was investigated further.</div>
