  <h1>Cargo Pilot Reports White UAP Near Victoria, Texas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7f6bff5b8cc8206938c87a9a9fb72a6918b8bde9bc1dcd7eb26a4a8ed91048a4.jpg" alt="Cargo Pilot Reports White UAP Near Victoria, Texas thumbnail" loading="lazy" />
  <p>This FAA operations center log records a cargo pilot&#39;s sighting of a white unidentified anomalous phenomenon (UAP) while flying at 4,000 feet near Victoria, Texas on 29 March 2024. The pilot took no evasive action and law enforcement was not notified — the report is a brief incident log, not a full investigation.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report — essentially a standardised log entry recording that something unusual was reported during a flight. It is not an investigation report and draws no conclusions about what the object was.

On 29 March 2024, the pilot of Martinaire flight 685, a Cessna C208 cargo aircraft, reported seeing a white UAP directly ahead (the &quot;12 o&#39;clock position&quot;) while flying southwest at 4,000 feet, roughly 22 nautical miles northwest of Victoria, Texas. Martinaire is a regional cargo airline, so this was likely a freight run rather than a passenger flight.

The sighting was relayed by Houston Air Route Traffic Control Center (ARTCC) — the facility responsible for managing high-altitude and en-route air traffic in that region — to the FAA Operations Center. The pilot did not take evasive action, and law enforcement was not contacted.

The report includes coordinates (approximately 29.08°N, 96.67°W) but provides very little detail about the object itself — only that it was white. There is no description of its shape, size, speed, or how long the pilot observed it. The FAA log does not include any radar data, additional witness accounts, or follow-up analysis.</div>
