  <h1>Pentagon Emails Show Secret UAP Report Approved for Public Release</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">3/23/26</span>
    <span class="badge">Pacific Time Zone</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f21f4ae91e51810bfa8a6fce6c422f2bbf99c6277871846c642f987954c042f6.jpg" alt="Pentagon Emails Show Secret UAP Report Approved for Public Release thumbnail" loading="lazy" />
  <p>This document is a chain of Department of Defense emails from March 2023 in which officials approve downgrading a secret intelligence report about a triangular UAP sighting near a national security facility from SECRET//NOFORN to UNCLASSIFIED. The underlying report describes a civilian who watched a large, blue, featureless triangular object hover and move erratically for about eight minutes at night somewhere in the Pacific Time Zone.</p>
  <div class="narr">This release consists of internal email correspondence within the Department of Defense. The emails concern a request to take a summary of an intelligence information report (IIR) — originally classified SECRET//NOFORN (secret, not releasable to foreign nationals) — and approve it for use at the unclassified level. The request came from the Office of the Undersecretary of Defense for Intelligence and Security, and the review was handled by Air Force Office of Special Investigations (AFOSI) CI Collections and Operations. Rather than go through AFOSI&#39;s full declassification process, which officials noted is lengthy and requires the AFOSI Commander&#39;s signature, the review was processed as a &quot;derivative classification review&quot; — a faster pathway. The reviewer approved the request, writing: &quot;I concur with using this at the UNCLASSIFIED level in your product. Consider your request approved.&quot;

The underlying sighting took place at night in March 2023, somewhere in the Pacific Time Zone near an unnamed national security facility. A single civilian reporter described observing a large, blue, featureless triangular object with a solid silhouette. The object emitted powerful &quot;whitish blue&quot; light from multiple points along its perimeter. According to the summary, the object hovered stationary above or near the facility for roughly three minutes, then moved in a &quot;jerking&quot; or &quot;jumping&quot; manner that the reporter described as inconsistent with smooth jet propulsion. The total observation lasted approximately eight minutes. The reporter recorded it on a personal cellphone.

The civilian stated they did not think the object was a drone. They could not identify its means of propulsion, could not determine whether it had a defined front or rear, and could not discern how it was controlled. The reporter also noted the object did not appear to travel along a defined flight path, did not emit a vapor trail, and did not seem to possess photo or data collection capabilities or cloaking capabilities. All names in the emails are redacted under privacy exemptions, and the specific facility location is not identified beyond &quot;Pacific Time Zone.&quot; The original intelligence report and its attachments were not included in this release.</div>
