  <h1>Spirit Airlines Crew Reported Two White Lights at 49,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/1edd9d9a80c72f100d917c2defd462de4ed16b8178a067a5d0759cc94f72f0c3.jpg" alt="Spirit Airlines Crew Reported Two White Lights at 49,000 Feet thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a Spirit Airlines pilot sighting of two stationary white lights at approximately 49,000 feet during a routine Fort Lauderdale-to-Newark flight on 24 February 2024. The lights were not detected on air traffic control radar, and the FAA closed the case without explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log pilot sightings of unidentified aerial phenomena (UAP). It was filed on 24 February 2024 at 02:39 UTC under report number 237UAP00359.

The sighting involved Spirit Airlines flight NKS1777, an Airbus A321 flying northbound from Fort Lauderdale (FLL) to Newark (EWR) at flight level 350 — roughly 35,000 feet. Approximately 140 nautical miles south of Wilmington, North Carolina, the crew reported seeing two white lights directly ahead of the aircraft that appeared stationary at approximately flight level 490, or about 49,000 feet. That altitude is above the service ceiling of most commercial and military aircraft.

Air traffic control checked their radar and found nothing. The report states plainly: the UAP was not observed on the ATC facility radar system. A Mandatory Occurrence Report (MOR) was initiated under ID ZJX-M-2024/02/23-0006.

The FAA marked the report as closed. No resolution or explanation is provided in the document. The tail number field is blank, which limits the ability to independently verify the specific aircraft involved.</div>
