  <h1>Pentagon Created a Standard Form for Insiders to Report UAP Programs</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b2a95e87f3853a55d837ea6124411c61a600462540a190c2f10e9d2153666d3a.jpg" alt="Pentagon Created a Standard Form for Insiders to Report UAP Programs thumbnail" loading="lazy" />
  <p>DD Form 3212 is a U.S. Department of Defense intake form, issued in April 2024, that lets government employees, military personnel, and contractors confidentially report firsthand knowledge of UAP-related programs dating back to 1945. It is a blank reporting template — not a case file — and contains no incident data or investigation findings.</p>
  <div class="narr">In April 2024, the All-domain Anomaly Resolution Office (AARO) published DD Form 3212, a standardized form for collecting testimony from U.S. government insiders who have direct knowledge of programs or activities related to Unidentified Anomalous Phenomena (UAP). The form is designed for current or former government employees, service members, and contractor personnel — not the general public, though the document notes public reporting may be added in the future.

The form defines UAP broadly: airborne objects not immediately identifiable, transmedium objects or devices, and submerged objects or devices that demonstrate capabilities or material exceeding known performance envelopes. AARO&#39;s scope covers government UAP-related activities going back to 1945, and the office has legal authority to receive all UAP-related information regardless of special access programs or compartmented access controls.

Notably, the form includes explicit legal protections for anyone who reports. Under the National Defense Authorization Act for Fiscal Year 2023, Section 1673, individuals can report to AARO without violating existing nondisclosure agreements. The law also prohibits reprisal — including clearance revocation or termination — against those who make authorized disclosures. At the same time, knowingly filing a false report carries penalties of fine or imprisonment under 18 U.S.C. 1001.

The form itself is unclassified and expressly prohibits the submission of classified or controlled information. It collects only contact details, employment history, clearance status, and basic program involvement as an initial point of contact. Completed forms are emailed to osd.submit-to-aaro@mail.mil. Any sensitive follow-up would occur through separate, secure channels.</div>
