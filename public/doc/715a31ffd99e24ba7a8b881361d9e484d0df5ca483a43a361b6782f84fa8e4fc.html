  <h1>Pilot Reports Bright Objects Above Aircraft at 34,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/715a31ffd99e24ba7a8b881361d9e484d0df5ca483a43a361b6782f84fa8e4fc.jpg" alt="Pilot Reports Bright Objects Above Aircraft at 34,000 Feet thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a January 2011 sighting by the pilot of flight EGF3892, a Canadair CRJ7, who observed small luminous bright objects above the aircraft at approximately 34,000 feet. Two other aircraft in the area were asked if they saw anything; neither confirmed the sighting. The case is closed.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unusual sightings reported by pilots. It records an event from 26 January 2011 at 17:26 UTC, involving flight EGF3892, a Canadair Challenger 870 (CRJ7) operating from Chicago O&#39;Hare (ORD) toward Philadelphia (PHL).

While passing through the Fort Wayne (FWA) sector at flight level 340 (roughly 34,000 feet), the pilot reported seeing small luminous bright objects above the aircraft, positioned at the 2 o&#39;clock direction — that is, ahead and to the right. The FAA classified the report under its primary code &quot;OTHER,&quot; meaning no specific category was assigned.

Controllers queried two other aircraft in the vicinity, one at flight level 310 and another at flight level 410, but neither crew saw anything matching the description. The report&#39;s status is marked as closed, with no indication of further investigation or resolution.

Although the document carries a 2023 release reference number (237UAP00014), the incident itself dates to 2011 — well before the current UAP reporting framework was established. It was released as part of a batch of records through the National Archives.</div>
