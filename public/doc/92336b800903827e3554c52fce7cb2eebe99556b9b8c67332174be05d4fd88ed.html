  <h1>U.S. Agency Concludes Iraq Air Base Object Was Likely Balloons</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/92336b800903827e3554c52fce7cb2eebe99556b9b8c67332174be05d4fd88ed.jpg" alt="U.S. Agency Concludes Iraq Air Base Object Was Likely Balloons thumbnail" loading="lazy" />
  <p>The All-domain Anomaly Resolution Office (AARO) investigated an unidentified object recorded on infrared video at Al Taqaddum Air Base, Iraq, in October 2017. The agency concluded with high confidence that the object was a cluster of balloons and showed no anomalous behavior.</p>
  <div class="narr">In October 2017, an infrared sensor mounted on a surveillance blimp floating at 2,700 feet above Al Taqaddum Air Base in Iraq captured 17 minutes and 30 seconds of footage showing an unidentified floating object. The object was described as abnormally shaped and was assessed to be traveling at 4–14 mph in an east-to-west direction, consistent with the wind. Its altitude was estimated at 850–2,200 feet.

The All-domain Anomaly Resolution Office (AARO), a U.S. Department of Defense body tasked with investigating unidentified aerial phenomena, published its case resolution on 8 September 2025. The agency concluded with high confidence that the object was a cluster of fully and partially inflated balloons. Analysts noted that balloon shapes and dangling strings were visible in several frames of the video. The object did not exhibit any speed or behavior that exceeded known technology.

AARO also considered and rejected an alternative explanation: that the object might have been a quadrotor drone draped in camouflage netting. That theory was discarded because the object drifted passively with the wind rather than flying under its own power, and the infrared camera detected no heat signature from motors.

Some limitations apply to this analysis. No firsthand witness report exists — the original reporter is listed as unknown, so the entire investigation rests on the sensor footage alone. The object&#39;s altitude and speed estimates carry only moderate confidence because of variability in available wind data, and the video quality deteriorated as the object moved farther from the sensor. AARO itself notes that it is not a member of the Intelligence Community and that its reports should not be treated as finished intelligence.</div>
