  <h1>Military Emails Confirm Two Brief UAP Sightings in Indo-Pacific, April 2025</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">4/10/2025-4/11/2025</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/10c11e9bf4d6686159da48e3d9388e7d3afe4ae8b1e79725ec6c63ccc491e537.jpg" alt="Military Emails Confirm Two Brief UAP Sightings in Indo-Pacific, April 2025 thumbnail" loading="lazy" />
  <p>This document is a chain of internal military emails confirming that short summaries of two possible UAP sightings by a US aircraft on 10 and 11 April 2025 in the Indo-Pacific region are approved for public release at the unclassified level. Both sightings lasted under 25 seconds, and no altitude, speed, or location details were provided.</p>
  <div class="narr">This record (designated DOW-UAP-D50) is a set of email exchanges between Department of War personnel working through the process of clearing two UAP sighting summaries for public release. An Information Disclosure Analyst from the Office of the Undersecretary of Defense for Intelligence and Security shared two short excerpts — called &quot;tearlines&quot; — from classified mission reports. A PAROC Intel Data Analysis Technician at 12th Air Force / Detachment 3 then confirmed, after checking with the reporting unit, that both tearlines and the identification of the area as INDOPACOM (the US Indo-Pacific Command area of responsibility) could be released at the unclassified level.

The two sightings themselves are described only briefly. On 10 April 2025 at 2353Z (just before midnight, Zulu time), a US aircraft observed one possible UAP for 12 seconds. The following day, 11 April 2025 at 0007Z, the same or another US aircraft observed one possible UAP for 23 seconds. In both cases, the object&#39;s altitude and speed were listed as unknown, and no interference with the aircraft was noted. The document uses the term &quot;POSS UAP&quot; — possible unidentified anomalous phenomena — meaning the observers themselves were not certain what they saw.

The document is heavily redacted. All personnel names are blacked out under privacy exemptions. The type of US aircraft involved is classified under national security provisions. The exact location within the Indo-Pacific region is never specified. The overall email chain was classified SECRET//NOFORN (secret, not releasable to foreign nationals), even though the specific sighting summaries within it were cleared as unclassified.

This is an administrative record about what information can be made public, not an analytical assessment of what the objects were. No conclusions are drawn about the nature of either sighting.</div>
