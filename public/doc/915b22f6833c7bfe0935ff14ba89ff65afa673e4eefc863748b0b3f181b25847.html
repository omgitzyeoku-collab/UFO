  <h1>AARO Releases Fully Redacted Document in Response to FOIA Request</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/915b22f6833c7bfe0935ff14ba89ff65afa673e4eefc863748b0b3f181b25847.jpg" alt="AARO Releases Fully Redacted Document in Response to FOIA Request thumbnail" loading="lazy" />
  <p>The All-domain Anomaly Resolution Office (AARO) released a document in response to FOIA request 23-F-1486, but the entire content has been withheld under a military secrecy law. No information about any UAP incident can be extracted from the release.</p>
  <div class="narr">The All-domain Anomaly Resolution Office (AARO), the Pentagon body responsible for investigating unidentified anomalous phenomena (UAP), released this document in response to a Freedom of Information Act (FOIA) request numbered 23-F-1486. However, what was actually provided to the requester is essentially a blank page.

The entire substantive content of the document has been redacted. The only visible markings are legal exemption codes citing 10 USC § 130c, a statute that authorizes the withholding of sensitive military information from public disclosure. This is a broad exemption that covers military operations and intelligence matters, so its use alone tells us nothing about what the underlying document actually discusses.

No descriptions of any UAP incident, no witness accounts, no agency conclusions, and no factual details of any kind are discernible from this release. The document effectively confirms only one thing: that a record responsive to the FOIA request exists, but the government has determined its contents must remain secret.

While the existence of a withheld document may itself be of interest to researchers tracking AARO&#39;s work, it would be a mistake to draw any conclusions about what the document contains based solely on the fact that it was withheld.</div>
