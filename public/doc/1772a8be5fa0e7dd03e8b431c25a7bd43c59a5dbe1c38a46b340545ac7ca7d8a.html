  <h1>FAA Report: Pilot Spotted Stationary Brown Object at 24,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/1772a8be5fa0e7dd03e8b431c25a7bd43c59a5dbe1c38a46b340545ac7ca7d8a.jpg" alt="FAA Report: Pilot Spotted Stationary Brown Object at 24,000 Feet thumbnail" loading="lazy" />
  <p>This is an FAA incident report from July 2023 documenting a pilot&#39;s sighting of a stationary, brown, Volkswagen-sized object 200 feet below their aircraft at 24,000 feet. The case was closed with no identification of the object and no impact on flight operations.</p>
  <div class="narr">On 9 July 2023 at 00:04 UTC, the crew of a commercial flight operating under callsign EJA828 — travelling from Portland, Maine to Teterboro, New Jersey — reported an unidentified aerial phenomenon while flying southeast at Flight Level 240 (approximately 24,000 feet) overhead Albany.

The pilot described the object as brown, stationary, and roughly the size of a Volkswagen, sitting about 200 feet below the aircraft. No instrument measurements of the object were taken; the description is based solely on the pilot&#39;s visual observation.

The FAA classified the event under its SKYWATCH programme as an Unidentified Aerial Phenomenon. The Aviation Weather Office was notified. The report notes there was no impact to flight operations.

The case is marked as Closed. Notably, no resolution or identification of the object is provided in the document — it remains unidentified. There is no mention of corroborating radar data or additional witness accounts.</div>
