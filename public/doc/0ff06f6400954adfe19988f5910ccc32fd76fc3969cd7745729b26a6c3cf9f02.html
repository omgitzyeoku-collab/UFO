  <h1>Southwest Airlines Crew Reported Orange Light Near Mexico Border in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/0ff06f6400954adfe19988f5910ccc32fd76fc3969cd7745729b26a6c3cf9f02.jpg" alt="Southwest Airlines Crew Reported Orange Light Near Mexico Border in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Southwest Airlines Boeing 737 crew sighting of a single orange light near the Mexico border on 21 July 2023. NORAD checked its systems and found nothing. The case was closed without identification or explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — the system the Federal Aviation Administration uses to log pilot sightings of unidentified aerial phenomena (UAP). It records an event on 21 July 2023 at 04:40, involving a Southwest Airlines Boeing 737 flying from Phoenix to Burbank under the callsign SWA121.

The aircraft was westbound at 24,000 feet, about 20 nautical miles east of Palm Springs, California, when the crew reported seeing a single orange-coloured light approximately 100 nautical miles off their left side, near the Mexico border. The light appeared to be at roughly the same altitude as the aircraft. The crew did not take evasive action.

The FAA&#39;s Denver headquarters asked NORAD — the joint US-Canadian military command responsible for aerospace monitoring — to check their systems. NORAD reported negative results, meaning the object did not appear on military radar or sensors.

The case was reported through the Los Angeles Air Route Traffic Control Centre (ZLA) and is marked as closed. No identification or explanation for the light was provided in the document. There is little evidence of redaction in this record.</div>
