  <h1>Southwest Airlines Crew Reported Two Unidentified Objects Over Louisiana</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/aefc887ebed80729e7e1e662363225e4ea5f6c9c5de0aae51f39140a73ae756b.jpg" alt="Southwest Airlines Crew Reported Two Unidentified Objects Over Louisiana thumbnail" loading="lazy" />
  <p>This FAA operations center notification documents a UAP sighting by the crew of Southwest Airlines flight 1508 on December 27, 2023. Flying at 30,000 feet near Shreveport, Louisiana, the crew reported two unidentified objects orbiting 10,000 feet above them. No evasive action was taken and no investigation conclusions are included.</p>
  <div class="narr">On the evening of December 27, 2023, the crew of Southwest Airlines flight 1508 — a Boeing 737 flying from Birmingham, Alabama to Dallas, Texas — reported seeing two unidentified objects in the sky. The sighting occurred at approximately 8:34 PM Central time, while the aircraft was cruising westbound at flight level 300 (roughly 30,000 feet), near Shreveport, Louisiana.

The crew described two objects orbiting approximately 10,000 feet above their 12 o&#39;clock position — meaning directly ahead and at roughly 40,000 feet altitude. The crew used the term &quot;orbiting aircraft,&quot; though the document does not confirm what the objects were. No evasive action was taken by the flight crew.

The report was handled through Dallas-Fort Worth ARTCC (Area Route Traffic Control Center), the air traffic control facility covering that region. The document notes that law enforcement notification was &quot;not reported,&quot; meaning there is no indication police or other agencies were contacted about the sighting.

This document is a preliminary notification from the FAA&#39;s Washington Operations Center — essentially an initial incident report, not a completed investigation. It contains no conclusions about what the objects were, no radar data, and no corroborating witness accounts beyond the single flight crew. The level of redaction in the document is low, meaning most of the information appears to have been released intact.</div>
