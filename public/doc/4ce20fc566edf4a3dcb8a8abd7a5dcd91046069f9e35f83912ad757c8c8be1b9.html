  <h1>U.S. Military Crew Tracked Unknown Flying Objects Over Arabian Gulf in 2020</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">8/27/20</span>
    <span class="badge">Arabian Gulf</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/4ce20fc566edf4a3dcb8a8abd7a5dcd91046069f9e35f83912ad757c8c8be1b9.jpg" alt="U.S. Military Crew Tracked Unknown Flying Objects Over Arabian Gulf in 2020 thumbnail" loading="lazy" />
  <p>A declassified U.S. Air Force mission report documents a 21-hour surveillance flight over the Arabian Gulf on August 27, 2020, during which the aircrew&#39;s sensors detected a formation of unknown flying objects traveling along the coast. The crew tracked the formation for roughly two minutes before losing it in cloud cover and could not reacquire it.</p>
  <div class="narr">On August 27, 2020, a U.S. Air Force aircraft assigned to the 482nd Attack Squadron was conducting an aerial reconnaissance mission over the Arabian Gulf, the Strait of Hormuz, and the Gulf of Oman in support of Naval Forces Central Command (NAVCENT). The aircraft had launched from Al Udeid Air Base the previous evening and would fly for just over 21 hours total.

At 1527Z (approximately 3:27 PM UTC), the aircrew&#39;s onboard sensors picked up a formation of unknown flying objects moving northeast to northwest along the coastline. The crew tracked the formation for about two minutes before light cloud coverage obscured it. They were unable to regain positive identification afterward. The report notes the method of observation was sensor-based, not visual, though the specific sensor used is not stated.

The mission report, designated Misrep 4685903, was originally classified with a scheduled declassification date of March 1, 2045. It was released early on January 22, 2026, as part of a broader U.S. Central Command disclosure effort — 19 years ahead of schedule. The report is heavily redacted: the aircraft type, crew names, exact coordinates, operation name, and other operational details are all blacked out.

Beyond the unknown objects, the mission documented routine regional surveillance activity, including a professional-toned radio hail from Iranian Air Defense, a small vessel docked at Greater Tunb naval port, and a possible IL-76 transport aircraft at Abu Musa Island airfield. The report explicitly states that the intelligence gap the mission aimed to fill was not resolved.</div>
