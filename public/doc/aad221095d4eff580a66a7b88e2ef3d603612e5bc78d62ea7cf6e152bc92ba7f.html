  <h1>Spirit Airlines Pilot Reported Unidentified Object That Radar Could Not Confirm</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/aad221095d4eff580a66a7b88e2ef3d603612e5bc78d62ea7cf6e152bc92ba7f.jpg" alt="Spirit Airlines Pilot Reported Unidentified Object That Radar Could Not Confirm thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Spirit Airlines pilot sighting an unknown object while flying from Myrtle Beach to Detroit in May 2022. Neither the aircraft&#39;s collision avoidance system, FAA radar replay, nor air traffic control could identify any traffic near the aircraft at the time of the sighting. The case was closed with no resolution.</p>
  <div class="narr">On 23 May 2022, the pilot of Spirit Airlines flight NKS1028 — an Airbus A319 flying from Myrtle Beach, South Carolina to Detroit, Michigan — reported an unidentified aerial phenomenon to air traffic control. The aircraft was heading northwest at flight level 280 (approximately 28,000 feet) near Muskegeon, Michigan when the pilot observed an unknown object travelling east to west at roughly the same altitude.

The pilot queried Washington Center (the regional air traffic control facility), which reported no other traffic in the area. The object also did not appear on the aircraft&#39;s Traffic Collision Avoidance System (TCAS), a standard safety system designed to detect nearby aircraft. A subsequent radar replay conducted by FAA headquarters likewise found no identified traffic in the vicinity at the time of the sighting.

The pilot suggested the object may have been a military aircraft, observed during the aircraft&#39;s climb between 25,000 and 28,000 feet. This remains the pilot&#39;s own speculation and was not confirmed by any agency.

The FAA created a FALCON radar replay of the incident for review and directed the pilot to contact an Operations Manager to discuss the report. Despite these follow-up steps, the case was marked as closed with no stated resolution or identification of the object.</div>
