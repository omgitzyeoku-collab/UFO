  <h1>FBI Washington State UFO File Is Nearly Unreadable</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">July 1952-1960</span>
    <span class="badge">Washington State, United States</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/1e34d8b682cb5c996eb28f096fdfb7644fa1211e3b1862ed41c1fcaaa99b6af7.jpg" alt="FBI Washington State UFO File Is Nearly Unreadable thumbnail" loading="lazy" />
  <p>This document is a severely degraded cover page from an FBI investigation file related to UFO sightings in Washington State between 1952 and 1960. The page confirms it originated from the FBI within the U.S. Department of Justice, but the body text is too damaged to yield any meaningful content about the sightings themselves.</p>
  <div class="narr">This record, catalogued as FBI-UAP-D013, is a single image file from the FBI&#39;s archives relating to UFO investigations in Washington State. The time period covered spans from July 1952 through 1960, but the document itself reveals almost nothing about what those investigations found.

What survives is a cover page or routing sheet — the kind of administrative slip attached to the front of correspondence as it moved between offices. The only legible text confirms the document came from the Federal Bureau of Investigation, part of the U.S. Department of Justice. Beyond that header, the page is too degraded for any substantive content to be recovered.

Because this is an image file rather than a multi-page PDF, this single deteriorated page may be the entirety of what was released under this identifier. No names of witnesses, investigators, or military personnel are readable. No descriptions of objects, no dates of specific sightings, and no conclusions can be extracted from the document itself.

The extreme degradation raises a practical question: whether the poor condition is a result of age and storage, or whether the document was already in this state when it was selected for release. Either way, the result is the same — the public receives a file that confirms an FBI UFO investigation existed in Washington State during the 1950s, but offers no window into what that investigation contained.</div>
