  <h1>Southwest Airlines crew reported UAP near Palm Springs in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/aa17009b97e6e3421994da1960218d5e76cbb2bed64ba33cb4c40c2197d13945.jpg" alt="Southwest Airlines crew reported UAP near Palm Springs in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA incident notification from July 2023 in which the crew of a Southwest Airlines Boeing 737 reported seeing an unidentified aerial phenomenon roughly 100 miles to their left while flying near Palm Springs, California. No evasive action was taken, and the document is a preliminary notification rather than a completed investigation.</p>
  <div class="narr">On July 20, 2023, the crew of Southwest Airlines Flight 121 — a Boeing 737 flying from Phoenix to Burbank — reported an unidentified aerial phenomenon (UAP) to air traffic control. The aircraft was westbound at 24,000 feet, approximately 20 miles east of Palm Springs, California, when the crew observed something roughly 100 miles to the left side of the aircraft.

The sighting was relayed by the Los Angeles Air Route Traffic Control Center (ARTCC) to the FAA&#39;s Washington Operations Center, which generated this incident notification. The crew did not take any evasive action in response to the sighting.

The document itself is a preliminary notification — essentially a standardised form the FAA uses to log reported incidents. It records the basic facts (flight number, aircraft type, position, altitude, and what was reported) but does not contain any analysis, conclusions, or follow-up investigation. There is no radar data, no corroborating witness accounts, and no description of what the object looked like or how it behaved.

The coordinates recorded in the document (33.829°N, 116.159°W) place the aircraft in the Palm Springs area of Southern California. A minor date discrepancy in the document — one field reads 7/20/2023 while a header reads 07-21-2023 — likely reflects the difference between Pacific and UTC time zones.</div>
