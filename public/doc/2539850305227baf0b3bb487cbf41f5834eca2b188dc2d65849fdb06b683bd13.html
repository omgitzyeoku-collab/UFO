  <h1>Air Force Called Flying Saucers a Complete Enigma in 1952 Memo</h1>
  <div class="meta">
    <span class="badge">Department of State</span>
    <span class="badge">7/28/52</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2539850305227baf0b3bb487cbf41f5834eca2b188dc2d65849fdb06b683bd13.jpg" alt="Air Force Called Flying Saucers a Complete Enigma in 1952 Memo thumbnail" loading="lazy" />
  <p>A July 28, 1952 Department of State memorandum relays Air Force intelligence chief General Samford&#39;s assessment that flying saucers remained &quot;a complete enigma,&quot; noting that credible observers were reporting incredible things and that the Air Force viewed them as a threat only because they were not understood. Samford suggested the rise in sightings was largely due to better radar and reporting methods, not necessarily more actual events.</p>
  <div class="narr">This two-page internal State Department memorandum, dated July 28, 1952, was written by an official identified only by the initials &quot;F.H.&quot; and addressed to a Mr. Armstrong. It was prompted by Paul Nitze — then Director of Policy Planning at the State Department — who asked what the Air Force thought about flying saucers. The author relayed what General Samford, head of Air Force Intelligence (known as A-2), told them at a meeting of the Intelligence Advisory Committee.

Samford&#39;s assessment was blunt: the flying saucer phenomenon was &quot;a complete enigma.&quot; He noted that similar phenomena had been reported for over 100 years, and that the recent surge in sightings could be explained partly by vastly improved observation tools — including radar and formal pilot reporting systems — and partly by a publicity-driven fad effect. In his view, more people were watching the skies more carefully, which naturally produced more reports.

Despite this, Samford acknowledged that the reports could not simply be dismissed. He said &quot;credible observers are reporting the incredible,&quot; and noted that radar detections were backed up by simultaneous visual observations from pilots, ruling out pure electronic glitches. The Air Force considered flying saucers a threat solely because they were not understood — not because they had evidence of hostile intent.

On the question of whether the objects could be man-made or foreign-controlled, the memo&#39;s author noted that Samford&#39;s remarks strongly implied this possibility was remote and &quot;not to be seriously considered.&quot; The document has since been declassified under review number NND 852931.

The memo is notable for showing that senior State Department officials — at the policy-planning level — were actively seeking the Air Force&#39;s views on flying saucers during the wave of sightings in the summer of 1952.</div>
