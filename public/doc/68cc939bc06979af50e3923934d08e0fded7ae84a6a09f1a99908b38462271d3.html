  <h1>United Airlines Crew Reported Unexplained Lights Over South Dakota</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/68cc939bc06979af50e3923934d08e0fded7ae84a6a09f1a99908b38462271d3.jpg" alt="United Airlines Crew Reported Unexplained Lights Over South Dakota thumbnail" loading="lazy" />
  <p>This is an FAA operations center notification from February 2023 documenting a UAP sighting by the crew of United Airlines flight 1786. While flying at 35,000–37,000 feet near Sioux Falls, South Dakota, the crew reported lights &quot;coming and going&quot; at the same altitude or higher. No investigation findings are included — this is a preliminary incident log, not a conclusions document.</p>
  <div class="narr">On 11 February 2023 at 03:35 CST, the crew of United Airlines flight 1786 — a Boeing 737 MAX 9 travelling from Los Angeles to Cleveland — reported seeing unidentified lights while cruising between 35,000 and 37,000 feet. The aircraft was approximately 25 miles south of Sioux Falls, South Dakota, at coordinates 43.22°N, 96.74°W.

The crew described the lights as &quot;coming and going&quot; at the same altitude or higher than the aircraft. Minneapolis Air Route Traffic Control Center (ARTCC), the regional radar facility handling the flight, relayed the report to the FAA Washington Operations Center, which logged the notification.

The document records that law enforcement was not notified of the incident. No further detail is given about the shape, size, movement pattern, or duration of the lights.

This record is a preliminary operations center notification — essentially an intake form. It does not contain any analysis, radar data, photographs, or investigative conclusions. There is no indication in the document that a follow-up investigation was conducted, though one may exist separately.</div>
