  <h1>Southwest Airlines Crew Reported Lights Later Linked to Starlink Satellites</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5db6c1a0ed16a9f85d9c0b6091a7db4843708f4bcdc12731eec135968026080d.jpg" alt="Southwest Airlines Crew Reported Lights Later Linked to Starlink Satellites thumbnail" loading="lazy" />
  <p>This FAA operations center notification documents a July 2023 sighting by the crew of Southwest Airlines Flight 549, who observed a string of lights above their aircraft near Memphis. The FAA correlated the sighting with Starlink satellites, effectively resolving it as an identified object rather than a true unknown.</p>
  <div class="narr">On the evening of 16 July 2023, the crew of Southwest Airlines Flight 549 — a Boeing 737 flying from Fort Myers, Florida to St. Louis, Missouri — reported seeing an unidentified aerial phenomenon while cruising at approximately 38,000 feet. The aircraft was about 81 nautical miles southeast of Memphis, Tennessee, heading northwest at the time.

The crew described the phenomenon as a string of lights above their aircraft. They did not take any evasive action, and Memphis Air Route Traffic Control Center (ARTCC) was advised of the report. No law enforcement was notified.

The FAA&#39;s assessment was straightforward: the sighting was correlated with Starlink satellites, the large constellation of low-orbit communications satellites operated by SpaceX. Starlink satellites are a well-documented source of light-string sightings, particularly shortly after launch when they travel in close formation.

This document is a preliminary FAA Washington Operations Center incident notification — a standard internal report used to log unusual sightings. It is not a full investigation. There is minimal redaction, and the core facts are clearly stated in the record.</div>
