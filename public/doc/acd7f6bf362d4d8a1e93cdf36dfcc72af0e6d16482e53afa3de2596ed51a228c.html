  <h1>Commercial Pilot Reports Orange Light Rising Near Charleston Airport</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>

  <img class="thumb" src="/extract/thumbs/acd7f6bf362d4d8a1e93cdf36dfcc72af0e6d16482e53afa3de2596ed51a228c.jpg" alt="Commercial Pilot Reports Orange Light Rising Near Charleston Airport thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a commercial aircraft crew&#39;s sighting of an orange light that ascended vertically to 10,000 feet and descended again near Charleston, South Carolina on 19 October 2024. The object did not appear on air traffic control radar, and the case was closed without explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00382. It records an unidentified aerial phenomenon observed by the crew of a commercial flight with callsign EJA647, which was travelling from Teterboro (TEB) to Charleston (CHS).

On 19 October 2024 at 00:10, the crew reported seeing an orange light off the left side of their aircraft while flying southwest-bound at 7,000 feet, approximately 7 nautical miles southeast of Charleston. The light moved straight up to roughly 10,000 feet and then back down again, with no lateral travel in any direction.

The reporting facility was CHS (Charleston). According to the report, the phenomenon was not detected on the ATC (air traffic control) facility radar system. The aircraft operator type is listed as commercial.

The case status is marked as &quot;Closed.&quot; No resolution, identification, or explanation for the sighting is provided in the report. No additional witnesses or corroborating sensor data are documented.</div>
