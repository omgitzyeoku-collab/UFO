  <h1>Three Airliners Report Bright Lights Maneuvering Near Jacksonville at Night</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5c89dfcc080c9136dc4d7a4ddf445301c33bbb303c2530cf0cbf37ddb739d474.jpg" alt="Three Airliners Report Bright Lights Maneuvering Near Jacksonville at Night thumbnail" loading="lazy" />
  <p>This FAA preliminary incident report documents a UAP sighting on August 4, 2023, near Jacksonville, Florida, where three commercial aircraft independently reported bright white lights maneuvering rapidly at high altitude. One crew described the phenomenon as hazardous, but no radar data, sensor recordings, or follow-up investigation results are included in the document.</p>
  <div class="narr">On August 4, 2023, at 2:35 AM Eastern time, the FAA&#39;s Washington Operations Center logged a report of an unidentified aerial phenomenon near Jacksonville, Florida. The object or objects were described as bright white lights that appeared and maneuvered rapidly at altitudes between 33,000 and 41,000 feet — standard cruising altitude for commercial jets.

Three separate commercial flights reported or confirmed the sighting. NetJets 631 initially reported the phenomenon to Jacksonville Air Route Traffic Control Center (ARTCC). Spirit Airlines flight 348, operating an Airbus A319, independently reported it and described it as hazardous — though the document does not elaborate on what made it hazardous. Amerijet flight 523, a Boeing 767, also confirmed the sighting.

The document records that law enforcement was not notified of the incident. No radar data, no sensor recordings, and no results from any follow-up investigation appear in this report.

This is a preliminary operations center log — essentially a first notice that something was reported. It is not a full investigation, and the FAA drew no conclusions in this document about what the lights were. The descriptions are secondhand, relayed from flight crews through air traffic control to the operations center.</div>
