  <h1>Airline Crews Reported Unidentified Objects Over Nebraska in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/527d8bed94fdcd809c98a02836b6fe267d05445afafa26d6756eb84be2a0d006.jpg" alt="Airline Crews Reported Unidentified Objects Over Nebraska in 2023 thumbnail" loading="lazy" />
  <p>An FAA incident report from 7 February 2023 documents United Airlines flight 1164 and multiple other aircraft reporting 2–3 unidentified targets with flashing lights manoeuvring at extreme altitudes over Nebraska. The report is preliminary and includes no follow-up investigation or identification of the objects.</p>
  <div class="narr">This document is a preliminary incident report from the FAA&#39;s Washington Operations Center. It records a sighting of unidentified aerial phenomena reported on 7 February 2023 at approximately 3:44 AM Central time.

United Airlines flight 1164, a Boeing 737-800 flying from San Francisco to Toronto, reported unidentified objects manoeuvring near the Wolbach navigational aid in central Nebraska (coordinates 41.4°N, 98.4°W). The objects were observed between flight levels 450 and 600 — roughly 45,000 to 60,000 feet — well above the cruising altitude of most commercial aircraft. Minneapolis Air Route Traffic Control Center was advised of the report.

The crew of flight 1164 was not alone in what they saw. Multiple aircraft in the area reported observing 2–3 targets with flashing lights in the same general vicinity.

The FAA document is labelled &quot;PRELIM INFO&quot; — a preliminary report, not a final investigation. It contains no radar data, photographs, sensor readings, or follow-up findings. The objects were never identified in this document. There is minimal redaction; the report is simply brief and limited in scope.

The altitude range is noteworthy: 45,000 to 60,000 feet exceeds the service ceiling of most conventional aircraft, including the 737-800 that reported the sighting.</div>
