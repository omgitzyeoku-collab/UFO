  <h1>Pilot Reports Large Brown Object North of Nashville in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/ad97fb18155b5ecfea106008e6b94a436369a52d306ba5fc99e5b0b82a32e209.jpg" alt="Pilot Reports Large Brown Object North of Nashville in 2023 thumbnail" loading="lazy" />
  <p>This FAA operations center report documents a June 2023 incident in which a pilot flying a small Mooney aircraft spotted a large brown object roughly 30 nautical miles north of Nashville International Airport. The report is a brief log entry with no follow-up investigation or identification of the object included.</p>
  <div class="narr">On 25 June 2023, the FAA&#39;s Washington Operations Center logged a report from a pilot flying a Mooney M20P, a single-engine general aviation aircraft registered as N79866. The pilot reported seeing a large brown object approximately 2,000 feet above the aircraft&#39;s position, roughly 30 nautical miles north of Nashville International Airport (BNA) in Tennessee. The coordinates place the sighting at about 36.56°N, 86.68°W.

Memphis Air Route Traffic Control Center (ARTCC), which manages high-altitude airspace across the region, was advised of the sighting. According to the report, the pilot did not take evasive action, and no law enforcement agencies were notified.

The document is a preliminary operations center log entry — essentially a one-page intake record — rather than a full investigation. It contains no radar data, no photographs, and no mention of additional witnesses or corroborating evidence. The FAA did not identify the object or offer any conclusion about what it might have been.

There is little evidence of redaction in this particular document. What&#39;s notable is not what was removed but what was never included: the record captures only the bare facts of the pilot&#39;s report and stops there.</div>
