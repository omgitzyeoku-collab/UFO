  <h1>Military Range Fouler Video From Middle East Is Nearly Entirely Redacted</h1>
  <div class="meta">
    <span class="badge">Department of War</span>

  <img class="thumb" src="/extract/thumbs/5f32ce0126de2c9571f2af368b2629c15b4f1cb3582700641ef31c1d1a8ceac8.jpg" alt="Military Range Fouler Video From Middle East Is Nearly Entirely Redacted thumbnail" loading="lazy" />
  <p>DOW-UAP-D38 is a video from May 2020 labelled as a &#39;range fouler debrief&#39; — a military term for an unauthorised object entering a live weapons range — in the Middle East. The auto-generated transcript is effectively empty, capturing only the word &#39;You&#39; repeated three times, meaning no substantive information survives in the available text.</p>
  <div class="narr">This document, catalogued as DOW-UAP-D38, is a video released by the Department of War as part of its PURSUE collection of UAP-related materials. The title identifies it as a &#39;Range Fouler Debrief&#39; from May 2020 in the Middle East. In military terminology, a &#39;range fouler&#39; is an unauthorised object that enters a live weapons testing or training range — the kind of event that triggers an immediate safety halt and formal review.

Despite the promising title, the actual content available is almost nonexistent. The auto-generated transcript captured only the word &#39;You&#39; repeated three times amid silence markers. Whether this is due to deliberate audio redaction, severe recording degradation, or a failure in the transcription process is unclear.

The Department of War has not provided any additional context, conclusions, or analysis alongside this release. Every factual detail — the date, region, and event type — comes solely from the video&#39;s title metadata, not from anything said in the recording itself.

This is one of the most heavily redacted items in the PURSUE collection. The video exists, but for all practical purposes the public version contains no recoverable information about what actually happened on that range in May 2020.</div>
