  <h1>Delta Crew Reports White and Red Lights at 32,000 Feet Over Texas</h1>
  <div class="meta">
    <span class="badge">FAA</span>

    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/18017c62bb81ae88d4d2c17f5c53db39c31588642bafd895d73fb8429ba4a5b3.jpg" alt="Delta Crew Reports White and Red Lights at 32,000 Feet Over Texas thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a sighting by the crew of Delta flight DAL1508 on April 18, 2023. The crew observed 4–5 white and red lights travelling toward their aircraft at approximately 32,000 feet, about 50 nautical miles southeast of Lufkin, Texas. The case is closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00255. It records an unidentified aerial phenomenon observed by the crew of a commercial Delta Air Lines flight on April 18, 2023.

The crew of Delta flight DAL1508, operating an Airbus A321 on an Atlanta (ATL) to San Antonio (SAT) route, reported seeing 4–5 white and red lights travelling toward their aircraft. The lights were observed at approximately flight level 320 — roughly 32,000 feet — about 50 nautical miles southeast of Lufkin, Texas. The incident was reported to Houston Center (ZHU), the FAA air traffic control facility covering that airspace.

The FAA classified the report under its primary code for Unidentified Aerial Phenomenon. The case status is listed as closed, but the document provides no investigation findings, no identification of the lights, and no resolution. A closed status in FAA reporting does not mean the phenomenon was explained — it means the case is no longer being actively worked.

The report is based solely on the crew&#39;s visual observation. No radar data, sensor evidence, or corroborating reports from other aircraft or ground stations are included in the document. There is minimal redaction, but equally minimal detail — the record captures what was reported and nothing more.</div>
