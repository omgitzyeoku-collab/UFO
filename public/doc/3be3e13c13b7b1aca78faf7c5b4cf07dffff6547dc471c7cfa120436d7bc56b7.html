  <h1>Aeromexico Crew Reports Three White Lights Over San Antonio at 35,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3be3e13c13b7b1aca78faf7c5b4cf07dffff6547dc471c7cfa120436d7bc56b7.jpg" alt="Aeromexico Crew Reports Three White Lights Over San Antonio at 35,000 Feet thumbnail" loading="lazy" />
  <p>This FAA Washington Operations Center notification documents a UAP sighting reported by the crew of Aeromexico Flight 692 on May 17, 2023. While flying at 35,000 feet near San Antonio, Texas, the crew observed an unidentified aerial phenomenon with three white lights directly ahead of their aircraft. No evasive action was taken and no investigation findings are included.</p>
  <div class="narr">On May 17, 2023, at 2:15 AM Central Daylight Time, the crew of Aeromexico Flight 692 — a Boeing 737 MAX 8 flying from Mexico City to Toronto — reported an unidentified aerial phenomenon to air traffic control. The aircraft was at Flight Level 350 (approximately 35,000 feet) and roughly 5 nautical miles north of San Antonio, Texas, at coordinates 29.534°N, 98.469°W.

The crew described the object as having three white lights, positioned at the 12 o&#39;clock position — meaning directly ahead of the aircraft. Despite the proximity implied by the sighting, no evasive action was taken. Houston Air Route Traffic Control Center (ARTCC) was the facility that received the report.

The document is an FAA operations center incident notification — essentially a first-pass record that an event occurred. It is not a completed investigation and contains no conclusions about what the crew observed. No law enforcement was notified in connection with the sighting.

The record contains minimal redaction. However, it is a single-source report: only the flight crew&#39;s account is documented, with no mention of corroborating radar data, other aircraft witnesses, or follow-up analysis.</div>
