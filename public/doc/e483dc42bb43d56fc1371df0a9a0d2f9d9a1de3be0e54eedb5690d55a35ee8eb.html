  <h1>Delta Pilots Report Multiple Maneuvering Lights Over Arkansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e483dc42bb43d56fc1371df0a9a0d2f9d9a1de3be0e54eedb5690d55a35ee8eb.jpg" alt="Delta Pilots Report Multiple Maneuvering Lights Over Arkansas thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a visual sighting by the crew of Delta Air Lines flight DAL2784 on 20 January 2024. Flying at 32,000 feet near Fort Smith, Arkansas, the crew observed multiple lights ahead of their aircraft maneuvering at an unknown altitude — the lights were not detected on air traffic control radar, and the case was closed without a stated resolution.</p>
  <div class="narr">On 20 January 2024 at 02:50, the crew of Delta Air Lines flight DAL2784 — a Boeing 717 flying westbound from Atlanta to Oklahoma City at 32,000 feet — reported seeing something unusual directly ahead of their aircraft. Near the KOMMA Intersection, roughly 40 nautical miles southeast of Fort Smith, Arkansas (coordinates 35°01&#39;N / 94°41&#39;W), the crew observed multiple lights approximately 80 miles in the distance, maneuvering at an unknown altitude above them.

The observation was entirely visual. The crew did not use any onboard equipment to track the lights, and air traffic control radar at the Memphis Air Route Traffic Control Center (ARTCC), the facility handling the report, did not detect anything corresponding to what the crew described.

The FAA logged the event as a SKYWATCH Incident Report under the primary code &quot;Unidentified Aerial Phenomenon.&quot; The AWO (Aviation Weather Operations) was notified. Beyond that, the report contains no indication of any follow-up investigation or attempt to identify the lights.

The case is marked as closed. No tail number was recorded for the reporting aircraft, and no resolution or explanation is offered in the document.</div>
