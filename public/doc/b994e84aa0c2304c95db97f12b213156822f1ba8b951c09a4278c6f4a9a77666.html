  <h1>UPS Cargo Crew Reports Bright Lights at 37,000 Feet Over Pennsylvania</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b994e84aa0c2304c95db97f12b213156822f1ba8b951c09a4278c6f4a9a77666.jpg" alt="UPS Cargo Crew Reports Bright Lights at 37,000 Feet Over Pennsylvania thumbnail" loading="lazy" />
  <p>This FAA incident notification records a UAP sighting by the crew of UPS flight 1016, a Boeing 767-300 flying from Louisville to Boston, on February 10, 2023. The crew reported bright lights directly ahead while cruising at 37,000 feet near Wilkes-Barre, Pennsylvania. No evasive action was taken and no investigation findings are included.</p>
  <div class="narr">On February 10, 2023, at 3:30 AM Eastern time, the crew of UPS flight 1016 — a Boeing 767-300 cargo aircraft en route from Louisville, Kentucky to Boston, Massachusetts — reported seeing an unidentified aerial phenomenon. The object or lights appeared directly ahead of the aircraft (the &quot;12 o&#39;clock position&quot;) while the plane was flying northeast at 37,000 feet, roughly 18 nautical miles west of Wilkes-Barre, Pennsylvania.

The crew described the UAP only as having &quot;bright lights.&quot; No details about its shape, size, speed, or movement appear in the document. The crew did not take evasive action, and no law enforcement notification was reported. The sighting was relayed through the New York Air Route Traffic Control Center (ARTCC) to FAA Operations in Washington.

This document is a preliminary incident notification from the FAA&#39;s Washington Operations Center — essentially an intake form, not a completed investigation. It records the basic facts of the report but does not include any conclusions about what the crew saw, nor does it reference radar data or corroborating witnesses.

The coordinates place the sighting at approximately 41.30°N, 76.20°W, in the skies over northeastern Pennsylvania. Beyond the crew&#39;s own account, no additional evidence or follow-up findings are contained in this record.</div>
