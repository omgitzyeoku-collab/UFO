  <h1>Air Force Summary Flagged Unexplained Green Fireballs Near Nuclear Sites</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/33ebbb1824507dd319b4f668003dfd4bf9aebd5b80c894f2eb466e2c25477c4b.jpg" alt="Air Force Summary Flagged Unexplained Green Fireballs Near Nuclear Sites thumbnail" loading="lazy" />
  <p>This May 1950 US Air Force Office of Special Investigations report summarised 18 months of unexplained aerial phenomena — mainly green fireballs — observed near sensitive military and government installations in New Mexico. Two inter-agency conferences at Los Alamos failed to explain the sightings, and a scientific study was contracted to investigate further.</p>
  <div class="narr">This document is an official summary report from the US Air Force Office of Special Investigations (USAF OSI), dated May 1950 and addressed to Brigadier General Joseph F. Carroll, Director of Special Investigations. It covers unexplained aerial phenomena observed in the New Mexico area from December 1948 through May 1950, with a particular focus on recurring green fireballs seen near sensitive military and government installations.

The report explains that in December 1948, an inter-agency liaison meeting determined that unexplained aerial sightings in New Mexico were frequent enough to warrant organised reporting. Observers included scientists, OSI Special Agents, airline and military pilots, security inspectors, and other personnel described as reliable. Dr Lincoln LaPaz, Director of the Institute of Meteoritics at the University of New Mexico and a wartime research mathematician, served as a voluntary consultant on the green fireball investigations.

Two conferences were held at Los Alamos — on 17 February 1949 and 14 October 1949 — to discuss the green fireball phenomena. Nine organisations attended, including the FBI, the US Atomic Energy Commission, the USAF Scientific Advisory Board, and the University of California. No logical explanation was reached. The attendees generally concluded that the phenomena were real and should be studied scientifically. Subsequently, the Geophysical Research Division of the Air Materiel Command in Cambridge, Massachusetts, contracted Land-Air, Inc. at Holloman Air Force Base in Alamogordo, New Mexico, to conduct a limited scientific study.

The report also includes an individual sighting account describing a luminous circular ball observed at approximately 6:15 PM. The object had no visible trail or propulsion and changed direction roughly three times before disappearing behind trees. The observer&#39;s name, exact date, and exact location are not legible in the source scan.

The document is heavily redacted, and the underlying PDF is a poor-quality scan with significant portions unreadable due to OCR corruption. The report was explicitly written to &#39;re-emphasise and reiterate&#39; that the phenomena deserved continued attention — it is an advocacy document, not a neutral scientific assessment.</div>
