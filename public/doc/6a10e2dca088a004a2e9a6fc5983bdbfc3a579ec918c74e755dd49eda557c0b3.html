  <h1>Military Infrared Video Shows Unidentified Sphere Over Water</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/6a10e2dca088a004a2e9a6fc5983bdbfc3a579ec918c74e755dd49eda557c0b3.jpg" alt="Military Infrared Video Shows Unidentified Sphere Over Water thumbnail" loading="lazy" />
  <p>The Department of War released a 3-minute infrared video (DOW-UAP-PR056) showing an unidentified spherical object over water, originally uploaded to a classified network in June 2024. The All-domain Anomaly Resolution Office (AARO) assessed the footage likely came from a U.S. military infrared sensor but noted the video was digitally altered before upload and lacks a verified chain of custody.</p>
  <div class="narr">In March 2026, eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records held by the Department of War and the Intelligence Community. The All-domain Anomaly Resolution Office (AARO) identified responsive materials on a classified network, and this video — catalogued as DOW-UAP-PR056 — was among them. It is now part of the PURSUE public release.

The video itself is 3 minutes and 32 seconds of infrared footage. It shows an area of contrast — described by the uploader as a &quot;Spherical UAP pulsing over water&quot; — generally centred in the frame. AARO assessed the footage is likely from an infrared sensor aboard a U.S. military platform, though they used hedging language and did not confirm the sensor source outright. The audio track contains only the repeated word &quot;You,&quot; which appears to be an artefact of automatic transcription rather than meaningful speech.

Critically, the Department of War states that this video was digitally altered before it was uploaded to the classified network, though the nature and extent of that alteration are not described. The material is presented as received. Additionally, many of the responsive records in this collection lack a substantiated chain of custody, meaning their origin and handling history cannot be independently verified.

The title — &quot;Spherical UAP pulsing over water [CALLSIGN]&quot; — was assigned by the original uploader, not by AARO or any official review body. The bracketed &quot;CALLSIGN&quot; suggests military identifying information was redacted. The video description also appears to cut off mid-sentence around the 48-to-52-second mark, leaving part of the official account incomplete.</div>
