  <h1>FAA Report: Pilot Spots Flashing Lights at 50,000 Feet Near Fresno</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a38a2b8fae55f9912205e32d41430b5f4ffd4312859fd5dff704a06a4ae45654.jpg" alt="FAA Report: Pilot Spots Flashing Lights at 50,000 Feet Near Fresno thumbnail" loading="lazy" />
  <p>This is an FAA incident report from March 2023 in which a general aviation pilot flying at 40,000 feet observed an unidentified object with flashing blue and green lights approximately 10,000 feet above them, near Fresno, California. The case was closed with no explanation of what the phenomenon was.</p>
  <div class="narr">On 6 March 2023 at 04:50 UTC, a general aviation aircraft — a C560 with callsign N474PE — was flying north-northwest at 40,000 feet on a route from Thermal, California to Aurora, Oregon. About 20 nautical miles northwest of Fresno, the pilot reported an unidentified aerial phenomenon off the left side of the aircraft.

The pilot described an object displaying flashing blue and green lights at approximately 50,000 feet — roughly 10,000 feet above the reporting aircraft. That altitude estimate came solely from the pilot; no independent radar measurement or altitude verification is included in the report.

The FAA classified the incident under its SKYWATCH programme with the primary code &quot;Unidentified Aerial Phenomenon.&quot; Two internal notifications — to entities identified as TY and AWO — are referenced, but neither their content nor any responses are included in the released document.

The case is marked as closed. No resolution or explanation of what the pilot observed is provided. There is no mention of corroborating radar data, additional witnesses, or follow-up investigation in the document as released.</div>
