  <h1>Boeing 747 crew and second aircraft report triangular lights over Vermont</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/970b7f712101d74549e26fb491acfeebfc7f9e2fc47874c59be5311163272a48.jpg" alt="Boeing 747 crew and second aircraft report triangular lights over Vermont thumbnail" loading="lazy" />
  <p>An FAA incident report records that on 12 February 2023, a commercial Boeing 747-8 crew flying at 35,000 feet observed an erratically moving light estimated above 60,000 feet near Burlington, Vermont. Three lights repeatedly formed a triangle and merged into one; a second aircraft independently reported the same observation. The case was closed with no explanation provided.</p>
  <div class="narr">This is a single-page FAA SKYWATCH incident report filed on 12 February 2023 at 08:25 UTC. It documents what the crew of a commercial Boeing 747-8, operating under callsign ICV93PK on a cargo route from Chicago O&#39;Hare to Luxembourg, observed while flying eastbound at 35,000 feet.

Approximately 43 nautical miles northwest of Burlington, Vermont, the crew reported a light estimated to be above 60,000 feet moving in an erratic pattern. They described three lights that appeared to form a triangle shape, then merged into a single light — a process that repeated several times.

A second aircraft, flying northbound toward Montreal, independently reported seeing the same phenomenon. This multi-witness aspect is notable: two separate crews in different locations observed the same thing.

The FAA&#39;s Aviation Weather Office (AWO) was notified. The case status is listed as &quot;Closed&quot; — but the report contains no resolution, no follow-up investigation details, and no explanation for what the crews observed. No radar data or instrument readings are referenced; all observations are visual only.

The document is brief and administrative in nature. It records the event but does not analyse or explain it.</div>
