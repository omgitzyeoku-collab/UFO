  <h1>Multiple Pilots Report Bright, Rocket-Like Object Over Texas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/bce371519aea69665d31867cd5b888f7261fc8446e318ba1cf59495a3da694b7.jpg" alt="Multiple Pilots Report Bright, Rocket-Like Object Over Texas thumbnail" loading="lazy" />
  <p>This FAA incident report documents an unidentified aerial phenomenon observed by crews aboard multiple aircraft near Junction, Texas on 16 March 2024. The bright, smoke-trailing object ascended past 36,000 feet and appeared to break apart, but was never detected on radar. The case was closed without identification.</p>
  <div class="narr">On 16 March 2024 at 01:57, crews aboard multiple aircraft flying near the JCT VOR (a navigation point near Junction, Texas) reported an unidentified aerial phenomenon to air traffic control. The pilots described a very bright object trailing smoke, moving from west to east, which they believed resembled some type of rocket.

According to the report, the object passed from below the aircraft to above them — placing it at or above 36,000 feet — and then appeared to break up into pieces or disappear. Despite being reported at that altitude by multiple witnesses, the object was not detected on the air traffic control radar system.

The incident was logged under the FAA&#39;s SKYWATCH programme, which tracks unidentified aerial phenomena. NORAD (the North American Aerospace Defense Command) was notified. Houston Center (ZHU), the FAA facility handling the airspace, filed a Mandatory Occurrence Report and noted that FALCON radar replay data would be attached, though that radar data is not included in this document.

The FAA classified the primary code as &quot;Unidentified Aerial Phenomenon&quot; and marked the case status as closed. No resolution or identification of the object is recorded in the report.</div>
