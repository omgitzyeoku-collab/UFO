  <h1>Delta 757 Crew Reports Unidentified Aerial Phenomenon North of Atlanta</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/8ca4e73eded2decf4f3e878e69c47dea852859fb7e3022a1c7dcb706cfe24198.jpg" alt="Delta 757 Crew Reports Unidentified Aerial Phenomenon North of Atlanta thumbnail" loading="lazy" />
  <p>An FAA operations center report documents a UAP sighting by the crew of Delta Flight 574, a Boeing 757-200 flying from San Francisco to Atlanta on 5 September 2023. The crew observed something unidentified from the left side of the aircraft at 37,000 feet, roughly 50 nautical miles north of Atlanta; no evasive action was taken and no further investigation is documented here.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report — essentially a short internal notification that something unusual was reported during a commercial flight. It is not an investigation report or a conclusion about what was seen.

On 5 September 2023, the crew of Delta Flight 574, a Boeing 757-200 en route from San Francisco to Atlanta, reported observing an unidentified aerial phenomenon from the left side of the aircraft while flying eastbound at flight level 370 (37,000 feet). The sighting occurred approximately 50 nautical miles north of Atlanta, over north Georgia. Memphis Air Route Traffic Control Center — the regional air traffic facility handling that airspace — relayed the report to FAA Operations.

The crew did not take evasive action, and no law enforcement notification was reported. The document provides coordinates (roughly 34.36°N, 84.43°W) but does not describe the object&#39;s appearance, size, movement, or how long it was visible.

The report is a preliminary operational log entry. It records that something was reported, but draws no conclusions about what the crew saw. There is no indication of follow-up investigation, corroborating radar data, or additional witness accounts within this document.</div>
