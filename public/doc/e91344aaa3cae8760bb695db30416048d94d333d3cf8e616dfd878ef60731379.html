  <h1>FBI-UAP-D014, Correspondence Relating to UFO Sightings, 1967, 1974</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">10/10/74</span>
    <span class="badge">Various</span>
    
  </div>
  
  <p>This file contains two pieces of correspondence. The first, dated 9/22/1967, relays a description of an incident provided by an eleven-year-old child in which they heard a “weird” noise and saw a “flash of light.” The second, dated 9/30/1974 and 10/10/1974, is an exchange of letters between the Federal Bureau of Investigation (FBI) and Mr. Larry Bryant regarding an “alleged April 8, 1954 sighting of an occupied unidentified flying object (UFO).” The FBI’s response to Mr. Bryant’s inquiry indicated that it maintained no record of such an event, and that, circa 1974, the Bureau does not collect information regarding UFO sightings.</p>
