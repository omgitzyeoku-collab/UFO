  <h1>FBI Files Record 1967 Child&#39;s UFO Report and 1974 Records Request</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">10/10/74</span>
    <span class="badge">Various</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e91344aaa3cae8760bb695db30416048d94d333d3cf8e616dfd878ef60731379.jpg" alt="FBI Files Record 1967 Child&#39;s UFO Report and 1974 Records Request thumbnail" loading="lazy" />
  <p>This is a small collection of FBI correspondence covering two unrelated matters. The first is a 22 September 1967 internal FBI memo noting that an eleven-year-old Chicago boy, Tom Mitchell, telephoned to report a &#39;weird&#39; noise and a &#39;flash of light&#39; he called a UFO on 16 September 1967. The second is a September–October 1974 letter exchange in which a member of the public, Larry W. Bryant, asked the FBI for records of an alleged 1954 UFO sighting, and the FBI replied that it held no such records and does not collect information on UFO sightings.</p>
  <div class="narr">This file, released as FBI-UAP-D014, is not a report of an investigation. It is a set of two pieces of FBI correspondence about unidentified flying object (UFO) claims, held together in one document. Neither item shows the FBI investigating or confirming that anything unusual took place.

The first item is an internal FBI memorandum dated 22 September 1967, written by Special Agent Leonard Treviranus of the FBI&#39;s Chicago office. It records that Tom Mitchell, an eleven-year-old boy living at 7825 South Colfax in Chicago, telephoned to say that at about 8:30 PM on 16 September 1967 he heard a &#39;weird&#39; noise, looked out of the window, and saw a &#39;flash of light going north in the sky&#39;, which he claimed was a UFO. The FBI took no investigative action beyond passing the information to Sergeant Eugene Ripka of the Army-Air Force 755th Radar Squadron in Arlington Heights, Illinois.

The second item is a 1974 exchange of letters. Larry W. Bryant, of Arlington, Virginia, wrote to the FBI saying he had obtained, through the Department of the Air Force, a US Army report describing an alleged 8 April 1954 sighting of an occupied UFO said to have been pursued by US Coast Guard personnel and seen by at least three civilian observers. He named the principal observer as Mrs. Lelah H. Stoker, a Chicago resident, and asked the FBI for its records.

The FBI&#39;s reply, dated 10 October 1974 and signed by Richard G. Held, Special Agent in Charge in Chicago, stated plainly that the Bureau had no information about the sighting Bryant described and that the FBI does not collect information on UFO sightings in general. It added that the FBI is authorised to investigate only matters specifically delegated to it by Congress, and that UFO sightings are not among them, and that its files contained no information on the current address or telephone number of Mrs. Stoker.

The document carries some redaction, and the scanned text is of poor quality, so some names, addresses and figures are garbled. Nothing in the file corroborates that any UFO event actually occurred; both claims rest on the accounts of the people who reported them.</div>
