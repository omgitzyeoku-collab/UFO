  <h1>FAA Report: Pilot Spotted Metallic Cylinder at 38,000 Feet Near Wilmington</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f7f52d65cfb6dd33ddeda87dfe0029bf53e32b59eb743a3817022136df29211d.jpg" alt="FAA Report: Pilot Spotted Metallic Cylinder at 38,000 Feet Near Wilmington thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a commercial flight crew&#39;s sighting of a white or metallic cylindrical object near their aircraft at approximately 38,000 feet, about 20 nautical miles northeast of Wilmington, NC. The object did not appear on air traffic control radar, and the case was closed without identification.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under the code &quot;Unidentified Aerial Phenomenon&quot; and assigned record number 237UAP00376. It describes a sighting reported by the crew of a commercial flight operating under callsign EJA627, travelling southwest-bound from Morristown, NJ (MMU) to Boca Raton, FL (BCT). The report is dated 27 July 2024 at 16:17 UTC.

According to the report, the aircraft was at 40,000 feet when the crew observed a white or metallic cylindrical object near the aircraft at approximately 38,000 feet — roughly 2,000 feet below them. The sighting occurred about 20 nautical miles northeast of Wilmington, NC (ILM airport code).

The FAA notes that the object was not observed on the ATC (air traffic control) facility radar system, meaning controllers had no independent confirmation of the object&#39;s presence. No further details are provided about the object&#39;s size, duration of the sighting, or any movement it may have exhibited.

The case is marked as closed. No resolution or identification of the object is offered in the report. The document contains minimal redaction, but it also contains minimal detail — there is no tail number for the reporting aircraft, no corroborating sensor data, and no follow-up investigation is described.</div>
