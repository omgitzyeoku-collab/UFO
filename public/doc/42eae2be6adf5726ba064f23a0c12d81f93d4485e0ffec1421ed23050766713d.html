  <h1>Six Federal Agents Reported Silent Glowing Orbs Near Security Site</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2023</span>
    <span class="badge">Western United States</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/42eae2be6adf5726ba064f23a0c12d81f93d4485e0ffec1421ed23050766713d.jpg" alt="Six Federal Agents Reported Silent Glowing Orbs Near Security Site thumbnail" loading="lazy" />
  <p>A June 2026 memorandum from the Office of the Under Secretary of War summarises an unresolved investigation by AARO (the All-domain Anomaly Resolution Office) into a UAP incident in October 2023. Six federal law enforcement agents, working in three teams of two, observed silent luminous orange orbs that appeared to release smaller red orbs near a sensitive national security site in the western United States. The case remains unresolved.</p>
  <div class="narr">This document is an unclassified memorandum dated 5 June 2026, issued by the Office of the Under Secretary of War. It provides an update on an ongoing case analysis by AARO — the All-domain Anomaly Resolution Office, the Pentagon body responsible for investigating unidentified anomalous phenomena.

The incident took place over two days in October 2023, near a sensitive national security site somewhere in the western United States. The specific location is not named. Six federal law enforcement special agents, organised into three teams of two and positioned at multiple viewing angles, reported observing what they described as luminous orange &quot;mother orbs&quot; that appeared to produce smaller red &quot;orbs.&quot; The agents reported that the orange orbs appeared for one to two seconds at a time, each releasing a cluster of two to four red orbs. This pattern repeated multiple times over several hours, beginning at approximately dusk. The red orbs displayed seemingly coordinated horizontal motion and apparent changes in altitude. In one instance, a red orb was reported as remaining stationary above a ridgeline for several hours. All agents described the phenomena as silent.

The witnesses provided consistent accounts using similar language. However, all observations described in the available text are eyewitness testimony — no sensor or instrument data is mentioned.

As of June 2026, AARO has not resolved the case. The document&#39;s third section, which appears to contain the analytical assessment, is partially cut off in the available extract, meaning the full reasoning behind AARO&#39;s conclusions is not available. The document is classified as UNCLASSIFIED, which suggests sensitive details may have been omitted or redacted before release.</div>
