  <h1>CIA Report Covered Soviet Scientists&#39; Theory on Charged Mass in Space</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1972</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d201add923b44a7d636c3d2e5d3de15ce5826cbc805471b72ab2ca7c6e61efee.jpg" alt="CIA Report Covered Soviet Scientists&#39; Theory on Charged Mass in Space thumbnail" loading="lazy" />
  <p>This CIA Intelligence Information Report summarises a US attendee&#39;s account of a speculative physics paper presented by Soviet scientists N. Kardashev and A. Sakharov at a 1971 conference in Armenia. The paper theorised that electrically charged mass collapsing into a gravitational singularity could bounce back and reappear elsewhere in space-time, rather than disappearing forever.</p>
  <div class="narr">In September 1971, a conference on the Origins of Life took place in Yerevan, Armenia. Among the papers presented was one by N. Kardashev, of the Institute for Space Research in Moscow, and the internationally recognised physicist A. Sakharov. Their paper dealt with general relativity and what happens when mass collapses into a gravitational singularity — what we would now call a black hole.

The core idea was this: if the collapsing mass carries no electrical charge, it either falls past the singularity forever or closes in on itself, cut off from the outside universe. But if the mass is electrically charged, the paper argued, it could bounce back and re-emerge in a different part of space-time. Sakharov believed the structure of space might be far more complicated than was generally assumed, while Kardashev was interested in what this meant for astrophysics.

A US citizen who attended the conference reported back to the CIA, and the agency compiled this Intelligence Information Report, dated April 1972. The American source considered the speculation &quot;somewhat fantastic&quot; and felt the authors had &quot;taken off in a rather wild way,&quot; but acknowledged the paper was well-grounded in principle.

This document is part of the PURSUE collection released by the US Department of War. Notably, it describes theoretical physics, not a UAP sighting or encounter. Its inclusion in the collection appears to relate to the theoretical discussion of mass behaviour in space rather than any direct observation of unidentified phenomena. Some redactions are present in the original document.</div>
