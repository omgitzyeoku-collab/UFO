  <h1>Multiple Airlines Reported Greenish Lights Moving in Circles Over Colorado</h1>

  <p>An FAA SKYWATCH report documents 2–4 unidentified aerial phenomena seen by crews on multiple commercial flights on 25 August 2023. The objects appeared as white-green lights moving in circular patterns at extreme altitude, and the case was closed without explanation.</p>
  <div class="narr">This is an FAA incident report filed under code 237UAP00291, categorised as an Unidentified Aerial Phenomenon. It records a sighting on 25 August 2023 involving multiple aircraft operating in Denver Center (ZDV) airspace.

The initial report came from United Airlines flight 369 (UAL369). The crew described 2–4 objects, each emitting a white light with a slight greenish hue, moving independently in circular motions without appearing to turn. The objects were perceived as being at very high altitude — the crew noted the activity appeared to be near the Big Dipper constellation. A Southwest Airlines flight (SWA5298), a Boeing 737 MAX 8 at flight level 370, independently confirmed seeing at least two of the lights over North Platte (LBF), describing them as moving laterally.

No radar or instrument confirmation is mentioned in the report. All observations were visual, made by experienced commercial pilots.

The FAA marked the case as Closed. No resolution, identification, or follow-up action is noted in the document. The report shows minimal redaction.</div>
