  <h1>United Airlines crew reported bright white lights at extreme altitude over Pacific</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0fe5c891cd1cd636324e6dfafed36611c395b887b9cc7080c399ca17b751c4f9.jpg" alt="United Airlines crew reported bright white lights at extreme altitude over Pacific thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH report documents United Airlines flight UAL189 observing bright white lights on both sides of the aircraft while flying at 35,000 feet over the Pacific. The lights were estimated at 41,000–80,000 feet altitude, traveling southeast at an unknown distance of 100–500 nautical miles. The case was closed with no follow-up noted.</p>
  <div class="narr">On 31 October 2023 at 19:26 UTC, the crew of United Airlines flight UAL189 — a Boeing 737-800 flying from Manila to Guam — reported an unidentified aerial phenomenon to the FAA. The aircraft was eastbound at 35,000 feet over YELLO intersection when the crew observed bright white lights on both the left and right sides of the aircraft.

The crew estimated the lights were traveling southeast at altitudes between FL410 and FL800 (41,000 to 80,000 feet) at a distance of 100 to 500 nautical miles. The upper end of that altitude range — 80,000 feet — is well above where commercial or most military aircraft operate, and the distance range is so broad it suggests the crew could not determine how far away the phenomenon actually was.

The FAA logged the report under case number 237UAP00311 through its SKYWATCH system. The case status is listed as closed. No corroborating radar data or sensor evidence is mentioned in the document, and no follow-up investigation details are provided.

The document shows minimal redaction. It is a single-page incident report — a record that a sighting was logged, not an investigation into what the lights were.</div>
