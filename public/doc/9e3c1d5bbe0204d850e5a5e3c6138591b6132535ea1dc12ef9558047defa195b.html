  <h1>Pilot Reports Fast-Climbing UFO During Night Flight Over South Carolina</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9e3c1d5bbe0204d850e5a5e3c6138591b6132535ea1dc12ef9558047defa195b.jpg" alt="Pilot Reports Fast-Climbing UFO During Night Flight Over South Carolina thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a UFO sighting by the pilot of a small turboprop aircraft on 13 February 2021. The pilot, flying at 18,000 feet on a route from Charleston to Evansville, observed a fast-moving, climbing object off the right side of the aircraft near Anderson, South Carolina. The report was closed with no indication of follow-up findings.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unusual aerial sightings reported by pilots and air traffic controllers. It was filed on 13 February 2021 at 23:39 UTC under reference number 237UAP00045.

At 23:15 that evening, the pilot in command of a TBM8 (a single-engine turboprop) with callsign N14SC was flying northwest-bound at flight level 180 — roughly 18,000 feet — on a general aviation route from Charleston Executive Airport (JZI) to Evansville Regional Airport (EVV). The pilot reported observing an unidentified object positioned at the Anderson VOR (a ground-based navigation beacon in South Carolina), 060-degree radial at 8 nautical miles, off the right side of the aircraft. The object was described as fast-moving and climbing.

The FAA logged the sighting and a message was left with the UFO reporting centre. The report is marked as &quot;Closed&quot; with no further detail on any investigation, resolution, or identification of the object.

Notably, the document contains no radar data, no corroborating witness accounts, and no follow-up findings. It is a single pilot&#39;s observation recorded through the FAA&#39;s standard reporting channel. The metadata listing this as a 2023 incident appears to be a cataloguing discrepancy — the source document itself dates the event to February 2021.</div>
