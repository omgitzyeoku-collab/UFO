  <h1>Three Commercial Flights Report Mystery Lights at 36,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5a0387a41e7d0341bc17c6d8b69b7b80f9a530e115d145086ab60a91d0f6be9d.jpg" alt="Three Commercial Flights Report Mystery Lights at 36,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a November 2023 sighting by the crew of a Boeing 737-800 (flight GTI3674), who observed numerous lights appearing in 20-second intervals while cruising at 36,000 feet. Two other flights at similar altitudes independently reported the same phenomenon, but nothing appeared on air traffic control radar. The case is closed with no stated resolution.</p>
  <div class="narr">On November 28, 2023, at 02:00, the crew of commercial flight GTI3674 — a Boeing 737-800 flying westbound at 36,000 feet over HVQ — reported an unidentified aerial phenomenon off the front of the aircraft. They described numerous lights in the distance, each appearing for roughly 20 seconds at a time. The crew noted the lights were possibly satellites.

The sighting was not picked up by the air traffic control (ATC) radar system. However, two other commercial flights in the area — FFT4777 at 36,000 feet and EDV5295 at 34,000 feet — independently reported seeing the same thing. That three separate crews observed the phenomenon adds a degree of corroboration, though all observations were visual only.

The FAA logged this under its SKYWATCH programme, which tracks unidentified aerial phenomena reported by pilots. The report lists the flight&#39;s origin as BWI (Baltimore-Washington International) and destination as SKF (Kelly Field, San Antonio), with the point of departure listed as DEN (Denver).

The case is marked as closed. The report contains no stated resolution, no follow-up investigation, and no definitive identification of what the crews saw. The FAA&#39;s own record notes the lights were &quot;possibly satellites,&quot; but does not confirm or rule out that explanation.</div>
