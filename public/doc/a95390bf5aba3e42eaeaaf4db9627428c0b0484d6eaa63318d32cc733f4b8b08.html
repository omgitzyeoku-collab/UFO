  <h1>FAA Report: Pilots Spotted Phenomenon Later Linked to Rocket Recovery</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a95390bf5aba3e42eaeaaf4db9627428c0b0484d6eaa63318d32cc733f4b8b08.jpg" alt="FAA Report: Pilots Spotted Phenomenon Later Linked to Rocket Recovery thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents multiple pilot sightings of an unidentified aerial phenomenon on 14 October 2023 that initially appeared to be a mission failure. The FAA&#39;s Space Operations office confirmed the mission was successful and that rocket body recovery was underway; NORAD reported no anomalous findings.</p>
  <div class="narr">On 14 October 2023 at 01:01, the FAA logged a SKYWATCH incident report under the code &quot;Unidentified Aerial Phenomenon.&quot; Multiple aircraft across several regions of US airspace reported seeing something unusual that, according to the report, &quot;had the appearance of a potential mission failure.&quot;

The sightings triggered reports from seven FAA Air Route Traffic Control Centers (ARTCCs) — facilities that manage high-altitude air traffic — spanning a wide area of the United States: Houston, Fort Worth, Kansas City, Jacksonville, San Juan, Atlanta, and Denver. The reporting facility was listed as HQ DEN (Denver), and the incident was flagged as significant enough to trigger a page.

The FAA&#39;s Space Operations office at the Air Traffic Control System Command Center stepped in to clarify. They confirmed that the mission in question &quot;is a success without issue&quot; and that rocket body recovery was in process. NORAD — the North American Aerospace Defense Command — separately reported &quot;negative findings,&quot; meaning they detected nothing anomalous.

The case is now closed. No pilot names, aircraft identifiers, or specific flight details appear in the report. Two individuals identified only by initials (TY and AWO) were notified. The document contains minimal redaction and is straightforward in its conclusion: what pilots saw was related to a rocket launch and recovery operation, not an unexplained phenomenon.</div>
