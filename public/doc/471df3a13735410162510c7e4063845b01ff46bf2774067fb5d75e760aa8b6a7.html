  <h1>Delta Pilot Reports Recurring Light Above 40,000 Feet Near Memphis</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/471df3a13735410162510c7e4063845b01ff46bf2774067fb5d75e760aa8b6a7.jpg" alt="Delta Pilot Reports Recurring Light Above 40,000 Feet Near Memphis thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a Delta Air Lines pilot who observed a single unidentified light above their aircraft six times while flying near Memphis in September 2022. The light would shine for 3–4 minutes then fade, appeared above 40,000 feet, and the case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP). It was filed under the identifier 237UAP00110 and references an event from September 2022.

According to the report, a Delta Air Lines Airbus A321 operating as flight DAL2583 was flying northwest at 36,000 feet when the crew spotted something above them. The initial sighting was approximately 100 nautical miles southeast of Memphis. The object is described as a single light that would shine for 3–4 minutes and then fade. The pilot in command reported seeing the light a total of six times, later placing it roughly 60–80 nautical miles north of Memphis and above 40,000 feet — meaning it was higher than the aircraft&#39;s own cruising altitude.

The report lists the operator type as commercial and references a facility code of ZME (Memphis Center). The tail number field is blank, and no radar data or sensor corroboration is mentioned anywhere in the document. The entire account rests on the pilot&#39;s visual observation.

The FAA marked the case as Closed. No resolution, identification, or follow-up explanation is provided in the document. The report simply records what the pilot reported and stops there.</div>
