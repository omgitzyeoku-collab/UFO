  <h1>United Airlines Crew Reported 15 Bright Lights Over East Texas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/5bb23084c91bf63571a2a948f483aabe2d5375ebcdd814c4c6a8f49b4d1492d6.jpg" alt="United Airlines Crew Reported 15 Bright Lights Over East Texas thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of United Airlines flight 1409 on July 30, 2023. While flying an Airbus A320 from Houston to Milwaukee at approximately 26,000 feet near Lufkin, Texas, the crew observed 15 bright lights directly ahead of the aircraft that appeared and then quickly disappeared.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report covering a UAP sighting by a commercial airline crew. The report was filed as a late report, meaning there was a delay between the observation and when it was formally logged.

On July 30, 2023, at 10:09 PM Central time, the crew of United Airlines flight 1409 — an Airbus A320 travelling northeast from Houston Intercontinental (IAH) to Milwaukee (MKE) — observed an unidentified aerial phenomenon near Lufkin, Texas. The aircraft was at flight level 260, roughly 26,000 feet. The crew described 15 bright lights at the 12 o&#39;clock position (directly ahead) that appeared and then quickly disappeared.

The crew took no evasive action. Fort Worth Air Route Traffic Control Center (ARTCC) was advised of the sighting. Law enforcement was not notified.

The FAA report does not include any explanation or conclusion about what the lights were. There is no mention of corroborating radar data, sensor recordings, or additional witness accounts from other aircraft or ground observers. The document records the crew&#39;s visual observation and nothing more.</div>
