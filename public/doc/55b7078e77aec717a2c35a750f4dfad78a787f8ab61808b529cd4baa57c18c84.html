  <h1>FAA Report: Three Unexplained Lights Seen Near Washington DC Airport</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/55b7078e77aec717a2c35a750f4dfad78a787f8ab61808b529cd4baa57c18c84.jpg" alt="FAA Report: Three Unexplained Lights Seen Near Washington DC Airport thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents air traffic controllers at Reagan National Airport (DCA) observing three unidentified lights moving at approximately 30,000 feet or higher on 4 February 2024. The lights did not appear on radar, no aircraft were involved, and the case was closed without explanation.</p>
  <div class="narr">This document is an FAA incident report filed under the agency&#39;s SKYWATCH programme, which tracks unidentified aerial phenomena (UAP) observed by air traffic control. It carries the identifier 237UAP00349 and the internal reference DCA-M-2024/02/04-0001.

On 4 February 2024 at 09:00, controllers at the Reagan National Airport (DCA) tower reported seeing three lights &quot;flying around&quot; off the horizon at approximately flight level 300 (roughly 30,000 feet) or higher. The altitude was described as approximate, so the actual height is uncertain.

The lights were a visual-only observation. They did not appear on the facility&#39;s radar system, and no aircraft were involved in or affected by the incident. The report does not record how long the observation lasted, which direction the lights moved, or how many controllers witnessed them.

The case status is listed as closed. The document provides no resolution, explanation, or follow-up findings. There is minimal redaction, but also minimal detail — the report is a short administrative filing rather than a detailed investigation.

The named locations in the report are DCA (Reagan National Airport, Washington DC) and DEN (Denver), though the document does not clarify DEN&#39;s role in the incident.</div>
