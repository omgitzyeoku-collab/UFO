  <h1>Two Airline Crews Reported Unexplained Lights Near Little Rock in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d3cf5702fd98a522960790d76acd4dd41177e09c6f9e725bf2583efde17b90b5.jpg" alt="Two Airline Crews Reported Unexplained Lights Near Little Rock in 2023 thumbnail" loading="lazy" />
  <p>This FAA Washington Operations Center notification documents a UAP sighting on August 25, 2023, near Little Rock, Arkansas. A Berry Aviation crew flying at 27,000 feet observed dim-to-bright white lights moving in circles and up-down patterns, and a JetBlue flight independently reported a similar sighting.</p>
  <div class="narr">On August 25, 2023, at 3:50 AM Central time, the crew of Berry Aviation flight 651 — operating an E120 aircraft on a route from El Paso to Louisville at 27,000 feet — reported an unidentified aerial phenomenon near Little Rock, Arkansas. They described dim-to-bright white lights that moved in circular and up-and-down patterns.

The sighting was reported to Memphis ARTCC (Air Route Traffic Control Center), the FAA facility managing that airspace. A second aircraft, JetBlue flight 358, independently reported a similar sighting, providing corroboration from a separate crew.

No evasive action was taken by either aircraft, and law enforcement was not notified. The coordinates recorded in the report (34.73°N, 92.22°W) place the incident in the vicinity of Little Rock, though the precise location of the lights relative to the aircraft is not specified.

This document is a preliminary operations center notification — an internal FAA alert generated when something unusual is reported. It is not the result of a completed investigation, and the FAA did not reach any conclusion about what the lights were. There is little evidence of redaction in the record.

The report contains no radar data, sensor readings, or photographic evidence. What it does contain is a straightforward account from two independent commercial flight crews describing the same phenomenon in the same area at the same time.</div>
