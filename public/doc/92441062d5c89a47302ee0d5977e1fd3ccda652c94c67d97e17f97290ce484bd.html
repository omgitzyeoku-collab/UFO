  <h1>Pentagon Office Publishes Brochure Explaining How to Report UAP</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/92441062d5c89a47302ee0d5977e1fd3ccda652c94c67d97e17f97290ce484bd.jpg" alt="Pentagon Office Publishes Brochure Explaining How to Report UAP thumbnail" loading="lazy" />
  <p>This document is a public information brochure from the All-domain Anomaly Resolution Office (AARO), updated October 2024, explaining what UAP are, how AARO investigates them, and how military personnel, government employees, and civilian pilots can report sightings. It contains no specific incident data — it is an overview of AARO&#39;s mission and reporting procedures.</p>
  <div class="narr">This record (case number 330UAP000021) is not an incident report or investigation finding. It is a trifold brochure produced by the All-domain Anomaly Resolution Office (AARO), a Pentagon body established under congressional authority codified at 44 U.S.C. 2107 via the FY24 National Defense Authorization Act. The brochure was last updated in October 2024 and released in full, unclassified, with a classification review date of 3 March 2025.

The brochure defines Unidentified Anomalous Phenomena (UAP) as anomalous detections in airborne, seaborne, spaceborne, or transmedium domains that are not yet attributable to known actors. It lists common objects frequently misidentified as UAP, including airborne clutter, commercial or military aircraft, unmanned aerial vehicles, space launches, satellites, and celestial objects. An image of a Starlink 4-34 launch (credited to NASA) is included as an example.

AARO states its institutional assessment that UAP primarily result from domain-awareness gaps, while acknowledging that UAP may potentially represent advanced capabilities operating within those gaps. The office emerged from congressional recognition that UAP present possible hazards and threats across service, regional, and domain boundaries.

The brochure outlines reporting channels: military and DoD civilian personnel should report through their command or service per GENADMIN Joint Staff J3, while civilian pilots are encouraged to report UAP sightings through air-related Pilot Reports from the FAA. AARO is also accepting historical reports from current or former government employees, service members, or contractors about government UAP programs, with a public reporting form available at www.aaro.mil.</div>
