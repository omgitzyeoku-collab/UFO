  <h1>American Airlines Crew Reports Lights Below Their Plane Over Kansas</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/ecd68cbba4ed198067b31bdd17cedcc2273a4f3fcc44d8cd9badf1abcdccd114.jpg" alt="American Airlines Crew Reports Lights Below Their Plane Over Kansas thumbnail" loading="lazy" />
  <p>This FAA preliminary incident report documents a UAP sighting by the crew of American Airlines Flight 577 on September 15, 2023. Flying at 34,000 feet over Liberal, Kansas, the crew observed lights from unidentified objects roughly 2,000 feet below their aircraft. No evasive action was taken.</p>
  <div class="narr">This document is a preliminary incident notification from the FAA&#39;s Washington Operations Center — essentially an early-stage report logged when something unusual is reported in US airspace. It is not a final investigation or conclusion.

On September 15, 2023, the crew of American Airlines Flight 577, an Airbus A321 flying from Dallas/Fort Worth to Denver, reported an unidentified aerial phenomenon while cruising northwest at Flight Level 340 (34,000 feet) over Liberal, Kansas. The crew described the UAP as lights coming from unidentified objects, positioned approximately 2,000 feet below their aircraft. Kansas City ARTCC (Air Route Traffic Control Center) was the advising air traffic control facility.

The crew took no evasive action. The report was logged at 00:13 CDT and attributed to FAA Operations. No details are given about how long the sighting lasted, how many objects were involved, or how the lights moved.

The document contains no conclusions about what the crew saw. As a preliminary notification, its purpose is to record the report, not to explain it. There is minimal redaction, but equally minimal detail — the record captures the basics of who, what, where, and when, and nothing more.</div>
