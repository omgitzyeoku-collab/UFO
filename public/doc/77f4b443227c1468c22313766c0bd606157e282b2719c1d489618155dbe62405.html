  <h1>Two Commercial Crews Reported Unidentified Aerial Activity Over the Atlantic in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/77f4b443227c1468c22313766c0bd606157e282b2719c1d489618155dbe62405.jpg" alt="Two Commercial Crews Reported Unidentified Aerial Activity Over the Atlantic in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting on 8 August 2023 in which a FedEx cargo crew and a JetBlue passenger crew independently reported an unidentified aerial phenomenon near the Bahamas at roughly 40,000 feet. The crews described it as apparent military activity; the FAA closed the case without a stated resolution.</p>
  <div class="narr">On 8 August 2023 at 03:00, a FedEx MD-11 cargo aircraft (callsign FDX52) flying from San Juan to Miami at 38,000 feet reported an unidentified aerial phenomenon near coordinates 24°29&#39;N 72°50&#39;W — an area over the Atlantic between the Bahamas and Puerto Rico. The crew described what they saw as apparent military activity at approximately 40,000 feet. The sighting was logged by Miami Air Route Traffic Control Center (ARTCC) under incident ID ZMA-M-2023/08/07-0003.

About one minute later, a JetBlue Airbus A320 (flight JBU 1348) flying from San Juan to Washington Dulles at 34,000 feet independently reported a similar sighting in the same area. Two separate commercial crews, on different routes and at different altitudes, described the same phenomenon within a short window.

The FAA logged this as a SKYWATCH incident report — the agency&#39;s category for unidentified aerial phenomenon sightings reported by aircrew. The case is marked as closed, but the report provides no explanation of what was observed and no resolution. There is no radar data, sensor readings, or photographic evidence included; the report relies entirely on pilot visual observations.

The location sits in an area of the Atlantic known to contain military operating areas, which is consistent with the crews&#39; own description of the phenomenon as apparent military activity. The report itself neither confirms nor rules out a military explanation.</div>
