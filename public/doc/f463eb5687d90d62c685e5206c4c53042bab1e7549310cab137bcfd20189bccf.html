  <h1>Five Commercial Flights Reported Orbiting Lights Over New York State</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f463eb5687d90d62c685e5206c4c53042bab1e7549310cab137bcfd20189bccf.jpg" alt="Five Commercial Flights Reported Orbiting Lights Over New York State thumbnail" loading="lazy" />
  <p>An FAA incident report documents that JetBlue flight 811 and four other commercial aircraft reported seeing multiple orbiting lights at 36,000 feet near Rome, New York on the night of September 25, 2023. The crew compared the lights to aircraft landing lights near the Big Dipper constellation, and no evasive action was taken.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — a standard form the Federal Aviation Administration uses to log unusual events reported by pilots. It records a sighting of an unidentified aerial phenomenon (UAP) on the night of September 25, 2023, at 11:13 PM Eastern time.

JetBlue flight 811, flying from Boston to Chicago at 36,000 feet, reported multiple lights orbiting directly ahead of the aircraft (the 12 o&#39;clock position) while approximately 8 miles west-southwest of Rome, New York. The crew described the lights as similar in appearance to aircraft landing lights, and noted they were near the Big Dipper constellation. No evasive action was taken, and no law enforcement was notified.

The sighting was not limited to one aircraft. Four additional flights — identified by callsigns LXJ652, DAL2685, CMP422, and UAW5WR — reported similar observations. Boston Air Route Traffic Control Center was advised of the reports.

The FAA report does not include any conclusion about what the lights were. There is no reference to radar data, photographs, or any follow-up investigation. The document is a factual operational log of what pilots reported, not an analytical assessment.</div>
