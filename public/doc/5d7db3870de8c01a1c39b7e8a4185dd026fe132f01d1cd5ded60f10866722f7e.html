  <h1>Apollo 17 Science Debrief Recorded Unexplained UV and X-Ray Observations</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">1973</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5d7db3870de8c01a1c39b7e8a4185dd026fe132f01d1cd5ded60f10866722f7e.jpg" alt="Apollo 17 Science Debrief Recorded Unexplained UV and X-Ray Observations thumbnail" loading="lazy" />
  <p>This is an excerpt from NASA&#39;s Apollo 17 crew science debriefing, dated January 8, 1973. The transcript records scientists discussing unexpected ultraviolet and X-ray observations made during the mission, including a UV spectrum that resembled a hot star where no hot stars existed, and an unexplained X-ray background across the sky. These are astrophysics findings, not reports of unidentified craft.</p>
  <div class="narr">This document is a two-page excerpt (pages 119–120) from the Apollo 17 Crew Debriefing for Science, catalogued as MSC-07632 and dated January 8, 1973. It was prepared by NASA&#39;s Planetary and Earth Sciences Division at the Manned Spacecraft Center in Houston, Texas. The transcript captures scientists — including a speaker identified as Henry, along with Dr. Trombka — discussing results from ultraviolet and X-ray instruments carried on the mission.

One key finding concerned the Coma galaxy cluster. The team looked for Lyman-alpha radiation (a specific wavelength of ultraviolet light) from ionized hydrogen but found none, which ruled out ionized hydrogen as the force holding the cluster together. Separately, the team reported detecting a UV spectrum that looked like it came from a hot star, observed at the North and South Galactic Poles — but no hot stars were in the instrument&#39;s field of view.

The most conservative explanation offered was that the UV signal was starlight bouncing off interstellar dust, but the scientists noted that certain spectral characteristics did not fit that theory, leaving open the possibility that it was extragalactic radiation. Another result flagged as exciting was an unexpected X-ray background observed across the entire sky. The speaker emphasised that detailed computer analysis was still needed and that all conclusions were preliminary.

The document also discusses interstellar hydrogen streaming through the solar system and reflecting sunlight — a phenomenon previously observed by Gary Thomas at the University of Colorado and Charles Barthum (name uncertain) using the OGO-5 satellite. An abnormally high dark current in one instrument was noted but confirmed not to have interfered with the UV experiment results.</div>
