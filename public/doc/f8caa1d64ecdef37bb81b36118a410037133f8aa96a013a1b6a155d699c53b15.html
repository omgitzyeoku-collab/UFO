  <h1>Three Airline Crews Reported Erratic Lights North of Atlanta in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f8caa1d64ecdef37bb81b36118a410037133f8aa96a013a1b6a155d699c53b15.jpg" alt="Three Airline Crews Reported Erratic Lights North of Atlanta in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a September 2023 sighting in which a Delta Air Lines crew and two other commercial flights independently observed multiple dim and bright lights moving erratically above cruising altitude near Atlanta. The case was closed with no explanation provided.</p>
  <div class="narr">On 5 September 2023, the crew of Delta Air Lines flight DAL574 — a Boeing 757 flying from San Francisco to Atlanta — reported an unidentified aerial phenomenon while cruising eastbound at flight level 370 (roughly 37,000 feet), about 50 nautical miles north of Atlanta. They described multiple dim and bright lights orbiting with erratic movement above their altitude.

Two other commercial flights independently reported similar activity in the same area: Spirit Airlines flight NKS1828, an Airbus A320 travelling from Los Angeles to Atlanta, and Aeromexico flight AMX692, a Boeing 737 MAX 9 en route from Mexico City to Toronto. Having three separate crews observe the same phenomenon strengthens the report, though all observations were visual — no radar or sensor data is referenced in the document.

The crews took no evasive action and reported no impact on flight operations. The FAA logged the event under its SKYWATCH programme, which tracks unidentified aerial phenomenon reports. The case is now marked as closed, but the document provides no identification or explanation of what the lights were.

The report itself is brief and administrative in nature. There is minimal redaction, but also minimal investigation detail — it reads as a logging exercise rather than an analytical assessment.</div>
