  <h1>NASA-UAP-D021, Gemini 7 Technical Debriefing, 1965</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">December 19-21, 1965</span>
    <span class="badge">Cape Kennedy, Florida</span>
    
  </div>
  
  <p>This document is a preliminary transcript derived from voice recordings of the Gemini 7 flight crew debriefing conducted December 19-21, 1965, at the Crew Quarters, Cape Kennedy, Florida. Lights and flashes are mentioned and there is discussion about having proper illumination for vehicle docking. Borman and Lovell discuss celestial and terrestrial observational anomalies and note sightings of Mercury, meteors, aurora, and lightning. They also discuss not being able to see any stars once the Sun comes up.</p>
