  <h1>United Airlines Pilot Reports Small Red-Blue Object Near Denver</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/ff6e2ee10e75b3a23164df5e215e9fbe8ca700861973ddf6f56d831ef0eb12c3.jpg" alt="United Airlines Pilot Reports Small Red-Blue Object Near Denver thumbnail" loading="lazy" />
  <p>An FAA incident report documents a United Airlines pilot sighting of a small, red-and-blue unidentified object while flying south of Denver at 11,000 feet on 15 June 2024. The object did not appear on air traffic control radar, and the case was closed without identification.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — the system the Federal Aviation Administration uses to log pilot reports of unidentified aerial phenomena (UAP). It records an encounter reported by the crew of UAL1835, a United Airlines Airbus A319 flying a commercial route from Denver (DEN) to Knoxville (TYS) on 15 June 2024 at 22:22 local time.

According to the report, the aircraft was heading south at 11,000 feet, approximately 10 nautical miles south of Denver, when the crew observed an unidentified object below them. The phenomenon was described as red and blue in colour, roughly 3 to 4 feet in diameter, at an estimated altitude of approximately 10,000 feet — about 1,000 feet below the aircraft.

The FAA notes that the object was not detected on the air traffic control facility&#39;s radar system. The case is marked as closed, with no resolution or identification recorded in the document. No tail number for the reporting aircraft was logged.

The report was filed through FAA reporting facility D01. No additional witness accounts, photographs, or supplementary sensor data are referenced in the document.</div>
