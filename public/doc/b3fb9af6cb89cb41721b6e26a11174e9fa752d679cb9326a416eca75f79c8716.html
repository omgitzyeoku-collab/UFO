  <h1>FAA Report: Pilot Saw Circular Lights at 35,000 Feet in 2021</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/b3fb9af6cb89cb41721b6e26a11174e9fa752d679cb9326a416eca75f79c8716.jpg" alt="FAA Report: Pilot Saw Circular Lights at 35,000 Feet in 2021 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a general aviation pilot&#39;s sighting of a cluster of lights moving in a circular pattern at approximately 35,000 feet on 21 May 2021. The case was closed with no resolution or explanation provided, and no corroborating radar data or additional witness accounts are included in the document.</p>
  <div class="narr">On 21 May 2021, the pilot of a general aviation aircraft with callsign N992CE reported an unidentified aerial phenomenon to the FAA. The aircraft was flying northeast at 21,000 feet, approximately 9.6 nautical miles southeast of LFD, when the pilot observed something unusual off the 11 o&#39;clock position — to the left and slightly ahead.

The pilot described the phenomenon as a cluster of lights travelling in a circular direction at approximately 35,000 feet — roughly 14,000 feet above the aircraft&#39;s own altitude. Hillsdale Police Department was notified about the incident.

The FAA logged the sighting under its SKYWATCH programme as record 237UAP00052. The case status is marked as Closed, but the document provides no resolution, identification, or explanation for what the pilot observed.

Notably, the report contains no mention of air traffic control or other aircraft visually confirming the phenomenon. No radar data is referenced. This is a single-witness account recorded through the FAA&#39;s reporting system.</div>
