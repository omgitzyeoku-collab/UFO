  <h1>Pentagon Document Defines How It Classifies UAP Reports</h1>
  <div class="meta">
    <span class="badge">ODNI</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/24cf37e529767e7ee867e7ea553685041bb00de5e94408530110623dcaab20d0.jpg" alt="Pentagon Document Defines How It Classifies UAP Reports thumbnail" loading="lazy" />
  <p>This single unclassified page from a larger Department of Defense document lays out three official definitions the Pentagon uses when assessing Unidentified Anomalous Phenomena (UAP): attribution (what caused it), risk (safety hazard), and threat (hostile intent). It was cleared for public release on 17 October 2023.</p>
  <div class="narr">This record, catalogued as 576UAP0021 by the Office of the Director of National Intelligence (ODNI), is a single page — page 15 — extracted from a larger Department of Defense document. It contains no incident reports, witness accounts, or case data. Instead, it is a terminology reference page that defines three key terms the Pentagon uses when evaluating UAP.

The first term, &quot;UAP Attribution,&quot; refers to the assessed source of a phenomenon. The definition splits possible sources into natural events (solar activity, weather, tidal events) and artificial ones, which include both domestic activities (U.S. government, scientific, industry, and private) and foreign activities (allied or adversary government, scientific, industry, and private).

The second and third terms draw a clear line between safety and security. &quot;UAP Risk&quot; is defined as a safety hazard to people, equipment, or information — for example, the danger of a mid-air collision. &quot;UAP Threat&quot; is defined as a force-protection or national-security concern posed by UAP that demonstrate hostile intent. In short, a risk is accidental danger; a threat is deliberate.

The page is marked UNCLASSIFIED and was cleared for open publication on 17 October 2023 by the Department of Defense Office of Prepublication and Security Review. There is minimal redaction evident on this page.</div>
