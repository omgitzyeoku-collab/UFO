  <h1>Pentagon UFO Office Says Most Sightings Have Ordinary Explanations</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/84ce133b529aa93d4f566113a52268be23407b97b4f71686124639ea6d83b6cf.jpg" alt="Pentagon UFO Office Says Most Sightings Have Ordinary Explanations thumbnail" loading="lazy" />
  <p>The All-Domain Anomaly Resolution Office (AARO), the Pentagon&#39;s UFO investigation unit, published its 2025 mission briefing. It concludes that only a very small percentage of unidentified anomalous phenomena (UAP) reports show genuinely unexplained characteristics, with most cases traced to commercial aircraft, balloons, or camera artifacts.</p>
  <div class="narr">In June 2025, the All-Domain Anomaly Resolution Office — the U.S. Department of Defense unit Congress created to investigate unidentified anomalous phenomena, or UAP — released an unclassified mission briefing (document 25-P-0881). Presented by AARO Director Dr. Jon Kosloski, it lays out what the office does, how it is structured, how reports are filed, and walks through several high-profile cases.

AARO&#39;s stated mission is to reduce technical and intelligence surprises by identifying, attributing, and addressing UAP near national-security areas. The briefing defines UAP as detections across air, sea, space, or multiple domains that cannot yet be attributed to known actors. Its central finding: UAP are primarily the result of gaps in awareness of what is operating in a given area, not evidence of exotic technology.

The briefing examines several well-known incidents. A 2022 Middle East case involving a metallic orb recorded by an MQ-9 Reaper drone remains unresolved due to poor data quality, though AARO notes the object did not appear to demonstrate anomalous performance. The &quot;Go Fast&quot; video, released by the Defense Department in 2017, was reassessed: AARO determined with high confidence that the object was at roughly 13,000 feet altitude, moving between 5 and 92 mph in winds of about 69 mph — consistent with something drifting on the wind rather than flying under its own power. A case over the Western United States, where a P-3 pilot reported three unusual objects, was attributed to commercial airliners distorted by the camera&#39;s autofocus. A 2023 South Asia sighting of an object with an apparent propulsion trail was traced to video compression artifacts overlaying frames. Near Mt. Etna in 2018, an object was assessed with moderate confidence as a balloon drifting roughly 170 kilometres from the volcano.

AARO received more than 100 reports from the Federal Aviation Administration, but many cases remain unresolved because of a lack of verifiable data. The office also acknowledges a built-in collection bias: because it relies heavily on Defense Department sources, its reports cluster around military test ranges, special-use airspace, and operational areas rather than representing the full picture of UAP activity.</div>
