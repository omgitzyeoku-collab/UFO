  <h1>Military Infrared Video Captures Unidentified Object Over CENTCOM Region</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2021</span>
    <span class="badge">CENTCOM</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/de46a047b742c12692c28cd084569a793f2272ab450b47604043cc8ee3d7e901.jpg" alt="Military Infrared Video Captures Unidentified Object Over CENTCOM Region thumbnail" loading="lazy" />
  <p>This is a roughly five-minute infrared video recorded by a U.S. military sensor platform in the Central Command area of responsibility in January 2021, showing an unidentified area of contrast that the sensor tracks. The video was uploaded to a classified network and later released after a congressional request, though the agency notes many such materials lack a verified chain of custody.</p>
  <div class="narr">In January 2021, a U.S. military platform operating in the United States Central Command (CENTCOM) area of responsibility — a region covering the Middle East and parts of Central and South Asia — recorded a roughly five-minute infrared video. The footage, catalogued as DOW-UAP-PR076, captures what is described as an unidentified anomalous phenomenon (UAP).

The first one minute and fifty-one seconds of the video contain no content. From that point onward, an area of contrast becomes visible near the centre of the frame, and the sensor pans to track it. The video description in the metadata is truncated mid-sentence, so the full account of what was observed is incomplete. The specific military unit or platform involved is not identified — the callsign in the title is redacted.

The video came to public attention after eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records on 6 March 2026. The All-domain Anomaly Resolution Office (AARO) identified this video among responsive materials held on a classified network. AARO assesses that the footage is &quot;likely&quot; derived from an infrared sensor aboard a military platform, using qualified language that stops short of certainty.

AARO itself cautions that many of the materials in this collection lack a substantiated chain of custody — meaning there is no verified record tracking who handled the footage from the moment of capture to its storage on the classified network. This is a significant caveat when evaluating the evidential weight of the recording.</div>
