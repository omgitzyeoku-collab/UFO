  <h1>Two Airline Crews Reported a UFO Over North Carolina in 2012</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7ded2565d8c8adacc6035d663b6fae8c2160a810bd6842386f16dae6888286d4.jpg" alt="Two Airline Crews Reported a UFO Over North Carolina in 2012 thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents two aircraft crews flying at roughly 40,000 feet who reported seeing an unidentified object ten miles south of Elizabeth City, North Carolina, on 13 January 2012. No radar evidence confirmed the sighting, no other aircraft were in the area, and the case was closed without explanation.</p>
  <div class="narr">This is a one-page FAA SKYWATCH incident report filed under record 237UAP00015. It documents a UFO sighting reported on 13 January 2012 at 23:55 UTC. Two aircraft — callsigns FIV546 (a Cessna Citation 560) and WJA2668 — were flying southbound at flight level 400 (approximately 40,000 feet) when both crews reported seeing an unidentified object ten miles south of Elizabeth City, North Carolina.

The sighting was reported up the chain by a Washington Centre (ZDC) Operations Manager. Controllers checked radar and found no positive tracks in the area. They also confirmed there were no other known aircraft nearby. Two additional contacts were made: PXT Approach (a local radar facility) and Giant Killer (a military coordination unit that manages warning areas off the US East Coast). Neither reported any aircraft spilling out of restricted airspace.

The report offers almost no description of the object itself — no shape, size, colour, speed, or behaviour is recorded. The case status is listed as &quot;Closed&quot; with no resolution or identification provided. The FAA primary code for the incident is simply &quot;OTHER.&quot;

One administrative quirk: the record appears in a 2023 dataset, but the actual incident occurred in January 2012. The 2023 date most likely reflects when the record was processed or released to the public, not when the event took place.</div>
