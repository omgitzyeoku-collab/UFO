  <h1>Cessna Crew Reports Object with Green and Blue Lights Near Reno</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d815da1a052ac40ff6b4d9689bb2ec68377bcf4c358251d4448c2a29a15ab6f0.jpg" alt="Cessna Crew Reports Object with Green and Blue Lights Near Reno thumbnail" loading="lazy" />
  <p>An FAA incident report from March 5, 2023, documents a civilian aircraft crew spotting an unidentified object with green and blue lights approximately 10,000 feet above them near the California-Nevada border. The report is a single-source pilot observation with no corroborating radar data or follow-up conclusions included.</p>
  <div class="narr">On the evening of March 5, 2023, at approximately 8:45 PM Pacific time, the crew of a Cessna C560 (tail number N474PE) reported seeing an unidentified object while flying at 40,000 feet on a route from TRM to UAO. The object, described as a &quot;possible UFO&quot; with green and blue lights, was observed to the left of the aircraft at an estimated altitude of 50,000 feet — roughly 10,000 feet above them.

The sighting took place about 20 nautical miles north-northwest of the Mustang VORTAC navigation point, a location near Reno, Nevada, at coordinates 39.78°N, 120.00°W. Oakland Air Route Traffic Control Center (ARTCC), the FAA facility managing that airspace, was advised of the sighting.

The crew took no evasive action, and the report notes that no law enforcement notification was made. The document is a standard FAA Washington Operations Center incident report — a factual log of what was reported, not an investigation or analysis.

The FAA record contains no conclusions about what the object was. There is no mention of radar confirmation, additional witnesses, or any follow-up investigation. The report itself uses the qualifier &quot;possible UFO,&quot; reflecting the crew&#39;s own uncertainty about what they observed.</div>
