  <h1>Spirit Airlines pilot reported silver object near flight at 32,000 feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ac2014157f812ac395ff472c9b65e240d901062ba95fac592e4013f08a5b8eff.jpg" alt="Spirit Airlines pilot reported silver object near flight at 32,000 feet thumbnail" loading="lazy" />
  <p>An FAA incident report documents a Spirit Airlines pilot flying from Cancún to Houston who observed an unidentified silver object, roughly the size of a small business jet, passing less than 1,000 feet above the aircraft at approximately 32,000 feet over the Gulf of Mexico on 4 February 2024. No evasive action was taken and no corroborating radar data is included in the report.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed under record number 237UAP00608. It records what a commercial airline pilot reported seeing during a routine flight.

On 4 February 2024, Spirit Airlines flight 1337 — an Airbus A320 flying northwest from Cancún, Mexico to Houston George Bush Intercontinental Airport — was cruising at flight level 320 (approximately 32,000 feet). The crew reported an unidentified aerial phenomenon less than 1,000 feet above their aircraft, roughly 110 nautical miles east-southeast of Houston, over the Gulf of Mexico. The object was described as silver in colour and about the size of a small business jet.

The crew did not take evasive action. Houston Air Route Traffic Control Center (ARTCC) was advised of the sighting. The nearest other aircraft was several miles away from Spirit 1337 at the time.

The report is marked as preliminary information, which suggests a final version may exist with additional findings. The FAA document does not offer any conclusion about what the object was. There is no mention of radar confirmation or additional witness accounts beyond the flight crew&#39;s observation.</div>
