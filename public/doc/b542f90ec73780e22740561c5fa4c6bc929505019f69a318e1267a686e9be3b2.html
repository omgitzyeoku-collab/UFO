  <h1>Military Infrared Video Shows Four Unidentified Objects Over Water Near Iran</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2022</span>
    <span class="badge">CENTCOM</span>
    <span class="badge">verified</span>
  </div>
  
  <p>This 20-second infrared video, catalogued as DOW-UAP-PR050, was captured by a U.S. military sensor in the Central Command region and shows four unidentified objects moving in formation over water on 26 August 2022. The video was uploaded to a classified network two years later and lacks a verified chain of custody.</p>
  <div class="narr">In August 2022, a sensor aboard a U.S. military platform operating in the U.S. Central Command (CENTCOM) region recorded a 20-second infrared video showing four unidentified aerial phenomena moving in formation over water. The objects appear as four areas of contrast entering from the lower-left of the frame and exiting near the centre-bottom between the 1-second and 4-second marks. At least one additional object appears shortly after.

The video&#39;s uploader-defined title references Iran, though the All-domain Anomaly Resolution Office (AARO) has not independently verified that as the precise location. AARO assessed that the footage was &quot;likely&quot; captured by an infrared sensor on a U.S. military platform — notably using qualified language rather than confirming it outright. The recording was uploaded to a classified network in June 2024, a full two years after the reported incident.

This video is one of 51 potentially UAP-related records that eight members of the U.S. House of Representatives requested access to on 6 March 2026. AARO identified responsive materials on a classified network, but noted that many of them lack a substantiated chain of custody — meaning there is no verified record of who handled the materials between capture and upload.

Significant details remain obscured. The military callsign in the title is redacted, preventing identification of the specific platform involved. No extracted text was available from the source document, so all publicly available facts come from metadata and a CSV description. The video description itself is truncated, covering only the first six seconds of the 20-second recording.</div>
