  <h1>SkyWest Crew Reports Two Maneuvering Lights Over Central Texas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/13e78da5407ee30e379b50b1aa2acdf8f3eb2ab87be8dbbbff06a299baa93563.jpg" alt="SkyWest Crew Reports Two Maneuvering Lights Over Central Texas thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of SkyWest Flight 3260, who observed two maneuvering lights roughly 100–150 miles north of their aircraft while flying at 37,000 feet near Austin, Texas on May 18, 2024. Air traffic control confirmed the lights did not appear on radar.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed under record number 237UAP00628. It records a UAP (unidentified anomalous phenomena) sighting reported by the flight crew of a commercial airline.

On May 18, 2024, the crew of SkyWest Flight 3260 — an Embraer E175 regional jet flying from Phoenix to Houston — spotted two maneuvering lights while cruising eastbound at flight level 370 (37,000 feet), approximately 30 miles west of Austin, Texas. The crew estimated the lights were 100 to 150 miles north of their aircraft and above their altitude. The report was filed late, at 0150 Central Daylight Time.

Houston ARTCC (Air Route Traffic Control Center) was advised of the sighting. Controllers confirmed that the objects were not observed on radar. The crew did not take evasive action, and law enforcement was not notified.

The FAA report does not offer any explanation or identification of the lights. It records the observation and the absence of radar corroboration, but draws no conclusion about what the crew saw.</div>
