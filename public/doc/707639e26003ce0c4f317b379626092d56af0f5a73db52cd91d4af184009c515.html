  <h1>1949 Military UFO Reports Compiled Across US Bases Mostly Unexplained</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">1/9/50</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/707639e26003ce0c4f317b379626092d56af0f5a73db52cd91d4af184009c515.jpg" alt="1949 Military UFO Reports Compiled Across US Bases Mostly Unexplained thumbnail" loading="lazy" />
  <p>This Department of War file compiles multiple UFO sighting reports from mid-1949 to early 1950, submitted by US Air Force Flight Service Centers under a 1948 regulation requiring reporting of unidentified flying objects. Witnesses included military personnel, civilian pilots, and air traffic controllers who described objects ranging from spherical lights to delta-wing formations, with only one sighting conclusively explained as a weather balloon.</p>
  <div class="narr">This file is a collection of military incident reports on unidentified flying objects gathered by various US Air Force (USAF) Flight Service Centers between mid-1949 and early 1950. The reports were filed under Flight Service Regulation 200-4, dated 2 November 1948, which required military units to document UFO sightings and forward them to the Commanding General at Air Materiel Command, Wright-Patterson Air Force Base, Ohio.

The sightings span the continental United States and extend to Guam and Alaska. They include two spherical, brilliantly white objects hovering at 7,000–8,000 feet over Kansas City on 6 January 1950; a silvery cylindrical object descending through cloud cover near Griffiss Air Force Base, New York, on 20 September 1949; eight dish-shaped objects — each reportedly larger than a B-29 bomber — flying in formation over Spokane, Washington, on 26 July 1949; and seven delta-wing objects in a V formation traveling over 600 mph near Mountain Home, Idaho, on 24 July 1949. Near Portland, Oregon, on 30 July 1949, a Northwest Airlines pilot attempted to chase an object displaying two red lights and one white light, but it pulled away easily. Over Seattle on 22 August 1949, observers estimated a circular, shiny aluminum object at 75–100 feet in diameter moving at 500–600 mph. A weather reconnaissance unit near Guam reported apparent radar jamming on 2 May 1949, and a Pacific Ocean sighting on 8 June 1949 claimed a speed of 4,200 mph based on triangulation.

Witnesses ranged from military officers and enlisted personnel to civilian pilots and Civil Aeronautics Administration controllers. Of all the sightings compiled in this file, only one — a round grey object over Greenville, South Carolina, on 15 August 1949 — was resolved with a conventional explanation: it was identified as a weather balloon released in Tennessee. The rest have no stated resolution in these records.

The documents carry classification markings of RESTRICTED and CONFIDENTIAL throughout, indicating they were not originally intended for public release. Several pages are heavily degraded transmission cover sheets that contribute no usable information, and the overall OCR quality is poor, meaning some details may be lost or misread.</div>
