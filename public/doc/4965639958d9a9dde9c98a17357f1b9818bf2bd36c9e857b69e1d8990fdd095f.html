  <h1>Gemini 7 Crew Reported Unidentified Object and Particles in 1965 Orbit</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>This is an audio excerpt from NASA&#39;s Gemini 7 mission in 1965, replayed by Houston mission control, in which the crew reported seeing an unidentified object and small particles during their second orbit near Antigua. The object, referred to as a &quot;bogey,&quot; was distinct from the spacecraft&#39;s own booster and nearby particles.</p>
  <div class="narr">This document is an audio recording from NASA&#39;s Gemini 7 mission, flown in 1965. Houston mission control replayed the excerpt, which captures crew communications about sighting several unusual objects during the spacecraft&#39;s second orbit around Earth. The sighting occurred in the area of Antigua, roughly four hours and twenty-four minutes into the flight.

The crew described three distinct things: small particles passing on the left side of the spacecraft at an estimated distance of three to four miles, the Gemini 7 booster (which would have been a known object nearby), and a separate unidentified object. The crew called the unidentified object a &quot;bogey&quot; — standard aviation shorthand for something unidentified, not a term that implies any particular origin. The bogey was reported at the 10 o&#39;clock high position, ahead of the spacecraft. The particles appeared to be travelling in a polar orbit.

The original tape of this exchange was initially unavailable due to a mechanical line breakdown between two NASA buildings (Building 30 and Building 6). The version heard in this recording was dubbed from a master tape after the technical failure was resolved, which introduces a gap in the chain of custody for the audio.

NASA does not present a conclusion in this excerpt about what the bogey or particles were. The recording simply documents what the crew observed and communicated to mission control.</div>
