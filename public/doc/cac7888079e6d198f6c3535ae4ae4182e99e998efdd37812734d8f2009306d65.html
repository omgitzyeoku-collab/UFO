  <h1>Multiple Pilots Report Erratic Flashing Object at Extreme Altitude</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/cac7888079e6d198f6c3535ae4ae4182e99e998efdd37812734d8f2009306d65.jpg" alt="Multiple Pilots Report Erratic Flashing Object at Extreme Altitude thumbnail" loading="lazy" />
  <p>This FAA incident report from November 2023 documents multiple aircraft crews observing an unidentified aerial phenomenon with flashing lights at altitudes far above normal flight ceilings. The object was reported changing altitude erratically between roughly 50,000 and 90,000 feet, and the case was closed with no follow-up investigation detailed.</p>
  <div class="narr">On 9 November 2023 at 02:55, the FAA&#39;s Memphis Air Route Traffic Control Center (ZME) logged an incident under its SKYWATCH system — a programme for tracking unidentified aerial phenomena. The report was filed under code &quot;Unidentified Aerial Phenomenon&quot; and later closed without any public follow-up.

Multiple aircraft at different altitudes — 28,000, 34,000, and 45,000 feet — independently reported observing the same unknown object. The phenomenon was described as having flashing lights and changing altitudes erratically. Its position was logged at a navigational fix designated ARG324080, with an altitude range between FL500 and FL900 — that is, between roughly 50,000 and 90,000 feet. Both of those figures are well above the ceiling of typical commercial aircraft, which generally fly no higher than about 43,000 feet.

The report is a single page. It contains no radar data, no sensor corroboration, and no aircraft identifiers for the crews who made the reports. The geographic location is referenced only by a radial/distance fix (ARG324080) and the Denver point of departure code (DEN), with no plain-language place name given. The case status is listed as &quot;Closed,&quot; with no indication of further investigation or any conclusion about what the object was.</div>
