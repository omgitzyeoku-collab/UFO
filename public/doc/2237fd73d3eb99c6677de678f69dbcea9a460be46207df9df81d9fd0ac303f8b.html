  <h1>Learjet Pilot Reports Silver Softball-Sized Object Near Nantucket at 18,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/2237fd73d3eb99c6677de678f69dbcea9a460be46207df9df81d9fd0ac303f8b.jpg" alt="Learjet Pilot Reports Silver Softball-Sized Object Near Nantucket at 18,000 Feet thumbnail" loading="lazy" />
  <p>An FAA incident report documents a Learjet 45 pilot sighting a small, silver, softball-sized object while descending through 18,000 feet on approach to Nantucket on 19 October 2023. The case was reported to Boston Center and closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under the category &quot;Unidentified Aerial Phenomenon.&quot; It records an event on 19 October 2023 at 11:41, involving a Learjet 45 (callsign N823HL) flying from Northeast Philadelphia Airport (PNE) to Nantucket Memorial Airport (ACK) as a general aviation flight.

While descending through flight level 180 — roughly 18,000 feet — the pilot reported an unidentified object off the right side of the aircraft. The object was described as silver, about the size of a softball, and moving in a west/southwest direction. The sighting was reported to Boston Center (ZBW), the FAA facility responsible for air traffic control in that region.

The FAA marked the case as closed. The document does not include any resolution, identification of the object, or further investigation notes. There is no corroborating radar data or additional witness testimony in the report.

No tail number or operator name is recorded in the document beyond the callsign, which limits the ability to independently verify the flight details. The report is a single-page administrative record rather than a detailed investigation file.</div>
