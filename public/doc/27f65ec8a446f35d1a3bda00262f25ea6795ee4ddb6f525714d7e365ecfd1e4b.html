  <h1>American Airlines crew reported high-altitude balloon near Missouri in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/27f65ec8a446f35d1a3bda00262f25ea6795ee4ddb6f525714d7e365ecfd1e4b.jpg" alt="American Airlines crew reported high-altitude balloon near Missouri in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents an American Airlines flight crew observing a large balloon at roughly 50,000 feet while flying from Chicago to Tucson on 3 February 2023. The object was coded as an Unidentified Aerial Phenomenon but the case was closed without any identification or resolution.</p>
  <div class="narr">On 3 February 2023, the crew of American Airlines flight 639 (callsign AAL639), flying westbound from Chicago O&#39;Hare to Tucson at 34,000 feet, reported a large balloon off the right side of their aircraft. The sighting occurred about 13 nautical miles northwest of St. Joseph, Missouri, and was reported to Kansas City Center (ZKC), the FAA air traffic control facility for that region.

The crew described the object as a large balloon estimated at approximately 50,000 feet or above — well above the aircraft&#39;s own altitude and near the upper limits of where conventional aircraft operate. Despite the crew&#39;s own description of the object as a balloon, the FAA logged the incident under its SKYWATCH system with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

The report is notable for its timing: 3 February 2023 fell during a period of heightened concern over unidentified balloons in US airspace, most prominently the Chinese surveillance balloon that was tracked across the country and shot down the following day. Whether this sighting is connected to those events is not stated in the document.

The case is marked as closed. No resolution or identification details are provided, no corroborating sensor data is mentioned, and no tail number was recorded for the reporting aircraft.</div>
