  <h1>Allegiant Air Crew Reported Lights at 60,000 Feet Over Mississippi</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/6948e303526df55b9b9891f3d8e0a311130d38ddb86e2d8ee2fa54415226bff3.jpg" alt="Allegiant Air Crew Reported Lights at 60,000 Feet Over Mississippi thumbnail" loading="lazy" />
  <p>This FAA incident report documents a July 2022 sighting by the crew of Allegiant Air Flight 913, who observed unidentified lights with no contrail travelling at approximately 60,000 feet or above while flying near Greenville, Mississippi. The report is a single-page operational log entry with no follow-up investigation or conclusions recorded.</p>
  <div class="narr">This document is an incident report from the FAA Washington Operations Center. It records that on the evening of 17 July 2022 (18 July in UTC), the crew of Allegiant Air Flight 913 — an Airbus A320 flying southeast at approximately 37,000 feet — observed something unusual above their aircraft near Greenville, Mississippi (coordinates 33.48°N, 90.99°W).

The crew described the phenomenon as lights with no contrail, travelling at approximately flight level 600 — roughly 60,000 feet — or above. That altitude is well beyond the ceiling of most commercial and military aircraft. No details on shape, size, speed, or how long the crew observed the lights are included in the report.

The sighting was forwarded to the National UFO Reporting Center. The document contains no indication of radar corroboration, sensor data, or any follow-up investigation. It reads as a preliminary operational log entry rather than a completed inquiry.

One notable discrepancy: the government&#39;s own release metadata lists this as a 2023 incident, but the document itself clearly dates the event to July 2022. No explanation for this mismatch is provided.</div>
