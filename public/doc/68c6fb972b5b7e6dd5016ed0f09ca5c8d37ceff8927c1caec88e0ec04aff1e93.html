  <h1>Airline Crew Reports Large Balloon at 50,000 Feet Over Missouri</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/68c6fb972b5b7e6dd5016ed0f09ca5c8d37ceff8927c1caec88e0ec04aff1e93.jpg" alt="Airline Crew Reports Large Balloon at 50,000 Feet Over Missouri thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by an American Airlines crew on 3 February 2023. While flying eastbound at 39,000 feet, the crew of flight AAL518 observed a large balloon estimated at approximately 50,000 feet or higher, roughly 35 nautical miles southeast of St. Joseph, Missouri. The FAA classified the event as an Unidentified Aerial Phenomenon and the case is now closed.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unusual aerial observations. It records an event on 3 February 2023 involving American Airlines flight 518 (callsign AAL518), a Boeing 737-800 operating from San Diego (SAN) to Chicago O&#39;Hare (ORD).

While eastbound at flight level 390 (39,000 feet), the flight crew reported a large balloon ahead of the aircraft. The balloon was located approximately 35 nautical miles southeast of St. Joseph, Missouri, and was estimated to be at flight level 500 (around 50,000 feet) or higher. The sighting was reported through Kansas City Air Route Traffic Control Center (ZKC).

The FAA catalogued the object under its primary code of &quot;Unidentified Aerial Phenomenon.&quot; Despite that label, the crew themselves described what they saw simply as a large balloon. The case status is listed as closed. No further conclusions, identification, or follow-up actions are included in the document.

The timing is worth noting: 3 February 2023 falls during the period when multiple high-altitude balloon objects were detected over US airspace, including a Chinese surveillance balloon that was widely reported in the news. This report does not draw any connection to those events, but the date provides context for the observation.</div>
