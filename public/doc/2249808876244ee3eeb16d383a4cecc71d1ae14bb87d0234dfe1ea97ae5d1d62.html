  <h1>Pilot Reports Shiny Missile-Shaped Object Climbing Near Lynchburg, Virginia</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2249808876244ee3eeb16d383a4cecc71d1ae14bb87d0234dfe1ea97ae5d1d62.jpg" alt="Pilot Reports Shiny Missile-Shaped Object Climbing Near Lynchburg, Virginia thumbnail" loading="lazy" />
  <p>This FAA incident report documents a pilot&#39;s sighting of an unidentified aerial phenomenon on January 26, 2023, near Lynchburg, Virginia. The pilot of an Embraer E135 regional jet described a shiny, missile-shaped object climbing through 36,000 feet with a smoke trail. No follow-up investigation or resolution is included in the report.</p>
  <div class="narr">On the evening of January 26, 2023, at 6:53 PM Eastern time, the pilot of an Embraer E135 aircraft (tail number N926FM) reported an unidentified aerial phenomenon to the FAA&#39;s Washington Operations Center. The aircraft was descending from 36,000 to 34,000 feet approximately 10 nautical miles northeast of Lynchburg, Virginia (coordinates 37.43°N, 79.07°W).

The pilot reported the object directly ahead at the 12 o&#39;clock position. It was described as a shiny, missile-shaped object climbing through 36,000 feet — roughly the same altitude as the aircraft — and leaving a visible smoke trail behind it.

The report notes that no law enforcement notification was made. The document contains no mention of radar data, additional witnesses, or any corroborating evidence beyond the single pilot&#39;s account.

The FAA filed this as an incident report but the document includes no follow-up investigation, analysis, or conclusion about what the object was. It is a raw operational record — a snapshot of what was reported in the moment, not an assessed finding.</div>
