  <h1>Commercial Pilot Reports Oblong Object at 37,000 Feet Near Texas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/066781c4aaf7273a886b7747ce992e2443ce5558d13237495b187ea3657f5f12.jpg" alt="Commercial Pilot Reports Oblong Object at 37,000 Feet Near Texas thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a Spirit Airlines crew observing a round, black-and-white oblong object — roughly the size of a regional jet — while flying at 37,000 feet on 21 August 2023. The case was closed with no identification or explanation provided.</p>
  <div class="narr">This is an FAA SKYWATCH incident report filed under case number 237UAP00290, categorised as an Unidentified Aerial Phenomenon. It records an observation made by the crew of Spirit Airlines flight NKS797, a commercial service from Houston (IAH) to Fort Lauderdale (FLL), on 21 August 2023.

While flying eastbound at flight level 370 (approximately 37,000 feet), the crew reported seeing an object off the left side of the aircraft, located 11 nautical miles southwest of the PCU navigation waypoint. They described it as round, black and white, and oblong in shape — approximately the size of an Embraer E-145 regional jet. The object was travelling westbound (opposite to their direction) at between 36,000 and 37,000 feet.

No evasive action was taken and no operational impact was reported. The FAA&#39;s internal record (MOR ID: ZHU-M-2023/08/21-0003, indicating Houston Center airspace) notes that AWO was notified.

The case status is listed as Closed. The report contains no resolution, no identification of the object, and no indication that radar data or other sensor evidence was reviewed. There is no mention of corroborating witnesses or follow-up investigation in the document.</div>
