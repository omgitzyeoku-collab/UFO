  <h1>U.S. Military Compiled UFO Incident Reports Across Seven States in Early 1948</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f4b5cf6a93fe47c09123ce53706e430c814229ed688a49a96244a90b4bcf3e05.jpg" alt="U.S. Military Compiled UFO Incident Reports Across Seven States in Early 1948 thumbnail" loading="lazy" />
  <p>This Department of War document collects official military checklists and witness statements for eleven unidentified flying object reports (Incidents #101–111) from February to April 1948. The most detailed case — an explosion over Norcatur, Kansas — drew conflicting witness descriptions and puzzled a leading meteorite expert, while other sightings spanned locations from Utah to the Philippines.</p>
  <div class="narr">This document is a set of U.S. military incident summary checklists and supporting materials covering eleven UFO reports filed between February and April 1948. Each incident follows a standardised checklist format recording date, location, shape, altitude, speed, and observer details. The reports come from military personnel, civilian witnesses, and in one case an anonymous source relayed through the FBI.

The most extensively documented case is Incident #101, an explosion over Norcatur, Kansas on 18 February 1948. The event was visible across five states — Oklahoma, New Mexico, Colorado, Kansas, and Nebraska. A meteorite fragment weighing roughly 109 pounds was recovered embedded two feet in the soil, and the stone was classified as an unusual type of stony meteorite that deteriorates rapidly. Despite this recovery, Dr. Lincoln LaPaz, a meteorite expert, noted that intensive searches failed to turn up meteoritic material from the main event, which he found curious. Three personnel at McCook Field Air Base described the object not as a fireball but as a black object with an extremely bright jet of flame pouring out of the rear — a description independently echoed by a 14-year-old schoolgirl in Oberlin, Kansas. A local farmer, Leland Sammons, claimed the object hovered near his house before departing at high speed, though Dr. LaPaz flagged this testimony as extraordinary and under investigation for the witness&#39;s reliability.

Other incidents in the collection vary widely. Incidents #102 and #103 record a huge multi-coloured ball of fire with dense smoke observed from a B-29 aircraft near Green River, Utah. Incident #105 describes a round, metallic-appearing sphere near Belmont, North Carolina estimated at 600 MPH with no sound. Four sightings near Bakersfield, California (Incidents #106–109) were assessed by Fourth Air Force intelligence as likely marker flares. Incident #110, from Baltimore, Maryland, was audio-only — a report of unidentified sounds resembling foreign aircraft motors heard over several weeks, relayed anonymously through the FBI. Incident #111, from the Philippines, describes a half-moon shaped object resembling a flying wing with a dorsal fin, estimated at 30 feet wingspan and 200 MPH.

The document also contains speculative correspondence from a civilian, Norman Markham, theorising about lunar spacecraft. Dr. LaPaz explicitly dismissed this as &quot;fantastic.&quot; LaPaz himself estimated that 99% of &quot;flying lenses&quot; reports were hoax or imagination, with only 1% warranting serious attention — yet he still found the Norcatur case genuinely puzzling. The document includes moderate redactions throughout, and OCR artifacts from poor scan quality make portions of the text partially illegible.</div>
