  <h1>American Airlines Crew Reports Seven Lights at 33,000 Feet Near Dallas</h1>
  <div class="meta">
    <span class="badge">FAA</span>

    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/b6b96b02fc2c5f407fc46649d8f6abc8ba3e31beb8b6d61dce4627e44f8ab0f7.jpg" alt="American Airlines Crew Reports Seven Lights at 33,000 Feet Near Dallas thumbnail" loading="lazy" />
  <p>An FAA preliminary report documents the crew of American Airlines Flight 821 observing seven unidentified lights while flying at 33,000 feet near Dallas-Fort Worth, Texas on July 23, 2023. The report records the sighting but contains no analysis, identification, or conclusion about what the lights were.</p>
  <div class="narr">This document is a preliminary information report from the FAA&#39;s Washington Operations Center. It records a UAP (unidentified aerial phenomenon) sighting reported by the crew of a commercial flight near Dallas-Fort Worth, Texas.

On July 23, 2023, at approximately 2:07 AM Central time, the crew of American Airlines Flight 821 — an Airbus A321 flying from San Antonio to Charlotte — reported seeing an unidentified aerial phenomenon off the left side of their aircraft. The plane was flying eastbound at flight level 330, roughly 33,000 feet, and was four miles east of Ranger VOR, a navigation point near Dallas-Fort Worth.

The crew described seven lights traveling westbound at the same altitude as their aircraft — meaning the lights were heading in the opposite direction. No evasive action was taken. Fort Worth Air Route Traffic Control Center (ARTCC) was advised of the sighting.

The report is a preliminary operations center log entry, not a full investigation. It contains no analysis of what the lights might have been, no radar data, and no corroborating witness accounts beyond the flight crew. The FAA reached no conclusion in this document about the nature of the observed lights.

There is little evidence of redaction in the document. The information presented is straightforward but limited — it records what the crew reported and nothing more.</div>
