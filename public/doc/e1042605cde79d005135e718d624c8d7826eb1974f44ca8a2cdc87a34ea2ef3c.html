  <h1>Frontier Airlines crew reported white lights at 38,000 feet over Georgia</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e1042605cde79d005135e718d624c8d7826eb1974f44ca8a2cdc87a34ea2ef3c.jpg" alt="Frontier Airlines crew reported white lights at 38,000 feet over Georgia thumbnail" loading="lazy" />
  <p>This FAA incident notification records a UAP sighting by the crew of Frontier Airlines Flight 1024 on April 14, 2023. Flying at approximately 38,000 feet near Macon, Georgia, the crew observed two or three white blooming lights estimated to be over Tennessee, at altitudes between 38,000 and 42,000 feet. No evasive action was taken and no follow-up investigation is included in the document.</p>
  <div class="narr">This document is an incident notification from the FAA&#39;s Washington Operations Center, the agency&#39;s round-the-clock coordination hub. It records a UFO/UAP sighting reported by a commercial airline crew during a routine domestic flight.

On April 14, 2023, at 00:52 Eastern time, the crew of Frontier Airlines Flight 1024 — an Airbus A320neo flying from Orlando to Chicago Midway — reported an unidentified aerial phenomenon to Atlanta ARTCC (Air Route Traffic Control Center), the regional air traffic control facility. The aircraft was flying northbound at approximately 38,000 feet, about 20 nautical miles south of Macon, Georgia.

The crew described seeing two or three white blooming lights, which they estimated to be somewhere over Tennessee, at altitudes between roughly 38,000 and 42,000 feet. No evasive action was taken by the aircraft, and no law enforcement notification was reported.

The document does not include any follow-up investigation, resolution, or explanation of what the lights may have been. There is no mention of corroborating radar data or additional witness accounts from other aircraft or ground observers. The coordinates recorded in the document correspond to the aircraft&#39;s own position near Macon, Georgia — not the position of the lights themselves.

Redaction in this document is minimal. What is notable is not what was removed, but what was never included: there is no analysis, no conclusion, and no indication the sighting was investigated further. The record is simply a notification that the event occurred.</div>
