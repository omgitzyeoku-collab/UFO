  <h1>U.S. Embassy reported unidentified high-speed aircraft over Papua New Guinea in 1985</h1>
  <div class="meta">
    <span class="badge">Department of State</span>
    <span class="badge">1/24/85</span>
    <span class="badge">Papua New Guinea</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/74032ed145b1badbb1049005b4b77ba95351cb573c3cf6578a77ca25f4033220.jpg" alt="U.S. Embassy reported unidentified high-speed aircraft over Papua New Guinea in 1985 thumbnail" loading="lazy" />
  <p>A 1985 U.S. State Department cable from the Embassy in Port Moresby reported that Papua New Guinea&#39;s intelligence agency asked about unidentified high-altitude, high-speed aircraft seen over the country on the evening of January 24, 1985. The Embassy denied any knowledge of U.S. aircraft in PNG airspace that night and asked U.S. Pacific Command for confirmation.</p>
  <div class="narr">On January 28, 1985, the U.S. Embassy in Port Moresby, Papua New Guinea, sent a diplomatic cable marked &quot;Limited Official Use&quot; to USCINCPAC (the U.S. Commander in Chief, Pacific) in Honolulu. The cable reported that PNG&#39;s National Intelligence Organization (NIO) had made an informal inquiry about sightings of unidentified aircraft over the country four days earlier, on the evening of January 24.

According to the cable, an Air Niugini commercial pilot reported that his radar picked up aircraft flying south to north at high altitude and high speed while he was over Angoram, a town in the East Sepik region. Multiple witnesses across PNG also reported seeing contrails. At 7:00 PM local time, one aircraft was observed moving north to south; at 10:00 PM, six to eight aircraft were seen traveling south to north. The objects were described as fast-moving with lights, contrails, and noise. Local residents were frightened enough that the provincial premier called a public meeting, which was attended by the Prime Minister, who happened to be in his electoral district for the weekend.

The Embassy told PNG&#39;s intelligence agency that it knew of no B-52 overflights and no U.S. aircraft in PNG airspace on January 24. The cable asked U.S. Pacific Command to confirm this. Notably, the cable itself acknowledged that the information was &quot;very sketchy&quot; and that sources were unsure of the directions the aircraft were flying.

This document was originally classified as &quot;Limited Official Use&quot; and has since been released in full by the U.S. Department of State. No follow-up cable or resolution is included — from this document alone, the outcome of the Embassy&#39;s inquiry to Pacific Command is unknown.</div>
