  <h1>FBI Newark Office Logged UFO Reports Across New Jersey for 15 Years</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">August 1952-1967</span>
    <span class="badge">New Jersey, United States</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/04195d918cf49bc4d32b050060f12dbd16bac2cb79b83e2d70b63543a1b68630.jpg" alt="FBI Newark Office Logged UFO Reports Across New Jersey for 15 Years thumbnail" loading="lazy" />
  <p>This file contains internal FBI memoranda from the Newark Field Office documenting UFO sighting reports received from New Jersey civilians and military personnel between 1952 and 1967. The FBI did not investigate the sightings itself — it forwarded them to the Air Force — and no conclusions or case outcomes are included in the file.</p>
  <div class="narr">Between 1952 and 1967, the FBI&#39;s Newark Field Office received dozens of UFO sighting reports from residents across New Jersey. This document is a collection of internal memoranda, letters, and attached publications from that period. The FBI&#39;s role was essentially clerical: when someone called in a sighting, the office logged it and forwarded the information to the Air Force Office of Special Investigations (OSI), which had responsibility for UFO cases.

The reports describe a wide range of objects. In November 1957, a family in Glen Ridge saw a long, cylindrical, dark silver object with fins but no wings. That same year, an Air Force Reserve Captain in Clifton reported an object shaped like an underwater demolition bomb emitting a cross-shaped light. In February 1958, a woman in Union observed a bullet-shaped silver object at high altitude with a vapor trail. On October 28, 1959, seven separate callers phoned the Newark office within roughly an hour to report a bright object with twinkling lights surrounded by haze. In July 1966, two women in West Orange saw three white objects that disappeared when two planes approached from opposite directions, as if chasing them.

The file also contains correspondence between agencies. In August 1952, the Air Technical Intelligence Center at Wright-Patterson Air Force Base asked the FBI to investigate the background of a civilian photographer named John H. Riley and a witness named George J. Stock in connection with UFO photographs taken in the Passaic–Paterson area. In February 1963, a USAF Major who had served as the Department of Defense spokesman for Project Blue Book sent FBI Director J. Edgar Hoover a copy of a flying saucer publication. A member of NICAP (the National Investigations Committee on Aerial Phenomena) from Matawan wrote to Arizona State Police asking whether the Air Force had compelled them to withhold UFO information from the public.

The file includes some unusual material. One New Jersey woman theorised that UFOs could be used to photograph installations like Boulder Dam, tying this to a former art teacher she believed had communist sympathies. A man in Westfield tried to report his sighting to local police but was told they were too busy shovelling snow. An author named Richard Ogden announced plans to self-publish a book critical of the government&#39;s handling of UFOs, saying he expected to be arrested upon its release. Attached to the file is a newsletter from the Amalgamated Flying Saucer Clubs of America — included as an exhibit, not as FBI analysis or endorsed content.

No investigation results, case dispositions, or official conclusions appear anywhere in these documents. The file shows what people reported and how the bureaucracy routed the paperwork, but not what, if anything, was ever determined about the sightings.</div>
