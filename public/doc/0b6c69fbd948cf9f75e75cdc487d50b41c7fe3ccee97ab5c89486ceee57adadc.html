  <h1>FBI Files Show Radar Tracked Object at 4,500 MPH in 1957</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0b6c69fbd948cf9f75e75cdc487d50b41c7fe3ccee97ab5c89486ceee57adadc.jpg" alt="FBI Files Show Radar Tracked Object at 4,500 MPH in 1957 thumbnail" loading="lazy" />
  <p>This is the final installment of the FBI&#39;s released UFO files, containing mostly illegible sighting report forms and a few readable internal memos. The most substantive section describes a September 1957 radar detection over the Long Island–Pennsylvania area of an object at 50,000 feet travelling up to 4,500 mph — a speed US scientists at the time called improbable for any known aircraft.</p>
  <div class="narr">&quot;UFO Part 16 (Final)&quot; is the last batch of FBI records released under the Freedom of Information Act relating to unidentified flying objects. Most of the file consists of standardised UFO sighting questionnaires — forms with fields for shape, colour, altitude, direction, and speed — but extreme redaction and poor document quality have rendered the vast majority of these forms unreadable.

The most legible and substantive section is an internal FBI memo dated September 1957, written by A. H. Belmont to R. Rosen. It describes an object detected by Air Defense Command (ADC) radar over the Long Island, New York and Pennsylvania area. The object was tracked at an altitude of 50,000 feet with speed variations ranging from 1,500 to 4,500 miles per hour. The memo notes that 4,500 mph was considered improbable by US scientific theory for any conceivable type of flying object at the time. The Intelligence Advisory Committee assessed that a Soviet operation was &quot;highly improbable&quot; as an explanation. General Hillard Lewis, then Director of Air Force Intelligence, offered a speculative alternative: that sun spot activity might be associated with peculiar radar behaviour being observed globally. The ADC investigation was noted as incomplete at the time the memo was written, and no final conclusion appears in these records.

A separate, earlier memo reveals that the FBI field office near Camp Hood, Texas received repeated reports of &quot;flying disks or unnatural phenomena&quot; in the area. The memo states the office followed a practice of reviewing these reports and then destroying them if they contained nothing of FBI interest — meaning an unknown volume of historical sighting data was permanently lost. The memo notes that UFO matters were considered a &quot;primary concern of the Air Corps,&quot; not the FBI.

Substantial material was withheld before public release. At least one page was removed entirely under FOIA exemptions, and multiple deletion notices appear throughout the file. Between the redactions, the destroyed Camp Hood reports, and the illegible sighting forms, what survives in this final instalment is a narrow slice of what the FBI once held.</div>
