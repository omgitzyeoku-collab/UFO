  <h1>FAA Log: Multiple Aircraft Crews Saw Bright Light Over Gulf of Mexico</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/beefef29d71ad99b3c3e48efc09125f5bbbb31a5d59ebf7e75d14a22db3d0069.jpg" alt="FAA Log: Multiple Aircraft Crews Saw Bright Light Over Gulf of Mexico thumbnail" loading="lazy" />
  <p>This is an FAA operations center incident report from February 2023 documenting a UAP sighting by a commercial aircraft crew over the Gulf of Mexico west of Florida. The crew of a Cessna C560 reported a very bright light passing their aircraft at an estimated altitude of 50,000 feet, and multiple other aircraft reported the same incident.</p>
  <div class="narr">On 27 February 2023, the FAA&#39;s Washington Operations Center logged an incident report after a Cessna C560 (registration N4200K), flying westbound from Opa-locka, Florida to Houston, Texas at approximately 40,000 feet, reported an unidentified aerial phenomenon. The crew described a very bright light that passed off the left wing of their aircraft, estimated to be about 10,000 feet above them — roughly 50,000 feet altitude.

The sighting occurred 63 nautical miles west of La Belle VORTAC in Florida, over the Gulf of Mexico at coordinates 26.854°N, 82.453°W. Miami Air Route Traffic Control Center (ARTCC) was advised. No evasive action was taken by the reporting aircraft, and law enforcement was not notified.

Notably, the report states that multiple aircraft reported the same incident, though the identities of those other aircraft and their independent accounts are not included in this document.

This is a preliminary operations center log entry, not a full investigation report. It records what the crew reported but does not offer any conclusion about what the object was. The object is described only as a &quot;very bright light&quot; — no shape, size, or detailed movement characteristics are given beyond it passing the aircraft.</div>
