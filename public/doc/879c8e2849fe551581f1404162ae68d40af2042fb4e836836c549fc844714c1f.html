  <h1>FAA Report: Pilot Saw Two Objects Moving Erratically at High Altitude</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/879c8e2849fe551581f1404162ae68d40af2042fb4e836836c549fc844714c1f.jpg" alt="FAA Report: Pilot Saw Two Objects Moving Erratically at High Altitude thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from December 2023 in which a general aviation pilot flying at 38,000 feet reported seeing two unidentified objects moving side to side at an estimated 41,000–58,000 feet. Air traffic control radar did not detect the objects, and the case was closed without explanation.</p>
  <div class="narr">On 15 December 2023 at 00:05, the pilot of a general aviation aircraft with callsign N90CW reported an unidentified aerial phenomenon to the FAA. The aircraft was flying southbound at flight level 380 (approximately 38,000 feet), en route from JWN to MOB (Mobile, Alabama).

About 25 nautical miles south of Muscle Shoals (MSL), the pilot observed two objects ahead of the aircraft, moving side to side with no apparent direction. The pilot estimated their altitude at between FL410 and FL580 — roughly 41,000 to 58,000 feet — well above the reporting aircraft.

Air traffic control checked their radar and did not detect the objects. The FAA logged the sighting under its SKYWATCH programme as record 237UAP00329. The case is now marked closed, with no resolution or explanation provided in the document.

The report contains no sensor data, no photographs, and no additional witness accounts. It is a single pilot&#39;s visual observation, recorded through the FAA&#39;s standard UAP reporting process.</div>
