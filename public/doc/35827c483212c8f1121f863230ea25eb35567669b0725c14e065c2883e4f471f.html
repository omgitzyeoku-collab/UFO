  <h1>JetBlue crew reported unidentified object over Atlantic Ocean in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/35827c483212c8f1121f863230ea25eb35567669b0725c14e065c2883e4f471f.jpg" alt="JetBlue crew reported unidentified object over Atlantic Ocean in 2023 thumbnail" loading="lazy" />
  <p>An FAA operations center log from 7 August 2023 records that the crew of JetBlue flight 1348, flying from San Juan to Washington Dulles, reported unidentified anomalous phenomena 6,000 feet above their aircraft over the Atlantic Ocean. The report is a brief incident log with no description of the object, no radar corroboration, and no follow-up investigation included.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report — essentially a log entry — recording a UAP (unidentified anomalous phenomena) sighting reported by a commercial airline crew on 7 August 2023.

The crew of JetBlue flight 1348, an Airbus A320 travelling from San Juan, Puerto Rico to Washington Dulles, reported UAP activity while cruising at flight level 340 (approximately 34,000 feet). They described the phenomena as being 6,000 feet above them at their 12 o&#39;clock position — meaning directly ahead and at roughly 40,000 feet altitude. The sighting occurred over open ocean near coordinates 24°29&#39;N/72°50&#39;W, southeast of the Bahamas in Atlantic oceanic airspace. Miami Air Route Traffic Control Center (ARTCC) was the controlling facility.

The crew took no evasive action, and no law enforcement notification was made. The report was logged at 23:01 UTC.

Notably, the document provides no description of what the crew actually saw — no shape, size, colour, movement pattern, or duration of observation. The phrase &quot;UAP activity&quot; is used without elaboration. This is a preliminary operations center log entry, not a completed investigation, and no conclusions or identification of the phenomena are offered.</div>
