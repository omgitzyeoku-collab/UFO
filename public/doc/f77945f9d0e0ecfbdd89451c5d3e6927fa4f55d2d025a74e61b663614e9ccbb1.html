  <h1>Sunwing Crew Reports Bright Circling Lights Over Atlantic at 40,000–60,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f77945f9d0e0ecfbdd89451c5d3e6927fa4f55d2d025a74e61b663614e9ccbb1.jpg" alt="Sunwing Crew Reports Bright Circling Lights Over Atlantic at 40,000–60,000 Feet thumbnail" loading="lazy" />
  <p>An FAA preliminary report from 5 August 2023 documents a Sunwing Airlines crew on a Cuba-to-Toronto flight reporting an unidentified aerial phenomenon with bright circling lights maneuvering well above their altitude over the Atlantic Ocean east of Jacksonville, Florida. No evasive action was taken and no follow-up investigation findings are included in the document.</p>
  <div class="narr">On 5 August 2023, at roughly 1:11 AM Eastern time, the crew of Sunwing Airlines flight SWG6415 — a Boeing 737 MAX 8 flying from Holguín, Cuba to Toronto, Canada — reported an unidentified aerial phenomenon to Jacksonville Air Route Traffic Control Center (ARTCC). The aircraft was cruising at approximately 31,000 feet over the Atlantic Ocean, about 127 nautical miles east-northeast of Jacksonville.

The crew described the object as displaying bright circling lights and maneuvering at altitudes between roughly 40,000 and 60,000 feet — well above their own flight level. Despite the sighting, the crew did not take any evasive action, and no law enforcement notification was reported.

The document is an FAA Washington Operations Center preliminary information report, marked &quot;PRELIM INFO.&quot; It records what the crew told air traffic control and nothing more. There are no radar data, no corroborating witnesses from other aircraft, and no follow-up investigation findings included.

The FAA did not reach any conclusion about what the crew observed. This is a single-source account relayed through ATC, preserved as a preliminary record. The document shows minimal redaction.</div>
