  <h1>Southwest Airlines crew reported circling lights at 55,000 feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/1f2e3190dc9fbda55e5af89b8ed42284650d858eb60121a5e87f737a5d8e6cd8.jpg" alt="Southwest Airlines crew reported circling lights at 55,000 feet in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA incident report from April 2023 in which a commercial Southwest Airlines flight (callsign SWG383) reported seeing four red and white lights moving in circles at roughly 55,000 feet — about 20,000 feet above the aircraft. The case was closed with no explanation provided.</p>
  <div class="narr">On 10 April 2023, the crew of a commercial Southwest Airlines flight operating under callsign SWG383 filed a report through the FAA&#39;s SKYWATCH system — the agency&#39;s mechanism for logging unidentified aerial phenomena observed by pilots. The aircraft was cruising at approximately 35,000 feet at the time.

The crew reported seeing an unidentified aerial phenomenon roughly 20,000 feet above them, placing it at an altitude of about 55,000 feet. They described it as four red and white lights moving in circles. The sighting occurred on the HTO 125046 radial — HTO likely refers to the Hampton VOR navigational aid near East Hampton, New York, which would place the observation somewhere off the US East Coast. The report lists the Pod (point of departure) as DEN, suggesting the flight originated from Denver.

The FAA marked the case as closed. No resolution or explanation for the sighting is recorded in the document. There is no mention of corroborating radar data, sensor recordings, or observations from other aircraft. No tail number was logged for the reporting aircraft.

The reported altitude of 55,000 feet is notable because it sits well above the service ceiling of most conventional aircraft. The document does not speculate on what the lights were, and the FAA offered no identification or follow-up analysis in the file as released.</div>
