  <h1>Pilot Reports Unidentified Light Near Pedro Bay, Alaska in 2023</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/1e90533df2400c883ccf3e77d05d1e25ae1970ad05e30b865546f4f8c6508008.jpg" alt="Pilot Reports Unidentified Light Near Pedro Bay, Alaska in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident notification records a pilot flying a Beech BE10 aircraft at 14,000 feet near Pedro Bay, Alaska on March 9, 2023, who reported seeing an unidentified illuminated aerial phenomenon to the left of the aircraft before losing sight of it during twilight. NORAD&#39;s Alaska Region was notified, and the FAA determined there was no impact to the National Airspace System.</p>
  <div class="narr">This document is a preliminary incident notification from the FAA Washington Operations Center regarding an unidentified aerial phenomenon reported by a pilot near Pedro Bay, Alaska. It is not a full investigation report — the document itself is marked as preliminary information.

On March 9, 2023, at approximately 8:29 PM local time, the pilot of a Beech BE10 aircraft (callsign TN479AK) was flying northeast-bound at 14,000 feet when they observed an unidentified illuminated aerial phenomenon to the left side of the aircraft. The pilot subsequently lost visual contact with the object during twilight conditions. Anchorage Air Route Traffic Control Center (ARTCC) was advised of the report.

The FAA noted there was no impact to the National Airspace System, meaning normal air traffic operations were not disrupted. NORAD&#39;s Alaska Region — the military command responsible for aerospace warning and control in North America — was notified of the incident.

The document contains minimal detail beyond the basic facts of the sighting. There is no description of the object&#39;s shape, size, speed, or behaviour beyond it being &quot;illuminated.&quot; No radar data, photographs, or additional witness accounts are referenced. The report does not offer any explanation or identification of what the pilot observed.</div>
