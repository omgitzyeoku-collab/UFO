  <h1>Military Lights Over Western US Resolved as Distant Commercial Aircraft</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0ce8cc10657ae223808e8dcba0ab25afb6c68e809655abdfe7979cd7cab3ba54.jpg" alt="Military Lights Over Western US Resolved as Distant Commercial Aircraft thumbnail" loading="lazy" />
  <p>This is a resolved case file from AARO (the Pentagon&#39;s UAP investigation office) about five lights spotted by military personnel over the Western United States in 2021. AARO concluded the lights were almost certainly commercial aircraft flying on established air corridors, up to 300 nautical miles from the observers — far further away than the personnel originally estimated.</p>
  <div class="narr">In 2021, military personnel using an infrared sensor observed five evenly spaced, oblong lights at altitudes between 20,000 and 40,000 feet over the Western United States. The lights flew at a relatively constant pace and appeared to be intruding into restricted military airspace, prompting a formal report.

The case was assigned number 330UAP000020 and investigated by AARO — the All-domain Anomaly Resolution Office, the Department of Defense body responsible for investigating unidentified aerial phenomena. AARO&#39;s own analysts and its independent intelligence and science partners both reached the same conclusion: the lights strongly correlated with specific commercial aircraft travelling on different established air routes, up to 300 nautical miles from the sensor. The objects were significantly farther from the observing platform than the personnel had originally estimated.

The case was formally resolved on 8 May 2023, with AARO assessing the objects were &quot;almost certainly commercial aircraft.&quot; The document was cleared for public release on 4 October 2023 and released in full — with no redactions — on 6 February 2025, under authority of the FY24 National Defense Authorization Act (codified at 44 U.S.C. 2107).

No anomalous technology or unexplained behaviour was identified. This is one of the cases AARO has been able to close with a conventional explanation.</div>
