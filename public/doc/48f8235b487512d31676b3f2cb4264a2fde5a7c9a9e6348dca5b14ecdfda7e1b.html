  <h1>Pilot Reports Unexplained Lights at 28,000 Feet Over Kansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/48f8235b487512d31676b3f2cb4264a2fde5a7c9a9e6348dca5b14ecdfda7e1b.jpg" alt="Pilot Reports Unexplained Lights at 28,000 Feet Over Kansas thumbnail" loading="lazy" />
  <p>This FAA incident report documents a general aviation pilot&#39;s sighting of an unidentified object displaying red and white lights near Chanute, Kansas, on 10 February 2023. The case was closed with no explanation or identification of the object provided in the report.</p>
  <div class="narr">On 10 February 2023 at 03:13 UTC, a general aviation pilot flying a B350 aircraft (callsign N378BG) reported an unidentified aerial phenomenon to Kansas City Center (ZKC), the FAA facility handling that airspace. The aircraft had departed from BBG and was heading northwest at flight level 280 — roughly 28,000 feet.

The pilot observed an object off the left side of the aircraft, approximately 15 nautical miles south of Chanute, Kansas (identified by the aviation code CNU). The object displayed red and white lights and was travelling northwest at approximately the same altitude as the reporting aircraft.

The report was logged through the FAA&#39;s SKYWATCH system, which tracks unidentified aerial phenomena. Entities identified as TY/AWO were notified, though the document does not explain what those abbreviations refer to or what role they play in the reporting chain.

The case is marked as closed. No resolution, identification, or follow-up explanation appears in the document. There is no mention of radar data, additional witnesses, or further investigation.</div>
