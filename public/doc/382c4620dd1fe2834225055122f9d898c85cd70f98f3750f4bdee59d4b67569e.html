  <h1>United Airlines Crew Reports Fast-Moving Lights Over Idaho</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/382c4620dd1fe2834225055122f9d898c85cd70f98f3750f4bdee59d4b67569e.jpg" alt="United Airlines Crew Reports Fast-Moving Lights Over Idaho thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents a sighting by the crew of United Airlines Flight 1325 on 22 February 2023. While flying from Denver to Portland, the pilots observed two to four lights moving at high speed in a triangular pattern near Brownlee Reservoir, Idaho, with one light flaring bright before vanishing.</p>
  <div class="narr">This document is a preliminary incident report from the FAA Washington Operations Center. It records a UAP (unidentified anomalous phenomena) sighting reported by the flight crew of United Airlines Flight 1325, a Boeing 737-900 operating from Denver to Portland.

On the evening of 22 February 2023, the pilots reported seeing lights moving in a triangular pattern directly ahead of the aircraft, roughly 15 to 20 degrees above the horizon, near Brownlee Reservoir in Idaho. They described between two and four lights travelling at a high rate of speed. The lights also shifted into a line formation. At one point, one of the lights became very bright and then disappeared.

The report notes that the aircraft was at an unknown altitude at the time of the sighting. No corroborating sensor data — radar returns, infrared imagery, or recordings — is mentioned anywhere in the document.

The FAA did not reach any conclusion about what the lights were. This is a preliminary information report, not a completed investigation. It captures what the pilots told the FAA Operations Center and nothing more.</div>
