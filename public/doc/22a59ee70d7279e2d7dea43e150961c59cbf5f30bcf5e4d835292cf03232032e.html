  <h1>JetBlue pilot reported moving lights later linked to Starlink satellites</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/22a59ee70d7279e2d7dea43e150961c59cbf5f30bcf5e4d835292cf03232032e.jpg" alt="JetBlue pilot reported moving lights later linked to Starlink satellites thumbnail" loading="lazy" />
  <p>This FAA incident report documents a JetBlue pilot&#39;s sighting of moving lights while flying at 40,000 feet on 4 September 2023. The FAA closed the case after correlating the sighting with Starlink satellite constellations, finding no impact to flight operations.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log pilot reports of unidentified aerial phenomena (UAP). It was filed under record number 237UAP00296.

On 4 September 2023 at 09:45, the crew of JetBlue flight JBU278, an Airbus A321 flying from San Francisco (SFO) to Fort Lauderdale (FLL), reported seeing moving lights while heading southbound at flight level 400 (approximately 40,000 feet). The lights appeared between the 11 o&#39;clock and 1 o&#39;clock positions relative to the aircraft, roughly 3 nautical miles south of OAL. The report was handled by Oakland Air Route Traffic Control Center (ZOA).

The FAA concluded that the report &quot;appears to correlate with Starlink satellite constellations.&quot; The case was closed. No law enforcement was notified, and the agency found no impact to the flight or to National Airspace System operations.

This is a resolved case — the FAA itself assessed the sighting as most likely explained by Starlink satellites rather than leaving it as genuinely unidentified. The document is notable mainly as an example of how routine UAP pilot reports are logged and processed within the FAA&#39;s reporting system.</div>
