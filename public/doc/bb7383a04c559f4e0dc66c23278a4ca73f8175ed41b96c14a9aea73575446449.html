  <h1>Emirates Crew Reported Unidentified Lights Over the Atlantic in 2022</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bb7383a04c559f4e0dc66c23278a4ca73f8175ed41b96c14a9aea73575446449.jpg" alt="Emirates Crew Reported Unidentified Lights Over the Atlantic in 2022 thumbnail" loading="lazy" />
  <p>An FAA incident report documents a commercial Emirates flight crew observing two to three unidentified lights flying in a racetrack pattern over the Atlantic Ocean in August 2022. The crew later suggested the objects may have been Starlink satellites, and the case was closed without a documented resolution.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00101. It records a UAP (unidentified anomalous phenomena) sighting by the crew of Emirates flight UAE9918, a commercial aircraft travelling from BQN to EHAM (Amsterdam).

On 10 August 2022, at around 04:09 UTC, the crew reported observing two aircraft-like objects north of their position while flying at FL330 (approximately 33,000 feet) over the Atlantic Ocean, roughly 1,050 miles east of the Carolinas at coordinates 3208N/5750W. The objects appeared to be operating in a north-to-south racetrack formation pattern with their landing lights on, estimated at or above FL400 (approximately 40,000 feet) and about 40–50 miles ahead. Each lap took an estimated three to five minutes, with one object trailing the other by about five seconds.

In a follow-up update, the crew reported continuing to observe two or three lights moving north and east at high altitude. They suggested the sighting could possibly be Starlink satellites. Law enforcement was not notified, though AWO (the FAA&#39;s Aviation Weather Office) was.

The case is marked as closed. No resolution, formal investigation outcome, or sensor corroboration is documented in the report.</div>
