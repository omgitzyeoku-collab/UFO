  <h1>FAA Report: Pilot Spotted Circular Red-Green Lights Over Kansas in 2018</h1>

  <p>This FAA SKYWATCH incident report documents a pilot&#39;s sighting of a circular red and green light pattern moving slowly westbound at 9,000 feet near Goodland, Kansas, on 6 March 2018. The FAA classified the object as &quot;OTHER&quot; and closed the case without identifying it.</p>
  <div class="narr">This document is an FAA (Federal Aviation Administration) SKYWATCH incident report, filed under case number 237UAP00032. It records a pilot&#39;s sighting of an unidentified aerial phenomenon on 6 March 2018, logged at 07:31.

The reporting aircraft was a Beech King Air (a twin-engine turboprop), flying under callsign LN77HE. It was travelling from Centennial Airport (APA) near Denver to Goodland Municipal Airport (GLD) in western Kansas. During the flight, the pilot reported seeing a circular pattern of red and green lights moving slowly westbound at 9,000 feet. The sighting position was recorded as GLD270018, which likely refers to a bearing and distance from the Goodland VOR navigational beacon, though the report does not decode the exact coordinates.

The FAA categorised the object under its primary code as &quot;OTHER&quot;, meaning it did not fit any standard classification. The case status is listed as closed. The report contains no indication that radar data, additional witnesses, or follow-up investigation corroborated the pilot&#39;s account.

No operator name or aircraft tail number appears in the report, and no personnel are named. The document shows low evidence of redaction — it appears to be a brief, routine incident log rather than a detailed investigation file.</div>
