  <h1>Delta Crew Reports Red and White Lights Over East Texas at 32,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bae9d9465f9158015423e956c416ebba38f1b1f29aff72e12fb40d0a6ed88696.jpg" alt="Delta Crew Reports Red and White Lights Over East Texas at 32,000 Feet thumbnail" loading="lazy" />
  <p>An FAA operations center notification records that the crew of Delta Air Lines flight 1508, an Airbus A321 flying from Atlanta to San Antonio, reported seeing 4–5 red and white lights off the right side of their aircraft at approximately 32,000 feet over East Texas on April 18, 2023. No evasive action was taken and no explanation for the lights is provided in the document.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — essentially a short internal report flagging that something unusual was reported by a commercial flight crew. It is not a completed investigation or a final determination of what was seen.

On April 18, 2023, at approximately 12:25 AM Central time, the crew of Delta Air Lines flight 1508 reported an unidentified aerial phenomenon while flying westbound at flight level 320 (roughly 32,000 feet). The aircraft, an Airbus A321 en route from Atlanta to San Antonio, was about 50 nautical miles southeast of Lufkin, Texas, at coordinates 30.72°N, 94.16°W. The crew described 4–5 red and white lights off the right side of the aircraft.

Houston Air Route Traffic Control Center (ARTCC) — the regional air traffic control facility — was advised of the report. The crew took no evasive action, and no law enforcement notification was reported.

The FAA document does not offer any identification or explanation for what the crew observed. It contains no radar data, sensor recordings, or corroborating witness accounts. The notification appears to be a preliminary log entry rather than the product of a follow-up inquiry.</div>
