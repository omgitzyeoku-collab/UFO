  <h1>DOW-UAP-D091, Range Fouler Debrief, Atlantic Ocean, 2020</h1>
  <div class="meta">

  <p>This document is a Range Fouler Debrief, a standardized reporting form the U.S. Navy uses to record the circumstances surrounding an unauthorized intrusion into controlled airspace during active military operations or training. These reports contain a narrative description of the observer’s experiences. This report accompanies the video titled “DOW-UAP-PR116.”

A U.S. military operator reported observing an object, describing the phenomenon as “darker, maroonish color, approximately 12-15 feet in height.” The report describes the phenomenon “travel[ing] with the wind” and noted that it did not “maneuver or change direction.” It also describes the phenomenon as appearing as a “large, somewhat deformed balloon.”

All descriptive and estimative language contained in this report reflects the reporter’s subjective interpretation at the time of the event. Such characterizations should not be interpreted as a conclusive indication of the presence or absence of any intrinsic object features or performance characteristics.</p>
