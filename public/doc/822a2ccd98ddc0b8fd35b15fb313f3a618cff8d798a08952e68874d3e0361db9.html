  <h1>FAA Report: Jellyfish-Shaped Object With Colored Lights Seen Near La Crosse</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/822a2ccd98ddc0b8fd35b15fb313f3a618cff8d798a08952e68874d3e0361db9.jpg" alt="FAA Report: Jellyfish-Shaped Object With Colored Lights Seen Near La Crosse thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents an unidentified aerial phenomenon observed by air traffic controllers near La Crosse, Wisconsin on 7 October 2022. The object, described as resembling a jellyfish with flashing green, red, and blue lights, was tracked briefly on radar before contact was lost, and no aircraft were ever identified.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00117. It records an unidentified aerial phenomenon observed on 7 October 2022 at 01:56 UTC near La Crosse Regional Airport (LSE) in Wisconsin. The reporting facility was Minneapolis Center (ZMP), and the case is marked as closed with no resolution or identification noted.

Controllers in the La Crosse air traffic control tower (LSE ATCT) visually observed an object approximately 5 nautical miles south of the airport at an altitude of 1,500 feet, traveling westbound. They described it as having flashing green, red, and blue lights and resembling a jellyfish. No aircrew reported seeing the object — the tower controllers were the only observers.

Minneapolis Center (ZMP) detected a primary radar target in the same area, meaning the object showed up on radar but was not transmitting a transponder signal. By 02:05, roughly nine minutes after the initial observation, ZMP reported no further radar returns. No aircraft were identified in the area, and the report&#39;s fields for callsign, aircraft type, tail number, and operator are all blank.

The case was closed without any explanation or identification of the object. Internal FAA notifications were made (AWO/TY notified), and the report notes that a page was issued. No further investigation or follow-up is documented.</div>
