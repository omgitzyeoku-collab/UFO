  <h1>Delta Crew Reports Large Balloon at 50,000 Feet in February 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/5cbc0fca6109baddd2520696a8e02164401d3bf4ed08db200aca279bee06eae8.jpg" alt="Delta Crew Reports Large Balloon at 50,000 Feet in February 2023 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a Delta Air Lines crew observing a large balloon at approximately 50,000 feet while flying at 36,000 feet on 3 February 2023. The report was closed with no identification of the object.</p>
  <div class="narr">On 3 February 2023 at 17:22 UTC, the crew of Delta flight DAL1059 reported seeing a large balloon while flying southwest-bound at FL360 (approximately 36,000 feet). The object appeared off the right side of the aircraft and was estimated to be at FL500 (approximately 50,000 feet) or higher — well above the ceiling of most commercial aircraft.

The flight was a commercial Delta Air Lines service operating from Minneapolis (MSP) to Houston (IAH). The FAA logged the sighting under its SKYWATCH system with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

The report&#39;s status is marked as &quot;Closed,&quot; but no resolution or identification of the object is recorded. There is no mention of corroborating radar data, photographs, or follow-up investigation in the document.

The date is notable: early February 2023 coincided with a wave of high-altitude balloon sightings across the United States, including the well-publicised Chinese surveillance balloon incident. This report may be connected to that broader episode, though the document itself does not draw that link.</div>
