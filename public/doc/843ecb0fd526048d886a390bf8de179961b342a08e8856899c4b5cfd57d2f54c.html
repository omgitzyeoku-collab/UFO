  <p>The United States Northern Command submitted a report of an unidentified anomalous phenomenon to the All-domain Anomaly Resolution Office (AARO) consisting of 2 minutes and 16 seconds of video footage from an infrared sensor aboard a U.S. military platform in 2020.

Video Description: 
00:01-00:15: No content.
00:16-00:19: The footage flashes between normal operation and a black screen several times as the sensor changes display modes.
00:20-00:27: No content.
00:28-00:33: The sensor zooms in and pans to track an area of contrast, keeping it generally within the center of the frame.
00:34-00:57: An auto-tracking reticle surrounds the area of contrast as the sensor continues to track it against the background.
00:58-01:10: The sensor adjusts its zoom level and contrast settings several times.
01:11-01:34: The area of contrast leaves the sensor field-of-view to the left of the frame. The sensor adjusts its zoom level and contrast settings several times. No content.

This video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.</p>
