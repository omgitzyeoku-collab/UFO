  <h1>FBI Records Forensic Sketch Interview of Unresolved UAP Sighting Near Colorado Springs</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">2022</span>
    <span class="badge">Colorado Springs, Colorado, U.S.</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/f73ffa1579ecc8916492166021bac801e421f058779127e8bb4bf1ded02cc3a1.jpg" alt="FBI Records Forensic Sketch Interview of Unresolved UAP Sighting Near Colorado Springs thumbnail" loading="lazy" />
  <p>This FBI investigative form documents a July 2024 forensic sketch interview with a former U.S. Army intelligence officer who, along with four unit members, observed an unidentified aerial phenomenon over the Cheyenne Mountains near Colorado Springs in 2022. The object was described as potato-shaped, opalescent, covered in moving fish-scale-like panels, and motionless before it vanished almost instantly after about two minutes.</p>
  <div class="narr">This document is an FBI Electronic Communication form (FD-1057) recording a forensic sketch interview conducted on July 11, 2024, at 26 Federal Plaza in New York City. The purpose was to help a forensic artist recreate an unidentified aerial phenomenon (UAP) that the witness had observed two years earlier near Colorado Springs, Colorado.

The witness, identified only as a former U.S. Army intelligence officer (all names are redacted), reported that in 2022 he and four other members of his unit saw an object hovering over the Cheyenne Mountains as they stepped outside their office building. The weather was clear — blue sky, no clouds, roughly 50°F with little humidity. The object was described as potato-shaped with distinct edges, creamy or whitish in colour, somewhat translucent with a slight shimmer. Its surface appeared to be made of irregular, non-overlapping panels resembling fish scales, which shifted independently in slow waves from multiple points at once.

The object remained perfectly still for approximately two minutes before it vanished. The witness used the word &quot;cloaked&quot; to describe its disappearance, saying it happened in the time it took to turn one&#39;s head, leaving no shadow behind. The FBI form notes a forensic sketch was drafted as an enclosure, but that sketch is not included in the extracted text.

The document is heavily redacted. All names — the witness, accompanying unit members, FBI agents, and the forensic artist — are blacked out. No military radar data, sensor readings, or corroborating records from nearby Cheyenne Mountain (home to NORAD and U.S. Northern Command) are mentioned. The FBI did not record a conclusion or explanation for the sighting; the report is marked as unresolved.</div>
