  <h1>Pilot Reports UFO With Stationary Strobe Lights Over Virginia</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c57f935ae313df7f87261225ada62bab316dda0c9e03374430e49ab905506d55.jpg" alt="Pilot Reports UFO With Stationary Strobe Lights Over Virginia thumbnail" loading="lazy" />
  <p>This FAA incident report documents a pilot flying a Raytheon Hawker 800 business jet at 40,000 feet who observed an unidentified object with a line of stationary strobe lights near Lynchburg, Virginia on 9 March 2022. No evasive action was taken, no law enforcement was notified, and no follow-up investigation is documented in the report.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed under record number 237UAP00399. It records a single pilot observation of an unidentified aerial phenomenon during a routine flight.

On the evening of 9 March 2022, the pilot of aircraft N499PA — a Raytheon Hawker 800 business jet — was flying southbound from Teterboro, New Jersey to DeKalb-Peachtree, Georgia at Flight Level 400 (approximately 40,000 feet). While passing 10 nautical miles north of Lynchburg, Virginia, the pilot reported observing an unidentified object. The pilot described it as a &quot;UFO with a line of stationary strobe lights above.&quot; Washington Air Route Traffic Control Center was advised of the sighting.

The pilot took no evasive action, and no law enforcement agency was notified. The report contains coordinates placing the sighting at roughly 37.47°N, 79.23°W, consistent with the area north of Lynchburg.

The FAA report does not document any follow-up investigation, radar corroboration, or resolution of what the object was. It is a single-page operational log entry, not an analytical assessment. Notably, the FAA&#39;s own filing uses the term &quot;UAS&quot; (unmanned aircraft system) alongside &quot;UFO,&quot; suggesting the initial classification may have defaulted to a drone category.

One administrative discrepancy: the document&#39;s metadata lists the incident year as 2023, but the report text clearly dates the event to 9 March 2022. There is minimal redaction in this record.</div>
