  <h1>FAA Report: Pilot Spotted Unidentified Object at 20,000 Feet in 2021</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e3da55c82bb360187187dc7772312d687b5dd0446c045ddf489f5233f06930b8.jpg" alt="FAA Report: Pilot Spotted Unidentified Object at 20,000 Feet in 2021 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a general aviation pilot&#39;s sighting of an unidentified aerial phenomenon off the left side of their aircraft while flying at 20,000 feet near Kinston, North Carolina on 22 August 2021. The report was closed with no follow-up investigation noted and almost no descriptive detail about what the pilot saw.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena from pilots and air traffic facilities. It was filed under case number 237UAP00063.

On 22 August 2021 at 16:30, the pilot of a PA46 aircraft (callsign N398WF) reported seeing an unidentified aerial phenomenon off the left side of the aircraft. The plane was a general aviation flight travelling southwest at flight level 200 (approximately 20,000 feet), routing from CPK to 7FL6. The sighting occurred roughly 10 nautical miles northeast of ISO.

The report contains remarkably little detail about what the pilot actually saw. No description of the object&#39;s appearance, size, movement, or duration was recorded. The document states plainly: &quot;No other information was given by the pilot or facility.&quot; The national UFO reporting number was contacted, and an AWO/CM (likely an airway operations or case manager) was notified.

The case is marked &quot;Closed&quot; with no indication that any follow-up investigation took place and no resolution or explanation offered. The FAA&#39;s Denver office (POD: DEN) handled the report.</div>
