  <h1>NASA Astronauts Reported Severe Vibrations and Equipment Failures on Gemini 5</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">August 2 - September 2, 1965</span>
    <span class="badge">Cape Kennedy, Florida</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/fd3b139e6b9ad4e3b697561f1712541e54668617fe8be72f9214124e4325c793.jpg" alt="NASA Astronauts Reported Severe Vibrations and Equipment Failures on Gemini 5 thumbnail" loading="lazy" />
  <p>This is a formerly classified transcript of NASA astronauts Gordon Cooper and Pete Conrad debriefing after the Gemini 5 mission in August 1965. The crew described intense vibrations that made instruments unreadable, fogged windows with insects trapped inside, a failed radio, fuel cell warnings, and a malfunctioning guidance system that pitched the spacecraft nose-down — none of which are UAP-related.</p>
  <div class="narr">In late August 1965, astronauts Gordon Cooper and Pete Conrad sat down at the Crew Quarters in Cape Kennedy, Florida, to debrief their eight-day Gemini 5 mission. The transcript — originally stamped CONFIDENTIAL and declassified after twelve years — captures the crew walking engineers through everything that went right and wrong during countdown, launch, and orbital operations.

Several problems stood out. Both cockpit windows fogged over before liftoff, with Conrad noting a bee, a fly, and debris trapped between the panes. At two minutes and five seconds into flight, violent longitudinal vibrations known as POGO kicked in at 11 cycles per second — strong enough that neither astronaut could talk or read their displays. Previous Gemini crews had barely noticed POGO; Cooper and Conrad estimated it hit half to three-quarters of a g. When the nose fairing separated at three minutes and twenty-five seconds, it shattered into what Conrad described as &quot;a jillion pieces,&quot; leaving grey marks on the windshield that never burned off, even during reentry.

The crew also lost their primary radio about four minutes in, fuel cell warning lights lit up during the climb to orbit, and the platform alignment mode malfunctioned — driving the spacecraft fifteen to forty degrees nose-down while still showing normal readings. On the positive side, both astronauts praised the Rate Command backup control system and the onboard computer, which nailed their insertion velocity to within one foot per second of the target (25,808 ft/s versus a nominal 25,807 ft/s).

This document is Part I of the debriefing only. Part II — covering visual sightings, experiments, and systems operations — was published separately and is not included here. The transcript&#39;s presence in the government&#39;s PURSUE UAP release collection does not mean this portion contains any UAP-related content; it is a standard spaceflight engineering debrief.</div>
