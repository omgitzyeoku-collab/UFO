  <h1>Pentagon Concluded Three UAP &#39;Atmospheric Wakes&#39; Were Camera Artifacts</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b7c33b3fa08abfc54e66d70fd44d349d989886190dd9404988d8f33f8980da89.jpg" alt="Pentagon Concluded Three UAP &#39;Atmospheric Wakes&#39; Were Camera Artifacts thumbnail" loading="lazy" />
  <p>This report from the All-domain Anomaly Resolution Office (AARO) examined three UAP sightings from the Middle East and Mediterranean Sea (2022–2023) where drone operators recorded objects that appeared to leave unusual atmospheric trails on infrared cameras. AARO concluded all three were conventional aircraft and the trails were sensor artifacts, not anomalous propulsion signatures.</p>
  <div class="narr">In 2022 and 2023, military drone operators in the Middle East and the Mediterranean Sea recorded objects on infrared cameras that appeared to produce strange atmospheric wakes — trails that looked like they might indicate unusual propulsion. The sightings were reported to AARO, the Pentagon office responsible for investigating unidentified anomalous phenomena, and grouped under case number 330UAP000017, titled &quot;Atmospheric Wakes.&quot;

AARO investigated all three cases with support from intelligence partners and independent science and technology analysts. Their conclusion, resolved on 8 May 2023: the objects were almost certainly ordinary aircraft, and the apparent wakes were camera artifacts caused by the objects rapidly crossing the infrared sensor&#39;s field of view. Two independent science and technology partners reached the same conclusion. Other objects visible in the same videos left similar trails, reinforcing the sensor-artifact explanation.

The three cases broke down as follows. In Case One, the object was never positively identified, but AARO determined it was not exhibiting anomalous behaviour. In Case Two, one object was matched to a known military aircraft using location data; the second remained unidentified but was assessed as probably a small conventional aircraft. In Case Three, intelligence partners identified the object with high confidence as a specific Airbus A380 commercial airliner, using commercial flight data and photogrammetry that produced a size estimate closely matching that aircraft type.

The document was cleared for open publication on 4 October 2023 and released without redactions. However, the underlying full-motion video, sensor data, and flight records are not publicly available, so independent verification of AARO&#39;s analysis is not possible from this document alone.</div>
