  <h1>CIA Recorded US Astrophysicist&#39;s UFO Talks with Soviet Scientists</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">August, 1967</span>
    <span class="badge">USSR</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/028fa825fe2bc02e7551a9b1eb7d09b657dca47ced23e80b4de568a836da0145.jpg" alt="CIA Recorded US Astrophysicist&#39;s UFO Talks with Soviet Scientists thumbnail" loading="lazy" />
  <p>This August 1967 CIA report documents conversations a US astrophysicist had with Soviet scientists about UFO sightings in the USSR, including discussions at the Pulkovo Observatory in Leningrad. The document is heavily redacted and the original scan is largely illegible, leaving most details unrecoverable.</p>
  <div class="narr">This CIA document from August 1967 records what happened when a US astrophysicist visited the Soviet Union and spoke with Soviet scientists about unidentified flying objects. The report is an intelligence summary of those informal conversations, not a record of any direct UFO observation.

Among the locations where these discussions took place was the Pulkovo Observatory in Leningrad, where astronomers raised the topic of UFOs. The document indicates that the subject of UFOs was considered scientifically controversial among the Soviet scientists consulted — a detail consistent with the broader Cold War context in which both superpowers were cautious about legitimising UFO research.

The document is heavily redacted. Names of individuals — both the US astrophysicist and the Soviet scientists — are either blacked out or unreadable due to the poor quality of the original image scan. Large portions of the text are illegible, meaning the specific content of what was discussed is mostly lost.

No conclusions or findings from the CIA are recoverable from the surviving text. The report appears to be a single-source intelligence product, meaning it relies entirely on one person&#39;s account of informal conversations rather than on independent verification or direct observation.</div>
