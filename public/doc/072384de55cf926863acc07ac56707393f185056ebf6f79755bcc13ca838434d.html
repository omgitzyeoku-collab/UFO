  <h1>Delta crew reported unidentified object ahead at 34,000 feet over Idaho</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/072384de55cf926863acc07ac56707393f185056ebf6f79755bcc13ca838434d.jpg" alt="Delta crew reported unidentified object ahead at 34,000 feet over Idaho thumbnail" loading="lazy" />
  <p>This FAA incident notification records that the crew of Delta Air Lines flight 2665, flying from Atlanta to Boise on December 22, 2023, reported seeing an unidentified aerial phenomenon directly ahead of their aircraft at 34,000 feet, about 41 nautical miles south-southwest of Pocatello, Idaho. No evasive action was taken and no law enforcement was notified.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — a short, standardised form used to log unusual events reported by air traffic control facilities. It is not an investigation report or an analysis; it simply records that something was reported and by whom.

On the evening of December 22, 2023, at 9:15 PM Mountain Standard Time, the crew of Delta Air Lines flight 2665 — an Airbus A319 flying from Atlanta to Boise — reported an unidentified aerial phenomenon at their 12 o&#39;clock position (directly ahead of the aircraft). The aircraft was northeast-bound at flight level 340, which corresponds to roughly 34,000 feet. The sighting occurred approximately 41 nautical miles south-southwest of Pocatello, Idaho, at coordinates 42.35°N, 112.87°W.

The crew took no evasive action in response to what they saw, and no law enforcement agency was notified. The report was relayed by Salt Lake City Air Route Traffic Control Center (ARTCC) to FAA Operations.

The notification contains no description of the object&#39;s appearance, size, speed, or behaviour. There is no indication that radar data, photographs, or additional witness accounts were collected or referenced. The document ends with an internal FAA tracking notation. No conclusions about what the crew observed are offered.</div>
