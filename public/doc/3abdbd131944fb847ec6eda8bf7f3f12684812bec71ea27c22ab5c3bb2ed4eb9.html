  <h1>CIA Report: US Scientist Asked Soviet Astronomers About UFOs in 1967</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">August, 1967</span>
    <span class="badge">USSR</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3abdbd131944fb847ec6eda8bf7f3f12684812bec71ea27c22ab5c3bb2ed4eb9.jpg" alt="CIA Report: US Scientist Asked Soviet Astronomers About UFOs in 1967 thumbnail" loading="lazy" />
  <p>This 1967 CIA intelligence report summarizes what a US astrophysicist learned about UFO awareness among Soviet scientists during a spring 1967 visit to Soviet observatories. Most Soviet astronomers knew about UFO reports but had no official research program, and one prominent astronomer, N.A. Kozyrev, openly believed UFOs were real and possibly from Venus.</p>
  <div class="narr">In the spring of 1967, a US astrophysicist spent a month visiting Soviet astronomical observatories on a planetary research trip. During informal conversations, the scientist asked Soviet colleagues what they knew about unidentified flying objects. The CIA compiled the scientist&#39;s findings into an intelligence report, distributed on 18 August 1967 and marked &quot;Controlled Dissem / No Dissem Abroad.&quot; The report was developed by an Air Force (AFNIN) representative and carries a header stating &quot;This is unevaluated information.&quot;

The scientist found that most Soviet astronomers were aware of UFO phenomena but that no official Soviet research program existed on the subject. Several had read a Russian translation of Donald Menzel&#39;s book debunking UFOs, but not all found it convincing. Astronomer I.K. Koval and colleagues at the Main Astronomical Observatory in Kiev reported seeing a curious reddish object flashing through the sky that they were convinced was neither a satellite nor a meteorite. At the Astrophysical Institute in Alma Ata, astronomer G.M. Idlis initially considered the UFO question settled based on Menzel&#39;s book, but after hearing about James McDonald&#39;s critical research, conceded it was &quot;clearly still an open question.&quot;

The most striking individual view came from N.A. Kozyrev at Pulkovo Observatory near Leningrad, who readily accepted the reality of UFOs and personally believed they might originate on Venus. The report also noted that UFO sighting reports were not printed in Soviet newspapers because they were not regarded as scientific observations. In one case, repeated sightings of apparent ball lightning in northern Kazakhstan turned out to be reflections of car headlights off an atmospheric inversion layer.

The report&#39;s overall assessment was that no official Soviet treatment of the UFO problem existed, and that Soviet scientists generally referred to American work — principally Menzel&#39;s book — to dismiss the topic. However, it suggested that Soviet astronomers might become enthusiastic about UFO research more quickly than their US counterparts, because they faced less official ridicule on the subject.</div>
