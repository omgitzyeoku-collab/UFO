  <h1>FAA Report: Pilot Saw Three Bright Lights Converge Near Houston</h1>

  <img class="thumb" src="/extract/thumbs/104631838de8e5fdacf5e324b7888384340562678808285b33a6c0e2a158a045.jpg" alt="FAA Report: Pilot Saw Three Bright Lights Converge Near Houston thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a general aviation pilot&#39;s sighting of three bright lights converging while flying at 41,000 feet northwest of Houston. The lights did not appear on air traffic control radar, the pilot recorded video, and the case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under the code &quot;Unidentified Aerial Phenomenon.&quot; It records an event involving a general aviation aircraft with the callsign N473KW, flying westbound at 41,000 feet approximately 40 nautical miles northwest of Houston Intercontinental Airport (IAH).

The pilot reported seeing three bright lights coming together off the front of the aircraft. Air traffic control checked their radar systems but did not detect anything corresponding to the lights. The pilot-in-command recorded video of the event, and a Mandatory Occurrence Report (MOR) was noted as pending.

The case is marked &quot;Closed,&quot; but the document provides no resolution, explanation, or follow-up investigation details. The referenced pilot video is not included in the released material, and no MOR content appears in the file. The report is dated 16 March 2024, though the dataset lists the incident year as 2023 — a metadata discrepancy worth noting.

The document is a single-page administrative form. It is not a detailed investigation. It records what the pilot reported and what radar did or did not show, and nothing more.</div>
