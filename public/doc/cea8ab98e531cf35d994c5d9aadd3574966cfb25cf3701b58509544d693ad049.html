  <h1>DOW-UAP-D098, Film Analysis of Unidentified Objects, 1953</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">1950, 1952</span>
    <span class="badge">Montana, Utah</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/cea8ab98e531cf35d994c5d9aadd3574966cfb25cf3701b58509544d693ad049.jpg" alt="DOW-UAP-D098, Film Analysis of Unidentified Objects, 1953 thumbnail" loading="lazy" />
  <p>This file contains a memorandum relating to the U.S. Naval Photographic Interpretation Center’s assessment of two films allegedly depicting unidentified airborne objects, captured in Montana and Utah in 1950 and 1952, respectively. The file documents the Center’s analytic process, assumptions that constrained its confidence level, tentative conclusions, and recommendations for future research. The Center assessed, generally, that the objects depicted in the film demonstrated characteristics that were inconsistent with those of natural phenomena or commonly known aerospace technologies. The memorandum documents the Center’s recommendation for a more well-resourced investigation to corroborate its presumptive findings, citing a lack of funding and personnel. The accompanying charts compare the film’s luminosity with the apparent angular size of the phenomena, using contemporary mathematical modeling and photogrammetric analysis techniques.</p>
