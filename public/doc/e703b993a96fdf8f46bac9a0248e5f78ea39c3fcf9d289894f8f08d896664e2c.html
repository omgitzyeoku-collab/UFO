  <h1>American Airlines Crew Reports Spiralling Lights Over Gulf of Mexico</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e703b993a96fdf8f46bac9a0248e5f78ea39c3fcf9d289894f8f08d896664e2c.jpg" alt="American Airlines Crew Reports Spiralling Lights Over Gulf of Mexico thumbnail" loading="lazy" />
  <p>An FAA preliminary report documents a sighting by the crew of American Airlines flight 2054 on 20 February 2024. Flying at 37,000 feet over the Gulf of Mexico, the crew observed three white lights performing tight spirals at roughly 45,000 feet — 8,000 feet above them — which did not appear on air traffic control radar.</p>
  <div class="narr">This document is a preliminary information report from the FAA&#39;s Washington Operations Center. It records a UAP (unidentified aerial phenomenon) sighting reported through official channels by the crew of a commercial flight.

On 20 February 2024 at approximately 4:04 AM Central time, the crew of American Airlines flight 2054 — a Boeing 737 MAX 8 flying from Phoenix to Miami — reported seeing an unidentified aerial phenomenon off the left side of their aircraft. The plane was cruising southeast-bound at flight level 370 (around 37,000 feet), roughly 200 nautical miles south-southeast of Crestview, Florida, placing the sighting over the Gulf of Mexico.

The crew described three white lights making tight spiral movements at flight level 450, approximately 45,000 feet — about 8,000 feet above their own altitude. The sighting was reported to Jacksonville ARTCC (Air Route Traffic Control Center), the FAA facility managing that airspace.

Air traffic control radar did not detect the object. The document is a preliminary report only and contains no follow-up investigation, no resolution, and no conclusions about what the lights were.

The report shows minimal redaction and is straightforward in what it records: a crew saw something, reported it, and radar did not corroborate the observation. No explanation is offered or attempted.</div>
