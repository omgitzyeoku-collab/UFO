  <h1>Twenty-One Pilots Reported a High-Altitude Balloon Over Missouri in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bcb6c839d0adff9fe1df3a1ade0ba587423c6d98e67e3249ea9d4e9777590d93.jpg" alt="Twenty-One Pilots Reported a High-Altitude Balloon Over Missouri in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents twenty-one separate aircraft reporting a large white high-altitude balloon over Missouri on 3 February 2023. The object was estimated at 40,000–60,000 feet, was classified under the FAA&#39;s &#39;Unidentified Aerial Phenomenon&#39; code, and the case is marked closed with no resolution noted.</p>
  <div class="narr">On 3 February 2023, the FAA&#39;s Kansas City Center (ZKC) began receiving pilot reports of an unidentified object in the sky over Missouri. Over the next four and a half hours — from roughly 19:14 to 23:50 UTC — twenty-one different aircraft reported seeing the same thing near the STL, HLV, and FAM navigation fixes.

Pilots described a large white balloon at extremely high altitude, estimated between flight level 400 and flight level 600 (approximately 40,000 to 60,000 feet) — well above normal commercial traffic. At least one crew said it was very large with a white string hanging below it, and another reported it had a basket. Some observers said the object appeared stationary; others described it moving southbound.

The FAA filed the incident under its &#39;Unidentified Aerial Phenomenon&#39; primary code through the SKYWATCH reporting system. The initial report came from a general aviation operator. The case is marked as closed, but the document contains no stated resolution or formal identification of the object.

No radar data or sensor readings are included in this document — all observations are visual reports from pilots. The report is notably light on analysis or follow-up detail.

The date is significant: this incident occurred the day before a widely publicised Chinese high-altitude surveillance balloon was shot down over the Atlantic on 4 February 2023. The descriptions in this report — a large white balloon at very high altitude — are consistent with that event, though this document does not make that connection.</div>
