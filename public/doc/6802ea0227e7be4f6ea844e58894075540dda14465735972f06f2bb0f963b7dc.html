  <h1>Apollo 16 debriefing reveals astronaut&#39;s unexplained flash seen from lunar orbit</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    
    <span class="badge">Houston, Texas</span>
    <span class="badge">verified</span>
  </div>
  
  <p>This is an auto-transcribed recording of NASA&#39;s post-mission scientific debriefing for Apollo 16, held in Houston, Texas, where lead scientists shared early results from Moon experiments with the crew to help prepare for Apollo 17. During the discussion, an astronaut described briefly seeing an unexplained &#39;flash&#39; from lunar orbit — brighter than the brightest star in view and appearing below the horizon — which investigators described as possibly the first report of a transient event of its kind seen from orbit. Scientists asked the crew to help pin down the flash&#39;s exact timing and location so it could be checked against seismic records.</p>
  <div class="narr">This document is a transcript of an audio recording of NASA&#39;s scientific debriefing after the Apollo 16 mission, held at the Manned Spacecraft Center in Houston, Texas. In it, the principal investigators (PIs) — the scientists in charge of individual experiments — walked the astronaut crew through their preliminary findings. The stated purpose was to educate the crew on what had been gathered so far from Apollo 16 so they would be better informed for the next mission, Apollo 17.

Most of the discussion covers routine but detailed science: readings from the lunar surface magnetometer (which measures magnetic fields, and recorded 230 gamma pointing downward — the highest field then measured on the Moon&#39;s surface), a portable magnetometer (ranging from 120 to 314 gamma at different sites), seismic experiments that placed the local surface soil, or regolith, at least 40 metres thick, a solar-wind collection foil exposed for 45 hours and 5 minutes before being sent to Switzerland for analysis, and a far-ultraviolet camera that produced 92 images and 53 spectra.

The notable moment is a report from an astronaut who said he saw a brief &#39;flash&#39; while in orbit around the Moon. He described it as instantaneous, white rather than coloured, brighter than the brightest star in his field of view at the time, and appearing distinctly below the horizon. One investigator noted that, as far as he knew, it was the first report of a transient event of this nature seen from orbit.

Crucially, the flash&#39;s exact time was not written down at the moment it happened. Investigators asked the crew to help recover the timing and location from a transcript so it could be cross-checked against seismic records — meaning, at the time of this debriefing, the flash had not been matched to any instrument data. Scientists discussed it as a possible natural transient event (comparing it to things like cosmic-ray impacts and star-rise), not as an unexplained craft.

There is little to no redaction evident in this document. The main limitation is that it is an automatic transcription of an audio recording, so it contains transcription errors throughout — garbled names and mangled technical terms — which means some quoted figures and words may be imperfect.</div>
