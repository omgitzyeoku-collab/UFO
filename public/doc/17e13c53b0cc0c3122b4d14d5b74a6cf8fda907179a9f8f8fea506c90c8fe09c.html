  <h1>Detroit Man Reports Circular Domed Object to FBI in 1958</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">4/17/58</span>
    <span class="badge">Detroit, MI</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/17e13c53b0cc0c3122b4d14d5b74a6cf8fda907179a9f8f8fea506c90c8fe09c.jpg" alt="Detroit Man Reports Circular Domed Object to FBI in 1958 thumbnail" loading="lazy" />
  <p>This is an internal FBI memo from April 17, 1958, recording a phone call from a 23-year-old Detroit resident who reported seeing a circular object with a reflective dome crossing the sky. The FBI recommended forwarding the report to Air Force authorities but no follow-up or conclusion is included in the document.</p>
  <div class="narr">On April 17, 1958, Special Agent Robert Ross Reynolds of the FBI&#39;s Detroit office wrote a memo to the Special Agent in Charge (SAC) of Detroit documenting a UFO sighting reported by phone that morning. A 23-year-old man named David Weaver, living at 15801 Decosta in Detroit, called the FBI at 11:08 A.M. to describe what he had seen.

Weaver reported observing a circular object with a crystal-type dome that reflected lights. He said the object was traveling in a northern direction from the southwest and crossed the city three blocks south of Six Mile at Lamphere Street. Weaver was on his way home from work when he spotted the object.

Before calling the FBI, Weaver had tried to reach the Air Force through Selfridge Field, a military installation near Detroit, but could not get through. He then contacted the FBI instead. Weaver identified himself as the son of a Detroit policeman and said he had some experience with the Civil Air Patrol (a civilian auxiliary of the Air Force), though he admitted he was not very familiar with identifying aircraft.

The memo&#39;s recommendation was straightforward: forward the information to the proper Air Force authorities. The document contains no analysis of what the object might have been, no follow-up investigation, and no Air Force response. It is a routing memo — the FBI recorded the call and passed it along.</div>
