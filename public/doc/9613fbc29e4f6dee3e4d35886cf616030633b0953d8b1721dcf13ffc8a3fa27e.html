  <h1>Southwest Airlines Crew Reports Fast-Moving Lights at 60,000 Feet Over Mississippi</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9613fbc29e4f6dee3e4d35886cf616030633b0953d8b1721dcf13ffc8a3fa27e.jpg" alt="Southwest Airlines Crew Reports Fast-Moving Lights at 60,000 Feet Over Mississippi thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of Southwest Airlines flight SWA498 on 8 December 2023. While flying at 40,000 feet over Mississippi, the crew observed lights moving at high speed back and forth at an estimated 60,000 feet — well above conventional aircraft ceilings — but air traffic control radar detected nothing. The case is closed with no explanation provided.</p>
  <div class="narr">On 8 December 2023 at 02:38 UTC, the crew of Southwest Airlines flight SWA498 — a Boeing 737 flying westbound from Atlanta to Dallas Love Field — reported an unidentified aerial phenomenon to Memphis Center (FAA facility ZME). The aircraft was cruising at 40,000 feet, approximately 35 nautical miles northwest of Meridian, Mississippi.

The crew described seeing lights moving at high speed back and forth, left to right, at an estimated altitude of roughly 60,000 feet — about 20,000 feet above their own aircraft. That altitude is above the operational ceiling of most conventional aircraft, though the report notes the figure is approximate.

Air traffic control checked their radar systems and found no corresponding target. The phenomenon was a visual-only observation by the flight crew, with no independent sensor confirmation.

The FAA logged the incident under its SKYWATCH programme, which tracks unidentified aerial phenomena reported through the national airspace system. The case was assigned tracking number 237UAP00328 and MOR ID ZME-M-2023/12/07-0008. Its status is marked as closed, but the document provides no resolution or explanation for what the crew observed.</div>
