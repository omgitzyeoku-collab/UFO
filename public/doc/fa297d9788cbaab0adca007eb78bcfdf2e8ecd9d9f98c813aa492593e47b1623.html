  <h1>FBI releases short UAP video from Northeastern US, October 2024</h1>

  <p>This record is a short iPhone video clip released by the FBI (Federal Bureau of Investigation) as FBI-UAP-PR003, titled &quot;Orbs Over the Pond,&quot; concerning an unidentified aerial phenomenon (UAP) reported in the Northeastern United States in October 2024. The FBI&#39;s automated system transcribed the video&#39;s audio, but that transcription is effectively empty — it produced only the repeated filler word &quot;You&quot; — so no facts can be drawn from the document&#39;s own text. Everything descriptive about the clip comes from a separate catalogue listing, not from the video&#39;s transcribed content.</p>
  <div class="narr">The document is a video file (DOD_111764159.mp4) that the FBI (Federal Bureau of Investigation) released under the reference FBI-UAP-PR003 with the title &quot;Orbs Over the Pond.&quot; It relates to an unidentified aerial phenomenon (UAP) — the current official term for what used to be called a UFO — recorded in October 2024 somewhere in the Northeastern United States.

The footage itself was shot on an iPhone. When the material was processed, an automated system attempted to transcribe the audio track, but the result contains no usable content: it is just the word &quot;You&quot; repeated over and over, which is transcription noise rather than anything actually said on the recording.

Because of that, none of the descriptive detail in this record comes from the video&#39;s own text. What is known about the clip — its title, the reference to orbs and a pond, the date, and the location — comes only from the war.gov catalogue listing that accompanies the file, and that catalogue text could not be checked against the source itself.

The FBI did not include any written conclusion, analysis, or finding in the transcribed material. Any real assessment of what the video shows would require watching the footage, which a text-based extraction cannot do. Per the catalogue, the clip was cropped for privacy before release.</div>
