  <h1>FBI Agents Surveyed a Property Where a Resident Reported Three Years of UAP Sightings</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">November, 2024</span>
    <span class="badge">Northeastern United States</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/953c2aa10c0e560ea11b131cc64ef6962671649eec743cf3ab0f24698c0fc1b7.jpg" alt="FBI Agents Surveyed a Property Where a Resident Reported Three Years of UAP Sightings thumbnail" loading="lazy" />
  <p>This is an FBI internal communication from November 2024 documenting a site visit to a private property in the northeastern United States where a resident claimed to have observed unidentified aerial phenomena repeatedly over three years. The resident showed agents a trail camera that allegedly captured UAP activity and offered the property for FBI surveillance equipment.</p>
  <div class="narr">In November 2024, FBI agents visited a private property in the northeastern United States to conduct a site survey. The property&#39;s resident had reported seeing unidentified aerial phenomena (UAP) multiple times over the previous three years, and the Bureau sent agents to examine the location firsthand.

During the visit, the resident gave agents a tour of the property and led them to a wooded area approximately 200 yards from the home. A trail camera had been set up there, facing west, which the resident said had captured UAP activity. The surrounding area featured signs restricting hunting and fishing, a stone wall running south to north, and a trail that passes around but not through the zone where UAP was reportedly seen. Agents noted that multiple homes to the east would have a line of sight to the activity area.

The resident provided video footage and trail camera photos to the agents. They also offered to let the FBI set up equipment on the property and to coordinate evening visits, since the UAP activity was most often observed during evening hours. The report references 24 photo enclosures — including treeline shots, trail camera images, and a photo log — but these images were not included in the released document.

The document is heavily redacted: all personal names, specific addresses, case identifiers, and geographic details have been blacked out. The report records what the witness told agents; it does not document any independent verification or conclusions by the FBI about what was observed.</div>
