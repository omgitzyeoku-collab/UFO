  <h1>EOP-UAP-D001, NASC Inquiry into Bahia, Brazil Incident, November 13, 1963</h1>
  <div class="meta">
    <span class="badge">Executive Office of the President</span>
    <span class="badge">11/13/63</span>
    <span class="badge">Bahia, Brazil</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/e2df29304679c8be49b111803e469352dd65c20e68a0daee8ffcc11afbf92c0e.jpg" alt="EOP-UAP-D001, NASC Inquiry into Bahia, Brazil Incident, November 13, 1963 thumbnail" loading="lazy" />
  <p>This document is a Central Intelligence Agency (CIA) Foreign Broadcast Information Service (FBIS) wire report dated November 9, 1963, tracking a local Portuguese-language radio broadcast from Rio de Janeiro, Brazil, regarding an alleged crash of a “large metal sphere” containing a deceased occupant in Conde, Bahia, Brazil. This FBIS report is excerpted from the files of Edward C. Welsh, Executive Secretary of the National Aeronautics and Space Council (NASC). NASC was a cabinet-level advisory body within the Executive Office of the President responsible for coordinating U.S. space policy from 1958 to 1973.

Handwritten annotations dated November 13, 1963, document a communication between officials at NASC and the U.S. Department of State. The note records a NASC request to a State Department official to query the U.S. Embassy in Rio de Janeiro for local verification of the reporting. This inter-agency request precedes a subsequent diplomatic cable sent by the Embassy the following day, cataloged in this collection under the title “DOS-UAP-D001.”</p>
