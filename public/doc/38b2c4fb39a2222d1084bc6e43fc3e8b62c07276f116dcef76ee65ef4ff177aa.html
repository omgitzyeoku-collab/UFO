  <h1>American Airlines Crew Reported Flashing Lights Over Wyoming in 2023</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/38b2c4fb39a2222d1084bc6e43fc3e8b62c07276f116dcef76ee65ef4ff177aa.jpg" alt="American Airlines Crew Reported Flashing Lights Over Wyoming in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents white flashing lights observed by the crew of American Airlines flight 1470 on 14 February 2023 while flying at 37,000 feet over Wyoming. The FAA assessed the sighting as consistent with sunrise reflections off low Earth orbit satellites, and the case is closed.</p>
  <div class="narr">On 14 February 2023 at 10:25 UTC, the crew of American Airlines flight AAL1470 — an Airbus A321 flying from Seattle to Dallas/Fort Worth — reported seeing white flashing lights while cruising southeast-bound at 37,000 feet. The sighting occurred approximately 90 nautical miles west of DBS, a navigational waypoint likely located in Wyoming.

The report was filed through the FAA&#39;s SKYWATCH system and handled by Salt Lake City Air Route Traffic Control Center (ZLC). It was coded as an Unidentified Aerial Phenomenon. NORAD — the North American Aerospace Defense Command — was briefed on the report, and the FAA&#39;s Office of Military and Interagency Coordination (OMIC) was tasked with filing a Mandatory Occurrence Report.

The FAA&#39;s own assessment concluded the sighting was consistent with sunrise reflections off low Earth orbit satellites. The case is now closed. No corroborating radar or sensor data is mentioned in the document.

This is a summary-level incident report rather than a detailed investigation file. The separate Mandatory Occurrence Report referenced in the document would contain additional details not present here.</div>
