  <h1>Five Airliners Spotted Same Unidentified Object Near Tampa in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3dd1c9605678a0453bbaa20ad8a4eca9ed3345333948f03ff78c819952ec4e4b.jpg" alt="Five Airliners Spotted Same Unidentified Object Near Tampa in 2023 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a November 2023 sighting in which five commercial aircraft crews independently observed a white, aircraft-sized object northwest of Tampa, Florida, at roughly 25,000–31,000 feet. The object did not appear on air traffic control radar, no aircraft took evasive action, and the case was closed without identifying the object.</p>
  <div class="narr">On the evening of 19 November 2023, at 22:50, crews aboard five separate commercial flights reported seeing the same white object in the sky northwest of Tampa International Airport (TPA). The object was described as roughly the size of an aircraft, hovering or moving at altitudes between FL250 and FL310 — aviation shorthand for approximately 25,000 to 31,000 feet. The initial report was filed under callsign ASA516.

Despite being seen by multiple independent flight crews, the object did not show up on the Federal Aviation Administration&#39;s air traffic control (ATC) radar systems. This is one of the more striking details in the report: a visual sighting corroborated by five aircraft, with no matching radar return.

No pilots reported taking evasive manoeuvres, and the FAA noted no impact to flight operations. The report was classified under the FAA&#39;s primary code for &quot;Unidentified Aerial Phenomenon&quot; and processed through the SKYWATCH incident reporting system.

The case status is listed as &quot;Closed.&quot; The document provides no explanation or identification of the object. No crew names, aircraft tail numbers, or detailed witness statements appear in this summary-level report.</div>
