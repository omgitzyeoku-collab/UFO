  <h1>Eleven Airline Crews Reported Orbs of Light Near Des Moines</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/4281cb820f13a963d2c5d70daaf9e139087cf8f99629d3a6759471f19082fcae.jpg" alt="Eleven Airline Crews Reported Orbs of Light Near Des Moines thumbnail" loading="lazy" />
  <p>This FAA incident report documents eleven commercial flights reporting unidentified orbs of light near Des Moines, Iowa on 11 December 2022. All sightings came from eastbound aircraft at high altitude over a 28-minute window, and the case was closed without any identification of the phenomena.</p>
  <div class="narr">On 11 December 2022, eleven commercial flights passing near Des Moines, Iowa reported seeing unidentified aerial phenomena directly ahead of them while flying eastbound. The aircraft were cruising at altitudes between 33,000 and 39,000 feet. Pilots described the objects as orbs of light moving in various directions at varying distances from Des Moines.

The reports came from crews flying for six different airlines: United, American, Alaska, Delta, Frontier, and UPS. The first report was logged at 09:22 UTC and the last at 09:50 UTC — a span of 28 minutes. Minneapolis Center (the FAA regional air traffic control facility, known by its code ZMP) handled the reports and provided all flights with contact numbers for the FAA&#39;s UFO Reporting Center.

The FAA filed a Mandatory Occurrence Report (MOR ID: ZMP-M-2022/12/11-0001) to consolidate what it described as multiple vague reports from the various aircraft. The primary flight listed in the record is United Airlines flight 2247, operating from San Francisco to Washington Dulles.

The case is marked as closed. The document contains no radar data, sensor readings, or photographic evidence — every observation is a visual pilot report only. No explanation or identification of the phenomena is provided in the record.</div>
