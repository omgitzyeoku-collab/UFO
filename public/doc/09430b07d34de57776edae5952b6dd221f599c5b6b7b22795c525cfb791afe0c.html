  <h1>Commercial Airline Crew Reports Lights at 60,000 Feet Over Mississippi</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/09430b07d34de57776edae5952b6dd221f599c5b6b7b22795c525cfb791afe0c.jpg" alt="Commercial Airline Crew Reports Lights at 60,000 Feet Over Mississippi thumbnail" loading="lazy" />
  <p>This is an FAA incident report documenting a July 2022 sighting by the crew of a commercial Allegiant Air A320 flying from Kansas City to St. Pete–Clearwater. The pilots reported seeing lights with no contrail at roughly 60,000 feet or above while cruising at 37,000 feet near Greenville, Mississippi. The FAA closed the case with no explanation or identification provided.</p>
  <div class="narr">On 18 July 2022 at 03:00, the crew of a commercial Airbus A320 operating as flight AAY913 reported an unidentified aerial phenomenon to air traffic control. The aircraft was travelling southeast at 37,000 feet on a route from Kansas City (MCI) to St. Pete–Clearwater (PIE) and was approximately 35 nautical miles north of Greenville, Mississippi (GLH) at the time of the sighting.

The crew described the phenomenon as lights with no contrail travelling at approximately FL 600 — roughly 60,000 feet — or above. That altitude is well beyond the operating ceiling of most conventional aircraft, which is part of what makes the report notable. However, the altitude estimate was a rough visual judgment from the crew, not an instrumented measurement.

The incident was logged through the FAA&#39;s SKYWATCH system and was also reported to the National UFO Reporting Center (NUFORC) at 04:46. The FAA classified the primary code as &quot;Unidentified Aerial Phenomenon.&quot;

The case status is marked as Closed. The document provides no resolution, identification, or follow-up analysis. There is no indication that radar data or additional witness accounts were included or consulted.</div>
