  <h1>American Airlines Crew Reported Circling Lights Over Iowa in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/71a820786a775597f0bb5f9b4fcc2359e3578c64daf296ae54f41bf91b004741.jpg" alt="American Airlines Crew Reported Circling Lights Over Iowa in 2023 thumbnail" loading="lazy" />
  <p>A preliminary FAA incident report records that the crew of American Airlines Flight 403, flying from Denver to Philadelphia, observed lights circling off their left side at roughly 35,000 feet near Iowa City, Iowa on 11 February 2023. The FAA noted that similar sightings the prior week had been attributed to a chain of satellites.</p>
  <div class="narr">This document is a preliminary incident report from the FAA&#39;s Washington Operations Center, logged on 11 February 2023 at 03:02 CST. It records a UAP (unidentified anomalous phenomena) sighting reported by the flight crew of American Airlines Flight 403, an Airbus A320 travelling from Denver to Philadelphia.

According to the report, the crew observed lights circling off the left side of the aircraft at the same altitude or higher while flying eastbound at flight level 350 — approximately 35,000 feet — near Iowa City, Iowa. The coordinates recorded place the sighting at roughly 41.66°N, 91.53°W. Chicago ARTCC (Air Route Traffic Control Center) was the air traffic control facility that handled the report.

The FAA noted in the report that similar phenomena had been reported the previous week and were determined to be a chain of satellites — a likely reference to satellite constellations such as Starlink, which are frequently mistaken for unusual aerial lights. No follow-up investigation or final determination is included in this document. Law enforcement was not notified.

The report is labelled as preliminary information, meaning it may not represent a final FAA assessment of the incident. No independent corroboration from other aircraft or ground observers is documented.</div>
