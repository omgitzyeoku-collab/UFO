  <h1>Two Flight Crews Reported Bright Lights Moving Above 39,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ad6ad8b8564c2faa4214565a4ad24451bfedacd8c1b24dfba9d7c9bf440a9879.jpg" alt="Two Flight Crews Reported Bright Lights Moving Above 39,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH report documents a May 2022 incident in which a commercial pilot flying at 39,000 feet spotted a line of equally spaced bright lights moving eastward well above their altitude. A second aircraft independently confirmed the same sighting, but no further investigation was conducted and the case was closed.</p>
  <div class="narr">On 12 May 2022 at 08:05 UTC, the crew of a commercial flight (callsign VTE611) reported an unidentified aerial phenomenon while flying northeast at FL390 (39,000 feet) over CSN VORTAC. The lights appeared directly ahead of the aircraft at the 12 o&#39;clock position.

The crew described an equally spaced line of very bright lights moving eastward, well above their cruising altitude. A second aircraft — UPS1114 — independently reported the same sighting, providing corroboration from a separate flight crew.

The FAA did not notify law enforcement. Instead, the flight crew was directed to a website to self-report the sighting. The agency&#39;s internal office (AWO) was notified, but no follow-up investigation is documented in the file. The case is marked as closed.

The report contains no radar data, photographs, or instrument readings. It relies entirely on visual observation by the two flight crews. No conclusion about what the lights were is offered in the document.</div>
