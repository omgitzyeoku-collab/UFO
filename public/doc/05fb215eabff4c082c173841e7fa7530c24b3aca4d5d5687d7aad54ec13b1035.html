  <h1>SkyWest Crew Reports Large Balloon at 50,000 Feet Over Kansas</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/05fb215eabff4c082c173841e7fa7530c24b3aca4d5d5687d7aad54ec13b1035.jpg" alt="SkyWest Crew Reports Large Balloon at 50,000 Feet Over Kansas thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a February 2023 sighting by the crew of SkyWest flight SKW3756, who observed what they described as a large balloon at approximately 50,000 feet while flying at 37,000 feet over Kansas. The case was closed with no resolution or follow-up details provided.</p>
  <div class="narr">This document is an FAA SKYWATCH Incident Report classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot; It records an observation made by the crew of SkyWest flight SKW3756, a commercial flight routing from Oklahoma City to Minneapolis, on 3 February 2023.

While flying northbound at Flight Level 370 (37,000 feet), the crew reported a large balloon off the right side of the aircraft, approximately 30 nautical miles west of the RBA navigational beacon in the Liberal, Kansas area. They estimated the object was at approximately Flight Level 500 (50,000 feet) or above. The incident was reported through FAA Kansas City Center.

The report is marked as Closed, but no resolution, identification, or follow-up information is included. There is no radar data, no intercept details, and no corroborating observations from other aircraft or ground stations in this document. The FAA recorded it, classified it as a UAP, and that is where the paper trail ends.</div>
