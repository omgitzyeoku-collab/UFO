  <h1>CIA Report Details How Soviet Airline Aeroflot Fought Pilot Fatigue</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">November, 1976</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/490841ebe7487b3e7386ca5fa22c256b678fafa58aa79fae925bf9fe72771c28.jpg" alt="CIA Report Details How Soviet Airline Aeroflot Fought Pilot Fatigue thumbnail" loading="lazy" />
  <p>This November 1976 CIA intelligence report describes how the Soviet airline Aeroflot combated crew fatigue through exercise programmes, pre-flight medical testing, and dedicated rest facilities at major airports. It also notes a Soviet scientist&#39;s explanation that cosmic ray particles — not unidentified craft — caused pilots to &#39;see&#39; flashes of light during night flights.</p>
  <div class="narr">In November 1976, the CIA&#39;s Domestic Collection Division filed a foreign intelligence report (number 00-B-321/33474-76) on how the Soviet Union&#39;s state airline, Aeroflot, managed crew fatigue. The report is marked &#39;unevaluated information&#39;, meaning the CIA recorded but did not independently verify the claims before filing them.

The document describes three main countermeasures. First, Aeroflot provided exercise facilities at all major airports, supervised by a well-known athlete. Second, every crewmember underwent a pre-flight medical and psychological examination — conducted by a medical team headed by a doctor, usually a woman — and was grounded if they failed. These tests were being automated using prototype equipment developed at the Civil Aviation Institute of Leningrad, which measured blood pressure, pulse rate, cardiovascular function, and motor ability in roughly one to three minutes. Third, major Soviet airports each had a &#39;prophylactorium&#39; — a three- to four-storey rest building set apart from the main terminal, where transient crews could recover between flights.

The document also references Dr Inal Georgiyevich Akoyev, a radiation biologist, who explained that cosmic ray particles cause a visual phenomenon called phosphenes — flashes of light that Aeroflot pilots reported seeing during night flying. Despite the report&#39;s subject line mentioning &#39;UFO phenomena&#39;, the actual content attributes these sightings to a known physical effect, not unidentified craft.

Moderate redaction is present throughout the document, particularly around source identification and some contextual details. A more heavily redacted version of this report was previously available on the CIA&#39;s public website, meaning this version may contain details not previously seen by the public.</div>
