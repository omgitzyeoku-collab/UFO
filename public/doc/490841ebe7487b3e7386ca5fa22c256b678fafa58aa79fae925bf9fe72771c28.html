  <p>This November 1976 CIA Foreign Intelligence Information Report summarizes Soviet Aeroflot&#39;s involvement in aerospace medical research, including their methods for combating crew fatigue through physical conditioning, automated biological testing equipment that measures vital signs in 1-3 minutes, and discussions about UFO phenomena with a Soviet radiation biologist. A more redacted version of this report has been available on CIA&#39;s public website.</p>
