  <h1>Australia Urged Its Own UFO Programme After Reviewing US Failures</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1971</span>
    <span class="badge">Australia</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a91a8665371816b5463dff7de2f1c4c02ac449ba122d088b2898592c82dba9dc.jpg" alt="Australia Urged Its Own UFO Programme After Reviewing US Failures thumbnail" loading="lazy" />
  <p>This 1971 Australian Department of Defence document traces the full history of US government UFO investigations from 1947 to 1969 — Projects Sign, Grudge, and Blue Book — and concludes that Australia should launch its own independent, scientifically honest investigation rather than follow the US Air Force&#39;s policy of public dismissal.</p>
  <div class="narr">In 1971, the Australian Department of Defence produced a detailed review of how the United States had handled UFO reports over the previous two decades. The document, released through the National Archives of Australia, walks through the progression of US programmes: Project Sign (authorised late 1947), which in September 1948 sent a Top Secret estimate to the Pentagon concluding UFOs were interplanetary — only for Air Force Chief of Staff General Vandenberg to reject those conclusions for insufficient hard evidence. Sign was then replaced by Project Grudge in February 1949, which the document describes as &#39;a definite attempt to destroy public acceptance of UFOs.&#39;

The review details how Project Blue Book processed 3,200 reports using IBM card-sorting machines, and highlights a striking statistical finding: when sightings were graded by reliability, the percentage classified as &#39;unknown&#39; rose with quality — from 16.6% for poor-quality reports to 33.3% for excellent ones. Blue Book&#39;s own consultants calculated the odds of these unknowns being the same type of objects as identified ones at less than 1 in 10^28. Despite this, the CIA — after convening the Robertson Panel of six scientists in January 1953 — preferred to publicly abandon investigation while intensifying covert data collection. By September 1953, Blue Book&#39;s staff had been cut from ten qualified Top Secret personnel to a single airman.

The document also describes a climate of enforced secrecy. JANAP 146 (1953) prohibited military personnel from discussing UFOs under threat of up to 10 years&#39; imprisonment and a $10,000 fine. The revised JANAP 146E (1960) went further, making UFO data disclosure an offence under the Espionage Act. The review notes that Dr Edward Condon, who led the university study that ultimately recommended closing Blue Book, publicly stated his negative conclusion before completing his research.

The Australian authors&#39; recommendation is direct: rather than following the US approach, Australia should &#39;act independently and initiate a programme that is scientifically sound and intellectually honest.&#39; The document openly criticises the US pattern of public dismissal and argues Australia should not remain ignorant of the situation.</div>
