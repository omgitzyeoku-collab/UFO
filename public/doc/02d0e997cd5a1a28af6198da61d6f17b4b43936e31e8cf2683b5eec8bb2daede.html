  <h1>Learjet Pilot Reported Unidentified White Object Over Colorado in 2007</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/02d0e997cd5a1a28af6198da61d6f17b4b43936e31e8cf2683b5eec8bb2daede.jpg" alt="Learjet Pilot Reported Unidentified White Object Over Colorado in 2007 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a Gates Learjet 35 pilot who saw an unidentified white object pass above the aircraft on 19 October 2007. Denver Center confirmed no other air traffic was in the area by radar or non-radar means, and the case was closed without explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form used by the Federal Aviation Administration to log unusual aerial sightings reported by pilots or air traffic controllers. It was catalogued under the identifier 237UAP00004 and later released as part of the US government&#39;s public UAP disclosure.

On 19 October 2007, the pilot of a Gates Learjet 35 (callsign BKA626), flying from Cincinnati/Northern Kentucky (CVG) to Centennial Airport, Colorado (APA), reported seeing an unidentified white object pass above the aircraft travelling in the opposite direction. The pilot noted the object had no navigational lights. At the time of the sighting, the pilot was observing the constellation Ursa Major, indicating nighttime conditions.

Denver Center (ZDV), the FAA facility handling the airspace, confirmed that no IFR (instrument flight rules) or VFR (visual flight rules) traffic was detected in the area by either radar or non-radar means. There were also no weather returns on the Traffic Situation Display within a 400 nautical mile radius. The FAA&#39;s National Capital Region Coordination Center (NCRCC) requested that a saved radar picture from 0700 be emailed for further review.

The report&#39;s status is listed as &quot;Closed.&quot; No identification of the object was recorded, and no resolution or explanation appears in the document. The primary code assigned to the incident is simply &quot;OTHER.&quot;</div>
