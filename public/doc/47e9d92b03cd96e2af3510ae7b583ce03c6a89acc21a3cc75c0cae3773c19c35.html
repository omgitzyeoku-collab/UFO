  <h1>FBI File Shows Bureau Tracked and Debunked 1947 Flying Disc Reports</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/47e9d92b03cd96e2af3510ae7b583ce03c6a89acc21a3cc75c0cae3773c19c35.jpg" alt="FBI File Shows Bureau Tracked and Debunked 1947 Flying Disc Reports thumbnail" loading="lazy" />
  <p>This FBI case file (62-HQ-83894) documents how the Bureau collected and evaluated flying disc reports during the summer 1947 saucer wave. Most reports the FBI investigated turned out to be hoaxes, pranks, or misidentifications — circular saws, pipe ashes, optical illusions — and the file shows the FBI routinely forwarded citizen correspondence to the War Department.</p>
  <div class="narr">In the summer of 1947, Americans across the country began reporting strange objects in the sky — &quot;flying discs&quot; or &quot;flying saucers.&quot; This FBI headquarters file, released under the Freedom of Information/Privacy Acts (FOIPA number 222297), captures how the Bureau responded. It contains internal memos, newspaper clippings, telegrams from the public, and correspondence between FBI officials and the War Department.

Many of the reports fell apart under scrutiny. A priest in Grafton, Wisconsin claimed to have found a disc on July 6, 1947, but the Associated Press determined he was intoxicated and the object was a circular saw — likely a prank. A disc reportedly found in Harrison, near New Orleans, was also revealed to be a prank. A chemist, Dr. C.L. Kenny, analyzed one recovered &quot;saucer&quot; and found it contained sodium, potassium, iron, sulphate, and carbon — the same composition as ordinary pipe ashes. Army radar systems across the country detected nothing unusual. Maj. Gen. Curtis E. LeMay flatly denied the objects had anything to do with Air Force experiments, and Atomic Energy Commission chairman David Lilienthal dismissed the reports as hoaxes.

Not every report was so easily explained. A housewife near St. Maries, Idaho reported eight saucers landing on a mountainside, allegedly witnessed by ten people. Near Palestine, Texas, residents described orange basketball-sized balls of fire circling the area, causing enough alarm that some residents began praying. Others shot at the objects with .22 caliber rifles without effect. The military took the wave seriously enough that Muroe Army Air Field in California kept a P-80 jet fighter on standby, and the Oregon National Guard prepared six fighters to give chase.

The file also captures the range of public reaction. A psychiatrist, Dr. Winteed Overholser of St. Elizabeths Hospital, suggested the phenomenon had &quot;some of the earmarks of being national hysteria.&quot; AP science editor Howard Blakeslee attributed the sightings to optical illusions. Meanwhile, a Texas inventor named Woodson C. Cope sent a telegram to the FBI suggesting his multi-spring catapult invention could explain the discs. FBI Director J. Edgar Hoover&#39;s office forwarded citizen letters about the discs to the War Department&#39;s intelligence division via special messenger.

The document carries moderate redactions — some portions remain blacked out in this FOIPA release. Many pages suffer from very poor scan quality, and handwritten notes throughout are largely illegible, meaning the file almost certainly contains information that cannot be read in its current form.</div>
