  <h1>U.S. Air Force Crew Reported Ball-Shaped UAP Over Syria in 2023</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">11/9/23</span>
    <span class="badge">Syria</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/30708df4aa8484c668d3c3694560f5b57d5a10b6b3da1cfb826a925d9cc806e1.jpg" alt="U.S. Air Force Crew Reported Ball-Shaped UAP Over Syria in 2023 thumbnail" loading="lazy" />
  <p>A formerly secret U.S. military mission report documents a single unidentified object, described as shaped like a bouncy ball, spotted by an Air Force surveillance aircraft over Syria on 9 November 2023. The object traveled at roughly 483 mph for at least seven minutes before moving out of range, and the crew assessed it as not threatening.</p>
  <div class="narr">On the night of 9 November 2023, a U.S. Air Force intelligence, surveillance, and reconnaissance (ISR) aircraft was returning to base over Syria as part of Operation Inherent Resolve — the U.S.-led campaign against violent extremist groups in the region. At 9:53 PM Zulu time, the crew observed a single unidentified object approaching from the south at roughly the same altitude as their aircraft.

The crew described the object as solid and shaped like a bouncy ball. They estimated it was traveling at approximately 424 knots (about 483 mph), maintaining that speed consistently for at least seven minutes before it moved out of visual range. During the encounter, the object dropped altitude and passed safely below the aircraft. No emissions — heat, light, radio frequency, or otherwise — were detected coming from it, and the crew reported no effects on themselves or their equipment.

The observer assessed the object as benign and not under intelligent control, with unknown propulsion. No maneuvers were observed, no material was recovered, and the crew did not attempt to engage. No other aircraft or ground observers independently reported the object. The report did flag the UAP as exhibiting &quot;advanced capabilities,&quot; citing its sustained high speed in an unusual shape, though all speed and altitude figures in the report are marked as estimates rather than instrument measurements.

The document was originally classified SECRET//NOFORN (not releasable to foreign nationals) with a scheduled declassification date of 9 November 2048 — 25 years after the incident. It was released early to the All-domain Anomaly Resolution Office (AARO), the Pentagon&#39;s UAP investigation body, under reference USCENTCOM MDR 25-0072. The release was recommended by Major General Brandon R. Tegtmeier, USCENTCOM Chief of Staff, on 2 June 2025.

Much of the document is redacted. The aircraft type, callsign, tail number, crew identities, exact coordinates, and sensor details are all blacked out under national security and privacy exemptions. What remains is a single crew&#39;s account of an object they could not identify, filed through standard military reporting channels.</div>
