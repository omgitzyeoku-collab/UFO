  <h1>American Airlines Crew Reported High-Altitude Balloon Over Kansas in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/bd19d2a01d0bc706435cffae8a5fdc6a088771076b708179084c040fa29fa882.jpg" alt="American Airlines Crew Reported High-Altitude Balloon Over Kansas in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents the crew of American Airlines flight 2574 spotting a large balloon at an estimated 50,000 feet or higher while flying at 36,000 feet on 3 February 2023. The sighting was logged as an Unidentified Aerial Phenomenon through the Denver air traffic control centre, and the case was closed with no resolution or identification provided.</p>
  <div class="narr">On 3 February 2023, the crew of American Airlines flight AAL2574 — a Boeing 737-800 flying from St. Louis to Phoenix — reported a large balloon off the right side of their aircraft. The plane was cruising westbound at 36,000 feet, roughly 30 nautical miles west of the RBA navigational beacon, when the crew spotted the object. They estimated it was at approximately 50,000 feet or higher.

The sighting was reported through Denver Air Route Traffic Control Centre (ZDV) and logged under the FAA&#39;s SKYWATCH system with the primary classification &quot;Unidentified Aerial Phenomenon.&quot; The report is a standard FAA incident form — it records the flight details, the crew&#39;s description of what they saw, and the approximate location.

The case is marked as closed. No identification of the object is provided in the report, no radar data or additional witness accounts are included, and no follow-up findings are documented. The date falls within the same period — early February 2023 — when multiple high-altitude balloon incidents were reported across US airspace, though this report does not reference any connection to those events.</div>
