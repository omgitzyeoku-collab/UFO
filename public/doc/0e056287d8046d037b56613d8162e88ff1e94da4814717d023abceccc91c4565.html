  <h1>Multiple Pilots Reported Bright Rocket-Like Object Over Texas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0e056287d8046d037b56613d8162e88ff1e94da4814717d023abceccc91c4565.jpg" alt="Multiple Pilots Reported Bright Rocket-Like Object Over Texas thumbnail" loading="lazy" />
  <p>This FAA preliminary incident report documents a sighting on 15 March 2024 in which multiple aircraft near Junction, Texas reported an unidentified aerial phenomenon at approximately 36,000 feet. The object was described as resembling a rocket, very bright with smoke, moving eastbound before appearing to break up or disappear. No evasive action was taken and no law enforcement was notified.</p>
  <div class="narr">On 15 March 2024 at 8:57 PM Central time, Houston Air Route Traffic Control Center (ARTCC) — the FAA facility that manages high-altitude air traffic across a large section of the southern United States — notified the FAA Washington Operations Center that multiple aircraft had reported an unidentified aerial phenomenon near Junction, Texas.

Pilots described the object as resembling some type of rocket that passed from below their altitude to above, reaching approximately 36,000 feet near the Junction VOR (a ground-based navigation beacon). It was reported as very bright, trailing smoke, and moving eastbound before it appeared to break up or disappear.

No aircraft took evasive action in response to the object, and no law enforcement agency was notified. The report is marked as preliminary information — it is a notification, not the result of a follow-up investigation or a final conclusion about what the object was.

The document is brief and contains no redactions of substance. It was logged by FAA Washington Operations Center staff identified only by the initials RL and JW. No specific aircraft callsigns or pilot names appear in the report.</div>
