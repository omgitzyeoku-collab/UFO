  <h1>Military Infrared Video Shows Unidentified Object Tracked Over U.S. Territory</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">NORTHCOM</span>
    <span class="badge">verified</span>
  </div>
  
  <p>This 29-second infrared video, labelled &quot;F/A-18 FLIR UAP&quot; by its uploader, was recorded by what AARO assesses is likely a U.S. military sensor operating within the Northern Command area in 2022. The video shows a sensor tracking an unidentified area of contrast, but the object is never identified, and the video lacks a verified chain of custody.</p>
  <div class="narr">In March 2026, eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records held by the Department of War. The All-domain Anomaly Resolution Office (AARO) identified responsive materials on a classified network and released them publicly as part of the PURSUE collection. This video — catalogued as DOW-UAP-PR069 — is one of those records.

The video is 29 seconds long and was captured by what AARO describes as &quot;likely&quot; an infrared sensor aboard a U.S. military platform operating within the United States Northern Command (NORTHCOM) area of responsibility in 2022. The title &quot;F/A-18 FLIR UAP&quot; was assigned by the person who uploaded the video to a classified network in July 2023 — it was not assigned by AARO or the Department of War, so it may not accurately describe the aircraft or the object.

In the footage, the sensor pans to track an area of contrast — essentially a heat signature or thermal anomaly. At the 14-second mark, a targeting reticle locks onto the object. At the 27-second mark, the reticle loses its track. No identification or characterisation of the object is provided by AARO.

The Department of War notes that many of the released materials, including this one, lack a substantiated chain of custody — meaning the full history of who handled the video and how it reached the classified network cannot be verified. The accompanying description is marked as being provided &quot;for informational purposes only.&quot;</div>
