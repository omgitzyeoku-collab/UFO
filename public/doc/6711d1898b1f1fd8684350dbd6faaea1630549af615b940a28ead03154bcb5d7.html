  <h1>United Airlines Crew Reports Three Bright Lights Over Nebraska</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/6711d1898b1f1fd8684350dbd6faaea1630549af615b940a28ead03154bcb5d7.jpg" alt="United Airlines Crew Reports Three Bright Lights Over Nebraska thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of United Airlines flight 2710 on 27 September 2023. While flying from San Francisco to Chicago, the crew observed three bright white lights to their left, roughly 45 nautical miles southwest of Scottsbluff, Nebraska. No evasive action was taken and no further investigation is recorded in the document.</p>
  <div class="narr">This document is an incident report from the FAA&#39;s Washington Operations Center, filed under record number 237UAP00558. It records a UAP (unidentified anomalous phenomena) sighting reported by a commercial airline crew during a routine domestic flight.

On 27 September 2023, the crew of United Airlines flight 2710 — a Boeing 737-900 flying from San Francisco (SFO) to Chicago O&#39;Hare (ORD) — reported seeing three bright white lights from their 10 o&#39;clock position. The sighting occurred approximately 45 nautical miles southwest of Scottsbluff, Nebraska, at coordinates roughly 41.48°N, 104.29°W. The report was filed late, at 0300 Mountain time, meaning there was a delay between the observation and the official filing.

The crew did not take evasive action, and no law enforcement was notified. The report was passed through the FAA&#39;s internal chain: C-ROC (a regional operations centre) advised FAA Operations.

The document does not include any description of the objects&#39; behaviour, size, altitude, or how long they were visible. There is no mention of radar data, sensor readings, or any follow-up investigation. The FAA drew no conclusions about what the lights were.</div>
