  <h1>Alaska Airlines Crew Reported Two UAP Over Tampa Bay in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b3497ed436fa66a51d09651cffcec107d9a6dda861b8e096a6a53e2f4d357d78.jpg" alt="Alaska Airlines Crew Reported Two UAP Over Tampa Bay in 2023 thumbnail" loading="lazy" />
  <p>This FAA operations centre log records that on 28 February 2023, the crew of Alaska Airlines Flight 421 spotted two unidentified objects above their aircraft near St Petersburg-Clearwater, Florida. The document is a brief preliminary report — no investigation findings, radar data, or description of the objects is included.</p>
  <div class="narr">On the evening of 28 February 2023, the crew of Alaska Airlines Flight 421 — a Boeing 737-800 flying from Tampa to San Francisco — reported seeing two unidentified anomalous phenomena (UAP) while passing over the Tampa Bay area. The objects were off the right side of the aircraft, roughly 6,000 feet above it, while the plane was flying westbound at 8,400 feet altitude. The sighting occurred approximately 9 miles southwest of St Petersburg-Clearwater, Florida.

The report was relayed through Miami Air Route Traffic Control Center (ARTCC). According to the log, the crew took no evasive action and law enforcement was not notified. The document is filed under reference WOC 73333.

This record is an FAA Washington Operations Center incident log — essentially a short internal note that a sighting was reported. It is not an investigation report and contains no conclusions about what the objects were. No description of the UAP&#39;s shape, colour, movement, or behaviour appears in the document beyond their position relative to the aircraft.

The coordinates recorded in the report (27.82°N, 82.79°W) place the event over Tampa Bay or the nearby Gulf of Mexico coastal waters. The report was logged at 8:05 PM Eastern Standard Time.</div>
