  <h1>FBI Cover Page From Newark Office Reveals Almost Nothing</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">August 1952-1967</span>
    <span class="badge">New Jersey, United States</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/96a62f6ae5d047271ad827519c3cde87245ca731112b305a80e8469750853203.jpg" alt="FBI Cover Page From Newark Office Reveals Almost Nothing thumbnail" loading="lazy" />
  <p>This document is a single cover page from an FBI file associated with the Newark Field Office, spanning 1952 to 1967. The page is so heavily degraded or redacted that no substantive information about UFO sightings can be read from it — only the FBI letterhead and a note that it was copied for background-check processing are legible.</p>
  <div class="narr">This record, catalogued as FBI-UAP-D012, is a cover page or file folder sheet from the Federal Bureau of Investigation&#39;s Newark Field Office. According to the metadata, the underlying file relates to events in New Jersey between August 1952 and 1967, but the extracted content tells a far thinner story.

The document is classified as an image (IMG type), meaning it was scanned rather than born-digital. The scan quality is extremely poor. The only text that can be reliably read identifies it as a &quot;Department of Justice, Federal Bureau of Investigation&quot; document and notes that it was &quot;COPIED FOR — EQIP,&quot; referring to the Electronic Questionnaires for Investigations Processing system, a government platform used for background checks.

No names, no places, no descriptions of sightings, and no agency conclusions appear in the extracted text. The metadata catalogue describes extensive UFO sighting records from New Jersey across a fifteen-year span, but none of that content survived the extraction process. Whether that gap is due to extreme redaction, image degradation, or the fact that only the cover sheet was captured is not clear from the document alone.

In short, this release puts a file on the public record without making its contents accessible. The cover page confirms the file exists within FBI holdings, but everything behind it remains unreadable.</div>
