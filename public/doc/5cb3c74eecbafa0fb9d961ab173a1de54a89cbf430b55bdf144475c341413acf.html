  <h1>FBI File Preserved a 1956 Book Jacket About UFO Silencing Claims</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5cb3c74eecbafa0fb9d961ab173a1de54a89cbf430b55bdf144475c341413acf.jpg" alt="FBI File Preserved a 1956 Book Jacket About UFO Silencing Claims thumbnail" loading="lazy" />
  <p>This document is not an FBI investigation — it is the promotional dust jacket text from Gray Barker&#39;s 1956 book &#39;They Knew Too Much About Flying Saucers&#39;, filed in the FBI&#39;s central UFO case records. The jacket copy claims that three men in dark suits visited and silenced leading flying saucer researchers, but these are commercial marketing claims, not FBI findings.</p>
  <div class="narr">This FBI filing is a straightforward records entry: someone at the Bureau&#39;s Central Records Center placed the front and back dust jacket copy of a 1956 book into the FBI&#39;s main UFO case file (numbered 62-HQ-83894). The book is &#39;They Knew Too Much About Flying Saucers&#39; by Gray Barker, published by University Books, Inc. of New York. No FBI analysis or commentary on the book&#39;s claims appears in the filing.

The dust jacket describes Barker as a businessman and film booking agent based in Clarksburg, West Virginia, who became interested in flying saucers in 1952 after an alleged saucer landing near his home. He was about 30 years old at the time of publication and also published a periodical called The Saucerian. H. G. Rhawn, publisher of the Clarksburg News, provided an endorsement of Barker&#39;s work.

The book&#39;s central marketing claim is dramatic: three men in dark suits allegedly visited leading saucer researchers, and after those visits the researchers stopped publishing or speaking about their findings. This is an early version of what later became known as the &#39;Men in Black&#39; legend in UFO culture.

It is important to understand what this document is not. It is not an FBI investigative report. It contains no FBI conclusions about UFOs or about the book&#39;s claims. The text is promotional copy written to sell a commercial book, using sales-oriented language throughout. The FBI&#39;s reason for filing it is not stated in the visible portions of the document.

The first page of the filing, which would normally contain FBI administrative metadata, is largely unreadable due to poor scan quality.</div>
