  <h1>Navy Pilot Reported Three Unidentified Objects Over Arabian Sea in 2020</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">8/24/20</span>
    <span class="badge">Arabian Sea</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/9127fb5a81efacf030df4dc6290d02bcdf4c8512cf1809b6eccfe6cf16a77f31.jpg" alt="Navy Pilot Reported Three Unidentified Objects Over Arabian Sea in 2020 thumbnail" loading="lazy" />
  <p>A U.S. Navy debrief form documents a nighttime encounter on August 24, 2020, in which a pilot from helicopter squadron HSM-73 visually observed three unidentified airborne objects over the North Arabian Sea. No radar, transponder, or electronic sensor data corroborated the sighting, and the distance, speed, and precise course of the objects were all unknown to the observer.</p>
  <div class="narr">This document is a U.S. Navy &quot;Range Fouler&quot; debrief form — a standardized report used when unidentified objects intrude into controlled military airspace. It was filed by a pilot (rank O-3, roughly Lieutenant Commander level) assigned to HSM-73, a Navy helicopter squadron, following an incident during routine operations over the North Arabian Sea on the night of August 24, 2020.

According to the report, the pilot first spotted a single unknown airborne contact at approximately 00:04 Zulu time. After tracking it visually, the pilot lost sight of the object when it passed behind a cloud. Upon reacquiring the first contact, the pilot noticed two additional objects to the east of the original one — bringing the total to three. All three appeared to hold a steady course, speed, and altitude, heading roughly westward. The pilot described the objects as having a wings-or-airframe structure and a round shape.

Critically, no instrument data backed up the visual observation. The report states there was no stable radar track, no electronic support measures, and no IFF (Identification Friend or Foe) transponder response from any of the three contacts. The distance to the objects was unknown, which means all estimates of their size, altitude, and speed are inherently unreliable. There was no interaction between the pilot&#39;s aircraft and the objects.

The document does not offer any conclusion about what the objects were. It is a raw incident report, not an analysis. The reporter&#39;s name and email address are redacted under a personal-privacy exemption, but the narrative and most data fields are intact.</div>
