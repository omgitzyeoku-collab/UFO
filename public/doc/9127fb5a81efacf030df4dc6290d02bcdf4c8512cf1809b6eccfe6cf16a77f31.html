  <h1>DOW-UAP-D56, Range Fouler Debrief, Arabian Sea, August 2020</h1>
  <div class="meta">
    <span class="badge">Department of War</span>

    <span class="badge">Arabian Sea</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/9127fb5a81efacf030df4dc6290d02bcdf4c8512cf1809b6eccfe6cf16a77f31.jpg" alt="DOW-UAP-D56, Range Fouler Debrief, Arabian Sea, August 2020 thumbnail" loading="lazy" />
  <p>This document is a Range Fouler Debrief Form, a standardized reporting form the U.S. Navy uses to record the circumstances surrounding an unauthorized intrusion into controlled airspace during active military operations or training. These reports contain a narrative description of the observer’s experiences. 
A U.S. military operator reported an encounter with a group of three “unidentified small air contacts” over the North Arabian Sea. The reporter described the UAP as having “wings/airframe” structure, and as initially bearing on a westerly heading. The operator tracked one UAP before losing sight of it behind a cloud. Upon regaining contact, the operator reported observing two additional UAP to the east of the first. The report states that all three objects then “appeared to maintain their relative course, speed, and altitude.”
All descriptive and estimative language contained in this report reflects the reporter’s subjective interpretation at the time of the event. Such characterizations should not be interpreted as a conclusive indication of the presence or absence of any intrinsic object features or performance characteristics.</p>
