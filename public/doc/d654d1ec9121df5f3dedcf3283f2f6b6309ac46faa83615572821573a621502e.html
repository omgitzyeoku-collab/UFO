  <h1>Alaska Airlines Crew Reported Slow-Moving UFO Over Southern Oregon in 2019</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/d654d1ec9121df5f3dedcf3283f2f6b6309ac46faa83615572821573a621502e.jpg" alt="Alaska Airlines Crew Reported Slow-Moving UFO Over Southern Oregon in 2019 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a UFO sighting by the crew of Alaska Airlines Flight 428 on February 9, 2019. The crew observed a slow-moving object with a flashing white light at 40,000–50,000 feet near Chiloquin, Oregon, and the military&#39;s Western Air Defense Sector was notified.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report recording a UFO sighting by a commercial airline crew. It was filed after Seattle Air Route Traffic Control Center relayed the report to FAA Operations.

On February 9, 2019, the crew of Alaska Airlines Flight 428 — a Boeing 737-900 flying from Seattle to Los Angeles — reported seeing a slow-moving unidentified object with a flashing white light. The object was estimated to be at an altitude between 40,000 and 50,000 feet, heading northeast, roughly 14 nautical miles north-northeast of Chiloquin, Oregon. The reporting aircraft was southbound at 35,000 feet at the time.

The Western Air Defense Sector (WADS), the military unit responsible for air defense over the western United States, was notified of the sighting.

The report is a preliminary notification only. It contains no follow-up investigation, no resolution, and no conclusion about what the object was. There is no radar data, photographs, or other sensor evidence included in the document.

One discrepancy worth noting: the document&#39;s metadata lists the incident year as 2023, but the text of the report clearly dates the event to February 9, 2019.</div>
