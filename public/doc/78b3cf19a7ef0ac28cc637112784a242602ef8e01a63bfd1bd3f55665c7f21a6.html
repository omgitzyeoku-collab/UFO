  <h1>FAA Report: Pilot Spots Fast-Moving Lights at 35,000 Feet Over West Virginia</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/78b3cf19a7ef0ac28cc637112784a242602ef8e01a63bfd1bd3f55665c7f21a6.jpg" alt="FAA Report: Pilot Spots Fast-Moving Lights at 35,000 Feet Over West Virginia thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from February 2023 documenting a Spirit Airlines pilot&#39;s sighting of fast-moving blinking white lights while flying at 37,000 feet on a Los Angeles to Baltimore route. The case was closed with no explanation or resolution recorded.</p>
  <div class="narr">On 18 February 2023, the crew of Spirit Airlines flight NKS128, flying eastbound from Los Angeles (LAX) to Baltimore-Washington International (BWI) at 37,000 feet (FL370), reported an unidentified aerial phenomenon off the left side of their aircraft. The sighting occurred approximately 50 nautical miles west of the Huntington VOR (a navigation beacon in West Virginia) and was reported to Indianapolis Center (ZID), the FAA air traffic control facility covering that airspace.

The crew described what they saw as fast-moving blinking white lights travelling southbound at approximately 35,000 feet (FL350) — roughly 2,000 feet below their own altitude. No further details about the object&#39;s size, shape, or behaviour beyond this description appear in the report.

The FAA classified the report under its SKYWATCH system with a primary code of &quot;Unidentified Aerial Phenomenon.&quot; The case is marked as closed. No resolution, explanation, or follow-up investigation is documented in the file.

The report is a single-page incident record. It contains no radar data, photographs, sensor readings, or statements from additional witnesses. It is, in essence, a written log of what the flight crew told air traffic control, preserved in the FAA&#39;s reporting system.</div>
