  <h1>Indiana Civil Defense Volunteer Wrote FBI About Local Flying Saucer Group in 1953</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b0b26485cd1fbd2184cc66c78a33a1b238829444659219e35aa1efdaddfc4aed.jpg" alt="Indiana Civil Defense Volunteer Wrote FBI About Local Flying Saucer Group in 1953 thumbnail" loading="lazy" />
  <p>In January 1953, a Civil Defense volunteer in Franklin, Indiana wrote to FBI Director J. Edgar Hoover asking for clearance information on a local organisation interested in flying saucers, noting that its members also worked in Civil Defense. The letter was bundled with a personal five-year saucer study, an enthusiast newsletter, and a sighting report describing three objects over Franklin in July 1952.</p>
  <div class="narr">On 10 January 1953, a Civil Defense volunteer in Franklin, Indiana — roughly 20 miles southwest of Indianapolis — sent a letter directly to FBI Director J. Edgar Hoover. The writer wanted to know whether the FBI could provide clearance information on a local group interested in flying saucers, pointing out that some of its members also participated in the Civil Defense Program.

Enclosed with the letter were several pieces of material: excerpts from what the author described as a five-year personal study of saucer phenomena across the United States, a newsletter from the International Flying Saucer Bureau (IFSB) listing state representatives and member theories, and a detailed sighting report. The five-year study author alleged that the US government was denying, suppressing, and releasing saucer reports at intervals. One IFSB member from California theorised that flying saucers originated from the solar system of Alpha Proxima. Representatives also reported strong public interest in saucers in Puerto Rico.

The sighting report described an incident in Franklin, Indiana in July 1952. Three aerial objects were observed: one larger object joined by two smaller red disc-coloured ones. Their colour reportedly did not change in flight, and their speed was estimated at 1,100 miles per hour.

This file is not a single FBI investigation or assessment. It is a bundle of citizen correspondence and enthusiast materials that ended up in the Bureau&#39;s records. There is no FBI analysis or conclusion included in these pages. The document carries moderate signs of redaction, though much of the illegibility appears to stem from poor scan quality rather than deliberate censorship.</div>
