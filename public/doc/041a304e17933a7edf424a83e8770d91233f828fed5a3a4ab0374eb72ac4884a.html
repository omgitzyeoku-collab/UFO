  <h1>Pilot Reports Three Lights in Formation Over Long Island Sound</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/041a304e17933a7edf424a83e8770d91233f828fed5a3a4ab0374eb72ac4884a.jpg" alt="Pilot Reports Three Lights in Formation Over Long Island Sound thumbnail" loading="lazy" />
  <p>An FAA incident report documents a general aviation pilot who observed three lights moving in formation at roughly 20,000 feet over Long Island Sound on 15 November 2023. The case was closed with no follow-up investigation noted and no corroborating reports from other aircraft.</p>
  <div class="narr">This is an FAA SKYWATCH incident report — the system the Federal Aviation Administration uses to log pilot reports of unidentified aerial phenomena. It was filed under case number 237UAP00315 and is now marked as closed.

On 15 November 2023 at 08:46, the pilot of a Piper PA-28 (a single-engine general aviation aircraft, callsign N2166L) was flying at 9,000 feet when they observed what they described as three lights manoeuvring in formation over Long Island Sound. The lights were estimated to be at approximately FL200 — aviation shorthand for roughly 20,000 feet above sea level — placing them well above the reporting aircraft.

The pilot did not take evasive action, and no other aircraft reported seeing the same phenomenon. No law-enforcement notification was made. The report carries a secondary code of NOTIFICATION-LATE, meaning there was a delay between the sighting and the filing of the report.

The FAA marked the case as closed. There is no indication in the document of any follow-up investigation, radar corroboration, or formal resolution explaining what the lights were.</div>
