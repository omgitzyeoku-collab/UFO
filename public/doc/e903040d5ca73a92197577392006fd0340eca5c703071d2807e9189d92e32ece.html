  <h1>United Airlines Crew Reports White-Blue Object Near San Antonio</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/e903040d5ca73a92197577392006fd0340eca5c703071d2807e9189d92e32ece.jpg" alt="United Airlines Crew Reports White-Blue Object Near San Antonio thumbnail" loading="lazy" />
  <p>This is an FAA incident report documenting a sighting by the crew of United Airlines flight 1715 (an Airbus A320) on 13 January 2024. The crew observed a white and blue object at roughly 7,000 feet while flying southeast of San Antonio, Texas. The object did not appear on air traffic control radar, no evasive action was taken, and the case is closed with no further investigation noted.</p>
  <div class="narr">On 13 January 2024 at 20:26, the crew of United Airlines flight UAL1715 — an Airbus A320 flying from San Antonio (SAT) to Denver (DEN) — reported an unidentified aerial phenomenon off the right side of the aircraft. The sighting occurred 16 nautical miles southeast of San Antonio while the aircraft was eastbound at 7,000 feet.

The crew described the object as white and blue in colour, at approximately the same altitude as the aircraft. No evasive action was taken, and the crew reported no impact to flight operations.

The FAA logged the event under its SKYWATCH programme, which tracks unidentified aerial phenomenon reports. Air traffic control checked their radar but did not detect the object. The report was assigned the identifier 237UAP00337 and the mandatory occurrence report ID SAT-M-2024/01/13-0002.

The case status is listed as closed. The document contains no indication of follow-up investigation, no identification of the object, and no additional sensor data beyond the crew&#39;s visual observation. The tail number field for the aircraft is blank.</div>
