  <h1>Southwest Airlines pilot reported flashing lights at 39,000 feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a37a08e0a811c2347f97f6b1351c8594e51062e78f930731829bb820ec6af1c9.jpg" alt="Southwest Airlines pilot reported flashing lights at 39,000 feet in 2023 thumbnail" loading="lazy" />
  <p>An FAA incident report documents a Southwest Airlines Boeing 737 crew observing flashing lights above their aircraft on March 22, 2023, while flying at 39,000 feet. No evasive action was taken, and the FAA closed the case with no indication of further investigation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log pilot observations of unidentified aerial phenomena (UAP). It was filed under case number 237UAP00245.

On March 22, 2023, at 03:25 UTC, the crew of Southwest Airlines flight SWA1913, a Boeing 737 flying northbound from Miami to Baltimore-Washington at flight level 390 (approximately 39,000 feet), reported seeing flashing lights above their aircraft. The crew described the phenomenon as being roughly 100 nautical miles off the left side of the aircraft, near a point 6 nautical miles southeast of a location abbreviated as TYI. Washington Center (ZDC) was the reporting air traffic control facility.

The crew took no evasive action. Internal FAA personnel identified as TY and AWO were advised of the report. The case was marked as closed, with no indication in the document of any follow-up investigation, radar corroboration, or resolution.

The report is sparse. Several fields — including the aircraft tail number — are blank, which limits independent verification. The abbreviations TYI, TY, and AWO are not explained in the document. The incident location field is also empty.</div>
