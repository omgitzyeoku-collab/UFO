  <h1>Pilot Reports Possible Parachute Near Atlanta Airport in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/eb7553b94cc2d41b0a99249d0e907dfd20beb0daba7cdcef8f59931bc67326e2.jpg" alt="Pilot Reports Possible Parachute Near Atlanta Airport in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA Washington Operations Center notification from February 2023 in which a pilot flying a Piaggio P180 aircraft reported seeing a possible parachute about two miles east of Atlanta&#39;s Hartsfield-Jackson airport. The pilot took no evasive action, and local law enforcement was notified.</p>
  <div class="narr">On February 16, 2023, at 10:39 AM Eastern time, the FAA&#39;s Washington Operations Center logged an incident notification involving an unidentified aerial object near Atlanta, Georgia. The report was filed under record number 237UAP00473.

The sighting came from the pilot of a Piaggio P180 aircraft, registered as N189LW, which was flying a route from ATL (Atlanta) to DTS (Destin, Florida). The pilot reported seeing what appeared to be a possible parachute approximately two miles east of Atlanta&#39;s airport — one of the busiest airspaces in the world. The coordinates recorded in the report place the sighting in the Atlanta metro area near Hartsfield-Jackson International Airport.

The pilot did not take evasive action in response to the object. Local law enforcement was notified of the sighting.

This document is a preliminary incident notification, not a full investigation report. It records what the pilot reported but does not include any follow-up findings, radar data, or corroborating observations from other sources. The FAA did not reach a conclusion about what the object was — the pilot&#39;s own description was uncertain, using the word &quot;possible&quot; before &quot;parachute.&quot;</div>
