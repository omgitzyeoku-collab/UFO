  <h1>UPS Cargo Crew Reports Bright Light Over Alaska in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/d3aa4271241e40d8af71ea6c478a4c75d2e1d37edba7293cb439a51217f9e248.jpg" alt="UPS Cargo Crew Reports Bright Light Over Alaska in 2023 thumbnail" loading="lazy" />
  <p>An FAA incident report documents two commercial flight crews spotting a bright white light while flying over remote Alaska in April 2023. The FAA&#39;s own preliminary assessment attributed the sighting to Starlink satellites passing over the area.</p>
  <div class="narr">On April 10, 2023, the crew of UPS flight 49 — a Boeing 767-300 cargo aircraft flying from Seoul, South Korea to Anchorage — reported an unidentified aerial phenomenon to air traffic control. The crew described a bright white light above and to the left of their aircraft while cruising at approximately 35,000 feet, about 148 nautical miles northwest of St. Paul Island, Alaska.

The sighting was not isolated. A second aircraft, Amerijet flight 1020, reported observing something similar in the same area. Anchorage Area Route Traffic Control Centre (ARTCC) was notified. The UPS crew took no evasive action, and no law enforcement was contacted.

The FAA&#39;s Washington Operations Centre logged the event as a preliminary information summary — not a full investigation. In its assessment, the FAA noted the event was &quot;consistent with Starlink satellites traveling over the vicinity of Alaska&quot; (the original report misspells Starlink as &quot;Skylink&quot;). No follow-up investigation is documented in the released record.

The document is a short operational report, not a detailed analysis. It records what the crews saw, where they were, and the FAA&#39;s initial explanation. Nothing in the record was visibly redacted.</div>
