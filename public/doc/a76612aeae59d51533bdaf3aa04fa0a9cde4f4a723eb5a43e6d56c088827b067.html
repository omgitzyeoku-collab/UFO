  <h1>JetBlue Crew and Four Other Flights Report Orbiting Lights Over New England</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a76612aeae59d51533bdaf3aa04fa0a9cde4f4a723eb5a43e6d56c088827b067.jpg" alt="JetBlue Crew and Four Other Flights Report Orbiting Lights Over New England thumbnail" loading="lazy" />
  <p>An FAA incident report documents a JetBlue pilot flying from Boston to Chicago at 36,000 feet who reported multiple orbiting lights resembling aircraft landing lights, positioned 25 degrees above the horizon near the Big Dipper constellation. Four other commercial and private aircraft independently reported the same phenomenon. The FAA closed the case without explanation.</p>
  <div class="narr">On 26 September 2023, the crew of JetBlue flight 811 — a commercial Airbus A220-300 (BCS3) flying westbound from Boston (BOS) to Chicago O&#39;Hare (ORD) at 36,000 feet — reported an unidentified aerial phenomenon directly ahead of the aircraft. The sighting was logged through the FAA&#39;s SKYWATCH incident reporting system.

The crew described multiple lights that appeared to be orbiting one another, similar in appearance to aircraft landing lights. The lights were observed roughly 25 degrees above the horizon, in the direction of the Big Dipper constellation. The observation was made at coordinates 43°12&#39;N, 75°35&#39;W — over upstate New York.

The sighting was not limited to a single aircraft. Four other flights independently corroborated the observation: a Flexjet Gulfstream G650 (LXJ652) at 41,000 feet, a Delta Air Lines A220 (DAL2685) at 36,000 feet, a Copa Airlines Boeing 737-800 (CMP422) at 38,000 feet, and an Emirates Boeing 777-300ER (UAE5WR) at 29,000 feet. The FAA&#39;s Air Watch Operations (AWO) was notified.

The FAA closed the case with no resolution or explanation provided. There is no reference to radar data or any sensor confirmation in the report — all observations were visual, made by commercial and private aircrew at night.

The report shows low evidence of redaction. The incident location field was left blank in the structured data, though coordinates are provided in the narrative text of the report itself.</div>
