  <h1>US Military Drone Spotted Unidentified Object Over Syria in 2022</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">Syria</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b3b3f023d70bcce3178de9fe6a019ea6db5e5145bc7e28a49308442e190ef817.jpg" alt="US Military Drone Spotted Unidentified Object Over Syria in 2022 thumbnail" loading="lazy" />
  <p>A declassified US military mission report documents a brief sighting of an unidentified aerial phenomenon (UAP) during a nearly 21-hour armed reconnaissance flight over Syria on 30–31 July 2022. The object moved from north to south, was visible for less than a minute, and remains unexplained — though heavy redactions throughout the report obscure most details about the sighting itself.</p>
  <div class="narr">On 30 July 2022, a single US Air Force aircraft from the 89th Attack Squadron, operating under the 432nd Air Expeditionary Wing, took off from Muwaffaq Salti Air Base in Jordan for an armed reconnaissance mission over Syria. The mission was part of Operation Inherent Resolve, the US-led campaign against ISIS, and was coordinated through US Central Command (USCENTCOM). The aircraft spent about 18 hours and 44 minutes on station and logged a total mission time of roughly 20 hours and 57 minutes.

During the flight, at 0239Z on 31 July 2022, the crew observed an unidentified aerial phenomenon. The object moved from north to south and was visible for less than one minute. The aircraft was flying at 19,359 feet and 116 knots at the time — speeds and altitude consistent with a remotely piloted drone such as the MQ-9 Reaper, though the aircraft type is redacted. No radio-frequency signatures were detected from the object, and weather was ruled out as a factor. The UAP&#39;s shape, size, colour, and sensor profile are not described in the report — those fields are redacted.

The primary mission was ground surveillance, not UAP hunting. The crew monitored activity including armed pickup trucks, two inactive rocket launchers (TELARs) with three rockets loaded near Deir ez-Zor airfield, a truck carrying a possible artillery system, and another with what appeared to be mounted anti-aircraft artillery. Full-motion video from the mission was processed by Distributed Ground Station 1 (DGS1), and the aircraft collected roughly 17.2 hours of imagery intelligence and 18.7 hours of signals intelligence.

The document was released on 8 October 2025 by Major General Richard A. Harrison, USCENTCOM Chief of Staff. It carries heavy redactions: the aircraft type, callsign, tail number, crew names, most grid coordinates, and the UAP description field are all blacked out. No conclusion is offered about what the object was. The case remains officially unresolved.</div>
