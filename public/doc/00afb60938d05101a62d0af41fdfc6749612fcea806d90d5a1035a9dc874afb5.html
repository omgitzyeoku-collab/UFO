  <h1>U.S. Air Force Crew Reported Unidentified Object Over Iraq in 2022</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">5/20/22</span>
    <span class="badge">Iraq</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/00afb60938d05101a62d0af41fdfc6749612fcea806d90d5a1035a9dc874afb5.jpg" alt="U.S. Air Force Crew Reported Unidentified Object Over Iraq in 2022 thumbnail" loading="lazy" />
  <p>A formerly secret U.S. military mission report from May 2022 documents a single unidentified anomalous phenomenon (UAP) spotted by a reconnaissance aircraft crew over Iraq. The crew tracked the object briefly as it flew north to northeast, but could not identify it, and the report records no information about its altitude, speed, or size.</p>
  <div class="narr">On 20 May 2022, a single U.S. Air Force reconnaissance aircraft from the 196th Attack Squadron, operating under Operation Inherent Resolve and U.S. Central Command (USCENTCOM), flew a nearly 19-hour mission over Iraq. The aircraft took off at 0542Z, reached its station nine minutes later, and collected signals intelligence (SIGINT) using a system called Airhandler Version 2 for roughly 17.5 hours. The mission was rated satisfactory and filled an intelligence gap.

At 2043Z — about 15 hours into the mission — the crew, flying at 18,000 feet, observed a single UAP travelling north to northeast. They followed it for as long as possible. A screener attempted to identify the object but could not get a positive identification. The report lists the UAP&#39;s altitude, velocity, trajectory, size, shape, colour, and markings as either unknown or not recorded. No sensor data such as radar tracks or infrared imagery appears in the document.

The document was originally classified SECRET and shared only with the U.S. and Five Eyes allies, with a scheduled declassification date of 21 May 2047 — 25 years after the mission. It was declassified early on 8 October 2025 by Major General Richard A. Harrison, USCENTCOM Chief of Staff.

Heavy redactions remain throughout the report. The aircraft type, callsign, tail number, crew names, and precise grid coordinates are all blacked out under national security exemptions. What survives is a brief narrative description of the sighting and the structured mission data surrounding it — but almost no physical detail about the object itself.</div>
