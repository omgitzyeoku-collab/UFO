  <h1>Navy aircrew reports unidentified rectangular object over eastern US in 2019</h1>
  <div class="meta">
    <span class="badge">Department of War</span>

    <span class="badge">Eastern United States</span>

  <img class="thumb" src="/extract/thumbs/1bd82107a638e44f4f6011aaf6fb323bcdd36334a59980a5c19a5aad9ff69b52.jpg" alt="Navy aircrew reports unidentified rectangular object over eastern US in 2019 thumbnail" loading="lazy" />
  <p>This is a U.S. Navy Range Fouler Reporting Form — a debrief filed when an aircrew member reports something interfering with a flight range — from the Eastern United States in 2019, released by the Department of War. In it, an observer with 28 years of USAF (U.S. Air Force) and U.S. Navy service describes a small object seen below their aircraft, moving in a straight line opposite their direction at high speed, which they tracked for about 10-15 seconds and recorded on video before it left view. On later analysis the object appeared rectangular, and others with equal or more experience were also unsure what it was.</p>
  <div class="narr">The document is a U.S. Navy Range Fouler Reporting Form, a type of debrief a crew files when an object or activity interferes with military flight operations on a range. This one was filed for an incident in the Eastern United States in 2019 and released by the U.S. Department of War. It is a first-person account by a single aircrew member.

According to the form, the observer — who reports 28 years of flying experience with the U.S. Air Force (USAF) and U.S. Navy — noticed a small object below their aircraft between mission sorties. The object appeared to travel in a straight line, opposite the aircraft&#39;s own direction, at high speed. The observer tracked it for roughly 10-15 seconds and then switched on the recorder to capture video.

The object&#39;s speed carried it out of the observer&#39;s field of view, and they were unable to reacquire it even after zooming out. When the recorded footage was examined after the flight, the object appeared to be rectangular. The account notes that others with equal or more experience were also unsure what the object was.

The form does not offer an identification or a conclusion about what the object was — it records an observation, not a finding. Identifying details for the aircrew and squadron are deliberately removed under the form&#39;s own policy, and the structured fields on the form (such as date, time, altitude, and shape checkboxes) are blank or missing from the extracted text, so few hard data points are captured. The optical character recognition (OCR) used to read the form is garbled in places.

A video is referenced as attached to the report (catalogued separately as DOW-UAP-PR112), but that footage is not part of this text and cannot be verified from the report alone.</div>
