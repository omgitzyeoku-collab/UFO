  <h1>FAA Report: Pilot Saw Blue-White Lights Over Nebraska in 2022</h1>

  <img class="thumb" src="/extract/thumbs/f5487f961eabb58e38f6b992203298b51ae9e2fa6a1207247b9d8122397b6781.jpg" alt="FAA Report: Pilot Saw Blue-White Lights Over Nebraska in 2022 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a pilot&#39;s sighting of unidentified blue and white lights during a commercial flight from San Francisco to New York on 15 October 2022. The case was closed with no explanation or resolution provided.</p>
  <div class="narr">On 15 October 2022 at 09:20 UTC, the crew of a commercial flight travelling from San Francisco (SFO) to New York (JFK) reported an unidentified aerial phenomenon to the Federal Aviation Administration. The aircraft was heading northeast at 37,000 feet, approximately 25 nautical miles south of O&#39;Neill, Nebraska, when the crew observed the object.

The pilot described blue and white lights moving from low on the horizon to high on the horizon, visible off the front of the aircraft. The FAA classified the report under its primary code of &quot;Unidentified Aerial Phenomenon&quot; and logged it as case 237UAP00124. Internal parties identified as AWO/TY were notified.

The case is now marked as closed. Notably, the document provides no resolution, identification, or follow-up explanation for what the lights were. There is no radar data or corroborating witness testimony included in the report.

Several fields in the report appear incomplete. The aircraft tail number is blank, which may reflect redaction or simply incomplete reporting. The roles of the AWO/TY notification recipients are not explained in the document itself.</div>
