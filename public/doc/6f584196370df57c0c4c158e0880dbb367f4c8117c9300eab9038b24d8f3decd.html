  <h1>FAA Report: Pilot Spotted Fast-Moving Unidentified Object at 37,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/6f584196370df57c0c4c158e0880dbb367f4c8117c9300eab9038b24d8f3decd.jpg" alt="FAA Report: Pilot Spotted Fast-Moving Unidentified Object at 37,000 Feet thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a pilot&#39;s observation of a fast-moving unidentified flying object at flight level 370 (approximately 37,000 feet), roughly 500 feet above the aircraft, travelling in the opposite direction. The report was filed through Jacksonville Air Route Traffic Control Centre and is now closed, with no description of the object provided beyond its speed, altitude, and direction.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report, reference 237UAP00026, filed under the primary code OTHER — meaning it did not fit any of the FAA&#39;s standard incident categories. It was reported through ZJX, the Jacksonville Air Route Traffic Control Centre, and its status is closed.

The report concerns the pilot-in-command of flight UAL1049, a Beech King Air (BE9L) travelling from Newark (EWR) to Cancún (MMUN). While approximately 30 miles south of Florence (FLO), the pilot observed a fast-moving unidentified flying object at flight level 370 — roughly 37,000 feet — about 500 feet above the aircraft and travelling in the opposite direction.

The pilot provided no physical description of the object beyond its speed, altitude, and direction of travel. The report contains no mention of corroborating radar data or additional witnesses.

The FAA closed the report without any stated conclusion about what the object was. The document is a historical record — the underlying incident predates the war.gov PURSUE release and was surfaced retrospectively as part of that programme&#39;s public disclosure.</div>
