  <h1>Southwest Airlines Pilot Reported Flashing Lights Above Thunderstorm in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/cc04c25d380b7a8bf12415c34a71a381dfe08394ac9b80fcca255ac15c4943c0.jpg" alt="Southwest Airlines Pilot Reported Flashing Lights Above Thunderstorm in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Southwest Airlines pilot observing three flashing lights moving above a thunderstorm while flying at 37,000 feet near Savannah, Georgia on April 15, 2023. No evasive action was needed, the UFO Reporting Center was notified, and the case was closed with no indication of further investigation.</p>
  <div class="narr">On April 15, 2023, the crew of a Southwest Airlines Boeing 737 MAX 8 — flying under callsign SWG615 — reported an unidentified aerial phenomenon to the FAA. The aircraft was cruising at flight level 370 (37,000 feet) on a commercial route when the crew spotted something unusual ahead.

What they described were three lights, flashing on and off, moving above a thunderstorm approximately 10 to 15 nautical miles in front of the aircraft and roughly 40 nautical miles east of Savannah. The lights appeared to be above the aircraft&#39;s own altitude of 37,000 feet. The crew did not need to take evasive action.

The FAA logged the sighting through its SKYWATCH incident reporting system. The UFO Reporting Center was notified, and an Air Watch Officer (AWO) was advised. The report&#39;s status is listed as closed, with no indication that any follow-up investigation was conducted or that radar or sensor data corroborated the observation.

The document is a short administrative form rather than a detailed investigative file. It records the basic facts of the sighting — time, location, altitude, and description — but does not offer any explanation or analysis of what the lights may have been.</div>
