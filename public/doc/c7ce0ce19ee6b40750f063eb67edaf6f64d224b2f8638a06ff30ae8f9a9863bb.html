  <h1>Military Pilot Spotted Cone-Shaped Object Near Eglin AFB; Assessed as Balloon</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c7ce0ce19ee6b40750f063eb67edaf6f64d224b2f8638a06ff30ae8f9a9863bb.jpg" alt="Military Pilot Spotted Cone-Shaped Object Near Eglin AFB; Assessed as Balloon thumbnail" loading="lazy" />
  <p>This is an AARO case resolution report for a January 2023 UAP sighting near Eglin Air Force Base, Florida, where a military pilot detected four objects on radar and visually observed one — a gray, cone-shaped object about 12 feet across at 16,000 feet. AARO concluded with moderate confidence that it was very likely a commercial lighting balloon, a finding independently supported by two partner organizations.</p>
  <div class="narr">On 26 January 2023, a military pilot operating in the Eglin Air Force Base training range off the coast of Florida detected four objects on radar between 16,000 and 18,000 feet, appearing to fly in formation. The pilot was able to visually observe and photograph only one of the four. The object was described as roughly 12 feet in diameter, gray with a paneled surface and orange-red coloring at its center, with a rounded bottom and a cone-shaped top the pilot compared to an Apollo spacecraft. It was either very slow or stationary. The pilot also perceived what they described as &quot;blurry air&quot; — a possible heat signature — emanating from the bottom.

The encounter had an unusual complication: when the aircraft closed to within 4,000 feet of the object, its onboard radar malfunctioned due to a tripped circuit breaker and remained disabled for the rest of the exercise. However, AARO (the All-domain Anomaly Resolution Office) determined this was likely coincidental, noting that the same circuit breaker on that particular aircraft had tripped three times in the prior months. No video was captured because the aircraft&#39;s recording equipment was inoperable before and during the flight, leaving only two still images as visual evidence.

AAR resolved the case on 14 October 2023, assessing with moderate confidence that the object was very likely a lighter-than-air object such as a large commercial lighting balloon. The object&#39;s direction and slow speed matched wind conditions at that altitude. AARO conducted laboratory testing with a commercial lighting balloon and found it could replicate some aspects of the pilot&#39;s account. The orange-red coloring was potentially explained by sun glint or red-colored tether points on the balloon. Both an Intelligence Community component and a science and technology partner independently reached high-confidence assessments that the object was not anomalous and was very likely a balloon.

The document was released in full on 2 June 2025 with low evidence of redaction.</div>
