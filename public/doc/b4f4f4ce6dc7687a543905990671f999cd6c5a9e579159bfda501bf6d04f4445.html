  <p>The United States Central Command submitted a report of an unidentified anomalous phenomenon (UAP) to the All-domain Anomaly Resolution Office (AARO) consisting of 24 seconds of video footage from an infrared sensor aboard a U.S. military platform in 2023. An accompanying mission report, DoW-UAP-D35, described the UAP as small and circular, flying near the surface of the ocean toward land.

Video Description:
00:02: The sensor narrows its field-of-view to zoom in on an area of contrast near the center of the screen.
00:03-00:19: The sensor tracks the area of contrast as it moves against the ocean background.
00:20: As the background scene transitions from being predominantly water to land, the area of contrast becomes indistinguishable.

This video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.</p>
