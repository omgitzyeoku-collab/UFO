  <h1>U.S. Military Drone Crew Reported Unidentified Object Over Greece in 2023</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">Greece</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b4f4f4ce6dc7687a543905990671f999cd6c5a9e579159bfda501bf6d04f4445.jpg" alt="U.S. Military Drone Crew Reported Unidentified Object Over Greece in 2023 thumbnail" loading="lazy" />
  <p>A declassified U.S. military mission report documents a brief sighting of a small, circular unidentified object flying low over the ocean near Greece on 29 October 2023. The crew assessed it as benign and not under intelligent control, but its propulsion and advanced capabilities remain listed as unknown.</p>
  <div class="narr">In October 2023, a single U.S. Air Force aircraft from the 33rd Special Operations Squadron flew a 20-hour intelligence, surveillance, and reconnaissance (ISR) mission out of Larissa Air Base in Greece. The aircraft operated under Air Force Special Operations Command and U.S. Central Command, carrying Hellfire missiles and an AN/DAS-4 targeting pod — equipment strongly associated with MQ-9 Reaper drones, though the aircraft type is formally redacted.

At 08:11 Zulu time on 29 October, while conducting target development work unrelated to UAP hunting, the crew spotted an unidentified object flying just above the ocean surface, heading toward land. They described it as seemingly circular, solid, and too small to make out details, moving at an estimated 30 miles per hour. The associated video footage is only 24 seconds long. The object was lost from the sensor feed shortly after, apparently becoming indistinguishable against the land background.

The crew assessed the object as benign and not under intelligent control. It produced no detectable signatures, showed no unusual manoeuvres, and had no effect on the aircraft&#39;s equipment or personnel. However, the report lists its propulsion method and whether it possessed advanced capabilities as &quot;unknown&quot; — meaning the crew could not explain what was keeping it aloft or rule out unusual technology.

The document was originally classified until 2048 but was released early on 22 January 2026 and approved for release to AARO (the All-domain Anomaly Resolution Office). Heavy redactions remain throughout: the aircraft type, crew names, precise coordinates, operation name, and other operational details are all withheld under national security exemptions.

The report was a single-source observation — no other witnesses or sensors corroborated what the crew saw. All speed and altitude figures were estimated rather than measured. The case remains officially unresolved.</div>
