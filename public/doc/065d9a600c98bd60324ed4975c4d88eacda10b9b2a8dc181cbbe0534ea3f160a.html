  <h1>Commercial Pilot Reports Blinking Lights at 35,000 Feet Over Ohio</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/065d9a600c98bd60324ed4975c4d88eacda10b9b2a8dc181cbbe0534ea3f160a.jpg" alt="Commercial Pilot Reports Blinking Lights at 35,000 Feet Over Ohio thumbnail" loading="lazy" />
  <p>An FAA incident report documents a Frontier Airlines pilot sighting white blinking lights of varying intensity directly ahead of the aircraft at 35,000 feet on 18 February 2023. The report was classified as an Unidentified Aerial Phenomenon and closed without explanation.</p>
  <div class="narr">This is an FAA SKYWATCH incident report filed under case number 237UAP00222. It records a sighting by the crew of a commercial Frontier Airlines Airbus A321, flying under callsign FFT2300 on a route from Dallas/Fort Worth (DFW) to Philadelphia (PHL). The incident occurred on 18 February 2023 at 09:00.

While flying eastbound at flight level 350 (approximately 35,000 feet), the crew reported an unidentified aerial phenomenon directly ahead of the aircraft — at the 12 o&#39;clock position. The object or lights were described as white blinking lights with varying intensities, located at roughly the same altitude as the aircraft, approximately 85 nautical miles southwest of HVQ (a navigational waypoint in Ohio).

The FAA classified the report under its primary code for Unidentified Aerial Phenomenon. The case status is marked as Closed, but notably, no resolution or explanation for the sighting is provided in the document. No corroborating radar data or sensor records are included.

The report identifies the operator type as commercial. No tail number for the aircraft is recorded, which limits the ability to independently verify which specific aircraft was involved. There is minimal redaction in the document itself, but the absence of follow-up analysis or conclusions is itself significant.</div>
