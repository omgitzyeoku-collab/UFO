  <h1>FAA Reports Silver Object Hovering Near New York Air Force Base</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/baeeda4ce750d15e15bc8b6990ad5ff7fcd9965a5e7000db01efd53cdfca216b.jpg" alt="FAA Reports Silver Object Hovering Near New York Air Force Base thumbnail" loading="lazy" />
  <p>This FAA incident report documents a silver, roughly 50-foot-long object that hovered at 2,000 feet southwest of Stewart Air Force Base in New York on 3 June 2024. It remained stationary for 50 minutes before disappearing into clouds, with no impact on air operations reported.</p>
  <div class="narr">This document is a preliminary incident report from the FAA (Federal Aviation Administration) Washington Operations Center, filed under record number 237UAP00630. It describes an unidentified aerial phenomenon observed near Stewart Field (SWF), a joint civil-military airport in New York state.

On 3 June 2024 at approximately 2:00 PM Eastern time, Stewart facility staff reported a suspicious object floating southwest of the airfield at an altitude of 2,000 feet. The object was described as silver in colour and approximately 50 feet in length. It remained stationary in the sky for 50 minutes before it disappeared into the clouds.

The FAA noted no impact to air operations as a result of the sighting. The report provides geographic coordinates (approximately 41.50°N, 74.10°W) placing the observation in the Hudson Valley region of New York.

The document is labelled as preliminary information, meaning a final assessment may exist but is not included in this release. No explanation or identification of the object is offered anywhere in the report. There is no mention of radar data, photographs, or additional witness accounts beyond the initial facility report.</div>
