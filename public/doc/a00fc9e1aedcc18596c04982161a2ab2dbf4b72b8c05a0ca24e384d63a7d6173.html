  <h1>AARO Legal Script Tells Interviewees Their NDAs Are Temporarily Lifted</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>This document is a standardized legal advisement script that AARO reads aloud to individuals before conducting voluntary oral history interviews inside a secure facility. It confirms that nondisclosure agreements are temporarily suspended during these interviews and that transcripts may be shared with Congress, but it contains no UAP sighting details or witness testimony.</p>
  <div class="narr">This record, titled &quot;24 F 1138,&quot; is not a UAP sighting report. It is a scripted legal advisement — essentially a read-aloud form — used by the All-domain Anomaly Resolution Office (AARO), operating under the Office of the Under Secretary of Defense for Intelligence and Security (OUSD I&amp;S). The script is read to individuals before they sit down for a voluntary oral history interview inside a SCIF (Sensitive Compartmented Information Facility), a type of secure room used to discuss classified material.

The key procedural detail is the handling of nondisclosure agreements. The script tells interviewees that any NDAs they have previously signed are temporarily suspended for the duration of the interview, meaning they can speak freely about otherwise restricted topics. However, the moment the interview ends, all nondisclosure obligations snap back into full force. The document also warns that making a knowingly false statement during the interview is a federal crime under 18 U.S.C. 1001, punishable by fine, imprisonment, or both, and that withholding or misrepresenting information may affect the person&#39;s security clearance or employment.

All transcripts and materials produced from these interviews belong to the U.S. Government and are stored under a Privacy Act system of records (DoD-0014, published September 1, 2022). Notably, the script states that notes, transcripts, and derived information may be shared with Congress.

The interviewer&#39;s name and the date of the advisement are redacted, so it is not possible to determine when this specific interview took place or who conducted it. The legal text itself, however, is fully intact. Because this is a procedural template rather than an incident report, it offers no information about any particular UAP event — but it does confirm the formal process AARO uses to collect testimony from individuals who may hold relevant knowledge.</div>
