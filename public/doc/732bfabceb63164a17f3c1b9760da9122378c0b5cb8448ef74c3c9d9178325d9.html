  <h1>Mercury Astronaut Reported White Particles Outside Capsule in 1962</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">5/24/62</span>
    <span class="badge">Low Earth Orbit</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/732bfabceb63164a17f3c1b9760da9122378c0b5cb8448ef74c3c9d9178325d9.jpg" alt="Mercury Astronaut Reported White Particles Outside Capsule in 1962 thumbnail" loading="lazy" />
  <p>This is an auto-transcribed audio recording from NASA&#39;s Mercury-Atlas 7 mission on 24 May 1962, in which the pilot described white particles resembling snowflakes moving in random patterns outside the spacecraft in low Earth orbit. The particles were later widely attributed to ice crystals from the spacecraft&#39;s own systems, though this document alone contains no sensor data or formal conclusion.</p>
  <div class="narr">This document is an audio transcript from NASA&#39;s Mercury-Atlas 7 mission, flown aboard the Aurora 7 capsule on 24 May 1962. The recording captures the pilot&#39;s real-time communications as the spacecraft orbited Earth.

During the flight, the pilot reported seeing white particles below the capsule. He described them as looking &quot;exactly like snowflakes,&quot; moving in random patterns, and generally travelling at roughly the same speed as the spacecraft. On at least one occasion, a particle appeared to drift away and move faster than the capsule itself. The pilot noted he had not seen large numbers of these particles but observed them on multiple occasions during the recorded communications.

The transcript is fragmentary — it captures only portions of a longer exchange, and because it was auto-transcribed from audio, some phrases are garbled (one passage reads as though ground control said something &quot;smells like snowflakes,&quot; which is almost certainly a transcription error). Ground control appeared to acknowledge the pilot&#39;s description, but the exact wording is unclear due to transcription quality.

NASA does not reach a conclusion about the particles within this document. No sensor data, photographs, or follow-up analysis is included in the transcript itself. Outside this document, the &quot;snowflake&quot; particles observed during Mercury-Atlas 7 were later widely attributed to ice crystals from the spacecraft&#39;s cooling system or condensation venting — a mundane explanation, though one not established by this recording alone.</div>
