  <h1>Airline Crew Reports Bright Light at 60,000 Feet Over Ohio</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f8ce32388513802e14de0199dbf4636eda5371d52f17b0004a7d0c320040e610.jpg" alt="Airline Crew Reports Bright Light at 60,000 Feet Over Ohio thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a pilot-reported unidentified aerial phenomenon (UAP) observed on 3 October 2024 by the crew of commercial flight JIA5656, a CRJ7 aircraft flying from Washington DCA to Milwaukee. The crew described a bright white light orbiting at approximately 60,000 feet over the Canton-Akron area before it disappeared, and air traffic control radar did not detect the object.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAPs). It was filed under case number 237UAP00381 and assigned the internal reference ZOB-M-2024/10/02-0004.

On 3 October 2024 at 01:40, the crew of commercial flight JIA5656, operating a CRJ7 regional jet on a route from Washington Reagan National Airport (DCA) to Milwaukee (MKE), reported seeing something unusual. The aircraft was heading northwest at flight level 380 — roughly 38,000 feet. The crew described a bright white light that appeared to be orbiting at approximately flight level 600, or about 60,000 feet, over the Canton-Akron (CAK) airport area in Ohio. The light then disappeared.

Air traffic control checked their radar systems and found no corresponding object. The UAP was not detected on any ATC facility radar.

The FAA marked the case status as &quot;Closed.&quot; The report provides no explanation or resolution for the sighting — it simply records what the crew reported and the absence of radar confirmation. No tail number was recorded for the reporting aircraft, and the report names no individual witnesses.</div>
