  <h1>Multiple Commercial Flights Reported Flashing Lights Near Dayton in 2023</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/8f999730585a2dc9836f1591283782869dac5ec735e678277f0cbb7846d36c72.jpg" alt="Multiple Commercial Flights Reported Flashing Lights Near Dayton in 2023 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a sighting on 4 August 2023 in which multiple commercial aircraft reported bright white flashing lights travelling north to south at an unknown altitude, near the DBN waypoint at around 40,000 feet. The case was closed with no identification or explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00282, with the primary code &quot;Unidentified Aerial Phenomenon.&quot; It records an event on 4 August 2023 involving a commercial aircraft operating under callsign AAY1432, which was flying at 40,000 feet near the DBN navigational waypoint (likely near Dayton, Ohio).

The crew reported bright white flashing lights travelling from north to south at an unknown altitude. They were not the only ones — the report notes that multiple aircraft independently reported the same phenomenon. The named locations in the file include references to Denver (DEN), Fort Lauderdale (FLL), Knoxville (TYS), and Atlanta Centre (ZTL), suggesting the sighting may have occurred along a busy air corridor.

In response, Air Traffic Safety Control (ATSC) provided an OMIC satellite tracking map resource, though the results of that satellite check are not included in this document. No resolution or identification of the lights is recorded anywhere in the file.

The case is marked as Closed. No further investigation, explanation, or follow-up is documented. The aircraft tail number field is blank, and no sensor data, photographs, or radar corroboration accompany the report.</div>
