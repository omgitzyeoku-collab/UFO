  <h1>Military Report Documents Unidentified Object Over Arabian Gulf in 2020</h1>

  <p>A classified Department of War mission report records a brief sighting of a possible unidentified aerial phenomenon (UAP) in the Arabian Gulf region in 2020. The object was estimated at 321 knots, changed direction eastward, and the observation was too short to determine its altitude. The document is heavily redacted.</p>
  <div class="narr">This document is a military mission report (MISREP) produced by the Department of War, classified SECRET and releasable to the US and Five Eyes alliance partners. It records a possible UAP sighting in the Arabian Gulf region in 2020.

At 1258Z (12:58 PM UTC), a military operator observed a possible UAP near grid reference 34SDG9041417044, a location in the Arabian Gulf area. The object&#39;s velocity was estimated at 321 knots, roughly 369 miles per hour. The sighting was brief — too short for the observer to estimate the object&#39;s altitude. During the observation, the UAP increased its speed and changed direction toward the east.

The report is based on a single operator&#39;s account. The document itself notes that all descriptions reflect the reporter&#39;s subjective interpretation at the time. The 321-knot velocity figure is an estimate, not a measurement confirmed by instruments.

The document is heavily redacted. Multiple sections are fully withheld under classification exemptions 1.4(a) and (b)(6), which cover military operational details and personal identities. The observer&#39;s name and other operational context are blacked out. The report does not include any conclusion about what the object was.

No follow-up investigation, identification, or official explanation is provided in this document. It records what one person saw, briefly, and leaves it at that.</div>
