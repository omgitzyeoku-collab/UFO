  <h1>Pilot Reports Jetpack Sighting Near Palm Springs During Landing Approach</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/d9f280563087e72d6c3e406ce1f486cc1f2138f2fdf038e3d0e95a078986c4f0.jpg" alt="Pilot Reports Jetpack Sighting Near Palm Springs During Landing Approach thumbnail" loading="lazy" />
  <p>This FAA incident notification documents a pilot&#39;s report of a manned jetpack flying at 3,700 feet near Palm Springs, California on May 16, 2024. The sighting was filed under the FAA&#39;s UFO-UAP activity category, though the pilot identified the object specifically as a jetpack rather than leaving it unidentified.</p>
  <div class="narr">This document is a preliminary incident notification from the FAA&#39;s Washington Operations Center, the agency&#39;s round-the-clock hub for tracking aviation safety events across the United States. It records a UAP (unidentified anomalous phenomena) sighting reported by a pilot near Palm Springs, California.

On May 16, 2024, the pilot of a Cirrus SR20 — a single-engine general aviation aircraft, registration N927PA — was on a 7-mile final approach to Palm Springs airport. During the approach, the pilot reported seeing a manned jetpack pass from left to right, travelling northbound at 3,700 feet. The pilot took no evasive action, and the Palm Springs Air Traffic Control Tower was advised of the sighting.

No law enforcement notification was reported in connection with the event. The document is marked as preliminary information, meaning it captures the initial report rather than any completed investigation or final determination about what the object was.

Notably, the pilot described the object as a &quot;manned jetpack&quot; rather than something unknown, yet the FAA still categorised the event under its UFO-UAP activity tracking. The record contains no mention of corroborating evidence such as radar data or additional witness accounts. There is minimal redaction in the document.</div>
