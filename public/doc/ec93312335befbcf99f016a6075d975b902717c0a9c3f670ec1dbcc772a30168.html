  <h1>Frontier Airlines Crew Reports Unexplained Lights Over Puerto Rico</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/ec93312335befbcf99f016a6075d975b902717c0a9c3f670ec1dbcc772a30168.jpg" alt="Frontier Airlines Crew Reports Unexplained Lights Over Puerto Rico thumbnail" loading="lazy" />
  <p>An FAA incident report documents the crew of Frontier Airlines Flight 4139 observing 2–5 unidentified lights moving in unusual patterns while flying at 35,000 feet near San Juan, Puerto Rico, on the night of 18 November 2023. No evasive action was taken and no impact to air traffic control was reported.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed on 18 November 2023 at 10:18 PM local time. It records a UAP (unidentified aerial phenomenon) sighting reported by the flight crew of Frontier Airlines Flight 4139, an Airbus A320neo travelling from San Juan, Puerto Rico to Cleveland, Ohio.

While heading northeast at flight level 350 (35,000 feet), the crew observed 2–5 lights on the left side of the aircraft. The lights were above the horizon and moved up and down, then left to right. The pilot in command was unable to determine either the distance or the altitude of the lights. The crew reported the sighting to Miami ARTCC (Air Route Traffic Control Center).

No evasive action was taken, and the report states there was no impact to air traffic control operations. The coordinates recorded in the report (18.467°N, 66.118°W) place the observation near San Juan, consistent with a sighting shortly after departure.

The FAA report does not offer any explanation for what the lights were. It records the crew&#39;s observations and notes the lack of operational impact, but draws no conclusions about the nature of the phenomenon.</div>
