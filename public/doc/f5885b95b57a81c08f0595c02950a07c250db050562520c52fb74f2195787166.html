  <h1>U.S. Navy Crew Tracked Fast Low-Flying Object Off Syria in 2016</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">11/18/16</span>
    <span class="badge">Syria</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f5885b95b57a81c08f0595c02950a07c250db050562520c52fb74f2195787166.jpg" alt="U.S. Navy Crew Tracked Fast Low-Flying Object Off Syria in 2016 thumbnail" loading="lazy" />
  <p>A 2016 Department of War mission report describes a U.S. Navy P-8A patrol aircraft crew spotting an unidentified object flying low and fast — roughly 500 knots — over the Eastern Mediterranean near Latakia, Syria. The crew tracked it for about two minutes before losing sight, and the military&#39;s own assessment concluded it was likely routine Russian naval activity, not something unexplained.</p>
  <div class="narr">On 18 November 2016, a U.S. Navy P-8A maritime patrol aircraft was operating in the Eastern Mediterranean when its electro-optical/infrared sensor picked up an unidentified object flying at very low altitude — what aviators call &quot;sea skim mode&quot; — at roughly 500 knots on a southeasterly heading. The aircraft was about 26 nautical miles south of the object when it was detected. The crew tracked the object for approximately two minutes before losing visual contact about 40 nautical miles northwest of Latakia, Syria.

During the brief observation, the object was seen passing between the Russian ship INGUL ARS and one unidentified vessel. The crew initially described what they saw as a &quot;possible missile launch,&quot; and the report notes this was the first time a P-8 crew had observed possible missile activity in the Eastern Mediterranean. The mission commander characterized the encounter as safe, and visibility conditions were clear with no range limitations.

The military&#39;s own chain-of-command assessment concluded the activity was &quot;standard activity consistent with&quot; the Russian carrier task group (referred to as the KCTG) operating in the area at the time. In other words, the people responsible for evaluating the event leaned toward a conventional explanation — likely a Russian naval exercise — rather than treating it as truly anomalous.

The document was declassified by MG Richard A. Hamson, USCENTCOM Chief of Staff, and was approved for release to AARO (the Pentagon&#39;s UAP investigation office) on 27 March 2026 — nearly a decade after the original event. Video footage was recorded but the link to it is redacted, along with location coordinates and portions of the timeline. The label &quot;UAP&quot; appears in the document&#39;s title, but the body text consistently uses the phrase &quot;possible missile,&quot; suggesting the UAP classification may have been applied later during the AARO review process rather than at the time of the event.</div>
