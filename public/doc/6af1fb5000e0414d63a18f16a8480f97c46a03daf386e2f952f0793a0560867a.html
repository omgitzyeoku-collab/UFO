  <h1>Cargo Pilot Reports Star-Shaped Object Changing Altitude at 33,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/6af1fb5000e0414d63a18f16a8480f97c46a03daf386e2f952f0793a0560867a.jpg" alt="Cargo Pilot Reports Star-Shaped Object Changing Altitude at 33,000 Feet thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a commercial cargo pilot observing an unidentified aerial phenomenon with star-shaped lighting near PMM VOR on 6 August 2021. The object rapidly changed altitudes before hovering, and Chicago Center reported the sighting to the UFO reporting hotline.</p>
  <div class="narr">This is an FAA SKYWATCH incident report (case 237UAP00062) documenting a pilot&#39;s observation of an unidentified aerial phenomenon. The report is brief — a single-page filing that records the basics of what was seen and by whom.

On 6 August 2021 at 03:52 UTC, a commercial Boeing 747-400 operated by ABD (callsign ABD765) was flying east-northeast at flight level 330 (approximately 33,000 feet) in the vicinity of PMM VOR. The aircraft was en route from Rockford, Illinois (RFD) to Frankfurt, Germany (EDDF). The flight crew reported an unidentified phenomenon directly ahead of the aircraft — at the 12 o&#39;clock position.

The crew described the object as having star-shaped lighting. It rapidly changed altitudes and then hovered. The crew took no evasive action. Chicago Center (ZAU) reported the sighting to the UFO reporting hotline. An individual identified only by the initials &#39;JH&#39; was notified.

The case is marked as closed. The report contains no explanation of what the object was, no radar corroboration, and no further investigative findings. The metadata lists a 2023 date, which likely refers to when the document was processed or released rather than when the incident occurred.</div>
