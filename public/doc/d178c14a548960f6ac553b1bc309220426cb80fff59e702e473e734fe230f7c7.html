  <h1>Learjet Pilot Reports Silver Object Near Nantucket at 18,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/d178c14a548960f6ac553b1bc309220426cb80fff59e702e473e734fe230f7c7.jpg" alt="Learjet Pilot Reports Silver Object Near Nantucket at 18,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report from October 2023 documents a Learjet pilot spotting a small silver object while descending toward Nantucket, Massachusetts at 18,000 feet. The pilot took no evasive action, Boston air traffic control was notified, and no further investigation or conclusion is recorded in this document.</p>
  <div class="narr">On 19 October 2023, the FAA&#39;s Washington Operations Center logged an incident report under reference 237UAP00563. The pilot of a Learjet 45 (registration N823HL), flying from Philadelphia to Nantucket, reported seeing what they described as a silver, softball-sized unidentified anomalous phenomenon (UAP) passing the right side of their aircraft at flight level 180 — roughly 18,000 feet.

The sighting occurred in the Nantucket, Massachusetts area as the aircraft was on its final approach. Boston Air Route Traffic Control Center (ARTCC) was advised of the report. The pilot did not take any evasive action, and law enforcement notification was recorded as &quot;not reported.&quot;

The document is marked as preliminary information from FAA operations and does not contain any conclusion about what the object was. There is no mention of radar data, additional witnesses, or follow-up investigation. The report ends with the reference &quot;WOC 7-3333 JF/TB,&quot; likely identifying the FAA operations staff who processed it.

The document shows minimal redaction. It is a short operational log entry rather than a detailed investigation file, which is typical of how the FAA initially records pilot UAP reports before any further review.</div>
