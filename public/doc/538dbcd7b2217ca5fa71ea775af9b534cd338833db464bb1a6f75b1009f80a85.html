  <h1>Frontier Airlines crew reported unidentified object off Florida coast in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/538dbcd7b2217ca5fa71ea775af9b534cd338833db464bb1a6f75b1009f80a85.jpg" alt="Frontier Airlines crew reported unidentified object off Florida coast in 2023 thumbnail" loading="lazy" />
  <p>This FAA operations center notification records that the crew of Frontier Airlines Flight 31, an Airbus A320neo flying from Santo Domingo to Atlanta, reported seeing an unidentified aerial phenomenon on November 23, 2023, while cruising at 37,000 feet about 70 nautical miles east of Melbourne, Florida. No evasive action was taken, no description of the object is provided, and no follow-up investigation is referenced in the document.</p>
  <div class="narr">On the evening of November 23, 2023, at approximately 7:12 PM Eastern time, the crew of Frontier Airlines Flight 31 spotted something they could not identify. The Airbus A320neo was flying northwest at 37,000 feet, roughly 70 nautical miles east of Melbourne, Florida, on a scheduled route from Santo Domingo, Dominican Republic, to Atlanta. The crew observed the phenomenon from the left side of the aircraft.

Miami Air Route Traffic Control Center (ARTCC) relayed the report to the FAA&#39;s Washington Operations Center, which logged this notification at 7:51 PM EST. The crew did not take evasive action, and no law enforcement was notified.

The document itself is brief — a standard FAA operations center incident form. It records the flight details, approximate coordinates (28.1°N, 79.5°W), and the fact that something was reported. Notably, it contains no description of what the crew actually saw: no size, shape, speed, colour, or behaviour of the object is mentioned anywhere in the record.

This is a preliminary notification, not an investigation report. The FAA logged the event but the document does not indicate whether any further inquiry was conducted, nor does it reference radar data, other witness accounts, or sensor recordings that might corroborate the sighting.</div>
