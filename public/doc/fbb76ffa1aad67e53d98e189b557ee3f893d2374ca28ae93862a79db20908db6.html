  <h1>FBI File Documents 1947 Flying Saucer Photograph Over Oak Ridge, Tennessee</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/fbb76ffa1aad67e53d98e189b557ee3f893d2374ca28ae93862a79db20908db6.jpg" alt="FBI File Documents 1947 Flying Saucer Photograph Over Oak Ridge, Tennessee thumbnail" loading="lazy" />
  <p>This FBI Knoxville field office file from July 1947 contains a cover sheet, two photographs, and a newspaper clipping about a resident named R. Presley who inadvertently photographed a reported &#39;flying saucer&#39; over Oak Ridge, Tennessee. Most of the document is heavily degraded or redacted, and no investigative conclusions are visible in the legible portions.</p>
  <div class="narr">This document is an FBI investigative file originating from the Knoxville field office, catalogued as file number 65-11 and linked to headquarters file 62-HQ-83894. It was classified under &#39;Internal Security - X,&#39; a designation that reflected the national security sensitivity of Oak Ridge, Tennessee — home to key nuclear facilities during and after World War II.

The file centres on a July 1947 incident in which a man identified as R. Presley, residing at 218 Illinois Avenue in Oak Ridge, reportedly photographed an unidentified aerial object. According to a newspaper clipping from the Knoxville News-Sentinel included in the file, Presley had been photographing his family and house when he noticed he had one frame of film remaining. He turned and snapped a picture of the nearby mountain, and the developed photograph appeared to show what was described as a &#39;flying saucer.&#39; The clipping noted this was said to be the first time such an object had been photographed over Oak Ridge, and that the picture had generated significant local discussion.

The FBI Knoxville office forwarded two photographs of the reported &#39;flying saucers&#39; and a photostatic copy of the newspaper clipping to FBI headquarters in Washington. Beyond this transmittal, no investigative findings, analysis, or conclusions are visible in the legible portions of the document.

The majority of this file is effectively unreadable. Multiple pages are blank, heavily degraded, or consist of garbled text from poor-quality scanning. Heavy redactions are also present. As a result, any FBI assessment of the incident — if one existed — cannot be determined from this document alone.</div>
