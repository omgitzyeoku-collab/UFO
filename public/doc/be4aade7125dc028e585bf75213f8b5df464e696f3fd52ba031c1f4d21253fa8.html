  <h1>Airline Crew Reports Star-Like Objects Above 39,000 Feet Over Possible Arkansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/be4aade7125dc028e585bf75213f8b5df464e696f3fd52ba031c1f4d21253fa8.jpg" alt="Airline Crew Reports Star-Like Objects Above 39,000 Feet Over Possible Arkansas thumbnail" loading="lazy" />
  <p>This FAA incident report documents a January 2023 sighting by the crew of American Airlines flight AAL2547, who observed 2–3 sets of unidentified objects resembling stars turning on and off while cruising at 37,000 feet. Multiple aircraft on other frequencies also reported the incident, but the case was closed without explanation or identification.</p>
  <div class="narr">On January 29, 2023, the crew of American Airlines flight AAL2547 — an Airbus A321 flying from Phoenix to Charlotte at 37,000 feet — reported observing 2–3 sets of unidentified aerial phenomena. The objects were described as looking like stars turning on and off roughly every minute, moving both right to left and left to right.

The objects were at an unknown altitude but were above another aircraft, Spirit Airlines flight NKS2252, which was cruising at 39,000 feet. The crew estimated the objects were possibly over Arkansas, but said the distance was too great to confirm the location. Multiple aircraft on other radio frequencies could be heard reporting the same incident.

The report was logged under FAA SKYWATCH, the agency&#39;s system for tracking unidentified aerial phenomenon sightings, with the identifier ZME-M-2023/01/29-0003. Aviation Weather Operations (AWO) was notified.

The FAA marked the case as Closed. No identification or explanation for the objects is provided anywhere in the document. There is no indication that further investigation was conducted or that the corroborating reports from other aircraft were collected.</div>
