  <h1>FBI File Documents Discredited 1952 UFO Sighting Near Baltimore</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/387c0057dc0d8f14d4ccd7b628cad4522ce4bdf73982fb7cc6266053e6792a24.jpg" alt="FBI File Documents Discredited 1952 UFO Sighting Near Baltimore thumbnail" loading="lazy" />
  <p>This FBI file contains an Air Force investigation into a 1952 claim by Donald Stewart that a glowing disk hovered over his car south of Baltimore, killing his engine and cracking his paint. Investigators found no corroboration: Stewart&#39;s only supposed witness admitted he saw nothing, multiple acquaintances called Stewart an exaggerator, and the car had been recently repainted. The file also includes brief reports of separate sightings at the Savannah River Plant and in Ashland, Kentucky.</p>
  <div class="narr">In late March 1952, a Baltimore man named Donald Franklin Stewart told investigators that while driving his 1949 Anglia Vampire on Ritchie Highway south of Baltimore at about 10:45 PM, a luminous silver disk with a dome hovered roughly 200 feet above his car for about three minutes. He claimed the object killed his engine, cracked his paint, and made a sound like a vacuum cleaner before rolling on its edge and departing at high speed. Stewart said his passenger, 16-year-old George S. Tyler III, had witnessed the event.

The Air Force Office of Special Investigations (OSI), led by Special Agent Boyce Royal, looked into the claim. Their findings were unflattering. Tyler admitted he had not been with Stewart during the alleged sighting and that Stewart had asked him to back up the story because he feared no one would believe him. Multiple character references described Stewart as someone who exaggerates and &#39;shoots a lot of bull.&#39; Tyler&#39;s own father believed Stewart made the story up to get his name in the papers.

Physical evidence fared no better. Raymond Fox of Westinghouse examined Stewart&#39;s car with a Geiger counter and found no radioactivity or unusual defects. The investigating agent noted the car had been recently repainted, directly undermining Stewart&#39;s claim that the encounter cracked his paint. Anne Arundel County Police had no record of any such aircraft report, and interviews along Ritchie Highway turned up no corroborating witnesses. A local officer pointed out it was highly unlikely a car could sit stopped on that road on a Saturday night for three minutes without other vehicles passing. OSI closed the case with no further inquiry planned.

Bundled in the same file are two unrelated sightings from May 1952. Four DuPont employees at the Savannah River Plant in South Carolina reported seeing disk-shaped objects, yellow to gold in colour, moving at high speed with no noise on the night of 20 May. Separately, three women in Ashland, Kentucky described oval objects resembling large oysters with fishtails floating low on the evening of 25 May. Neither incident received the same depth of investigation in this file.

The document is heavily redacted throughout, with multiple addresses and personal details blacked out, and pages 13 through 17 are nearly completely illegible due to severe degradation of the original records.</div>
