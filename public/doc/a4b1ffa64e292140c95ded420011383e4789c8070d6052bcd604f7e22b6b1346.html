  <h1>Delta 767 crew reported ten moving lights near Jackson, Mississippi</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a4b1ffa64e292140c95ded420011383e4789c8070d6052bcd604f7e22b6b1346.jpg" alt="Delta 767 crew reported ten moving lights near Jackson, Mississippi thumbnail" loading="lazy" />
  <p>An FAA incident report documents the crew of a Delta Air Lines Boeing 767, flying from Los Angeles to Atlanta on 5 February 2023, observing roughly ten lights at high altitude that moved in multiple directions for 5–10 seconds before fading. The report was closed with no indication of follow-up investigation.</p>
  <div class="narr">This is an FAA SKYWATCH incident report filed under record 237UAP00200. It documents a sighting reported by the crew of Delta Air Lines flight DAL395, a Boeing 767 flying from Los Angeles (LAX) to Atlanta (ATL) on 5 February 2023. The report was logged by Memphis Air Route Traffic Control Center (ZME) under MOR ID ZME-M-2023/02/05-0001.

While eastbound at flight level 350 (approximately 35,000 feet), about 35 nautical miles west-northwest of Jackson, Mississippi, the crew reported seeing approximately ten lights at what they described as a high altitude. The lights moved in multiple directions, remained visible for 5–10 seconds, and then faded out. The crew did not take evasive action. Air Watch Operations (AWO) was notified of the incident.

The FAA marked the report as closed. There is no mention of radar data, sensor recordings, or any corroborating evidence beyond the crew&#39;s visual observation. No follow-up investigation or resolution is indicated in the document.

The report shows minimal redaction. No aircraft tail number was recorded, which is unusual for an FAA incident report, though the flight details — callsign, aircraft type, operator, route — are all present.</div>
