  <h1>CIA Source Reported Silent Green Object Over Soviet Missile Range in 1973</h1>
  <div class="meta">
    <span class="badge">Central Intelligence Agency</span>
    <span class="badge">12/20/73</span>
    <span class="badge">USSR</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d3039ed486d8400be3263c0c438b199abfdb8ac030156baff1536f007349d315.jpg" alt="CIA Source Reported Silent Green Object Over Soviet Missile Range in 1973 thumbnail" loading="lazy" />
  <p>A 1977 CIA intelligence report documents a former Soviet citizen&#39;s account of seeing a bright green circular object expand into concentric rings and silently disappear over the Sary Shagan weapons testing range in late summer 1973. The report, originally classified CONFIDENTIAL, also covers Soviet missile warhead details and rumored laser research at the site.</p>
  <div class="narr">This is a CIA Intelligence Information Report (number FIRK-311/01638-77) covering information gathered between November 1972 and November 1973 about the Sary Shagan weapons testing range in the USSR. The source was a former Soviet citizen debriefed in Germany who had worked at the range.

The source reported that one evening in late summer 1973, while stepping outside during a Canada-USSR sports broadcast on television, he observed a bright green circular object in the sky west of Site 7. The object was at roughly 70 degrees angle of sighting, and its altitude was undeterminable though believed to be above cloud level — despite the sky being cloudless that evening. Within 10 to 15 seconds the green circle widened and formed several green concentric circles around it. Within minutes the coloring disappeared entirely. There was no sound associated with the phenomenon.

The source offered no opinion on what the object was, and reported that no rumors about it circulated afterward. Beyond the sighting, the report details the missile systems housed at the range: System-75 (SA-2) warheads containing roughly 100 cassettes each packed with 200-300 metal balls, and the larger System-300/Aldan (ABM-1/GALOSH) anti-missile defense warheads measuring about 2 meters long and weighing approximately 400 kilograms. The source also relayed a rumor about laser weapons experiments being conducted at an unknown location on the range involving powerful antennas.

The document carries moderate redaction evidence and was originally classified CONFIDENTIAL with a warning notice about sensitive intelligence sources and methods. It was approved for release in 2026 and explicitly states it is &quot;not finally evaluated intelligence.&quot;</div>
