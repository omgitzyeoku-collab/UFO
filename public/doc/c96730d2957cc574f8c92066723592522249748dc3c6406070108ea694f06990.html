  <h1>Pilots reported mystery lights near Cape Canaveral — SpaceX launch confirmed</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c96730d2957cc574f8c92066723592522249748dc3c6406070108ea694f06990.jpg" alt="Pilots reported mystery lights near Cape Canaveral — SpaceX launch confirmed thumbnail" loading="lazy" />
  <p>This FAA Washington Operations Center report documents multiple pilot sightings of bright lights and a smoke ring near Cape Canaveral, Florida on 12 October 2023. The phenomenon was initially reported as unidentified but was resolved when HQ Space Operations confirmed it was a successful SpaceX mission with rocket body recovery underway.</p>
  <div class="narr">On the evening of 12 October 2023, multiple aircraft crews flying near Cape Canaveral, Florida reported seeing an unidentified aerial phenomenon. Pilots described bright lights shining through a smoke ring, or what appeared to be a possible rocket climbing to between 30,000 and 34,000 feet. The sighting was unusual enough that crews believed it resembled a potential SpaceX mission failure.

The FAA&#39;s Washington Operations Center logged the report the following day (13 October 2023) as a situational awareness notice. Multiple FAA Air Route Traffic Control Centers were notified of the sighting.

The mystery was resolved quickly. HQ Space Operations confirmed that the SpaceX mission in question was successful and that rocket body recovery was already in progress. The bright lights and smoke ring observed by pilots were consistent with normal launch and recovery operations.

This record is notable not as evidence of an unexplained phenomenon, but as documentation of how routine space launch activity can initially be misidentified by trained observers. The coordinates in the report (28.39°N, 80.61°W) place the incident squarely at Cape Canaveral Space Force Station.</div>
