  <h1>Learjet Crew Reports Bright Stationary Light Above 41,000 Feet Near Palm Springs</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/6e733180ccab3d616d1c853702dab88cdb2c3c6529a8edfdebd15cbd228bdf5c.jpg" alt="Learjet Crew Reports Bright Stationary Light Above 41,000 Feet Near Palm Springs thumbnail" loading="lazy" />
  <p>An FAA operations center notification documents a January 2024 UAP sighting by the crew of a Learjet flying from Van Nuys to Tucson. The crew described a bright light, stationary and turning, positioned well above their cruising altitude of 41,000 feet near Palm Springs, California. No evasive action was taken and no further investigation is documented here.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — essentially a standardised intake form the FAA uses to log reports from pilots and air traffic control. It is not an investigation report or a final conclusion; it records what was reported and by whom.

On 21 January 2024 at approximately 5:18 AM Pacific time, the crew of Xcel Jet flight 411, a Learjet LJ40 flying southeast-bound from Van Nuys (VNY) to Tucson (TUS), reported an unidentified aerial phenomenon to Los Angeles Air Route Traffic Control Center (ARTCC). The aircraft was at flight level 410 — roughly 41,000 feet — about 10 nautical miles northwest of Palm Springs, California.

The crew described what they saw as a bright light at their 12 o&#39;clock position (directly ahead), stationary and turning, positioned significantly higher than the aircraft. Given the Learjet was already at 41,000 feet, the object was well above typical commercial aviation altitudes.

No evasive action was taken by the crew, and no law enforcement was notified. The document contains coordinates (33.93°N, 116.63°W) consistent with the area northwest of Palm Springs. Beyond logging the report, the document does not record any follow-up investigation, radar corroboration, or agency conclusion about what the light was.</div>
