  <h1>American Airlines Crew Reports High-Altitude Balloon Over Missouri in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5d93e708e05b9b58d7c89579a92202a1b232f788149a54b9d6cd6897b270cdb8.jpg" alt="American Airlines Crew Reports High-Altitude Balloon Over Missouri in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by an American Airlines crew on 3 February 2023. While flying at 34,000 feet near St. Joseph, Missouri, the pilots observed a large balloon at roughly 50,000 feet that appeared to drop 20,000 feet in altitude. The FAA classified it as an Unidentified Aerial Phenomenon and closed the case.</p>
  <div class="narr">On 3 February 2023, the crew of American Airlines flight AAL1743 — an Airbus A319 flying from Cedar Rapids to Dallas/Fort Worth — reported an unusual object while passing 13 nautical miles west of St. Joseph, Missouri. The aircraft was heading north at 34,000 feet (FL340) when the crew spotted what they described as a large balloon off the right side of the aircraft.

The pilot in command estimated the balloon was at approximately 50,000 feet (FL500) or above — well beyond the typical ceiling for most known civilian balloons. The crew then observed the object drop roughly 20,000 feet in altitude. Kansas City Center (ZKC) was the air traffic facility that received the report.

The FAA logged this under its SKYWATCH system and assigned it the primary code &quot;Unidentified Aerial Phenomenon.&quot; The case is now closed. Notably, the report does not mention any corroborating radar data, and no tail number was recorded for the aircraft. The crew described the object as a balloon, but the FAA still coded the event as a UAP rather than confirming that identification.

This incident took place during February 2023, a period when several high-altitude balloon sightings were reported across US airspace and attracted significant public attention. The document itself is brief and contains limited additional detail beyond the crew&#39;s account.</div>
