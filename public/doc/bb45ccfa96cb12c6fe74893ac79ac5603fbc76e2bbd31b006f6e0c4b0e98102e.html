  <h1>Airline Crew Reports Bright White UAP Over Pacific Ocean Near LA</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>

  <img class="thumb" src="/extract/thumbs/bb45ccfa96cb12c6fe74893ac79ac5603fbc76e2bbd31b006f6e0c4b0e98102e.jpg" alt="Airline Crew Reports Bright White UAP Over Pacific Ocean Near LA thumbnail" loading="lazy" />
  <p>This FAA incident notification records a sighting by the crew of Omni Air flight 1169, a Boeing 767-200 flying from Honolulu to Fort Worth on 18 November 2023. The crew reported a bright white unidentified aerial phenomenon to their right while cruising at roughly 39,000 feet, about 110 nautical miles southwest of Los Angeles. No evasive action was taken.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — essentially a short, standardised form used to log unusual events reported by aircraft. It is not a full investigation report and contains no analysis or conclusions about what the object was.

On 18 November 2023, the crew of Omni Air flight 1169, a Boeing 767-200 en route from Honolulu to Fort Worth, reported seeing a bright white unidentified aerial phenomenon off the right side of their aircraft. They were flying eastbound at flight level 390 (approximately 39,000 feet), about 110 nautical miles southwest of Los Angeles International Airport — placing them over the Pacific Ocean off the Southern California coast. The sighting was relayed through Los Angeles Air Route Traffic Control Center (ARTCC), the facility responsible for managing high-altitude air traffic in that region.

The crew took no evasive action in response to the sighting, and no law enforcement notification was reported. The coordinates recorded in the document (approximately 32.47°N, 119.13°W) are consistent with the stated position southwest of LAX.

The FAA notification contains no follow-up investigation, no radar data, and no additional witness accounts. It is a preliminary record — a logged report of what the crew said they saw, with no determination of what the object was.</div>
