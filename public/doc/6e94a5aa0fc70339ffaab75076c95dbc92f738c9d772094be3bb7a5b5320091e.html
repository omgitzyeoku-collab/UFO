  <h1>NetJets Pilot Reports Large Brown Object Over Albany, NY</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/6e94a5aa0fc70339ffaab75076c95dbc92f738c9d772094be3bb7a5b5320091e.jpg" alt="NetJets Pilot Reports Large Brown Object Over Albany, NY thumbnail" loading="lazy" />
  <p>This FAA incident notification records a NetJets pilot reporting a large, brown unidentified aerial phenomenon 200 feet below their aircraft over Albany, New York on July 8, 2023. The document is a preliminary notification from the FAA Washington Operations Center, not a completed investigation, and includes no corroborating radar data or additional witnesses.</p>
  <div class="narr">On the evening of July 8, 2023, at 8:04 PM Eastern time, the FAA Washington Operations Center logged an incident report from flight EJA828 — a NetJets Cessna C700 travelling from Portland, Maine to Teterboro, New Jersey. The pilot reported seeing a large, brown unidentified aerial phenomenon while flying southeastbound at flight level 240 (roughly 24,000 feet) over Albany, New York.

According to the report, the object passed approximately 200 feet below the aircraft. The pilot took no evasive action, and no law enforcement notification was made. Boston ARTCC (Air Route Traffic Control Center), the air traffic control facility handling the flight, was advised of the sighting.

The coordinates recorded in the document — 42.76°N, 73.80°W — correspond to the Albany, New York area, consistent with the pilot&#39;s description. Notably, the document labels both coordinate fields as &quot;Latitude,&quot; though the second value is clearly a longitude based on its negative (westward) value.

This document is a preliminary information notification, not a completed investigation or final determination. The FAA recorded what the pilot reported but did not include any analysis, explanation, or follow-up findings in this particular record.</div>
