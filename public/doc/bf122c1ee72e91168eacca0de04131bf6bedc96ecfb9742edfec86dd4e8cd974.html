  <h1>FAA Report: Pilot Spotted Large Balloon at 50,000 Feet in February 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bf122c1ee72e91168eacca0de04131bf6bedc96ecfb9742edfec86dd4e8cd974.jpg" alt="FAA Report: Pilot Spotted Large Balloon at 50,000 Feet in February 2023 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a commercial pilot&#39;s sighting of a large balloon flying at roughly 50,000 feet on 3 February 2023 — the day before the widely reported Chinese surveillance balloon was shot down. The report was classified under the FAA&#39;s Unidentified Aerial Phenomenon code and closed with no follow-up investigation details included.</p>
  <div class="narr">On 3 February 2023 at 14:40 UTC, the crew of Sun Country Airlines flight SCX8941, travelling westbound from Minneapolis (MSP) to San Antonio (SKF) at 40,000 feet, reported a large balloon off the right side of the aircraft. The object was observed approximately 15 nautical miles west of RBA, at an estimated altitude of 50,000 feet or above — roughly 10,000 feet higher than the airliner.

The FAA logged the sighting under its SKYWATCH system and assigned it the primary code &quot;Unidentified Aerial Phenomenon.&quot; Despite the pilot describing the object as a balloon, the UAP classification was applied. The case status is marked as closed, and the document contains no details of any follow-up investigation, corroborating radar data, or resolution.

The timing is notable. This sighting occurred one day before the US military shot down a Chinese surveillance balloon off the coast of South Carolina on 4 February 2023, during a period of heightened public and government attention to high-altitude balloon incursions over US airspace.

The document itself is brief and administrative in nature. It records the basic facts of the pilot&#39;s observation — date, time, callsign, altitude, position, and object description — but offers no analysis, no sensor data, and no conclusion about what the object was.</div>
