  <h1>Two Airline Crews Report Circling White Lights Over Kansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/11c1bc5acec5eac90d28e796e2e417f0d563fee2eb611d201e53cad8902c644e.jpg" alt="Two Airline Crews Report Circling White Lights Over Kansas thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents a December 2023 incident in which pilots of two commercial flights — Spirit 2804 and American 2014 — independently observed two white lights circling each other near Salina, Kansas. The lights were not detected on air traffic control radar.</p>
  <div class="narr">On December 27, 2023, at 4:35 a.m. Central time, the Kansas City Air Route Traffic Control Center (ARTCC) received reports from the crews of two commercial flights — Spirit 2804 and American 2014 — about unidentified aerial phenomena east of their aircraft, roughly 30 nautical miles north of Salina, Kansas. The two planes were flying at approximately 41,000 and 35,000 feet respectively.

Both crews described the same thing: two white lights circling each other, coming close together, and then moving apart. The coordinated movement pattern was notable enough that two separate flight crews flagged it to air traffic control independently.

Despite the visual reports from both crews, the objects did not appear on ATC radar systems. The document is a preliminary information report from the FAA&#39;s Washington Operations Center — essentially an initial log of the incident, not a completed investigation.

The report contains no follow-up analysis, no final determination about what the lights were, and no discussion of possible explanations such as weather phenomena, satellites, or military activity. It is a brief factual record of what was reported, by whom, and when.

There is little evidence of redaction in this document. What limits its usefulness is not censorship but brevity — it is a preliminary filing, and if any deeper investigation followed, it is not included here.</div>
