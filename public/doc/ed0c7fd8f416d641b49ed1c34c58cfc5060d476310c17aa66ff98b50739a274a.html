  <h1>Airline Crew Reports Bright Lights at 60,000 Feet Near Akron, Ohio</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ed0c7fd8f416d641b49ed1c34c58cfc5060d476310c17aa66ff98b50739a274a.jpg" alt="Airline Crew Reports Bright Lights at 60,000 Feet Near Akron, Ohio thumbnail" loading="lazy" />
  <p>An FAA operations centre notification records that the crew of PSA flight 5656, a regional jet flying from Washington to Milwaukee, reported seeing white bright lights hovering or orbiting at roughly 60,000 feet while they were cruising at 38,000 feet near Akron, Ohio on 2 October 2024. No evasive action was taken and no radar or sensor corroboration is included in this document.</p>
  <div class="narr">This document is a preliminary incident notification from the FAA&#39;s Washington Operations Center, logged at 9:40 PM Eastern on 2 October 2024. It records a pilot report of an unidentified aerial phenomenon — not an investigated case file or a final conclusion.

The crew of PSA 5656, a CRJ-700 regional jet operating from Washington DCA to Milwaukee MKE, reported observing white bright lights that appeared to be orbiting or stationary at approximately 60,000 feet. At the time, the aircraft was heading northwest at 38,000 feet in the vicinity of Akron, Ohio (coordinates 40.915°N, 81.444°W). The lights were roughly 22,000 feet above the aircraft. Cleveland Air Route Traffic Control Center (ARTCC) was advised of the sighting.

The crew took no evasive action. The notification was logged by the Washington Operations Center under reference 237UAP00638 and includes a contact number (202-267-3333) for the centre.

The document does not contain any follow-up investigation, radar data, photographs, or conclusions about what the lights were. It is a single-page operations centre log entry — a starting point for record-keeping, not an analysis.</div>
