  <h1>Gulfstream Pilot Reported White Lights Manoeuvring Above 41,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/19f14cb62b110e0d801f5e14d2319292c696201ee6ff542c93dca6a059fe4fc6.jpg" alt="Gulfstream Pilot Reported White Lights Manoeuvring Above 41,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a 2023 sighting by the pilot of a Gulfstream IV (callsign N926TT) who observed white lights manoeuvring above 41,000 feet, approximately 30 nautical miles south of the AMN navigational beacon. The case was closed with no resolution or explanation provided.</p>
  <div class="narr">On 18 February 2023, the pilot of a Gulfstream IV business jet — flying under callsign N926TT — reported an unidentified aerial phenomenon to air traffic control. The aircraft was a general aviation flight travelling southeast at 41,000 feet, en route from Van Nuys (VNY) to TLPL.

The pilot described white lights manoeuvring directly ahead of the aircraft (the 12 o&#39;clock position), approximately 30 nautical miles south of the AMN VOR navigational beacon. The lights were reported as being above the aircraft&#39;s altitude of 41,000 feet. The report was filed through Jacksonville Center (ZJX), the FAA facility responsible for that airspace.

The FAA classified the incident under its primary code for Unidentified Aerial Phenomenon. Despite this classification, the case is marked as closed. No resolution, explanation, or follow-up findings appear in the document.

No corroborating radar data, additional witness accounts, or identifying information about the aircraft&#39;s operator are included in the report. The document shows low evidence of redaction, meaning most of its content appears to be intact as released.</div>
