  <h1>Learjet Pilot Reports Bright Yellow Lights Above Kentucky in 2022</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/ce0c18c851f39dfb927aec8591b98d2dcec2e6d11094b0fab89c15a8a74342a2.jpg" alt="Learjet Pilot Reports Bright Yellow Lights Above Kentucky in 2022 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Learjet 35 pilot&#39;s sighting of multiple bright yellow glowing lights while flying at 37,000 feet near London, Kentucky on 17 September 2022. The lights appeared nearly stationary high above the aircraft, alternating in brightness and number. The FAA closed the case with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form the Federal Aviation Administration uses to log pilot reports of unidentified aerial phenomena. It was filed under case number 237UAP00112.

On 17 September 2022 at 07:35 UTC, the pilot of a Learjet 35 (a small twin-engine jet, callsign N89TB) was flying southeast at 37,000 feet, approximately 40 nautical miles west of the London, Kentucky navigational beacon (known by its FAA code LOZ). The aircraft was a general aviation flight departing from the Denver area and heading to Sanford-Lee County Airport in North Carolina.

The pilot reported seeing multiple bright yellow glowing lights off the left side of the aircraft. The lights alternated in brightness and in number, appeared nearly stationary, and were positioned high above the aircraft&#39;s altitude. No further detail about the lights&#39; size, shape, or movement pattern is recorded in the report.

No law enforcement was notified about the sighting. The case is marked as closed, but the FAA provided no resolution or explanation for what the pilot observed. There is no mention of corroborating radar data or reports from other aircraft or witnesses.

It is worth noting that the metadata listing for this record gives an incident date of 2023, but the report itself clearly states 17 September 2022. The date in the source document appears to be the accurate one.</div>
