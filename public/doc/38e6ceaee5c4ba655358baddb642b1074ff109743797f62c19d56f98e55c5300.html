  <h1>Pentagon Lab Tests Alleged 1947 Crash Debris, Finds Earthly Origin</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/38e6ceaee5c4ba655358baddb642b1074ff109743797f62c19d56f98e55c5300.jpg" alt="Pentagon Lab Tests Alleged 1947 Crash Debris, Finds Earthly Origin thumbnail" loading="lazy" />
  <p>The Pentagon&#39;s UAP office (AARO) had Oak Ridge National Laboratory test a metallic specimen long claimed to be wreckage from a 1947 extraterrestrial crash. The lab found its isotopic makeup is consistent with terrestrial magnesium alloy and it cannot function as the &quot;antigravity waveguide&quot; its proponents claimed.</p>
  <div class="narr">In 2022, the All-domain Anomaly Resolution Office (AARO) — the Pentagon&#39;s UFO investigation unit — contracted Oak Ridge National Laboratory (ORNL) to scientifically test a small metallic specimen. The object had been publicly alleged to be a component recovered from a crashed extraterrestrial vehicle in 1947, with supporters claiming it could function as a terahertz waveguide capable of generating antigravity. ORNL produced its summary of findings in April 2024, and this supplementary assessment document (case 330UAP000013) was cleared for public release on 1 July 2024.

The specimen turned out to be a magnesium alloy containing bismuth, lead, and zinc (1–4% zinc by weight). High-resolution analysis revealed repeating layers of bismuth and lead banding with columnar magnesium grains running perpendicular to the bands. Isotopic testing of both the magnesium and lead confirmed compositions squarely within the range expected for materials of terrestrial origin. On the waveguide claim, ORNL found that bismuth can theoretically act as a waveguide only when it exists as a pure crystalline layer — but in this specimen, the bismuth is intermixed with lead, meaning it was never pure enough to function that way.

AARO concluded the specimen is most likely a test object, manufacturing product or byproduct, or material component from mid-20th century magnesium alloy research. Such research began around 1915 and peaked during World War II, when magnesium alloys were widely studied for use in airframes, engines, and weapons systems. Multiple projects from that era worked with magnesium-zinc alloys at the same zinc concentrations found in this specimen.

The specimen shows significant degradation — delamination, oxidation, and structural damage from environmental and mechanical stress — meaning its current form may not represent its original state. Neither AARO nor ORNL could verify the specimen&#39;s historical origin or trace it to a specific research programme. The chain of custody is undocumented, with only unverifiable and conflicting personal accounts.</div>
