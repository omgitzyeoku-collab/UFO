  <h1>FAA Report: Unidentified Object Detected at 40,000 Feet Near Richmond</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/128a27a93260a3838b51e338b473597fc01b8d8de82ee0a21238647459c5d25e.jpg" alt="FAA Report: Unidentified Object Detected at 40,000 Feet Near Richmond thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a May 2021 event in which air traffic control detected an unidentified object travelling northwest at approximately 40,000 feet, roughly 50 nautical miles southeast of Richmond. One commercial aircraft confirmed seeing something unusual above them, while a second aircraft reported only contrails. The case was closed without identification or resolution.</p>
  <div class="narr">On 20 May 2021 at 19:49, an air traffic controller picked up a Mode C intruder alert — an automated radar warning indicating an untracked object — moving slowly northwest at approximately 40,000 feet, about 50 nautical miles southeast of Richmond.

The controller queried nearby commercial aircraft. The first, call sign SCX3036, reported seeing an unidentified aerial phenomenon just above them at flight level 400 (roughly 40,000 feet). A second aircraft, PPJ510, reported some time later that it saw contrails above them at the same altitude — but did not report seeing an object itself.

The Continental United States NORAD Region (CONR) confirmed a primary radar target 12 nautical miles off the HPW031 radial. However, when FAA headquarters in Denver requested a replay from the Air &amp; Marine Operations Center (AMOC), the results came back negative — meaning the object could not be consistently tracked across all radar systems.

The FAA classified the event under its primary code of &quot;Unidentified Aerial Phenomenon&quot; and marked the case as closed. No identification or explanation for the object was recorded in the report.

No imagery, sensor data, or additional corroborating evidence is attached to the document. The incident location is not specified beyond the reference to being southeast of Richmond.</div>
