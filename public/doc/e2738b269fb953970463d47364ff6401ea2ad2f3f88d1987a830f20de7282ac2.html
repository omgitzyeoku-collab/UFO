  <h1>Airline Crew Reports White Flashing Lights Over North Carolina</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/e2738b269fb953970463d47364ff6401ea2ad2f3f88d1987a830f20de7282ac2.jpg" alt="Airline Crew Reports White Flashing Lights Over North Carolina thumbnail" loading="lazy" />
  <p>This FAA preliminary incident report documents a UAP sighting by the crew of TACA flight 580, an Airbus A320 flying from El Salvador to Washington Dulles, on August 11, 2023. The crew observed an unidentified aerial phenomenon with white flashing lights at approximately 31,000 feet near Raleigh-Durham, North Carolina. No evasive action was taken.</p>
  <div class="narr">On August 11, 2023, at 2:41 AM Eastern time, the crew of TACA flight 580 — an Airbus A320 registered in El Salvador, flying from San Salvador to Washington Dulles — reported seeing an unidentified aerial phenomenon while cruising northbound at flight level 310 (approximately 31,000 feet). The sighting occurred roughly 30 nautical miles southwest of Raleigh-Durham airport in central North Carolina.

The crew described the object as displaying white flashing lights. Washington ARTCC (Air Route Traffic Control Center), the air traffic control facility handling the flight, was advised of the sighting. The report notes that no evasive action was taken by the aircraft and no law enforcement notification was made.

This document is a preliminary report from the FAA&#39;s Washington Operations Center. It records the basic facts of the sighting — who reported it, where, when, and what was described — but does not contain any analysis, conclusion, or identification of the phenomenon. There is no indication of corroborating radar data or additional witness accounts in this report.

The coordinates logged in the report (35.63°N, 79.22°W) place the incident in central North Carolina, consistent with the stated location southwest of Raleigh-Durham. The report shows minimal redaction.</div>
