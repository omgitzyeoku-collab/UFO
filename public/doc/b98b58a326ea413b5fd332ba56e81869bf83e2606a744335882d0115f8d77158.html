  <h1>Army Witnesses Saw Stationary Object Over Cheyenne Mountain in 2022</h1>
  <div class="meta">
    <span class="badge">Intelligence Community Agency</span>
    <span class="badge">2022</span>
    <span class="badge">Colorado Springs, Colorado, U.S.</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b98b58a326ea413b5fd332ba56e81869bf83e2606a744335882d0115f8d77158.jpg" alt="Army Witnesses Saw Stationary Object Over Cheyenne Mountain in 2022 thumbnail" loading="lazy" />
  <p>A U.S. Intelligence Community agency assessed a February 2022 sighting near Colorado Springs in which five Army service members observed a large, translucent, potato-shaped object hovering above Cheyenne Mountain for up to three minutes before it vanished. The agency suggested with low confidence that sunlight reflecting off snow-covered ground and illuminating clouds could explain what the witnesses saw.</p>
  <div class="narr">On 15 February 2022 at 0935 Mountain Time, five U.S. Army service members stationed at Fort Carson, Colorado, spotted an airborne object roughly six miles to the west, hovering above Cheyenne Mountain. They watched it for somewhere between 30 seconds and three minutes before it suddenly disappeared while they were still looking at it.

The witnesses described the object as resembling an angular, non-symmetrical potato made of uneven panels, roughly the size of a large jet. It sat completely stationary about 300 to 500 feet above the mountain, slowly changing shape, with a slightly translucent, shimmering white appearance and defined edges. No aircraft or balloons were recorded in the area at the time, and no photographic, video, or sensor evidence was captured — the entire account rests on the testimony of the five witnesses.

An Intelligence Community partner agency (whose name is redacted throughout the document) analysed the incident and proposed a natural explanation: sunlight backscattering off snow-covered ground could have illuminated low-level clouds, producing the visual effect. However, the agency itself rated this assessment at low confidence, citing uncertainty about the witnesses&#39; exact field of view, snow cover levels, and cloud conditions. Notably, the witnesses reported clear blue skies, while official weather data from the Air Force Weather Agency and Weather Underground indicated partly to mostly cloudy conditions that morning.

The agency concluded that the event did not represent an adversarial threat and that no anomalous data or characteristics were recorded. The document is heavily redacted, with the assessing agency&#39;s identity removed throughout. As of the available metadata, the incident remains unresolved — the backscattering explanation is a possibility, not a confirmed finding.</div>
