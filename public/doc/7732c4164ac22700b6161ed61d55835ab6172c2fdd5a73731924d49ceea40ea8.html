  <h1>Commercial Pilot Reports Bright White Lights Near Chicago O&#39;Hare</h1>
  <div class="meta">
    <span class="badge">FAA</span>

    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/7732c4164ac22700b6161ed61d55835ab6172c2fdd5a73731924d49ceea40ea8.jpg" alt="Commercial Pilot Reports Bright White Lights Near Chicago O&#39;Hare thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a commercial pilot on Royal Jordanian flight RJA264 observing bright white lights approximately 25 nautical miles north of Chicago O&#39;Hare International Airport on 2 March 2023. The case was closed with no identification of the phenomenon and no law enforcement was notified.</p>
  <div class="narr">This document is a standardised FAA SKYWATCH incident report — a form the Federal Aviation Administration uses to log pilot sightings of unidentified aerial phenomena (UAP). It records what the pilot reported, not what was independently verified.

On 2 March 2023, the crew of Royal Jordanian flight RJA264, a commercial flight with a destination listed as OJAI, reported an unidentified aerial phenomenon while flying northbound at flight level 180 (approximately 18,000 feet). The lights were observed off the left side of the aircraft, roughly 25 nautical miles north of Chicago O&#39;Hare International Airport (ORD). The crew described them as bright white lights, situated between 14,000 feet and FL180, and explicitly stated that the phenomenon was not a drone or unmanned aircraft system (UAS).

The report is filed under MOR ID ZAU-M-2023/03/01-0002, referencing the Chicago Air Route Traffic Control Center (ZAU). No law enforcement agency was notified about the sighting.

The FAA marked the case as closed. No resolution or identification of the phenomenon is provided in the document. There is no indication that radar data, additional witness accounts, or follow-up investigation results were included.</div>
