  <h1>Commercial Pilot Reports Circling Lights Later Linked to Starlink</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>

  <img class="thumb" src="/extract/thumbs/df41333a5237c098ac9d0dc0e0ed7770bb867764d190595b090698310b08e0c8.jpg" alt="Commercial Pilot Reports Circling Lights Later Linked to Starlink thumbnail" loading="lazy" />
  <p>This FAA incident report documents a commercial airline crew observing circling lights above their aircraft while flying from Orlando to Baltimore in May 2023. The FAA&#39;s own notes suggest the lights correlate with Starlink satellites, and the case is closed.</p>
  <div class="narr">On 3 May 2023, the crew of a commercial flight travelling from Orlando (MCO) to Baltimore (BWI) reported an unidentified aerial phenomenon to air traffic control. The aircraft was northbound at 35,000 feet over Fayetteville (FAY) when the crew observed circling lights high above and to the northeast of their position.

The sighting was logged through the FAA&#39;s SKYWATCH incident reporting system, which is used to track pilot reports of unusual aerial activity. The report identifies the operator as commercial and lists the Washington Centre (ZDC) as the relevant air traffic control facility.

Notably, the FAA&#39;s own write-up includes an assessment that the lights appear to correlate with Starlink satellites — the large constellation of low-orbit communications satellites operated by SpaceX. This makes the case unusual among UAP reports in that the filing itself offers a probable conventional explanation.

The case is marked as closed. No corroborating radar data or additional witness accounts are mentioned in the report. The document shows minimal redaction.</div>
