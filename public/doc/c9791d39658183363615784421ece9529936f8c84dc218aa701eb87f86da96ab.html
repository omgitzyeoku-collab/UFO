  <h1>Delta Crew Reports Synchronized Lights Near LAX in 2023</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/c9791d39658183363615784421ece9529936f8c84dc218aa701eb87f86da96ab.jpg" alt="Delta Crew Reports Synchronized Lights Near LAX in 2023 thumbnail" loading="lazy" />
  <p>A preliminary FAA report documents the crew of Delta Air Lines flight 2054 observing multiple stationary, synchronized lights while descending toward Los Angeles on July 20, 2023. The crew took no evasive action, and the report contains no investigation findings or explanation for what was seen.</p>
  <div class="narr">This document is a preliminary information report from the FAA&#39;s Washington Operations Center (WOC). It records a UAP sighting reported by the flight crew of Delta Air Lines flight 2054, a Boeing 737-800 flying from San Francisco to Los Angeles on July 20, 2023.

While heading south at 14,200 feet, approximately 20 miles southwest of Los Angeles International Airport (LAX), the crew reported observing an unidentified aerial phenomenon. They described it as multiple stationary lights that appeared to be synchronized. The crew did not take any evasive action in response.

The sighting was relayed through Los Angeles Air Route Traffic Control Center (ARTCC) to FAA operations. The report notes that law enforcement notification was not reported. The coordinates place the sighting over the Pacific Ocean, off the coast southwest of LAX.

The document is a preliminary operations center log entry, not a completed investigation. It records what was reported but offers no analysis, conclusion, or explanation for the lights. There is minimal redaction in the document itself.</div>
