  <h1>Commercial Pilot Reports White Cylindrical Object Near JFK Airport</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/8c20ba220a23bb7823e47178e52e5ac18c7cad89e0584dbfdd6a2960a435e11d.jpg" alt="Commercial Pilot Reports White Cylindrical Object Near JFK Airport thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a commercial aircraft encountering an unidentified white cylindrical object about 10 nautical miles south of JFK airport on 29 May 2023. The pilot classified it as a near miss at roughly 19,000 feet, but no evasive action was taken and the case was closed without apparent follow-up.</p>
  <div class="narr">On the evening of 29 May 2023, at 22:20, the crew of commercial flight JRE785 reported an unidentified aerial phenomenon while flying northeast at Flight Level 190 — roughly 19,000 feet — about 10 nautical miles south of John F. Kennedy International Airport in New York.

The pilot described the object as a white cylindrical shape, approximately the size of three bowling balls, travelling eastbound at roughly the same altitude as the aircraft. The pilot in command classified the encounter as a near miss, though no evasive manoeuvres were taken.

The report was filed under the FAA&#39;s SKYWATCH system and coded as an Unidentified Aerial Phenomenon. The case status is marked as closed, with no indication in the document of any follow-up investigation, resolution, or identification of the object.

The document is a single-page incident report with limited detail. It records only the pilot&#39;s account — there is no mention of corroborating radar data, additional witnesses, or any attempt to recover or further identify the object.</div>
