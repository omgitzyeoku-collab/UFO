  <h1>NASA Internal Report Details Gemini IV Mission and First American Spacewalk</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">June 3-7, 1965</span>
    <span class="badge">Low Earth Orbit</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5f073d6c4ae822a8213d56fbccef9d14a82e6b75bc318dbe2ccfe9c5945ddeee.jpg" alt="NASA Internal Report Details Gemini IV Mission and First American Spacewalk thumbnail" loading="lazy" />
  <p>This 1967 NASA internal document is a mission operations report and pre-flight planning package for Gemini IV (GT-4), the June 1965 mission in which astronaut Edward White became the first American to walk in space. While the document was flagged in the UAP release because certain pages reportedly describe astronaut observations of &quot;bright particles&quot; in orbit, those specific pages are missing from the extracted text.</p>
  <div class="narr">In June 1965, NASA launched Gemini IV — the second crewed mission in the Gemini programme and the fourth Gemini flight overall. Command pilot James A. McDivitt and pilot Edward H. White II spent roughly 97 hours and 50 minutes in low Earth orbit across 62 revolutions, making it the longest two-person spaceflight attempted at that time. The spacecraft launched from Complex 19 at the Kennedy Space Center and splashed down approximately 400 miles southwest of Bermuda, where the crew was recovered by the USS Wasp.

The mission&#39;s signature achievement was the first American extravehicular activity — a spacewalk. White exited the capsule wearing the new G4C spacesuit, tethered by a 25-foot umbilical, and manoeuvred using a handheld device called the Zero-g Integral Propulsion (ZIP) Unit, which jetted oxygen through forward and aft nozzles. The EVA was planned to last approximately 10 minutes. White carried a 35mm Zeiss-Contarex camera mounted on the manoeuvring unit. Both the primary and backup crews — the backups being Frank Borman and James A. Lovell Jr. — had trained for 40 minutes of cabin depressurisation at a simulated altitude of 150,000 feet.

The document also covered 13 onboard experiments, station-keeping exercises with the booster&#39;s spent second stage (which had flashing lights installed), and the fact that this was the first mission controlled from the new Mission Control Center in Houston. The total Gemini programme cost across fiscal years 1962–1967 was listed at approximately $1,353.9 million.

This report was marked &quot;For Internal Use Only&quot; — a restricted-distribution label within NASA, not a classified designation. It appears in the US Department of War&#39;s UAP public release because certain pages (reportedly pages 78–81 and 101) contain astronaut observations of bright particles during the mission. However, those pages are not present in the text extraction available here, so no assessment of those observations can be made from this document alone.</div>
