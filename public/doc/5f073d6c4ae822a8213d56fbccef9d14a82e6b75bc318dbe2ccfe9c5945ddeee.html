  <h1>NASA-UAP-D018, Gemini 4 Experiment Debriefing, 1967</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">June 3-7, 1965</span>
    <span class="badge">Low Earth Orbit</span>
    
  </div>
  
  <p>Gemini IV was the second crewed mission of the Gemini series. Astronauts James McDivitt and Edward White successfully completed the four-day flight between June 3 and June 7, 1965. The mission included the first American spacewalk. This collection of documents contains a transcription of the astronauts recounting their observations of bright particles outside the spacecraft, dated circa June 25, 1967, on pages 78-81, and page 101.</p>
