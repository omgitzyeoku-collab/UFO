  <h1>Alaska Airlines crew reported dark object near Seattle in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/19bf4f17b6c0a81dd222016c84ef7dd1062858df0cfa9e899307a842d327fa77.jpg" alt="Alaska Airlines crew reported dark object near Seattle in 2023 thumbnail" loading="lazy" />
  <p>This FAA preliminary incident report documents a February 2023 sighting by the crew of Alaska Airlines flight 688, who observed a dark object at their altitude while departing Seattle. The object was tentatively described as a possible drone or balloon, but no confirmed identification was made.</p>
  <div class="narr">On 16 February 2023, the crew of Alaska Airlines flight 688 — a Boeing 737-900 flying from Seattle to Las Vegas — reported an unidentified object to Seattle Air Route Traffic Control Centre (ARTCC). The aircraft was approximately 18 nautical miles south-southeast of Seattle-Tacoma International Airport, heading south-southeast at 10,700 feet.

The crew described the object as dark, positioned at their 2 o&#39;clock (roughly front-right), and at the same altitude as the aircraft. They tentatively characterised it as a possible drone or balloon, though this was an initial impression rather than a confirmed identification.

The flight crew took no evasive action, and no law enforcement notification was reported. The FAA&#39;s Washington Operations Centre logged the event as a preliminary report — meaning this document records the initial facts as relayed by air traffic control, not the outcome of any deeper investigation.

The coordinates in the report (47.2°N, 122.2°W) place the sighting near the Tacoma/Federal Way area of Washington state, consistent with the described position relative to Seattle.</div>
