  <h1>Airline Crew Reports Fast-Moving Lights Over Northern Maine</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/41399f2e87ae0131c59fc8a8f2298cfc0f639632ad1f45a3ccf021045bcf0d12.jpg" alt="Airline Crew Reports Fast-Moving Lights Over Northern Maine thumbnail" loading="lazy" />
  <p>An FAA preliminary report documents a sighting by a Sunwing Airlines crew on 25 February 2024, who observed multiple bright white lights at an estimated 55,000 feet near Presque Isle, Maine. The lights appeared to move rapidly and change direction, but no radar data or additional witnesses are included in the report.</p>
  <div class="narr">This document is a preliminary information report from the FAA&#39;s Washington Operations Center (reference WOC 73333). It records a UAP sighting reported by the crew of Sunwing Airlines flight 381, a Canada-registered Boeing 737-800 flying from Varadero, Cuba to Quebec City, Canada.

At approximately 2:40 a.m. Eastern time on 25 February 2024, the crew reported seeing multiple bright white lights near Presque Isle, Maine. They estimated the lights were at Flight Level 550 — roughly 55,000 feet — well above their own aircraft&#39;s maximum altitude of around 41,000 feet. The crew described the lights as moving rapidly and changing directions. The report was relayed through Boston Air Route Traffic Control Center (ARTCC).

The FAA document is marked as preliminary. It does not contain any investigation conclusions, radar data, or corroborating reports from other aircraft or ground observers. The coordinates recorded in the report (approximately 46.68°N, 68.02°W) place the sighting in northern Maine, consistent with the noted vicinity of Presque Isle.

One formatting irregularity worth noting: a second latitude field in the original report appears to contain a longitude value, suggesting a data-entry issue rather than a second location. The document shows minimal redaction.</div>
