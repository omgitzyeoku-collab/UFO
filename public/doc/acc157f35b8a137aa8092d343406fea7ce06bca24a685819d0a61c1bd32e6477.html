  <h1>Multiple Pilots Reported Unidentified Lights Over Nebraska in 2024</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/acc157f35b8a137aa8092d343406fea7ce06bca24a685819d0a61c1bd32e6477.jpg" alt="Multiple Pilots Reported Unidentified Lights Over Nebraska in 2024 thumbnail" loading="lazy" />
  <p>This FAA Washington Operations Center notification documents a UAP sighting reported by a NetJets flight and corroborated by multiple other aircraft near McCook, Nebraska on 2 March 2024. The rapidly moving lights were not detected on air traffic control radar.</p>
  <div class="narr">This document is an incident notification from the FAA Washington Operations Center — essentially an internal alert that something unusual was reported in US airspace. It is not a full investigation or a final conclusion about what was seen.

On 2 March 2024 at approximately 03:56 CST, NetJets flight 316 — a light jet flying from Las Vegas to Omaha at 41,000 feet — reported an unidentified aerial phenomenon near McCook, Nebraska. The crew described rapidly moving dim and bright lights. Denver ARTCC (Air Route Traffic Control Center), the regional air traffic control facility, was advised of the report.

Notably, multiple other aircraft in the area reported seeing similar phenomena, giving the sighting more than a single-source basis. However, the lights were not observed on any ATC radar systems, meaning there is no independent electronic corroboration of a physical object.

The document contains no follow-up investigation, no identification of the phenomenon, and no conclusion from the FAA about what the lights were. It is a preliminary operational report, not an analytical product.</div>
