  <h1>Citizen Reports Fast-Moving Objects Near McAllen, Texas in 2023</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/d693881b99d52398baa7dc8d5f0c330e0900d6a21fedf6342bd136f538720c2f.jpg" alt="Citizen Reports Fast-Moving Objects Near McAllen, Texas in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a citizen&#39;s sighting of rapidly maneuvering unidentified objects northwest of McAllen, Texas on May 31, 2023. The caller recorded two videos and reported that the objects disappeared when a commercial airplane approached. The FAA closed the case after referring the caller to the UFO reporting center.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under the code &quot;Unidentified Aerial Phenomenon.&quot; It records a call from a citizen who observed rapidly maneuvering objects northwest of McAllen, Texas, beginning at approximately 0300 on May 31, 2023. The report was logged by the FAA&#39;s Denver headquarters (HQ DEN) at 05:25 that same morning.

The caller said the objects appeared around 3:00 a.m. and recorded two videos starting around 3:30 a.m. According to the report, the objects were maneuvering in the area and disappeared whenever a commercial airplane came near.

The FAA&#39;s response was limited. Denver headquarters provided the caller with the UFO reporting center&#39;s phone number, sourced from the agency&#39;s internal reference manual (the S-Book). The report was tagged with a secondary code of &quot;NOTIFICATION-LATE,&quot; indicating a delay in filing. The case status is listed as closed, with no resolution, investigation, or explanation documented.

The airport code MFE — McAllen Miller International Airport — appears as both the origin and destination, which likely reflects the location of the sighting rather than a specific flight path. No radar data, pilot reports, or other corroborating evidence is referenced in the document.</div>
