  <h1>UPS Cargo Crew Reports Multiple Moving Lights Over New Mexico</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/10f8d32c6f371fc11528b6457d0a7a8afe3207dd2d5879cdbd28f2d8a6886c22.jpg" alt="UPS Cargo Crew Reports Multiple Moving Lights Over New Mexico thumbnail" loading="lazy" />
  <p>An FAA incident report documents a UPS Boeing 767 crew observing multiple unidentified lights moving in different directions while flying at 35,000 feet over Gallup, New Mexico on 9 October 2022. The case was closed with no explanation provided.</p>
  <div class="narr">This is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP) from pilots and air traffic controllers. It was filed under case number 237UAP00121 and categorised with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On 9 October 2022, the crew of UPS flight 917, a Boeing 767 cargo aircraft flying eastbound from Ontario, California to Louisville, Kentucky, reported seeing something unusual. At 35,000 feet over Gallup, New Mexico, starting at 0955, they observed multiple lights moving in different directions. The crew noted the lights were positioned to the left of the constellation Leo. The observation was ongoing at the time the report was filed through Albuquerque Air Route Traffic Control Center (ZAB).

The report is brief. It contains no radar data, no sensor corroboration, and no follow-up investigation details beyond the crew&#39;s initial observation. The FAA marked the case as closed without providing any resolution or explanation for what the lights were.

The reference to the constellation Leo is notable — it suggests the crew was looking at something at high altitude or possibly astronomical in origin, but the FAA made no documented determination either way. What we have here is a single pilot report, logged and filed, with no further action taken.</div>
