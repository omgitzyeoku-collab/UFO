  <h1>Pilot Reports Three Lights in Triangle Formation Near Long Island Sound</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/75f0abd1386efb72847ba7e632107dad20e31a83d11e3db338abde93673ae931.jpg" alt="Pilot Reports Three Lights in Triangle Formation Near Long Island Sound thumbnail" loading="lazy" />
  <p>This FAA incident notification records a pilot&#39;s report of three lights in a triangle formation maneuvering near Long Island Sound at roughly 20,000 feet on 15 November 2023. The document is a preliminary notification only — it contains no investigation, analysis, or explanation of what the lights were.</p>
  <div class="narr">On 15 November 2023 at 03:46 Eastern time, the FAA&#39;s Washington Operations Center logged an incident notification about unidentified aerial phenomena. The report originated from the pilot of a Piper PA-28 light aircraft, registration N2166L, flying a route from University Park, Pennsylvania (UNV) to Lawrence, Massachusetts (LWM). Boston Air Route Traffic Control Center (ARTCC) relayed the report.

The pilot described three lights arranged in a triangle formation that were maneuvering in the vicinity of Long Island Sound. The observation was made at Flight Level 200 — approximately 20,000 feet. The coordinates logged in the report (41.50°N, 74.10°W) place the sighting over southeastern New York State, which is near but not directly over Long Island Sound. The pilot took no evasive action.

The document is a standard FAA operations-centre notification — essentially a intake form that records who reported what, when, and where. It does not contain any follow-up investigation, radar data, photographs, or conclusions about what the lights were. No additional witnesses or corroborating sensor data are referenced. There is little sign of redaction; the document simply contains very limited information by design, as it is a preliminary log entry rather than an analytical report.</div>
