  <h1>DOW-UAP-PR34, Unresolved UAP Report, Greece, October 2023</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">Greece</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/7078d96f334dbf396e0e0a141f943009fe2191cd20842e16ee381bcbc2776c43.jpg" alt="DOW-UAP-PR34, Unresolved UAP Report, Greece, October 2023 thumbnail" loading="lazy" />
  <p>The United States Central Command submitted a report of an unidentified anomalous phenomenon (UAP) to the All-domain Anomaly Resolution Office (AARO) consisting of two minutes and 57 seconds of video footage from an infrared sensor aboard a U.S. military platform in 2023. An accompanying mission report, DoW-UAP-D33, described the UAP as flying near the surface of the ocean and making multiple “90-degree turns” at approximately 80 miles per hour.

Video Description:
00:04: An area of contrast enters the sensor field-of-view from the bottom left quarter of the screen.
00:07-00:19: The area of contrast moves back and forth horizontally across the field-of-view as the sensor pans to track it.
00:20-01:00: The area of contrast remains generally centered within the sensor field-of-view.
01:00-02:01: The sensor designates the area of contrast with a blue reticle, synchronizing its motion with the area of contrast’s relative position.
02:02-02:21: The sensor engages a contrast filter to better differentiate the area of contrast from the background.
02:22: The area of contrast becomes indistinguishable against the background, and the reticle drops its lock.
02:27-02:57: After losing lock, the sensor rapidly cycles zoom levels and contrast thresholds.

This video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.</p>
