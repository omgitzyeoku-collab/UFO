  <h1>U.S. Military Reports Unidentified Object Over Greece in 2023</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">Greece</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7078d96f334dbf396e0e0a141f943009fe2191cd20842e16ee381bcbc2776c43.jpg" alt="U.S. Military Reports Unidentified Object Over Greece in 2023 thumbnail" loading="lazy" />
  <p>A heavily redacted U.S. military mission report documents a brief sighting of an unidentified object flying just above the ocean surface near Greece on 27 October 2023. The object, observed for roughly three minutes by a special operations surveillance aircraft, made sharp 90-degree turns at an estimated 80 MPH before disappearing from the sensor feed.</p>
  <div class="narr">This document is a U.S. military mission report (MISREP 9329374) filed by the 33rd Special Operations Squadron, operating under Air Force Special Operations Command and U.S. Central Command. It records an unidentified anomalous phenomenon (UAP) encountered during an intelligence, surveillance, and reconnaissance (ISR) mission over Greece in October 2023. The report was originally classified until 2048 but was released early on 22 January 2026 by MG Richard A. Harrison, USCENTCOM Chief of Staff, for the benefit of the All-domain Anomaly Resolution Office (AARO).

At 0035Z on 27 October 2023, the crew spotted an object flying just above the ocean surface. They described it as seemingly circular, solid, and too small to make out details. The object was estimated to be travelling at 80 MPH and was observed making multiple sharp 90-degree turns. Its means of propulsion was listed as unknown. By 0038Z — roughly three minutes later — the object was lost from the sensor feed.

The crew assessed the UAP as benign. The report states the object was not under intelligent control, produced no detectable signatures, did not respond to the observing aircraft, and had no effect on personnel or equipment. No material was recovered, and the crew did not engage the object. Weather conditions were clear.

The aircraft was equipped with an AN/DAS-4 targeting pod and used full motion video as its primary sensor, with LINK 16 data link capability. The total mission lasted 13 hours and 30 minutes, with 6 hours 29 minutes spent on station. The aircraft took off from Larissa, Greece (ICAO code LGLR) and landed at OJMS in Jordan, indicating it transited between countries during the mission.

The document is heavily redacted throughout. Callsigns, aircraft type, tail numbers, coordinates, tasking details, and personnel names are all blacked out under multiple classification exemptions. The UAP sighting itself represents a very small portion of what was clearly a longer operational mission.</div>
