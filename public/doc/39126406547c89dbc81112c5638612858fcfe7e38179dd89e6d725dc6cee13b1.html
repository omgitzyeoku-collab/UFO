  <h1>U.S. Air Force Crew Spotted One UAP Over the Arabian Gulf in 2020</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">8/8/20</span>
    <span class="badge">Arabian Gulf</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/39126406547c89dbc81112c5638612858fcfe7e38179dd89e6d725dc6cee13b1.jpg" alt="U.S. Air Force Crew Spotted One UAP Over the Arabian Gulf in 2020 thumbnail" loading="lazy" />
  <p>A formerly classified U.S. Air Force mission report records that during a 21-hour surveillance flight over the Arabian Gulf on 8 August 2020, an operator observed a single unidentified anomalous phenomenon (UAP) moving through the area. The sighting was brief, described only as &#39;transiting,&#39; and had no reported effect on the mission.</p>
  <div class="narr">On 8 August 2020, a U.S. Air Force aircraft from the 482nd Attack Squadron took off from OKAS airfield and flew a roughly 21-hour surveillance mission over the Arabian Gulf, the Strait of Hormuz, and the Gulf of Oman. The mission supported Naval Forces Central Command (NAVCENT) and involved scanning for Iranian vessels to track their movements and activity near ports.

At 0726Z (early morning, Zulu time), the operator spotted one UAP using the aircraft&#39;s full-motion video (FMV) camera. The report describes the object only as &#39;transiting&#39; — meaning it was moving through the area — and gives no further detail on its shape, size, speed, or altitude. The report states there was no impact to the mission.

The flight was conducted under U.S. Central Command (CENTCOM) and Air Combat Command (ACC). During the mission, Iranian Air Defense hailed the aircraft on the international guard radio frequency at 1250Z; the exchange was described as professional. Dense cloud cover intermittently degraded the video feed throughout the flight.

The document is heavily redacted. The aircraft type, callsign, operator names, specific coordinates of the UAP sighting, the operation name, and various contact details are all blacked out. The aircraft&#39;s low airspeed (110 knots) and altitude (17,000 feet) are consistent with a drone or remotely piloted aircraft, which aligns with the 482nd Attack Squadron&#39;s known role, though the aircraft type itself is redacted.

The report was declassified on 20 March 2026 by Major General Richard A. Harrison, CENTCOM Chief of Staff, and released to the All-domain Anomaly Resolution Office (AARO) on 27 March 2026. It is now publicly available as Mission Report number 4592219.</div>
