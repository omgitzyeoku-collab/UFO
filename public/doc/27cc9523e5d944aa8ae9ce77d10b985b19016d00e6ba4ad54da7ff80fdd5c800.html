  <h1>Multiple Airlines Triggered Collision Alerts Over Kansas With Nothing on Radar</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/27cc9523e5d944aa8ae9ce77d10b985b19016d00e6ba4ad54da7ff80fdd5c800.jpg" alt="Multiple Airlines Triggered Collision Alerts Over Kansas With Nothing on Radar thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH report documents an incident on 5 July 2024 in which an American Airlines pilot visually spotted three slow-moving, light-grey objects at 30,000 feet, while at least six other aircraft received collision-avoidance alerts in the same area near Fort Riley, Kansas. Neither air-traffic-control radar nor military air defence could account for any of the objects, and the case was closed without explanation.</p>
  <div class="narr">This document is an FAA incident report filed under case number 237UAP00374. It records an event on 5 July 2024 at 20:35 UTC involving American Airlines flight AAL1913, an A321 flying westbound from Chicago O&#39;Hare to Phoenix at 26,000 feet.

The pilot reported that the aircraft&#39;s TCAS — the onboard Traffic Collision Avoidance System, which warns pilots of nearby aircraft — issued a resolution advisory, meaning it detected what it interpreted as traffic close enough to require evasive guidance. The pilot then visually observed three objects: a pair followed by a single object, all described as light grey, slow-moving, and travelling in the opposite direction at 30,000 feet. A United Airlines flight, UAL1687, received its own TCAS alert in the same area but the crew never saw anything.

Five more aircraft subsequently reported TCAS contacts near Fort Riley, Kansas. None of those crews achieved visual contact either. Air-traffic-control radar showed no primary or secondary returns corresponding to any of the alerts — meaning whatever triggered the collision-avoidance systems was invisible to ground radar. Western Air Defense confirmed it had no aircraft in the vicinity, and no GPS testing was known to be taking place in the area.

The FAA marked the case as closed. The report contains no resolution, no identification of the objects, and no further explanation. There is minimal redaction in the document itself.</div>
