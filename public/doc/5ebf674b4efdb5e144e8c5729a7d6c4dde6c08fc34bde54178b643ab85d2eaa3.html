  <h1>NASA Gemini 5 Crew Debriefing Cover Page Was Originally Classified</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">August 2 - September 2, 1965</span>
    <span class="badge">Cape Kennedy, Florida</span>

  <img class="thumb" src="/extract/thumbs/5ebf674b4efdb5e144e8c5729a7d6c4dde6c08fc34bde54178b643ab85d2eaa3.jpg" alt="NASA Gemini 5 Crew Debriefing Cover Page Was Originally Classified thumbnail" loading="lazy" />
  <p>This document is the cover page of Part 1 of the Gemini 5 crew debriefing transcript, derived from voice recordings of the August 1965 mission. Originally classified as Confidential, it was later declassified but carried a notice that it may still be exempt from public release under the Freedom of Information Act.</p>
  <div class="narr">This record is the cover page for Part 1 of the technical debriefing of the Gemini V flight crew. Gemini 5 was a NASA mission that ran from 2 to 29 August 1965, launched from Cape Kennedy, Florida. The debriefing transcript was derived from voice recordings of the crew.

The cover page shows the document was originally classified as Confidential, Group 4. It was later declassified under Executive Order 12065, with the declassification date rendered in the OCR text as &#39;1073&#39; — almost certainly 1978 based on the executive order&#39;s timeline. The document carries a notice stating it may be exempt from public disclosure under the Freedom of Information Act (5 U.S.C. 552).

A separate notice states that requests for release to persons outside the U.S. Government should be handled under NASA Policy Directive 1382.2, indicating controlled distribution even after declassification.

No substantive debriefing content is visible in this record — only the cover page was extracted. The actual crew testimony about what they observed during the mission is not included in this particular image.</div>
