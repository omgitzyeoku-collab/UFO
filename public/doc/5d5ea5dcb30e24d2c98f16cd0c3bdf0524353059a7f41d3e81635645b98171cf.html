  <h1>FAA Report: Commercial Pilot Saw Unidentified Lights at 50,000 Feet Over Missouri</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5d5ea5dcb30e24d2c98f16cd0c3bdf0524353059a7f41d3e81635645b98171cf.jpg" alt="FAA Report: Commercial Pilot Saw Unidentified Lights at 50,000 Feet Over Missouri thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from January 2024 documenting a commercial pilot&#39;s sighting of unidentified lights while flying at 40,000 feet over southern Missouri. The lights were estimated at 50,000–60,000 feet, moving northwest, and were not detected on air traffic control radar. The case was closed with no indication of follow-up.</p>
  <div class="narr">This document is an FAA incident report filed under the agency&#39;s SKYWATCH programme, which tracks unidentified aerial phenomena (UAP) reported by pilots and air traffic controllers. It carries the identifier 237UAP00339 and references a Mandatory Occurrence Report (MOR) logged by Memphis Air Route Traffic Control Centre (ARTCC) on 19 January 2024.

The report describes a sighting by the crew of a commercial flight operating under callsign EJA466, flying an E55P aircraft. The aircraft was southbound at flight level 400 (40,000 feet), travelling from St. Louis (STL) to an airport coded LBX. While over coordinates 36°54&#39;N, 91°51&#39;W — placing the aircraft over southern Missouri near the Arkansas border — the crew observed an unidentified aerial phenomenon off the right side of their aircraft.

The crew described the phenomenon as lights travelling northwest at an estimated altitude of flight level 500 to 600, which corresponds to roughly 50,000–60,000 feet. That altitude range is well above the ceiling of most commercial aircraft and was based solely on the pilot&#39;s visual estimate, not instrument measurement.

Air traffic control checked their radar systems and found no corresponding target — the lights did not appear on the ATC facility radar. No tail number was recorded for the reporting aircraft in the document.

The report&#39;s status is listed as closed. There is no indication in the document of any follow-up investigation, resolution, or determination of what the lights were. The level of redaction in the document is low.</div>
