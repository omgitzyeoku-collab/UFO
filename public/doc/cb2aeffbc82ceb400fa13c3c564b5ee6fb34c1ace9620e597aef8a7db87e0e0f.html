  <h1>American Airlines Crew Reports Shiny Object High Above Tennessee</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/cb2aeffbc82ceb400fa13c3c564b5ee6fb34c1ace9620e597aef8a7db87e0e0f.jpg" alt="American Airlines Crew Reports Shiny Object High Above Tennessee thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents a UAP sighting by the crew of American Airlines Flight 421 on 14 March 2023. While flying at 35,000 feet near Nashville, Tennessee, the crew observed a shiny white object with amber-coloured lights positioned significantly higher than their aircraft. No identification or follow-up analysis is included in this document.</p>
  <div class="narr">On 14 March 2023, the crew of American Airlines Flight 421 — an Airbus A321 flying from Las Vegas to Charlotte — reported an unidentified aerial phenomenon (UAP) to air traffic control. The aircraft was cruising at 35,000 feet, approximately 25 nautical miles south of Nashville, Tennessee, when the crew spotted the object.

The crew described a shiny white object with amber-coloured lights, visible at roughly the 11:30 clock position relative to the aircraft — meaning slightly to the left and ahead. They reported the object was significantly higher than their own cruising altitude of 35,000 feet, though no exact altitude for the object was determined.

The sighting was relayed through Memphis ARTCC (Air Route Traffic Control Center), the FAA facility responsible for managing high-altitude traffic in that region. The FAA&#39;s Washington Operations Center logged the report as a preliminary information filing.

This document is a notification record, not a completed investigation. It contains no follow-up analysis, no radar data, no case resolution, and no attempt to identify the object. The report ends where the initial crew notification ends.</div>
