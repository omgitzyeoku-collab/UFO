  <h1>Multiple Aircraft Report Erratic UAP Near Walnut Ridge, Arkansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/09d0314bc2085b2e3014d0b7efe63da764288d720970fce42d680d1c032d801b.jpg" alt="Multiple Aircraft Report Erratic UAP Near Walnut Ridge, Arkansas thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents an incident on November 8, 2023, in which multiple aircraft reported an unidentified aerial phenomenon changing altitudes erratically between 28,000 and 45,000 feet near Walnut Ridge, Arkansas. No evasive action was taken and no follow-up investigation is included in this document.</p>
  <div class="narr">On the evening of November 8, 2023, at 8:55 PM Central time, Memphis ARTCC (Air Route Traffic Control Center) reported that multiple aircraft had observed an unidentified aerial phenomenon approximately 80 nautical miles northwest of Walnut Ridge Regional Airport in Arkansas. The coordinates given place the incident at 36.94°N, 91.95°W.

According to the FAA&#39;s Washington Operations Center report, the object was changing altitudes erratically between flight levels 280, 340, and 450 — roughly 28,000 to 45,000 feet. That altitude range sits squarely in the zone used by commercial airliners. Despite the sighting, no aircraft took evasive action in response.

Law enforcement was not notified about the incident. The document is a preliminary information report only — it records what was observed and reported, but contains no follow-up investigation, case resolution, or explanation of what the phenomenon was. No radar or sensor data is referenced.

The report provides no description of the object&#39;s size, shape, colour, or appearance beyond its altitude behaviour. It is filed under reference WOC 7-3333 RC/JA. This is a raw operational record, not an analytical assessment or conclusion.</div>
