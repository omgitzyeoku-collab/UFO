  <h1>Delta crew reported unidentified object at 23,400 feet over Georgia</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/99acedc30ecf8c552fc0a2d2c586a1751672c5a0115875d6625d18032a5fb786.jpg" alt="Delta crew reported unidentified object at 23,400 feet over Georgia thumbnail" loading="lazy" />
  <p>This FAA operations-centre log records that the crew of Delta Air Lines flight 1706, a Boeing 717-200, reported seeing an unidentified anomalous phenomenon while flying at roughly 23,400 feet near Rutledge, Georgia on 14 April 2024. No evasive action was taken and no law-enforcement notification was filed.</p>
  <div class="narr">This document is a preliminary incident notification from the FAA&#39;s Washington Operations Center (WOC). It logs a report relayed from the Eastern Regional Operations Center (E-ROC) about a UAP — unidentified anomalous phenomenon — sighted by a commercial airline crew.

On 14 April 2024 at approximately 7:40 a.m. Eastern time, the crew of Delta Air Lines flight 1706, operating a Boeing 717-200 on the Atlanta-to-Charlotte route, reported observing a UAP at flight level 234 — roughly 23,400 feet. The sighting occurred near an aviation waypoint called PHIIL, in the vicinity of Rutledge, Georgia (coordinates 33.63°N, 83.61°W).

The log notes that no evasive action was taken by the aircraft and that no law-enforcement notification was reported. There is no description of the object&#39;s shape, size, movement, or behaviour in the document.

The record is a short operational log entry, not a full investigation report. It contains no radar data, sensor evidence, photographs, or follow-up findings. It simply confirms that the crew made the report and that it was logged through standard FAA channels.</div>
