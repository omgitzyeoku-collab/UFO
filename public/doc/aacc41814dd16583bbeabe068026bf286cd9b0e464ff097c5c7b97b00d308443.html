  <h1>Apollo 11 Crew Reported Three Unusual Sightings During Moon Mission</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">1969</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/aacc41814dd16583bbeabe068026bf286cd9b0e464ff097c5c7b97b00d308443.jpg" alt="Apollo 11 Crew Reported Three Unusual Sightings During Moon Mission thumbnail" loading="lazy" />
  <p>A originally-classified NASA debriefing from July 31, 1969 records the Apollo 11 crew describing three unexplained observations during their mission: an L-shaped object seen en route to the Moon, repeated light flashes inside the darkened cabin, and a bright light from lunar orbit later attributed to sunlight reflecting off water. The crew offered no definitive explanations and in some cases suspected mundane origins.</p>
  <div class="narr">On July 31, 1969, NASA conducted a technical debriefing with the Apollo 11 crew — Armstrong, Aldrin, and Collins — that was originally classified Confidential. Excerpts from that debriefing describe three unusual things the astronauts saw during the mission.

The first was an unidentified object spotted roughly one day out from the Moon. Through a monocular it appeared L-shaped; Armstrong compared it to &quot;an open suitcase.&quot; Through the sextant, depending on focus, it looked like a cylinder or two connected rings. Ground control confirmed the spent S-IVB rocket stage was 6,000 miles away, making it an unlikely candidate. The crew ruled out a urine dump as the source, but Collins noted that &quot;in the back of my mind, I have some reason to suspect that its origin was from the spacecraft&quot; itself — suggesting a piece of their own hardware may have been responsible.

The second observation involved repeated flashes of light inside the darkened cabin, seen over multiple nights. Armstrong spent about an hour watching carefully and counted roughly 50 flashes, averaging about one per minute. Aldrin saw single and double flashes, sometimes appearing as a line. Both astronauts hypothesised that subatomic particles were penetrating the spacecraft and producing visible emissions. This phenomenon was later confirmed on subsequent Apollo missions as cosmic ray visual effects — charged particles passing through the astronauts&#39; eyes.

The third sighting was a bright light observed from lunar orbit, initially suspected to be a laser. On the return trip approaching Earth, the crew saw something similar and revised their assessment: it appeared to be sunlight reflecting off a smooth body of water, such as a lake. Aldrin also reported once seeing what looked like an image of Mars coming from a dark region of the Moon, which he assessed as an optical illusion.</div>
