  <h1>NASA-UAP-D4, Apollo 11 Technical Crew Debriefing, 1969</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">1969</span>
    
    
  </div>
  <img class="thumb" src="/extract/thumbs/aacc41814dd16583bbeabe068026bf286cd9b0e464ff097c5c7b97b00d308443.jpg" alt="NASA-UAP-D4, Apollo 11 Technical Crew Debriefing, 1969 thumbnail" loading="lazy" />
  <p>Apollo 11 was the third crewed mission to the Moon and the first to land Astronauts on the lunar surface. This document is an excerpt from the Apollo 11 Technical Crew Debriefing (Volumes 1 and 2) from July 31, 1969. The document highlights three observations: one, an object on the way out to the Moon; two, flashes of light inside the cabin; and three, a sighting on the return trip of a bright light tentatively assumed by the crew to be a laser.

•	Page 6-33 (Vol. 1). [Lunar Module Pilot for Apollo 11, Buzz Aldrin]: “The first unusual thing that we saw I guess was 1 day out or something pretty close to the moon. It had a sizeable dimension to it, so we put the monocular on it.” The crew speculated that it could have been the S-IVB stage of the Saturn V launch vehicle.
•	Page 6-37 (Vol. 1). [Lunar Module Pilot for Apollo 11, Buzz Aldrin] “The other observation that I made accumulated gradually. I don’t know whether I saw it the first night, but I’m sure I saw it the second night. I was trying to go to sleep with all the lights out. I observed what I thought were little flashes inside the cabin, spaced a couple of minutes apart…”
•	Page 21-1 (Vol. 2). [Lunar Module Pilot for Apollo 11, Buzz Aldrin] “I observed what appeared to be a fairly bright light source which we tentatively ascribed to a possible laser.”</p>
