  <h1>Pentagon Office Released 27 Years of UAP Reporting Trend Data</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0e5c005deecc9d5736c325c9c9521c3d4e0ed60c77417981987cac5a610f8f58.jpg" alt="Pentagon Office Released 27 Years of UAP Reporting Trend Data thumbnail" loading="lazy" />
  <p>The All-Domain Anomaly Resolution Office (AARO) compiled an analytical briefing covering UAP reporting trends from 1996 through November 2023, organised into four categories: altitudes, characteristics, morphology (shapes), and geographic hotspots. The document was cleared for publication in November 2023 and released in full in February 2025 under congressional mandate.</p>
  <div class="narr">In February 2025, the Pentagon&#39;s All-Domain Anomaly Resolution Office — known as AARO — publicly released a briefing document cataloguing trends in reports of unidentified anomalous phenomena (UAP) spanning nearly three decades, from 1996 through 20 November 2023. The release was mandated by the FY24 National Defense Authorization Act, codified at 44 U.S.C. 2107, and the document was released in full with no redactions.

The briefing organises its analysis into four categories: the altitudes at which UAP were reported, the characteristics typically described by observers, the morphology (meaning the shapes or forms reported), and geographic hotspots where sightings clustered. The underlying data — likely presented as charts and figures in the original PDF — is not captured in the text extraction, so the specific numbers, shapes, and locations are not available in text form.

The document was reviewed by the AARO Chief of Staff and determined to be unclassified. It had been cleared for open publication on 21 November 2023 by the Department of Defense Office of Prepublication and Security Review, though the actual public release did not occur until February 2025. The case number assigned is 330UAP000024.

This is an analytical summary produced by AARO, not a collection of raw incident reports. It represents AARO&#39;s own interpretation and categorisation of the underlying reporting data.</div>
