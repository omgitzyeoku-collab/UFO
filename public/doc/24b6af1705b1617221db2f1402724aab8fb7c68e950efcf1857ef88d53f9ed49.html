  <h1>Commercial Pilot Reports Five High-Altitude Craft Over Colorado</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/24b6af1705b1617221db2f1402724aab8fb7c68e950efcf1857ef88d53f9ed49.jpg" alt="Commercial Pilot Reports Five High-Altitude Craft Over Colorado thumbnail" loading="lazy" />
  <p>An FAA incident report documents a Sun Country Airlines crew observing five unidentified craft with white lights moving erratically at 60,000–80,000 feet over Colorado in February 2024. The objects did not appear on air traffic control radar, and the case was closed without explanation.</p>
  <div class="narr">This is an FAA SKYWATCH incident report — a formal filing used when pilots report unidentified aerial phenomena to the Federal Aviation Administration. It documents what the crew of a Sun Country Airlines Boeing 737-800 (callsign SCX3053) saw on 4 February 2024 while flying a commercial route from Portland to Fort Worth.

The aircraft was cruising southeast-bound at 41,000 feet, approximately 60 nautical miles southeast of Montrose, Colorado. The crew reported seeing what appeared to be five separate craft with white lights, moving sporadically at altitudes between FL600 and FL800 — that is, roughly 60,000 to 80,000 feet. For context, that altitude range is well above the service ceiling of nearly all known conventional aircraft.

Air traffic control checked their radar systems and found nothing. The report explicitly states the objects were not observed on ATC facility radar. No tail number was recorded for the reporting aircraft.

The FAA marked the case as closed (reference MOR ID: ZDV-M-2024/02/04-0001). No resolution or explanation is provided in the document. The report contains minimal redaction but also minimal investigation — it records what the crew reported and stops there.</div>
