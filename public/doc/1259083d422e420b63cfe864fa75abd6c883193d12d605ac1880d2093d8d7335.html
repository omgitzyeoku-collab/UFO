  <h1>DOS-UAP-D001, Diplomatic Cable, Brazil, November 14, 1963</h1>
  <div class="meta">
    <span class="badge">Department of State</span>
    <span class="badge">11/14/63</span>
    <span class="badge">Bahia, Brazil</span>
    
  </div>
  
  <p>This document is a U.S. Department of State diplomatic cable from the U.S. Embassy in Rio de Janeiro, Brazil to the Office of the Secretary of State in Washington, D.C., on November 14, 1963. This cable documents an effort by the Embassy to verify that the Department had assessed certain content published in a local newspaper as inauthentic, following a discussion on a poor-quality telephone connection the previous night.

To ensure both offices were referencing the same reporting, the cable cites descriptive language paraphrased from the press, namely a “large metal manned balloon” and a “dead crewman aboard wearing [a] uniform or spacesuit with strange markings.” The cable concludes with the embassy’s understanding that an object assessed to be a weather balloon had been reported in the vicinity, but that no such object had been found to have crashed. A follow-on correspondence regarding the alleged incident is included in this collection under the title “DOS-UAP-D002.”</p>
