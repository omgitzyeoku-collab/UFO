  <h1>FAA Report: Commercial Crew Saw Bright Lights Above 40,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c0cae2f801869461cd0c6b8447843db2c974e4a280df959ee323fe4027378aab.jpg" alt="FAA Report: Commercial Crew Saw Bright Lights Above 40,000 Feet thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a commercial aircraft crew observing bright circling lights maneuvering at 40,000–60,000 feet on 5 August 2023, while flying at 31,000 feet off the coast of Jacksonville, Florida. The case was closed with no explanation provided.</p>
  <div class="narr">This is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP) from pilots and air traffic controllers. It was filed under case number 237UAP00284 and classified with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On 5 August 2023, the crew of a commercial flight with callsign SWG6415, travelling from Havana, Cuba to Toronto, Canada, reported observing something unusual. While cruising at 31,000 feet, the crew spotted bright circling lights above them, estimated between flight level 400 and flight level 600 — roughly 40,000 to 60,000 feet. That altitude range sits in the upper atmosphere, well above where commercial aircraft normally fly. The lights were described as maneuvering, and the sighting lasted approximately one to two minutes. The location was logged as 127 nautical miles out on the 070-degree radial from Craig Airport in Jacksonville, Florida.

The report is thin on follow-up. The case status is marked as &quot;Closed,&quot; but no resolution or explanation is provided in the document. There is no mention of radar data corroborating what the crew saw, no additional witness statements, and no indication that military sensors or other assets were tasked to investigate.

The aircraft&#39;s tail number field is blank, which limits the ability to independently verify which specific aircraft was involved, though the callsign and route details are recorded. The document shows low signs of redaction — the information appears sparse by design rather than blacked out.</div>
