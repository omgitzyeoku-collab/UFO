  <h1>Harvard and Pentagon Scientists Derive Physics Tests for UAP Claims</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7bc28b12beae2629235f56327104313c95e3bd72837b1113d1e5a4233417e9b5.jpg" alt="Harvard and Pentagon Scientists Derive Physics Tests for UAP Claims thumbnail" loading="lazy" />
  <p>This 2023 academic paper, co-authored by Harvard astronomer Avi Loeb and the Pentagon&#39;s UAP office director Sean Kirkpatrick, uses standard physics to calculate what signatures a genuinely fast-moving UAP should produce — and argues that the absence of those signatures in most sightings likely means the speed estimates are wrong, not that the objects defy physics.</p>
  <div class="narr">In March 2023, Abraham (Avi) Loeb of Harvard University and Sean M. Kirkpatrick, then director of the All-domain Anomaly Resolution Office (AARO) at the Pentagon, drafted an academic-style paper applying basic physics to Unidentified Aerial Phenomena (UAP) observations. The paper was cleared for open publication by the Department of Defense and carries case number 330UAP000002. It was released under the authority of the FY24 National Defense Authorization Act (codified at 44 U.S.C. 2107), with a classification review completed on 5 February 2025.

The paper&#39;s central argument is straightforward: any object moving at supersonic speeds through Earth&#39;s atmosphere must, according to known physics, produce a bright optical fireball, an ionisation shell, and detectable radio signatures. It calculates, for example, that a 10-square-metre object travelling at 10 km/s at 10 km altitude would radiate roughly 150 gigawatts of optical energy — about 10% of its roughly 1.5-terawatt mechanical power output. The ionisation would make the object visible to standard radar in the L, S, C, and X radio bands. Since most UAP reports lack these expected signatures, the authors conclude the most likely explanation is inaccurate distance and velocity measurements from single-site sensors that lack proper range-finding capability, particularly infrared (FLIR) pods that have no direct range data.

The paper also explores hypothetical scenarios involving interstellar objects. It discusses &#39;Oumuamua, discovered by the Pan-STARRS telescope on 19 October 2017, and two interstellar meteors designated IM1 (estimated diameter 0.45 metres, velocity 60 km/s) and IM2. It introduces a thought experiment — not a claim of observation — in which an interstellar parent craft could release small probes, likened to dandelion seeds, during a close passage to Earth. The authors note that chemical propulsion limits human spacecraft to roughly tens of km/s, and that any interstellar devices reaching Earth would likely be unmanned, since biological entities probably could not survive the radiation environment of deep space.

The paper was funded in part by the Galileo Project at Harvard, conducted in partnership with AARO. Despite the institutional weight of having the AARO director as co-author, the speculative sections on interstellar probes and self-replicating devices go well beyond AARO&#39;s official findings. The document contains no classified material and reports no new UAP sighting data — its value is analytical, offering a physics-based framework for evaluating future claims.</div>
