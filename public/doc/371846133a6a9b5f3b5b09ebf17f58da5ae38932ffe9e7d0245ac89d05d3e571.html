  <h1>FAA Report: Commercial Jet Crew Spotted Unidentified Object at 43,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/371846133a6a9b5f3b5b09ebf17f58da5ae38932ffe9e7d0245ac89d05d3e571.jpg" alt="FAA Report: Commercial Jet Crew Spotted Unidentified Object at 43,000 Feet thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a commercial aircraft crew observing an unidentified aerial phenomenon while flying at 43,000 feet over the Akron-Canton area on 20 June 2021. The crew provided no physical description of the object, no radar or sensor data is mentioned, and the case was closed without further detail.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAPs) in US airspace. It was filed under case number 237UAP00058 and is classified with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On 20 June 2021 at 20:05, the crew of a Cessna Citation Excel (a mid-size business jet) with callsign SLH4, operated by SLH, reported observing something unidentified while flying east-northeast at flight level 430 — roughly 43,000 feet. The aircraft was en route from Lincoln, Nebraska to Newark. At the time of the sighting, the aircraft was over the Akron-Canton (ACO) area.

The phenomenon was reported at approximately the same altitude as the aircraft. Beyond that, the flight crew provided no physical description whatsoever — no shape, size, colour, or behaviour. The direction the object was travelling is listed as unknown.

The report notes that law enforcement was not notified. A person identified only as &quot;JH&quot; was notified, though the document gives no context for who JH is or what role they serve. The aircraft&#39;s tail number field is blank, which limits independent verification of the specific aircraft involved. The case status is listed as closed.

No radar data, photographs, or additional sensor confirmation is mentioned anywhere in the report. This is a single-source account from the flight crew, recorded on a standard FAA form, with no apparent follow-up investigation documented.</div>
