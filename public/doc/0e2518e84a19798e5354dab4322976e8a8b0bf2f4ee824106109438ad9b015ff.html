  <h1>Pilot at 32,000 Feet Reported Flashing Light Well Above Aircraft</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0e2518e84a19798e5354dab4322976e8a8b0bf2f4ee824106109438ad9b015ff.jpg" alt="Pilot at 32,000 Feet Reported Flashing Light Well Above Aircraft thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH report documents a September 2022 incident in which a CRJ2 aircraft crew flying at 32,000 feet observed a single flashing light approximately 100 nautical miles north of Nashville, described as being well above their altitude. The case was closed with no identification or explanation recorded.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP) from pilots and air traffic controllers. It was filed through the Memphis Center (ZME) facility.

On 12 September 2022 at 04:19 UTC, a CRJ2 aircraft flying under callsign N500PR was heading westbound at flight level 320 (approximately 32,000 feet), positioned 4 nautical miles north of the HCH navigation point. The crew reported seeing one flashing light roughly 100 nautical miles north of Nashville (BNA). They described the light as being &quot;well above the aircraft&#39;s altitude&quot; — meaning it appeared to be significantly higher than 32,000 feet. The aircraft was travelling from SVH to PUB and was classified as general aviation.

The FAA&#39;s Area Watch Officer (AWO) was notified, and the on-call process was triggered (the report notes &quot;Paged: YES&quot;). Despite these steps, the case status is listed as &quot;Closed&quot; with no resolution or identification of the phenomenon recorded in the document.

Several fields in the report — including tail number, operator name, and new destination — are blank. It is unclear whether these were redacted or simply never filled in. The report&#39;s internal tracking ID (MOR ID) carries a date of 11 September, while the report itself is timestamped 12 September UTC, suggesting the observation may have occurred late on the 11th and was logged after midnight UTC.</div>
