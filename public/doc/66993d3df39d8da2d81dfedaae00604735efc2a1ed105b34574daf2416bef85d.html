  <h1>Official Biography of AARO Acting Director Timothy Phillips Released</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/66993d3df39d8da2d81dfedaae00604735efc2a1ed105b34574daf2416bef85d.jpg" alt="Official Biography of AARO Acting Director Timothy Phillips Released thumbnail" loading="lazy" />
  <p>This document is the official biography of Timothy A. Phillips, who became Acting Director of the Pentagon&#39;s UAP investigation office (AARO) in October 2023. It details his 40-plus years of government and military service but contains no information about UAP sightings or investigations.</p>
  <div class="narr">This record from the Office of the Secretary of Defense is the official biography of Timothy A. Phillips, who took over as Deputy Director and Acting Director of the All-domain Anomaly Resolution Office (AARO) in October 2023. AARO is the Pentagon office responsible for investigating unidentified anomalous phenomena (UAP) reports from across the US military and intelligence community.

Phillips brought substantial credentials to the role. He is a Senior National Intelligence Service executive, a rank he has held since 2006, with over 40 years of government experience across senior Intelligence Community assignments. He is also a retired US Marine Corps Lieutenant Colonel who served in peacekeeping, humanitarian, or combat operations in Lebanon, Somalia, Kuwait, and Iraq, as well as with Joint Task Force Bravo and JTF 510.

His academic background includes a BA in Political Science from the University of Arizona, a Master of Military Science from Marine Corps University, and a Master&#39;s in Business and Information Resources Management from Webster University. He also served as a National Intelligence Fellow on the Council on Foreign Relations.

The document was cleared for open publication on 17 November 2023 by the DoD Office of Prepublication and Security Review. It was released in full with no redactions, under authority of the FY24 National Defense Authorization Act (codified at 44 U.S.C. 2107), and carries case number 330UAP000014.</div>
