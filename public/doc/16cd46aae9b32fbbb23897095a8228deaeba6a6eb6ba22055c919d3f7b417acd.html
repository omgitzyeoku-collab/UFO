  <h1>Pentagon Office Explains How Optical Illusions Distort UAP Sightings</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>In May 2024, the All-domain Anomaly Resolution Office (AARO) published an educational paper explaining how two common optical effects — forced perspective and parallax — frequently account for reports of unusually large or fast-moving UAPs. The paper does not analyze any specific incident but lays out AARO&#39;s analytical framework, while noting these effects do not explain all UAP reports.</p>
  <div class="narr">In May 2024, the Pentagon&#39;s All-domain Anomaly Resolution Office (AARO) released an information paper addressing a recurring problem in UAP (Unidentified Anomalous Phenomena) investigations: witnesses and sensors often report objects that appear impossibly large or fast, when optical illusions may be responsible.

The paper focuses on two effects. The first, forced perspective, is the same trick used in photography to make someone appear to hold up the Leaning Tower of Pisa. When an object has no recognizable features — no windows, wings, or surface details — observers cannot judge its distance, and therefore misjudge its size. AARO uses the example of a featureless 10-foot sphere at an unknown distance: without reference points, a witness might describe it as far larger than it actually is. Observers often compare unknown objects to clouds, trees, or buildings, which are unreliable size references.

The second effect, parallax, occurs when a stationary object appears to move because the observer is on a fast-moving platform, such as an aircraft. The faster the sensor platform moves, the faster a stationary or slow-moving object appears to travel. Electronic sensors on airborne platforms are also susceptible to this — if the sensor is too far away to estimate range, it can misinterpret an object&#39;s true size and speed. The parallax angle drops to zero only when the observer is directly above the object, which is the one position that allows accurate perception of location.

AARO explicitly states that not all reports of fast-moving UAPs are attributable to these effects. The paper also emphasizes that single-observer or single-sensor reports, while more susceptible to these illusions, remain critical to AARO&#39;s analyses and can supplement additional sensor data to build a fuller picture.

This is an educational document, not a case file. It contains no specific UAP incidents, no sensor data, and no classified material. It represents AARO&#39;s methodological approach to evaluating sighting reports.</div>
