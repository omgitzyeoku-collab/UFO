  <h1>Two Flight Crews Reported Fast Illuminated Object at 50,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/fbf8dbcee8c0addc9dca35c5f842a48101510a1a5d14522b8fc5deb55994c9a2.jpg" alt="Two Flight Crews Reported Fast Illuminated Object at 50,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a July 2015 sighting in which two separate aircraft crews reported an illuminated unidentified object travelling at high speed from west to east at roughly 50,000 feet altitude, approximately 150 nautical miles north of the SWL navigational beacon. The case was closed with no explanation recorded.</p>
  <div class="narr">On 24 July 2015, two aircraft — identified by call signs N605WG and AVA020 — reported observing an unidentified flying object while under the watch of Washington Air Route Traffic Control Center (ZDC). The object was located approximately 150 nautical miles north of the SWL VORTAC, a ground-based navigational aid.

According to the report, the object was illuminated and travelling at a high rate of speed from west to east at roughly flight level 500 — approximately 50,000 feet. That altitude sits near the ceiling of most conventional aircraft and well above normal commercial traffic.

The report notes that no other descriptive details were provided beyond the object&#39;s illumination and its direction and speed of travel. The Eastern Air Defense Sector (EADS) was advised of the sighting.

The FAA classified this incident under the primary code &quot;OTHER&quot; and marked the case as closed. No resolution, identification, or follow-up findings appear in the document. The incident occurred in 2015 but was released publicly as part of the 2023 PURSUE collection from the Department of War.</div>
