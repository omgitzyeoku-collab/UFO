  <h1>American Airlines Pilot Reported Three Unidentified Lit Objects at 32,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c81edc3a33304660a902d0afe80e21cb142772f3224bebeb7a9c0d275fc1bffa.jpg" alt="American Airlines Pilot Reported Three Unidentified Lit Objects at 32,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a commercial pilot on American Airlines flight AAL2347 observing three well-lit unidentified objects above the aircraft at 32,000 feet on 13 September 2022. The case was closed with no explanation or resolution provided.</p>
  <div class="narr">On 13 September 2022, at 04:45, the pilot of American Airlines flight AAL2347 — a commercial aircraft flying northwest-bound at 32,000 feet — reported an unidentified aerial phenomenon to the FAA. The aircraft was near the MMB navigational fix, in airspace managed by the Kansas City Air Route Traffic Control Center (ZKC).

The pilot described seeing three distinct, well-lit objects above and to the right of the aircraft. Notably, the pilot stated the objects were not behaving as they would expect satellites to behave, suggesting deliberate or unusual movement.

The FAA initiated a Mandatory Occurrence Report (MOR ID: ZKC-M-2022/09/13-0001) in response to the sighting. No corroborating radar data or additional witness accounts are included in the report. No tail number was recorded for the reporting aircraft, which is unusual for FAA documentation.

The case status is marked as &quot;Closed,&quot; but the report provides no resolution, identification, or explanation for what the pilot observed. The document contains minimal redaction, but the lack of follow-up detail means there is simply very little information beyond the pilot&#39;s own account.</div>
