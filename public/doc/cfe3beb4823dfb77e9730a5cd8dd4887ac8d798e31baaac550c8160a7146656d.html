  <h1>Pentagon UFO Office Briefed Senate on Orb Sightings and Sensor Trends</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/cfe3beb4823dfb77e9730a5cd8dd4887ac8d798e31baaac550c8160a7146656d.jpg" alt="Pentagon UFO Office Briefed Senate on Orb Sightings and Sensor Trends thumbnail" loading="lazy" />
  <p>This 2023 briefing by the All-Domain Anomaly Resolution Office (AARO) to the Senate Armed Services Committee summarises UAP reporting trends from 1996 to 2023, profiles the typical characteristics of reported objects, and walks through two specific cases — one unresolved metallic orb in the Middle East and one in South Asia likely explained as a commercial aircraft with a camera artifact.</p>
  <div class="narr">In 2023, the Pentagon&#39;s All-Domain Anomaly Resolution Office (AARO), led by director Seán Kirkpatrick, briefed the Senate Armed Services Committee on patterns in unidentified anomalous phenomena (UAP) reports spanning 1996 to 2023. The briefing was cleared for public release on 17 April 2023, though it was not reviewed for declassification until February 2025. AARO operates under the authority of the FY24 National Defence Authorisation Act, codified at 44 U.S.C. 2107.

The briefing describes what a &quot;typical&quot; reported UAP looks like based on aggregate data: a round or spherical object (52% of reports), 1 to 4 metres across, white, silver, or translucent, flying at 10,000 to 30,000 feet, at speeds from stationary up to Mach 2. Notably, no thermal exhaust from propulsion has been detected in these reports. Radar signatures are intermittent and appear in the X-Band (8–12 GHz) range, and thermal signatures are also intermittent, showing up in shortwave and medium-wave infrared.

Two specific cases are presented. The first is a 2022 incident in the Middle East where an MQ-9 drone&#39;s electro-optical sensors captured a metallic, spherical object. AARO assessed it showed no enigmatic technical capabilities and no apparent threat to aircraft safety, but the case remains officially unresolved and sits in AARO&#39;s active archive, where it is used for trend and statistical analysis. The second case is a 2023 MQ-9 observation in South Asia. Analysis of the object&#39;s shape and air-traffic-control data suggested it was a commercial aircraft on a known flight path. The apparent wake trail behind it was attributed to a video-compression artifact — the camera software overlaying a captured image onto the previous frame, creating a visual distortion in the infrared gradient. At the time of the briefing, this resolution was pending peer review.

The document is a briefing deck — a set of summarised bullet points — rather than a detailed analytical report. It contains little redaction, but its brevity means much of the underlying data and analysis is not shown.</div>
