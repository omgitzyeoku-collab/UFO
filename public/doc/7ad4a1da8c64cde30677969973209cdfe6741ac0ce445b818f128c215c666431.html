  <h1>United Airlines Crew Reports Unexplained Lights at 35,000 Feet Near Sioux Falls</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7ad4a1da8c64cde30677969973209cdfe6741ac0ce445b818f128c215c666431.jpg" alt="United Airlines Crew Reports Unexplained Lights at 35,000 Feet Near Sioux Falls thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a sighting by the crew of United Airlines flight 2059 on 11 February 2023. While flying eastbound at 35,000 feet, approximately 25 nautical miles south of Sioux Falls, South Dakota, the crew observed lights appearing and disappearing at or above their altitude. The FAA closed the case without providing any explanation.</p>
  <div class="narr">On 11 February 2023, the crew of United Airlines flight 2059 — a commercial flight travelling eastbound at flight level 350 (approximately 35,000 feet) — reported an unidentified aerial phenomenon to air traffic control. The sighting occurred roughly 25 nautical miles south of Sioux Falls, South Dakota, and was logged by Minneapolis Center (ZMP), the FAA facility covering that airspace.

The crew described lights at their 12 o&#39;clock position — directly ahead — that were &quot;coming and going&quot; at or above their cruising altitude. No further detail about the lights&#39; colour, size, movement pattern, or duration is recorded in the document.

The FAA filed the encounter as a SKYWATCH Incident Report, classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot; The report notes the sighting was paged out (flagged for attention), but the case status is simply marked &quot;Closed.&quot; No analysis, explanation, or follow-up findings appear in the document.

The record contains no corroborating radar data, no additional witness statements, and no aircraft tail number. It is a single-page pilot report — a record that the sighting was made, not an investigation into what was seen.</div>
