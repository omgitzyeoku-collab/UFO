  <h1>FAA Report: Pilot Saw Three Lights at 45,000 Feet Over Atlantic</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/366c1e16639b3b8ecd2bf946dc10b305c72f40507d5d7758bb61e444cf296889.jpg" alt="FAA Report: Pilot Saw Three Lights at 45,000 Feet Over Atlantic thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a general aviation pilot&#39;s sighting of an unidentified aerial phenomenon while flying from London Luton to Fort Lauderdale on 14 August 2022. The crew reported three lights in a row, with additional lights above them, observed off the left side of the aircraft at 45,000 feet roughly 195 nautical miles south of Wilmington, North Carolina. The case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena from pilots and air traffic controllers. It was filed under the identifier 237UAP00104 and classified with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On 14 August 2022 at 05:40, the crew of aircraft N728HG reported seeing something unusual while flying southwest-bound at flight level 450 (45,000 feet). The aircraft was approximately 195 nautical miles south of Wilmington, North Carolina (airport code ILM), on a general aviation flight from London Luton Airport (EGGW) in England to Fort Lauderdale (FLL) in Florida.

The crew described seeing an unidentified aerial phenomenon off the left side of their aircraft. They reported it as three lights arranged in a row, with additional lights above them that they described as being in a &quot;geosynchronous orbit.&quot; The sighting was reported through Jacksonville Center (ZJX), the FAA air traffic control facility covering that region, and a reference office designated AWO/TY was advised.

The report&#39;s status is marked as closed. Notably, no resolution or explanation for the sighting is provided anywhere in the document. There is no indication that radar data, independent witness accounts, or any follow-up analysis was included or conducted. The FAA&#39;s processing office for this report was Denver (DEN).</div>
