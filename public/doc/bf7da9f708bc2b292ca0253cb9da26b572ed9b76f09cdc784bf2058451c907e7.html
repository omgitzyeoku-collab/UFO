  <h1>Spirit Airlines crew reported UAP over the Bahamas at 38,000 feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bf7da9f708bc2b292ca0253cb9da26b572ed9b76f09cdc784bf2058451c907e7.jpg" alt="Spirit Airlines crew reported UAP over the Bahamas at 38,000 feet thumbnail" loading="lazy" />
  <p>This FAA preliminary notification records that the crew of Spirit Airlines flight 1900, an Airbus A319 flying from Puerto Rico to Orlando, reported an unidentified anomalous phenomenon (UAP) near the Bahamas on 27 June 2023 while cruising at 38,000 feet. No evasive action was taken, no description of the object was provided, and no investigation is documented.</p>
  <div class="narr">On 27 June 2023, just after midnight local time, the crew of Spirit Airlines flight 1900 — an Airbus A319 en route from Aguadilla, Puerto Rico to Orlando, Florida — reported a UAP to air traffic control while flying northwest at approximately 38,000 feet. The sighting occurred near waypoint MYSM, in the vicinity of Cockburn Town in the Bahamas, at coordinates roughly 24.05°N, 74.53°W.

Miami Air Route Traffic Control Center (ARTCC) relayed the crew&#39;s report to FAA Operations in Washington. The document is a standard preliminary notification from the FAA Washington Operations Center — essentially an initial intake form, not an investigation or analysis.

The report notes that no evasive action was taken by the aircraft and no law enforcement was notified. Notably, the document contains no description whatsoever of what the crew saw — no shape, size, colour, movement, or behaviour of the object is recorded.

This is a single-page administrative record. It captures only the fact that a report was made and the basic flight details. There is no indication of follow-up investigation, radar data, or corroborating sensor evidence in this document.</div>
