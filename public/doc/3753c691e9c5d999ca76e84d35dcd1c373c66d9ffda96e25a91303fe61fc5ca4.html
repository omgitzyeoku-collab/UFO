  <h1>Frontier Airlines Crew Reports Unexplained Lights at 35,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/3753c691e9c5d999ca76e84d35dcd1c373c66d9ffda96e25a91303fe61fc5ca4.jpg" alt="Frontier Airlines Crew Reports Unexplained Lights at 35,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a November 2023 sighting by the crew of a Frontier Airlines flight travelling from San Juan to Cleveland. They observed 2-5 lights moving erratically above the horizon off the left side of the aircraft at 35,000 feet; the lights did not appear on air traffic control radar and the case is now closed.</p>
  <div class="narr">On 19 November 2023 at 01:18 UTC, the crew of Frontier Airlines flight FFT4139 — an Airbus A320neo flying northeast at 35,000 feet from San Juan, Puerto Rico (SJU) to Cleveland, Ohio (CLE) — reported an unidentified aerial phenomenon to air traffic control.

The crew described 2-5 lights off the left side of the aircraft, moving up and down and then left and right above the horizon. The pilot in command was unable to determine how far away the lights were or their altitude. No photographs or video are referenced in the report.

Air traffic control checked their radar systems and found nothing corresponding to the sighting. The FAA logged the event under its SKYWATCH programme with the identifier 237UAP00317 and the internal reference ZMA-M-2023/11/18-0005. The report notes no impact to air traffic control services.

The case is marked as closed. The FAA document does not offer an explanation for what the crew observed, nor does it indicate any follow-up investigation beyond the initial report.</div>
