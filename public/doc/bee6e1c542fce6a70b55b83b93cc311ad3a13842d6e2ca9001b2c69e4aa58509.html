  <h1>FBI Files Show 1947 Flying Disc Reports Were Mostly Hoaxes</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bee6e1c542fce6a70b55b83b93cc311ad3a13842d6e2ca9001b2c69e4aa58509.jpg" alt="FBI Files Show 1947 Flying Disc Reports Were Mostly Hoaxes thumbnail" loading="lazy" />
  <p>This FBI file compiles internal memos, teletypes, and press clippings from July 1947 documenting flying disc reports across 36 US states. Most physically recovered &quot;discs&quot; turned out to be hoaxes or misidentified objects, while hundreds of eyewitness sightings — including the Roswell incident — remained unexplained at the time of writing.</p>
  <div class="narr">In early July 1947, the FBI was flooded with reports of flying discs spotted across the United States. This file — titled &quot;UFO Part 02&quot; — is a collection of the bureau&#39;s internal memoranda, teletype messages, and newspaper clippings from that period. By July 6, observers in 36 states had reported sightings, with the largest concentration on Independence Day, when groups of 200 and 60 people in Idaho reported seeing the objects.

Several physical &quot;discs&quot; were recovered and investigated. In Twin Falls, Idaho, a 30.5-inch circular object with a plastic dome, radio-like tubes, and wiring marked &quot;Inspected TS&quot; was found at 2:45 AM on July 11. In Roswell, New Mexico, the now-famous recovery on July 8 involved a hexagonal object approximately twenty feet across, suspended from a balloon by cable. The military initially said it resembled a high-altitude weather balloon with a radar reflector, but noted that Wright Field (the Army Air Forces&#39; technical centre) had not confirmed that assessment. The object was flown to Wright Field by special plane for examination. NBC, the Associated Press, and other national media were actively trying to break the Roswell story.

Most recovered objects, however, were confirmed fakes. A disc found in Laurel, Maryland was made from a Gulf Oil sign and a garbage can lid, still wet with aluminum paint. In Grafton, Wisconsin, a priest — described in FBI records as having been &quot;drinking quite heavily&quot; — reported finding a disc that turned out to be a 19-inch circular saw blade with wires attached. A thin aluminum disc with copper wires was found in Shreveport, Louisiana. The Atomic Energy Commission chairman David Lilienthal publicly denied any connection between the saucers and atomic experiments.

The file also includes a letter sent to the Los Angeles Examiner describing alleged Russian supersonic, atom-powered, kidney-shaped aircraft only 50 inches thick. The FBI investigated the claim, and a scientist noted it was &quot;not all nonsense,&quot; but the letter was unverified and based on hearsay from an unnamed Russian officer. Moderate redactions appear throughout the file, with some sender and recipient names obscured.</div>
