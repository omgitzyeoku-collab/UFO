  <h1>Pilot Reports Red Unidentified Aircraft Near Baltimore Airport in 2008</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7d237a1e5e2cb03f56abfee066779def931c8303404f436252f4dd70fac12a07.jpg" alt="Pilot Reports Red Unidentified Aircraft Near Baltimore Airport in 2008 thumbnail" loading="lazy" />
  <p>An FAA incident report from August 2008 documents a private pilot&#39;s sighting of a red, structured, unidentified aircraft passing beneath him near Baltimore-Washington International Airport. Military authorities found no matching drone or aircraft activity in the area, and the case was closed without a confirmed explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed on 23 August 2008. It records a sighting by the pilot of a Beech 35 Bonanza (callsign N809T), who was flying at 9,000 feet on a heading of 120 degrees after departing Ocean City Municipal Airport (OXB). The report was coordinated through Potomac TRACON (PCT) and the National Capital Region Coordination Center (NCRCC).

The pilot reported that a red unmanned aircraft passed beneath his aircraft at roughly 2,250 feet, travelling in the opposite direction over BWI airport. After landing, the pilot was interviewed and described the object as red, structured, and clearly not a balloon — stating it was neither round nor elliptical and appeared to be an aircraft.

The Eastern Air Defense Sector (EADS) at NCRCC confirmed there was no Department of Defense drone or other military activity in the area that matched the incident. The FAA classified the report under primary code &quot;OTHER&quot; and marked the case as closed. No photographs, radar tracks, or sensor data accompany the report.

The document was originally filed in 2008 but released publicly as part of the 2023 PURSUE UAP disclosure by the Department of War. Its classification as a UAP record reflects its current framing within that release rather than necessarily how the FAA categorised it at the time.</div>
