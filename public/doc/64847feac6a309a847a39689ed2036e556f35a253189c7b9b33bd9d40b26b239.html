  <h1>U.S. Embassy Cable Reports Pilot UFO Encounter Over Kazakhstan in 1994</h1>
  <div class="meta">
    <span class="badge">Department of State</span>
    <span class="badge">1/27/94</span>
    <span class="badge">Kazakhstan</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/64847feac6a309a847a39689ed2036e556f35a253189c7b9b33bd9d40b26b239.jpg" alt="U.S. Embassy Cable Reports Pilot UFO Encounter Over Kazakhstan in 1994 thumbnail" loading="lazy" />
  <p>A January 1994 U.S. State Department cable from the embassy in Dushanbe, Tajikistan, relays an American airline pilot&#39;s account of observing an unidentified object performing unusual maneuvers at extreme altitude over Kazakhstan. The embassy explicitly stated it had no opinion on the sighting and passed the report along without endorsement.</p>
  <div class="narr">On January 31, 1994, the U.S. Embassy in Dushanbe, Tajikistan, sent an unclassified diplomatic cable to the Secretary of State, the CIA, the Defense Intelligence Agency (DIA), and several other U.S. embassies. The cable relayed an account from Captain Ed Rhodes, an American citizen serving as chief pilot for Tajik Air, who reported the incident to the embassy on January 29 — two days after it occurred.

According to Rhodes, on January 27, 1994, he and his crew were flying a Boeing 747SP at 41,000 feet over Kazakhstan, at coordinates 45°N, 55°E, when they observed a bright light of enormous intensity approaching from over the eastern horizon at great speed. The crew described the light as having a &quot;bow wave&quot; and resembling a high-speed photograph of a bullet in flight. They watched the object for roughly 40 minutes as it performed circles, corkscrews, and 90-degree turns at rapid speed and under what they described as very high G-forces — maneuvers well beyond the capability of conventional aircraft.

About 45 minutes after the initial sighting, as the sun rose, the aircraft flew under contrails the object had left behind. Rhodes estimated these contrails were at approximately 100,000 feet — an altitude where, he noted, there is too little air and moisture for ordinary aircraft engines to produce contrails. The plane was traveling at over 500 knots at the time. Rhodes took several photographs with a pocket Olympus camera and stated he would send copies to the embassy and the Tajikistan desk officer, Lowry Taylor. It is not known whether those photographs were ever developed or preserved.

Rhodes and his crew were former PanAm pilots with years of experience. They rejected the suggestion that the object was a meteor, stating they had seen thousands of falling stars and space debris over their careers and that this was nothing like one. Rhodes personally expressed the opinion that the object was extraterrestrial and under intelligent control — but this was his personal view, not an official assessment. The embassy closed the cable by stating plainly: &quot;We have no opinion and report the above for what it may be worth.&quot; The document was released in full, with no redactions, on February 25, 2026 — more than 30 years after the incident.</div>
