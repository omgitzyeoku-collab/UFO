  <h1>New Hampshire Woman Asked FBI if UFO Club Was Communist</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/06f96d67fa825b5aefe41bd60e6f3860d71320e2aa436a2bf30240e12c33d0f0.jpg" alt="New Hampshire Woman Asked FBI if UFO Club Was Communist thumbnail" loading="lazy" />
  <p>This FBI file contains a 1966 exchange in which a New Hampshire woman wrote to FBI Director J. Edgar Hoover asking whether a flying saucer club was connected to communism. Hoover&#39;s office replied with a standard form letter stating the Bureau does not evaluate organizations. The file also includes a copy of the club&#39;s newsletter, filled with convention announcements and unverified claims of alien contact.</p>
  <div class="narr">In August 1966, Mrs. Florence C. Dow of Goffstown, New Hampshire — a member of NICAP (National Investigations Committee on Aerial Phenomena) — wrote to FBI Director J. Edgar Hoover. She had paid $3.00 for a subscription to a newsletter published by the Amalgamated Flying Saucer Clubs of America (AFSCA), headquartered at 2004 N. Hoover St. in Los Angeles. After reading the material, she grew suspicious that the organization might be backed by communists.

On September 6, 1966, the FBI responded with a brief, standard letter. It stated that Bureau files contained no record of either Mrs. Dow or AFSCA, and that the FBI is strictly an investigative agency that &quot;neither makes evaluations nor draws conclusions as to the character or integrity of any organization.&quot; The response neither confirmed nor denied any communist connection.

The bulk of the file is a copy of AFSCA&#39;s newsletter, &quot;Flying Saucers International&quot; Issue #24 from July 1966, edited by Gabriel Green with assistance from Helen Green. The newsletter promoted AFSCA&#39;s 3rd National Convention, held July 8–10, 1966 at the Centennial Coliseum in Reno, Nevada, with admission at $5.00 for three days or $2.00 per day. It also contained a purported radio message from a planet called &quot;Korendor,&quot; allegedly received by a contactee identified only as &quot;Bob,&quot; along with book listings, news about various UFO contactees, and announcements for other conventions.

The newsletter reflects the culture of 1960s UFO contactee communities — a subculture that claimed direct communication with extraterrestrial beings. None of these contact claims are verified or endorsed by the FBI. Mrs. Dow&#39;s concern about communist ties reflects Cold War-era anxieties rather than any evidence found in the file.</div>
