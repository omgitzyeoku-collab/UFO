  <h1>Delta Crew Reported Unidentified Lights at 35,000 Feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/49ae5a008a063b847822c41e413efb8cd66912d120e6ef59daabc14a5647eaf9.jpg" alt="Delta Crew Reported Unidentified Lights at 35,000 Feet in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of Delta flight DAL722, who observed what appeared to be two aircraft with red and white lights at very high altitude while flying eastbound at 35,000 feet on 14 January 2023. The case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP) from pilots and air traffic controllers. It records an event from 14 January 2023 at 10:30, involving Delta Air Lines flight DAL722, a commercial Airbus A321 operating from Las Vegas to Atlanta.

While flying eastbound at 35,000 feet over a point identified as RZC (likely the Razorback navigation beacon in northwest Arkansas), the crew reported an unidentified aerial phenomenon at their 11 o&#39;clock position — that is, slightly to the left of the aircraft&#39;s nose. They described it as appearing to be two aircraft with red and white lights at a very high altitude.

The FAA&#39;s Air Watch Office (AWO) was notified of the sighting and personnel were paged. The report references several FAA facilities including Denver Center (DEN) and Fort Worth Center (ZFW), which would have been responsible for air traffic control in that region.

The case status is marked as Closed. Notably, the document provides no resolution, identification, or explanation for what the crew observed. There is no indication that radar data or additional witness accounts were included or consulted.

The level of redaction in this document is low, meaning most of the original text appears to be intact. However, the brevity of the report itself means there is limited information to work with — this is a short incident log, not a detailed investigation file.</div>
