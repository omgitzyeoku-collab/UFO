  <h1>Pentagon Office Attributes 2013 Puerto Rico UAP Sighting to Sky Lanterns</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>A March 2025 report by the All-domain Anomaly Resolution Office (AARO) concludes that a widely discussed 2013 infrared video of unidentified objects near Aguadilla, Puerto Rico, most likely captured a pair of sky lanterns drifting in the wind — not an anomalous craft. AARO found the objects moved at roughly 8 mph (matching wind speed), never entered the water, and appeared to vanish only because the infrared camera lost thermal contrast against the ocean.</p>
  <div class="narr">On April 26, 2013, at 9:22 PM local time, a U.S. Customs and Border Protection aircraft flying near Rafael Hernandez Airport in Aguadilla, Puerto Rico, recorded infrared video of two small objects. The footage circulated publicly for years and became one of the most cited UAP cases, with claims that the objects traveled at high speed and plunged into the Atlantic Ocean — so-called &quot;transmedium&quot; behavior.

In a case resolution dated March 20, 2025, the All-domain Anomaly Resolution Office (AARO) — the Pentagon body responsible for investigating unidentified anomalous phenomena — published its analysis. Using a software reconstruction tool called Systems Toolkit (STK) and pixel-level analysis, AARO determined the two objects were each smaller than one meter (about three feet), drifted in a straight line at approximately 8 mph, and stayed at an altitude of roughly 656 feet. The recorded wind speed that night was 9.8 mph from the east/northeast, closely matching the objects&#39; drift.

AARO concluded the objects never entered the water. Their apparent disappearance was caused by the infrared sensor losing the ability to distinguish them from the ocean&#39;s thermal background. The recording fell within a two-hour post-sunset window when thermal crossover — a phenomenon that degrades infrared sensor performance — was in effect. Scattered clouds at 3,000 feet also partially obscured the sensor&#39;s view, and the aircraft nearly tripled its distance from the objects during the observation, further degrading image quality.

The agency assessed with moderate confidence that the objects were sky lanterns. AARO confirmed with local hospitality vendors that hotels and resorts in the Aguadilla area commonly release sky lanterns during celebrations. The objects&#39; apparent high speed in the video was attributed to motion parallax — an optical effect caused by the aircraft&#39;s own movement. AARO also ruled out alternative explanations including marine birds (the objects moved in a straight line at wind speed with no bird-like features) and mylar balloons (an infrared sensor is unlikely to detect reflected moonlight).

AARO explicitly states it is not a member of the intelligence community and that this report should not be treated as finished intelligence. The video reached AARO through publicly available media, not through an official intelligence channel.</div>
