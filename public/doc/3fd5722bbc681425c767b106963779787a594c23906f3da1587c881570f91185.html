  <h1>FAA Report: Pilot Spotted Unidentified Lights Over Kansas in 2022</h1>
  <div class="meta">

  <p>An FAA SKYWATCH incident report documents a pilot observation of unidentified lights maneuvering at high altitude over Kansas on 26 April 2022. The case was closed with no indication of follow-up investigation or resolution.</p>
  <div class="narr">This document is an FAA (Federal Aviation Administration) SKYWATCH incident report classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot; It records an observation made on 26 April 2022 at 07:30 UTC by the crew of aircraft PKW910.

The aircraft was flying northeast at flight level 230 (approximately 23,000 feet), positioned about 35 nautical miles southeast of Liberal, Kansas. The crew reported seeing lights maneuvering above them, estimated to be between flight level 300 and flight level 400 — roughly 30,000 to 40,000 feet. That places the lights approximately 7,000 to 17,000 feet above the reporting aircraft.

The incident was reported to Kansas City Center (the FAA&#39;s regional air traffic control facility for that area). A person or entity identified only as &quot;JH&quot; was noted as having been advised of the report. No further explanation of who or what &quot;JH&quot; refers to is provided in the document.

The report&#39;s status is marked as Closed. There is no indication of any follow-up investigation, resolution, or identification of the observed lights. The document provides no description of the lights&#39; shape, size, colour, or behaviour beyond the phrase &quot;lights maneuvering.&quot;</div>
