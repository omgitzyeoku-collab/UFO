  <h1>FAA Report: Pilot on Spirit Airlines Flight Spotted Fast-Moving Object</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/db6bd217024f918789171699882d820b5279bd7ce1751af0a2f3649634a05070.jpg" alt="FAA Report: Pilot on Spirit Airlines Flight Spotted Fast-Moving Object thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a pilot sighting of an unidentified aerial phenomenon on 9 October 2022. The crew of Spirit Airlines flight NKS75 reported a fast-moving, westbound object that was visible for only 10–15 seconds before the case was closed with no explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unusual aerial sightings reported by pilots and air traffic controllers. It was filed under the primary code &quot;Unidentified Aerial Phenomenon&quot; and assigned case number 237UAP00122.

On 9 October 2022 at 02:47, the crew of Spirit Airlines flight NKS75 reported an unknown object to Denver Air Route Traffic Control Center (ZDV). According to the report, the object was travelling westbound at a high rate of speed and passed between the reporting aircraft and two other aircraft located roughly 30 miles ahead. The object was visible for only 10–15 seconds.

The document references airports EWR (Newark), LAX (Los Angeles), and DEN (Denver), though no specific incident location is stated. No tail number is recorded for the reporting aircraft, and no radar data or sensor evidence is included in the file.

The case status is marked &quot;Closed.&quot; No resolution, identification, or explanation of the object is provided anywhere in the document. The FAA simply logged the sighting and closed it.</div>
