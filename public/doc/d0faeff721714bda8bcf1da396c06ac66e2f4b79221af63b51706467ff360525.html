  <h1>FAA Report: Airline Crew Spotted Unidentified Balloon at 50,000 Feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d0faeff721714bda8bcf1da396c06ac66e2f4b79221af63b51706467ff360525.jpg" alt="FAA Report: Airline Crew Spotted Unidentified Balloon at 50,000 Feet in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from 3 February 2023 in which the crew of a Spirit Airlines A320, flying from Chicago to Phoenix, reported a large balloon off their right side at approximately 50,000 feet over St. Joseph, Missouri. The FAA classified it as an Unidentified Aerial Phenomenon and closed the case.</p>
  <div class="narr">On 3 February 2023, the crew of Spirit Airlines flight NKS1286 — an Airbus A320 travelling westbound from Chicago O&#39;Hare (ORD) to Phoenix (PHX) — reported seeing a large balloon off the right side of their aircraft. They were flying at 34,000 feet over St. Joseph, Missouri, in airspace managed by Kansas City Center (ZKC).

The crew estimated the object was at approximately 50,000 feet or above — well beyond the altitude at which most commercial aircraft operate and near the ceiling of many military planes. Despite the crew describing it as a &quot;large balloon,&quot; the FAA classified the sighting under its primary code: Unidentified Aerial Phenomenon. This means the object was not positively identified by the agency.

The case status is listed as closed. The report contains no indication of corroborating radar data or other sensor evidence beyond the crew&#39;s visual observation.

This incident occurred during the same period — early February 2023 — when the US government was tracking multiple high-altitude balloon objects over American airspace, including the widely reported Chinese surveillance balloon. Whether this sighting is related to those events is not stated in the document.</div>
