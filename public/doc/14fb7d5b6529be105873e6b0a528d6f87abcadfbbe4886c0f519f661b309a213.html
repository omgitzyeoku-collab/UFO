  <h1>United Airlines crew reported large balloon at 50,000 feet in February 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/14fb7d5b6529be105873e6b0a528d6f87abcadfbbe4886c0f519f661b309a213.jpg" alt="United Airlines crew reported large balloon at 50,000 feet in February 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of United Airlines flight 1152 on 3 February 2023. While flying at 36,000 feet over Colorado, the crew reported a large balloon to their right at an estimated 50,000 feet or above. The case was closed with no resolution or follow-up details provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unidentified aerial phenomena reported by pilots. It was filed under the primary code &quot;Unidentified Aerial Phenomenon&quot; and assigned case number 237UAP00192.

On 3 February 2023 at 14:32, the crew of United Airlines flight 1152 — a Boeing 737 MAX 9 flying from Chicago O&#39;Hare to Phoenix — reported seeing a large balloon off the right side of their aircraft. The plane was heading westbound at 36,000 feet, approximately 30 nautical miles west of the RBA navigational waypoint. The crew estimated the balloon was at roughly 50,000 feet or higher, well above their own altitude.

The sighting was logged by Denver Center (ZDV), the FAA air traffic control facility covering that airspace. The report notes no diversion was made — the flight continued to Phoenix. No radar data or additional witness accounts are included in the document.

The case is marked as closed. No explanation, identification, or follow-up action is recorded. The date is notable: 3 February 2023 fell during a period of heightened attention to unidentified balloons in US airspace, following the detection of a Chinese surveillance balloon that was ultimately shot down on 4 February 2023.</div>
