  <h1>CIA Report Describes Soviet Weapons Range and Unidentified Aerial Phenomenon</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">December, 1973</span>
    <span class="badge">USSR</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/b5a4f68efde9027964d44f4b6f1d0c83a57d44a842c3030f2fd8a58e5f115baf.jpg" alt="CIA Report Describes Soviet Weapons Range and Unidentified Aerial Phenomenon thumbnail" loading="lazy" />
  <p>A December 1973 CIA intelligence report, based on a single former Soviet citizen&#39;s account, describes the Sary Shagan weapons testing range in the USSR — including its facilities, missile systems, and rumoured laser research. The report also notes an unidentified aerial phenomenon observed at the site, though heavy redactions obscure most details.</p>
  <div class="narr">In December 1973, the CIA circulated an intelligence report about the Sary Shagan weapons testing range in the Soviet Union. The information came from a former Soviet citizen who had served at the facility, and the report was acquired in Germany. The CIA explicitly marked it as raw reporting — &quot;not finally evaluated intelligence&quot; — meaning it had not been independently verified or analytically assessed.

The report covers the physical layout and operations of the Sary Shagan range. It describes facilities including security fencing, a regional headquarters (military unit V/Ch 03080), and a warhead checkout unit (V/Ch 03142). Two weapons systems are named: System-75, the NATO-designated SA-2 surface-to-air missile, and System-300/Aldan, the ABM-1 GALOSH anti-ballistic missile system. The report also references rumoured laser research at the facility — noted as unconfirmed.

Among the topics covered is an unidentified aerial phenomenon observed at the site. However, due to heavy redactions throughout the document, almost no detail survives about what was seen, when exactly it occurred, or what anyone at the facility made of it.

The document is heavily redacted, with significant portions of text missing or obscured. The source&#39;s identity, specific role, and period of service are all blacked out. Only the summary section of the report is available in the extracted text; the full body remains inaccessible. The information covers events from November 1972 to November 1973.

The report was classified CONFIDENTIAL at the time of distribution. It provides a narrow window into Cold War-era intelligence gathering on Soviet military facilities, but its evidentiary value is limited by the single-source basis and extensive redactions.</div>
