  <h1>Oak Ridge Lab Finds Alleged 1947 UAP Crash Metal Is Terrestrial</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/dc423d1bc4251cff696d17771f4e376191e931d306219dec589111225c4b1bc0.jpg" alt="Oak Ridge Lab Finds Alleged 1947 UAP Crash Metal Is Terrestrial thumbnail" loading="lazy" />
  <p>The Pentagon&#39;s UAP office (AARO) sent a metallic specimen — claimed to come from a 1947 UAP crash — to Oak Ridge National Laboratory for independent analysis. ORNL concluded with high confidence that the material is terrestrial in origin and could not have functioned as the alleged antigravity device.</p>
  <div class="narr">In February 2023, the All-domain Anomaly Resolution Office (AARO) arranged for Oak Ridge National Laboratory (ORNL), a U.S. Department of Energy facility, to examine a metallic specimen that had been circulating in UAP research circles for years. The material — a layered slab roughly 97.5% magnesium and 2% zinc, with thin bands containing bismuth and lead in an approximate 1:1 ratio — was claimed to have been recovered from a UAP crash in or around 1947. Supporters of the claim argued that the bismuth and magnesium layers could act as a terahertz waveguide, enabling &quot;inertial mass reduction&quot; — essentially levitation or antigravity.

ORNL ran extensive microscopy, spectroscopy, and isotope analyses on one parent sample and three subsamples. The laboratory found that the specimen&#39;s magnesium isotopic signature falls squarely within normal terrestrial compositions and on expected fractionation trendlines. Its lead isotopic signature is consistent with ordinary terrestrial &quot;common lead&quot; and is distinct from even lunar materials. Both findings point firmly to an earthly origin.

The terahertz waveguide claim fared no better. ORNL found that the bismuth in the specimen consists of nanocrystalline pockets in an amorphous matrix — not the pure single-crystalline structure a waveguide would require. The bismuth is also co-located and mixed with lead, which would disrupt the dielectric properties needed for waveguide function. Multiple bismuth layers would interfere with rather than improve any such capability. ORNL concluded the material is &quot;highly unlikely to have ever functioned as a bismuth-based terahertz waveguide.&quot; These results aligned with earlier analyses performed by the U.S. Army&#39;s DEVCOM.

The specimen had previously passed through several hands, including To the Stars Academy (TTSA) and DEVCOM, before reaching ORNL, and it shows signs of heat exposure and mechanical damage. ORNL noted the material was manufactured using an uncommon mixture of elements by today&#39;s standards but could not determine what it was originally made for. The document was cleared for open publication on 1 July 2024 and released in full on 6 February 2025.</div>
