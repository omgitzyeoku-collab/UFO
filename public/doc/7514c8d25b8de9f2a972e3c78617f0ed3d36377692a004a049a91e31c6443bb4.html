  <h1>Commercial Pilot Reported UFO Over North Carolina in 2020</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/7514c8d25b8de9f2a972e3c78617f0ed3d36377692a004a049a91e31c6443bb4.jpg" alt="Commercial Pilot Reported UFO Over North Carolina in 2020 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a UFO sighting by the pilot of commercial flight PDT6182 on 14 November 2020. The pilot reported an unidentified object at 15,000 feet heading northbound over western North Carolina; the case was closed with no follow-up analysis included in the released document.</p>
  <div class="narr">This document is a standardised FAA incident form — specifically a SKYWATCH report — filed after the pilot-in-command of commercial flight PDT6182 reported observing an unidentified flying object on 14 November 2020 at 01:45. The sighting occurred at coordinates 36°15&#39;N 80°47&#39;W, which places it over western North Carolina, consistent with a flight path between Charlotte (CLT) and Harrisburg (MDT).

According to the report, the object was observed at 15,000 feet and was heading northbound. The FAA classified the incident under the primary code OTHER and initiated a Mandatory Occurrence Report (MOR), assigned the identifier ZTL-M-2020/11/13-0002. The UFO reporting centre was also notified.

The case status is listed as closed. No description of the object&#39;s appearance, size, speed, or behaviour is provided in the document beyond its position and heading. No radar data, sensor readings, or corroborating observations from other sources are included.

This is a reporting form, not an investigation report. It records that a sighting was reported and logged through official channels, but it contains no analysis, conclusions, or follow-up findings.</div>
