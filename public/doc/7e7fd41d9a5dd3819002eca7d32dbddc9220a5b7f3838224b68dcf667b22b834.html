  <h1>Airline Crew Reports Orbiting Lights Over Atlantic Near New York</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7e7fd41d9a5dd3819002eca7d32dbddc9220a5b7f3838224b68dcf667b22b834.jpg" alt="Airline Crew Reports Orbiting Lights Over Atlantic Near New York thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of Air Transat flight 611, who observed red and white lights orbiting at approximately 37,000 feet over the Atlantic Ocean southeast of Long Island, New York, on 10 April 2023. The report is preliminary and includes no follow-up investigation or explanation.</p>
  <div class="narr">On 10 April 2023, the crew of Air Transat flight 611 — an Airbus A321 flying from Punta Cana, Dominican Republic, to Quebec City, Canada — reported an unidentified aerial phenomenon to air traffic control. The sighting was logged by the FAA&#39;s Washington Operations Center as a UAP incident.

The crew reported seeing red and white lights orbiting at flight level 370 (approximately 37,000 feet), roughly 2,000 feet above their own cruising altitude of 35,000 feet. The aircraft was flying northeast at the time. The location was approximately 46 nautical miles southeast of the Hampton VORTAC navigational aid, placing it over the Atlantic Ocean south of Long Island, New York. The report was relayed through the New York Air Route Traffic Control Center (ARTCC).

The document is labelled as preliminary information only. It contains no radar data, no additional witness accounts, and no follow-up investigation or resolution. The FAA did not reach a conclusion about what the lights were.

There is little evidence of redaction in this document. The report is brief — essentially a single-page operational log entry recording what the crew observed and where they observed it. No personnel are named.</div>
