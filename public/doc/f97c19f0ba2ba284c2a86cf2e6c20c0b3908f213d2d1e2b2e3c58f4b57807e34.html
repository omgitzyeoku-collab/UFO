  <h1>U.S. Military Infrared Video Captures Unidentified Object Over East China Sea</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2021</span>
    <span class="badge">East China Sea</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/f97c19f0ba2ba284c2a86cf2e6c20c0b3908f213d2d1e2b2e3c58f4b57807e34.jpg" alt="U.S. Military Infrared Video Captures Unidentified Object Over East China Sea thumbnail" loading="lazy" />
  <p>This 23-second infrared video, recorded by a U.S. military platform on 9 June 2021 over the East China Sea, shows a sensor tracking an unidentified area of contrast for about 18 seconds before losing sight of it. It was among 51 UAP-related records requested by eight members of the U.S. House of Representatives in March 2026, and the assessing office notes the materials lack a confirmed chain of custody.</p>
  <div class="narr">On 9 June 2021, a U.S. military platform operating over the East China Sea recorded a short infrared video of something it could not identify. The footage, catalogued as DOW-UAP-PR075, runs just 23 seconds. For roughly 18 of those seconds, the sensor tracks what is described only as &quot;an area of contrast&quot; before losing sight of the object. The remaining five seconds contain no content.

The video was uploaded to a classified network in June 2021. It resurfaced publicly after eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records on 6 March 2026. The All-domain Anomaly Resolution Office (AARO) identified this video as one of those responsive materials.

AAro&#39;s assessment is limited. The office says the video is &quot;likely&quot; derived from an infrared sensor aboard a U.S. military platform — the word &quot;likely&quot; indicating they are not fully certain. No details about the object&#39;s shape, size, speed, or behaviour are provided. The name of the military platform is redacted from the title, shown only as &quot;[Platform]&quot;.

AAro also flags that many of the materials in this collection lack a substantiated chain of custody, meaning the provenance of this video has not been independently confirmed. No extracted text exists from the source document itself; what is known comes from metadata and the official video description.

In short, this is a very brief, low-detail recording. It documents that something was seen and tracked by an infrared sensor, but offers almost nothing about what that something was.</div>
