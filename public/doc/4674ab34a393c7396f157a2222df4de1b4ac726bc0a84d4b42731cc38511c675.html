  <h1>Two Aircraft Report Erratic Lights at 51,000 Feet Over Colorado</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/4674ab34a393c7396f157a2222df4de1b4ac726bc0a84d4b42731cc38511c675.jpg" alt="Two Aircraft Report Erratic Lights at 51,000 Feet Over Colorado thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH report documents a February 2024 incident in which a Gulfstream IV pilot and an American Airlines crew independently reported three erratically moving lights above 51,000 feet near Pueblo, Colorado. The objects appeared on air traffic control radar but not on either aircraft&#39;s collision avoidance system, and the FAA closed the case without explanation.</p>
  <div class="narr">On 18 February 2024, the crew of a Gulfstream IV business jet (callsign N151SD) was flying eastbound at 41,000 feet on a route from Las Vegas to Teterboro, New Jersey. While under the watch of Denver Center (ZDV), the crew reported an unidentified aerial phenomenon directly ahead of the aircraft — three lights moving erratically at approximately 51,000 feet or higher, well above their own cruising altitude.

The lights did not appear on the Gulfstream&#39;s onboard collision avoidance system (TCAS), a traffic alert tool that detects nearby aircraft transponders. However, the objects were picked up by the air traffic control facility&#39;s own radar system — a significant detail, because it means the phenomenon registered on independent ground-based sensors, not just the pilot&#39;s eyes.

A second aircraft, American Airlines flight 2514 — an Airbus A321neo travelling from San Francisco to Charlotte — independently reported seeing the same lights. Two separate crews observing the same phenomenon strengthens the report, though the FAA file includes no further detail from the American Airlines crew.

The FAA logged the sighting under case number 237UAP00356 and assigned it MOR ID ZDV-M-2024/02/18-0001. The approximate location was recorded as 120 degrees from the Pueblo VOR navigational beacon at 50 nautical miles, placing it in eastern Colorado, though exact coordinates were not provided.

The case is marked &quot;Closed&quot; with no resolution or explanation. The FAA file does not identify what the lights were, does not describe the radar return in detail, and does not include the corroborating report from the American Airlines flight.</div>
