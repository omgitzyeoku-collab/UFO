  <h1>DOW-UAP-PR36, Unresolved UAP Report, Middle East, May 2020</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">Middle East</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/90b353682ba2181149054d0911b7553e58e959438dd4de531a06fc387a332f85.jpg" alt="DOW-UAP-PR36, Unresolved UAP Report, Middle East, May 2020 thumbnail" loading="lazy" />
  <p>The United States Central Command submitted a report of an unidentified anomalous phenomenon (UAP) to the All-domain Anomaly Resolution Office (AARO) consisting of two minutes and 17 seconds of video footage from an infrared sensor aboard a U.S. military platform in 2020. An accompanying Range Fouler report, DoW-UAP-D38, described the UAP as a solid white object making erratic movements above the water.

Video Description:
00:05: An area of contrast briefly enters the sensor field-of-view from the left side of the screen.
00:06-00:18: The sensor pans away from the scene’s initial subject matter while cycling contrast settings and zoom levels.
00:19: The area of contrast re-enters the sensor field-of-view from near the center of the top edge of the screen.
00:20-01:15: The area of contrast remains generally within the sensor field-of-view.
01:16: The sensor narrows its field-of-view to zoom in on the area of contrast.
01:56: The sensor further narrows its field-of-view to zoom in on the area of contrast.
02:10: A blue reticle briefly appears on screen but does not acquire a lock on the area of contrast.
02:15-02:17: The sensor switches to a different modality and loses track of the area of contrast.

This video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.</p>
