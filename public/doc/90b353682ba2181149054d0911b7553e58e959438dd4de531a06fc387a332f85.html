  <h1>U.S. Military Crew Reported Round White Object Over Middle East Waters</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">Middle East</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/90b353682ba2181149054d0911b7553e58e959438dd4de531a06fc387a332f85.jpg" alt="U.S. Military Crew Reported Round White Object Over Middle East Waters thumbnail" loading="lazy" />
  <p>A declassified military debrief form records a single round, solid white object detected by infrared sensor during a nighttime surveillance mission over the Middle East on May 14, 2020. The object appeared to move erratically above the water, was only intermittently tracked by radar, and was ultimately lost when the crew could not maintain sensor lock.</p>
  <div class="narr">This document is a Range Fouler debrief form — a standard military reporting template used when an aircrew encounters an unexplained object during a mission. It was declassified by Major General Richard A. Harrison, USCENTCOM (U.S. Central Command) Chief of Staff, and released to AARO, the Pentagon&#39;s office responsible for investigating unidentified anomalous phenomena.

On the night of May 14, 2020, a U.S. military crew conducting an ISR (intelligence, surveillance, and reconnaissance) mission in the Middle East detected a single solid white, round object flying through their infrared sensor&#39;s field of view. The sensor was operating in a mode called Black Hot, which displays heat signatures, and the detection occurred at approximately 20:40 UTC. The crew temporarily lost sight of the object but re-acquired it shortly afterward.

According to the form, the object appeared to make erratic movements above the water. The sensor operator continuously adjusted the sensor to keep eyes on it — a detail supported by the report&#39;s note that ocean waves in the background alternated between being visible and not visible as the sensor was repositioned. The crew managed to achieve 4x zoom on the object but ultimately lost it due to poor track placement. Radar contact with the object was intermittent rather than stable, meaning the system could not consistently hold a lock.

The document remains partially redacted. All crew identifying information has been removed under SPEAR policy, and latitude and longitude fields are partially obscured, preventing precise geolocation of the sighting. Some text is degraded by scanning artifacts. The report does not reach a conclusion about what the object was — it is categorized as unresolved.</div>
