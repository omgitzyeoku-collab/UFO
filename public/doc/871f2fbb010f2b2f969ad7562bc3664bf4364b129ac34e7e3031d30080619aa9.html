  <h1>Delta Pilots Reported Synchronized Lights Near LAX in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/871f2fbb010f2b2f969ad7562bc3664bf4364b129ac34e7e3031d30080619aa9.jpg" alt="Delta Pilots Reported Synchronized Lights Near LAX in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by a Delta Air Lines crew of multiple stationary, synchronized lights while descending toward Los Angeles on 21 July 2023. NORAD found nothing on its systems, no evasive action was taken, and the case was closed without identifying what the lights were.</p>
  <div class="narr">On 21 July 2023 at 04:52, the crew of Delta Air Lines flight DAL2054 — a Boeing 737-800 flying from San Francisco (SFO) to Los Angeles (LAX) — reported seeing something unusual while descending southbound at 14,200 feet, roughly 20 nautical miles southwest of LAX. The sighting was logged through the FAA&#39;s SKYWATCH system and reported via the Los Angeles Air Route Traffic Control Centre (ZLA).

The crew described multiple stationary lights that appeared to be synchronized. The aircraft did not take any evasive action, suggesting the lights were not perceived as an immediate collision threat.

FAA headquarters in Denver asked NORAD (the North American Aerospace Defense Command) to check their tracking systems for any corresponding object. NORAD returned negative results — meaning whatever the crew saw did not show up on military radar or sensors.

The FAA classified the event under the primary code &quot;Unidentified Aerial Phenomenon&quot; and the case status is now closed. The report does not offer any explanation or identification for the lights. No tail number for the aircraft was recorded in the document.</div>
