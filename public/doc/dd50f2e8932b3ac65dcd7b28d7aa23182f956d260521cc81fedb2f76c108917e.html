  <h1>Air Canada Rouge crew reported balloon-like object at 32,000 feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/dd50f2e8932b3ac65dcd7b28d7aa23182f956d260521cc81fedb2f76c108917e.jpg" alt="Air Canada Rouge crew reported balloon-like object at 32,000 feet in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA incident report from 3 February 2023 in which the crew of a commercial Airbus A321, flying as Air Canada Rouge flight ROU1721, reported seeing an unidentified aerial phenomenon described as a balloon while cruising westbound at 32,000 feet. The case was reported through Kansas City Center and is marked closed with no further explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed on 3 February 2023 at 17:18 UTC. It records a sighting by the crew of a commercial Airbus A321 operating under callsign ROU1721, flying from Toronto Pearson (CYYZ) to Phoenix (PHX).

While travelling westbound at flight level 320 — roughly 32,000 feet — the crew reported observing an unidentified aerial phenomenon. The report parenthetically describes the object as a balloon, though no detail is given about its size, colour, behaviour, or origin.

The sighting was reported through the Kansas City Center (ZKC) air traffic control facility. The FAA classified the primary code as &quot;Unidentified Aerial Phenomenon&quot; and marked the case status as closed. No radar data, sensor corroboration, or follow-up investigation results are included in the document.

The timing is notable: this report falls in early February 2023, during a period of heightened balloon-related sightings across US airspace following the Chinese surveillance balloon incident. Whether this object was related to that event or was something else entirely is not addressed in the record.</div>
