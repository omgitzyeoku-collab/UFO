  <h1>Delta Pilots Reported Fast-Moving Lights Over Idaho in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/fd1e3b65e57db34ff8b76cb8bdcfdaff761e062943a0e13eeae7c057265744bb.jpg" alt="Delta Pilots Reported Fast-Moving Lights Over Idaho in 2023 thumbnail" loading="lazy" />
  <p>An FAA incident report records that the pilots of Delta flight 1156, an Airbus A319 en route from Salt Lake City to Vancouver, reported seeing two to four lights moving in a triangular pattern at high speed near Brownlee Reservoir, Idaho on 22 February 2023. One light became very bright before disappearing. The report is preliminary and includes no radar data or corroborating witnesses.</p>
  <div class="narr">This document is an incident report from the FAA (Federal Aviation Administration) Washington Operations Center. It records a pilot sighting of unidentified lights during a commercial flight on 22 February 2023.

The crew of Delta flight 1156, flying an Airbus A319 from Salt Lake City to Vancouver, Canada, reported seeing lights at their 12 o&#39;clock position — directly ahead — roughly 15 to 20 degrees above the horizon. The sighting occurred near Brownlee Reservoir in Idaho, at coordinates 44.01°N, 116.25°W. The pilots described two to four lights moving in a triangular pattern at a high rate of speed. The lights also shifted into a line formation, and one light became very bright before disappearing entirely.

The report notes that the aircraft&#39;s altitude at the time of the sighting was unknown, which limits any estimation of how high the observed lights were. There is a minor date discrepancy in the document: the timestamp reads 21 February 2023 at 10:20 PM Mountain Standard Time, while the event title references 22 February 2023 — consistent with a local-time-to-UTC conversion rather than a data error.

The FAA filing is marked as preliminary information. It does not contain a conclusion about what the lights were, nor does it include corroborating evidence such as radar tracks or reports from other aircraft or ground observers. There is little evidence of redaction in this document.</div>
