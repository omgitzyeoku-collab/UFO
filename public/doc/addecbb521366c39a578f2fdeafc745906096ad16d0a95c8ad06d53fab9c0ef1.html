  <h1>AARO Internal Org Chart Reveals Office Structure and Leadership</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/addecbb521366c39a578f2fdeafc745906096ad16d0a95c8ad06d53fab9c0ef1.jpg" alt="AARO Internal Org Chart Reveals Office Structure and Leadership thumbnail" loading="lazy" />
  <p>This August 2024 document is an organizational chart for the All-Domain Anomaly Resolution Office (AARO), the Pentagon office responsible for investigating unidentified anomalous phenomena. It names Director Jon Kosloski and Deputy Director Tim Phillips, shows seven internal divisions, and heavily redacts nearly all other staff names.</p>
  <div class="narr">This document is an internal organizational chart for the All-Domain Anomaly Resolution Office (AARO), dated August 2024. AARO sits under the Office of the Under Secretary of Defense for Intelligence &amp; Security (OUSD I&amp;S) and is the U.S. government&#39;s lead office for investigating unidentified anomalous phenomena — what were previously called UFOs.

The chart identifies two senior leaders by name: Director Jon Kosloski, a member of the Senior Executive Service (SES), and Deputy Director Tim Phillips. Beyond those two, nearly all individual staff names are blacked out under privacy exemptions.

AARO&#39;s structure as shown includes seven divisions: Analysis, Operations, Science &amp; Technology, Strategic Communications, Chief of Staff, a Federally Funded Research and Development Center (FFRDC) relationship, and Liaison. The Analysis division includes roles such as Chief of Analysis, all-source analysts, a radar analyst, and a production manager. Operations lists roles including operations chiefs, a military intelligence officer, a plans and strategy position, and a detailee from the Pentagon Force Protection Agency (PFPA). Science &amp; Technology has a chief, a science advisor, and a technology lead. Strategic Communications covers congressional and public affairs as well as graphic and web design. The Chief of Staff section handles budget, IT, records management, security, data architecture, and technical writing. The chart also shows liaison personnel from the Army and Navy.

A legend on the chart categorizes personnel types: liaison officers (LNOs), Intelligence &amp; Security cadre staff, surge personnel, reservists, detailees from other agencies, and positions marked for upcoming departure. This gives a sense of how AARO draws staff from across the defense and intelligence community rather than relying on a single hiring pipeline.

This is an administrative staffing document, not a UAP sighting or incident report. It contains no case data about specific encounters or investigations. Its value is in showing how the office was organized and resourced at a specific point in time.</div>
