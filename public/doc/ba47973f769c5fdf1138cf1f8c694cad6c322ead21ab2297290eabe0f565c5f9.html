  <h1>Pilot and Air Traffic Control Both Saw Unexplained Lights Over Alabama</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/ba47973f769c5fdf1138cf1f8c694cad6c322ead21ab2297290eabe0f565c5f9.jpg" alt="Pilot and Air Traffic Control Both Saw Unexplained Lights Over Alabama thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting on August 17, 2023, in which a general aviation pilot flying between Birmingham and Huntsville, Alabama reported multiple colored lights in the sky. Birmingham airport&#39;s air traffic control tower independently confirmed seeing the same lights, but neither could estimate the altitude. The case was closed without a stated resolution.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP). It was filed under the code 237UAP00289 and classified with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On August 17, 2023, a Cessna 208 with callsign N414CY, operating as a general aviation flight from MDQ to RYY, reported seeing multiple colored lights moving in the sky while flying between Birmingham (BHM) and Huntsville (HSV), Alabama. The sighting was notable because Birmingham airport&#39;s air traffic control tower (BHM ATCT) independently reported seeing the same lights from their tower cab, describing them as moving around in the sky.

Neither the pilot nor the tower personnel could provide an altitude estimate for the lights. The report contains no mention of radar data, photographs, or instrument readings that might have supplemented the visual observations.

The case status is listed as &quot;Closed.&quot; The report does not indicate that the lights were ever identified or explained. There is no stated conclusion about what the objects were, and redaction levels in the document appear low — meaning this appears to be the full report rather than a heavily censored version.

The report was flagged as &quot;Paged: YES,&quot; meaning it was escalated within FAA channels, and carries a Memphis Center (ZME) mandatory occurrence report ID, suggesting the sighting was treated as a reportable safety event.</div>
