  <h1>FAA Log Records Pilot Sighting of Object at 60,000 Feet Over Texas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/35a1ab3f29ca34dd5cbd77abb482f7daef73bd959da3a863b169f27888eb0695.jpg" alt="FAA Log Records Pilot Sighting of Object at 60,000 Feet Over Texas thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from November 2021 documenting a pilot aboard a NetJets flight (callsign EJA702) who reported an unidentified aerial phenomenon travelling eastbound at approximately 60,000 feet while the aircraft was descending through 38,000 feet near Big Spring, Texas. The case was closed with no identification or resolution noted.</p>
  <div class="narr">This document is an FAA SKYWATCH log entry — a standardised form the Federal Aviation Administration uses to record unusual aerial sightings reported by pilots. It is not an investigative analysis or a detailed study; it is a brief incident record.

On 27 November 2021 at 01:51 UTC, the crew of a NetJets aircraft flying under callsign EJA702 reported an unidentified aerial phenomenon while on a westbound flight from Dallas (DAL) to Carlsbad, New Mexico (CNM). The aircraft was descending through FL380 (38,000 feet) and was approximately 40 nautical miles east of Big Spring, Texas (BGS) at the time of the sighting.

The crew reported that the object was travelling eastbound at an estimated altitude of FL600 — roughly 60,000 feet. That altitude is well above the service ceiling of most known conventional aircraft, which makes the estimate noteworthy, though it was not independently verified by radar or other instruments in this report.

The FAA classified the sighting under the primary code &quot;Unidentified Aerial Phenomenon.&quot; Law enforcement was not notified. No tail number was recorded for the reporting aircraft, and the case is marked as closed with no resolution or identification provided. The document contains no corroborating radar data, no additional witness accounts, and no follow-up analysis.</div>
