  <h1>NetJets Crew Reports Unidentified Phenomenon at 40,000 Feet Over Missouri</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b64479e1be8db12566e90b29a2db2863d5728d7b1f869a4aee593025b1552811.jpg" alt="NetJets Crew Reports Unidentified Phenomenon at 40,000 Feet Over Missouri thumbnail" loading="lazy" />
  <p>An FAA incident notification records that the crew of NetJets flight 466, an Embraer E55P, reported seeing an unidentified aerial phenomenon from the right side of the aircraft while flying southbound at 40,000 feet near Thayer, Missouri on January 19, 2024. No evasive action was taken, no description of the object was provided, and no further investigation is documented here.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — essentially a short internal alert that something unusual was reported during a commercial flight. It is not an investigation report and contains no conclusions about what was seen.

On the evening of January 19, 2024, NetJets flight 466, an Embraer E55P traveling from St. Louis to a destination coded LBX, was flying southbound at flight level 400 (approximately 40,000 feet). The crew reported observing an unidentified aerial phenomenon from the right side of the aircraft, roughly three miles east of Thayer, Missouri. The sighting was relayed through Memphis Air Route Traffic Control Center (ARTCC), which handles high-altitude air traffic in that region.

The notification states that no evasive action was taken by the aircraft and no law enforcement notification was made. Notably, the document provides no description whatsoever of the phenomenon — no shape, size, colour, movement, or duration is recorded.

The record amounts to a single brief filing confirming that a pilot report was made and logged. There is no indication of follow-up investigation, radar corroboration, or additional witness accounts within this document.</div>
