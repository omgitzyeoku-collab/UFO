  <h1>Pentagon Orders All Military Branches to Report UAP Under Standardized Rules</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>A May 2023 Joint Staff order directs every US Combatant Command and Military Service to report Unidentified Anomalous Phenomena (UAP) using a standardized template, notify counterintelligence within 24 hours, and transfer all UAP data and recovered material to the All-domain Anomaly Resolution Office (AARO) within 30 days. This is an administrative directive establishing procedures, not a report of any specific UAP event.</p>
  <div class="narr">In May 2023, the Joint Staff J3 Homeland Defense Division in Washington DC issued a military-wide order setting out exactly how every branch of the US armed forces must report encounters with Unidentified Anomalous Phenomena — the official term for what were previously called UFOs. The order was sent to all Combatant Commands and Military Services, covering operations worldwide.

The document defines four categories of UAP: spaceborne (above the Kármán Line, 100 km altitude), airborne, seaborne, and transmedium — meaning objects that move across more than one of these domains. It describes UAP as sources of anomalous detections not yet attributable to known actors that demonstrate behaviors not readily understood by sensors or observers, and notes they may include phenomena that exceed known performance envelopes. The order states that the US Government has observed UAP in or near the territory and operating areas of the United States, its allies, and its adversaries, and describes their potentially ubiquitous presence as a national security concern involving operational hazards, technological surprise, and the risk of adversaries&#39; strategic miscalculations.

The directive sets strict reporting timelines: UAP incidents and incursions must be reported within 96 hours, while engagements — defined as kinetic or non-kinetic responses intended to deny, disrupt, or destroy a phenomenon — must be reported within 12 hours. Counterintelligence elements must be notified within 24 hours. All UAP data and any recovered material must be transferred to AARO within 30 days. The reporting template includes a field asking whether objects appear to be under intelligent control. Notably, any health effects from UAP encounters are to be kept in service members&#39; medical records and explicitly excluded from the UAP report itself.

AARO, the All-domain Anomaly Resolution Office, was established by a Deputy Secretary of Defense memorandum on 15 July 2022 with a mission to detect, identify, attribute, and mitigate anomalous objects across all domains. The Joint Staff order explicitly states it will not provide funding for these activities. Some contact information at the end of the document appears partially redacted, and the order notes that UAP reporting can be classified up to Top Secret/SCI and Special Access Program levels.</div>
