  <h1>Commercial Pilot Reports Black Stationary Object Over Alaska at 16,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b31de778e3470ce241f984bf2be1faaaa79cbc40f00998f192dcbb83c3697b78.jpg" alt="Commercial Pilot Reports Black Stationary Object Over Alaska at 16,000 Feet thumbnail" loading="lazy" />
  <p>An FAA incident report documents a commercial airline crew observing a round, black, stationary object at roughly 16,000 feet over Alaska on 21 February 2023. The Alaska NORAD Region was notified, and the case was closed without any identification of the object.</p>
  <div class="narr">On 21 February 2023 at 03:29 UTC, the crew of a De Havilland Dash 8 flying under callsign RVF140 reported an unidentified aerial phenomenon to the FAA. The commercial flight was south-west bound at 6,000 feet, positioned 52 nautical miles northwest of Kenai, Alaska (bearing 312° from ENA, Kenai&#39;s airport code).

The crew described the object as round, black, and stationary at approximately 16,000 feet or higher — well above their own altitude. The FAA logged the sighting under its SKYWATCH programme, which tracks reports of unidentified aerial phenomena from pilots and air traffic controllers.

The Alaska NORAD Region (the military&#39;s North American air-defence command for Alaska) was notified. The report was assigned MOR ID A11-M-2023/02/20-0001. Despite the military notification, the case is marked as closed. No resolution or identification of the object is recorded in the document — closure does not mean the object was explained.

The report contains minimal detail beyond the pilot&#39;s observation. No radar data, photographs, or additional witness accounts are included. No tail number is recorded for the reporting aircraft, limiting the ability to cross-reference the sighting with other records.</div>
