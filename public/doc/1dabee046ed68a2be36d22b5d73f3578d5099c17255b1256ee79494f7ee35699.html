  <h1>American Airlines Pilot Reported Multiple Moving Lights at 35,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/1dabee046ed68a2be36d22b5d73f3578d5099c17255b1256ee79494f7ee35699.jpg" alt="American Airlines Pilot Reported Multiple Moving Lights at 35,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents an American Airlines pilot observing multiple lights moving in different directions near the constellation Leo while flying from Los Angeles to Dallas/Fort Worth at 35,000 feet on 9 October 2022. The case was closed with no explanation or resolution provided in the document.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under the primary code &quot;Unidentified Aerial Phenomenon.&quot; It records an observation made by the crew of American Airlines flight AAL2438, an Airbus A321 operating a commercial route from Los Angeles (LAX) to Dallas/Fort Worth (DFW).

On 9 October 2022, beginning at 09:55 UTC, the crew reported seeing multiple lights moving in different directions while flying eastbound at flight level 350 (35,000 feet) over a point identified as CNX. The lights were described as appearing to the left of the constellation Leo, which suggests the crew was looking upward or at a significant altitude above them. The observation was still continuing at the time the report was filed at 10:25 UTC. The report was routed through the Albuquerque Air Route Traffic Control Center (ZAB), and the incident triggered a page to relevant personnel.

The FAA marked this case as closed. No resolution, identification, or explanation for the lights is provided anywhere in the document. There is no mention of corroborating radar data, additional witness reports from other aircraft, or follow-up investigation.

No tail number for the aircraft was recorded in the report, and the location identifier CNX does not correspond to a well-known major US airport — it may refer to a navigational waypoint or VOR station along the route.</div>
