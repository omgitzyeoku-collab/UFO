  <h1>Two Aircraft Reported Bright Fast-Moving Objects Over Georgia in 2010</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/df39476c562c86d8dd1db44b6af5530c34402c70be5a5eeab5310b384e7dc20c.jpg" alt="Two Aircraft Reported Bright Fast-Moving Objects Over Georgia in 2010 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents two aircraft reporting unidentified flying objects near Alma, Georgia on 17 November 2010. The pilots described two fast-moving targets with light too bright to be a satellite; NORAD investigated but no military activity was found in the area, and the case was closed without a recorded explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unusual airspace events. It records an incident from 17 November 2010, though it was released publicly as part of a 2023-era collection of UAP records.

On that date, two aircraft — registered as LN30LJ and N27JH — reported seeing unidentified flying objects near AMG (Alma, Georgia) airspace. The pilots described the objects as two fast-moving targets emitting very bright light, brighter than a satellite would appear.

The FAA contacted both EADS (Eastern Air Defense Sector) and NORAD (North American Aerospace Defense Command) to check for military activity in the area. Neither organisation reported any. NORAD was noted as investigating the reports. No other aircraft filed similar sightings.

The FAA recommended that ZJX (Jacksonville Air Route Traffic Control Center) interview the pilots in command and offer them official UFO reporting forms, should they choose to file. The case status is marked as Closed, but no resolution or explanation for the sightings is recorded in the document.

No pilot names appear in the report — only aircraft registration numbers are provided. The document contains no instrument data, photographs, or follow-up investigation results.</div>
