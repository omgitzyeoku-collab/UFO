  <h1>Military Infrared Video Captures Unidentified Object Over CENTCOM Region in 2019</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2019</span>
    <span class="badge">CENTCOM</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/0a3fa02a7ce357649d1a5d5b4bebc0a323b64101981fa10997eb0b579c710e90.jpg" alt="Military Infrared Video Captures Unidentified Object Over CENTCOM Region in 2019 thumbnail" loading="lazy" />
  <p>This is a five-minute infrared video, assessed by the All-domain Anomaly Resolution Office (AARO) as likely recorded by a U.S. military sensor platform in the Central Command area of responsibility in 2019. The video shows an unidentified area of contrast entering the frame and being tracked by the sensor, but the object has not been identified, and AARO notes that many materials in this collection lack a verified chain of custody.</p>
  <div class="narr">On 25 September 2019 at 2135Z (9:35 PM UTC), a U.S. military platform operating in the United States Central Command (CENTCOM) area of responsibility recorded roughly five minutes of infrared video. The footage shows an area of contrast — a heat signature distinct from its surroundings — entering the sensor&#39;s field of view at the bottom of the screen. The sensor then rotates clockwise and corrects counterclockwise to centre on and track the object. The first 33 seconds of the video contain no content. The object itself is not identified as any known aircraft, drone, or other conventional object.

The video was uploaded to a classified network in October 2019. The identity of the observing platform and crew is unknown — the callsign in the document title is redacted. AARO uses the word &quot;likely&quot; when attributing the video to a military infrared sensor, meaning even the source platform is not confirmed with certainty.

This record was released as part of the PURSUE collection after eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records on 6 March 2026. AARO identified responsive materials held on a classified network and made them available.

AARO flags an important limitation: many of the materials in this collection lack a substantiated chain of custody. That means the path from original recording to the version now available has not been fully verified. The video&#39;s metadata description is also truncated and incomplete, and no text was extracted from the source file itself — all available facts come from the CSV metadata and the video description provided by AARO.</div>
