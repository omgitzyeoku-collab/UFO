  <h1>Military Video Shows Spherical Object Tracked by Sensors in 2021</h1>
  <div class="meta">
    <span class="badge">Department of War</span>

    <span class="badge">CENTCOM</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/951b0da58cab77ef2aa2de357df6126cccc9c03823072189f6d83c8da7e5f850.jpg" alt="Military Video Shows Spherical Object Tracked by Sensors in 2021 thumbnail" loading="lazy" />
  <p>This is a roughly five-minute military video from April 2021 showing sensors aboard a U.S. military platform tracking a spherical unidentified object in the Middle East region. The footage lacks a verified chain of custody, and the platform&#39;s identity is redacted.</p>
  <div class="narr">In April 2021, a U.S. military platform operating in the area overseen by United States Central Command (CENTCOM, covering the Middle East and Central Asia) recorded a four-minute, 49-second video of a spherical unidentified anomalous phenomenon (UAP). The footage, catalogued as DOW-UAP-PR062, appears to come from a full-motion video camera paired with an infrared sensor. Throughout the recording, the sensor pans and adjusts zoom to keep a bright area of contrast centred in frame.

The video was uploaded to a classified government network in May 2024 — roughly three years after the incident — by an unidentified user. It was later flagged by the All-domain Anomaly Resolution Office (AARO) as responsive to a March 2026 congressional request, in which eight members of the U.S. House of Representatives sought access to 51 potentially UAP-related records held by the Department of War.

AARO&#39;s own language is notably cautious. The agency says the footage is &quot;likely derived from&quot; the sensor platform rather than confirming it outright. It also warns that many of the materials in this batch lack a substantiated chain of custody, meaning the provenance of the video cannot be independently confirmed. The callsign of the military platform has been redacted, and the official description of the video&#39;s content is limited to the sensor-tracking behaviour — no assessment of the object&#39;s speed, altitude, or anomalous properties is provided.

The description text released alongside the video appears truncated, suggesting additional context may have been cut off or withheld.</div>
