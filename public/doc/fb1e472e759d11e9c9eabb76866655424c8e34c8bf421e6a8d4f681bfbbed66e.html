  <h1>Commercial Pilot Reports Four Circling Lights at 55,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/fb1e472e759d11e9c9eabb76866655424c8e34c8bf421e6a8d4f681bfbbed66e.jpg" alt="Commercial Pilot Reports Four Circling Lights at 55,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of commercial flight TSC611, an Airbus A321, on 10 April 2023. The crew reported four red and white lights moving in circles at approximately 55,000 feet — roughly 20,000 feet above their aircraft. The case was closed with no explanation provided.</p>
  <div class="narr">On 10 April 2023, the crew of commercial flight TSC611 — an Airbus A321 operated by TSC — reported an unidentified aerial phenomenon while flying from Punta Cana (MDPC) to Quebec City (CYQB). The sighting was logged through the FAA&#39;s SKYWATCH incident reporting system.

The crew described four red and white lights moving in circles at an estimated altitude of 55,000 feet, roughly 20,000 feet above their own position. The location was referenced as the HTO 125046 radial, likely near the Hampton VOR navigational beacon. The report was filed with New York Air Route Traffic Control Centre (ZNY).

The FAA marked the case as closed. No resolution, identification, or follow-up explanation appears in the document. There is no mention of corroborating radar data, additional witness reports, or any sensor evidence beyond the crew&#39;s visual observation.

The reported altitude of 55,000 feet is notable — it sits well above the ceiling of most commercial and military aircraft. However, estimating altitude visually from a cockpit at night or in open sky is inherently imprecise, and no instrument data is cited to confirm the figure.</div>
