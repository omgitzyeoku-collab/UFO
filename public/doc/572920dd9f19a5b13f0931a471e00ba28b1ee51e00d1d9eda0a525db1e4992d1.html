  <h1>FAA Report: Pilot Spotted Unidentifiable Object Over New Mexico</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/572920dd9f19a5b13f0931a471e00ba28b1ee51e00d1d9eda0a525db1e4992d1.jpg" alt="FAA Report: Pilot Spotted Unidentifiable Object Over New Mexico thumbnail" loading="lazy" />
  <p>This FAA incident report documents a general aviation pilot&#39;s sighting of an unidentified aerial phenomenon approximately 1,000 feet above the aircraft while flying at 41,000 feet, roughly 65 nautical miles east of Albuquerque on 12 September 2021. The pilot was unable to describe the object, and the case was closed without identification or resolution.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log pilot reports of unidentified aerial phenomena. It was filed under case number 237UAP00068 and categorised with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On 12 September 2021 at 01:17 UTC, a general aviation aircraft with the callsign N824HH was flying southeast-bound at flight level 410 (approximately 41,000 feet) on a route from Camarillo, California to Dallas, Texas. Roughly 65 nautical miles east of Albuquerque, New Mexico, the pilot reported an unidentified aerial phenomenon approximately 1,000 feet above the aircraft.

When asked for details, the pilot was unable to describe the characteristics of the object. The report contains no mention of corroborating radar data, sensor readings, or observations from other aircraft or ground stations.

The FAA marked the case as closed. No identification of the object was noted, and no resolution or follow-up findings appear in the record. The document is brief and contains minimal detail beyond the basic facts of the sighting.</div>
