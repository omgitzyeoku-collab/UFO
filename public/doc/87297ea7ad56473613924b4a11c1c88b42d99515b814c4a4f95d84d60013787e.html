  <h1>ODNI-UAP-D001, USPER Narrative, Senior USIC Official</h1>
  <div class="meta">
    <span class="badge">Office of the Director of National Intelligence</span>

  </div>
  <img class="thumb" src="/extract/thumbs/87297ea7ad56473613924b4a11c1c88b42d99515b814c4a4f95d84d60013787e.jpg" alt="ODNI-UAP-D001, USPER Narrative, Senior USIC Official thumbnail" loading="lazy" />
  <p>This document is a first-hand account written by a currently serving (May 2026) senior U.S. intelligence official. The official was part of a team investigating reports of unusual noises and sightings of unidentified anomalous phenomena in and near a sensitive U.S. military facility in late 2025. From the official’s vantage point as a helicopter passenger, the official recounts encountering unidentified “glowing orbs” both at close range and at a distance. The account describes an apparent high-speed object moving low to the ground, which appeared to split in two and accelerate away in two different directions. It also describes numerous higher-altitude “orbs,” some of which the official assessed to be in close proximity to the helicopter. This account is accompanied by infrared imagery taken during the same exercise by other federal officials from the ground, originally released on war.gov/UFO on May 8, 2026.</p>
