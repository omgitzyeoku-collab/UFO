  <h1>Intelligence Official Reports Hour-Long Orb Encounters Over U.S. Test Range</h1>
  <div class="meta">
    <span class="badge">Office of the Director of National Intelligence</span>
    <span class="badge">2025</span>
    <span class="badge">Western United States</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/87297ea7ad56473613924b4a11c1c88b42d99515b814c4a4f95d84d60013787e.jpg" alt="Intelligence Official Reports Hour-Long Orb Encounters Over U.S. Test Range thumbnail" loading="lazy" />
  <p>A senior U.S. intelligence official submitted a first-person account to the Office of the Director of National Intelligence describing multiple glowing orbs encountered during a helicopter mission over a military test range in late 2025. The objects reportedly split apart, formed geometric patterns, approached within ten feet of the aircraft, and appeared to pace fighter jets.</p>
  <div class="narr">This document, designated ODNI-UAP-D001, is a first-person narrative written by an unnamed senior U.S. intelligence community official and filed with the Office of the Director of National Intelligence (ODNI). It describes events during a helicopter mission over a sensitive military test range in the western United States in late 2025.

The stated mission was to investigate loud thuds heard in mountains on the range that coincided with reported Unidentified Aerial Phenomena (UAP) sightings. The crew — the author, a colleague, and two pilots — departed from a Joint Operations Center. During the initial search they found rocket debris from prior weapons testing and a large cave entrance with no visible end. As darkness fell, the pilots switched to infrared sensors and night-vision goggles, and radar detected hits in an area of prior UAP activity.

What followed, according to the account, was over an hour of close encounters with glowing objects. The author describes oval-shaped orbs — orange with a white or yellow center, emitting light in all directions — that exhibited unusual behaviour: one was described as splitting into two, another approached within ten feet of the helicopter before accelerating away, and groups formed distinct T-shaped and triangular formations. The helicopter attempted pursuit at one point but could not match the object&#39;s speed.

Fighter jets already airborne on a training mission were asked to assist. The author states that orbs appeared directly above the jets, matching their speed and flight path at approximately 23,000 feet. The orbs eventually formed a triangle and vanished.

The document does not include any agency conclusion about what the objects were. No photographic evidence, radar data, or sensor recordings are attached. The account was written after the fact rather than recorded in real time.</div>
