  <h1>Delta Crew Reports Unexplained Lights Over Kansas at 37,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/39b9329ee5daf114eccc61caf7a950d5c12c52779bc33d0845f2c12c4f289319.jpg" alt="Delta Crew Reports Unexplained Lights Over Kansas at 37,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a December 2021 sighting by the crew of Delta Air Lines flight 967, who observed unidentified airborne lights while flying at 37,000 feet near Manhattan, Kansas. Air traffic control, the pilot, and a nearby military range all failed to identify the source, and the case was closed without explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unidentified aerial phenomena reported by pilots. It covers a sighting by the crew of Delta Air Lines flight 967, a Boeing 757-200 operating from San Francisco (SFO) to Atlanta (ATL) on 18 December 2021.

The crew was flying southeast at Flight Level 370 (approximately 37,000 feet) and was about 10 nautical miles south of Manhattan, Kansas, when they reported airborne lights travelling left to right off the left side of the aircraft. Air traffic control asked follow-up questions and confirmed the pilot did not believe the lights were lasers.

A nearby military range was contacted and confirmed there was no range activity or flare deployment at the time of the sighting. No other pilots or ground observers reported seeing anything similar.

The case is marked as closed. Importantly, &#39;closed&#39; does not mean the lights were identified or explained — it means the FAA completed its inquiry. No resolution or identification is recorded in the report.</div>
