  <h1>American Airlines Crew Reported Unidentified Object at 34,000 Feet Over Idaho</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/777916d43dcb793dd49fa55e36515141f70cf9c2065d5da9582ce7040848305d.jpg" alt="American Airlines Crew Reported Unidentified Object at 34,000 Feet Over Idaho thumbnail" loading="lazy" />
  <p>An FAA incident notification records that the crew of American Airlines flight 2003, flying from Dallas/Fort Worth to Seattle on 22 December 2023, reported an unidentified aerial phenomenon directly ahead of their aircraft at 34,000 feet near Pocatello, Idaho. No evasive action was taken and no law enforcement was notified. The document is a preliminary operational notice, not a full investigation.</p>
  <div class="narr">On the evening of 22 December 2023, at 9:15 PM Mountain Standard Time, the crew of American Airlines flight 2003 — an Airbus A321neo en route from Dallas/Fort Worth to Seattle — reported an unidentified aerial phenomenon to air traffic control. The aircraft was flying northeast at approximately 34,000 feet, positioned 41 nautical miles south-southwest of Pocatello, Idaho (coordinates 42.35°N, 112.87°W). The crew said the object was at their 12 o&#39;clock position, meaning directly ahead of the aircraft.

Salt Lake City Air Route Traffic Control Center (ARTCC), the regional radar facility responsible for that airspace, was advised of the report. The crew took no evasive action and no law enforcement agency was contacted.

The document itself is an FAA Washington Operations Center incident notification — essentially a preliminary log entry recording that the event occurred. It does not contain a description of what the crew saw: no shape, size, speed, colour, or behaviour of the object is mentioned. It is not an investigation report and draws no conclusions about what the phenomenon was.

No corroborating radar data or sensor readings are referenced in the document. The entire account rests on the flight crew&#39;s report as relayed through FAA channels. The record shows minimal redaction.</div>
