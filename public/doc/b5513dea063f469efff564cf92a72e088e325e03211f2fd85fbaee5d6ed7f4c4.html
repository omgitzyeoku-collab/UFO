  <h1>FBI Interview Records Witness Account of Red Orbs in Backyard</h1>
  <div class="meta">
    <span class="badge">FBI</span>

  <img class="thumb" src="/extract/thumbs/b5513dea063f469efff564cf92a72e088e325e03211f2fd85fbaee5d6ed7f4c4.jpg" alt="FBI Interview Records Witness Account of Red Orbs in Backyard thumbnail" loading="lazy" />
  <p>This is an FBI interview report (FD-302) from February 2026 documenting a witness&#39;s account of glowing red spheres hovering in their backyard in the northeastern United States. The witness described two silent, metre-wide red orbs with white plasma-like centres that moved in tandem before appearing to merge into one, followed weeks later by a separate sighting of white orbs at higher altitude.</p>
  <div class="narr">This document is an FBI FD-302 — a standard form the Bureau uses to record the contents of witness interviews. In February 2026, FBI agents interviewed a U.S. person via Microsoft Teams videoconference about a UAP (unidentified anomalous phenomena) sighting at the witness&#39;s residence somewhere in the northeastern United States. The witness holds a bachelor&#39;s degree in economics and finance.

According to the witness, they noticed an intense bright light hovering below the tree line in the middle of their backyard. They described it as a red sphere roughly one metre across, with a colour they called &quot;brilliant and beautiful&quot; and unlike any red they had seen before. At its centre was what the witness called a &quot;white plasma sun,&quot; about the size of a basketball. A second person at the residence confirmed seeing the witness standing by a vehicle looking into the backyard via a security camera, then went outside and also observed the objects.

A second identical orb appeared above the first. The two moved silently and smoothly westward, changing both altitude and direction, as if tethered together or flying in formation. As they departed, the orbs appeared to merge into a single object — or drew so close together that only one was visible. The witness captured video of the orbs once they were above the tree line and moving away; this video is referenced as an attachment (FBI-UAP-PR004) but is not included in the document itself.

Weeks later, the same witness reported seeing several white orbs travelling from west to east over their house at a higher altitude, each appearing roughly the size of a dime held at arm&#39;s length.

The document is heavily redacted: all names, specific dates beyond the month, exact locations, and identifying details of both the witnesses and the interviewing agents have been removed. The FBI drew no stated conclusion in the released text about what the objects were.</div>
