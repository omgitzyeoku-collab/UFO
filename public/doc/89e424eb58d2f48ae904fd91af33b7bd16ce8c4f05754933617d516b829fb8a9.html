  <h1>FAA Report: Pilot on American Airlines Flight Spotted Flashing Lights at 47,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/89e424eb58d2f48ae904fd91af33b7bd16ce8c4f05754933617d516b829fb8a9.jpg" alt="FAA Report: Pilot on American Airlines Flight Spotted Flashing Lights at 47,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a pilot aboard American Airlines flight AAL116, a Boeing 777-200 flying from OGG (Maui) to DFW (Dallas-Fort Worth), who reported seeing an unidentified aerial phenomenon with alternating flashing lights off the left side of the aircraft on 1 May 2023. The case was closed with no stated resolution, and the report itself notes that 6–8 low-Earth-orbit satellites were in the area at the time.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00260, categorised as an &quot;Unidentified Aerial Phenomenon.&quot; It records a sighting reported by the pilot of American Airlines flight AAL116, a Boeing 777-200 travelling from OGG (Maui, Hawaii) to DFW (Dallas-Fort Worth, Texas) on 1 May 2023. The report was made to the Los Angeles Air Route Traffic Control Centre (ZLA).

According to the report, the aircraft was cruising northeast-bound at 37,000 feet when the pilot observed an unidentified aerial phenomenon off the left side of the aircraft. The object was located approximately 235 nautical miles on a 210-degree bearing from the SXC navigation point. It displayed alternating flashing lights and was travelling in the same direction as the aircraft, at an estimated altitude of approximately 10,000 feet above — putting it at roughly 47,000 feet.

The report notes that there were approximately 6–8 low-Earth-orbit (LEO) satellites in the area at the time of the sighting, which suggests a possible conventional explanation. The case is marked as &quot;Closed,&quot; but no determination or resolution is stated in the document. Notably, no aircraft tail number is recorded, which is unusual for an FAA incident report.

There is minimal redaction in this document. What limits its evidentiary value is not what was removed, but what was never included: no radar data, no imagery, and no corroborating observations from other aircraft or ground stations.</div>
