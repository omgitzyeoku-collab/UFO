  <h1>United Airlines crew reported lights orbiting above their Boeing 737</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/3e3a9486840e5df8287978ac21174497112c70174ed31b4ae934ee934fc13643.jpg" alt="United Airlines crew reported lights orbiting above their Boeing 737 thumbnail" loading="lazy" />
  <p>An FAA incident report documents a United Airlines flight crew observing an unidentified aerial phenomenon with lights orbiting above their aircraft at 38,000 feet over Montana in February 2023. The case was closed with no evasive action taken and no further investigation findings included.</p>
  <div class="narr">On 4 February 2023, the crew of United Airlines flight UAL1580 — a Boeing 737-800 flying from Chicago O&#39;Hare to Vancouver — reported seeing an unidentified aerial phenomenon above their aircraft. The sighting occurred at 04:39 UTC while the plane was cruising westbound at 38,000 feet, roughly 60 nautical miles east of Billings, Montana.

According to the FAA&#39;s SKYWATCH incident report, the unknown phenomenon had lights and was described by the crew as &quot;orbiting.&quot; The aircraft took no evasive action. The FAA&#39;s Air Watch Office (AWO) was notified.

The case is marked as closed. However, the report contains no investigation findings, no radar corroboration, and no follow-up analysis explaining what the object might have been or why the case was closed without further detail.

The document itself is brief — a standard FAA incident log rather than a detailed investigation file. It records the crew&#39;s account and basic flight data but offers no conclusions about what was observed.</div>
