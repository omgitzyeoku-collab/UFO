  <h1>U.S. Air Force Crew Spotted Five Unidentified Objects Over Middle East in 2022</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">Middle East</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f9deed9063306b0c45a5a0f6b754db6967f7dc3a0ed66097f154be4b0f033399.jpg" alt="U.S. Air Force Crew Spotted Five Unidentified Objects Over Middle East in 2022 thumbnail" loading="lazy" />
  <p>A formerly secret U.S. military mission report describes a single Air Force aircraft observing five unidentified aerial phenomena during a reconnaissance mission over the Middle East on 6 May 2022. One object resembled a possible missile; the other four looked more like birds. The sightings remain officially unresolved.</p>
  <div class="narr">On 6 May 2022, a U.S. Air Force intelligence, surveillance, and reconnaissance aircraft was flying a planned mission over the Middle East as part of Operation Inherent Resolve. The crew was conducting reconnaissance and close air support, tasked with reporting on personnel, vehicles, weapons, and other ground activity. The aircraft carried full-motion video and signals intelligence sensors, both reported as fully operational.

Starting at 1514Z (mid-afternoon UTC), and continuing until 1934Z — a window of roughly four hours and twenty minutes — the crew observed five unidentified objects fly across their sensor display. The first object had the visual appearance of a possible missile crossing the field of view. The remaining four objects more closely matched the profile of possible birds. Dusty conditions on the ground degraded the quality of the video footage throughout much of the mission.

The report was filed through the 609th Combined Air Operations Center under U.S. Central Command. Only five seconds of infrared video accompanied the submission, showing a single area of contrast moving across the frame. The other four objects were not captured in the submitted footage. The full-motion video was analysed by Distributed Ground Station 1.

The document was originally classified SECRET, releasable to the U.S. and Five Eyes allies, with a scheduled declassification date of 6 May 2047. It was declassified early on 7 October 2025 by Major General Richard A. Harrison, USCENTCOM Chief of Staff. Heavy redactions remain throughout the document, obscuring the aircraft type, crew names, exact coordinates, sensor details, and weapons loadout.

The crew&#39;s descriptions — &quot;possible missile&quot; and &quot;possible birds&quot; — are their visual assessments, not confirmed identifications. The report itself classifies all five sightings as unresolved. No radar data, corroborating sensor information, or independent observer reports are included in this document.</div>
