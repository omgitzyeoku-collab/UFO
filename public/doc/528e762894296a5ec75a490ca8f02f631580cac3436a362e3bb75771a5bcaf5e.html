  <h1>C-130 Crew Reported Small Orb Over Wyoming at 24,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/528e762894296a5ec75a490ca8f02f631580cac3436a362e3bb75771a5bcaf5e.jpg" alt="C-130 Crew Reported Small Orb Over Wyoming at 24,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH report documents a C-130 crew sighting of a 1-to-2-metre orb travelling eastbound over Laramie, Wyoming, while they flew westbound at approximately 24,000 feet on 11 May 2024. Air traffic control radar did not detect the object, and the case was closed without explanation.</p>
  <div class="narr">This document is an FAA incident report filed through the agency&#39;s SKYWATCH system — a channel for logging unidentified aerial phenomena observed by pilots. It was submitted via the Denver (ZDV) reporting facility under reference ZDV-M-2024/05/11-0004.

On 11 May 2024 at 21:29, the crew of a C-130 aircraft (callsign CNV3460) were flying westbound at flight level 240 — roughly 24,000 feet — over Laramie Regional Airport, Wyoming. The flight had originated from Norfolk Naval Station (NGU) and was headed for Reno (RNO). The crew reported observing a 1-to-2-metre orb travelling eastbound, moving in the opposite direction to their aircraft.

Air traffic control checked their radar and found no corresponding return — the object did not appear on the ATC facility radar system. No tail number is recorded for the reporting aircraft, and the operator is listed simply as CNV (Commercial).

The FAA marked the case as Closed. No resolution, identification, or follow-up action is noted in the report. The document contains minimal redaction but also minimal detail — the entire record is a brief structured form rather than a detailed investigation.</div>
