  <h1>Military Infrared Video Shows Unidentified Object in Middle East, 2020</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2020</span>
    <span class="badge">CENTCOM</span>
    <span class="badge">verified</span>
  </div>
  
  <p>This is a five-minute infrared video from August 2020, assessed by the Pentagon&#39;s UAP office as likely recorded by a U.S. military sensor in the Middle East (CENTCOM region). The video shows a sensor tracking an unidentified &quot;area of contrast&quot; moving across the frame, but the material lacks a verified chain of custody and the original unit and mission details are redacted.</p>
  <div class="narr">On 24 August 2020, a U.S. military platform operating in the United States Central Command (CENTCOM) area of responsibility — a region covering the Middle East and parts of Central and South Asia — recorded roughly five minutes of infrared video. The footage shows a sensor locking onto and tracking what is described only as an &quot;area of contrast&quot; as it moves across the field of view. The operator zooms in during the sequence. A user uploaded the video to a classified network that same month.

The video came to public attention after eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records on 6 March 2026. The All-domain Anomaly Resolution Office (AARO), the Department of War&#39;s body responsible for investigating unidentified aerial phenomena, identified this video as responsive to that congressional request.

AARO&#39;s assessment uses qualifying language: the office says the video is &quot;likely derived from&quot; an infrared sensor aboard a U.S. military platform. It does not state this definitively. No conclusion is offered about what the object in the video might be — it is described throughout only as an area of contrast, with no further identification or explanation.

The document is heavily redacted. The callsign of the military unit involved has been removed from the title, making it impossible to independently verify which platform or mission recorded the footage. The video&#39;s metadata description cuts off after the 22-second mark, so the full content of the remaining four-and-a-half minutes is not described in the available record. AARO itself notes that many of the materials in this collection lack a substantiated chain of custody — meaning there is no verified paper trail confirming where this video came from or how it reached the classified network.</div>
