  <h1>Pentagon Office Released UAP Reporting Trends Infographic Covering 1996–2023</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/addeed49eaaa5c913d7f3bc47255b7979c198b5c8a2dda0ed426f63512131f91.jpg" alt="Pentagon Office Released UAP Reporting Trends Infographic Covering 1996–2023 thumbnail" loading="lazy" />
  <p>This document is the internal approval package for a one-page infographic by the All-domain Anomaly Resolution Office (AARO) summarising UAP reporting trends from 1996 to 2023. It was cleared for public release on the AARO website on November 21, 2023, the same day it was submitted, with no objections from reviewers. The infographic describes typical UAP characteristics: round objects, 1–4 meters in size, at 10,000–30,000 feet altitude, with no thermal exhaust detected.</p>
  <div class="narr">In November 2023, the All-domain Anomaly Resolution Office — the Pentagon body responsible for investigating unidentified anomalous phenomena — prepared a one-page infographic titled &#39;UAP Reporting Trends&#39; covering data from 1996 to 2023. The office submitted it for a routine prepublication security review on November 21, 2023, under case number 24-T-0401. It was cleared for open publication on the aaro.mil website that same day, with all reviewers returning &#39;no objection.&#39; The document was unclassified, and AARO Deputy Director Timothy A. Phillips signed off on the submission.

The infographic itself profiles what a &#39;typical&#39; reported UAP looks like according to the accumulated data. The most commonly reported shape is round, followed by ambiguous sensor contacts (9%), cylinders and ovals (5% each), triangles (4%), square or polygon shapes (3%), and disks (2%). Typical reported size is 1–4 meters, typical altitude is 10,000–30,000 feet — overlapping with commercial air traffic — and reported speeds range from stationary to Mach 2. Notably, no thermal exhaust has been detected from reported UAPs.

Sensor data in the infographic describes intermittent radar signatures on X-Band (8–12 GHz), radio frequency emissions in the 1–3 GHz and 8–12 GHz bands, and intermittent thermal signatures in shortwave and medium-wave infrared. An internal email reveals that AARO staff asked whether routine minor percentage updates to this infographic would require repeated security reviews, suggesting the office intended to keep updating it.

All personal names in the package except Timothy A. Phillips have been redacted under the (b)(6) privacy exemption. The underlying geographic hotspot map and year-by-year trend chart referenced in the infographic were not fully captured in the text extraction, so their details are unavailable.</div>
