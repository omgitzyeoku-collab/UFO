  <h1>United Airlines Crew Reported Large Balloon at 39,000 Feet Near Chicago</h1>
  <div class="meta">
    <span class="badge">FAA</span>

    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/80d10cb883c264780792a825b893202bcd4eec07dba44c070ab33b91477586f5.jpg" alt="United Airlines Crew Reported Large Balloon at 39,000 Feet Near Chicago thumbnail" loading="lazy" />
  <p>An FAA incident report documents a United Airlines Boeing 737-800 crew observing what they described as a large balloon while flying at 39,000 feet near Chicago on 3 February 2023. The FAA classified the object as an Unidentified Aerial Phenomenon and closed the case without providing resolution details.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form the Federal Aviation Administration uses to log pilot observations of unusual objects in US airspace. It records an event on 3 February 2023 involving United Airlines flight 532, a Boeing 737-800 flying a commercial route from Denver (DEN) to Chicago O&#39;Hare (ORD).

According to the report, the flight crew reported passing under a large balloon while heading eastbound at flight level 390 — roughly 39,000 feet. The observation occurred approximately 20 nautical miles east of Chicago Executive Airport (PWK), placing it in the greater Chicago area.

Despite the crew describing the object as a large balloon, the FAA classified the incident under its primary code for Unidentified Aerial Phenomenon. This classification indicates that no formal identification of the object was confirmed through the FAA&#39;s reporting process.

The case is marked as closed. The document includes no resolution details, no corroborating radar data, and no imagery. It is a single-source pilot report — one crew&#39;s account filed through standard FAA channels.

The report shows minimal redaction. What is notable is not what was hidden but what is absent: there is no follow-up investigation documented, no explanation of what the object was, and no indication that the FAA pursued further identification.</div>
