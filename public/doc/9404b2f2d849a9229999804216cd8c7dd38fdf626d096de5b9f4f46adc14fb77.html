  <h1>Pentagon Office Publishes Brochure Explaining How to Report UAP</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9404b2f2d849a9229999804216cd8c7dd38fdf626d096de5b9f4f46adc14fb77.jpg" alt="Pentagon Office Publishes Brochure Explaining How to Report UAP thumbnail" loading="lazy" />
  <p>This is an unclassified informational brochure from the All-domain Anomaly Resolution Office (AARO), the Pentagon&#39;s UAP investigation unit. It explains what UAP are, describes AARO&#39;s mission to detect and analyse them across air, sea, and space, and tells government personnel and civilian pilots how to file reports.</p>
  <div class="narr">In 2024, the Department of Defense&#39;s All-domain Anomaly Resolution Office — known as AARO — published a trifold brochure explaining its role and how people should report sightings of Unidentified Anomalous Phenomena (UAP). The brochure was cleared for public release on 27 June 2024 and later reviewed by AARO&#39;s Chief of Staff on 20 March 2025. It was released in full with no redactions.

The brochure defines UAP as &quot;sources of anomalous detections&quot; in the air, at sea, in space, or moving between these domains that &quot;are not yet attributable to known actors.&quot; It states that some UAP &quot;demonstrate apparent capabilities or material that exceed known performance envelopes&quot; and that their existence is a &quot;direct consequence of domain-awareness gaps.&quot; AARO describes its legal authority as deriving from the FY24 National Defence Authorisation Act, codified at 44 U.S.C. 2107.

AARO explains that it accepts reports from current or former US Government employees, service members, and contractor personnel with direct knowledge of government programmes or activities related to UAP. A reporting form is available at www.aaro.mil, though the brochure notes the form is not intended for sensitive or classified information. Military and DoD civilian personnel are directed to report through their chain of command per a May 2023 Joint Staff directive. Civilian pilots are encouraged to report UAP sightings to air traffic control, and AARO receives these pilot reports through the Federal Aviation Administration.

The brochure also notes that AARO was created because Congress and the Department of Defense recognised that UAP &quot;present complex hazards and threats across service, regional, and domain boundaries.&quot; AARO describes four functional areas: Science and Technology, Analysis, Operations, and Strategic Communications. It is also collecting reports to support a congressionally directed Historical Record Report.</div>
