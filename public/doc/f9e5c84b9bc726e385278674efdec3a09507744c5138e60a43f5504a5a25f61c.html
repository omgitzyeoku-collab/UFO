  <h1>American Airlines Crew Reported Seven Lights at 33,000 Feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/f9e5c84b9bc726e385278674efdec3a09507744c5138e60a43f5504a5a25f61c.jpg" alt="American Airlines Crew Reported Seven Lights at 33,000 Feet in 2023 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a sighting by the crew of American Airlines flight 821 on July 23, 2023. While flying an Airbus A321 from San Diego to Charlotte at 33,000 feet, the crew reported seven unidentified lights traveling in the opposite direction at roughly the same altitude. The case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP) in US airspace. It was filed under case number 237UAP00280, with a Mandatory Occurrence Report ID of ZFW-M-2023/07/23-0001.

On July 23, 2023, the crew of American Airlines flight 821 — an Airbus A321 operating a commercial service from San Diego (SAN) to Charlotte (CLT) — reported an unidentified aerial phenomenon off the left side of their aircraft. The plane was eastbound at flight level 330 (33,000 feet), approximately four nautical miles east of the FUZ navigational fix. The crew described the phenomenon as seven lights traveling westbound at roughly the same altitude.

The sighting was reported to Fort Worth Center (ZFW), the FAA air traffic control facility responsible for that sector of airspace. The report is classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot;

The case status is listed as closed. The document contains no resolution, no follow-up investigation notes, and no explanation for what the crew observed. There is no radar data, no corroborating witness statements from other aircraft, and no tail number recorded for the reporting aircraft.</div>
