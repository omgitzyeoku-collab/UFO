  <h1>Delta pilots reported vanishing object over Iowa at 37,000 feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2c023958eaa410d332cf47433c802ba9607da31401745ead1770b82d29c01ce3.jpg" alt="Delta pilots reported vanishing object over Iowa at 37,000 feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a February 2023 sighting by the crew of Delta flight 384, who observed an unidentified object appearing and disappearing off their left side while cruising at 37,000 feet over Iowa City. The FAA noted a similar report the previous week had been attributed to a satellite train, and the case was closed without further investigation.</p>
  <div class="narr">On 11 February 2023, the crew of Delta Air Lines flight 384 — a Boeing 737-800 flying from San Diego to New York JFK — reported an unidentified aerial phenomenon to air traffic control. The sighting occurred while the aircraft was eastbound at flight level 370 (approximately 37,000 feet) over Iowa City.

The crew described an unknown object off the left side of their aircraft that appeared to be circling at or above their altitude. The object was appearing and disappearing. The FAA classified the report under its primary code for an Unidentified Aerial Phenomenon.

The FAA&#39;s Air Traffic Control System Command Center (known as AMOC) noted that the same type of report had come in the previous week and had been attributed to a &quot;train&quot; of satellites — a term typically referring to a string of Starlink-type satellites visible in sequence. However, this explanation was not specifically confirmed for the 11 February sighting.

The case was marked as closed. There is no indication in the document of any follow-up investigation, radar data, or corroborating sensor evidence beyond the crew&#39;s visual observation. No tail number was recorded for the reporting aircraft.</div>
