  <h1>Radar Detected Unidentified Object Near Washington D.C. in 2021</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/445bc68cdbc8ef2fd890a5a7ae6cfc85909a9c88de50a0e8cfa05185c4ea28a8.jpg" alt="Radar Detected Unidentified Object Near Washington D.C. in 2021 thumbnail" loading="lazy" />
  <p>An FAA incident report documents a radar-only detection of an unidentified object moving through restricted airspace near Washington D.C. on November 28, 2021. The object was tracked by two systems that gave conflicting speed readings, was never visually confirmed, and the case was closed without identifying what it was.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00074. It records an event on November 28, 2021 at 8:10 PM, when the Potomac Terminal Radar Approach Control (known as Potomac TRACON or PCT) detected a radar target moving southeast through the Special Flight Rules Area surrounding Washington D.C. — one of the most tightly controlled airspaces in the United States.

The object appeared only on primary radar, meaning it had no transponder broadcasting an identification signal. Two separate tracking systems gave sharply different speed readings: the FAA&#39;s AMOC system showed the target moving southeast at 56 knots, while a Department of Defense system recorded just 10 knots. The report does not explain this discrepancy.

At one point, the target appeared roughly three miles north of Baltimore-Washington International Airport. Controllers contacted the BWI tower, but staff there reported &quot;no joy&quot; — meaning they could not see anything. The object eventually exited the restricted airspace and the FAA took no further action. The case was classified under the primary code &quot;Unidentified Aerial Phenomenon&quot; and marked as closed.

The FAA did not identify the object or offer any explanation for what it was. No one was paged in response to the event, and the report contains no witness statements, photographs, or follow-up investigation notes.</div>
