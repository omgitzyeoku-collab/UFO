  <h1>Apollo 12 Crew Reported Unexplained Lights and Debris Near the Moon</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">1969</span>
    <span class="badge">Moon</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/ab911622b7d4203d9d54914f03d1662cf561b7f943afe9d17f9617cfaea06585.jpg" alt="Apollo 12 Crew Reported Unexplained Lights and Debris Near the Moon thumbnail" loading="lazy" />
  <p>This document is an excerpt from the Apollo 12 air-to-ground voice transcript from November 1969, in which astronauts reported seeing fast-moving particles of light near the Moon and small debris floating alongside their spacecraft. Houston Mission Control offered prosaic explanations for most observations, including water droplets and electromagnetic interference, though some details — like particles that appeared to be &#39;escaping the Moon&#39; — were not fully resolved in the transcript.</p>
  <div class="narr">This document is a portion of the official voice transcript between the Apollo 12 crew and Houston Mission Control, recorded during the mission in November 1969. It captures several exchanges in which crew members describe unusual observations while orbiting the Moon.

During Day 5 of the mission, astronaut Alan Bean reported seeing flashes and particles of light through the Alignment Optical Telescope (AOT) in the dark portion of his view. He described them as appearing to come from behind and to the left, moving rapidly away from the Moon toward the stars. Bean noted that some of the particles looked like they were &#39;escaping the Moon,&#39; though he initially suspected they might be water droplets from the spacecraft&#39;s water boiler system.

Separately, Bean reported a display anomaly on the DEDA (Data Entry and Display Assembly), a readout for the spacecraft&#39;s guidance system. The display was pulsing with repeated &#39;81s&#39; at roughly one-fifth normal brightness. Houston attributed this to electromagnetic interference, a phenomenon they said had been observed during ground testing of spacecraft at Bethpage.

On Day 6, Commander Pete Conrad reported small bits and pieces of debris floating alongside the spacecraft during a nightside pass. He believed the spacecraft&#39;s tracking light had burned out because it was no longer illuminating the debris. However, Houston&#39;s telemetry data showed the tracking light was still drawing current and should have been on. Command Module Pilot Dick Gordon, orbiting separately, confirmed he could not see the tracking light through his sextant either, leaving the discrepancy unresolved in the transcript.

The transcript does not contain a formal investigation or conclusion about these observations. The crew and Mission Control discussed ordinary explanations during the exchanges, and no follow-up assessment appears in this excerpt.</div>
