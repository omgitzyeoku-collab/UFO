  <h1>Frontier Airlines Crew Reports Flashing Lights at 35,000 Feet Over North Carolina</h1>
  <div class="meta">
    <span class="badge">FAA</span>

    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/7f938696bc066732aa778f77a875c4e53b19d5b51cce3c93bb8911d8c9e9cee1.jpg" alt="Frontier Airlines Crew Reports Flashing Lights at 35,000 Feet Over North Carolina thumbnail" loading="lazy" />
  <p>An FAA operations center report documents the crew of Frontier Airlines flight 1164 observing two intermittent flashing lights off the left side of their aircraft while flying at 35,000 feet near Southern Pines, North Carolina on April 17, 2023. The lights were traveling in the opposite direction at the same altitude, and no identification was made.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed on April 17, 2023. It records a pilot observation of an unidentified aerial phenomenon — meaning the crew saw something they could not identify.

The crew of Frontier Airlines flight 1164, an Airbus A321 flying from Orlando to Philadelphia, reported seeing two intermittent flashing lights off the left side of their aircraft. The sighting occurred while the plane was flying northeast at 35,000 feet, approximately 14 nautical miles south of the Sandhills navigational point (known as SDZ) near Southern Pines, North Carolina. The lights were traveling southeast — the opposite direction — at the same altitude.

Washington Air Route Traffic Control Center (ARTCC), the controlling air traffic facility, was advised of the report. No law enforcement agency was notified.

The FAA report does not reach a conclusion about what the lights were. This is a preliminary operations center log, not a completed investigation. No radar data, photographs, or additional witness accounts are included in the document.</div>
