  <h1>FAA Report: Pilot Spotted Balloon-Like Object at 50,000 Feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/c89e04964197454b073ad3815f06017f6287351a07050e4fd6bc178e25787428.jpg" alt="FAA Report: Pilot Spotted Balloon-Like Object at 50,000 Feet in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from 3 February 2023 in which a general aviation pilot (callsign N771HM) reported seeing an unidentified aerial phenomenon — tentatively described as a balloon — roughly 10,000 feet above their aircraft. The case was closed with no resolution or follow-up details provided.</p>
  <div class="narr">On 3 February 2023, the FAA logged a SKYWATCH incident report under case number 237UAP00164. A general aviation pilot flying under callsign N771HM reported an unidentified aerial phenomenon while travelling westbound at FL400 (approximately 40,000 feet) on a route from MQS to Centennial Airport (APA) near Denver.

The pilot described the object as being off to the west side of the aircraft at FL500 — roughly 50,000 feet, about 10,000 feet above the reporting aircraft. The report parenthetically labels the object a &quot;Balloon,&quot; suggesting either the pilot or the reporting facility tentatively identified it that way, though the FAA still coded the event as an unidentified aerial phenomenon.

The sighting was reported through Kansas City Center (ZKC), one of the FAA&#39;s air route traffic control centres. The report contains no mention of radar data, additional witnesses, or corroborating sensor evidence.

The case is marked as closed. No resolution, follow-up investigation, or final determination is included in the document. The timing is notable: 3 February 2023 fell during a period of heightened public and military attention to balloon sightings over US airspace, including the widely reported Chinese surveillance balloon incident.</div>
