  <h1>Federal Agent Reports Unexplained Lights Over Western US Desert</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">October, 2023</span>
    <span class="badge">Westen United States</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/d522d9a289caaa7b2c9143bc1e80aa37764066791097824ffeb898b500200e1e.jpg" alt="Federal Agent Reports Unexplained Lights Over Western US Desert thumbnail" loading="lazy" />
  <p>A U.S. federal law enforcement agent submitted a first-hand account to the Pentagon&#39;s UAP office describing bright orange lights that formed geometric patterns, appeared to eject smaller lights, and a silent hovering object observed at close range over several days in October 2023. The document is a single-witness narrative with no accompanying sensor data or corroborating evidence.</p>
  <div class="narr">This document is a witness statement submitted to the All-domain Anomaly Resolution Office (AARO), the Pentagon&#39;s office responsible for investigating unidentified anomalous phenomena (UAP). It was signed by AARO Director Jon T. Kosloski and dated 2 June 2026. The witness, identified only as &quot;Witness 4,&quot; is described as a U.S. federal law enforcement special agent — one of several agents who reported observing the same phenomena.

The account describes events spanning multiple days in October 2023 in desert terrain in the western United States. On the first evening, just after sunset, the witness observed a bright ball of light streaking across the sky at an estimated 1,000–2,000 feet above ground level, changing colour from amber to orange to yellow-white. Using night vision goggles, the witness saw additional lights not visible to the naked eye, including bright orange lights that appeared to eject smaller orange lights — something the witness described as &quot;hatching.&quot; This occurred more than five times. Nine lights were also seen arranged in a static horizontal line above a ridgeline for over 30 seconds. The witness reports these observations continued nonstop for two to three hours, with lights forming geometric shapes including diamonds, hexagons, and triangles.

On a subsequent occasion, the witness observed a light rapidly traversing up and down a mountain within seconds — a movement the witness stated would be impossible for a standard vehicle — producing no dust cloud on the rough desert roads. A separate observation at roughly 400 metres distance revealed an object hovering silently between two mountain ridges with a faint red light, making no sound and showing no movement despite heavy winds. The witness noted it appeared to be using the terrain to stay hidden. Months later, the witness saw a yellow light at midnight moving north to south, estimated at about 16 miles away, which was visible for roughly 10 minutes.

The document is unclassified and contains minimal redaction. AARO has not included any analysis, conclusions, or assessment of what the witness observed. It is presented solely as a narrative statement. The witness provided a sketch, though its content is not clearly reproduced in the text extraction.</div>
