  <h1>Police Reported Large Grey Object Hovering Over Missouri in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/162f0878addd720ecd22c3aae956fceb5ab8641b52fcb48608b68dacd2d4fde6.jpg" alt="Police Reported Large Grey Object Hovering Over Missouri in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a 2023 observation by the Excelsior Springs Police Department of a large, grey object with white lights hovering at high altitude for over an hour. A pilot asked to investigate suggested it might be space junk or satellites, but no confirmed identification was made and the case was closed.</p>
  <div class="narr">In 2023, the Excelsior Springs Police Department in Missouri observed and reported an unidentified aerial phenomenon to the Federal Aviation Administration (FAA). The sighting was logged under FAA SKYWATCH, the agency&#39;s system for tracking unusual aerial observations, and assigned the case number 237UAP00231.

According to the report, the object was located roughly 2.5 nautical miles northwest of Excelsior Springs Memorial Airport. It was described as very large and grey with white lights, and it remained stationary for over an hour at very high altitude.

At 02:19, air traffic control requested a pilot flying under the callsign FFT647, who was already in the area, to observe and provide a report. The pilot in command assessed that the lights were likely &quot;space junk&quot; or &quot;satellites.&quot; That assessment is the pilot&#39;s personal opinion and was not confirmed by radar, instrument readings, or any other sensor data referenced in the report.

The FAA marked the case as Closed. There is no indication in the report of any follow-up investigation or final determination of what the object was.</div>
