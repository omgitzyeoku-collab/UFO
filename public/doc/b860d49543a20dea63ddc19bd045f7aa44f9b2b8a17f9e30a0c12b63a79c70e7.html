  <h1>Delta Airlines Crew Reports Ten Lights Over Mississippi at 35,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>

    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/b860d49543a20dea63ddc19bd045f7aa44f9b2b8a17f9e30a0c12b63a79c70e7.jpg" alt="Delta Airlines Crew Reports Ten Lights Over Mississippi at 35,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a brief sighting by the crew of Delta flight 395 on 5 February 2023. While cruising at 35,000 feet near Jackson, Mississippi, the crew observed roughly ten lights at high altitude moving in multiple directions for 5–10 seconds before they faded. No evasive action was taken and no follow-up investigation is included in this document.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed on 5 February 2023. It records a UAP (unidentified aerial phenomenon) sighting made by the flight crew of Delta Air Lines flight 395, a Boeing 767-300 flying from Los Angeles to Atlanta.

At approximately 04:00 Central Standard Time, while eastbound at flight level 350 (about 35,000 feet) and located 35 nautical miles west-northwest of Jackson, Mississippi, the crew reported seeing something directly ahead of the aircraft — at the 12 o&#39;clock position. They described approximately ten lights at high altitude moving in multiple directions. The lights were visible for just 5–10 seconds before fading out.

The crew did not take evasive action. The sighting was relayed through Memphis Air Route Traffic Control Center (ARTCC) to FAA operations, and was logged under reference number WOC 7-3333 JG/RC.

The report is preliminary. It contains no radar data, no photographs, and no conclusions about what the lights were. There is no indication that a follow-up investigation was conducted, at least within this document. Redaction levels are low — the text appears largely intact.</div>
