  <h1>CIA Report Relays Secondhand Account of Flying Objects Over Budapest in 1955</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1956</span>
    <span class="badge">Budapest, Hungary</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/6004fb66d76ccf50c3f0729bd218efcd4485395e8491e88b1bf257fc2ea36733.jpg" alt="CIA Report Relays Secondhand Account of Flying Objects Over Budapest in 1955 thumbnail" loading="lazy" />
  <p>This CIA information report passes along a secondhand account from a naturalized US citizen whose niece in Budapest wrote to him in November 1955 describing unusual flying objects seen over the city for several weeks. The CIA explicitly marked the report as unevaluated information, and moderate redactions obscure source-identifying details.</p>
  <div class="narr">This document is a CIA information report (number OO-B-93674) that records a secondhand account of unusual flying object sightings over Budapest, Hungary. The report was prepared and distributed by the Central Intelligence Agency, with circulation restricted to full-time employees of the CIA, the Atomic Energy Commission (AEC), the FBI, and the intelligence branches of the State and Defense departments.

The source was a naturalized US citizen who received a letter from his niece in Budapest in November 1955. The niece described flying objects that had been observed over the city for several weeks, keeping the local population in a nervous state and generating significant interest from the scientific community. A speed of 12,000 kilometres per hour was attributed to the objects, though no methodology for that estimate is stated in the report. The niece included a sketch showing the objects&#39; formation and their suspected flight path from Budapest toward Moscow. The letter writer noted this was the first time his niece had ever mentioned such objects in her correspondence.

The CIA retained a photostatic copy of the original letter along with an English translation in its library. The agency stamped the report as unevaluated information — meaning the CIA passed it along without vouching for its accuracy or drawing any conclusion about what the objects were.

Moderate redactions are present in the document, particularly around details that could identify the source. A more heavily redacted version of this same report was previously available on the CIA&#39;s public website, meaning this release contains material that was previously withheld.</div>
