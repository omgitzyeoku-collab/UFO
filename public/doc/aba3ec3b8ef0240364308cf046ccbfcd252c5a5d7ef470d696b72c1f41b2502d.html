  <h1>1963 White House Staff Memo Explored Policy If Aliens Were Found</h1>
  <div class="meta">
    <span class="badge">Department of State</span>
    <span class="badge">7/18/63</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/aba3ec3b8ef0240364308cf046ccbfcd252c5a5d7ef470d696b72c1f41b2502d.jpg" alt="1963 White House Staff Memo Explored Policy If Aliens Were Found thumbnail" loading="lazy" />
  <p>A July 1963 memorandum from a staff member of the National Aeronautics and Space Council — part of the Executive Office of the President — discussed what U.S. policy should be if intelligent alien life were discovered in space. It was a speculative contingency exercise, not a report of any actual encounter, and was marked at the lowest restricted classification level.</p>
  <div class="narr">On July 18, 1963, Maxwell W. Hunter II, a professional staff member of the National Aeronautics and Space Council, sent a memorandum to Robert F. Packard at the Department of State&#39;s Office of International Scientific Affairs. The subject line was direct: &quot;Thoughts on the Space Alien Race Question.&quot; The question had come up during deliberations on something called BNSP Task I, and Hunter decided to put his thinking on paper.

Hunter argued that scientific understanding of the time made intelligent life in our own solar system unlikely, but that modern theories of star formation suggested most stars would have planetary systems — meaning the number of potentially habitable worlds in the galaxy could be enormous. He noted that biology had nearly traced a chain from inanimate molecules to elementary living viruses, making the emergence of life seem like a natural process rather than a freak event.

The core of the memo categorized three possible types of alien civilizations the U.S. might encounter: those with primitive chemical-rocket technology, those with nuclear-powered spaceflight, and those capable of faster-than-light travel. Hunter argued that each scenario would demand a fundamentally different diplomatic response. He estimated that a civilization with nuclear propulsion could build ships traveling at half to three-quarters of the speed of light, and could spread across the entire galaxy in roughly 200,000 years.

Hunter concluded that discovering any alien race would likely push humanity to immediately unify — &quot;the immediate burying of all Terrestrial hatchets,&quot; as he put it. He observed drily that the only body of writing available on the topic in an emergency was science fiction, and predicted that without preparation, policy would be determined by &quot;grand panic.&quot; The memo was marked &quot;Official Use Only&quot; — the lowest restricted classification — indicating it was not considered highly sensitive material.</div>
