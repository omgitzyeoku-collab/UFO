  <h1>CIA Memo Shows Agency Gave Evasive Answers to Physicist About Destroyed Records</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1958</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3e03f61e60ce007256731bcb7119d15829cee3d532b21336c7c06177c19414c8.jpg" alt="CIA Memo Shows Agency Gave Evasive Answers to Physicist About Destroyed Records thumbnail" loading="lazy" />
  <p>A January 1958 internal CIA memo from the Chicago Office reports that Dr. Leon Davidson was told records about a &#39;space message and its transmitter&#39; had been destroyed. The memo&#39;s author openly criticises the evasive response as unfair and notes that CIA officers had been concealing their agency identity from Davidson during prior contacts.</p>
  <div class="narr">On 9 January 1958, the Chief of the CIA&#39;s Chicago Office sent a memo to the Chief of the Contact Division about a phone call with Dr. Leon Davidson, filed under Case 17708 (Closed). Davidson had been asking about a &#39;space message and its transmitter&#39; — an object never described or defined in the memo itself — and was told that the records had been destroyed by the originating agency. Davidson replied that he had heard this before and mentioned he had a second article ready for publication about how the Air Force handled space sightings, which was pending Pentagon security review.

What makes this memo notable is the author&#39;s candour about the agency&#39;s own conduct. The memo states that the non-committal and evasive answer given to Davidson was the only option available to avoid contradicting previous statements made by the CIA and other agencies. The author describes this approach as unfair to Davidson.

The memo also reveals that efforts had been made to conceal CIA identity from Davidson during prior contacts through individuals named Walker and Stokich. However, the author believed Davidson likely knew he was dealing with the CIA, particularly after a meeting at the Court of Appeals Building conference room. The memo closes with a prediction that more would be heard from Davidson.

The document is a single internal memo representing one officer&#39;s perspective. No corroborating documents, replies, or follow-up records are included. The original scan is heavily degraded, and moderate redaction obscures some names and reference numbers.</div>
