  <p>This document is a Range Fouler Debrief, a standardized reporting form the U.S. Navy uses to record the circumstances surrounding an unauthorized intrusion into controlled airspace during active military operations or training. These reports contain a narrative description of the observer’s experiences. This report accompanies the video titled “DOW-UAP-PR106.”

A U.S. military operator reported observing an object, describing it as “quite small” and as “continu[ing] in a constant direction.” The report characterizes the shape of the phenomenon as “indistinguishable,” with a metallic appearance and reflective underside.

All descriptive and estimative language contained in this report reflects the reporter’s subjective interpretation at the time of the event. Such characterizations should not be interpreted as a conclusive indication of the presence or absence of any intrinsic object features or performance characteristics.</p>
