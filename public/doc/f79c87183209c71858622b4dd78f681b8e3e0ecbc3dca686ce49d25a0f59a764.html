  <h1>Pentagon Office Identified Southeast Asia Triangle UAP as Fishing Nets</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>The All-domain Anomaly Resolution Office (AARO) resolved a UAP case involving six dark triangular objects spotted in 2017 satellite imagery over Southeast Asia. The agency concluded with high confidence that the objects were cone-shaped fishing nets floating on the ocean surface, based on size analysis, newer imagery from 2023, and stock footage of nets on the same river.</p>
  <div class="narr">On 30 August 2017, an Intelligence Community member flagged six dark triangular objects arranged in a formation in satellite imagery of Southeast Asia. The objects, each approximately 11 metres by 7 metres, were considered potentially anomalous and forwarded for investigation.

The All-domain Anomaly Resolution Office (AARO), the Pentagon body responsible for investigating unidentified anomalous phenomena, took up the case. Three independent science and technology partners analysed the imagery. Their conclusion: the triangles were cone-shaped, static fishing nets floating on the water&#39;s surface.

The identification was supported by multiple lines of evidence. Additional satellite imagery of the same area collected in late 2022 and early 2023 showed similar triangular shapes, confirmed to be fishing nets. The newer images also revealed downstream water turbidity — muddied water flowing past the objects — confirming they sat on the water. One partner located stock footage of fishing nets on the same river, further corroborating the finding.

AARO formally resolved the case on 17 March 2023. The agency&#39;s intelligence partners expressed high confidence in the identification and assessed the objects do not pose a hazard to navigation.</div>
