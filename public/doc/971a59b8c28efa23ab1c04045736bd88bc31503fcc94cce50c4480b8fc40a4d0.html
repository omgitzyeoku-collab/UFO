  <h1>FAA Report: Pilot Spotted Fast-Moving Object at 37,000 Feet Near Albuquerque</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/971a59b8c28efa23ab1c04045736bd88bc31503fcc94cce50c4480b8fc40a4d0.jpg" alt="FAA Report: Pilot Spotted Fast-Moving Object at 37,000 Feet Near Albuquerque thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from 4 May 2021 documenting a general aviation pilot&#39;s sighting of an unidentified object while flying near Albuquerque, New Mexico at 37,000 feet. The pilot reported the object was moving too fast to describe, the FAA&#39;s UFO call center was notified, and the case was closed with no further action indicated.</p>
  <div class="narr">This document is an FAA SKYWATCH Incident Report — a standard form the Federal Aviation Administration uses to log unusual aerial sightings reported by pilots or air traffic controllers. It was filed on 4 May 2021 at 19:26 UTC by Albuquerque Air Route Traffic Control Center (ZAB), one of the FAA&#39;s regional radar facilities.

At 19:15 UTC, the pilot-in-command of aircraft N946BA — a general aviation flight travelling from Austin Executive Airport (EDC) to Las Vegas (LAS) — reported seeing an unidentified flying object at flight level 370 (approximately 37,000 feet). The sighting occurred roughly 25 nautical miles from Albuquerque on the 165-degree radial, placing it in the airspace south of the city. The pilot stated the object was passing from left to right but was moving too fast for any further description.

The report was categorised under the primary code &quot;OTHER&quot; and the FAA&#39;s UFO call center was notified. The case status is listed as closed. No description of the object&#39;s shape, size, colour, or lighting was provided — the pilot&#39;s sole characterisation was that it moved too quickly to observe in detail.

The document contains no radar data, no sensor readings, and no corroborating witness accounts. It is a single-source report based entirely on one pilot&#39;s visual observation during flight. The FAA recorded it, logged it, and closed it without any resolution or identification noted in the file.</div>
