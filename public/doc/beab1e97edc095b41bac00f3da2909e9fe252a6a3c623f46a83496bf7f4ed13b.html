  <h1>FBI Filed a UFO Magazine After IRS Employee Flagged It as Communist Propaganda</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/beab1e97edc095b41bac00f3da2909e9fe252a6a3c623f46a83496bf7f4ed13b.jpg" alt="FBI Filed a UFO Magazine After IRS Employee Flagged It as Communist Propaganda thumbnail" loading="lazy" />
  <p>A 1966 FBI memo records an IRS employee in Philadelphia reporting that a flying saucer magazine contained material he believed pushed the Communist Party line. The FBI&#39;s Los Angeles office forwarded the magazine but conducted no investigation and took no further action.</p>
  <div class="narr">In October 1966, the FBI&#39;s Los Angeles division sent a memo to the Director about a tip from Jarvis H. Cooper, an IRS employee at 401 North Broad Street in Philadelphia. Cooper had subscribed to a magazine called Flying Saucers International — published by the Amalgamated Flying Saucer Clubs of America (AFSCA), headquartered at 2004 North Hoover Street in Los Angeles — because his son was interested in flying saucers and outer space. After reading Issue No. 24 (July 1966), Cooper believed pages 2–3 contained material that expounded the Communist Party line, and reported it to the FBI on September 19, 1966.

The article Cooper flagged was attributed to &quot;Master Kalen-Li Retan&quot; of planet Korendor, supposedly received via shortwave radio by a man named Bob Renaud on May 4, 1966. Its actual content was political: it criticized the U.S. military-industrial complex, called the government &quot;a military puppet,&quot; argued that war is profitable, and attacked the Vietnam War as economically motivated. It claimed the real seat of American power was not the White House or Congress but the Pentagon and defense industries.

The FBI noted that its Los Angeles office had no records on Bob Renaud and had never investigated AFSCA. The memo concluded with a clear statement: no investigation was conducted and no further action was contemplated. The document was filed as a routine information item.

The rest of the file is the full magazine issue itself, edited by Gabriel Green with Helen Green as assistant editor. It includes programs for AFSCA&#39;s 3rd National Convention at Centennial Coliseum in Reno, Nevada (July 8–10, 1966, with a registration fee of $5.00 for three days), book listings, news briefs, obituaries for community figures, and newspaper clippings about UFO sightings across North America in 1966 — including reports from Colorado, Ontario, and Ohio.

The document shows minimal redaction. The FBI&#39;s interest was clearly in the anti-war and anti-capitalist political content of the article, not in the UFO claims themselves. The magazine represents the fringe UFO contactee culture of the 1960s, where alleged extraterrestrial messages were sometimes vehicles for political commentary.</div>
