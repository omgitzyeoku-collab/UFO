  <h1>Vandenberg Air Force Base Launch Registry Logs 1,790 Missions Over Four Decades</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2/3/00</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0dd7855ac3c69e39a9752c53fe6ba3e851d617e28adfcbf07c3ec93907877cf7.jpg" alt="Vandenberg Air Force Base Launch Registry Logs 1,790 Missions Over Four Decades thumbnail" loading="lazy" />
  <p>This document is the official registry of all major launch operations from Vandenberg Air Force Base, California, covering approximately 1,790 launches from December 1958 through early 2000. Despite being cataloged under a UAP-related designation (DOW-UAP-D49), the document contains no UAP sighting data or anomalous observations — it is a straightforward military launch history compiled by the 30th Space Wing History Office.</p>
  <div class="narr">This document is a comprehensive launch log maintained by the 30th Space Wing&#39;s Office of History at Vandenberg Air Force Base in California. Authored by Jeffrey Geiger and current as of 3 February 2000, it records every major launch operation conducted from the base, beginning with the very first — a Thor intermediate-range ballistic missile demonstration nicknamed &quot;TUNE UP&quot; on 16 December 1958.

Over the four decades covered, Vandenberg hosted approximately 1,790 launches involving dozens of vehicle types. Between 1958 and 1978 alone, some 1,418 launches took place, with Air Force Systems Command (AFSC) responsible for 677 and Strategic Air Command (SAC) accounting for 526. The Navy conducted 101 launches during the same period. Other organizations, including the Royal Air Force (RAF) and the Atomic Energy Commission (AEC), also launched from the base. All totals in the document reflect Vandenberg operations only and exclude launches from the East Coast at Cape Canaveral, Florida.

The registry also documents program milestones. The Pegasus rocket program began with three captive test flights using inert vehicles starting 9 November 1989, carried by a modified B-52 from the Ames/Dryden Flight Research Facility at Edwards AFB. The Delta II program, originally run by McDonnell Douglas Aerospace, changed hands when Boeing purchased the company on 4 August 1997. The Athena rocket — formerly called LMLV (Lockheed Martin Launch Vehicle) — was renamed in September 1997.

Despite its filing under a UAP-related document designation (DOW-UAP-D49), there is nothing in this document about unidentified aerial phenomena. The content is entirely a military and civilian launch operations reference. The war.gov catalog describes it as UAP-related, but the text itself contains no sighting reports, anomalous observations, or unexplained events. All launch dates in the registry reflect Vandenberg local time.</div>
