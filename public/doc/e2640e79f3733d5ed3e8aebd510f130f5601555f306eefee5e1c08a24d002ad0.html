  <h1>CIA-UAP-D021, Analysis of Unconventional Aircraft Sightings, 1955</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1955</span>
    
    
  </div>
  <img class="thumb" src="/extract/thumbs/e2640e79f3733d5ed3e8aebd510f130f5601555f306eefee5e1c08a24d002ad0.jpg" alt="CIA-UAP-D021, Analysis of Unconventional Aircraft Sightings, 1955 thumbnail" loading="lazy" />
  <p>Sections 1 and 2 of this memorandum document a 1955 analysis of reports of “flying saucers” or “unconventional aircraft,” referencing the incident described in observer debriefings contained within CIA-UAP-D020. The memo summarizes the incident as consisting of two lights rising vertically, then passing above the observers. The memo contains caveating language that suggests the author concluded that the reports, as described, did not indicate the presence of an “unconventional aircraft.” Section 3 cites a previous finding by Dr. [Howard] Robertson (of the 1953 Robertson Panel) that “almost all the sightings […] represented no threat to the U.S.” Section 4 discusses the state of then-current research into “saucer-like aircraft” under Project “Y,” a contemporary joint U.S.-Canadian aerospace development program.</p>
