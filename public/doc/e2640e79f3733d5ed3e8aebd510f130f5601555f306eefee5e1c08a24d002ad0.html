  <h1>1955 CIA memo questions single-witness saucer sighting over Frankfurt</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1955</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e2640e79f3733d5ed3e8aebd510f130f5601555f306eefee5e1c08a24d002ad0.jpg" alt="1955 CIA memo questions single-witness saucer sighting over Frankfurt thumbnail" loading="lazy" />
  <p>This is a 1955 CIA Top Secret memorandum that reviews reports of &#39;flying saucers,&#39; or unconventional aircraft. It examines a dispatch from Frankfurt describing a sighting of two lights, casts doubt on the lone witness&#39;s account, and notes ongoing Canadian work to build saucer-like aircraft. The document itself concludes that one person&#39;s testimony could not establish that any unconventional aircraft was actually present.</p>
  <div class="narr">This document is a 1955 memorandum written inside the US Central Intelligence Agency (CIA) and marked Top Secret. It analyses reports of what were then called &#39;flying saucers&#39; or unconventional aircraft, and it draws on an observer&#39;s debriefing alongside a look at contemporary research into saucer-shaped aircraft. The pages here are Sections 1 to 4 of the memo, and they refer to a separate debriefing document that is not included.

The core report came in a dispatch from Frankfurt, reference C-103, dated October 1955. According to that report, a witness who was at a high altitude of around 9,000 feet — on or near a train — saw two lights that appeared and then rose vertically, passing above the observers.

The memo&#39;s author is openly sceptical. The document records that the witness failed to make out the shape of the object and could not say whether it was real, an illusion, or something else. On that basis the author states plainly that a single person&#39;s testimony, on its own, could not confirm the existence of any unconventional aircraft.

The memo also places the sighting in a wider context. It cites an earlier finding by an investigating group (attributed in the text to a &#39;Robertson&#39; review) that such phenomena represented no threat to the security of the United States. It then describes work in Canada at Avro Aircraft Ltd., under a programme known as Project &#39;Y,&#39; to develop saucer-like aircraft — projected, on paper, to reach a very high ceiling of around 120,000 feet, speeds of roughly 1,500 to 1,800 miles per hour, and vertical take-off, though the project was still at an early stage. The text notes that General Samford was to report on the status of the Air Force project at a meeting of the IAC (Intelligence Advisory Committee).

The scan of this document is heavily degraded, and some names and figures are partly reconstructed from garbled text. Beyond that, no large blocks of content are described as blacked out; the main limitation is the poor legibility of the original rather than formal redaction.</div>
