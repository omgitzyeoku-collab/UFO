  <h1>US Navy Ordered Stations to Report Flying Disc Sightings in 1948</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f96457d53f3cd65aec3fc539e7138cc42a5ea962654a83c75abbd0f13d54383c.jpg" alt="US Navy Ordered Stations to Report Flying Disc Sightings in 1948 thumbnail" loading="lazy" />
  <p>This December 1948 confidential memorandum from the Fifth Naval District relays a directive from the Chief of Naval Operations ordering all naval stations to report sightings of &#39;Flying Discs&#39; to the nearest Air Force command and Naval District Intelligence Office. The directive states that US Air Force intelligence believed a cyclical reappearance of Flying Discs was imminent.</p>
  <div class="narr">This is a confidential memorandum dated 13 December 1948, issued from the headquarters of the Fifth Naval District in Norfolk, Virginia. It was sent by the Commandant of the Fifth Naval District to activities listed in a distribution list. The memo forwards a directive originating from the Chief of Naval Operations regarding the reporting of &#39;Flying Disc&#39; sightings.

The core instruction is straightforward: the US Air Force Director of Intelligence had informed the Navy Department that a cyclical pattern of &#39;Flying Disc&#39; reappearances was becoming apparent and that a new interval was imminent. Based on this assessment, the Air Force requested that sightings be reported as quickly as possible and investigated.

The directive ordered all naval stations to report any sighting of Flying Discs or other unidentified aerial objects to the nearest Air Force command and to the Naval District Intelligence Office. Personnel were also instructed to obtain photographic evidence whenever possible.

The intelligence chain was clearly defined: District Intelligence Officers would forward information to the Chief of Naval Intelligence, who would then relay it to the USAF Director of Intelligence by the fastest means available. The original directive was signed by Thos. B. Inglis, and the forwarding memo by R. C. Hudson, identified as Chief of Staff.

The document does not describe any specific sighting, nor does it provide the data or methodology behind the Air Force&#39;s assessment of a cyclical pattern. It is an administrative directive establishing reporting procedures.</div>
