  <h1>Commercial Pilot Reports Flashing Lights at 35,000 Feet Near Army Airfield</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/61efb2e67253e787d8f40c90857899879a9aa328a06a8a7d3cf8b9e2f30a5aae.jpg" alt="Commercial Pilot Reports Flashing Lights at 35,000 Feet Near Army Airfield thumbnail" loading="lazy" />
  <p>An FAA incident report documents a commercial airline crew observing an unidentified aerial phenomenon with flashing lights while flying at 35,000 feet over North Carolina on 17 April 2023. Air traffic control picked up intermittent radar returns and contacted the UFO reporting centre, but the case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the agency uses to log pilot-reported unidentified aerial phenomena. It records an event on 17 April 2023 at 04:30, involving flight FFT1164, an Airbus A321 operating a commercial route from Orlando (MCO) to Philadelphia (PHL).

While heading northeast at 35,000 feet, the flight crew reported an unknown phenomenon off the left side of the aircraft, roughly 17 nautical miles southeast of Mackall Army Airfield in North Carolina. The object or lights were described as flashing and travelling in the opposite direction — southeast-bound — at approximately the same altitude.

Washington Centre (ZDC), the air traffic control facility handling that airspace, picked up intermittent primary radar targets in the area. Primary radar detects reflections off physical objects but does not receive a transponder signal, so these returns could not be identified through normal means. ZDC subsequently contacted the UFO reporting centre.

The case is marked as closed. No resolution, identification, or follow-up explanation appears in the document. No additional sensor data, photographs, or corroborating reports from other aircraft are included.</div>
