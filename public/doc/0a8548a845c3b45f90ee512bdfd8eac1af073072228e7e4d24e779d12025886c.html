  <h1>Military Report Documents Two Unidentified Objects Over the Mediterranean</h1>
  <div class="meta">

  <p>A 2025 U.S. Department of War mission report records a military observer spotting two round, thermally bright unidentified objects moving south over the Mediterranean Sea at roughly 240 knots. The report is heavily redacted, and the speed and shape descriptions are estimates, not instrument-confirmed measurements.</p>
  <div class="narr">This document is a U.S. military Mission Report (MISREP) from 2025, produced by the Department of War. It records an observation of two unidentified anomalous phenomena (UAPs) in the vicinity of a location in the Mediterranean Sea, identified by the military grid reference 35SQT3423692957. Although the report&#39;s title references Djibouti, the coordinates point to the Mediterranean — the reporting unit may have been based in Djibouti while observing elsewhere.

According to the report, at 1653 Zulu time (UTC), an observer spotted two round objects displaying a &quot;white hot&quot; thermal signature — a term referring to how objects appear on thermal imaging equipment, not their visible color. The objects were moving south at an estimated speed of approximately 240 nautical miles per hour.

The document is classified SECRET and marked as releasable to the United States, Finland, Sweden, the Five Eyes intelligence alliance, and NATO partners. Heavy redaction is present throughout: multiple sections have been replaced with classification exemption markers (specifically 1.4(a)), which obscure the identity of the reporting unit, the observer, the type of platform used for the observation, and other potentially significant context.

The report does not contain any stated conclusion about what the objects were. The document&#39;s own metadata notes that the descriptive language reflects the reporter&#39;s subjective interpretation and should not be taken as conclusive. No corroborating observations from additional sources are included.</div>
