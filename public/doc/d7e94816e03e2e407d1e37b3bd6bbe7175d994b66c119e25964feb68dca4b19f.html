  <h1>Commercial Airline Crew Reported UFO Near Flagstaff, Arizona in 2012</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d7e94816e03e2e407d1e37b3bd6bbe7175d994b66c119e25964feb68dca4b19f.jpg" alt="Commercial Airline Crew Reported UFO Near Flagstaff, Arizona in 2012 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from 7 August 2012 in which a Canadair CRJ-700 crew flying from Oklahoma City to Los Angeles reported an unidentified flying object heading north at roughly 50,000 feet, about 10 miles south of Flagstaff, Arizona. The case was closed by the FAA with no further explanation included in the released document.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unusual aerial observations reported by pilots and air traffic controllers. It was filed on 7 August 2012 at 08:45 through the Denver reporting pod by Albuquerque Center (the FAA facility with call letters ZAB that manages airspace over much of the southwestern United States).

The reporting aircraft was a Canadair CRJ-700 regional jet operating under callsign SKW573Z on a route from Oklahoma City (OKC) to Los Angeles (LAX). The callsign prefix SKW suggests the flight was operated by SkyWest Airlines, though the operator field in the report was left blank. The crew reported observing an unidentified flying object approximately 10 miles south of Flagstaff, Arizona. The object was described as heading north at about 50,000 feet.

The report contains no details about the object&#39;s shape, size, speed, or how long the crew observed it. There is no mention of corroborating radar data or additional witness accounts. The FAA classified the primary code as &quot;OTHER&quot; and marked the case status as closed. No conclusions about what the object was — or wasn&#39;t — appear in the document.

Although the incident occurred in 2012, the document was released as part of a 2023 FAA series of UAP (Unidentified Anomalous Phenomena) records, meaning it predates the current government framework for reporting and investigating such sightings.</div>
