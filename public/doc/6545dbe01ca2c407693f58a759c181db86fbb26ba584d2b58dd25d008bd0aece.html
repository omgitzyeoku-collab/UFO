  <h1>Airline Crew Reports Strobing Lights Above Their Plane Over Louisiana</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/6545dbe01ca2c407693f58a759c181db86fbb26ba584d2b58dd25d008bd0aece.jpg" alt="Airline Crew Reports Strobing Lights Above Their Plane Over Louisiana thumbnail" loading="lazy" />
  <p>An FAA incident report documents the crew of Envoy Air flight 3680, flying from Miami to Oklahoma City, observing 4 to 5 bright strobing lights maneuvering at altitudes above their aircraft near Thibodaux, Louisiana on August 21, 2024. The report is a preliminary notification with no follow-up investigation or explanation included.</p>
  <div class="narr">This document is a preliminary incident report from the FAA&#39;s Washington Operations Center. It records an observation made by the flight crew of Envoy Air flight 3680, an Embraer E170 regional jet operating a commercial route from Miami to Oklahoma City.

On August 21, 2024, at approximately 11:15 PM Central time, the crew reported seeing 4 to 5 bright strobing lights while flying northwest-bound at 34,000 feet near Thibodaux, Louisiana (coordinates 29.90°N, 90.94°W). The lights were described as maneuvering between roughly 35,000 and 40,000 feet — above the aircraft&#39;s own altitude.

The FAA logged this as an unidentified aerial phenomena (UAP) report. The document is labelled &quot;PRELIM INFO,&quot; meaning it is a same-day notification rather than a completed investigation. It contains no radar data, no corroborating observations from other aircraft or ground stations, and no analysis or conclusions about what the lights were.

No redactions are evident in the document. The report simply ends after recording the basic facts of the observation and a contact number for the Washington Operations Center.</div>
