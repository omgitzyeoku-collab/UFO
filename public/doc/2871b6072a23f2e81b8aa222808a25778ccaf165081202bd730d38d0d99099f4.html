  <h1>American Airlines Crew Reports Star-Like Objects Over Arkansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2871b6072a23f2e81b8aa222808a25778ccaf165081202bd730d38d0d99099f4.jpg" alt="American Airlines Crew Reports Star-Like Objects Over Arkansas thumbnail" loading="lazy" />
  <p>This FAA incident report documents a January 2023 sighting by the crew of American Airlines flight 2547, who observed 2-3 sets of unidentified aerial phenomena near Walnut Ridge, Arkansas while cruising at 37,000 feet. The objects appeared star-like, blinking on and off roughly every minute, and multiple other aircraft reported the same phenomenon on different radio frequencies.</p>
  <div class="narr">On 29 January 2023, at approximately 6:29 AM Central Time, the crew of American Airlines flight 2547 — an Airbus A321 flying from Phoenix to Charlotte — reported something unusual to air traffic control. While cruising at 37,000 feet near Walnut Ridge, Arkansas, the pilot-in-command described seeing 2-3 sets of unidentified aerial phenomena moving right to left and left to right.

The pilot described the objects as resembling a star that turned on and off roughly every minute. The crew noted the objects were too far away to confirm a precise location, though they appeared to be in the vicinity of Walnut Ridge. The sighting was relayed through Minneapolis Air Route Traffic Control Center (ARTCC) to the FAA&#39;s Washington Operations Center.

Notably, the report states that multiple other aircraft could be heard reporting the same incident on different radio frequencies, suggesting the phenomenon was observed by more than one flight crew in the area at the time.

The document is a preliminary FAA Operations Center report (reference WOC 73333). It records the incident as reported but includes no follow-up investigation, no radar data, no photographs, and no conclusion about what the objects were. It is a factual log of what pilots reported, not an analysis or explanation.</div>
