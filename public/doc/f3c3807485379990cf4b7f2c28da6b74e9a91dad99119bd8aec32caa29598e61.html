  <h1>FAA Report: Balloon Nearly Hit Aircraft at 38,000 Feet Near Springfield</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/f3c3807485379990cf4b7f2c28da6b74e9a91dad99119bd8aec32caa29598e61.jpg" alt="FAA Report: Balloon Nearly Hit Aircraft at 38,000 Feet Near Springfield thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a near mid-air collision between a general aviation aircraft and a large balloon at 38,000 feet, approximately 42 nautical miles southwest of Springfield, Illinois, on 26 February 2022. The object was categorised under the FAA&#39;s Unidentified Aerial Phenomenon code, though the pilot described it as a balloon roughly 25 feet across. The case is closed with no follow-up investigation noted.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00079. It records an encounter between a general aviation aircraft — callsign N500GF — and an unidentified object while the aircraft was flying eastbound at FL380 (38,000 feet) on 26 February 2022 at 17:25.

The encounter took place approximately 42 nautical miles southwest of SPI (Springfield, Illinois). The pilot in command (PIC) reported a near mid-air collision (NMAC) with the object, which was described as a balloon approximately 25 feet in diameter. Despite that description, the FAA categorised the incident under its primary code for Unidentified Aerial Phenomenon.

The aircraft&#39;s destination was listed as ARR. The operator type was recorded as General Aviation. No operator name or aircraft tail number beyond the callsign was included in the report, which limits the ability to independently verify the account.

The case status is marked as Closed. There is no indication in the report of any follow-up investigation, corroborating radar data, sensor evidence, or recovery of the object. The report relies entirely on the pilot&#39;s observation.</div>
