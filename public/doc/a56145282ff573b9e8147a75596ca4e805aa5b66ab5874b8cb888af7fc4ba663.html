  <h1>Pilot Reports Spinning Lights Over Nebraska at 43,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/a56145282ff573b9e8147a75596ca4e805aa5b66ab5874b8cb888af7fc4ba663.jpg" alt="Pilot Reports Spinning Lights Over Nebraska at 43,000 Feet thumbnail" loading="lazy" />
  <p>An FAA incident report documents a Gulfstream IV crew spotting spinning flashing lights below their aircraft over Nebraska on 3 December 2023. A second aircraft independently described the object as triangular and very bright, but it never appeared on air traffic control radar.</p>
  <div class="narr">This is an FAA SKYWATCH incident report — an internal form the Federal Aviation Administration uses to log unusual aerial sightings reported by pilots. It was filed under the code &quot;Unidentified Aerial Phenomenon&quot; and assigned case number 237UAP00326.

At 03:15 on 3 December 2023, a Gulfstream IV business jet (callsign N461GT) was flying westbound at 43,000 feet on a route from Teterboro, New Jersey to Reno, Nevada. Approximately 57 nautical miles west-northwest of O&#39;Neill, Nebraska, the crew reported seeing spinning flashing lights below their altitude. The sighting was logged by Denver Air Route Traffic Control Center (ZDV).

A separate, unidentified aircraft in the area independently described the same phenomenon as triangular in shape and very bright. Air traffic control checked their radar systems but the object did not appear on any of them. The Aviation Weather Office was notified.

The case is marked &quot;Closed&quot; in the FAA&#39;s system, but no explanation or resolution is recorded in the document. No cause — weather, military activity, conventional aircraft, or otherwise — is listed.</div>
