  <h1>USAF F-16 Pilot Reported Unidentified Aerial Phenomenon Near Florida Coast</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9d536dd459a53ab03fe1ca89d4086cd43f287e77547461a6b283b0f319ce1d0b.jpg" alt="USAF F-16 Pilot Reported Unidentified Aerial Phenomenon Near Florida Coast thumbnail" loading="lazy" />
  <p>An FAA operations centre notification records that a US Air Force F-16 fighter jet (callsign RACER2) reported encountering an unidentified aerial phenomenon roughly 10 miles south of Destin-Fort Walton Beach Airport in Florida on 29 January 2024. No description of the object was given, no evasive action was taken, and the report contains minimal detail.</p>
  <div class="narr">This document is an incident notification from the FAA&#39;s Washington Operations Center — essentially a short-form alert that something unusual was reported in controlled airspace. It is not an investigation report or a detailed analysis; it is the bureaucratic first step of logging that an event occurred.

On 29 January 2024, at 10:11 AM Central time, Eglin Air Force Base in Florida notified the FAA that a USAF F-16 aircraft, flying under the callsign RACER2, had reported an unidentified aerial phenomenon. The encounter took place at an unknown altitude, approximately 10 nautical miles south of Destin-Fort Walton Beach Airport (known by its FAA code VPS). The coordinates given in the report place the sighting over the Gulf of Mexico, just off the Florida panhandle coast.

Notably, the pilot provided no description of the object — its shape, size, colour, and behaviour are entirely absent from the record. The pilot did not take evasive action, and no law enforcement notification was made. The document records the bare minimum: something was seen, a report was filed, and the FAA logged it.

The location is worth noting for context. Eglin Air Force Base hosts one of the largest military test and training ranges in the United States. Sightings near active military testing areas can have a range of explanations, but this document does not offer or rule out any.</div>
