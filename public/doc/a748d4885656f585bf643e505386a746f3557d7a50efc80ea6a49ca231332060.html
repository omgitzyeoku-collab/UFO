  <h1>Two Airline Crews Reported Maneuvering Lights Over Oklahoma in 2022</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a748d4885656f585bf643e505386a746f3557d7a50efc80ea6a49ca231332060.jpg" alt="Two Airline Crews Reported Maneuvering Lights Over Oklahoma in 2022 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting on 9 April 2022 in which the crew of a United Airlines Boeing 737 and, independently, the crew of a Delta Airlines Boeing 757 both observed a set of lights maneuvering at very high altitude near Stillwater, Oklahoma. The case was closed with no explanation of findings or conclusions.</p>
  <div class="narr">On 9 April 2022, the crew of United Airlines flight 2330 — a Boeing 737-900 flying at 33,000 feet from Phoenix to Newark — reported seeing a set of lights maneuvering at very high altitude near Stillwater, Oklahoma. The sighting was logged by Fort Worth Air Route Traffic Control Center (ARTCC) as an unidentified aerial phenomenon under the FAA&#39;s SKYWATCH reporting system.

A second aircraft, Delta flight 309 — a Boeing 757-300 cruising at 35,000 feet from Los Angeles to Atlanta — was 56 nautical miles behind the United flight and independently reported observing the same lights in the same area. Two separate commercial crews seeing the same thing from different positions is notable because it reduces the chance of a simple misperception by one crew.

Controllers also queried a third aircraft, Spirit Airlines flight 806, which was passing within 20 nautical miles of Stillwater at 37,000 feet. That crew reported seeing nothing unusual. The route separation between the United and Spirit flights was about 40 nautical miles.

The FAA&#39;s Aviation Weather Office was notified. Beyond that, the report contains no follow-up investigation, no radar data, and no attempt to identify what the lights were. The case is marked &quot;Closed&quot; with no stated conclusion. The lights are described only in vague terms — &quot;very high&quot; and &quot;maneuvering&quot; — with no precise altitude, speed, or distance measurements recorded.</div>
