  <h1>Pilot Reports Two White Lights at 49,000 Feet Over Atlantic</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e649ec47d4609b69607c64c2872945ae30648d511bda448200d815cde3a5ce17.jpg" alt="Pilot Reports Two White Lights at 49,000 Feet Over Atlantic thumbnail" loading="lazy" />
  <p>An FAA incident report from 23 February 2024 documents a Gulfstream G550 pilot spotting two stationary white lights above their cruising altitude while flying over the Atlantic Ocean off the Carolinas. The lights were not detected on radar, and no follow-up investigation is recorded in the report.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed on 23 February 2024. It records a pilot sighting of an unidentified aerial phenomenon during a northbound flight from Providenciales, Turks and Caicos, to Newark.

The pilot of a Gulfstream G550 (registration N5430G), cruising at 45,000 feet, reported seeing two white lights at the 12 o&#39;clock position — directly ahead — that appeared stationary at 49,000 feet. The sighting occurred at approximately 9:43 PM Eastern, roughly 140 nautical miles south of Wilmington, North Carolina, over the Atlantic Ocean.

Jacksonville Air Route Traffic Control Center (ARTCC) was notified. Controllers checked their instruments but the object was not observed on radar.

The report contains no further investigation, no identification of the lights, and no conclusion about what the pilot saw. It is a single-page operational log entry, not an analytical assessment. There is minimal redaction in the document.</div>
