  <h1>Pilot Reports Ascending Object With Light Over West Virginia in 2013</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/38c473f3d071dc7ae8910085d65241856ebaa34aab2225c6e1ed08226bdd8823.jpg" alt="Pilot Reports Ascending Object With Light Over West Virginia in 2013 thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report records a pilot flying an Embraer E145 at 21,000 feet over Kessel, West Virginia, who observed an unidentified object described as a &quot;rocket/UFO brake light&quot; moving upward at approximately 02:10 on 28 August 2013. The report was closed with no further explanation or identification of the object.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report, a type of record the Federal Aviation Administration uses to log unusual aerial observations reported by pilots and air traffic controllers. It was filed under the code &quot;OTHER&quot; and processed through Cleveland Center (ZOB), one of the FAA&#39;s en-route air traffic control facilities.

On 28 August 2013, at approximately 02:10, the crew of flight EGF3542 — an Embraer E145 regional jet operating out of Pittsburgh — reported seeing an unidentified object while flying at 21,000 feet over Kessel, West Virginia. The crew described what they saw as a &quot;rocket/UFO brake light observed going up.&quot; That single sentence of remarks is the entirety of the observation recorded in the report.

The flight&#39;s original destination was listed as ESL, with a new destination of Miami (MIA). The report does not state whether the destination change was related to the sighting or was routine. The point of distribution for the report was Denver (DEN).

The FAA marked the report&#39;s status as closed. There is no indication in the document of any follow-up investigation, corroborating radar data, or attempt to identify the object. No names of crew members or other witnesses appear in the record.

The report is notably brief — just one sentence describing the observation — and provides no detail about how long the sighting lasted, the apparent size or distance of the object, or its movement characteristics beyond &quot;going up.&quot;</div>
