  <h1>FAA Report: Pilot Saw Flashing Objects Later Linked to Starlink Satellites</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d7af57d5b9b6b286183aa46c60d7c624b9d96e3f931199fa010b0c48a6ab0bfa.jpg" alt="FAA Report: Pilot Saw Flashing Objects Later Linked to Starlink Satellites thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Boeing 747 crew sighting three bright flashing objects over the Atlantic on 7 February 2023. The FAA&#39;s analysis units correlated the sighting to a Starlink satellite train, and the case is closed.</p>
  <div class="narr">This is an FAA SKYWATCH Incident Report filed under the code &quot;Unidentified Aerial Phenomenon.&quot; It documents an event on 7 February 2023 at 08:20, when the crew of a Boeing 747-400 operating as flight NCR884 — a commercial flight from Miami (MIA) to Amsterdam (EHAM) — reported unusual objects in the sky.

The aircraft was flying northeast at 33,000 feet, approximately 60 nautical miles southeast of the ENE navigational point, when the crew observed three bright flashing objects off the 12, 2, and 3 o&#39;clock positions relative to the aircraft. The crew estimated the objects were travelling southeast at roughly 40,000 to 50,000 feet.

The FAA&#39;s Air Traffic Safety Complaint (ATSC) and Operations and Maintenance Integration Center (OMIC) units investigated and correlated the sighting to a Starlink satellite train made up of 3 to 4 groups of 4 satellite units. The case status is listed as closed.

The report was filed through the ZBW reporting facility. The Eastern Air Defense Sector (EADS) acknowledged the report. No named individuals appear in the document, and redaction levels are assessed as low.</div>
