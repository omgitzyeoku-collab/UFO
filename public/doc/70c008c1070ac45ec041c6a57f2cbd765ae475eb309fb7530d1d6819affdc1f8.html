  <h1>Pilot Reports Flashing Lights at 20,000 Feet Near Billings, Montana</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/70c008c1070ac45ec041c6a57f2cbd765ae475eb309fb7530d1d6819affdc1f8.jpg" alt="Pilot Reports Flashing Lights at 20,000 Feet Near Billings, Montana thumbnail" loading="lazy" />
  <p>An FAA preliminary report from February 2023 documents a pilot flying a Beech BE99 near Billings, Montana, who observed two circling lights at roughly 20,000 feet that appeared for 5 seconds and vanished for 8 seconds in a repeating pattern. The document is an initial notification only — no follow-up investigation or identification is included.</p>
  <div class="narr">On 15 February 2023 at 8:36 AM Mountain Standard Time, the pilot of Alpine 5042 — a Beech BE99 aircraft flying the Billings to Wolf Point route — reported an unidentified object near Billings, Montana at approximately 20,000 feet. The Billings Air Traffic Control Tower relayed the report to FAA Operations in Washington.

The pilot described two separate lights that circled in a repeating cycle: visible for about 5 seconds, then dark for about 8 seconds. Beyond this description, the document provides no further detail about the object&#39;s size, shape, speed, or behaviour.

The report was logged by the FAA Washington Operations Center under reference number WOC 7-3333 and is marked as preliminary information. It records only the initial notification from the field — there is no concluded investigation, no radar corroboration, and no attempt at identification within this document.

The coordinates given place the sighting near Billings (approximately 45.81°N, 108.54°W). There is minimal redaction in the document, and the text appears to be a standard FAA operations centre intake form rather than a detailed analytical product.</div>
