  <h1>Military Video Shows Two-Second UAP Sighting Over CENTCOM Region</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2020</span>
    <span class="badge">CENTCOM</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/87da3b7cdf6a29638dde7bc5fc575a6f80e8b0408da24dd39b8816a74db4210a.jpg" alt="Military Video Shows Two-Second UAP Sighting Over CENTCOM Region thumbnail" loading="lazy" />
  <p>This is a 4-minute 13-second military video from September 2020 that contains only about 2 seconds of actual content — a brief area of contrast crossing the frame. The rest of the video is blank, the observing unit&#39;s identity is redacted, and the Pentagon&#39;s UAP office assesses it was &#39;likely&#39; recorded from a U.S. military platform in the Central Command area of responsibility.</p>
  <div class="narr">On 17 September 2020, a U.S. military unit operating in the Central Command (CENTCOM) area of responsibility — a region spanning the Middle East and Central Asia — recorded a brief unidentified aerial phenomenon on video. The recording, catalogued as DOW-UAP-PR084, runs 4 minutes and 13 seconds, but only about 2 seconds (from the 00:25 to 00:27 mark) contain visible content: an area of contrast that enters from the lower right of the frame and exits at the upper left. The remainder of the video shows nothing.

The video was uploaded to a classified network in September 2020. It came to public attention after eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records on 6 March 2026. The All-domain Anomaly Resolution Office (AARO) — the Pentagon body responsible for investigating UAP reports — identified this video among responsive materials held on a classified network.

AARO&#39;s assessment uses cautious language, stating the footage was &#39;likely derived from a full-motion video camera aboard a U.S. military platform.&#39; The agency has not confirmed the video&#39;s provenance outright. The observing unit&#39;s callsign is redacted from the title, and no details about the object&#39;s shape, speed, altitude, or behaviour are provided — only that an &#39;area of contrast&#39; crossed the frame.

AARO also notes that many of the materials in this collection lack a substantiated chain of custody, meaning the handling history from recording to storage has not been fully verified. No personnel are named in the record, and no conclusions about what the object was have been offered.</div>
