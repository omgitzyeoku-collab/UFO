  <h1>FBI Record Documents Witness Reports of Plasma Orbs in Northeastern US</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">October, 2024</span>
    <span class="badge">Northeastern United States</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/24438d15d989c8b1dc90087c6babd258981a3a1bc16d8fd17e0e44d366561da7.jpg" alt="FBI Record Documents Witness Reports of Plasma Orbs in Northeastern US thumbnail" loading="lazy" />
  <p>This FBI investigative record from October 2024 documents agents meeting with a civilian who provided video footage of recurring unidentified orb-like objects near their home in the northeastern United States. The witness reported sightings dating back to November 2021, along with correlated gamma radiation spikes and electronic interference, though the document is heavily redacted.</p>
  <div class="narr">This document is an FBI FD-1057 form — a standard investigative activity record — classified under Unidentified Aerial Phenomenon (UAP). It records a meeting in October 2024 between FBI special agents and a U.S. person who had been privately documenting strange lights near their home in the northeastern United States since November 2021.

The witness provided multiple sets of video clips showing objects described as plasma orbs. According to the record, these objects were observed hovering, moving, appearing near trees and water, and approaching as close as 200 yards from the witness&#39;s residence. The witness had lived at the property since 2006 and reported no anomalous activity before November 2021. They described themselves as a former sceptic with no prior interest in the UAP topic.

The witness deployed trail cameras and other sensors on their property and reported spikes in gamma radiation that correlated with sighting times, as well as unusual effects on electronics and GPS devices. A neighbour to the south reportedly also saw strange lights in the tree line behind their house. The witness was referred to the FBI by a liaison contact in August 2024 and requested that their observations not become public.

The document is heavily redacted throughout: the witness&#39;s identity, exact location, specific dates, case identifiers, and agent names are all blacked out. The FBI does not state any conclusion about what the objects are. The record simply documents the contact and the evidence provided.</div>
