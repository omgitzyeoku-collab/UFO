  <h1>FBI Interview Records Unresolved UAP Sighting Near Cheyenne Mountain</h1>

  <p>This FBI interview record documents a military service member&#39;s account of an unidentified anomalous phenomenon (UAP) spotted near Fort Carson and Cheyenne Mountain, Colorado Springs, on a clear afternoon in early February 2022. Five soldiers reportedly observed a motionless, matte white, non-metallic object hovering silently over a saddle point on the mountain, and the sighting remains officially unresolved.</p>
  <div class="narr">This document is an FBI FD-302 — a standard FBI form used to summarise witness interviews. It records a conversation conducted via Microsoft Teams in March 2025 between FBI agents (a Special Agent and a Supervisory Special Agent) and a military service member stationed at Fort Carson, Colorado Springs. The interview took place roughly three years after the reported sighting.

According to the interviewee, on a workday in early February 2022, at approximately 1:00 to 2:00 in the afternoon, he and four other soldiers from his unit observed an unusual object in clear blue skies near Cheyenne Mountain. The object appeared matte white or off-white, non-metallic in appearance, and was hovering motionless over a low point or &quot;saddle&quot; in the mountain. It produced no audible sound. All five soldiers saw and pointed out the object.

The document is heavily redacted throughout. All witness names, military unit designations, and specific building names have been removed. The source text was produced by optical character recognition (OCR) from a scanned image, which introduces minor transcription errors in places.

No corroborating evidence is referenced in the visible portion of the document — no sensor data, photographs, or official military reports. The FBI does not offer a conclusion or explanation for what the object was. The sighting is classified as unresolved.</div>
