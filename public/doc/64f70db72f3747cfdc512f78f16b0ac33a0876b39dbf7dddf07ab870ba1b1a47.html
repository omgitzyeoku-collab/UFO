  <h1>1949 Los Alamos conference debated New Mexico&#39;s &#39;green fireballs&#39;</h1>
  <div class="meta">
    <span class="badge">Department of Energy</span>
    <span class="badge">3/22/49</span>
    <span class="badge">New Mexico</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/64f70db72f3747cfdc512f78f16b0ac33a0876b39dbf7dddf07ab870ba1b1a47.jpg" alt="1949 Los Alamos conference debated New Mexico&#39;s &#39;green fireballs&#39; thumbnail" loading="lazy" />
  <p>This is a declassified 1949 US Atomic Energy Commission transmittal letter, released by its successor the Department of Energy, enclosing the verbatim minutes of a scientific conference held at the Los Alamos Scientific Laboratory in New Mexico. Scientists and military officers met on 16 February 1949 to discuss a wave of unexplained &#39;green fireball&#39; sightings over the region that had begun in December 1948. The group examined observations and possible explanations but reached no agreed conclusion about what the objects were.</p>
  <div class="narr">The document is a cover letter dated 22 March 1949 from the US Atomic Energy Commission (AEC), the agency then in charge of America&#39;s nuclear programme, attached to the full written record of a scientific conference. It is being made public by the Department of Energy, which succeeded the AEC. At the time the material was classified Secret under a military regulation (AR 380-5) and has since been declassified.

The conference itself took place at 1:00 PM on 16 February 1949 in room P-162 of the Los Alamos Scientific Laboratory in Los Alamos, New Mexico. It brought together scientists and military officers, including the astronomer Dr Lincoln LaPaz, to discuss a series of strange lights that observers were calling &#39;green fireballs&#39;. According to the record, the sightings began in December 1948, when airline pilots reported the objects, after which the military asked Dr LaPaz to help investigate.

Much of the transcript is Dr LaPaz describing what he and others had seen. The objects were reported as green or yellow-green in colour (estimated at a wavelength of roughly 5,200 angstroms, a shade he compared to copper salts burning in a Bunsen flame), moving on long, near-horizontal paths at heights of about 8 to 10 miles and at speeds estimated between 3 and 12 miles per second. Witnesses said the fireballs made no sound even though their light could be seen from hundreds of miles away. Specific events discussed included a sighting near Starvation Peak on the night of 12 December 1948 at about 9:02 PM lasting roughly two seconds, and a large fireball on 30 January 1949 whose path stretched more than 100 miles across New Mexico and West Texas.

The attendees did not settle on an explanation. Dr LaPaz argued that some sightings did not fit an ordinary meteor fall and noted that no meteorite fragments or lingering trails had been recovered; he even floated the speculative idea that the objects might be defensive manoeuvres by some higher command near the atomic installations. Other remarks, such as Dr Edward Teller&#39;s suggestion of an &#39;electron phenomenon&#39;, were offered speculatively or half in jest rather than as findings. The record notes that the Air Force was designated as the agency to gather and report on the phenomenon.

The document is a scanned image that has been run through text-recognition software, and the resulting text is badly garbled in places, so names, numbers and quotations contain transcription errors. Parts of the transcript are also marked as inaudible or blank, meaning the record is incomplete.</div>
