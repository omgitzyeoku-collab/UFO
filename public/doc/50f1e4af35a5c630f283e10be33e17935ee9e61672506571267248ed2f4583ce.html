  <h1>FBI Files Show Eight Years of UFO Reports Across Washington State</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">July 1952-1960</span>
    <span class="badge">Washington State, United States</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/50f1e4af35a5c630f283e10be33e17935ee9e61672506571267248ed2f4583ce.jpg" alt="FBI Files Show Eight Years of UFO Reports Across Washington State thumbnail" loading="lazy" />
  <p>This FBI file compiles memoranda, complaint forms, and inter-agency correspondence between the FBI&#39;s Seattle office and the Air Force regarding multiple UFO sighting reports in Washington State from 1952 to 1960. The reports range from civilian eyewitness accounts to a radar-tracked incident that triggered fighter jet scrambles, though at least one set of reported objects was later identified as military flares.</p>
  <div class="narr">This document is a collection of FBI records from the Seattle field office covering UFO sighting reports across Washington State between July 1952 and early 1960. The FBI coordinated these reports with the Air Force Office of Special Investigations (OSI) at McChord Air Force Base, and findings were forwarded to the Air Technical Intelligence Center at Wright-Patterson AFB in Ohio.

The file contains several distinct incidents. In June 1954, a ground observer group supervisor named Gail Plock reported two half-moon shaped objects at roughly 1,000 feet altitude over Pasco. Around the same time, a radar station at Neah Bay tracked an unidentified target about 38–40 miles to its southwest, prompting the Air Force to scramble jet interceptors from McChord Field. As the fighters approached, the radar blip split into two separate contacts. An intelligence summary tentatively evaluated the radar targets as atmospheric phenomena comparable to large aircraft with speeds near Mach One — but that evaluation was described as tentative, not conclusive.

Other reports in the file include a Seattle woman, Delma J. Segram, who observed a large silvery object high above Sand Point Naval Air Station; a Kennewick police sergeant, Gordon Richardson, who described a shining metallic sphere roughly 30 feet across hovering at 200–300 feet before departing at extreme speed; and a self-described design supervisor in Richland who claimed to have watched an object through 30-power glasses before it vanished eastward in about 10 seconds. Notably, one set of reported UFOs near Cape Disappointment was positively identified as Mark Six aircraft flares, which were later destroyed by a demolition squad.

The document is heavily redacted throughout, with many pages nearly illegible due to poor scan quality and official redactions. Portions were withheld under FOIA exemption b(3), citing protection of intelligence sources and methods. Significant context is missing as a result.</div>
