  <h1>Delta Crew Reported Large Balloon at 50,000 Feet in February 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/45b718babd51ce60145b92d0a100032cd9966081625e3811839dd3e84776cebd.jpg" alt="Delta Crew Reported Large Balloon at 50,000 Feet in February 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of Delta Air Lines flight DAL1023 on 3 February 2023. While flying at 31,000 feet, the crew observed a large balloon to their left, estimated at roughly 50,000 feet or higher. The case was closed with no identification of the object recorded.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under the category &quot;Unidentified Aerial Phenomenon.&quot; It records a sighting made by the crew of Delta Air Lines flight DAL1023, an Airbus A319, on 3 February 2023.

According to the report, the crew was flying northbound at 31,000 feet, approximately 10 nautical miles west of the RBA navigation fix, when they observed a large balloon off the left side of their aircraft. They estimated the balloon was at roughly 50,000 feet or above — well beyond the altitude of most commercial air traffic.

The report was filed through the FAA&#39;s Denver (ZDV) facility. The case is marked as closed, but the document does not record any identification of the object or any resolution explaining what the balloon was.

The timing is notable: this sighting occurred just one day before the widely reported Chinese surveillance balloon was shot down over the United States on 4 February 2023. That period saw a spike in balloon-related reports across the country, though this document does not draw any connection between the two events.

The report contains minimal redaction and is based solely on the crew&#39;s visual observation. No radar data, photographs, or additional sensor evidence are referenced.</div>
