  <h1>Two Aircraft Crews Reported White Object Circling at 45,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/44fb901a45cdfa539c5ccc6400b34617c035ca97f2d08922cc515f8557f3a1cc.jpg" alt="Two Aircraft Crews Reported White Object Circling at 45,000 Feet thumbnail" loading="lazy" />
  <p>This FAA operations center log from April 2021 records a pilot flying a Cessna Citation from Palm Beach to Allentown who reported a white unidentified object circling at 45,000 feet. A JetBlue flight independently confirmed the sighting, but no further investigation is documented.</p>
  <div class="narr">This document is a brief incident log from the FAA&#39;s Washington Operations Center, dated 26 April 2021 at 1:45 AM Eastern time. It records a UAP (unidentified aerial phenomena) report made through standard aviation safety channels.

The reporting aircraft was a Cessna Citation C56X, registration N39RC, flying from Palm Beach International Airport in Florida to Lehigh Valley International Airport near Allentown, Pennsylvania. The pilot reported seeing a white unidentified object on the right side of the aircraft, circling at flight level 450 — roughly 45,000 feet, which is above the ceiling where most commercial aircraft operate. Washington Air Route Traffic Control Center was advised of the sighting.

Notably, JetBlue flight 1380 independently confirmed the report, meaning a second crew in a separate aircraft saw the same thing. Despite the sighting, no evasive action was taken and no law enforcement was notified.

The coordinates logged in the report place the incident over North Carolina, though the record also describes the location as southwest of Dulles Airport in Virginia — a possible discrepancy worth noting. The document contains no follow-up investigation, no identification of the object, and no resolution. It is a single operational log entry, not a detailed case file.</div>
