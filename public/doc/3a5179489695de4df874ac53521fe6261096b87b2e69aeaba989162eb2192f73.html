  <h1>Pentagon Report Logged 291 UAP Sightings, Found Most Likely Ordinary</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3a5179489695de4df874ac53521fe6261096b87b2e69aeaba989162eb2192f73.jpg" alt="Pentagon Report Logged 291 UAP Sightings, Found Most Likely Ordinary thumbnail" loading="lazy" />
  <p>This fiscal year 2023 report from the Office of the Director of National Intelligence and the Department of Defense documents 291 new Unidentified Anomalous Phenomena (UAP) reports received between August 2022 and April 2023, bringing the total to 801. The government concluded that most sightings are likely explainable by ordinary phenomena or lack enough data to resolve, with only a very small percentage showing potentially unusual characteristics.</p>
  <div class="narr">In October 2023, the Office of the Director of National Intelligence and the Department of Defense submitted their consolidated annual report on Unidentified Anomalous Phenomena — the government&#39;s current term for what most people call UFOs — to Congress. The report was mandated by law under the National Defense Authorization Act and covers the period from 31 August 2022 to 30 April 2023.

During that window, the All-domain Anomaly Resolution Office (AARO) received 291 new UAP reports: 274 from the reporting period itself and another 17 older cases from 2019–2022 that had not previously been submitted. This brought AARO&#39;s total holdings to 801 reports. Of the 291 new cases, 290 involved airborne objects and one was maritime. None were classified as transmedium (moving between air and water) or occurring in space.

The most commonly reported shape was orb, round, or sphere, accounting for 25 per cent of cases where a shape was described. Twenty-one per cent of reports mentioned lights. Over 100 reports came from the Federal Aviation Administration (FAA), involving commercial pilots who observed unidentified lights at altitudes ranging from below 5,000 feet to 60,000 feet. AARO noted that these FAA reports are helping broaden the geographic coverage beyond restricted military airspace, where most sightings had previously been concentrated.

The report&#39;s conclusions are measured. No sightings were positively attributed to foreign government activity. None posed a confirmed direct threat to flight safety. No adverse health effects on observers were confirmed. AARO stated that only a very small percentage of reports displayed potentially anomalous signatures such as high-speed travel, and that most unresolved cases remain unresolved because of insufficient data rather than genuinely unusual properties. The office expects that better data collection will resolve most cases as ordinary phenomena.

AARO also reported progress on transparency: it held an open congressional hearing on 21 March 2023 with declassified video, and launched a public-facing website sharing its mission, trends, and declassified footage.</div>
