  <h1>FAA logged a boomerang-shaped object hovering near Stewart Airport for 50 minutes</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/29d0348530f54af662c2e0f448a5bf15b7b843fdbabecc9da6e5acc325e5b0da.jpg" alt="FAA logged a boomerang-shaped object hovering near Stewart Airport for 50 minutes thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a stationary, boomerang-shaped object observed 4 nautical miles southwest of Stewart International Airport (SWF) at 4,000 feet altitude on 3 June 2024. The object was estimated at 50 feet long, did not appear on radar, and remained in the area for roughly 50 minutes before disappearing into clouds.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report, record number 237UAP00372, filed on 3 June 2024 at approximately 18:00. It describes a single observation by FAA facility staff at Stewart International Airport (SWF) in New York.

According to the report, personnel observed a stationary object roughly 4 nautical miles southwest of the airport at an altitude of 4,000 feet. The object was estimated to be about 50 feet long and boomerang-shaped. Despite being visually observed, it did not appear on radar.

The object remained in the vicinity for approximately 50 minutes before disappearing into clouds. The FAA noted there was no impact to air traffic operations. The report&#39;s status is listed as closed, and two parties identified only by the abbreviations TY and PD were notified.

The document contains no photographs, no radar data, and no identification of the object. No conclusions are drawn about what the object was. The case was closed without a stated resolution.</div>
