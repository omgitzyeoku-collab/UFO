  <h1>U.S. Military Crew Spotted Unidentified Object During Weapons Test in Iraq</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">9/20/24</span>
    <span class="badge">Iraq</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e12c00b3e2d64e35eef5623499e6eb23b1bc21d304523c75d28d3f474d91d77e.jpg" alt="U.S. Military Crew Spotted Unidentified Object During Weapons Test in Iraq thumbnail" loading="lazy" />
  <p>A declassified U.S. Air Force mission report describes a high-speed unidentified object detected on infrared sensors during a weapons calibration over Iraq on 20 September 2024. The crew assessed the object as benign, did not re-observe it, and completed their mission without further incident.</p>
  <div class="narr">On 20 September 2024, a U.S. Air Force crew assigned to Air Force Special Operations Command (AFSOC) was conducting an armed overwatch mission over Iraq as part of Operation Inherent Resolve. The aircraft — whose type is redacted, though its equipment loadout included 30mm and 105mm guns and an AGM-176 Griffin missile — was operating within a restricted zone near Ayn Al Asad Airbase. The crew was performing a weapons calibration, firing 20 rounds of 105mm, 101 rounds of 30mm, and one AGM-176 Griffin missile.

At 2027:59Z, between the moment the Griffin missile was released and when it struck its target, the Weapons Systems Officer and Combat Systems Officer spotted an unidentified object moving at high speed through the aircraft&#39;s MX-20 and MX-25 infrared sensors. The object produced an infrared lens flare on both sensors, which the crew interpreted as indicating a significant heat source. The object&#39;s path appeared predetermined and showed no reaction to the aircraft&#39;s presence. The crew maintained laser guidance on the missile until it hit its intended target despite the sighting.

The crew did not re-observe the object after the initial detection. No other parties reported an additional aircraft in the airspace, meaning the sighting rests on a single source — this crew alone. The report notes it is unknown whether a secondary object detached from the primary one before it left the sensor&#39;s field of view. No advanced capabilities were observed, no effects on equipment or personnel were reported, and no material was recovered. The crew assessed the object as benign.

The document was originally classified SECRET and releasable to the Five Eyes intelligence alliance. It was declassified on 24 October 2025 by Major General Richard A. Harrison, USCENTCOM Chief of Staff. The report is heavily redacted: the aircraft callsign, tail number, asset type, mission number, and all personnel names are blacked out under national security exemptions. The object&#39;s precise altitude, speed, and trajectory fields exist in the report&#39;s structured format but are either blank or redacted, so no exact measurements of the object&#39;s performance are available.</div>
