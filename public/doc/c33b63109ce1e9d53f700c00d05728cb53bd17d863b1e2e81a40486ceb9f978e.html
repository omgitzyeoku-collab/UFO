  <h1>FBI Interviewed Witness Who Reported Hundreds of Light Sightings Since 2021</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">October, 2024</span>
    <span class="badge">Northeastern United States</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c33b63109ce1e9d53f700c00d05728cb53bd17d863b1e2e81a40486ceb9f978e.jpg" alt="FBI Interviewed Witness Who Reported Hundreds of Light Sightings Since 2021 thumbnail" loading="lazy" />
  <p>This FBI interview record documents a witness in the northeastern United States who reported seeing anomalous lights from their property hundreds of times since 2021, describing lights that formed triangular patterns and moved laterally. The witness also recounted a separate 1996 incident in New Mexico where a vehicle&#39;s electronics shut down during an encounter with a large light.</p>
  <div class="narr">In October 2024, the FBI conducted a formal interview with an individual about unidentified anomalous phenomena (UAP) sightings observed from their property in the northeastern United States. The interview was recorded on an FD-1057, the Bureau&#39;s standard electronic communication form. The witness had previously provided videos and a presentation to the FBI before the sit-down interview took place.

The witness described their first sighting in 2021 at around 5am: a singular light that split into two or three lights, forming a triangular pattern with a light in the centre. It lasted roughly ten minutes. While filming on a smartphone, the witness accidentally triggered the camera flash and the lights immediately vanished. A second sighting occurred in March 2022 at a different location. The witness said sightings typically happen at dusk or night, with the lights appearing to morph and move laterally. They claimed to have seen hundreds of these lights from their property and noted that others who visited had seen them too. The witness also said video recordings of the sightings frequently suffer corruption.

Notably, the witness tried to rule out conventional aircraft by cross-referencing sighting times and azimuths against ADSB (Automatic Dependent Surveillance-Broadcast) flight tracking data — a publicly available system that logs aircraft positions. The witness also described a separate incident from 1996 in New Mexico, while travelling between Fort Bliss, Texas and Fort Carson, Colorado with an Army officer: the vehicle shut down, a large light shone on the occupants for about two minutes, and then the electronics came back on.

The document is heavily redacted throughout — all witness names, specific locations, and identifying details have been removed. A redacted contact reportedly told the witness that the phenomena were &quot;legitimate&quot; and warned that &quot;people have been hurt by these things.&quot; The witness acknowledged having no prior interest in UAPs and said their account &quot;may seem weird or crazy.&quot; The FBI document does not record any conclusions or assessments about the sightings.</div>
