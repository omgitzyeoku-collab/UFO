  <h1>1948 US intelligence study weighs Soviet origin for flying-object reports</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">12/10/48</span>
    <span class="badge">Virginia</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/6a94a4548eac7933948fad4706e161c6a251bf5eaa9d05d70981b40cb1e80745.jpg" alt="1948 US intelligence study weighs Soviet origin for flying-object reports thumbnail" loading="lazy" />
  <p>This is a 1948 US Air Force Air Intelligence Division analytical study (Study No. 203), dated 10 December 1948, that reviews roughly 210 reported &#39;flying object&#39; incidents across the United States. It concludes that some type of object has been seen but that its identification and origin cannot be readily determined, and it weighs two possibilities: domestic devices or foreign technology — most likely Soviet — derived from captured German flying-wing aircraft designs. The study notes that of about 210 reports, 18 (roughly nine per cent) were positively identified as ordinary things such as celestial bodies and balloons.</p>
  <div class="narr">The document is a US intelligence assessment produced in 1948 and dated 10 December 1948. Catalogued here under the Department of War release as DOW-UAP-D093, it is an Air Force Air Intelligence Division analytical study, numbered Study No. 203, examining reports of unidentified &#39;flying objects&#39; seen over the United States.

The study gathers roughly 210 reported incidents and sorts the sightings into broad shape categories: disk-shaped objects (the &#39;flying saucers&#39; of the period), cigar- or rocket-shaped objects resembling V-2 rockets, and balls of fire. Its central conclusion is cautious: it accepts that some type of flying object has been observed, but states that the objects&#39; identification and origin cannot be readily determined.

The analysts weigh two origins they consider reasonable. One is that the objects are domestic. The other is that they are foreign and, if so, most logically Soviet — built on German wartime &#39;flying-wing&#39; aircraft technology. The study points to the USSR&#39;s reported use of German engineer Guenther Bock, described as the former head of Germany&#39;s flying-wing programme, and to a report that the USSR was planning to build 1,800 Horten flying-wing aircraft. The study&#39;s own reasoning is that if the objects are foreign, they would represent a threat warranting active identification and interception.

The report also shows how many raw reports resolve into ordinary explanations. Of the roughly 210 incidents, 18 — about nine per cent — were positively identified as things such as celestial bodies, balloons and cosmic-ray equipment. One object seen at Godman Field, Kentucky was later determined by the head astronomer at the University of Louisville to be the planet Venus. The earliest domestic sighting the study cites is from April 1947, when US Weather Bureau staff at Richmond, Virginia reported a metallic disk seen through a theodolite (a survey instrument) during balloon observations.

The source here is a scanned, declassified document processed by optical character recognition, and that text is degraded — names, figures and quotes contain transcription errors and should be checked against the original. There is moderate evidence of redaction in the document. The Soviet-origin idea is explicitly presented as speculative and unconfirmed; the study reaches no firm conclusion about where the objects come from.</div>
