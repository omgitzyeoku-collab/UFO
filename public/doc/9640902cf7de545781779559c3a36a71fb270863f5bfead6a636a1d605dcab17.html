  <h1>Commercial Pilot Reports Unexplained Lights at 35,000 Feet Over South Dakota</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9640902cf7de545781779559c3a36a71fb270863f5bfead6a636a1d605dcab17.jpg" alt="Commercial Pilot Reports Unexplained Lights at 35,000 Feet Over South Dakota thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a commercial airline pilot flying from Las Vegas to Toronto who observed unidentified lights appearing and disappearing at or above 35,000 feet, roughly 25 nautical miles south of Sioux Falls, South Dakota, on 11 February 2023. The case was closed with no explanation recorded in the document.</p>
  <div class="narr">This is an FAA SKYWATCH Incident Report — a standardised form the Federal Aviation Administration uses to log pilot observations of unidentified aerial phenomena. It was filed under case number 237UAP00211 and classified with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On 11 February 2023, the crew of a commercial Airbus A321 operating as flight ROU1704, travelling eastbound from Las Vegas (LAS) to Toronto (CYYZ), reported something unusual. While cruising at Flight Level 350 — approximately 35,000 feet — and positioned roughly 25 nautical miles south of Sioux Falls, South Dakota, the pilots observed lights at their 12 o&#39;clock position. The lights were described as &quot;coming and going&quot; at or above the aircraft&#39;s altitude.

The report notes that a party identified only as &quot;TY&quot; was notified and that the incident was paged out. No corroborating radar data, additional witness accounts, or follow-up investigation findings appear in this document. No tail number was recorded for the aircraft.

The case is marked as closed. No resolution, identification, or explanation for the observed lights is provided anywhere in the report. The document is short and factual — it records what the crew said they saw and little else.</div>
