  <h1>UPS Cargo Pilot Reported Multiple Moving Lights Over New Mexico</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/39c0c74addd6a70bff597c954efdba7c63ac55af445371eeb91b21831b1a08fd.jpg" alt="UPS Cargo Pilot Reported Multiple Moving Lights Over New Mexico thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a UPS Boeing 767 crew observing multiple lights moving in different directions while flying at 37,000 feet near Gallup, New Mexico on 9 October 2022. The case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form the Federal Aviation Administration uses to log unusual aerial sightings reported by pilots. It was filed on 9 October 2022 at 10:24 UTC and assigned the code &quot;Unidentified Aerial Phenomenon.&quot;

The report concerns UPS flight 913, a commercial cargo flight operating a Boeing 767 from Ontario, California (ONT) to Louisville, Kentucky (SDF). While flying eastbound at FL370 (37,000 feet) over a point near Gallup, New Mexico, the crew reported observing multiple lights moving in different directions. The sighting began at 09:55 UTC and was still ongoing when the report was filed roughly half an hour later. The crew noted the lights were positioned to the left of the constellation Leo as seen from the aircraft, which provides a rough directional bearing but not a precise location.

The case is marked &quot;Closed&quot; in the FAA&#39;s system, but no resolution or explanation for the lights is provided anywhere in the document. No tail number was recorded for the aircraft, which is unusual for a SKYWATCH report. The document contains no radar data, sensor readings, or any corroborating evidence beyond the pilot&#39;s own observation.</div>
