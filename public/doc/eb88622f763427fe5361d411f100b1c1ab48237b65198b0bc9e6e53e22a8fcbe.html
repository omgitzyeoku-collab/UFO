  <h1>FAA Report: Airline Crew Saw Two Glowing Orbs Near Texarkana</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/eb88622f763427fe5361d411f100b1c1ab48237b65198b0bc9e6e53e22a8fcbe.jpg" alt="FAA Report: Airline Crew Saw Two Glowing Orbs Near Texarkana thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a sighting by the crew of commercial flight BYA584, who reported two glowing and pulsing orbs while flying at 27,000 feet about 40 nautical miles north of Texarkana on 19 April 2023. The case was closed with no explanation recorded.</p>
  <div class="narr">This document is an FAA (Federal Aviation Administration) SKYWATCH incident report filed under the primary code &quot;Unidentified Aerial Phenomenon.&quot; It records a sighting made by the crew of commercial flight BYA584, an Embraer E120 operated by BYA, on 19 April 2023 at 05:55.

The aircraft was flying northeast-bound at flight level 270 (27,000 feet), approximately 40 nautical miles north of Texarkana (airport code TXK), on a route from HYI to LAF. The crew reported observing two glowing and pulsing orbs that quickly disappeared. No further detail on the objects&#39; size, speed, or behaviour is recorded in the document.

No law enforcement notification was made following the sighting. The FAA marked the case as closed, but the document contains no resolution, explanation, or follow-up analysis. There is no mention of corroborating radar data, additional witnesses, or any subsequent investigation.

The report does not list a tail number for the aircraft, which limits the ability to independently verify the flight. The document shows low evidence of redaction — what you see appears to be the full extent of what was recorded.</div>
