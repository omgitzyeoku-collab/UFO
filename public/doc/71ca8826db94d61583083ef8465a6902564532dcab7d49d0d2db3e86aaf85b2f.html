  <h1>U.S. F-16 Pilots Reported 10–20 Bright Objects Over Iraq in 2023</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">3/31/23</span>
    <span class="badge">Iraq</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/71ca8826db94d61583083ef8465a6902564532dcab7d49d0d2db3e86aaf85b2f.jpg" alt="U.S. F-16 Pilots Reported 10–20 Bright Objects Over Iraq in 2023 thumbnail" loading="lazy" />
  <p>A declassified military mission report describes two F-16 fighter pilots observing an estimated 10 to 20 bright, fast-moving objects at extreme altitude during a night combat patrol over Iraq on March 31, 2023. The pilots tracked one object with their targeting camera for about 20 seconds before it dimmed and vanished, and compared it against a known star — the results were different.</p>
  <div class="narr">On the night of March 31, 2023, a pair of F-16CM fighters from the 77th Expeditionary Fighter Squadron took off from Prince Sultan Air Base in Saudi Arabia on a defensive patrol mission as part of Operation Inherent Resolve. The nearly seven-hour sortie took the pilots into Iraq and Syria airspace, where they were operating at about 26,500 feet.

At 11:02 PM Zulu time, the crew reported seeing several bright objects moving quickly from west to east, at an estimated altitude above 60,000 feet — more than twice their own altitude. They estimated between 10 and 20 objects. Using their Sniper targeting pod in TV (visual) mode, they managed to track one of the objects for roughly 20 seconds before it dimmed and disappeared from the display. The objects produced no detectable radar or electronic signatures and had no reported effects on the crew.

The pilots noted that on previous missions, similar objects had appeared in formations, but this time no formation pattern was observed. To test whether they might be looking at stars, the flight compared the targeting pod image of one object against a known star. The report states the results were different, suggesting the objects were not stars — though no detail is given on how that comparison was conducted.

The document was declassified on October 8, 2025, by Major General Richard A. Harrison, USCENTCOM Chief of Staff. It is heavily redacted: pilot names, callsigns, tail numbers, exact grid coordinates, and the precise location where the objects were first seen are all withheld. The UAP&#39;s first-seen location field is explicitly marked &quot;DATA MASKED.&quot; No conclusion is stated in the report about what the objects were.</div>
