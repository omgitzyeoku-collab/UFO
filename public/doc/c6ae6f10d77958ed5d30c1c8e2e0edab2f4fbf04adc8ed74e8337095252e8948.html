  <h1>American Airlines Pilot Reported Cylindrical Object at 36,000 Feet in 2021</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c6ae6f10d77958ed5d30c1c8e2e0edab2f4fbf04adc8ed74e8337095252e8948.jpg" alt="American Airlines Pilot Reported Cylindrical Object at 36,000 Feet in 2021 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the pilot of American Airlines flight 2292, an Airbus A320 flying from Cincinnati to Phoenix on 21 February 2021. The pilot reported a long cylindrical object moving eastbound that passed over the aircraft at 36,000 feet. The case was closed with no explanation recorded.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form the Federal Aviation Administration uses to log unusual aerial observations reported by pilots and air traffic controllers. It was filed under the identifier 237UAP00046 and categorised with a primary code of &quot;OTHER.&quot;

On 21 February 2021 at 19:59 UTC, the pilot-in-command of American Airlines flight 2292 (callsign AAL2292), an Airbus A320 operating a commercial route from Cincinnati (CVG) to Phoenix (PHX), reported an unidentified flying object while cruising at Flight Level 360 — approximately 36,000 feet. The pilot described the object as long and cylindrical, travelling eastbound, which passed over the top of the aircraft. The sighting was handled through Albuquerque Center (ZAB), the air traffic control facility covering that region.

The report confirms that the UFO reporting center was notified of the incident. However, the case is marked &quot;Closed&quot; with no resolution or explanation recorded in the document itself.

It is worth noting a date discrepancy: while the document metadata lists the incident year as 2023, the report content is clearly dated 21 February 2021. The 2023 date likely refers to when the record was released or catalogued rather than when the event occurred.</div>
