  <h1>JetBlue Crew Reports Large Balloon at 50,000 Feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ebc6f7aba63a4842134cc3e5a167e333eee17151a2183aaa46abd719687cea80.jpg" alt="JetBlue Crew Reports Large Balloon at 50,000 Feet in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a JetBlue flight crew observing a large balloon-like object well above their cruising altitude on 3 February 2023. The object was classified as an Unidentified Aerial Phenomenon and the case is now closed, with no identification of the object recorded in this document.</p>
  <div class="narr">On 3 February 2023, the crew of JetBlue flight JBU2131 — travelling westbound from New York&#39;s JFK airport to Las Vegas — reported a large balloon off the right side of their aircraft. The plane was cruising at flight level 320 (roughly 32,000 feet) at the time, approximately 40 nautical miles southeast of St. Joseph, Missouri.

The crew estimated the object was at flight level 500 or above — approximately 50,000 feet, far higher than their own altitude. The sighting was logged through the FAA&#39;s SKYWATCH incident reporting system and assigned the primary code &quot;Unidentified Aerial Phenomenon.&quot;

The case is listed as closed. The document does not record any follow-up identification of the object, nor does it include corroborating radar or sensor data. The FAA&#39;s Denver office (POD: DEN) handled the report.

The date is significant: early February 2023 fell during a period of heightened balloon-related incidents over US airspace, including the widely reported Chinese surveillance balloon episode. The crew described the object as a &quot;large balloon,&quot; yet it was still filed under the UAP code, indicating it was not positively identified at the time of reporting.</div>
