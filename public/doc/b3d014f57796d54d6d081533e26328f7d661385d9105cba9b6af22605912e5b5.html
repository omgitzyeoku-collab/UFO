  <h1>Cargo airline crew reported metallic object at 40,000 feet near Louisville</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b3d014f57796d54d6d081533e26328f7d661385d9105cba9b6af22605912e5b5.jpg" alt="Cargo airline crew reported metallic object at 40,000 feet near Louisville thumbnail" loading="lazy" />
  <p>This is a preliminary FAA report documenting a UAP sighting by the crew of a cargo Boeing 767 flying at 40,000 feet near Louisville, Kentucky on September 19, 2023. The crew described the object as metallic, took no evasive action, and no further investigation or conclusion is recorded in this document.</p>
  <div class="narr">On September 19, 2023, at 5:45 PM Eastern time, the crew of Air Transport International flight 3443 — a Boeing 767-300 cargo aircraft flying from Lakeland, Florida to Rockford, Illinois — reported seeing a metallic unidentified aerial phenomenon. The aircraft was heading northwest at 40,000 feet, approximately 21 miles west-southwest of Louisville Standiford Field (SDF) in Kentucky.

The sighting was relayed through Indianapolis Air Route Traffic Control Center (ARTCC) to the FAA&#39;s Washington Operations Center, which generated this preliminary information report. The coordinates place the sighting at roughly 38.057°N, 86.092°W, in southern Indiana just west of Louisville.

The crew did not take evasive action and no law enforcement was notified. The document contains no description of the object&#39;s size, speed, behaviour, or how long it was visible — only that it was metallic.

This is a preliminary reporting form, not the result of a concluded investigation. The FAA document does not offer any explanation or identification of what the crew observed. There is no mention of corroborating radar data, other witnesses, or follow-up inquiry.</div>
