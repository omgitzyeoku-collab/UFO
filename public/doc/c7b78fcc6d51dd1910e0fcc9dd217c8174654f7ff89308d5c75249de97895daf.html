  <h1>American Airlines crew reported unexplained lights over Kansas in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/c7b78fcc6d51dd1910e0fcc9dd217c8174654f7ff89308d5c75249de97895daf.jpg" alt="American Airlines crew reported unexplained lights over Kansas in 2023 thumbnail" loading="lazy" />
  <p>This FAA preliminary incident notification records a UAP sighting by the crew of American Airlines Flight 662 on September 15, 2023. The crew reported lights from unidentified objects roughly 10,000 feet below their aircraft while flying over Liberal, Kansas at 34,000 feet. No evasive action was taken and no follow-up investigation is included in this record.</p>
  <div class="narr">This document is a preliminary incident notification from the FAA Washington Operations Center, dated September 15, 2023. It records a UAP (unidentified aerial phenomenon) sighting reported through routine aviation safety channels — not a full investigation or conclusion.

According to the record, the crew of American Airlines Flight 662, an Airbus A321 flying from Dallas/Fort Worth to Denver, observed something unusual while cruising northwest at flight level 340 (approximately 34,000 feet) over Liberal, Kansas, at around 12:15 AM local time. They described seeing lights coming from unidentified objects roughly 10,000 feet below their aircraft. The crew did not take evasive action.

The sighting was relayed by Kansas City Air Route Traffic Control Center (ARTCC) to the FAA Operations Center. The record contains no radar data, no corroborating witness accounts, and no identification or explanation of what the crew saw.

The document does not reflect a completed investigation. It is a single notification capturing one crew&#39;s report as it entered the FAA system. There is no resolution, no follow-up findings, and no agency conclusion about what the objects were.</div>
