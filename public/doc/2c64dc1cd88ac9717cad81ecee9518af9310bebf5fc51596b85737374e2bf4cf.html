  <h1>1955 Air Force files collect public UFO letters and Project Blue Book data</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">1955</span>
    <span class="badge">Various</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2c64dc1cd88ac9717cad81ecee9518af9310bebf5fc51596b85737374e2bf4cf.jpg" alt="1955 Air Force files collect public UFO letters and Project Blue Book data thumbnail" loading="lazy" />
  <p>This Department of War release, DOW-UAP-D096, is a bundle of 1955 correspondence, memoranda, and cover sheets connected to the US Air Force&#39;s Project Blue Book UFO investigation. It gathers letters from private citizens, students, journalists, and government agencies asking about &#39;flying saucers&#39;, internal military routing memos, and an annual statistical summary for fiscal year 1955 that recorded 430 UFO reports. The text was extracted by optical character recognition of poor quality, so many names and numbers in it are garbled and should be checked against a clean scan.</p>
  <div class="narr">This document is not a single report but a compiled folder of paperwork from 1954 and 1955 relating to Project Blue Book, the US Air Force&#39;s official programme for investigating unidentified flying objects (UFOs), which ran from 1952 to 1969. Most of the material is ordinary correspondence: letters from members of the public, students, hobbyists, and journalists writing to the Air Force to ask for photographs, leaflets, or the official position on whether flying saucers were real and where they came from, together with the internal memoranda used to route those enquiries.

One thread concerns &#39;falling objects&#39; recovered near Sardis Dam in Mississippi. The Air Force identified the recovered item as a radiosonde — a routine weather-service instrument carried aloft on a parachute to take upper-air measurements — rather than anything of unknown origin.

The folder also contains a statistical summary for the fiscal year running 1 July 1954 to 30 June 1955. According to that summary, Project Blue Book received 430 UFO reports during the year, of which 325 came from civilian observers and 105 from military personnel. The reports were sorted into categories: balloons (92), astronomical (96), aircraft (120), other/reflection (66), insufficient data (35), and unknown (21). The summary attributes a fall in the &#39;insufficient data&#39; cases to rapid on-the-spot investigations by a unit designated the 4602d AISS, which worked with the Air Technical Intelligence Center under an Air Force regulation dated 12 August 1954.

Some of the letters carry striking claims, but these are the opinions of the writers, not the conclusions of any government body. One correspondent, named as Santos Ruvalcaba Gonzalez of Mexicali, Mexico, said he had personally seen a saucer about 12 feet across near Cerro Prieto and offered to describe its design in exchange for a $20,000 reward. The file also references a December 1954 press remark attributed to President Dwight D. Eisenhower, who was reported to have said he had been assured by the Air Force that flying saucers were not from outer space; that particular passage is only partly legible in the extracted text.

The release shows some redaction and authority markings — for example an archival number and page-level &#39;withheld&#39; markers — but because the working text comes from a poor-quality scan, the true extent of any withheld content cannot be judged from it alone.</div>
