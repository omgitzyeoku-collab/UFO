  <h1>FAA logged a UFO hovering over an Indiana hospital in 2018</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/aa8381b4d46f9c6f583c4b69e4e285e1021e630363602299bbbe7ab7a97fefa3.jpg" alt="FAA logged a UFO hovering over an Indiana hospital in 2018 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a November 2018 sighting of a circular object with red and green strobe lights hovering over Columbia City Hospital in Indiana. Law enforcement reported it to the FAA, but radar monitoring within 40 miles found nothing, and the object disappeared by morning.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — an administrative log used to record unusual sightings reported to air traffic control. It was filed under record number 237UAP00035 and is now closed.

On 3 November 2018, Indiana State Police and the Whitley County Sheriff&#39;s Office contacted the FAA&#39;s Fort Wayne air traffic control tower about an object hovering over Columbia City Hospital in Indiana. Witnesses described a circular object displaying red and green strobe lights.

The FAA&#39;s response was procedural. Headquarters monitored all radar activity within 40 miles of the reported location and found no corroborating returns. A UFO Hotline number was provided to the reporting facility, and an E-ROC (Eastern Regional Operations Centre) representative suggested the facility file a Mandatory Occurrence Report. The Whitley County Sheriff&#39;s Office later advised that the object was no longer visible as of 08:45, and no further action was taken.

The document is a log entry, not an investigation. The FAA did not send personnel to observe the object, did not identify it, and did not offer any explanation. The case was closed with no resolution beyond the object&#39;s disappearance.</div>
