  <h1>Multiple Airliners Reported Bright Manoeuvring Lights Near Jacksonville in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/22f5919c87c851330e38b92a698456f201c2da6c4ffabcf3468d019dda9ea39f.jpg" alt="Multiple Airliners Reported Bright Manoeuvring Lights Near Jacksonville in 2023 thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents at least three commercial aircraft independently reporting bright white unidentified aerial phenomena performing rapid circular manoeuvres and altitude changes near Jacksonville, Florida on 4 August 2023. The case was closed with no identification or explanation provided.</p>
  <div class="narr">This is a one-page FAA SKYWATCH incident report filed under case number 237UAP00283, classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot; It records events from 4 August 2023 at 06:40 UTC near Jacksonville, Florida.

The initial report came from the crew of NKS348, a commercial Airbus A319. They described bright white flashing lights travelling in circles at various altitudes. Two additional aircraft — callsigns EJA631 and AJT523 — independently reported the same phenomena. The objects were described as &quot;difficult to identify&quot; and were observed performing rapid manoeuvres including circles and altitude changes between roughly 33,000 and 41,000 feet.

The observation area was substantial, covering approximately 40 nautical miles around Jacksonville and extending 100 to 150 nautical miles east over the Atlantic Ocean.

The case is marked as closed. Notably, the report contains no resolution — no identification of the objects, no follow-up investigation details, and no mention of radar data or any sensor corroboration beyond the pilots&#39; visual observations.</div>
