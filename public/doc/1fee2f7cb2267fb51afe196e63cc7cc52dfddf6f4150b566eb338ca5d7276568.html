  <h1>Three Airline Crews Reported Mysterious Lights Over Idaho in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/1fee2f7cb2267fb51afe196e63cc7cc52dfddf6f4150b566eb338ca5d7276568.jpg" alt="Three Airline Crews Reported Mysterious Lights Over Idaho in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents an observation by the crew of American Airlines flight 2003 on 23 December 2023: two star-like lights that dimmed and reappeared above the horizon near Pocatello, Idaho. The lights did not appear on air traffic control radar, but two other commercial flights independently reported seeing the same thing. The case is closed with no explanation offered.</p>
  <div class="narr">On the night of 23 December 2023, the crew of American Airlines flight AAL2003 — an Airbus A321neo flying from Dallas/Fort Worth to Seattle at 34,000 feet — reported an unidentified aerial phenomenon off the front of their aircraft. They were approximately 41 nautical miles south-southwest of Pocatello, Idaho, heading northwest.

The crew described two lights above the horizon that resembled stars, except they were dimming and reappearing. Air traffic control at Salt Lake City Center (ZLC) checked their radar and found nothing corresponding to the lights. Despite the lack of radar contact, two other commercial flights in the area — Delta flight 2665 and Southwest flight 111 — independently reported observing the same phenomenon.

The FAA&#39;s internal office (AWO) was notified. The case is now marked as closed, but the report contains no identification or explanation of what the crews saw. No tail number was recorded for the reporting aircraft, and no further investigation is documented.

This record is one of hundreds released by the FAA through the Department of War&#39;s public UAP disclosure. It is a SKYWATCH incident report — a standardised form the FAA uses to log pilot-reported sightings of unidentified aerial phenomena.</div>
