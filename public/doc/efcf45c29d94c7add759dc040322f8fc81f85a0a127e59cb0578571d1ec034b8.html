  <h1>Two Commercial Flights Reported Object With Three Bright Lights Over Virginia</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/efcf45c29d94c7add759dc040322f8fc81f85a0a127e59cb0578571d1ec034b8.jpg" alt="Two Commercial Flights Reported Object With Three Bright Lights Over Virginia thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents a UAP sighting on 28 October 2023 by the crew of American Airlines flight 2928 while flying at 35,000 feet near Lynchburg, Virginia. A second aircraft, FedEx flight 1402, independently reported the same sighting. The document is a preliminary operations center report, not a completed investigation.</p>
  <div class="narr">On 28 October 2023 at 4:43 AM Eastern time, the crew of American Airlines flight 2928 — an Airbus A319 flying from Monterrey, Mexico to New York&#39;s JFK airport — reported an unidentified aerial phenomenon (UAP) to air traffic control. The object was described as having three bright lights. The aircraft was travelling southbound at 35,000 feet, approximately 20 nautical miles north of Lynchburg, Virginia.

Washington Air Route Traffic Control Center (ARTCC) was advised of the sighting. The crew took no evasive action, and law enforcement was not notified according to the report.

Notably, a second aircraft — FedEx flight 1402 — also reported a UAP sighting, providing independent corroboration from a separate crew in the same area. The report does not specify the aircraft type or exact position of the FedEx flight.

This document is an FAA Washington Operations Center preliminary information report, labelled &quot;PRELIM INFO.&quot; It records what was reported but does not contain any conclusions, identification of the object, or results of further investigation. No radar data, sensor readings, or photographic evidence are referenced anywhere in the document.</div>
