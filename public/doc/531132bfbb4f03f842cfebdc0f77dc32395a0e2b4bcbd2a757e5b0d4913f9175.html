  <h1>FAA Logged Civilian Report of Cylindrical UFO Over New Jersey</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/531132bfbb4f03f842cfebdc0f77dc32395a0e2b4bcbd2a757e5b0d4913f9175.jpg" alt="FAA Logged Civilian Report of Cylindrical UFO Over New Jersey thumbnail" loading="lazy" />
  <p>This is an FAA Washington Operations Center incident notification from November 25, 2023. A civilian on the ground in Rio Grande, New Jersey reported seeing a cylindrical shaped UFO at low altitude near the intersection of Route 9 and Route 47. The FAA noted no impact to aviation and no further information was provided.</p>
  <div class="narr">On November 25, 2023, at 12:42 PM Eastern time, the FAA (Federal Aviation Administration) Washington Operations Center recorded an incident notification about a UFO sighting in southern New Jersey. The report was relayed through the Atlantic City Air Traffic Control Tower.

A civilian standing on the ground in Rio Grande, New Jersey reported observing a cylindrical shaped object at low altitude near the intersection of Route 9 and Route 47. The document does not describe the object&#39;s speed, direction of travel, colour, size, or how long it was visible.

The FAA&#39;s notation is brief and preliminary. It states there were no impacts to aviation operations and that no additional information was provided beyond the initial report. The document is catalogued under reference WOC 7-3333.

There is no indication in the record that radar data, pilot observations, or any sensor readings corroborated the sighting. The report rests entirely on a single civilian ground observer&#39;s account. The FAA did not offer any explanation or identification of the object.</div>
