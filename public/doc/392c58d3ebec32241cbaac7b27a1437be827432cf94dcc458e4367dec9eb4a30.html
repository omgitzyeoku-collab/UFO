  <h1>Astronaut Cooper Reported Glowing Particles During 1963 Orbital Flight</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">5/15/63</span>
    <span class="badge">Low Earth Orbit</span>
    <span class="badge">verified</span>

  <p>This is an auto-transcribed audio excerpt from NASA&#39;s Mercury-Atlas 9 mission on 15 May 1963, in which astronaut Gordon Cooper described luminous white-green particles drifting away from his spacecraft in low Earth orbit. The particles were the same &#39;fireflies&#39; phenomenon first reported by John Glenn on an earlier Mercury mission.</p>
  <div class="narr">On 15 May 1963, astronaut L. Gordon Cooper Jr. was orbiting Earth alone aboard Faith 7, the final mission in NASA&#39;s Mercury programme. At one hour and 21 minutes into the flight, he reported seeing what he called &quot;John&#39;s fireflies&quot; — a reference to the luminous particles first observed by astronaut John Glenn during his Mercury-Atlas 6 mission the previous year.

Cooper described the particles as white with a greenish tint, drifting rearward from his spacecraft. He was in a transitional lighting period — approaching daytime but still able to see stars distinctly overhead, while Earth&#39;s clouds below were changing colour and becoming lighter.

This document is an auto-transcription of Cooper&#39;s in-flight audio, released by NASA as part of a UAP-related disclosure. It captures a single astronaut&#39;s real-time observations, with no ground-based corroboration included in the excerpt. NASA&#39;s metadata attributes the phenomenon to frozen condensation from the spacecraft, though Cooper himself does not offer that explanation in the transcript.

The transcript shows no signs of significant redaction. However, auto-transcription has introduced likely errors — phrases such as &quot;light rail fireflies&quot; and &quot;This guy looks dark&quot; appear to be mishearings rather than Cooper&#39;s actual words.</div>
