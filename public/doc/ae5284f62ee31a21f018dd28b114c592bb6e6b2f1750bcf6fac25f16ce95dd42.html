  <h1>American Airlines Crew Reported High-Altitude Balloon Over Missouri in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/ae5284f62ee31a21f018dd28b114c592bb6e6b2f1750bcf6fac25f16ce95dd42.jpg" alt="American Airlines Crew Reported High-Altitude Balloon Over Missouri in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents American Airlines flight 947 reporting a large balloon-like object at an estimated 50,000 feet while flying over St. Joseph, Missouri on 3 February 2023. The case was closed with no identification or resolution noted.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00174, categorised as an Unidentified Aerial Phenomenon. It records an observation made by the crew of American Airlines flight 947, a commercial service from Chicago O&#39;Hare to Albuquerque, on 3 February 2023.

While flying northbound at 36,000 feet over St. Joseph, Missouri, the crew reported a large balloon off the right side of the aircraft. They estimated the object was at approximately 50,000 feet or higher — well above their own cruising altitude. The sighting was reported to Kansas City Center, the FAA air traffic control facility covering that region.

The report is notable for its timing: early February 2023 was the period of heightened balloon sightings across the United States, including the widely publicised Chinese surveillance balloon incident. The crew described what they saw as a &quot;large balloon,&quot; though this is their characterisation, not a confirmed identification.

The case is marked as closed. No resolution, no confirmed identification of the object, and no corroborating radar data or imagery are included in the document. There is minimal evidence of redaction.</div>
