  <h1>FBI Files Show How the Bureau Handled Flying Saucer Reports in 1949-1950</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/8bac3aeb023a716259510a74b1264cc38f16b3a012e420e1551a163e4df57573.jpg" alt="FBI Files Show How the Bureau Handled Flying Saucer Reports in 1949-1950 thumbnail" loading="lazy" />
  <p>This section of FBI case file 62-HQ-83894 contains dozens of internal memos, teletypes, and correspondence documenting how the FBI processed flying saucer reports from mid-1949 to early 1950. Notable items include the Guy Hottel memo about three alleged saucer recoveries in New Mexico, radar tracking of unidentified objects over Oak Ridge, Tennessee, and multiple sighting reports the Bureau could not verify.</p>
  <div class="narr">This collection of FBI internal documents — memos, teletypes, phone logs, and letters — comes from case file 62-HQ-83894 and covers roughly mid-1949 through early 1950. It shows the nuts and bolts of how the Bureau dealt with a steady stream of flying saucer reports: fielding tips from the public, coordinating with Air Force Office of Special Investigations (OSI), and handling media inquiries. FBI Director J. Edgar Hoover&#39;s office repeatedly told correspondents that flying saucers were not being investigated by the FBI.

Several specific incidents stand out. A man named Peter Cameron Jones wrote to columnist Walter Winchell claiming he had seen a large silver-green metallic object shaped like a child&#39;s top while hiking near Los Angeles in August 1947. Winchell&#39;s associate Ernest Cuneo called the FBI to ask if the Bureau objected to publishing the letter. The FBI&#39;s Los Angeles office tried to locate Jones at the address he provided — 164 W. 37th Street — but neither the property owner nor the building manager knew anyone by that name. The Bureau could not verify the claim. Separately, the San Antonio FBI office reported it was receiving large numbers of flying disc reports from the Camp Hood, Texas area and was destroying them after review to avoid bulky file accumulation — meaning an unknown quantity of reports from this period is permanently lost.

The most famous document in this batch is the March 22, 1950 memo from Special Agent Guy Hottel. It relayed a report from an unnamed Air Force investigator who claimed three flying saucers had been recovered in New Mexico — circular craft roughly 50 feet in diameter, each containing three bodies of human shape but only three feet tall, dressed in fine metallic cloth. The informant theorised that high-powered government radar had interfered with the saucers&#39; control mechanisms. Notably, the receiving agent, SA Kurtzman, made no evaluation of the information and no follow-up is recorded in the file. The claim passed through at least three people before reaching the FBI, making it third-hand at best.

In early March 1950, a radar station near Knoxville, Tennessee — only three weeks old at the time — tracked unidentified objects at altitudes of 40,000 to 80,000 feet over Oak Ridge on three consecutive nights. Two objects were observed moving in circular paths in opposite directions at what operators described as terrific speed, with radar density similar to a DC-3 airplane. Smyrna Air Base in Nashville confirmed no flight plan existed for any aircraft in that area and altitude. Around the same time, an unidentified individual lectured at Denver University claiming to have seen landed saucers in New Mexico with dead three-foot-tall humanoid occupants. This person was connected to a George Koehler of radio station KMYR in Denver, whom OSI considered a probable mental case.

Other items in the file include a planned flying saucer convention by the Young Men&#39;s Business Club of Alexandria, Louisiana; a Dr. Richard K. Parrish of Decatur, Indiana who theorised flying saucers caused uranium poisoning mistaken for polio (a claim doctors at Indiana University Medical School treated as a joke); and a pilot named Glen Sprouse who reported seeing a bright canary yellow rocket-shaped object about 15-18 inches long near Parkersburg, West Virginia in September 1949.</div>
