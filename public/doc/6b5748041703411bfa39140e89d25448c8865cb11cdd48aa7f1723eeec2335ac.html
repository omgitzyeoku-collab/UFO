  <h1>Pilot Reports Unidentified Object Descending Near Lynchburg, Virginia</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/6b5748041703411bfa39140e89d25448c8865cb11cdd48aa7f1723eeec2335ac.jpg" alt="Pilot Reports Unidentified Object Descending Near Lynchburg, Virginia thumbnail" loading="lazy" />
  <p>This FAA incident report documents a general aviation pilot observing an unidentified object travelling southwest and descending into cloud cover roughly 10 miles north of Lynchburg, Virginia, on 26 January 2023. The object was tracked visually over approximately 100 miles of the aircraft&#39;s flight path. The case was closed with no explanation provided.</p>
  <div class="narr">On 26 January 2023 at 21:15, the pilot of a general aviation aircraft with callsign N541Z reported an unidentified aerial phenomenon to the FAA&#39;s SKYWATCH system. The aircraft was flying from Teterboro, New Jersey to Charlotte, North Carolina and was descending from Flight Level 430 — roughly 43,000 feet — at the time of the sighting.

The pilot observed an object travelling southwest and descending into cloud base cover approximately 10 miles north of Lynchburg, Virginia (identified in the report by the airport code LYH). According to the report, the object was observed over a distance of 100 miles, suggesting a prolonged visual tracking as the aircraft continued along its route.

The report is brief and provides no physical description of the object beyond its direction of travel and descent into clouds. No radar data or other sensor corroboration is mentioned. The FAA marked the case as closed, but the report contains no resolution, identification, or explanation for what the pilot observed.

The document originates from the FAA&#39;s Denver point of distribution (POD: DEN). There is little evidence of redaction in this particular record — the brevity appears to reflect the limited information gathered rather than deliberate withholding.</div>
