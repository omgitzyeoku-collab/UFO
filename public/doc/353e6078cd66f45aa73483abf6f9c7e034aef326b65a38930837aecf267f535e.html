  <h1>Multiple Aircraft Report High-Altitude Balloon Over Kansas City Airspace</h1>

  <p>This FAA incident report documents multiple aircraft reporting a suspected unidentified aerial object — described as a balloon at approximately 50,000 feet — moving southeast through Kansas City Center airspace on 3 February 2023. Traffic advisories were issued but the incident was closed without escalation.</p>
  <div class="narr">On 3 February 2023 at 14:52, the Federal Aviation Administration (FAA) filed a SKYWATCH incident report after Kansas City Air Route Traffic Control Center (ZKC), Sector R26, received reports from multiple aircraft of suspicious unmanned aircraft system (UAS) activity. The first report came from aircraft SCX623, with sightings concentrated near the navigational fix PWE120025.

The object was described as appearing to be a balloon operating at Flight Level 500 — roughly 50,000 feet, well above the altitude at which commercial aircraft normally fly. It was moving in a southeast direction. The balloon appeared to enter R94 airspace at approximately 1726 Zulu time (coordinated universal time). All affected aircraft were issued traffic advisories by air traffic control.

At the time the report was filed, the suspicious UAS activity was described as ongoing. The incident was marked as closed and was not escalated — the report notes it was not paged to higher authorities.

The date of this incident falls during the period in early February 2023 when several high-altitude balloon incursions over US airspace were widely reported in the press. The FAA report itself does not draw any connection or reach a stated conclusion about the object&#39;s origin or identity.</div>
