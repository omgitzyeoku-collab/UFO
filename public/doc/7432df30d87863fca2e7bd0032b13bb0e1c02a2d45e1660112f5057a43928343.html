  <h1>JetBlue crew reported unidentified object over New Jersey in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7432df30d87863fca2e7bd0032b13bb0e1c02a2d45e1660112f5057a43928343.jpg" alt="JetBlue crew reported unidentified object over New Jersey in 2023 thumbnail" loading="lazy" />
  <p>This FAA operations center report documents a sighting by the crew of JetBlue Flight 1990, who observed an unidentified aerial phenomenon from 12,000 feet near Trenton, New Jersey on August 28, 2023. New Jersey State Counter Terrorism was notified, but no evasive action was taken and no corroborating radar or sensor data is mentioned.</p>
  <div class="narr">This document is a notification from the FAA&#39;s Washington Operations Center about an unidentified aerial phenomenon (UAP) sighting reported by a commercial airline crew. It is a preliminary incident report, not a full investigation.

On August 28, 2023, the crew of JetBlue Flight 1990 — an Airbus A320 flying from San Juan, Puerto Rico to Newark, New Jersey — reported seeing an unidentified object from the left side of the aircraft. The sighting occurred at 12,000 feet, approximately 20 nautical miles south of the Yardley VOR navigational aid (identified by the code ARD), in the Trenton/Yardley area near the New Jersey–Pennsylvania border. Washington Air Route Traffic Control Center (ARTCC) was advised. The crew did not take evasive action.

New Jersey State Counter Terrorism was notified about the incident. The report is marked as a &quot;late report,&quot; meaning it was filed after the event rather than in real time — the noted time is 6:45 PM Eastern.

Notably, the report&#39;s title labels this a &quot;UAS sighting&quot; (UAS stands for unmanned aircraft system, i.e. a drone), while the body text describes it as &quot;UFO-UAP activity.&quot; This inconsistency may reflect the FAA&#39;s filing system defaulting to drone-related categories. The document does not offer any conclusion about what the crew observed.</div>
