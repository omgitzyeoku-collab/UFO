  <h1>United Airlines Crew Reported Unexplained Lights Above 37,000 Feet Near Kansas City</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/c4ef578497d2c5837255ec93907c0f125db64a239b92be3e7f47d40674d2456b.jpg" alt="United Airlines Crew Reported Unexplained Lights Above 37,000 Feet Near Kansas City thumbnail" loading="lazy" />
  <p>An FAA incident report documents the crew of United Airlines flight 1126, an Airbus A320 flying from Phoenix to Chicago O&#39;Hare, reporting red, green, and white lights fading in and out high above their aircraft at 37,000 feet on December 17, 2022, roughly 21 nautical miles north of Kansas City. The FAA noted the lights were possibly satellites and closed the case with no further investigation indicated.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form used when pilots report unidentified aerial phenomena to air traffic control. It was filed through Kansas City Air Route Traffic Control Center (ZKC) under Mandatory Occurrence Report ID ZKC-M-2022/12/17-0001.

On December 17, 2022, at 09:55 UTC, the crew of United Airlines flight 1126 — an Airbus A320 en route from Phoenix (PHX) to Chicago O&#39;Hare (ORD) — observed something unusual while flying eastbound at 37,000 feet. Approximately 21 nautical miles north of Kansas City, they reported seeing red, green, and white lights fading in and out, positioned high above the aircraft.

The report includes a note that the lights were &quot;possible satellites,&quot; suggesting the reporting facility itself considered a conventional explanation likely. No corroborating sensor data, radar returns, or additional witness reports are mentioned in the document.

The case is marked as closed. There is no indication of follow-up investigation or additional findings. No tail number for the specific aircraft was recorded in the report. Redaction levels in the document appear low — the record is brief rather than censored.</div>
