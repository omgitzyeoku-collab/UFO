  <h1>Oregon Pastor Reported Converging Light Beams to FBI in 1949</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">1949</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/aaf14409fe2a6b8577345394b399e8ccfa36a0571c6205eb6b5da82b53e6876b.jpg" alt="Oregon Pastor Reported Converging Light Beams to FBI in 1949 thumbnail" loading="lazy" />
  <p>In January 1949, a Presbyterian pastor in McMinnville, Oregon wrote to FBI Director J. Edgar Hoover describing four beams of light he had seen converging over the Cascade Mountains the previous May, producing what he called a &quot;great explosion effect.&quot; The FBI acknowledged the letter and referred it to the Atomic Energy Commission (AEC); no follow-up results are included in the released document.</p>
  <div class="narr">This document is a 1949 exchange between Reverend Charles C. Barnes, pastor of the First Presbyterian Church in McMinnville, Oregon, and FBI Director J. Edgar Hoover. On 31 January 1949, Barnes wrote to Hoover to report something he had witnessed roughly eight months earlier, one afternoon in May 1948.

Barnes described seeing four beams of light in the sky, moving from northwest to southeast and converging in the Cascade Mountains. Small clouds were forming within the beams, and where they met against the mountains, he observed what he called a great explosion effect that appeared to rise to about 10,000 feet. The phenomenon remained visible for at least ten minutes.

Barnes himself offered a possible mundane explanation: he noted experiments conducted in Europe using radio beams to produce rainfall and suggested the beams might have been something similar. He also mentioned personal connections to the military and nuclear establishment — one son in the Air Corps and another working with the Atomic Energy Commission (AEC) at Hanford.

The FBI replied on 10 February 1949 and referred the correspondence to the AEC, though Hoover&#39;s reply and the referral are partially illegible due to poor scan quality. The released document contains no record of any follow-up investigation by the FBI or AEC, and no response from the AEC is included.</div>
