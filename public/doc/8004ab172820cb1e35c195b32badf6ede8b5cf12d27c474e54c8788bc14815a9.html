  <h1>Air Force Compiled 100 UFO Sighting Reports from 1947-1948</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">United States</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/8004ab172820cb1e35c195b32badf6ede8b5cf12d27c474e54c8788bc14815a9.jpg" alt="Air Force Compiled 100 UFO Sighting Reports from 1947-1948 thumbnail" loading="lazy" />
  <p>This document is a collection of roughly 100 standardised U.S. Air Force incident checklists recording unidentified flying object sightings across the United States, primarily from 1947 and 1948. Witnesses include military test pilots, control tower operators, police, and civilians who described spherical, disc-shaped, and metallic objects travelling at speeds between 200 and 500+ MPH at various altitudes.</p>
  <div class="narr">This document, catalogued as DOW-UAP-D087 under authority NND 917033, is a compilation of standardised USAF &#39;Check-List — Unidentified Flying Objects&#39; forms covering approximately 100 separate sighting incidents. Most date from mid-1947 through early 1948, spanning locations including Muroc Army Air Field in California, Portland in Oregon, Lockbourne in Columbus, Ohio, Godman Field, Bakersfield in California, and as far as Newfoundland.

The witnesses range from highly trained military personnel to ordinary civilians. At Muroc on 7 July 1947, test pilot Major J.C. Wise reported a yellowish-white sphere roughly 5 to 10 feet across while warming up an XP-84 aircraft. Other Muroc observers saw three objects — two initially, then a third disc-shaped object circling the north end of the airfield at about 8,000 feet and speeds of 300 to 400 MPH. Witnesses stated the objects could not have been weather balloons based on their speed and direction. Over Portland, between 20 and 30 disc-shaped objects were reported flying at high speed. A civilian observer in Bakersfield, Richard Rankin, saw groups of 10 then 7 objects flying in formation.

One of the most significant incidents in the collection took place at Godman Field. Observers described a round, ice-cream-cone-shaped object with a red top at roughly 15,000 feet. Four P-51 Mustang fighters scrambled to intercept. The flight leader climbed to 33,000 feet, reported the object appeared metallic and was moving at about half his speed, but apparently blacked out at around 30,000 feet. This appears to reference the well-known Mantell incident of January 1948, though the pilot&#39;s name is partially obscured. An astronomer was later contacted to try to account for the sighting as Venus or a comet.

At Lockbourne on 7 January 1948, observers including USAF operator Albert R. Pickerini of the 332nd Fighter Wing reported a glowing object with a cone-shaped streamer that changed colour from amber to red. It flew at an estimated 500 MPH at about 5,000 feet and performed elliptical counter-clockwise manoeuvres, descending to the horizon before rising again. Over Newfoundland, a separate observer reported an object at 8,000 to 10,000 feet trailing a bluish exhaust 15 to 20 miles long. A station mechanic on a train described an object cutting a visible path through clouds, leaving sharp edges in the cloud formations.

The document does not present conclusions about what these objects were. Many checklist fields are marked &#39;N/S&#39; (not stated), meaning significant details were unavailable even when the reports were filed. The document shows moderate evidence of redaction throughout, and the OCR quality of this copy is extremely poor, leaving many specific details ambiguous or illegible.</div>
