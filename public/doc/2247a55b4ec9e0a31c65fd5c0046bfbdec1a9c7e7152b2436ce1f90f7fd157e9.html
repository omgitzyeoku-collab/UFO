  <h1>Multiple Aircraft and ATC Report Two Bright Lights Over Alabama</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2247a55b4ec9e0a31c65fd5c0046bfbdec1a9c7e7152b2436ce1f90f7fd157e9.jpg" alt="Multiple Aircraft and ATC Report Two Bright Lights Over Alabama thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents a August 2023 incident in which the crew of American Airlines flight 1397, along with multiple other aircraft and Birmingham air traffic control, observed two bright unidentified lights above their aircraft over Alabama. No explanation or follow-up investigation is included in the document.</p>
  <div class="narr">On 16 August 2023, the crew of American Airlines flight 1397 — a Boeing 737-800 flying from Miami to Kansas City — reported two bright lights above their aircraft while cruising at 20,000 feet, roughly 60 nautical miles north of Birmingham, Alabama. The sighting was logged by the FAA&#39;s Washington Operations Center as a preliminary information report.

The crew were not the only observers. Multiple aircraft at altitudes ranging from 6,000 feet up to what pilots described as &quot;satellite altitude&quot; independently reported the same two lights. Birmingham&#39;s Air Traffic Control Tower (ATCT) confirmed the sighting as well. Reports of the lights extended over a wide geographic area, reaching as far north as Nashville and Huntsville. Memphis Air Route Traffic Control Center was advised of the situation.

Despite the unusual nature of the sighting, no evasive action was taken by any reporting aircraft, and no law enforcement agencies were notified. The document is a preliminary information report only — it contains no radar data, no instrument readings, and no conclusions about what the lights were. No follow-up investigation or resolution appears in this record.

The observations were made at approximately 0100 local time, meaning all sightings occurred in darkness, which limits the ability of observers to visually identify distant objects. The wide range of reported altitudes — from 6,000 feet to &quot;satellite altitude&quot; — suggests observers may have been describing different phenomena or had difficulty judging distance at night.</div>
