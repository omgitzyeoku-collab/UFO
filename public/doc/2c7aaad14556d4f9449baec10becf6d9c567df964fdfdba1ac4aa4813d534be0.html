  <h1>Southwest Airlines Pilot Reports Slow-Moving White Light at 40,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2c7aaad14556d4f9449baec10becf6d9c567df964fdfdba1ac4aa4813d534be0.jpg" alt="Southwest Airlines Pilot Reports Slow-Moving White Light at 40,000 Feet thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a Southwest Airlines pilot&#39;s sighting of an unidentified white light above their aircraft on 15 February 2024. The object was moving too slowly to be a conventional aircraft, no evasive action was taken, and the case was closed without identifying the object.</p>
  <div class="narr">On 15 February 2024, the pilot-in-command of Southwest Airlines flight SWA3628 — a Boeing 737-800 flying from Spokane (GEG) to Oakland (OAK) — reported an unidentified aerial phenomenon to Seattle Air Route Traffic Control Centre (ZSE). The aircraft was cruising at 35,000 feet at the time of the sighting, which occurred at 14:25.

The pilot described the object as a single white light positioned at 40,000 feet — roughly 5,000 feet above the aircraft. According to the report, the light was moving too slowly to be another aircraft. The pilot did not take evasive action, and no injuries were reported.

The FAA classified the report under its SKYWATCH system with a primary code of &quot;Unidentified Aerial Phenomenon.&quot; A secondary code of &quot;NOTIFICATION-LATE&quot; indicates the report was filed after the standard reporting window. The case is now marked as closed, but the report contains no resolution or identification of what the pilot saw.

The document is a single-page incident report with minimal detail. It references an internal FAA position code (DSD107054) for the sighting location, but no geographic coordinates are provided. There is little evidence of redaction — the report appears to be complete as filed, just sparse.

This is one of hundreds of FAA UAP reports released through the Department of War&#39;s PURSUE programme. It represents the routine bureaucratic record-keeping that sits behind most UAP sightings: a pilot saw something unusual, reported it through official channels, and the case was closed without explanation.</div>
