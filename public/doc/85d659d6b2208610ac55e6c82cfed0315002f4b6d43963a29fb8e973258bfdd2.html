  <h1>US Military Concluded Flying Disc Reports Were Real in 1947</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">12/30/47</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/85d659d6b2208610ac55e6c82cfed0315002f4b6d43963a29fb8e973258bfdd2.jpg" alt="US Military Concluded Flying Disc Reports Were Real in 1947 thumbnail" loading="lazy" />
  <p>This collection of 1946–1947 internal military correspondence includes the famous Twining Memo, in which Air Materiel Command formally assessed that flying disc sightings represented something real — not hallucinations or fiction. The documents trace how the military ruled out domestic US projects as the source, investigated foreign origins including captured German aircraft designs, and ultimately established the first official Air Force UFO investigation program.</p>
  <div class="narr">This file is a set of memorandums and internal letters exchanged between Air Materiel Command (AMC), Army Air Forces (AAF) headquarters, and other military offices during 1946–1947. The correspondence deals with a growing number of flying disc and flying saucer sightings reported across the United States and addresses the question of what these objects were and where they came from.

The most significant document in the collection is the 23 September 1947 memo from Lieutenant General N. F. Twining, commander of AMC at Wright Field in Dayton, Ohio — widely known as the Twining Memo. In it, AMC states plainly: &quot;The phenomenon reported is something real and not visionary or fictitious.&quot; The memo describes the objects as circular or elliptical in shape, flat on the bottom and domed on top, with a metallic or light-reflecting surface. Witnesses reported speeds normally above 300 knots, extreme rates of climb, high manoeuvrability, and what AMC called evasive action when approached by friendly aircraft or radar. Formation flights of three to nine objects were noted, and the objects were usually silent, except for three instances of a substantial rumbling roar. AMC estimated their size as comparable to a C-54 or Constellation aircraft seen at 10,000 feet.

The AAF confirmed it had no domestic research project matching these characteristics. AMC considered three possible explanations: a secret US project, foreign propulsion technology (possibly nuclear), or natural phenomena. No physical crash-recovered evidence existed at that time to prove the objects&#39; existence beyond witness reports. AMC also investigated a lead involving 1800 aircraft reportedly being built in the Soviet Union based on the German Horten VIII flying wing design, though this claim came from a single military attaché report and was never confirmed. A separate tip from a Mrs. Madelina Merchant, who claimed flying discs were being fired from a Russian lab in central Mexico, was investigated and dismissed as not credible.

On 30 December 1947, the Chief of Staff directed AMC to establish a formal investigation project — assigned priority 2A with Secret classification — to collect, evaluate, and distribute information on sightings to interested government agencies. This directive effectively created what became Project Sign, the US Air Force&#39;s first official UFO investigation programme.</div>
