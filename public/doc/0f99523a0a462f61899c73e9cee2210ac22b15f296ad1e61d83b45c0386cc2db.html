  <h1>Pilot Reports Football-Sized Object Ten Feet From Aircraft Wing</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0f99523a0a462f61899c73e9cee2210ac22b15f296ad1e61d83b45c0386cc2db.jpg" alt="Pilot Reports Football-Sized Object Ten Feet From Aircraft Wing thumbnail" loading="lazy" />
  <p>This FAA incident notification records a pilot flying a Beech B350 from Riverside to San Jose who reported a football-sized, cylindrical object passing just 10 feet below the right wing at 20,000 feet over central California. The document is a preliminary notification from the FAA Washington Operations Center, not a completed investigation.</p>
  <div class="narr">On 17 September 2024, the FAA Washington Operations Center logged an incident report from a pilot flying under the callsign TROY21 — a Beech B350 King Air on a public-use mission routing from Riverside, California (RIV) to San Jose (SJC). The aircraft was designated &quot;public use,&quot; a category that typically indicates a government or government-contracted flight, though the specific operating agency is not named in the document.

While cruising at Flight Level 200 (approximately 20,000 feet), roughly 20 nautical miles southeast of the Avenal VOR navigation beacon in California&#39;s Central Valley, the pilot reported an unidentified object passing just 10 feet below the aircraft&#39;s right wing. The object was described as football-sized and cylindrical in shape. Los Angeles Air Route Traffic Control Center (ARTCC) was advised of the sighting.

Despite the extremely close proximity — 10 feet at that altitude would constitute a serious near-miss — the pilot reported taking no evasive action. No law enforcement notification was recorded in the document.

The report is a preliminary notification only. It contains no radar data, no corroborating witness accounts, and no follow-up investigation findings. The coordinates place the sighting near Avenal, California, at approximately 35.80°N, 119.88°W, at around 3:00 PM local time.</div>
