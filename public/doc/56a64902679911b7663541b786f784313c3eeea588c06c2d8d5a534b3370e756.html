  <h1>Two Commercial Flights Reported Same Bright Light Near Los Angeles</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/56a64902679911b7663541b786f784313c3eeea588c06c2d8d5a534b3370e756.jpg" alt="Two Commercial Flights Reported Same Bright Light Near Los Angeles thumbnail" loading="lazy" />
  <p>An FAA incident report documents two commercial aircraft independently observing an unidentified bright light apparently holding position at roughly 52,000 feet over the Pacific Ocean west of Los Angeles in August 2022. The case was closed with no explanation or follow-up investigation documented.</p>
  <div class="narr">This is a single-page FAA SKYWATCH incident report (record 237UAP00106) filed on 18 August 2022. It documents what the FAA formally classified as an Unidentified Aerial Phenomenon. The report&#39;s status is closed, and no resolution or follow-up investigation is included in the released document.

The primary report came from TWY670, a Gulfstream G650 (GLF6) operated by TWY, flying westbound at 47,000 feet roughly 50 nautical miles west of Los Angeles International Airport (LAX). The crew reported a bright light off the aircraft&#39;s right side, apparently in a holding pattern approximately 5,000 feet above them — placing the object at around 52,000 feet.

Minutes later, a second aircraft — American Airlines flight AAL6, a Boeing 787 flying eastbound from Maui to Dallas at 39,000 feet, roughly 40 nautical miles northwest of San Clemente Island — independently reported the same phenomenon off its left side. The fact that one crew saw it to their right while heading west and the other saw it to their left while heading east is consistent with both aircraft observing the same object from opposite directions.

The report notes that TY/AWO (a regional FAA notification point) was notified, but no outcome of that notification appears in the document. The case was processed through the FAA&#39;s Denver (DEN) facility. No radar data, sensor readings, or further analysis is referenced anywhere in the report.

The document is not heavily redacted, but it is notably sparse. The tail number field for the primary aircraft is blank, and no follow-up investigation details or resolution are provided. The FAA closed the case without any documented explanation of what the object was.</div>
