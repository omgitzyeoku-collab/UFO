  <h1>JetBlue Crew Reports Balloon-Like Object at 50,000 Feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e24dbd385abec8ce184093881a89baa75a5e1ed40dbb0b6951b24cf5c2e5e399.jpg" alt="JetBlue Crew Reports Balloon-Like Object at 50,000 Feet in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA incident report from February 2023 in which the crew of JetBlue flight 115, flying from New York JFK to San Francisco, reported an unidentified object described as a balloon at approximately 50,000 feet altitude. The case was closed with no public explanation of what the object was.</p>
  <div class="narr">On 3 February 2023 at 17:14 UTC, the crew of JetBlue flight 115 — a commercial service from New York&#39;s JFK airport to San Francisco — reported an unidentified aerial phenomenon to air traffic control. The report was filed through Kansas City Center (ZKC), the FAA facility responsible for that section of airspace.

The crew described the object as a balloon, observed on a bearing of 360 degrees at 20 nautical miles from a navigational reference point identified as BQS. The object was reported as eastbound at flight level 500 — approximately 50,000 feet. That altitude is well above normal commercial aviation traffic and above the ceiling where most weather balloons operate.

The FAA categorised the sighting under its SKYWATCH programme with the primary code &quot;Unidentified Aerial Phenomenon.&quot; The case status is listed as closed. The document does not indicate what conclusion, if any, the FAA reached about the object&#39;s identity.

The timing is notable: this incident occurred during February 2023, the same period in which multiple high-altitude balloon incursions over US airspace prompted military shoot-downs and widespread public attention. The report does not explicitly link this sighting to those events.

The document contains no mention of corroborating radar data or sensor evidence beyond the pilot&#39;s visual observation. No specific location is named beyond the navigational reference BQS and the involved facilities (Kansas City Center, Denver).</div>
