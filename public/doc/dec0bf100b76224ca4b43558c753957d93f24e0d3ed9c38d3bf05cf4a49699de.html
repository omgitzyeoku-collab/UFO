  <h1>Delta Crew Reported Large Balloon at 50,000 Feet Over Nebraska</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/dec0bf100b76224ca4b43558c753957d93f24e0d3ed9c38d3bf05cf4a49699de.jpg" alt="Delta Crew Reported Large Balloon at 50,000 Feet Over Nebraska thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Delta Air Lines crew observing a large balloon while flying at 36,000 feet near Lincoln, Nebraska on 3 February 2023. The object, estimated at 50,000 feet or higher, was classified as an Unidentified Aerial Phenomenon. The case is closed.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed on 3 February 2023 at 15:01 UTC. It records a sighting by the crew of Delta Air Lines flight DAL1242, a commercial flight travelling northbound from Austin to Minneapolis at 36,000 feet.

The crew reported a large balloon off the left side of the aircraft, approximately 29 nautical miles south of Lincoln, Nebraska. They estimated the balloon was at roughly 50,000 feet or above — well above their own cruising altitude and above the ceiling of most commercial air traffic.

The FAA classified the incident under the primary code &quot;Unidentified Aerial Phenomenon&quot; and routed the report through the Denver POD. The reporting facility was listed as AWO. Despite the crew describing the object as a balloon, it received the UAP classification, indicating it was not positively identified at the time.

The case status is marked as closed. The report contains no mention of follow-up investigation, corroborating radar or sensor data, or a final determination of what the object was. There is minimal redaction in this document.</div>
