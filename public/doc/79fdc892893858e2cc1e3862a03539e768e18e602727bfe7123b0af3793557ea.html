  <h1>Delta Pilot Reported Mystery Object Later Identified as Starlink Satellites</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/79fdc892893858e2cc1e3862a03539e768e18e602727bfe7123b0af3793557ea.jpg" alt="Delta Pilot Reported Mystery Object Later Identified as Starlink Satellites thumbnail" loading="lazy" />
  <p>An FAA incident report documents a Delta Air Lines pilot reporting an unidentified aerial phenomenon while flying at 37,000 feet over the North Pacific on 13 February 2023. The sighting was subsequently identified as a Starlink satellite train illuminated by the rising sun, a conclusion confirmed by NORAD. The case is closed.</p>
  <div class="narr">On 13 February 2023, the crew of Delta Air Lines flight DAL26 — a commercial Airbus A350 flying eastbound at 37,000 feet — reported an unidentified aerial phenomenon off the front of the aircraft. The sighting occurred approximately 1,350 miles north-northwest of Shemya, a remote island in Alaska&#39;s Aleutian chain, placing the aircraft over the North Pacific.

The FAA logged the report under its SKYWATCH programme as case 237UAP00217. Investigators determined that the unknown phenomenon correlated with a Starlink satellite train travelling southeast at a time when the rising eastern sun would have illuminated the satellites, making them visible to the flight crew. NORAD — the joint US-Canadian military command responsible for aerospace monitoring — independently concurred with this identification.

As part of the investigation, the FAA&#39;s Air Traffic Security Coordination (ATSC) briefed the Office of Military and Intelligence Coordination (OMIC) on using the website Satellitemap.space to cross-reference future pilot reports against known satellite activity.

The case is now closed. There is minimal redaction in the document, and the resolution is straightforward: the phenomenon was a known satellite constellation, not an unexplained object.</div>
