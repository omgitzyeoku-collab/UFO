  <h1>FAA Report: Pilot Spots Unexplained Bright Light Near Palm Springs</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2b2fae712bc9113f0a3fa8dfad9233dc192b8b4ed6d85bf2db7ee5abe9890b97.jpg" alt="FAA Report: Pilot Spots Unexplained Bright Light Near Palm Springs thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from January 2024 documenting a commercial pilot&#39;s sighting of a bright, unidentified light well above their aircraft near Palm Springs, California. The object did not appear on air traffic control radar, no evasive action was needed, and the case was closed without explanation.</p>
  <div class="narr">On 21 January 2024, the crew of a commercial flight operating under callsign XLJ411 reported an unidentified aerial phenomenon to the Federal Aviation Administration. The aircraft was climbing to 41,000 feet on a southeast heading, approximately 10 nautical miles northwest of Palm Springs (PSP), when the crew spotted something unusual directly ahead at the 12 o&#39;clock position.

The crew described a bright light that appeared to turn and then remain stationary at times. It was positioned significantly higher than their aircraft — meaning above 41,000 feet. No evasive manoeuvres were required, and the sighting did not affect the flight&#39;s safety.

Air traffic control checked their radar systems but found nothing. The FAA logged the event under its SKYWATCH programme, which tracks unidentified aerial phenomena reported by pilots and controllers. The incident was assigned tracking number ZLA-M-2024/01/21-0001 under the Los Angeles Air Route Traffic Control Center (ZLA).

The case is now marked as closed. The FAA did not record any identification or resolution — the light remains unexplained in the official record. No tail number for the aircraft was logged, which limits the ability to independently verify the specific flight.</div>
