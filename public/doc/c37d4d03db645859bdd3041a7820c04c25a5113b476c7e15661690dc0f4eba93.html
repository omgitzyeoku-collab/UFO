  <h1>UPS Cargo Crew Reported Bright Lights Ahead at 37,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c37d4d03db645859bdd3041a7820c04c25a5113b476c7e15661690dc0f4eba93.jpg" alt="UPS Cargo Crew Reported Bright Lights Ahead at 37,000 Feet thumbnail" loading="lazy" />
  <p>This is an FAA preliminary notification from February 2023 documenting a UAP sighting by the crew of a UPS cargo flight over Pennsylvania. The crew saw bright lights directly ahead of their aircraft at 37,000 feet; no evasive action was taken and no investigation findings are included.</p>
  <div class="narr">On 10 February 2023 at 3:45 AM Eastern time, the crew of UPS flight 1052 — a Boeing 757-200 flying from Manchester, New Hampshire to Bangor, Maine — reported seeing an unidentified aerial phenomenon while cruising at 37,000 feet. The object appeared as bright lights directly ahead of the aircraft, at what pilots call the &quot;12 o&#39;clock position.&quot;

At the time of the sighting, the aircraft was approximately 18 nautical miles west of Wilkes-Barre, Pennsylvania. New York ARTCC (Air Route Traffic Control Center), the air traffic control facility responsible for that airspace, was advised of the report. The crew did not take any evasive action, and no law enforcement was notified.

The document itself is a Washington Operations Center preliminary notification — essentially, the FAA&#39;s internal early-alert form for unusual events. It records basic details (flight number, position, time, what was seen) but contains no analysis, no radar data, and no conclusions about what the lights were. The description is limited to &quot;bright lights&quot; with no further detail on shape, size, movement, or how long the sighting lasted.

One oddity worth noting: the source document mislabels the longitude coordinate field as &quot;Latitude,&quot; which may reflect a simple data-entry error in the FAA&#39;s form. The coordinates given (roughly 41.3°N, 76.2°W) do correspond to an area west of Wilkes-Barre, consistent with the text description.</div>
