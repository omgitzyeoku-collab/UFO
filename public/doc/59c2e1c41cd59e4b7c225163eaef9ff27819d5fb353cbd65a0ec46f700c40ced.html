  <h1>FedEx Pilot Reported Triangle of Lights Over Atlantic in 2023</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/59c2e1c41cd59e4b7c225163eaef9ff27819d5fb353cbd65a0ec46f700c40ced.jpg" alt="FedEx Pilot Reported Triangle of Lights Over Atlantic in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a FedEx cargo pilot&#39;s sighting of a triangle of bright lights at an unknown altitude while flying at 40,000 feet over the Atlantic Ocean east of the Bahamas on 29 May 2023. The case was closed with no identification or explanation recorded.</p>
  <div class="narr">On 29 May 2023, at 06:07 UTC, the crew of a FedEx MD-11 cargo aircraft (callsign FDX64) filed a report with the FAA&#39;s SKYWATCH system describing an unidentified aerial phenomenon. The aircraft was flying northwest at Flight Level 400 — roughly 40,000 feet — on a commercial route from San Juan, Puerto Rico, to Memphis, Tennessee.

At coordinates 28°21&#39;N / 78°42&#39;W, over the Atlantic Ocean east of the Bahamas, the crew observed what they described as a triangle of bright lights at an undetermined altitude. Because the altitude of the lights could not be established, no reliable estimate of their size or distance was possible.

The FAA logged the report under case number 237UAP00267 and marked it as closed. The file contains no resolution — the phenomenon was neither identified nor explained. No corroborating radar data or sensor evidence is mentioned in the report.

The document itself is a standard FAA SKYWATCH incident form. It is not a lengthy investigation file; it is a structured one-page report capturing the pilot&#39;s observation and basic flight details. There is little sign of redaction, but equally little analytical follow-up recorded in the file.</div>
