  <h1>EVA Air crew reported dogfighting objects at 50,000 feet over Pacific</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/07b120ae87c34d08be30d338526039fc4a065a5f66889642aa085db67ae5897f.jpg" alt="EVA Air crew reported dogfighting objects at 50,000 feet over Pacific thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents that the crew of EVA Air flight EVA008, a Boeing 777 en route from Taipei to San Francisco, observed an unidentified aerial phenomenon appearing to dogfight at approximately 50,000 feet while 450 nautical miles west of San Francisco on 27 January 2024. The phenomenon was not detected on air traffic control radar, and the case was closed with no indicated follow-up.</p>
  <div class="narr">This is an FAA SKYWATCH incident report filed under record number 237UAP00347. It documents a pilot observation made by the crew of EVA Air flight EVA008, a commercial Boeing 777 flying eastbound from Taipei (RCTP) to San Francisco (SFO) at 37,000 feet.

On 27 January 2024 at 13:02 UTC, approximately 450 nautical miles west of San Francisco, the crew reported an unidentified aerial phenomenon directly ahead of their aircraft at the 12 o&#39;clock position. The crew described the phenomenon as appearing to be &quot;dogfighting&quot; at approximately FL500 — around 50,000 feet, some 13,000 feet above their own altitude.

Air traffic control checked their radar systems and did not detect anything corresponding to the reported phenomenon. The case was marked as closed with no indication of any follow-up investigation or resolution in the document.

The report is brief and contains no photographs, sensor data, or corroborating observations from other aircraft or ground stations. It is a single-source pilot observation documented through the FAA&#39;s standard UAP reporting channel.</div>
