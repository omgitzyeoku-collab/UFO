  <h1>United Airlines crew reported large balloon at 50,000 feet in February 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a6f6e94846ce94e81598109945e501499654e6f443189eff795bea4a3001be92.jpg" alt="United Airlines crew reported large balloon at 50,000 feet in February 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a United Airlines flight crew observing a large balloon-like object at roughly 50,000 feet near St. Joseph, Missouri, on 3 February 2023. Despite the crew describing it as a balloon, the FAA classified it as an Unidentified Aerial Phenomenon, meaning no positive identification was made. The case is now closed.</p>
  <div class="narr">On 3 February 2023, the crew of United Airlines flight 700 — a commercial service from Washington Dulles (IAD) to San Francisco (SFO) — reported seeing a large balloon while flying northbound at 40,000 feet. The sighting occurred approximately 10 nautical miles west of St. Joseph, Missouri, in airspace managed by Kansas City Center (ZKC).

The object was estimated to be at approximately 50,000 feet or above, well above the aircraft&#39;s cruising altitude. The crew described it as a large balloon, but the FAA filed the report under its primary code of Unidentified Aerial Phenomenon, indicating that no definitive identification was established.

The timing is notable: this sighting took place during the same period in early February 2023 when multiple high-altitude balloon objects were being tracked over North America, including a confirmed Chinese surveillance balloon that was widely reported in the news. Whether this object was related to those incidents is not stated in the report.

The report itself is brief — a single page from the FAA&#39;s SKYWATCH incident reporting system. It contains the basic facts of the observation but includes no corroborating radar data, sensor readings, or follow-up investigation details. The case status is listed as closed.</div>
