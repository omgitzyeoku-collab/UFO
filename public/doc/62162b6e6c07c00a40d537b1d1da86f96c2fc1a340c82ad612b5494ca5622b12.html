  <h1>Sun Country Airlines crew reports UAP sighting over South Carolina</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/62162b6e6c07c00a40d537b1d1da86f96c2fc1a340c82ad612b5494ca5622b12.jpg" alt="Sun Country Airlines crew reports UAP sighting over South Carolina thumbnail" loading="lazy" />
  <p>This FAA preliminary incident report documents a UAP sighting by the crew of Sun Country Airlines flight 8727 on August 12, 2023, while flying at approximately 20,000 feet near Florence, South Carolina. The crew observed something unidentified off the right side of their aircraft but took no evasive action, and no further details about the object&#39;s appearance or behaviour are provided in the report.</p>
  <div class="narr">On August 12, 2023, at approximately 1:55 AM Eastern time, the crew of Sun Country Airlines flight 8727 — a Boeing 737-800 flying from Fort Lauderdale to Charlotte — spotted an unidentified aerial phenomenon from the right side of their aircraft. They were heading northbound at flight level 200, roughly 20,000 feet, about 30 nautical miles southwest of Florence, South Carolina.

The crew did not take evasive action, and no law enforcement notification was made. Jacksonville Air Route Traffic Control Center relayed the report to FAA Operations, which produced this preliminary incident record from the FAA Washington Operations Center.

Notably, the report contains no description of what the crew actually saw — no shape, size, colour, movement, or behaviour of the object is recorded. This is a bare-bones operational log, not an investigation or analysis. There is no reference to radar data, sensor readings, or corroborating observations from other aircraft or ground stations.

The document carries minimal redaction. What is missing appears to be detail that was simply never captured at this stage of reporting rather than information that was removed. The FAA assigned this record the identifier 237UAP00538.</div>
