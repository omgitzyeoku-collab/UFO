  <h1>Cessna Pilot Reports Two Balloon-Like Objects Near Pensacola</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ca5606ef906278cc42287704331002412b4fed9d953a3fa41b8352adf3c96513.jpg" alt="Cessna Pilot Reports Two Balloon-Like Objects Near Pensacola thumbnail" loading="lazy" />
  <p>This FAA incident notification records a pilot&#39;s report of two basketball-sized balloons with wires spotted at 1,500 feet near Pensacola, Florida on 25 April 2023. A second aircraft flying behind did not see the objects, and no evasive action was taken.</p>
  <div class="narr">On 25 April 2023 at 08:56 local time, the pilot of a Cessna C172 (registration N5245K) reported an unidentified aerial phenomenon to Pensacola TRACON, the regional air traffic control facility. The aircraft was flying southeast at 1,500 feet, roughly 15 nautical miles northwest of Pensacola International Airport.

The pilot described the phenomenon as two basketball-sized balloons with wires. No evasive action was taken, suggesting the objects were not considered an immediate collision threat. A second aircraft following behind did not observe anything matching the pilot&#39;s description.

The document is a Washington Operations Center notification — essentially an internal FAA alert that a UAP sighting was reported. It is not a full investigation or a conclusion about what the objects were. Law enforcement was not notified according to the record.

The coordinates place the sighting at approximately 30.42°N, 87.22°W, over the area northwest of Pensacola. The record shows minimal redaction and is straightforward in its content: a pilot saw something, reported it, and a trailing aircraft could not confirm it.</div>
