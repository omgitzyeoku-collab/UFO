  <h1>United Airlines crew reported black UFO 100 feet from their Boeing 737</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bf9a54bdc831fb391189193ee5ce01afd49dd045e5dbd1b3088e305de5dd83c3.jpg" alt="United Airlines crew reported black UFO 100 feet from their Boeing 737 thumbnail" loading="lazy" />
  <p>An FAA preliminary incident report records that the crew of United Airlines flight 1986, a Boeing 737-800 flying from San Francisco to Seattle, reported a black unidentified object roughly 100 feet from their aircraft at 8,000 feet altitude near Oakland, California. The document is a brief operations-centre log entry, not a full investigation, and includes no conclusions about what the object was.</p>
  <div class="narr">This document is a preliminary incident report from the FAA&#39;s Washington Operations Center, originally logged on 6 March 2024. It records a UAP (unidentified anomalous phenomena) sighting reported by the flight crew of United Airlines flight 1986, a Boeing 737-800 operating the San Francisco to Seattle route.

According to the report, the crew observed a black unidentified object approximately 100 feet from the aircraft&#39;s 1 o&#39;clock position — that is, slightly to the right and ahead of the nose. At the time, the aircraft was heading northwest at 8,000 feet altitude, roughly 2 nautical miles north-northeast of Oakland, California (coordinates 37.75°N, 122.21°W). Despite the close proximity, the crew took no evasive action.

The report notes that law enforcement was not notified. The document carries an internal tracking reference (WOC 7-3333) and staff initials, but no follow-up investigation, analysis, or conclusion about the nature of the object is included. The only physical description given is the colour: black. No size, shape, speed, or behaviour of the object is recorded.

This is a single-page operational log entry — not a finished investigation or analytical product. It represents the earliest stage of FAA incident documentation: a crew report forwarded through the operations centre. Whether any further inquiry took place is not indicated in this document.</div>
