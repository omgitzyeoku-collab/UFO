  <h1>Pentagon UAP Office Briefing Shows Most Sightings Resolve to Ordinary Objects</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/8b9284e323b5d366d041c78628ed65bc9c7a4649b722b641b014f8b0b29aaefc.jpg" alt="Pentagon UAP Office Briefing Shows Most Sightings Resolve to Ordinary Objects thumbnail" loading="lazy" />
  <p>This is an unclassified briefing by the All-Domain Anomaly Resolution Office (AARO), the Pentagon&#39;s UAP investigation unit, presented at a defence intelligence conference. It argues that most reported UAP are explained by gaps in awareness of what&#39;s already in the sky — balloons, satellites, and other mundane objects — while acknowledging that many cases remain unresolved due to insufficient data.</p>
  <div class="narr">This document is a briefing presentation delivered by Tim Phillips, Deputy Director of the All-Domain Anomaly Resolution Office (AARO), at the Defense Space, Geospatial &amp; Intelligence Leadership Conference. AARO is the Pentagon office responsible for investigating unidentified anomalous phenomena (UAP) across air, sea, space, and land. The briefing was cleared for public release on 3 February 2025 and is fully unclassified with minimal redaction. Its legal authority is cited as the FY24 National Defense Authorization Act, codified at 44 U.S.C. 2107.

The central message is that UAP are &quot;primarily attributable to domain-awareness gaps&quot; — meaning most sightings stem from observers not recognising ordinary objects. The briefing walks through specific case studies. In one, a US drone captured video of an unidentified object near Italy&#39;s Mt. Etna volcano in 2018; AARO assessed with moderate confidence that it was a balloon drifting with the wind roughly 170 kilometres from the eruption, based partly on pixel luminosity analysis showing the object&#39;s path did not intersect the ash plume. In another, AARO explains that bright &quot;flaring&quot; from SpaceX Starlink satellites — caused by sunlight reflecting off their flat undersides just after sunset or before sunrise — accounts for a category of space-domain reports. AARO developed mathematical tools to predict these flaring events and validated the predictions through observation.

AARO also describes controlled field experiments at Camp Grafton, North Dakota, a 10,000-acre federal site, where surrogate targets were designed to mimic commonly reported UAP behaviours — appearing hot, high-speed, orb-like, star-like, or highly manoeuvrable. Over two hours of unclassified full-motion video was collected. The aim was to test new geospatial intelligence methods and develop automated detection algorithms. Separately, AARO received 81 space-domain UAP cases (74 from the Federal Aviation Administration) and had closed 62 of them. More than 100 total reports came from the FAA. A dedicated Space UAP Tiger Team was convened to address awareness gaps in that domain.

Despite the emphasis on prosaic explanations, the briefing acknowledges that many cases in AARO&#39;s holdings remain unresolved because of a lack of verifiable data. It also notes a collection bias: because AARO relies heavily on Department of Defense sources, reports cluster near military test ranges, special-use airspace, and operational areas rather than reflecting UAP activity nationwide.</div>
