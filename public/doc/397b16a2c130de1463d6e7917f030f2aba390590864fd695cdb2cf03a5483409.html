  <h1>Pilot Reports Stationary Strobe Lights Above Aircraft Near Lynchburg, Virginia</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/397b16a2c130de1463d6e7917f030f2aba390590864fd695cdb2cf03a5483409.jpg" alt="Pilot Reports Stationary Strobe Lights Above Aircraft Near Lynchburg, Virginia thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a general aviation pilot&#39;s brief sighting of a line of stationary strobe lights far above their aircraft at 40,000 feet near Lynchburg, Virginia on 10 March 2022. The lights turned off after a few seconds, and the case is now closed with no further explanation recorded.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form the Federal Aviation Administration uses to log unusual aerial observations reported by pilots or air traffic controllers. It was filed on 10 March 2022 at 00:39 UTC and classified under the secondary code &quot;Unidentified Aerial Phenomenon.&quot; The case status is closed.

The report describes a general aviation aircraft with callsign N499PA flying southwest from Teterboro, New Jersey to DeKalb-Peachtree, Georgia. While cruising at FL400 (40,000 feet), approximately 10 miles north of Lynchburg, Virginia, the pilot reported observing what they described as a &quot;possible UFO&quot; — a line of stationary strobe lights positioned far above the aircraft. The lights switched off after a few seconds.

The sighting was reported through Washington Center (ZDC), the FAA air traffic control facility covering that airspace. The report was distributed via the Denver (DEN) point of distribution. The operator type is listed as general aviation.

The document does not record any conclusions about what the object was. There is no mention of corroborating radar data, additional witness accounts, or follow-up investigation. The tail number and operator name fields are blank, though the callsign N499PA is provided. The case was closed without a stated resolution.</div>
