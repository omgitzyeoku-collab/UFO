  <h1>FAA Report: Pilot Spots Unidentified Object Above Him Near Ardmore</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a521a8d030f2db35c46478b9c6946109b0e87f4243785f12a5a1b30b443f4103.jpg" alt="FAA Report: Pilot Spots Unidentified Object Above Him Near Ardmore thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a general aviation pilot flying a Pilatus PC-12 who observed an unidentified lighted object roughly 1,200 feet above his aircraft near Ardmore on 4 November 2023. Air traffic control radar picked up the object as a primary-only target — meaning it had no transponder active and was not in radio contact — and the case was closed without identification.</p>
  <div class="narr">This document is an FAA SKYWATCH Incident Report filed under case number 237UAP00312, classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot; It records an event that occurred on 4 November 2023 at 00:10 UTC.

A Pilatus PC-12 aircraft with callsign N822NG was flying southwest-bound at flight level 190 (approximately 19,000 feet) en route from Republic Airport in Farmingdale, New York (FRG) to DeKalb-Peachtree Airport in Georgia (PDK). While passing approximately 3 nautical miles northwest of Ardmore (ARD), the pilot in command observed an unknown object roughly 1,200 feet above the aircraft. The pilot reported that the object displayed lights suggesting it was an aircraft.

New York Air Route Traffic Control Center (ZNY), the reporting facility, confirmed that the object appeared on radar as a primary-only target. This means radar detected something at that location, but the object was not broadcasting a transponder signal and was not in radio communication with controllers.

The FAA marked the case as Closed. No resolution or identification of the object is noted in the report. There is no indication of significant redaction in the document.</div>
