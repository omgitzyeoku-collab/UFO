  <h1>FAA Report: Pilot Spots White Object Near Victoria, Texas</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/3ff78c95eed37dc01b1d1c1b2436d9d883471b85a7538d2253c4f17944723a7f.jpg" alt="FAA Report: Pilot Spots White Object Near Victoria, Texas thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a commercial pilot flying a Cessna 208 who reported a white unidentified object travelling around the aircraft at 4,000 feet, roughly 22 nautical miles northeast of VCT (Victoria Regional Airport, Texas). The object did not appear on air traffic control radar, no evasive action was taken, and the case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00366. It records a pilot sighting of an unidentified aerial phenomenon (UAP) that occurred on 29 March 2024 at 13:23.

The pilot was flying a Cessna 208 (a single-engine turboprop commonly used for cargo and commuter flights) under the callsign MRA685, operating as a commercial flight for MRA. The aircraft was heading southwest at 4,000 feet, approximately 22 nautical miles northeast of VCT, when the pilot reported seeing a white object travelling around the aircraft.

Air traffic control checked their radar but did not detect the object. The pilot did not take any evasive action. A facility identified as &quot;TY&quot; was notified of the report.

The FAA marked the case as Closed. No resolution, identification, or explanation for the sighting is noted in the document. The report relies entirely on the pilot&#39;s eyewitness account.</div>
