  <h1>Hawaiian Airlines Crew Reported Unexplained Lights at 37,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/606bd20162192e18d5e167c5bbe4cf7d976b837c0c94a6d7b6489462160f953d.jpg" alt="Hawaiian Airlines Crew Reported Unexplained Lights at 37,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a February 2023 sighting by the crew of Hawaiian Airlines flight HAL90, who observed unidentified lights appearing and disappearing at or above their cruising altitude of 37,000 feet while flying from Honolulu to Boston. The report was classified under the FAA&#39;s &quot;Unidentified Aerial Phenomenon&quot; code and closed without any explanation provided.</p>
  <div class="narr">On 11 February 2023, the crew of Hawaiian Airlines flight HAL90 — an Airbus A330-200 flying from Honolulu to Boston — reported something unusual to air traffic control. While cruising eastbound at 37,000 feet, approximately 25 nautical miles south of Sioux Falls, South Dakota, they observed lights appearing and disappearing directly ahead of them, at or above their altitude.

The sighting was reported to Minneapolis Center (ZMP), the FAA air traffic control facility responsible for that airspace. The FAA logged the incident under its SKYWATCH system and assigned it the primary code &quot;Unidentified Aerial Phenomenon.&quot; A party identified in the report only as &quot;TY&quot; was notified, though the document does not define who or what &quot;TY&quot; refers to.

The FAA marked the case as closed. No resolution or explanation for the lights is provided anywhere in the report. There is no mention of radar data, sensor recordings, or any corroborating evidence beyond the crew&#39;s visual observation.

Notably, the report does not include a tail number for the aircraft, which is unusual for an FAA incident filing. The document shows minimal redaction, but the information it contains is limited to the crew&#39;s account and basic flight details.</div>
