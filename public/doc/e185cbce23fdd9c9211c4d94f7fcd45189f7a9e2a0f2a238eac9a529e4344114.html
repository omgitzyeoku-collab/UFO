  <h1>Spirit Airlines Crew Reported Circling Lights Over Iowa at 37,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e185cbce23fdd9c9211c4d94f7fcd45189f7a9e2a0f2a238eac9a529e4344114.jpg" alt="Spirit Airlines Crew Reported Circling Lights Over Iowa at 37,000 Feet thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents a sighting by the crew of Spirit Airlines flight 656 on 11 February 2023, who observed lights circling off their left side near Iowa City while flying at 37,000 feet. The FAA noted that similar reports from the previous week had been attributed to a chain of satellites, and no law enforcement or further investigation was initiated.</p>
  <div class="narr">On 11 February 2023 at approximately 3:05 AM Central time, the crew of Spirit Airlines flight 656 — an Airbus A320neo flying from Los Angeles to Pittsburgh — reported an unusual sighting to air traffic control. While eastbound at 37,000 feet in the vicinity of Iowa City, Iowa, the crew observed lights circling off the left side of the aircraft at the same altitude or higher. Chicago ARTCC (Air Route Traffic Control Center), the FAA facility managing that airspace, was advised of the report.

The FAA&#39;s Washington Operations Center logged the incident as a preliminary information report, categorised under its UAP (unidentified anomalous phenomena) tracking system with the identifier 237UAP00460. The report is brief and operational in nature — it records what the crew saw, where and when they saw it, and the coordinates of the aircraft at the time (approximately 41.66°N, 91.53°W).

Notably, the FAA itself flagged that similar phenomena had been reported the previous week and were determined to be a chain of satellites — a description consistent with Starlink or similar satellite constellations, which are a common source of pilot UAP reports. Law enforcement was not notified, and the document contains no indication that further investigation was pursued.

This is a single-page preliminary report, not a completed investigation. There is no radar data, no follow-up analysis, and no final determination included in the document. The level of redaction is low — the report appears to be released largely intact.</div>
