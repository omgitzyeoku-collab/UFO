  <h1>FBI Flying Disc Files Show Sightings, Policy Clashes, and One Toy Kite</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/1ddb6ef944239c55b86c1089246cd77aadd1d3d391238a1feeab700f7b773d7b.jpg" alt="FBI Flying Disc Files Show Sightings, Policy Clashes, and One Toy Kite thumbnail" loading="lazy" />
  <p>This section of FBI case file 62-HQ-83894 contains investigative memos, eyewitness reports, and inter-agency correspondence about flying disc sightings from 1947 to 1948. It documents police and pilot observations of unidentified objects, a bureaucratic conflict between the FBI and Air Force over who should investigate, a lab analysis that found nothing unusual in soil from an alleged landing site, and at least one case where a reported flying disk turned out to be a commercial toy kite prototype.</p>
  <div class="narr">This document is a portion of FBI case file 62-HQ-83894, covering flying disc reports between October 1947 and December 1948. It contains internal FBI memos, telegrams, citizen letters to FBI Director J. Edgar Hoover, and communications between the FBI and military agencies. The file captures a period when the U.S. government was actively trying to figure out what people were seeing in the sky — and who was supposed to look into it.

Several eyewitness accounts stand out. On September 11, 1947, multiple Portland, Oregon police officers reported a bright, silvery, round or elliptical object over the city. Officer Robert Adair estimated it was traveling about 150 miles per hour at roughly 5,000 feet. Portland&#39;s Chief of Police, Leon Jenkins, initially thought it was a weather balloon but ruled that out because of its extreme speed. Separately, in July 1947 near Bethel, Alaska, pilots Jack Peck and Daly reported a dark flying-wing-shaped object roughly the size of a C-54 aircraft (but with no fuselage), moving at an estimated 300 mph at about 1,000 feet. Peck radioed the Civil Aeronautics Administration at Bethel, who confirmed no known aircraft were in the area.

The file also reveals a significant bureaucratic clash. On October 1, 1947, the FBI issued Bureau Bulletin No. 57, officially instructing its agents to stop investigating flying disc reports and refer them to the Air Force. But in February 1948, the Air Defense Command issued its own orders stating that flying disc investigations should be coordinated with the FBI — directly contradicting the FBI&#39;s own policy. FBI field offices flagged the contradiction to headquarters, and the FBI Director confirmed that the Bureau&#39;s no-investigation stance had not changed.

Not everything in the file is unexplained. Near Helendale, California, in December 1948, a roughly six-foot-diameter disk was found at a private airport. Investigation revealed it was an experimental toy kite being developed by Olsen and Rice Manufacturing, financed by inventor Claude Leroy Wolfert. The FBI Laboratory also analyzed a soil sample sent by the Air Force&#39;s Project SIGN from an alleged flying saucer landing site. The lab found nothing unusual — no abnormal particles, no radioactivity, no signs of extreme heat — though the sample had been compromised by rain before collection.

The file includes several citizen letters forwarded to Hoover, including a secondhand claim from a Red Cross official that the government had determined the flying saucers originated from Spain. This was unsubstantiated hearsay relayed through a dentist. Hoover&#39;s office responded to most citizen letters with form acknowledgments and no further investigation.</div>
