  <h1>Pilot Reports Silver Rocket-Shaped Object at 6,500 Feet in 2023</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/0ba545d7c07a61fe4236fef22be690319caae9e59192bd53fb0056810d5d80b1.jpg" alt="Pilot Reports Silver Rocket-Shaped Object at 6,500 Feet in 2023 thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a general aviation pilot&#39;s sighting of a silver, rocket-shaped object roughly six feet long while flying at 7,000 feet on 1 September 2023. The case was closed with no explanation provided for what the pilot observed.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAPs) from pilots and air traffic facilities. It was filed under case number 237UAP00295.

On 1 September 2023, at 00:04 UTC, a general aviation pilot flying under callsign N715JP reported an unidentified object while heading southbound at 7,000 feet near the facility coded NHK. The flight had originated from airport BLM and was bound for airport CRE. The pilot described the object as a silver rocket, approximately six feet long, travelling northeast at roughly 6,500 feet — meaning it was about 500 feet below the reporting aircraft and heading in a different direction.

The case is marked as closed. No resolution, identification, or follow-up explanation appears in the document. There is no mention of corroborating radar data, additional witnesses, or any further investigation. The report notes that a page-out was issued (marked &quot;Paged: YES&quot;), indicating the sighting was flagged to relevant personnel at the time.

The document contains minimal redaction. It is a short, structured incident form rather than an investigative file — it records what was reported but does not attempt to explain it.</div>
