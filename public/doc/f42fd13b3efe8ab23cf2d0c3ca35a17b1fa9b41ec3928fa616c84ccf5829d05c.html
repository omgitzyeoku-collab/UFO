  <p>This is an auto-transcribed excerpt of a 1962 television interview in which a journalist questions astronaut Gordon Cooper about unidentified flying objects (UFOs) and the possibility of extraterrestrial life. Cooper says many well-qualified people have seen objects with no logical explanation, while allowing that each sighting may individually have one, and speculates that some of the thousands of other planets with a livable atmosphere might host human-type life. The record is one speaker&#39;s personal opinion from a single interview, not evidence or an official finding.</p>
  <div class="narr">This document is an audio excerpt, transcribed automatically, from a 1962 television interview held by NASA (the US National Aeronautics and Space Administration). In it, a journalist questions astronaut Gordon Cooper about unidentified flying objects — commonly called UFOs — and whether life might exist elsewhere.</div>
