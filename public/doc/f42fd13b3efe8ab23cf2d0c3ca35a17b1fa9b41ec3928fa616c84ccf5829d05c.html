  <h1>NASA-UAP-D023, Interview Excerpt with Astronaut Gordon Cooper, 1962</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">November, 1962</span>
    
    
  </div>
  
  <p>In November 1962, journalist Walter Cronkite interviewed astronaut Gordon Cooper. In this excerpt from that interview, Cronkite asks Cooper about his views regarding the nature of unidentified flying objects, having previously expressed an interest in the subject. Cooper opines that “a large number of exceptionally well-qualified people have seen objects” without a “logical explanation” and speculates on the existence of other planets with “a livable atmosphere” and that maybe there are “some type of human life” out there. Interview was conducted in November 1962.</p>
