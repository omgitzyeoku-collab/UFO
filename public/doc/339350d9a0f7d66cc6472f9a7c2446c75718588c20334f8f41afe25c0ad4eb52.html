  <h1>Gulfstream Pilot Reported Glowing Cylindrical Object Near Grand Canyon</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/339350d9a0f7d66cc6472f9a7c2446c75718588c20334f8f41afe25c0ad4eb52.jpg" alt="Gulfstream Pilot Reported Glowing Cylindrical Object Near Grand Canyon thumbnail" loading="lazy" />
  <p>This FAA incident report documents a June 2021 sighting by a Gulfstream IV pilot who observed a glowing white cylindrical object paralleling the aircraft at 45,000 feet near the Grand Canyon. The case was closed with no explanation provided for what the object was.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under record number 237UAP00054. It describes an encounter reported on 9 June 2021 by the crew of a Gulfstream IV business jet, callsign EDG49, flying a commercial route from Van Nuys, California to Columbus, Ohio. The report was handled by Los Angeles Air Route Traffic Control Center (ZLA).

According to the report, while flying northeast at 45,000 feet — roughly 29 nautical miles southwest of Grand Canyon — the pilot observed a glowing white cylindrical object off the right side of the aircraft. The object was approximately 3,000 feet above and was paralleling the aircraft at the same speed. The pilot-in-command stated he was taking photographs and video of the object, though no imagery is included in the released document.

The FAA classified the incident under the primary code &quot;Unidentified Aerial Phenomenon&quot; and assigned secondary codes MOR (Mandatory Occurrence Report) and UAS (Unmanned Aircraft System), suggesting a drone explanation was at least considered. The case status is listed as &quot;Closed&quot; with no resolution or determination documented.

The aircraft&#39;s tail number field is blank in the report, which limits the ability to independently verify which specific aircraft was involved. No radar data or sensor evidence accompanies the pilot&#39;s account.</div>
