  <h1>DOS-UAP-D002, Diplomatic Cable, Brazil, November 20, 1963</h1>
  <div class="meta">
    <span class="badge">Department of State</span>
    <span class="badge">11/20/63</span>
    <span class="badge">Bahia, Brazil</span>
    
  </div>
  
  <p>This document is a U.S. Department of State diplomatic cable from the U.S. Embassy in Rio de Janeiro, Brazil to the Office of the Secretary of State in Washington, D.C., on November 20, 1963. This cable relays the findings of the scientific attaché at the American Consulate in Salvador, Bahia, Brazil, that a widely reported incident allegedly involving a crashed unidentified object was unsubstantiated, characterizing the reports as a fabrication originating in Rio de Janeiro.

The Consulate cites a lack of contemporary local reporting regarding the alleged incident, as well as contradictory reporting from local newspapers after the fact, as evidence that the published claims are unsubstantiated. The Consulate also cites a statement from the Brazilian Ministry of Aeronautics categorically denying that there was “any “strange object” in Conde [Bahia].” This correspondence follows a previous exchange between the Embassy and the Department of State, included in this collection under the title “DOS-UAP-D001.”</p>
