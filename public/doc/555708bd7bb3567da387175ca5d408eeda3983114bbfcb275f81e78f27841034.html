  <h1>Airline Crew Reports Fast-Moving Lights at 55,000 Feet Over Maine</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/555708bd7bb3567da387175ca5d408eeda3983114bbfcb275f81e78f27841034.jpg" alt="Airline Crew Reports Fast-Moving Lights at 55,000 Feet Over Maine thumbnail" loading="lazy" />
  <p>An FAA notification records that the crew of Air Transat flight 661, an Airbus A321neo flying from Cuba to Quebec City, reported multiple bright white lights near Presque Isle, Maine at roughly 55,000 feet — well above their own aircraft&#39;s ceiling. The lights were described as moving rapidly and changing directions. The document is a preliminary notification, not a completed investigation.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification, logged on 25 February 2024 at 2:40 AM Eastern time. It records a UAP (Unidentified Aerial Phenomenon) sighting reported by the crew of Air Transat flight 661, a Canadian-registered Airbus A321neo flying from Cunagua, Cuba to Quebec City, Canada.

According to the report, the crew observed multiple bright white lights near Presque Isle, Maine at flight level 550 — approximately 55,000 feet. That altitude is above the service ceiling of the A321neo itself, meaning the crew was looking up at whatever they saw. The lights were described as moving rapidly and changing directions.

The sighting was relayed through Boston ARTCC (Air Route Traffic Control Center) to the FAA&#39;s Washington Operations Center, where it was assigned reference number WOC 73333.

The document is marked as preliminary information, not a final investigation. It contains no radar data, photographs, sensor readings, or follow-up findings. There is little evidence of redaction — the record appears to be simply brief by design, as an initial notification rather than an analytical product.

No conclusion about the nature of the lights is offered in the document. The FAA recorded what the crew reported and routed it through standard channels. Whether any further investigation was conducted is not addressed here.</div>
