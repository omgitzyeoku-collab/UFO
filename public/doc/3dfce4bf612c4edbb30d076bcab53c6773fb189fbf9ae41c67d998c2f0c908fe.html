  <h1>FAA Report: Unknown Object Orbiting at 41,000 Feet Near Shreveport</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3dfce4bf612c4edbb30d076bcab53c6773fb189fbf9ae41c67d998c2f0c908fe.jpg" alt="FAA Report: Unknown Object Orbiting at 41,000 Feet Near Shreveport thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting an unidentified aerial phenomenon spotted by a commercial aircraft crew on 28 December 2023 near Shreveport, Louisiana. The object was orbiting at roughly 41,000 feet, did not appear on air traffic control radar, and a second aircraft independently confirmed the sighting. The case was closed with no identification or explanation provided.</p>
  <div class="narr">On 28 December 2023 at 02:34, the crew of a commercial Boeing 737 (flight SWA1508) flying from Birmingham, Alabama to Dallas, Texas reported an unidentified aerial phenomenon while heading westbound at 31,000 feet, approximately one nautical mile west of Shreveport. The object was observed orbiting above them at roughly 41,000 feet — about 10,000 feet higher than the aircraft.

The sighting was corroborated by a second aircraft, flight ENY3781, which independently validated the report. Despite two flight crews observing the phenomenon, it did not appear on the air traffic control facility&#39;s radar system.

The FAA logged the incident as a SKYWATCH report under the primary code &quot;Unidentified Aerial Phenomenon.&quot; The case is marked as closed, but the report provides no resolution — the object was never identified, and no further explanation is offered.

The document shows minimal redaction. It is a brief operational report rather than a detailed investigation, and it contains no radar data, photographs, or sensor readings to supplement the crews&#39; visual observations.</div>
