  <h1>Energy Department report details unidentified object over Texas nuclear plant</h1>
  <div class="meta">
    <span class="badge">Department of Energy</span>
    <span class="badge">9/1/15</span>
    <span class="badge">Texas</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/249cd9f5b85c4a92dc819d65e1dad180744479d1c8a68ebbc202ade66facbcbb.jpg" alt="Energy Department report details unidentified object over Texas nuclear plant thumbnail" loading="lazy" />
  <p>This is an official Department of Energy incident report, with a cover letter, from the Pantex nuclear weapons plant near Amarillo, Texas. It documents an unidentified, slow-moving object that entered plant airspace on the morning of 1 September 2015 and was tracked by security personnel before it left the area. The document is marked as controlled nuclear information and &#39;Not For Public Release&#39;, is heavily redacted, and reaches no stated conclusion about what the object was.</p>
  <div class="narr">The document is an incident report produced by the Pantex Plant, a Department of Energy nuclear weapons facility near Amarillo, Texas. It records that at about 0710 on 1 September 2015, the plant&#39;s Ground Surveillance Radar (GSR) — an automated detection system — picked up an unknown object moving slowly and in a non-threatening manner, heading north to the west of the site. First radar contact was logged at roughly 0708, about 1.75 miles from a plant area, with the object travelling at only 10-15 mph.

Protective Force security officers responded and followed the object by eye, through binoculars, and via a camera mounted on an armoured Bearcat vehicle. They tracked it at an estimated 100-200 feet above the ground for three to five minutes, from about 75-100 metres away, and continued to follow it for several miles north of the plant until it was no longer visible, last seen near County Road G and F.M. 1342 heading east-northeast. Officers reported they could not identify any propulsion system and that the object made no sound. It was noted to seem to speed up and change direction as it was being followed.

Eyewitness descriptions were inconsistent. Personnel described a small object — roughly 4 feet tall and 2 feet wide at the bottom — of a diamond-type shape that was more rounded at the top. Its colour was disputed: some said it was black, while others said it appeared silver, red and blue. The Carson County Sheriff&#39;s office was notified and a deputy responded, but the deputy did not see the object.

According to the report, video from the nearest radar tower was sent to Sandia National Labs for further study, and all evidence from the incident — statements, video and other material — was turned over to an FBI agent. The extracted text references radar tracks and enhanced imagery but contains no analysis of them, and the report states no conclusion about what the object was.

The six-page document is marked Unclassified Controlled Nuclear Information (UCNI) and &#39;Not For Public Release&#39;, and is heavily redacted: the names of officers, the FBI agent and the letter&#39;s signatories, along with portions of the narrative, are blacked out. The report also carries conflicting dates — the body gives 1 September 2015 for the sighting, while the cover letter and title pages repeatedly say 2 September 2015. Two of its pages were originally released in a more redacted form, making this a partially de-redacted re-release.</div>
