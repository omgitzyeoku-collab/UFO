  <h1>U.S. Army Study Found No Foreign Link to Flying Saucer Reports in 1949</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b2e4554e261e980c10251e927942300342081109a50b4ef61dc37946deade80f.jpg" alt="U.S. Army Study Found No Foreign Link to Flying Saucer Reports in 1949 thumbnail" loading="lazy" />
  <p>This 1949 U.S. Army document set consists of internal memoranda and routing slips showing that the Intelligence Division evaluated flying saucer reports at the request of the Plans &amp; Operations Division and concluded none of the cases had any foreign nation connection. A separate follow-up was triggered when radio broadcaster Walter Winchell made public claims about flying saucers, prompting the Army to verify his statements.</p>
  <div class="narr">In February 1949, the U.S. Army received multiple incoming communications (known internally as CMIN Radios) concerning flying saucer sightings. On 24 February 1949, the Plans &amp; Operations Division (P&amp;O) of the General Staff asked the Intelligence Division (ID) to evaluate these reports and determine whether they stemmed from natural phenomena or the activities of a foreign power.

The Intelligence Division completed its evaluation and forwarded it to P&amp;O on 7 March 1949. The study&#39;s stated conclusion was direct: of all cases investigated, there was no foreign nation implication in the flying saucer reports.

A second round of activity followed shortly after. On 3 April 1949, the prominent radio columnist Walter Winchell broadcast claims about flying saucers. P&amp;O then sent a request to the Intelligence Division asking them to verify the accuracy of Winchell&#39;s on-air statements. The Intelligence Division responded with a formal comment addressing the broadcast&#39;s claims.

The documents themselves are administrative in nature — routing slips, memoranda, and cover sheets involving officers including Lt Col Peisinger, Lt Col Dawley, Col Goodell, and Maj J. S. Byrne. The actual evaluation study is referenced as an attachment but its full content is not included in what survives in this release. What we have are the bureaucratic records surrounding the study, not the study itself.</div>
