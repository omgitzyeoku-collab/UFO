  <h1>Navy pilot&#39;s 2020 debrief reports small reflective object over Eastern US</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2020</span>
    <span class="badge">Eastern United States</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/3ad2058e00a44e2bb5453648be0eac0dd1a2ff40deeeb2707a19cc59b11ee685.jpg" alt="Navy pilot&#39;s 2020 debrief reports small reflective object over Eastern US thumbnail" loading="lazy" />
  <p>This is a U.S. Navy Range Fouler Debrief — a standardised form used to report an unauthorised object intruding into controlled military airspace, filed by an aircrew member. In it, a Navy pilot describes an object that appeared quite small, moved in a constant direction, and had an indistinguishable shape with a reflective, metallic underside. The Department of the Navy released the form in part on 19 May 2026, but heavy redactions leave key details — date, time, exact location, and speed — blank or withheld.</p>
  <div class="narr">The document is a U.S. Navy &#39;Range Fouler Debrief&#39; form. A range fouler is an unauthorised object that intrudes into controlled military airspace; the form is a standardised report an aircrew member fills in to document such an intrusion. This one is catalogued as DOW-UAP-D089 and is associated with an incident in the Eastern United States in 2020.,The person who filed it was a pilot holding the rank O-4 (a mid-level commissioned officer). In the narrative, the pilot describes the object as appearing quite small and continuing to move in a constant direction. The pilot wrote that the object&#39;s shape was indiscernible but that its bottom was reflective, and ticked checkboxes indicating the object was metallic and reflective.,The form accompanies a separate video (catalogued DOW-UAP-PR106), which is not part of this text. That means the written descriptions here cannot be checked against the footage within this document alone.,The Department of the Navy released the form in part on 19 May 2026, under authority cited on the document as the Department of the Navy DUSN (M) DRMD, drawing on the FY24 National Defense Authorization Act (NDAA), now codified at 44 U.S.C. 2107. &#39;Released in Part&#39; means portions were withheld.,The redactions are heavy. Key data fields — including the specific date, time, location, speed, aircraft side number, bureau number (Buno), and working area — are blank or withheld, and header and footer classification markings are obscured. Identifying details for the aircrew and their squadron were deliberately removed. The narrative itself is fragmentary and in places garbled by the scanning/text-conversion process (for example, &#39;reflective&#39; appears as &#39;refilective&#39;). The document records no agency conclusion about what the object was.</div>
