  <h1>Marine Corps F-35 Pilot Reported Unidentified Object Over New Mexico</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ec03ff0d83f1eb647e3ea09d62759eefa2bd7b501bfc7c501a69b69f45bf4f8b.jpg" alt="Marine Corps F-35 Pilot Reported Unidentified Object Over New Mexico thumbnail" loading="lazy" />
  <p>This FAA incident notification records a US Marine Corps F-35 pilot reporting an unidentified aerial phenomenon while flying at 28,000 feet over southern New Mexico on 15 February 2023. The report contains no description of the object and no investigation conclusions — it is a bare notification, not a case file.</p>
  <div class="narr">On 15 February 2023, a US Marine Corps F-35 pilot flying under the callsign HSTLR91 reported an unidentified aerial phenomenon to air traffic control. The pilot was heading west-northwest at 28,000 feet, roughly 60 nautical miles west-northwest of El Paso, Texas — placing the aircraft over southern New Mexico. The object was observed at the pilot&#39;s 10 o&#39;clock position, meaning to the front-left of the aircraft.

The sighting was relayed by Albuquerque Air Route Traffic Control Center (ARTCC) to FAA Operations in Washington. According to the report, the pilot took no evasive action and no law enforcement was notified. The filing is marked as a late report, meaning it was not submitted in real time.

Notably, the document provides no description of what the pilot saw — no size, shape, colour, movement, or behaviour of the object is recorded. It is strictly a notification that a sighting occurred. No radar data or additional witnesses are mentioned, and there is no investigation conclusion or follow-up referenced in the document.

The coordinates logged in the report (32.03°N, 107.36°W) are consistent with the stated location of 60 nautical miles west-northwest of El Paso, placing the incident in the desert region of southern New Mexico.</div>
