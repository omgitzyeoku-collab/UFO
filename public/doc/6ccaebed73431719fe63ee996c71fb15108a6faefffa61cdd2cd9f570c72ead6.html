  <h1>UPS Cargo Pilot Reported Unidentified Object Over Provo, Utah</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/6ccaebed73431719fe63ee996c71fb15108a6faefffa61cdd2cd9f570c72ead6.jpg" alt="UPS Cargo Pilot Reported Unidentified Object Over Provo, Utah thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of UPS flight 598 on 22 February 2023, in which a pilot reported seeing what appeared to be afterburners making multi-directional lateral movements above their aircraft near Provo, Utah. Air traffic control did not detect anything on radar, and no follow-up investigation is documented.</p>
  <div class="narr">On 22 February 2023 at 3:40 a.m. Mountain Standard Time, the crew of UPS flight 598 — a Boeing 757-200 flying from Ontario, California to Billings, Montana — reported an unidentified aerial phenomenon near Provo, Utah. The sighting was logged by the FAA&#39;s Washington Operations Center as record 237UAP00483.

The pilot described seeing what appeared to be afterburners making lateral movements from above the aircraft. The object seemed to move in all directions but was not circling. Air traffic control (ATC) confirmed they did not have the object on radar.

The report is brief and preliminary. The FAA record states that no additional information was provided beyond this initial account. There is no documented follow-up investigation, no radar data corroborating the sighting, and no conclusion about what the pilot observed.

The document itself shows minimal redaction. It is a short operational log entry rather than a detailed investigative file. The reference number WOC 7-3333 JB/JG identifies the specific Washington Operations Center log entry.</div>
