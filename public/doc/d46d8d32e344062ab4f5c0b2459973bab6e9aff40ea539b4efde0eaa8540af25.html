  <h1>FBI File Links 1947 Muroc Disc Sightings and Maury Island Hoax</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d46d8d32e344062ab4f5c0b2459973bab6e9aff40ea539b4efde0eaa8540af25.jpg" alt="FBI File Links 1947 Muroc Disc Sightings and Maury Island Hoax thumbnail" loading="lazy" />
  <p>This 1947 FBI file contains two distinct threads: sworn statements from military personnel at Muroc Army Air Field, California, describing unidentified silver disc-like objects, and a detailed FBI account of the Maury Island incident near Tacoma, Washington — a flying disc story later admitted to be a hoax, connected to a fatal B-25 crash that killed two Army Intelligence officers.</p>
  <div class="narr">On 26 August 1947, the FBI&#39;s San Francisco office sent a memo to the Director of the FBI forwarding reports received from a Lieutenant Colonel in Army Air Force intelligence at Hamilton Field, California. The reports covered an investigation into flying disc sightings at Muroc Flight Test Base (now Edwards Air Force Base) and a separate sighting near Placerville, California on 14 August 1947.

The Muroc portion of the file contains multiple sworn witness statements taken by CIC (Counter Intelligence Corps) Agent Thomas A. McMillan from military personnel stationed at the base. Witnesses described silver, disc-like or spherical objects at altitudes between 8,000 and 15,000 feet, some travelling at estimated speeds of 200–400 mph. One witness reported a yellowish-white sphere roughly 5 to 10 feet across, oscillating without losing altitude. Several witnesses stated the objects could not have been weather balloons, birds, or any known aircraft, citing tight circular flight patterns and sustained altitude.

The second thread in this file is the FBI&#39;s summary of the Maury Island incident. A man claimed to have seen six flying discs near Maury Island, Washington, one of which allegedly disintegrated and showered his boat with fragments, killing his dog. Two Army Intelligence officers — Captain Davidson and Lieutenant Brown — flew a B-25 to investigate, loading alleged disc fragments on board. On 1 August 1947, the B-25 crashed near Kelso, Washington at approximately 2:50 a.m., killing both officers. The crash was attributed to mechanical failure: a burned exhaust stack ignited the left wing, which broke off and tore away the tail. Army investigators found no indication of sabotage.

The Maury Island story was ultimately admitted to be a hoax by its originators. The FBI suspected that anonymous phone calls to a Tacoma newspaper — five between 31 July and 2 August 1947 — were made to inflate the story for a profitable magazine sale. Notably, one caller knew the names of the dead officers before the Army had released them publicly. The file is heavily redacted throughout: most witness names are blacked out, and key individuals in the Maury Island affair are obscured, making independent verification difficult from this document alone.</div>
