  <h1>Pilot Reports Falling Fireball Near Jacksonville, Radar Shows Nothing</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ba877346c535e64a06e9b3adc0151c940c5047b3e110e924e49cec2b0e0e4585.jpg" alt="Pilot Reports Falling Fireball Near Jacksonville, Radar Shows Nothing thumbnail" loading="lazy" />
  <p>This is an FAA incident report documenting a general aviation pilot&#39;s sighting of a fireball-like object falling near Jacksonville, Florida on 5 February 2024. The object was not picked up on air traffic control radar, and the case was closed without identifying what the pilot saw.</p>
  <div class="narr">This document is a SKYWATCH Incident Report filed by the Federal Aviation Administration (FAA), classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot; It records an event reported by the pilot of a Cessna 421, flying under the callsign N421CF.

On 5 February 2024, the pilot was heading northbound at flight level 230 (approximately 23,000 feet) when they spotted something off the right side of the aircraft, roughly 20 nautical miles northeast of Jacksonville. The pilot described it as a fireball that appeared to be falling.

Air traffic control checked their radar systems but found nothing — the object was not detected on any ATC facility radar. The FAA notified AWO (Aviation Weather Operations) and JSEN (a security notification channel) about the sighting.

The case is marked as closed. The report contains no conclusion about what the object was — no identification, no follow-up findings, and no determination of cause. It remains a single pilot&#39;s visual observation with no corroborating data.

There is little evidence of redaction in this document. What is notable is the absence of resolution: the FAA recorded the report, notified the relevant parties, and closed the file.</div>
