  <h1>Commercial Aircraft Reported UAP on Both Sides Near Huntsville</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/789b4ce538835429c9ba4b1bccd63d6698b2eda118ab46ce0cae8eff1d7ae0b7.jpg" alt="Commercial Aircraft Reported UAP on Both Sides Near Huntsville thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH report documents a June 2021 incident in which a commercial aircraft (callsign CTL357) flying the Birmingham-to-Nashville route at 9,000 feet reported an unidentified aerial phenomenon visible from both the left and right sides of the aircraft, approximately 10 nautical miles east of Huntsville, Alabama. The crew deviated one nautical mile north in response. The case is closed.</p>
  <div class="narr">On 19 June 2021 at 04:09 UTC, an FAA SKYWATCH incident report was filed under record 237UAP00057. The report documents a commercial aircraft, callsign CTL357 (aircraft type AC50), encountering an unidentified aerial phenomenon while flying northbound at 9,000 feet, roughly 10 nautical miles east of Huntsville, Alabama (HSV). The aircraft was on the Birmingham (BHM) to Nashville (BNA) route.

The crew reported observing the phenomenon from both the left and right sides of the aircraft. In response, the aircraft deviated one nautical mile to the north. No further details about the object&#39;s appearance, size, speed, or behaviour are included in the report. The document does not indicate whether radar or any other sensor data corroborated the crew&#39;s observation.

The FAA classified the primary code as &quot;Unidentified Aerial Phenomenon&quot; and marked the case as closed. The tail number field is blank, which limits the ability to independently verify which specific aircraft was involved. No new destination is listed, suggesting the flight continued to Nashville after the deviation.

The report is sparse. It confirms something was observed by the flight crew but provides almost no descriptive detail about what they saw. There is no indication the FAA reached a conclusion about what the phenomenon was.</div>
