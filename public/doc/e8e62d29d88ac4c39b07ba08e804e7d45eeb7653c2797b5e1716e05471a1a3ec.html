  <h1>FBI-UAP-D011, D/FBI Correspondence Referral, 1949</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/e8e62d29d88ac4c39b07ba08e804e7d45eeb7653c2797b5e1716e05471a1a3ec.jpg" alt="FBI-UAP-D011, D/FBI Correspondence Referral, 1949 thumbnail" loading="lazy" />
  <p>This collection of documents contains correspondence between the Director of the Federal Bureau of Investigation (FBI), J. Edgar Hoover, and Rev. Charles Barnes concerning Barnes’ account of an incident potentially involving unidentified anomalous phenomena (UAP). Rev. Barnes described observing four beams of light “converging in the Cascade Mountains,” at an altitude of approximately 10,000 feet, with a “great explosion” visible at the convergence point of those beams for at least ten minutes. Director Hoover replied to Rev. Barnes thanking him for his letter and informing him that he had forwarded it to the Atomic Energy Commission (AEC). Director Hoover conveyed to the AEC that Rev. Barnes believed that the event may relate to a military or scientific experiment within the commission’s purview.</p>
