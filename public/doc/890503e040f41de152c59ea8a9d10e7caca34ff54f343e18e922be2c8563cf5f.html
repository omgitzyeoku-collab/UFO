  <h1>Air Force F-35 Pilot Reported UAP Near Luke Base in Arizona</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/890503e040f41de152c59ea8a9d10e7caca34ff54f343e18e922be2c8563cf5f.jpg" alt="Air Force F-35 Pilot Reported UAP Near Luke Base in Arizona thumbnail" loading="lazy" />
  <p>This is an FAA Washington Operations Center notification from March 8, 2023, recording that a US Air Force F-35 pilot observed an unidentified anomalous phenomenon (UAP) while flying near Luke Air Force Base in Arizona. The document is a brief incident alert — not an investigation — and contains no description of the object or any conclusions about what it was.</p>
  <div class="narr">On March 8, 2023, a US Air Force F-35 fighter jet pilot reported seeing a UAP while flying southbound at approximately 19,000 feet, about 65 nautical miles west of Luke Air Force Base in Arizona. The sighting was logged by the FAA&#39;s Washington Operations Center as an incident notification.

The Albuquerque Air Route Traffic Control Center (ARTCC) — the FAA facility managing high-altitude airspace in the region — advised the Air Force unit designated USAF SWROD2 about the incident. The La Paz County Sheriff&#39;s office was also notified. According to the document, no evasive action was reported by the pilot.

The document provides coordinates placing the incident in a remote area of western Arizona, consistent with airspace west of Luke AFB. Beyond these operational details, the notification contains no description of what the pilot saw — no size, shape, speed, or behaviour of the object is recorded.

This is a preliminary notification only. The FAA did not include any follow-up investigation, analysis, or conclusions in this document. It exists as a record that the sighting occurred and that the relevant authorities were informed.</div>
