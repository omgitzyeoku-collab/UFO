  <h1>Pilot Reports Unidentified Aerial Phenomenon Over Northern Alabama</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d754c7c0106a16e60feb4d43c631b092dae9e28644859d6ad14eb570e9da0896.jpg" alt="Pilot Reports Unidentified Aerial Phenomenon Over Northern Alabama thumbnail" loading="lazy" />
  <p>An FAA operations center notification documents a pilot sighting of an unidentified aerial phenomenon near Hartselle, Alabama on 28 December 2023. The pilot, flying a Beechcraft BE9L at 16,000 feet, observed something to the left of the aircraft but took no evasive action. The document is a preliminary notification, not a full investigation.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — essentially a short internal report logging that something unusual was reported by a pilot. It is not an investigation report, and it draws no conclusions about what the pilot saw.

On 28 December 2023, the pilot of a Beechcraft BE9L (registration N268CA) reported an unidentified aerial phenomenon while flying southeast at 16,000 feet. The sighting occurred approximately 5.4 nautical miles northwest of Hartselle, Alabama, and was relayed through Memphis ARTCC (Air Route Traffic Control Center), the regional air traffic control facility responsible for that airspace.

The pilot observed the phenomenon from the left side of the aircraft. No evasive action was taken, and no law enforcement notification was reported. The document provides no description of what the pilot saw — no details on the object&#39;s appearance, size, behaviour, or how long it was visible.

The record contains no indication of corroborating radar data, additional witnesses, or any follow-up investigation. It is a single-source preliminary notification, the kind of form filed when an incident is first reported up the FAA chain. Whether any further inquiry took place is not covered by this document.</div>
