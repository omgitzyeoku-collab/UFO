  <h1>FBI Document Records Intelligence Official&#39;s Account of Multiple Orb Encounters</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">Late 2025</span>
    <span class="badge">United States</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/63deae172b2bd4923696ed097c0c25d1286f116be1efb313d14c0630ac0a1786.jpg" alt="FBI Document Records Intelligence Official&#39;s Account of Multiple Orb Encounters thumbnail" loading="lazy" />
  <p>A SECRET//NOFORN FBI interview summary describes a senior US intelligence official&#39;s first-hand account of encountering numerous unidentified orbs during a helicopter search mission at a US military facility in late 2025. The objects displayed behaviors including splitting apart, forming patterns, swarming, and outpacing a pursuing helicopter — but the document is so heavily redacted that names, dates, locations, and facility details are all blacked out.</p>
  <div class="narr">This document is an FBI 302 — a standard form agents use to summarize witness interviews — classified SECRET//NOFORN (secret, not releasable to foreign nationals). It records the statement of a senior US intelligence official identified only as &quot;WITNESS 1,&quot; describing events at an unnamed US military facility on a redacted date in 2025.

The encounter began around 5:00 PM when WITNESS 1 and a helicopter crew launched a daytime search of a nearby mountain range. The mission was prompted by earlier reports from personnel who had seen orbs or lights and heard unexplained thuds &quot;as if something had fallen and hit the ground.&quot; After dark, using Forward Looking Infrared (FLIR) sensors and Night Vision Goggles (NVG), a ground observation team detected what they described as a &quot;super-hot&quot; orb hovering at ground level. The orb then traveled east and south at high speed, split into two objects, and covered roughly 20 miles — fast enough that the helicopter broke off pursuit because it could not keep up. The ground team reported the orb came within ten feet of the helicopter. A co-pilot then observed, through NVG, a third object emerge from the two and fly off in a different direction.

Over the next hour, the witnesses reported repeated sightings: formations of four to six orbs flaring up one at a time in horizontal lines, then extinguishing in reverse order over 10 to 15 seconds. At 10:18 PM, they observed a &quot;swarm of lights too many to count&quot; moving in all directions. At 10:49 PM, three distinct orbs appeared in a triangle formation within a larger swarm. The orbs were described as oval-shaped, orange with a white or yellow center, emitting light in all directions. At 10:57 PM, four orbs appeared directly over military aircraft as they descended to land — the witness stated the orbs appeared to break off from the helicopter and pursue those aircraft. Five military aircraft were confirmed to be conducting a training exercise in the same airspace. The helicopter returned to base around 11:16 PM.

The document does not contain any agency conclusion about what the orbs were. It is a record of one person&#39;s account. Nearly every identifying detail — names, specific dates, facility names, coordinates, organizational affiliations, and call signs — has been redacted, making independent verification of the events impossible.</div>
