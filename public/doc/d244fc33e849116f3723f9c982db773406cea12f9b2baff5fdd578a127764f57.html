  <h1>Two Airline Crews Reported Unidentified Object Near Eugene, Oregon</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d244fc33e849116f3723f9c982db773406cea12f9b2baff5fdd578a127764f57.jpg" alt="Two Airline Crews Reported Unidentified Object Near Eugene, Oregon thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH report documents a March 2022 incident in which two commercial aircraft crews, flying at different altitudes near Eugene, Oregon, independently reported seeing the same unidentified aerial phenomenon. After consulting NORAD and military agencies, officials concluded it was &quot;probably space debris&quot; — a qualified assessment, not a definitive identification.</p>
  <div class="narr">On 29 March 2022, two commercial flights — SkyWest flight SKW3944 at 30,000 feet and Horizon Air flight QXE2452 at 24,000 feet — were heading northbound near Eugene, Oregon (coordinates 44.22°N / 123.16°W). Both crews independently reported an unidentified aerial phenomenon off the left side of their aircraft.

The FAA&#39;s headquarters in Denver contacted NORAD&#39;s FAA Air Traffic Security Coordination Staff (ATSCS), who in turn consulted with meteorological specialists (METOC), missile defence staff (MSD), and the Combined Space Operations Center (CSPOC). Based on the pilots&#39; verbal descriptions, these agencies concluded the object was &quot;probably space debris.&quot;

The case is now closed. The report is a single page with minimal detail — the full pilot descriptions that informed the space-debris conclusion are not included in the document. No sensor data, photographs, or physical evidence are referenced.

Notably, the word &quot;probably&quot; qualifies the conclusion. The assessment was based on pilot descriptions relayed through intermediaries, not on direct instrumental evidence. No pilot names appear in the report, and an individual identified only by the initials &quot;JH&quot; is noted as having been notified, with no further explanation of their role.</div>
