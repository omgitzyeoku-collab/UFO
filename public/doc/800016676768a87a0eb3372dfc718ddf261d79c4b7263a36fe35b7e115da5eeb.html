  <h1>Civilian Pilot Reports Silver Object Below Aircraft Near Maryland Naval Station</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/800016676768a87a0eb3372dfc718ddf261d79c4b7263a36fe35b7e115da5eeb.jpg" alt="Civilian Pilot Reports Silver Object Below Aircraft Near Maryland Naval Station thumbnail" loading="lazy" />
  <p>This FAA Washington Operations Center notification documents a civilian pilot&#39;s report of a silver unidentified anomalous phenomenon (UAP) spotted 500 feet below their aircraft near Patuxent River Naval Air Station, Maryland, on August 31, 2023. No evasive action was taken, no law enforcement was notified, and no investigation conclusions are included — this is a preliminary incident notification, not a completed inquiry.</p>
  <div class="narr">On the evening of August 31, 2023, the FAA&#39;s Washington Operations Center logged an incident notification about a UAP sighting. The pilot of a Cirrus SR22 light aircraft (tail number N715JP), flying southbound at 7,000 feet on a route from Belmar/Farmingdale, New Jersey to Myrtle Beach, South Carolina, reported seeing a silver unidentified object roughly 500 feet below the aircraft.

The sighting occurred in the vicinity of Patuxent River Naval Air Station (NHK) in Maryland — a location notable for its proximity to restricted military airspace. Patuxent River air traffic control was advised of the report. The pilot did not take evasive action, and no law enforcement notification was made.

The document itself is brief and administrative in nature. It is a standard FAA operations center notification — essentially a log entry recording that a pilot reported something unusual. It does not contain any analysis, follow-up investigation, radar data, or conclusions about what the object was. There is minimal redaction.

The coordinates recorded in the report (approximately 38.29°N, 76.41°W) place the sighting over southern Maryland&#39;s Chesapeake Bay region. The report was logged at 9:55 PM EDT, with the sighting itself occurring at approximately 8:04 PM EDT.

No additional witnesses, corroborating sensor data, or follow-up findings are mentioned in this document.</div>
