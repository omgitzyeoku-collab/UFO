  <h1>Commercial Pilot Reports Red Streaking Lights Below Aircraft Over Southeast US</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/d719c2f390ef8635bfe713be4ba81c6ed19693edb1c6ea087e2bd8840240623c.jpg" alt="Commercial Pilot Reports Red Streaking Lights Below Aircraft Over Southeast US thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a commercial pilot flying at 37,000 feet who observed two bright red streaking lights below the aircraft on 21 January 2024. A second aircraft at 45,000 feet independently reported the same phenomenon, but air traffic control radar detected nothing. The case is closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log pilot observations of unidentified aerial phenomena (UAP). It was filed under case number 237UAP00342 and references MOR (Mandatory Occurrence Report) ID ZJX-M-2024/01/20-0007, placing the event within the Jacksonville Air Route Traffic Control Center&#39;s jurisdiction.

At 02:45 on 21 January 2024, a commercial aircraft with callsign MXY505, flying northbound at flight level 370 (37,000 feet), reported two red streaking lights below them. The lights were described as bright, lasting roughly 15 to 20 seconds before disappearing. The pilot stated they observed the phenomenon continuously from the Tampa area to the Savannah area — a stretch of roughly 200 nautical miles along the southeast US coast.

A second aircraft, registration N157PH (a Bombardier CL35 business jet at 45,000 feet), independently reported the same observation. Despite two separate pilot reports, the UAP was not detected on the air traffic control facility&#39;s radar system. FAA headquarters (DEN) contacted the Eastern Regional Operations Center at 20:02 in connection with the report.

The case is marked Closed. No resolution, identification, or explanation is recorded in the document. There is minimal evidence of redaction in this particular record.</div>
