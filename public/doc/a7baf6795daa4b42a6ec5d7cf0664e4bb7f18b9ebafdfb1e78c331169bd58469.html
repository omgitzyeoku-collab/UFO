  <h1>DOW-UAP-D017, UAP Reported at Sandia Base, 1948-1950</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">1948-1950</span>
    <span class="badge">New Mexico</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/a7baf6795daa4b42a6ec5d7cf0664e4bb7f18b9ebafdfb1e78c331169bd58469.jpg" alt="DOW-UAP-D017, UAP Reported at Sandia Base, 1948-1950 thumbnail" loading="lazy" />
  <p>This file contains 116 pages of documentation from the Armed Forces Special Weapons Program (AFSWP) – the direct, post-World War II successor to the Manhattan Project – and from the U.S. Air Force – relating to a series of sightings and investigations in Sandia, New Mexico, from 1948-1950. This file contains 209 sightings of “green orbs,” “discs,” and “fireballs” reported near the military base. Witnesses reported unidentified anomalous phenomena (UAP) maneuvering, flying out of sight, disappearing, or exploding. The documents also include the results of contemporary investigations into residual copper powder found in some areas where sightings were reported. A few of these investigations became the basis for Project Grudge, which collected reports of unidentified flying objects from various other military installations – also included in this collection.</p>
