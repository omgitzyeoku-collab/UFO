  <h1>Pilot Reports Three White Lights at 41,000 Feet on Houston-JFK Flight</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/597a58f72cfa79b4ef028541f5d0f14b38f13818bea3c56d866310f36226a493.jpg" alt="Pilot Reports Three White Lights at 41,000 Feet on Houston-JFK Flight thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a pilot sighting of three white lights in trail formation while flying at 41,000 feet on a Houston-to-JFK route on 15 September 2024. The lights were not detected on air traffic control radar, and the case was closed without identification.</p>
  <div class="narr">This is an FAA SKYWATCH incident report (record 237UAP00378) documenting an unidentified aerial phenomenon observed by the crew of flight EJA538 on 15 September 2024 at 07:15 UTC. The aircraft was travelling northeast from Houston (HOU) to New York&#39;s JFK airport at flight level 410 — roughly 41,000 feet — when the crew reported the sighting.

The pilot described three white lights arranged in trail formation at a slightly higher altitude, visible in the distance. The aircraft was approximately 50 nautical miles east of the VXV navigational fix at the time. The report was logged under MOR ID ZTL-M-2024/09/15-0001, indicating it was processed through the Atlanta Air Route Traffic Control Centre (ZTL).

Critically, the phenomenon was not detected on the ATC facility&#39;s radar system, meaning the only evidence is the pilot&#39;s visual observation. The FAA closed the case without recording any identification or resolution of what the lights were.

The document carries minimal redaction. It is a straightforward single-page incident log rather than an investigative file — it records what was reported but does not attempt to explain it.</div>
