  <h1>United Airlines Crew Reported Bright Lights Above Their Jet Over Iowa</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/e8f6926bc4eb1aa5cb2a7a5d4484d4990da74388a607c0e091fc1ff5042fd10c.jpg" alt="United Airlines Crew Reported Bright Lights Above Their Jet Over Iowa thumbnail" loading="lazy" />
  <p>This FAA incident notification records that the crew of United Airlines flight 1046 saw bright lights roughly 4,000 feet above their Boeing 737-800 while flying at 36,000 feet near Sioux City, Iowa, on 2 February 2023. The document is a preliminary operational log, not an investigation finding, and includes no radar data or explanation of what the lights were.</p>
  <div class="narr">On the evening of 2 February 2023, at 9:56 PM Central time, the flight crew of United Airlines flight 1046 — a Boeing 737-800 travelling from Chicago O&#39;Hare to Seattle — reported seeing bright lights approximately 4,000 feet above their aircraft. The plane was cruising westbound at flight level 360 (36,000 feet), placing the lights at roughly 40,000 feet. The sighting occurred 27 nautical miles east-northeast of Sioux City, Iowa.

The crew did not take evasive action, and no law enforcement agency was notified. The report was relayed through Minneapolis Air Route Traffic Control Center (ARTCC) to the FAA Washington Operations Center, which logged it as a UFO/UAP incident notification.

The document itself is a standard FAA operational notification — essentially a log entry, not an investigation report. It records what the crew said they saw and the basic flight details, but offers no analysis, no radar corroboration, and no conclusion about what the lights were. No description of the object&#39;s shape, movement, or how long it was visible appears in the record.

There is minimal redaction in this document. The sparse detail reflects the nature of the form rather than deliberate withholding — these notifications capture the initial report and nothing more.</div>
