  <h1>Pentagon Releases Infrared Video of Unidentified Object Over Persian Gulf</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2020</span>
    <span class="badge">CENTCOM</span>
    <span class="badge">verified</span>
  </div>
  
  <p>This is a roughly five-minute infrared video from August 2020, assessed by AARO to have been captured by a U.S. military sensor platform in the Persian Gulf region. Most of the footage is blank, and the video lacks a verified chain of custody, meaning its origin cannot be fully confirmed.</p>
  <div class="narr">In August 2020, someone uploaded a video to a classified U.S. military network showing what was described as a UAP — an unidentified anomalous phenomenon — observed in the Persian Gulf. The video is catalogued as DOW-UAP-PR091 and runs four minutes and 48 seconds, though the first three minutes and seven seconds contain no content at all.

The All-domain Anomaly Resolution Office (AARO), the Pentagon body responsible for investigating UAP reports, assessed that the footage was likely captured by an infrared sensor aboard a U.S. military platform operating within the CENTCOM (United States Central Command) area of responsibility. In the portion of the video that does contain imagery, an area of contrast moves from the top of the frame to the bottom before exiting the screen. The military callsign in the title has been redacted, so the specific unit or aircraft involved is unknown.

This video was among materials released after eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records on 6 March 2026. AARO has not publicly identified what the object in the video is.

Notably, AARO flags that many of the released materials — including this one — lack a substantiated chain of custody. That means the handling history of the video from capture to upload cannot be independently verified. AARO also uses hedged language throughout, describing the platform and sensor identification as an assessment rather than a confirmed fact.</div>
