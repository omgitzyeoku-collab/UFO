  <h1>Cargo Pilot Reports Metallic Object at 40,000 Feet Near Louisville</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/aaac082bbc8816132addb75fbfbd29147cb3269fcb966a7872497211d76c1b44.jpg" alt="Cargo Pilot Reports Metallic Object at 40,000 Feet Near Louisville thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Boeing 767 cargo crew&#39;s sighting of a metallic unidentified object at 40,000 feet, roughly 21 nautical miles southwest of Louisville, Kentucky on 19 September 2023. The pilot described the object only as &#39;metallic&#39; and could not identify it; the FAA closed the case without resolution.</p>
  <div class="narr">On 19 September 2023 at 23:01 UTC, the crew of a Boeing 767 cargo flight — callsign ATN3443, operated by Air Transport International — reported an unidentified aerial phenomenon to the FAA. The aircraft was flying northwest-bound at 40,000 feet, approximately 21 nautical miles southwest of Louisville&#39;s SDF airport, en route from Lakeland, Florida to Rockford, Illinois.

The pilot-in-command described the object as metallic but provided no further detail and was unable to identify what it was. Because the flight was a cargo operation, there were no passengers aboard who might have offered additional witness accounts.

The FAA logged the event under its SKYWATCH programme and assigned the primary code &#39;Unidentified Aerial Phenomenon.&#39; The case is now marked as closed. The report contains no mention of corroborating radar data, sensor readings, or follow-up investigation, and no resolution or identification of the object is noted.

The document shows minimal redaction. What limits its evidentiary value is not what was hidden but what was never captured: a single pilot&#39;s brief visual impression, with no instrument data to support or challenge it.</div>
