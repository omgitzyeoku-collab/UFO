  <h1>Pilot Reports Erratic White Lights at 39,000 Feet Over South Carolina</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/4124b424720b5c1e28268fccb5c954d4afe497e34dd050b6d34e28bac1ced268.jpg" alt="Pilot Reports Erratic White Lights at 39,000 Feet Over South Carolina thumbnail" loading="lazy" />
  <p>An FAA incident report from August 2023 documents a commercial pilot observing an unorganised group of white lights moving erratically near their altitude while flying from Florida to New Jersey. The report contains no follow-up investigation, no radar corroboration, and no explanation for what was observed.</p>
  <div class="narr">On 28 August 2023, the pilot of an Embraer E35L business jet (registration N224LD) flying from Opa-locka, Florida, to Teterboro, New Jersey, reported an unidentified aerial phenomenon to Jacksonville Air Route Traffic Control Centre (ARTCC). The aircraft was heading north at flight level 390 — roughly 39,000 feet.

The pilot described seeing an unorganised group of white lights on the left side of the aircraft, moving erratically between flight levels 390 and 410 (approximately 39,000 to 41,000 feet). The sighting occurred in the vicinity of Florence, South Carolina. No evasive action was taken, and no law enforcement was notified.

The document is a standard FAA Washington Operations Center incident report — a preliminary record of what a pilot called in, not an investigation. It contains no radar data, no additional witness accounts, and no follow-up analysis. The FAA recorded the report and that appears to be where this particular record ends.

There is little evidence of redaction in this document. What it lacks is not hidden — it simply was never gathered. This is a single pilot&#39;s visual observation at night, logged through routine FAA channels.</div>
