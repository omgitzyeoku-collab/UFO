  <h1>Oak Ridge Lab Found UAP-Linked Metal Specimen Is Ordinary Aluminum Alloy</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/539cccf897f3d9aa9fa8bec59bd9caa46c503d462aa4e4e3dea509c192ea450f.jpg" alt="Oak Ridge Lab Found UAP-Linked Metal Specimen Is Ordinary Aluminum Alloy thumbnail" loading="lazy" />
  <p>Oak Ridge National Laboratory analyzed a metallic specimen claimed to be connected to a UAP event over central Ohio in the mid-1990s. Using multiple chemical and radiological techniques, the lab concluded the material is a conventional aluminum-silicon casting alloy matching standard industrial grades, with no anomalous properties detected.</p>
  <div class="narr">The All-Domain Anomaly Resolution Office (AARO) commissioned Oak Ridge National Laboratory (ORNL) to examine a metallic specimen said to be associated with an unidentified aerial phenomenon over central Ohio in or around 1995. ORNL received three bags of drill shavings and one small bulk piece of the material for testing. The shavings had been created by a prior custodian before AARO acquired the specimen.

ORNL subjected the samples to chemical assays, microscopy, x-ray spectroscopy, and gamma spectroscopy, using multiple independent methods calibrated against recognized standards to reduce the chance of systematic error. The results showed the material is roughly 86% aluminum and 12% silicon by weight, with minor amounts of iron, copper, magnesium, zinc, and manganese. The shavings and the bulk sample had identical chemistry across all elements measured.

The lab identified the specimen as a conventional near-eutectic aluminum-silicon alloy that closely — though not perfectly — matches American Society for Testing and Materials (ASTM) designations A413.1 and 369.1. This type of alloy has been widely produced since at least the late 1970s and is commonly used in cast housings, brackets, pump bodies, and gear cases. The microstructure indicated slow cooling in a mold, consistent with standard industrial casting.

Gamma spectroscopy monitored three of the samples for approximately two days and detected no abnormal emissions — the readings were indistinguishable from background radiation. ORNL&#39;s overall conclusion was direct: nothing in the data suggests novel physics or exotic origin. The material is an ordinary aluminum alloy made for common applications.</div>
