  <h1>Delta crew reported unidentified object ahead at 32,000 feet over Arkansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/752fac82172cbfb2b05945f53f5db5d223a0205d256b30185225c0470e2aa56f.jpg" alt="Delta crew reported unidentified object ahead at 32,000 feet over Arkansas thumbnail" loading="lazy" />
  <p>An FAA preliminary report documents that the crew of Delta Air Lines flight 2784, a Boeing 717-200 flying from Atlanta to Oklahoma City, observed an unidentified aerial phenomenon directly ahead of their aircraft at 32,000 feet near Fort Smith, Arkansas on 19 January 2024. The report contains no description of the object and no investigation findings.</p>
  <div class="narr">This document is a preliminary information report from the FAA&#39;s Washington Operations Center. It records a sighting reported by the crew of Delta Air Lines flight 2784, a Boeing 717-200 operating from Atlanta to Oklahoma City, on 19 January 2024.

According to the report, the crew observed an unidentified aerial phenomenon at the 12 o&#39;clock position — directly ahead of the aircraft — while flying westbound at flight level 320, approximately 32,000 feet. The aircraft was about 40 nautical miles southeast of Fort Smith, Arkansas, at coordinates 34.93°N, 93.87°W. The crew did not take evasive action, and no law enforcement notification was made.

The report was filed as a late report through Memphis Air Route Traffic Control Center (ARTCC) at 2050 Central time, meaning the sighting was not reported to air traffic control in real time. The document provides no description of what the object looked like, how it moved, or how long the crew observed it.

This is a preliminary filing only. It contains no follow-up investigation, no conclusions about what the crew saw, and no corroboration from radar data, other aircraft, or ground observers. The FAA reference number is WOC 73333.</div>
