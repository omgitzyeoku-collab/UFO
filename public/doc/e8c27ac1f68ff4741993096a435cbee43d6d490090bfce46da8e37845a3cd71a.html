  <h1>Pentagon UAP Office Told Senate It Tracked 650 Cases, Found No Alien Evidence</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e8c27ac1f68ff4741993096a435cbee43d6d490090bfce46da8e37845a3cd71a.jpg" alt="Pentagon UAP Office Told Senate It Tracked 650 Cases, Found No Alien Evidence thumbnail" loading="lazy" />
  <p>This is the transcript of a US Senate hearing held on 19 April 2023, in which the director of the Pentagon&#39;s UAP investigation office testified that his team was tracking over 650 cases, that most reported objects were small spheres seen at high altitude, and that no credible evidence of extraterrestrial activity had been found. He showed two drone videos — one still unexplained, one resolved as a normal aircraft.</p>
  <div class="narr">On 19 April 2023, Dr Sean Kirkpatrick, director of the All-Domain Anomaly Resolution Office (AARO), appeared before a US Senate Armed Services subcommittee chaired by Senator Kirsten Gillibrand. AARO had been established in July 2022 and at the time of the hearing had a staff of more than three dozen experts. Kirkpatrick was there to brief lawmakers on what AARO had found so far.

He reported that AARO was tracking over 650 UAP cases in total. About half had been prioritised as genuinely anomalous or worth investigating further, with roughly 20 to 30 cases partway through detailed analysis. The typical reported object was 1 to 4 metres across, round or spherical (about 52% of reports), white or silver or metallic in appearance, seen at altitudes of 15,000 to 25,000 feet, moving at speeds from stationary up to Mach 2. Most showed no thermal exhaust, and sensor data — radar, radio, thermal — was intermittent.

Kirkpatrick presented two declassified videos captured by MQ-9 drones. The first, from the Middle East, showed a spherical object that remains unresolved. The second, from South Asia, initially looked anomalous but was identified as a commuter aircraft whose apparent propulsion trail was a sensor artifact. He stated plainly that AARO had found no credible evidence of extraterrestrial activity, off-world technology, or objects that defy known physics — though he qualified this with &quot;thus far&quot; and acknowledged data limitations.

A small number of cases — described as a single-digit percentage — showed advanced technical signatures with concerning indicators of a possible foreign connection. Kirkpatrick noted that China in particular was on par with or ahead of the US in some emerging technology areas. The hearing also touched on AARO&#39;s funding difficulties (it took a letter from 16 senators to secure temporary funding relief) and its need for additional legal authorities beyond its existing Title 10 mandate.

The document was reviewed for classification and released in full on 6 February 2025. There is minimal redaction — this is a largely complete record of the unclassified portion of the hearing.</div>
