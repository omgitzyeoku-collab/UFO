  <h1>FBI Files Show Saucer Reports, Hoaxes, and Dead Ends From 1947–1950</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0cb9d177601e0006a4cac0b94065f2e0dea51a3d6fb44361c8e56ac07d9f3825.jpg" alt="FBI Files Show Saucer Reports, Hoaxes, and Dead Ends From 1947–1950 thumbnail" loading="lazy" />
  <p>This batch of FBI records from 1947 to 1950 contains police eyewitness reports, citizen tips, an anonymous letter claiming Howard Hughes financed a secret flying craft, a filmed sighting, and a confirmed hoax — all met with form replies from Director Hoover&#39;s office. Heavy redactions and poor document quality obscure many details.</p>
  <div class="narr">This collection of FBI internal memos, citizen letters, and teletypes spans 1947 to 1950 and covers a range of flying disc and saucer reports from across the United States and Canada. The documents are heavily redacted, and many pages are so degraded that little coherent text can be recovered.

The most detailed report comes from Portland, Oregon, where two police officers on duty on September 11, 1947 observed a bright, silvery, round or elliptical object moving east to south over the city. One officer estimated its speed at about 150 miles per hour at roughly 5,000 feet altitude; the other believed it was travelling much faster than any conventional airplane. The sighting was covered by The Oregonian the next day and prompted an FBI memo to the Director on October 9, 1947.

Other reports in the file include a citizen letter from Port Allegany, Pennsylvania, relaying a third-hand claim that a Red Cross official said flying saucers originated from Spain; a Toronto farmer&#39;s account of watching a circling light above his property for 35 minutes on July 19, 1950, corroborated only by his houseman; and a Louisville photographer who shot 50 feet of 16mm film of a flying disc on June 27, 1950, which received national attention including a mention by columnist Walter Winchell. An elliptical disc found near Alice, Texas on July 4, 1950 — marked &quot;DO NOT TOUCH&quot; and bearing the designation &quot;X-ONE FOUR SEVEN A&quot; — was declared a hoax by the local police chief the same day.

Perhaps the most colourful item is an anonymous letter delivered to the Chicago FBI office on July 28, 1950, claiming that a radio-controlled craft called the &quot;Danse Macabre&quot; — described as a large fuel tank with crystal glass wings and two jet engines — had been financed by Howard Hughes and built by the Glen L. Martin Aircraft Company. The letter claimed a range of 4,000 miles, a speed of 750 mph, and said the craft was designed for one-way atomic bombing missions. The FBI found no one matching the letter-writer&#39;s alleged name and no corroboration. Throughout the file, Director J. Edgar Hoover&#39;s office sent standard replies to citizen correspondents, declining to share classified information and directing inquiries to the Department of the Air Force.</div>
