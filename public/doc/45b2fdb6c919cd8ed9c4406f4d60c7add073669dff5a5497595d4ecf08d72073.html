  <h1>1948 U.S. Air Force Report Documents Flying Saucer Sightings and Swedish Lake Crash</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">11/8/48</span>
    <span class="badge">Netherlands</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/45b2fdb6c919cd8ed9c4406f4d60c7add073669dff5a5497595d4ecf08d72073.jpg" alt="1948 U.S. Air Force Report Documents Flying Saucer Sightings and Swedish Lake Crash thumbnail" loading="lazy" />
  <p>A 1948 U.S. Air Force intelligence report describes recurring flying saucer sightings in Europe, including one that hovered over a military air base for thirty minutes. It also relays a Swedish Air Intelligence account of an unidentified object crashing into a lake, where navy divers found an unexplained crater on the lake floor.</p>
  <div class="narr">This document is a 1948 report from the Directorate of Intelligence at U.S. Air Force headquarters in the Pentagon. It was originally classified and later released under declassification authority NND 843014. The report addresses flying saucer sightings that U.S. Air Forces in Europe (USAFE) intelligence considered too numerous and widespread to ignore, stating they had been &quot;reported by so many sources and from such a variety of places&quot; that they could not be disregarded. One specific sighting involved an object hovering over Neubiberg Air Base for approximately thirty minutes.

The report recounts a visit by USAFE officers to the Swedish Air Intelligence Service, where the Swedes shared their own assessment. Swedish technical experts concluded that the phenomena were &quot;the result of a high technical skill which cannot be credited to any presently known culture on Earth.&quot; The USAFE Directorate noted it was &quot;inclined not to discredit entirely this somewhat spectacular&quot; theory — though it stopped short of endorsing it outright.

One incident described in the report involved a Swedish technical expert who observed an unidentified object crash or land in a lake near his home. Swedish intelligence considered his account credible enough to send a naval salvage team. Divers found a previously uncharted crater on the lake floor that did not appear on existing hydrographic charts. The document provides no further results from that salvage operation.

The final pages of the report shift to an unrelated intelligence topic: Soviet TU-2 aircraft from the 6th Regiment, which were fitted with INF type 5 radar and believed to be manufactured in a factory in Moscow. This section appears bundled into the same document but has no connection to the flying saucer discussion.

Large portions of the document — particularly pages one through four and parts of pages six and seven — are either heavily redacted or severely degraded, making them illegible.</div>
