  <h1>HondaJet Pilot Reports Two Unidentified Lights Above 38,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ba96bfeb3cfe1fd88140fe3fb020831f551f7785d9b38ec8e3415c6b1e1a545a.jpg" alt="HondaJet Pilot Reports Two Unidentified Lights Above 38,000 Feet thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents a December 2023 incident in which a HondaJet pilot flying from Nashville to Mobile observed two unidentified luminous objects at estimated altitudes of 48,000 and 58,000 feet, well above commercial traffic. The objects appeared as lights moving side to side ahead of the aircraft. No evasive action was taken and no investigation outcome is recorded.</p>
  <div class="narr">On 14 December 2023 at 4:53 PM Central time, the pilot of a Honda HondaJet (registration N90CW) filed a report with the FAA Washington Operations Center about two unidentified objects encountered during a flight from Nashville, Tennessee to Mobile, Alabama. The aircraft was flying southbound at approximately 38,000 feet near Muscle Shoals, Alabama (coordinates 34.74°N, 87.67°W) when the sighting occurred.

The pilot reported two objects appearing as lights at the 12 o&#39;clock position — directly ahead — moving side to side. The pilot-in-command estimated the objects were at flight level 480 and flight level 580, corresponding to roughly 48,000 and 58,000 feet. Both altitudes are well above standard commercial aviation ceilings. Memphis Air Route Traffic Control Center (ARTCC) was advised of the sighting.

The pilot took no evasive action and no law enforcement was notified. The document is a preliminary operations center log entry, not a completed investigation. There is no indication the FAA reached any conclusion about what the objects were.

The record shows low evidence of redaction, and the full text is brief — essentially a structured incident log rather than a detailed analytical report. No radar data, additional witnesses, or follow-up findings are mentioned in the document.</div>
