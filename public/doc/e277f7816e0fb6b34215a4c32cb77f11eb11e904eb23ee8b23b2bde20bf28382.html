  <h1>Three Southwest Airlines Crews Reported Triangular Lights West of Chicago</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/e277f7816e0fb6b34215a4c32cb77f11eb11e904eb23ee8b23b2bde20bf28382.jpg" alt="Three Southwest Airlines Crews Reported Triangular Lights West of Chicago thumbnail" loading="lazy" />
  <p>This FAA incident report documents a pilot on Southwest Airlines flight SWA1884 observing three bright lights in a triangular formation moving erratically west of Chicago on 24 October 2022. Two other Southwest crews independently reported the same phenomenon. The FAA classified it as an Unidentified Aerial Phenomenon and closed the case without providing an explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — an internal Federal Aviation Administration record used to log pilot observations of unusual aerial activity. It was filed under case number 237UAP00127 and classified with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On 24 October 2022, the crew of Southwest Airlines flight SWA1884, a Boeing 737-800 flying from Baltimore-Washington International (BWI) to Las Vegas (LAS), reported seeing three bright lights arranged in a triangular shape off the horizon west of Chicago, Illinois. The lights were described as moving erratically in all directions while dimming and brightening. The observation was made at night, at 02:57.

Two other Southwest Airlines flights — SWA1976 and SWA2316 — reported the same observation, providing a degree of corroboration. The FAA&#39;s Aviation Weather Office (AWO) was notified of the incident.

Despite three separate flight crews reporting the same phenomenon, the case is marked as closed. The document provides no explanation, resolution, or follow-up analysis. No radar data or sensor readings are mentioned — the record is based entirely on pilot visual observations.

The document contains minimal redaction. The tail number field for the reporting aircraft is blank, and some identifying details are absent, but the core narrative is intact and readable.</div>
