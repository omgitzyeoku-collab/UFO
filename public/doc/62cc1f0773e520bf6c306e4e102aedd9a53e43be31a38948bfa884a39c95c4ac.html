  <h1>Multiple Airline Crews Reported Bright Lights and Equipment Failures Over Central US</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/62cc1f0773e520bf6c306e4e102aedd9a53e43be31a38948bfa884a39c95c4ac.jpg" alt="Multiple Airline Crews Reported Bright Lights and Equipment Failures Over Central US thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH report documents an April 2022 incident in which the crew of a business jet flying at 45,000 feet observed a string of bright lights at 55,000 feet near the ESL VORTAC navigation point, while simultaneously experiencing failures in their attitude reference and autopilot systems. Three other commercial flights independently reported seeing the same lights, and crews discussed the sighting on the emergency radio frequency.</p>
  <div class="narr">On 22 April 2022 at 01:52 UTC, the crew of flight LXJ359, travelling southwest at 45,000 feet, reported an unidentified aerial phenomenon directly overhead near the ESL VORTAC navigation aid. They described it as a string of bright lights at an estimated altitude of 55,000 feet — well above the certified ceiling of most aircraft. The sighting lasted four to five minutes.

While positioned directly beneath the lights, LXJ359 experienced a double failure of its Attitude Reference System and a double failure of its Autopilot System. The report notes this temporal overlap but does not establish whether the failures were caused by the phenomenon. After the lights switched off, the crew reported they could still see that something was present overhead.

The sighting was not limited to one aircraft. Three other commercial flights — Southwest Airlines 368 (Washington National to Chicago Midway), Southwest Airlines 393 (Baltimore to Chicago Midway), and United Airlines 46 (Houston to Frankfurt) — independently reported seeing the same light phenomenon. Multiple crews discussed what they observed on the GUARD emergency frequency (121.5 MHz), the universal channel monitored by all aircraft.

The FAA&#39;s Aviation Weather Operations office was notified. Despite the multiple independent witnesses and the reported equipment failures, the case status is listed as &quot;Closed&quot; with no resolution or explanation provided. The report contains no radar data, air traffic control recordings, or instrument logs — all information comes solely from crew-reported remarks.</div>
