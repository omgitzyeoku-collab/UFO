  <h1>Two Commercial Flights Report Unexplained Lights at 38,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/05b207f9b23881888a539d7271ff29463483399d847a1969a785399b1573f46d.jpg" alt="Two Commercial Flights Report Unexplained Lights at 38,000 Feet thumbnail" loading="lazy" />
  <p>An FAA incident report documents a commercial pilot on a San Juan-to-Atlanta flight spotting intermittent white lights moving erratically ahead of the aircraft at 38,000 feet on 9 April 2023. A second commercial flight independently confirmed the sighting, but the FAA closed the case with no explanation or identification provided.</p>
  <div class="narr">This is a single-page FAA SKYWATCH incident report — the system the agency uses to log pilot sightings of unidentified aerial phenomena. It was filed on 9 April 2023 at 03:56 UTC through Atlanta Air Route Traffic Control Center (ZTL).

The report describes a commercial flight, callsign FFT101, operating from San Juan (SJU) to Atlanta (ATL). While heading north-northwest at 38,000 feet, the crew observed an unidentified aerial phenomenon directly ahead of the aircraft (the 12 o&#39;clock position), northwest of Dublin, Georgia. They described intermittent white lights moving 20 degrees left and right in the upper atmosphere while also changing altitude.

The sighting was independently corroborated by a second commercial flight — Southwest Airlines flight SWA884, travelling from Orlando (MCO) to Indianapolis (IND) — which reported the same phenomenon over the Anniston VOR navigational point. The FAA&#39;s Air Warning Operations (AWO) office was notified.

Despite the two-crew corroboration, the case status is listed as &quot;Closed&quot; with no resolution, identification, or follow-up investigation results documented. No sensor data is mentioned — both observations were visual only. No tail number was recorded for the reporting aircraft.</div>
