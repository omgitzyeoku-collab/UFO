  <h1>Airline Crew Reports Multiple Lights Maneuvering at 35,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/88a4aae90f4ff76ee3c34eade93e21f982dc57068cd9b6f0ae27070987e6abab.jpg" alt="Airline Crew Reports Multiple Lights Maneuvering at 35,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of Envoy Air flight ENY3680, who observed 4 or 5 lights maneuvering in all directions above their aircraft while flying at 34,000 feet. The lights were not detected on air traffic control radar, and the FAA closed the case without providing an explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — the system the Federal Aviation Administration uses to log pilot sightings of unidentified aerial phenomena (UAP). It records an event reported on August 22, 2024, by the crew of Envoy Air flight ENY3680, a commercial Embraer E170 flying from Miami to Oklahoma City.

According to the report, while cruising northwest-bound at FL340 (34,000 feet), approximately 10 nautical miles northwest of a navigation point listed as &quot;TBD VOR,&quot; the crew observed 4 or 5 lights maneuvering and traveling in all directions at an estimated altitude of FL350 to FL400 — roughly 35,000 to 40,000 feet, above the aircraft&#39;s own altitude.

Air traffic control checked their radar and found nothing. The report states explicitly that the UAP was not observed on the ATC facility radar system. This means the sighting rests entirely on the crew&#39;s visual observation, with no independent sensor confirmation.

The incident was reported through FAA headquarters in Denver (listed as &quot;HQ DEN&quot;) and assigned a Mandatory Occurrence Report ID referencing August 21, 2024 — one day before the report date, suggesting the sighting may have occurred late on the 21st in coordinated time. The case status is marked as &quot;Closed,&quot; with no resolution or explanation recorded in the document.

The report contains minimal detail. No crew names, aircraft tail number, or technical sensor data appear. The navigation reference &quot;TBD VOR&quot; may indicate the exact location was undetermined or omitted, making it difficult to pinpoint where this occurred.</div>
