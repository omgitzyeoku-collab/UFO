  <h1>F-15E Crew Reports Unidentified Objects Over Syria During 2023 Mission</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2/21/23</span>
    <span class="badge">Syria</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/46701a48cefa62a834941f073aa47234bcd5358b1ecc53bfa58cfc7cb5aeec41.jpg" alt="F-15E Crew Reports Unidentified Objects Over Syria During 2023 Mission thumbnail" loading="lazy" />
  <p>A formerly secret U.S. military mission report describes an F-15E fighter crew observing three possible unidentified aerial phenomena and one possible balloon over eastern Syria on February 21, 2023. The objects produced no radar returns but were visible on infrared sensors, and the crew had experienced radar jamming minutes before the first sighting.</p>
  <div class="narr">This document is a U.S. Department of War mission report from the 389th Expeditionary Fighter Squadron, originally classified SECRET and released on 8 October 2025 by Major General Richard A. Harrison, USCENTCOM Chief of Staff. It records a Defensive Counter-Air sortie — an air-defense patrol — flown by two F-15E Strike Eagles (tail numbers 169 and 188) out of Muwaffaq Salti Air Base in Jordan on the night of February 20–21, 2023, in support of Operation Inherent Resolve over Syria.

During the nearly five-hour mission, the crew reported two separate sighting events near the town of Shaddadi. At approximately 0025Z, they observed three possible unidentified aerial phenomena at Flight Level 240 (roughly 24,000 feet). The objects appeared as two white shapes that registered on infrared sensors but produced no returns on the aircraft&#39;s APG-82 radar. About 70 minutes later, at 0135Z, the crew observed a single possible balloon at Flight Level 210 (roughly 21,000 feet) in the same area. Weapon System Video was recorded for both events but is not included in this release. No health effects were reported by the aircrew.

Minutes before the first sighting, the crew experienced three minutes of radar jamming on the 8.8–9.9 GHz frequency band, which partially degraded their APG-82 radar. The report&#39;s working theory attributes this to a Turkish X-band jammer operating near the Syria–Turkey border, not to the observed objects.

The document is heavily redacted. Coordinates, callsigns, crew names, and specific locations are blacked out under Freedom of Information Act exemptions. The report does not offer a final determination on what the objects were — the crew&#39;s descriptions are explicitly noted as preliminary, using the word &quot;possible&quot; for both the UAP and the balloon.</div>
