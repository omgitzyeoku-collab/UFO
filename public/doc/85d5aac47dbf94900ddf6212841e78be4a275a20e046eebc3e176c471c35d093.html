  <h1>Southwest Airlines Crew Reported Flashing Lights Over Kansas in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/85d5aac47dbf94900ddf6212841e78be4a275a20e046eebc3e176c471c35d093.jpg" alt="Southwest Airlines Crew Reported Flashing Lights Over Kansas in 2023 thumbnail" loading="lazy" />
  <p>This FAA operations center notification documents a UFO/UAP sighting by the crew of Southwest Airlines flight 2520 on February 3, 2023. The pilots reported multi-colored flashing lights directly ahead of their Boeing 737 at 38,000 feet, roughly 36 nautical miles south of Kansas City. No evasive action was taken and no investigation conclusions are included.</p>
  <div class="narr">This document is an incident notification from the FAA&#39;s Washington Operations Center — essentially a log entry recording that a UAP sighting was reported through official channels. It is not an investigation report and contains no analysis or conclusions about what the crew saw.

On the evening of February 3, 2023, at approximately 9:35 PM Central Time, the crew of Southwest Airlines flight 2520 — a Boeing 737 flying from St. Louis to Phoenix — reported seeing multi-colored flashing lights directly ahead of their aircraft (the &quot;12 o&#39;clock position&quot;). The plane was cruising westbound at flight level 380, roughly 38,000 feet, about 36 nautical miles south of Kansas City&#39;s MCI airport. Kansas City Air Route Traffic Control Center (ARTCC) was the facility that handled the report.

The crew did not take evasive action, and no law enforcement was notified. The document ends there. There is no follow-up analysis, no radar data, and no additional witness accounts. The reference code &quot;WOC 7-3333 TB/JG&quot; appears to identify the operations center staff who logged the report, though no individuals are named.

The level of redaction in this document is low — it appears to be released largely intact. What limits its usefulness is not what was removed but what was never included: this is a preliminary notification, not a completed investigation.</div>
