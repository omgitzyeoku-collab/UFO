  <h1>Military Helicopter Crew Reported Unidentified Green Light Near San Diego</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/5eeee31e0afc8e4b805df5d52ff5ab0ad3c5f35bbdb5d9332bb2cfd5cdf10875.jpg" alt="Military Helicopter Crew Reported Unidentified Green Light Near San Diego thumbnail" loading="lazy" />
  <p>An FAA incident report documents a military MH-60 helicopter crew observing an unidentified green light travelling at roughly 50 feet altitude near Naval Air Station North Island, San Diego, on 10 August 2022. The case was closed with no identification or resolution recorded.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — an internal tracking record, not a formal investigation — filed under case number 237UAP00102. It records an unidentified aerial phenomenon reported by the crew of a military MH-60 helicopter on 10 August 2022 at 03:15 local time.

The helicopter, using callsign C6021, was flying westbound under visual flight rules at 300 feet altitude, approximately 7 nautical miles southeast of NZY (Naval Air Station North Island, San Diego). The crew reported seeing an unidentified green light off the left side of the aircraft, travelling westbound at roughly 50 feet altitude.

The FAA&#39;s Airspace Watch Officer was notified, but law enforcement was not. The case is marked as closed, with no explanation or identification of the object recorded in the document.

The report is brief and contains minimal detail. There is no mention of radar data, photographs, or any corroborating sensor evidence. No tail number or aircraft operator is recorded for the helicopter, and the incident location field in the FAA&#39;s metadata is blank.</div>
