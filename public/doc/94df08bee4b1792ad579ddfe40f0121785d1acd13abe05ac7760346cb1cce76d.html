  <h1>Three Commercial Flights Reported Fast-Moving Lights Over New Mexico</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/94df08bee4b1792ad579ddfe40f0121785d1acd13abe05ac7760346cb1cce76d.jpg" alt="Three Commercial Flights Reported Fast-Moving Lights Over New Mexico thumbnail" loading="lazy" />
  <p>An FAA incident report documents a January 2024 sighting in which a pilot at 40,000 feet observed two white lights that rapidly approached his aircraft and climbed thousands of feet at extraordinary speed. Two other commercial flights independently confirmed the same lights, but air traffic control radar detected nothing.</p>
  <div class="narr">On 16 January 2024 at 03:55 UTC, the pilot of a commercial aircraft (callsign JTZ839, an E55P type) was flying westbound at 40,000 feet, roughly 45 nautical miles east-southeast of Zuni, New Mexico. The pilot reported seeing two white lights approximately 30 nautical miles ahead that rapidly manoeuvred toward the aircraft and then climbed 5,000 to 6,000 feet. The pilot described the speed as faster than anything he had ever experienced.

Two other commercial flights in the area independently reported seeing the same lights: DAL543, flying from Atlanta to Las Vegas, and SKW3290, flying from Grand Junction to Phoenix. None of the three aircraft took evasive action.

The FAA logged the event under its SKYWATCH programme and classified it as an Unidentified Aerial Phenomenon. Notably, the lights were not detected on any air traffic control radar system. The FAA&#39;s Airway Operations office was notified.

The case status is listed as Closed. The report includes no follow-up investigation, no proposed explanation, and no resolution. There is minimal redaction in the document itself.</div>
