  <h1>Multiple Pilots Reported Pulsing White Lights Over Florida Straits in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ba88cc774ab37aea9ee182d3ec84fff7822a0067255550094b194ef2f4e41241.jpg" alt="Multiple Pilots Reported Pulsing White Lights Over Florida Straits in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from 10 June 2023 documenting stationary white lights observed by multiple commercial aircraft over the Florida Straits. At least two planes independently reported the lights at altitudes up to an estimated 50,000 feet, but the FAA closed the case with no explanation provided.</p>
  <div class="narr">On 10 June 2023 at 05:15 UTC, a Copa Airlines Boeing 737-800 (callsign CMP404) was flying northbound at 37,000 feet over the Florida Straits, near coordinates 24°42&#39;N / 81°06&#39;W. The crew reported a stationary white light roughly 40 miles ahead that turned on and off periodically.

A second aircraft, a Cessna Citation V (registration N841MS) flying from Cancún to Fort Lauderdale at 37,000 feet, independently observed two separate white lights from its 12 o&#39;clock position about 80 miles ahead. The crew estimated these lights were at 37,000 and 50,000 feet — the higher figure well above standard commercial cruising altitude. That observation was made near 26°38&#39;N / 81°03&#39;W. Multiple additional aircraft in the area reported the same phenomenon.

The FAA classified the report under its primary code of &quot;Unidentified Aerial Phenomenon.&quot; The case status is listed as Closed, but the document provides no resolution, identification, or follow-up analysis. There is no radar data, imagery, or investigative findings included.

The report is a brief administrative summary — a single-page record rather than a detailed investigation. The tail number field for the primary reporting aircraft is blank, which limits independent verification. The Florida Straits area sees heavy commercial and military air traffic, which is relevant context for any sighting in that region.</div>
