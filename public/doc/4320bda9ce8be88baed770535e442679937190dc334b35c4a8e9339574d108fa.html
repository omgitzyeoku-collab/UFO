  <h1>NASA Routing Slip from Gemini 4 Debriefing Is Largely Unreadable</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">June 3-7, 1965</span>
    <span class="badge">Low Earth Orbit</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/4320bda9ce8be88baed770535e442679937190dc334b35c4a8e9339574d108fa.jpg" alt="NASA Routing Slip from Gemini 4 Debriefing Is Largely Unreadable thumbnail" loading="lazy" />
  <p>This document is a NASA internal routing slip (Form 26) that was used to forward paperwork between offices. The text is heavily degraded and mostly illegible, so the slip itself contains no readable substantive information about UAP observations during the Gemini 4 mission.</p>
  <div class="narr">This record, catalogued as NASA-UAP-D018, is not a report or testimony — it is a NASA Form 26, a standard internal routing slip used to forward documents between offices within the agency. The form includes checkboxes for administrative actions like &quot;Per Telephone Conversation&quot; and &quot;See me,&quot; typical of interoffice paperwork from the 1960s.

The routing slip is linked to the Gemini 4 mission, which flew in low Earth orbit from June 3 to 7, 1965. However, the slip itself is a cover page, not the debriefing transcript. Any substantive content about what the astronauts observed during the mission would be found in the documents this slip was attached to — reportedly pages 78–81 and 101 of a larger debriefing collection — not on the slip itself.

The image quality is extremely poor. Most of the text is garbled and unreadable due to degradation and OCR failure. What can be confirmed is limited to the form type (NASA Form 26, revised 1967) and the issuing agency (National Aeronautics and Space Administration).

There is heavy evidence of redaction or degradation across the document. Whether this reflects deliberate redaction, poor scanning, or simple age-related decay cannot be determined from the image alone. The result is that this particular page offers no readable facts about any unidentified aerial phenomena.</div>
