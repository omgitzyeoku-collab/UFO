  <h1>Horizon Air Pilot Reported Stationary Lights Near Los Angeles in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/65fc33fa937a55c535568654ec86d0361b59fad09088ab86c21ab9feadca4b0a.jpg" alt="Horizon Air Pilot Reported Stationary Lights Near Los Angeles in 2023 thumbnail" loading="lazy" />
  <p>An FAA incident report documents a Horizon Air commercial pilot observing 10 to 15 stationary lights below their aircraft while flying near Los Angeles on 21 July 2023. NORAD checked its systems and found nothing; the FAA closed the case without identifying the lights.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena from pilots and air traffic controllers. It was filed under the code &quot;Unidentified Aerial Phenomenon&quot; and assigned case number 237UAP00274.

On 21 July 2023, a Horizon Air regional jet operating as flight QXE2063 was flying southbound at 25,000 feet, roughly 20 nautical miles southwest of Los Angeles International Airport (LAX). The pilot reported seeing 10 to 15 stationary lights at approximately 23,000 feet — about 2,000 feet below the aircraft. No evasive action was taken.

FAA headquarters in Denver asked NORAD (the North American Aerospace Defense Command) to check its systems for any corresponding objects. NORAD returned negative results, meaning military radar did not detect anything in that area. The Aviation Weather Office was also notified.

The case is marked &quot;Closed.&quot; No identification or explanation for the lights is recorded in the document. There is no indication of follow-up investigation, additional witness reports, or corroborating radar data.</div>
