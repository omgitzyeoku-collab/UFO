  <h1>Pentagon UFO Office Outlined Its Mission and Found No Evidence of Alien Reverse-Engineering</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/fc96ca3532421fcae4540f636ea6c19090dfea59cb61a5f8f387b2541b05d98c.jpg" alt="Pentagon UFO Office Outlined Its Mission and Found No Evidence of Alien Reverse-Engineering thumbnail" loading="lazy" />
  <p>This July 2023 backgrounder from the All-domain Anomaly Resolution Office (AARO) explains how the Pentagon&#39;s UFO investigation unit is organised and what it does. After interviewing over two dozen people, AARO stated it found no verifiable evidence that any programme to reverse-engineer extraterrestrial materials has ever existed.</p>
  <div class="narr">In July 2023, the Pentagon&#39;s All-domain Anomaly Resolution Office — known as AARO — published an unclassified backgrounder explaining its purpose and structure. AARO is the US government body responsible for investigating unidentified anomalous phenomena, or UAP, across air, sea, space, and so-called transmedium domains (objects that move between these environments). The document was cleared for open publication on 17 July 2023.

AARO defines UAP as detections that cannot yet be attributed to any known actor and that may show behaviour beyond what current sensors or observers can readily explain. The office is organised into four groups: operations, analysis, science and technology, and strategic communications. It works with the Joint Staff on military reporting requirements and collaborates with the National Air and Space Intelligence Center (NASIC) on analysing recovered UAP objects and material — though the document does not describe what, if anything, has been recovered.

The backgrounder states that AARO interviewed over two dozen individuals and found no verifiable information to support claims that programmes to reverse-engineer extraterrestrial materials have existed or currently exist. At the same time, the office stated it &quot;neither rejects the possibility of extraterrestrial intelligence nor presumes phenomena not immediately understood are evidence of such.&quot; A broader historical review of records and testimonies was still underway at the time and was due to Congress by June 2024.

The document frames UAP as a national security concern for three reasons: operational hazards to military personnel, the risk of technological or intelligence surprise, and the possibility that adversaries could make strategic miscalculations based on unexplained phenomena. UAP have been observed in or near US, allied, and adversary territory.</div>
