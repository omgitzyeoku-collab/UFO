  <h1>Spirit Airlines Pilot Reported Five Stationary Lights Over Orlando</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/94015ad1d988d714b5fffbca78504e22c3c9c71f2e790d683a211d71c6234303.jpg" alt="Spirit Airlines Pilot Reported Five Stationary Lights Over Orlando thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a Spirit Airlines A320 pilot observing five stationary white lights above the aircraft at 26,000 feet near Orlando on 8 April 2024. The lights did not appear on air traffic control radar, and the case was closed without indication of further investigation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form used by the Federal Aviation Administration to log pilot-reported sightings of unidentified aerial phenomena (UAP). It was filed through Jacksonville Air Route Traffic Control Center (ZJX) and assigned the identifier 237UAP00367.

On 8 April 2024 at 03:47 UTC, the crew of Spirit Airlines flight NKS2321, an Airbus A320 flying from Orlando International Airport (MCO) to Newark Liberty International Airport (EWR), reported seeing five white lights above their aircraft. The lights were stationary. The aircraft was heading northeast at flight level 260 (26,000 feet), approximately 10 nautical miles north of Orlando.

Air traffic control checked their radar and did not detect anything corresponding to what the pilot described. The report notes no tail number for the reporting aircraft, no duration of the observation, and no mention of additional witnesses.

The case is marked as closed. There is no indication in the document of any follow-up investigation, resolution, or explanation for what the pilot observed. The level of redaction in the document is low — the information is sparse rather than censored.</div>
