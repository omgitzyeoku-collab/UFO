  <h1>Commercial Crew Reports Two Glowing Orbs Near Texarkana in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/56d1e548520facb0081f0dbed1100c44482d98ea914b3d99a7ab7b2ce84cc636.jpg" alt="Commercial Crew Reports Two Glowing Orbs Near Texarkana in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident notification records a UAP sighting by the crew of Berry Aviation flight 584 on 19 April 2023. The crew described two glowing, pulsing orbs that quickly disappeared while the aircraft was at 27,000 feet near Texarkana, Arkansas. No evasive action was taken and no follow-up investigation is documented in this record.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — a standard form used to log unusual events reported during flight. It records a sighting made by the crew of Berry Aviation flight 584, an E120 aircraft flying from HYI to LAF, on 19 April 2023 at 00:55 Central time.

According to the report, the crew was heading northeast at flight level 270 (27,000 feet), approximately 40 nautical miles north of Texarkana, Arkansas (coordinates 34.03°N, 93.99°W). They reported observing two glowing and pulsing orbs. The objects quickly disappeared. The crew took no evasive action.

The sighting was relayed by Memphis ARTCC (Air Route Traffic Control Center — the FAA facility managing that airspace) to FAA Operations. Law enforcement was not notified. The record contains no radar data, no sensor readings, and no corroborating accounts from other aircraft or ground observers.

The FAA did not draw any conclusion about what the crew saw. This is a preliminary notification only — no follow-up investigation is included in the document. There is little evidence of redaction in this particular record; it simply contains limited information because it is a short operational log entry, not a detailed inquiry.</div>
