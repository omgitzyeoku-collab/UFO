  <h1>American Airlines Pilot Reported Flashing Lights at 37,000 Feet Over Illinois</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/593639051a4ac1d52160215ccaa859ca7a6f14a76715f58bf26020ee8de56e4f.jpg" alt="American Airlines Pilot Reported Flashing Lights at 37,000 Feet Over Illinois thumbnail" loading="lazy" />
  <p>This FAA incident report documents a December 2022 observation by the crew of American Airlines flight AAL276, flying from San Francisco to New York at 35,000 feet, who reported flashing lights approximately 2,000 feet above them near Bradford, Illinois. The case was closed with no identification or explanation of the phenomenon.</p>
  <div class="narr">On 14 December 2022 at 10:10 UTC, the crew of American Airlines flight AAL276 — a commercial service from San Francisco (SFO) to New York JFK — reported an unidentified aerial phenomenon while cruising eastbound at flight level 350, roughly 35,000 feet. The sighting occurred approximately 40 nautical miles west-southwest of Bradford VOR (a navigational reference point in Illinois).

The crew described the phenomenon as flashing lights at approximately flight level 370, about 2,000 feet above their aircraft. The FAA logged the incident under its SKYWATCH programme, which tracks pilot-reported UAP observations. The report was assigned case ID 237UAP00134 and MOR (Mandatory Occurrence Report) ID ZKC-M-2022/12/14-0001.

Following the report, the UFO Reporting Center was notified and AWO (the relevant FAA office) was advised. No corroborating radar data or additional witness accounts are included in this document.

The case status is listed as closed. No resolution, identification, or explanation of the phenomenon is provided in the report. No tail number for the aircraft is recorded, which limits independent verification of the specific airframe involved.</div>
