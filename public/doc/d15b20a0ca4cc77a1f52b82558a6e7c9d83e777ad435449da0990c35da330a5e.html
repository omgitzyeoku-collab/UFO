  <h1>UPS Cargo Crew Reports Stationary Lights at 35,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d15b20a0ca4cc77a1f52b82558a6e7c9d83e777ad435449da0990c35da330a5e.jpg" alt="UPS Cargo Crew Reports Stationary Lights at 35,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a sighting by the crew of UPS flight 1052, who observed stationary lights resembling aircraft landing lights while flying at 35,000 feet over the HNK navigational waypoint on 18 November 2022. The lights appeared 30 degrees above the horizon, disappeared, and reappeared before the case was closed with no follow-up investigation detailed.</p>
  <div class="narr">This document is an FAA SKYWATCH Incident Report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP). It was filed under case number 237UAP00131 and classified with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On 18 November 2022 at 08:50, the crew of UPS flight 1052, a commercial cargo flight travelling northeast from Louisville (SDF) to Manchester, New Hampshire (MHT), reported an unknown phenomenon while cruising at flight level 350 (approximately 35,000 feet). The sighting occurred over the HNK navigational fix. The crew described stationary lights off the right side of the aircraft that resembled aircraft landing lights, positioned roughly 30 degrees above the horizon.

The lights then disappeared and reappeared. The report notes that AWO/TY was notified, though the document does not explain who or what AWO/TY refers to. No tail number was recorded for the aircraft, which is somewhat unusual but not necessarily significant for a cargo operator filing.

The case status is marked as Closed. The report contains no details of any follow-up investigation, no corroborating radar data, and no additional witness accounts. It is a brief, single-page record of a pilot observation — nothing more.</div>
