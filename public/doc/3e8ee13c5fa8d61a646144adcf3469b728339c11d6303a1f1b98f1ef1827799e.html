  <h1>CIA Report Tracked Soviet Scientists&#39; Speculative Paper on Black Hole Physics</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1972</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3e8ee13c5fa8d61a646144adcf3469b728339c11d6303a1f1b98f1ef1827799e.jpg" alt="CIA Report Tracked Soviet Scientists&#39; Speculative Paper on Black Hole Physics thumbnail" loading="lazy" />
  <p>A 1972 CIA intelligence report summarises observations from a US attendee at a 1971 conference in Armenia, where Soviet scientists Kardashev and Sakharov presented a speculative paper proposing that a charged mass collapsing into a black hole could &#39;bounce&#39; back out into a different part of space-time. The document is not a UAP sighting report — it is a Cold War-era record of US intelligence interest in Soviet theoretical physics.</p>
  <div class="narr">In September 1971, the Conference on the Origins of Life took place in Yerevan, Armenia, then part of the USSR. Among the presentations was a paper by N.S. Kardashev of the Institute for Space Research in Moscow and his co-author, the internationally known theoretical physicist Andrei Sakharov. Their paper dealt with general relativity and the possibility of a body collapsing into a black hole in space.

The paper&#39;s central idea was this: an uncharged mass collapsing in space would pass the point of gravitational singularity and be gone forever, with no further contact with the outside world. But if the mass carried an electrical charge, it could behave differently — it would collapse but then bounce back out into a different part of space-time. Sakharov was drawn to this finding because it suggested the structure of space might be far more complicated than scientists then understood. Kardashev was interested in its implications for astrophysics.

The CIA learned about the paper through a letter from a US citizen described as a reliable colleague who had attended the conference. That source assessed the speculation as fantastic and wild but grounded in good and sound physics. The CIA distributed its report on 10 April 1972, marked as unevaluated information.

Despite appearing in the US government&#39;s UAP document release, the report has nothing to do with unidentified aerial phenomena. It is a product of Cold War intelligence-gathering on Soviet scientific research. The document&#39;s title also references the &#39;low scientific level of other Soviet papers&#39; at the conference, but the extracted text does not contain that section, suggesting pages may be missing or redacted.</div>
