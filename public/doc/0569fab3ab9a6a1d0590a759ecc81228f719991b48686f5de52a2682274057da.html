  <h1>AARO Director Tells Senate Most UAP Reports Are Ordinary Objects</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0569fab3ab9a6a1d0590a759ecc81228f719991b48686f5de52a2682274057da.jpg" alt="AARO Director Tells Senate Most UAP Reports Are Ordinary Objects thumbnail" loading="lazy" />
  <p>Dr. Jon Kosloski, director of the Pentagon&#39;s UAP investigation office, testified before a Senate subcommittee in November 2024 that his office holds over 1,600 UAP reports, most of which resolve to birds, balloons, or drones. He stated that no verifiable evidence of extraterrestrial activity has been found.</p>
  <div class="narr">This document is a prepared written statement delivered by Dr. Jon Kosloski, the Director of the All-domain Anomaly Resolution Office (AARO), to the Senate Armed Services Subcommittee on Emerging Threats and Capabilities on November 19, 2024. AARO is the Pentagon office responsible for investigating unidentified anomalous phenomena (UAP) reports from across the US government.

Kosloski, who took the role in August 2024, described his background as a researcher with training in mathematics, physics, and engineering, having spent most of his career at the National Security Agency. He reported that AARO holds over 1,600 UAP reports and that many resolve to commonplace objects such as birds, balloons, and unmanned systems. Only a very small percentage, he said, are potentially anomalous. He stated plainly that AARO has found no verifiable evidence of extraterrestrial beings, activity, or technology.

The director outlined three priorities for the office: building partnerships with agencies including the FBI, DHS, NASA, and the National Labs; promoting transparency through declassification efforts and collaboration with the National Archives to digitise UAP records; and scaling up AARO&#39;s data collection and sensor capabilities. He noted that AARO had already launched a public website featuring UAP imagery, case resolutions, and archival records.

On the topic of classification, Kosloski explained that when UAP photos remain classified, it is typically because the location, source, or collection method is sensitive — not the object itself. AARO does not unilaterally declassify information but works with the originator of any classified record. The statement was reviewed for classification on February 6, 2025, and released in full with low redaction.</div>
