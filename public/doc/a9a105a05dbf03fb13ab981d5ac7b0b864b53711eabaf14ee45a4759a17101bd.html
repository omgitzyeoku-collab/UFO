  <h1>American Airlines Crew Reported Large Balloon at 50,000 Feet Over Missouri</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a9a105a05dbf03fb13ab981d5ac7b0b864b53711eabaf14ee45a4759a17101bd.jpg" alt="American Airlines Crew Reported Large Balloon at 50,000 Feet Over Missouri thumbnail" loading="lazy" />
  <p>This FAA incident report documents an American Airlines crew observing a large balloon-like object at roughly 50,000 feet near St. Joseph, Missouri, on 3 February 2023. The FAA classified the sighting under its Unidentified Aerial Phenomenon code, though the crew themselves simply described a large balloon. The case is closed with no further explanation provided in the document.</p>
  <div class="narr">On 3 February 2023 at 15:22 UTC, the crew of American Airlines flight 883 — a Boeing 737-800 flying from Chicago O&#39;Hare to Phoenix — reported seeing a large balloon off the right side of the aircraft. The plane was heading northbound at about 34,000 feet, roughly 13 nautical miles west of St. Joseph, Missouri. The object appeared to be at approximately 50,000 feet or higher.

The sighting was logged through Kansas City Center (ZKC), the FAA air traffic control facility covering that airspace. The FAA filed it under its SKYWATCH system with a primary classification of Unidentified Aerial Phenomenon. The flight continued to Phoenix without diverting.

The report is brief and contains no radar data, photographs, or follow-up investigation results. The FAA marked the incident as closed. No named individuals appear in the document, and redaction is minimal — the report simply contains very little information beyond the crew&#39;s initial observation.

The timing is notable: 3 February 2023 falls during the same period when several Chinese high-altitude surveillance balloons were tracked over US airspace, a series of incidents that dominated headlines that month. The crew&#39;s own description — a large balloon at extremely high altitude — is consistent with that context, though this document does not explicitly link the sighting to those events.</div>
