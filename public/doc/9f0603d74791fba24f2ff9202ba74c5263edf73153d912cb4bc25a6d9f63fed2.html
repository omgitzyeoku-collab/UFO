  <h1>Radar Detected Unidentified Object Near Reagan Airport in 2021</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9f0603d74791fba24f2ff9202ba74c5263edf73153d912cb4bc25a6d9f63fed2.jpg" alt="Radar Detected Unidentified Object Near Reagan Airport in 2021 thumbnail" loading="lazy" />
  <p>This is a SKYWATCH incident report from the National Capital Region Coordination Center documenting an unidentified aerial phenomenon detected on radar near Reagan National Airport on 16 October 2021. Multiple agencies — including the Department of Defense and Pentagon Police — tracked or received alerts about the target, but no one ever visually confirmed what it was.</p>
  <div class="narr">On 16 October 2021 at 3:47 PM, the National Capital Region Coordination Center (NCRCC) logged a SKYWATCH incident report classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot; A facility called PCT reported a primary radar target near Reagan National Airport (DCA) moving north-eastbound. The target appeared at a specific radar position (DCA220003) at 3:50 PM.

Multiple agencies responded. The Department of Defense independently detected the same target on its own systems but reported &quot;data fade&quot; — meaning the radar track degraded or disappeared. Two other sensor systems, referred to in the report by the acronyms AADS and AMOSS, detected nothing. Helicopters in the area and DCA itself actively searched for the object.

Separately, Pentagon Police reported picking up a UAS (drone) alert at the intersection of Arlington Ridge Road and Lynne Street in Arlington, Virginia. The report does not confirm whether this drone alert was related to the same object seen on radar.

Despite the search effort, no entity achieved visual confirmation of the target. The case was marked as closed. No further explanation or identification of the object appears in the document.

This incident took place in some of the most heavily monitored airspace in the United States — directly adjacent to the Pentagon and Reagan National Airport. The fact that a radar target prompted a multi-agency response yet was never visually identified is notable, though it does not by itself indicate anything beyond an unresolved detection.</div>
