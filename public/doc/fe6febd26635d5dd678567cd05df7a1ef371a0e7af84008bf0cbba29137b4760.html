  <h1>Boeing 767 Crew Reported Circling Lights Above Their Aircraft in 2024</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/fe6febd26635d5dd678567cd05df7a1ef371a0e7af84008bf0cbba29137b4760.jpg" alt="Boeing 767 Crew Reported Circling Lights Above Their Aircraft in 2024 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a February 2024 sighting by the crew of a commercial Boeing 767 (callsign ATN3498), who observed multiple lights moving and circling high above their aircraft at 37,000 feet near central Utah. The FAA noted the lights may have been Starlink satellites, did not detect anything on radar, and closed the case without further investigation.</p>
  <div class="narr">On 19 February 2024, the crew of commercial flight ATN3498 — a Boeing 767 operated by ATN — filed a report with the Federal Aviation Administration after observing something unusual during their flight. While flying eastbound at 37,000 feet, approximately 20 nautical miles east-northeast of Manti-Ephraim Airport in Utah, the crew spotted multiple lights directly ahead of and above their aircraft. The lights were described as moving and circling at a position high above the plane.

The FAA logged the event as a SKYWATCH Incident Report under the category &quot;Unidentified Aerial Phenomenon.&quot; Air traffic control checked their radar systems but found no corresponding targets — whatever the crew saw did not show up on ATC radar.

The report itself offers a possible mundane explanation: the lights may have been Starlink satellites. The case was marked as closed, with no further investigation noted in the document.

The record contains minimal redaction. No tail number for the aircraft was recorded, and the incident location field is limited to nearby navigation references rather than a precise coordinate. The report is a single-page administrative filing rather than a detailed analytical assessment.</div>
