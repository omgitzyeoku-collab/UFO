  <h1>Aeromexico Crew Reported Three Oscillating White Lights Over Texas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a4a1212b2209bbd92814e708f6232c1b0d265f5f969a267a0e95b2520df8f186.jpg" alt="Aeromexico Crew Reported Three Oscillating White Lights Over Texas thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of Aeromexico flight AMX692 on 17 May 2023. While flying at 35,000 feet near San Antonio, Texas, the pilots observed three white lights at a higher altitude that appeared to move west and then snap back to their starting position every few seconds. The case is marked closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standard form used to log pilot reports of unidentified aerial phenomena. It was filed through Houston Center (the FAA&#39;s air traffic control facility covering that region) and assigned the reference number 237UAP00264.

On 17 May 2023 at 06:57 UTC, the crew of Aeromexico flight AMX692 — a Boeing 737 MAX 8 flying from Mexico City to Toronto — reported something unusual. While heading north at 35,000 feet, approximately 50 nautical miles east of San Antonio, Texas, they spotted three white lights directly ahead at their 12 o&#39;clock position. The lights appeared to be at roughly 45,000 feet, which is above the operating ceiling of most conventional aircraft.

What made the sighting distinctive was the reported behaviour: the lights would travel westward for three to five seconds and then immediately return to their starting point, repeating this pattern. The report does not include any radar data or additional witness accounts to corroborate the crew&#39;s observations.

The FAA marked the case as closed. No resolution, identification, or explanation is provided in the document. There is no indication that further investigation was conducted or that any follow-up findings were recorded.</div>
