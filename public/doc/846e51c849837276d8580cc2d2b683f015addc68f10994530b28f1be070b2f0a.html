  <h1>AARO Resolved Western US UAP Sighting as Distant Commercial Aircraft</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>This is a case resolution report from the All-domain Anomaly Resolution Office (AARO) investigating a 2021 UAP sighting in the Western United States. Military personnel reported five equidistant lights in restricted airspace, but AARO concluded they were almost certainly commercial aircraft up to 300 nautical miles away, with apparent shape changes caused by sensor vibration and autofocus issues.</p>
  <div class="narr">In 2021, military personnel in the Western United States reported seeing five evenly spaced lights through an infrared sensor, raising concerns about a possible incursion into restricted airspace. The objects appeared as oblong dots or lights at altitudes between 20,000 and 40,000 feet. The sighting was formally investigated by AARO, the Pentagon office responsible for tracking unidentified anomalous phenomena.

AARO&#39;s investigation found that the objects were significantly farther from the observers than originally estimated — up to 300 nautical miles away. Analysis of air-traffic control data indicated the lights were likely commercial aircraft flying along known flight corridors between major airports in the region. The apparent changes in the objects&#39; shapes, which may have made them look unusual, were attributed to sensor vibration and autofocus artifacts rather than any property of the objects themselves.

AARO&#39;s science and technology partners independently reached the same conclusion using boresight analysis, a technique for determining where a sensor is actually pointing. Multiple analytical groups working within AARO&#39;s framework agreed: the lights were commercial planes.

The case is marked as resolved. While the report provides a clear explanation, it does not name the specific flights, airports, air corridors, or the exact date of the sighting. The identity of the military personnel and the specific sensor platform are also not disclosed.</div>
