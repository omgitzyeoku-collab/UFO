  <h1>U.S. Aircraft Tracked Oval-Shaped Possible UAP for Over Two Hours</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">10/31/24</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/90570293e61c9b228e557b2e83f6e32821f5cf13879b0c5b83c1b8b58153f510.jpg" alt="U.S. Aircraft Tracked Oval-Shaped Possible UAP for Over Two Hours thumbnail" loading="lazy" />
  <p>This document is an internal email chain from October 2024 in which intelligence personnel discuss an unclassified summary of a UAP sighting. A U.S. aircraft observed an oval or orb-shaped object, likely moving at low speed, and maintained visual contact for over two hours. The emails focus on whether the year of the incident can be included in the unclassified version of the report.</p>
  <div class="narr">On 31 October 2024, a U.S. military aircraft observed what was described as a possible unidentified anomalous phenomenon (UAP). According to an unclassified excerpt from the mission report, the object appeared to be oval or orb-shaped and was likely moving at a low speed. The aircraft maintained visual contact with the object for over two hours.

This document is not the mission report itself. It is an email exchange between two intelligence roles: an Information Disclosure Analyst and a PAROC (likely a processing, analysis, and reporting operations center) Intel Data Analysis Technician assigned to 15th Air Force, Detachment 1. The analyst was requesting approval to include the year of the incident in an unclassified summary — the month and day had already been cleared for release, but the year had not.

The underlying mission report is classified SECRET//NOFORN (secret, not releasable to foreign nationals). Only a brief unclassified excerpt is included in this email chain. No location, altitude, sensor data, or aircraft type is provided in the unclassified portion. All personnel names are redacted under privacy exemptions.

The document uses cautious language throughout — the object is called a &quot;possible UAP,&quot; its shape is described as what it &quot;appeared to be,&quot; and its speed is characterized as &quot;likely&quot; low. No conclusion is offered about what the object was. The notably long observation window of over two hours is stated without explanation for why sustained contact was maintained.</div>
