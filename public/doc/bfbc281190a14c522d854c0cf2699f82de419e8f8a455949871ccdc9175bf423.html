  <h1>U.S. Air Force Crew Logged Three Unidentified Aerial Sightings Over the Arabian Gulf in 2020</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">7/16/20</span>
    <span class="badge">Arabian Gulf</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bfbc281190a14c522d854c0cf2699f82de419e8f8a455949871ccdc9175bf423.jpg" alt="U.S. Air Force Crew Logged Three Unidentified Aerial Sightings Over the Arabian Gulf in 2020 thumbnail" loading="lazy" />
  <p>A heavily redacted U.S. military mission report records that a single Air Force aircraft from the 482nd Attack Squadron observed three separate unidentified aerial phenomena (UAP) via onboard video during a 21-hour armed reconnaissance flight over the Arabian Gulf on July 16, 2020. The report logs the times and aircraft positions for each sighting but provides no description of what the objects looked like or how they behaved.</p>
  <div class="narr">This document is a standard military Mission Report (MISREP #4472514) filed by the 482nd Attack Squadron, operating under U.S. Central Command (USCENTCOM) and Air Combat Command. On July 16, 2020, a single aircraft took off from OKAS airfield at 0443Z and flew an armed reconnaissance mission in support of Naval Forces Central Command (NAVCENT), covering the Arabian Gulf, the Strait of Hormuz, and the Gulf of Oman. The total mission lasted 21 hours and 17 minutes.

During the flight, the crew recorded three separate UAP observations — at 1830Z, 1920Z, and 2345Z. All three were detected using the aircraft&#39;s full-motion video (FMV) sensor, an AN/DAS-4 targeting pod. At the time of the first sighting, the aircraft was at 20,000 feet traveling at 98 knots; during the second, it was at 19,000 feet and 90 knots; during the third, at 19,100 feet and 115 knots. Weather was noted as not a factor during any of the observations. The video footage was sent to Distributed Ground Station 1 (DGS-1) for analysis.

Critically, the report says nothing about what the UAP looked like — no shape, size, color, speed, or movement is described. This is a mission-accounting form, not an investigative analysis. It records that observations occurred and assigns them observation line numbers, but does not attempt to explain or identify them.

The document is heavily redacted. The aircraft type, crew names, callsigns, precise coordinates, and the name of the operation are all blacked out under national security exemptions. The aircraft&#39;s low airspeeds (90–115 knots) and the 21-hour mission duration are consistent with an unmanned aerial system (a drone), though this is not confirmed in the text. The report was originally classified with a scheduled declassification date of March 1, 2045, and was declassified by Major General Richard A. Harrison, USCENTCOM Chief of Staff. Beyond the UAP entries, the mission also documented observations of probable Iranian naval vessels — including Naser-class and Safir-class warships and a possible Houdong-class vessel docked at Bushehr.</div>
