  <h1>United Airlines Crew Reported High-Altitude Balloon Near Missouri in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ec25abaef40c89510580d6c9d849d8971ca202414b8c8d24ff7181af78312941.jpg" alt="United Airlines Crew Reported High-Altitude Balloon Near Missouri in 2023 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a United Airlines crew observing a large balloon at an estimated 50,000 feet or above while flying at 34,000 feet on 3 February 2023. The object was logged under the FAA&#39;s &quot;Unidentified Aerial Phenomenon&quot; code and the case is now closed, with no resolution or identification included in the report.</p>
  <div class="narr">On 3 February 2023 at 15:40, the crew of United Airlines flight UAL2372 reported a large balloon off the right side of their aircraft. The flight was travelling northbound at flight level 340 (roughly 34,000 feet) and was approximately 13 nautical miles west of St. Joseph, Missouri, within Kansas City Center (ZKC) airspace. The flight&#39;s route ran from Washington Dulles (IAD) to Las Vegas (LAS).

The crew estimated the balloon was at flight level 500 — approximately 50,000 feet — or above. That altitude estimate was visual, not instrument-based. The FAA filed the sighting under its primary code for Unidentified Aerial Phenomenon, though the crew themselves described the object as a balloon.

The report is classified as a SKYWATCH Incident Report, a standard FAA format for logging unusual aerial observations. The case status is marked as closed. No further investigation findings, radar corroboration, or object identification appear in the document.

This incident occurred during the same period as a series of high-altitude balloon events across North America, including the Chinese surveillance balloon that was shot down on 4 February 2023 — one day after this sighting. The report itself does not draw any connection to those events.</div>
