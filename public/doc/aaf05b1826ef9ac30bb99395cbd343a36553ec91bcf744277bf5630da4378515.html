  <h1>FAA Report: Bright Spherical Light Hovered Near Truckee Airport in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/aaf05b1826ef9ac30bb99395cbd343a36553ec91bcf744277bf5630da4378515.jpg" alt="FAA Report: Bright Spherical Light Hovered Near Truckee Airport in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA incident report documenting a civilian&#39;s sighting of a bright, sphere-shaped light near Truckee Tahoe Airport (TRK) in California on 25 May 2023. The object reportedly hovered at low altitude for about 30 minutes before the case was closed with no explanation provided.</p>
  <div class="narr">On 25 May 2023 at 05:50, a civilian on the ground reported seeing an unusual object in the sky near Truckee Tahoe Airport in Northern California. The object was described as a very bright light with a low sphere shape, surrounded by additional lights. It hovered at roughly twice the height of the tree line and remained stationary for approximately 30 minutes.

The sighting was logged through the FAA&#39;s SKYWATCH incident reporting system and classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot; The report was routed through NCT (Northern California TRACON, the regional radar approach control facility), and the FAA&#39;s Unexplained Phenomena Reporting Data Collection Center was notified.

The case status is marked as closed. However, the report contains no investigation findings, no resolution, and no explanation for what the object might have been. There is no mention of radar data, photographs, or any corroborating evidence beyond the single observer&#39;s account.

The document itself shows low signs of redaction. The observer&#39;s identity is not disclosed, which is standard practice for civilian reports of this kind.</div>
