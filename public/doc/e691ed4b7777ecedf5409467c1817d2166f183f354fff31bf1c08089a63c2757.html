  <h1>Pentagon Office Explains How Starlink Satellites Get Mistaken for UFOs</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e691ed4b7777ecedf5409467c1817d2166f183f354fff31bf1c08089a63c2757.jpg" alt="Pentagon Office Explains How Starlink Satellites Get Mistaken for UFOs thumbnail" loading="lazy" />
  <p>This unclassified paper from the All-domain Anomaly Resolution Office (AARO) explains how sunlight reflecting off satellites — especially SpaceX&#39;s Starlink constellation — creates bright flashes that are frequently misreported as UAP (unidentified anomalous phenomena). It includes mathematical methods for predicting satellite flares and walks through a real FAA pilot report near Gallup, New Mexico, concluding the sighting was very likely caused by satellite flares.</p>
  <div class="narr">In December 2024, AARO — the Pentagon office responsible for investigating unidentified anomalous phenomena — published an information paper tackling a specific, recurring source of UAP reports: satellite flaring. The paper was cleared for public release on 23 January 2025 and released in full with no redactions.

The core problem is straightforward. As of late November 2024, over 6,700 Starlink satellites were orbiting Earth, part of nearly 10,000 total satellites in low Earth orbit — a number expected to grow several-fold in the coming decade. When sunlight reflects off these satellites at the right angle, it produces bright flashes visible from the ground. Multiple satellites flaring simultaneously can appear as spinning lights, glowing orbs that blink in and out, or even geometric shapes like triangles. AARO notes this phenomenon was already well documented with Iridium satellites in the late 1990s and early 2000s, but the sheer scale of Starlink has made it far more common.

The paper provides step-by-step methods for observers — both on the ground and in aircraft — to predict when and where satellite flares will appear. Starlink flares are generally visible when the sun is between 38° and 46° below the horizon, appearing up to about 10° above the horizon. Pilots are particularly susceptible because flying toward the sun&#39;s position after sunset or before sunrise keeps them in the flare&#39;s light cone longer than a ground observer. AARO personnel tested their prediction methods during a field trip to Sidney, Nebraska, in March 2024, and their predicted flare positions matched what they observed and photographed.

The paper includes a worked case study: on 9 October 2022, an FAA pilot flying eastbound near Gallup, New Mexico at 35,000 feet reported multiple unidentified lights moving in different directions, positioned left of the constellation Leo. AARO&#39;s analysis concluded the lights were &quot;very likely Starlink and other satellite flares.&quot; The paper notes this assessment relied on estimated sighting parameters, since the pilot did not provide precise azimuth and elevation measurements.

AARO states that both diffuse and specular sunlight reflection from satellites can explain some of the UAP reports it receives, and that this analysis should help improve the quality of future reporting.</div>
