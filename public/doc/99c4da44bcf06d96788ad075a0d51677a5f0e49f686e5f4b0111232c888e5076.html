  <h1>Multiple Aircraft Report Bright Flashing Lights Over Georgia in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/99c4da44bcf06d96788ad075a0d51677a5f0e49f686e5f4b0111232c888e5076.jpg" alt="Multiple Aircraft Report Bright Flashing Lights Over Georgia in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA incident notification from August 2023 recording that Allegiant Air flight 1432 and multiple other aircraft reported an unidentified aerial phenomenon with bright white flashing lights near Dublin, Georgia. The document is a brief operations center alert, not a completed investigation, and no follow-up findings are included.</p>
  <div class="narr">On August 4, 2023, at 3:04 AM Eastern time, the FAA&#39;s Washington Operations Center logged an incident notification about unidentified aerial phenomenon activity near Dublin, Georgia. The report was relayed through the Atlanta Air Route Traffic Control Center (ARTCC), which handles high-altitude air traffic across the southeastern United States.

The primary reporting aircraft was Allegiant Air flight 1432, an Airbus A320 flying from Fort Lauderdale, Florida, to Knoxville, Tennessee. The crew observed an object displaying bright white flashing lights while the aircraft was northbound at flight level 400 — roughly 40,000 feet. Multiple other aircraft in the area independently reported the same phenomenon, which strengthens the observation beyond a single-crew account.

The geographic coordinates recorded in the document (32.56°N, 82.98°W) place the sighting in the vicinity of Dublin, a small city in central Georgia. No law enforcement agency was notified of the incident according to the report.

The document itself is short — an internal operations center notification, not a formal investigation. It records the basic facts of what was reported and by whom, but contains no radar data, no sensor evidence, no photographs, and no analysis of what the object might have been. There is no indication that any follow-up investigation was conducted, or if one was, its results are not included in this record. The report was filed by operators identified only by the initials TB/JW.</div>
