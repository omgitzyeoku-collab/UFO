  <h1>FAA Report: Pilot Spotted Large Balloon at 50,000 Feet in February 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/1c3c965b636cd8adc06944bd354d8f48509602d09a1fd059227880489ac436f8.jpg" alt="FAA Report: Pilot Spotted Large Balloon at 50,000 Feet in February 2023 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report filed on 3 February 2023, documenting a commercial airline crew&#39;s sighting of a large balloon at approximately 50,000 feet or higher over southeastern Colorado. The report is classified under the FAA&#39;s &#39;Unidentified Aerial Phenomenon&#39; code and is marked as closed.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unusual aerial sightings reported by pilots or air traffic controllers. It was filed on 3 February 2023 at 15:03 UTC and assigned the case number 237UAP00182. The primary classification code is &#39;Unidentified Aerial Phenomenon.&#39;

The report describes a sighting by the crew of Frontier Airlines flight FFT2931, which was flying northbound at flight level 360 (approximately 36,000 feet). The crew reported a large balloon off the right side of the aircraft, located about 25 nautical miles southeast of Prowers VOR (a navigation waypoint in southeastern Colorado). The balloon was estimated to be at flight level 500 and above — roughly 50,000 feet or higher. The incident was reported to Kansas City Center (ZKC), the FAA air traffic control facility responsible for that airspace.

The timing is notable: this sighting occurred one day before the US military shot down a Chinese high-altitude surveillance balloon on 4 February 2023, during a period of heightened national attention to balloon incursions into US airspace.

The report&#39;s status is marked as closed. No further investigation findings, radar data, or imagery are included in this document. The crew themselves described the object as a &#39;large balloon&#39; — the UAP classification reflects the FAA&#39;s formal reporting code rather than any suggestion the object was unexplained to the observers.</div>
