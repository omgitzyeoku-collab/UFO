  <h1>Mexican Inventor Wrote FBI About Flying Saucer Theories in 1950</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7899c7229a9c410bcc2ca0164c5a229c89c4ec9a31ead8824cdb8f5f501a605b.jpg" alt="Mexican Inventor Wrote FBI About Flying Saucer Theories in 1950 thumbnail" loading="lazy" />
  <p>This FBI file contains a translated 1950 letter from a Mexican inventor named Miguel Angel Garcia Macias, who shared his personal theories about flying saucers with a U.S. scientific commission, along with a Mexican newspaper clipping reporting the first alleged photographs of a flying saucer over Durango, Mexico. The document is unsolicited correspondence — not an FBI investigation or assessment.</p>
  <div class="narr">In March 1950, a man named Miguel Angel Garcia Macias — a self-described pianist, composer, and &quot;ideographic inventor&quot; from Veracruz, Mexico — wrote a letter addressed to the &quot;President of the Commission of Scientific Investigation of the United States.&quot; In it, he laid out his personal theories about what he called &quot;stratospheric aerostats,&quot; his term for flying saucers. He believed the United States already possessed these craft and that they were powered by atomic force. He also claimed the devices could achieve velocities &quot;greater than that of light or sound,&quot; a claim that has no basis in physics.

Garcia Macias used the letter to list several of his own unpatented inventions, including a &quot;graduated dropper&quot; and automatic shovels for dump trucks. He alleged that plans for some of these inventions had been stolen from him and patented by unknown persons in the United States. None of these claims were investigated or verified within this document.

Attached to the letter was a clipping from a Mexican newspaper dated March 16, 1950, reporting that an engineering student named German Horacio Robles Jr. had taken what were claimed to be the first photographs of a flying saucer over the city of Durango. The newspaper described the object as a &quot;double truncated cone, joined at its bases,&quot; flying at an altitude of 8,000 to 9,000 feet and moving by something resembling jet propulsion.

The letter was translated into English by Mrs. Sophia Saliba and appears to have been received by the FBI&#39;s New York office. There is no indication in the file that the FBI conducted any follow-up investigation, analysis of the photographs, or assessment of Garcia Macias&#39;s claims. This is unsolicited mail that was filed, not an investigative report.</div>
