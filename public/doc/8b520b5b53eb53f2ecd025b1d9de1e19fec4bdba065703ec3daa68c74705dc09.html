  <h1>Commercial Airline Crew Reports Two Fast-Moving Lights Over Pennsylvania</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/8b520b5b53eb53f2ecd025b1d9de1e19fec4bdba065703ec3daa68c74705dc09.jpg" alt="Commercial Airline Crew Reports Two Fast-Moving Lights Over Pennsylvania thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a January 2024 sighting by a Republic Airways crew flying from New York JFK to Pittsburgh. The pilots observed two lights — white turning red — chasing each other at speed above their aircraft at 20,000 feet; air traffic control radar detected nothing, and the case was closed without explanation.</p>
  <div class="narr">On 27 January 2024 at 03:20 UTC, the crew of a Republic Airways Embraer E175 (callsign RPA4809) reported an unidentified aerial phenomenon while flying westbound from JFK to Pittsburgh at flight level 200 (20,000 feet). The sighting occurred off the right side of the aircraft, roughly 40 nautical miles west of PSB, near a point designated EWC.

The crew described two lights that started white, turned red, and appeared to chase each other at high speed above the aircraft. The report was logged under FAA SKYWATCH — the agency&#39;s system for tracking UAP (unidentified aerial phenomena) reports from pilots and controllers.

Air traffic control radar at the relevant facility did not detect the phenomenon. A mandatory occurrence report was initiated through Cleveland Center (facility code ZOB), assigned reference ZOB-M-2024/01/26-0003.

The case status is marked as closed. The document provides no resolution, no identification of the lights, and no record of corroborating observations from other aircraft or ground stations. No tail number was recorded for the reporting aircraft.</div>
