  <h1>Federal Agent Reports Glowing Objects Near Hillside in Western U.S.</h1>
  <div class="meta">
    <span class="badge">Department of War</span>

    <span class="badge">Westen United States</span>

  <img class="thumb" src="/extract/thumbs/dc40faca3aa67a7e4f32a22ecc206f7f5d39de9b75b6bcc7b152638da381f755.jpg" alt="Federal Agent Reports Glowing Objects Near Hillside in Western U.S. thumbnail" loading="lazy" />
  <p>A U.S. federal law enforcement agent submitted a first-hand witness statement to the Pentagon&#39;s UAP office describing two glowing, lava-like balls of light observed near hillsides over two nights in October 2023. The document is heavily redacted, and this is a single witness account without accompanying sensor data.</p>
  <div class="narr">This document is a witness statement from a U.S. federal law enforcement special agent, submitted to the All-domain Anomaly Resolution Office (AARO) — the Pentagon body responsible for investigating unidentified anomalous phenomena (UAP). It describes events observed over two nights in October 2023 somewhere in the western United States.

On the first night, the witness reported seeing nothing specific due to their position. On the second night, the agent and at least one other colleague noticed a large glowing ball roughly 90 degrees to their right, near a hillside. The witness later returned to the area and used a range finder to estimate the hillside was about 1,100 metres away. The object appeared close to the hill face and was described as a circle of light with a swirly pattern resembling bright lava, visible at dusk.

A second similar luminous object was then observed in the sky above a different hillside, slightly to the right of the witnesses&#39; forward position. The document references multiple federal agents who observed the phenomena, but only presents this one agent&#39;s account.

The document is heavily redacted throughout. Witness identities are fully removed, and large sections of text are blacked out or unreadable. No conclusions or explanations from the agency are included in the available text. The document type is an image file (JPG), which has resulted in significant OCR degradation — meaning portions of the original content could not be reliably extracted.</div>
