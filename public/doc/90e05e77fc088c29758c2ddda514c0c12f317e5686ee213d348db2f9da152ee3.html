  <h1>Air Force Statistical Study Found No Evidence UFOs Were Advanced Technology</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/90e05e77fc088c29758c2ddda514c0c12f317e5686ee213d348db2f9da152ee3.jpg" alt="Air Force Statistical Study Found No Evidence UFOs Were Advanced Technology thumbnail" loading="lazy" />
  <p>Project Blue Book Special Report No. 14, completed in May 1955, was a large-scale statistical analysis of roughly 4,000 UFO sighting reports collected by the U.S. Air Force between 1947 and 1952. Using IBM punched-card methods, the study concluded it was &quot;highly improbable&quot; that any sightings represented technology beyond known science, and noted a complete lack of physical evidence in every case.</p>
  <div class="narr">In 1953, the Air Technical Intelligence Center at Wright-Patterson Air Force Base in Ohio began a systematic review of UFO reports that had been accumulating since the famous Kenneth Arnold sighting near Mount Rainier, Washington, in June 1947. Arnold, a businessman and private pilot from Boise, Idaho, had described a chain-like formation of disc-shaped objects — and his account triggered a wave of public reports that the Air Force had been collecting ever since. By the end of 1954, 4,834 official reports were on file.

The resulting study, designated Special Report No. 14 under Project No. 10073, used IBM punched-card equipment to process the data mechanically. A panel of scientists both inside and outside the Air Force categorised each sighting as a balloon, aircraft, astronomical object, or other known phenomenon. Roughly 800 reports were excluded before analysis for being too vague or containing highly conflicting statements. Of the 3,201 cases charted, a portion remained labelled &quot;Unknown&quot; — meaning the description could not be matched to any known object or phenomenon, not that it was extraterrestrial.

The study&#39;s primary conclusion was blunt: it was &quot;highly improbable&quot; that any of the reports represented technological developments outside present-day scientific knowledge. The authors also stated there had been &quot;a complete lack of any valid evidence of physical matter&quot; in any case. Statistical chi-square tests comparing the characteristics of known sightings against unknowns found a low probability that apparent similarities were meaningful.

By early 1955, a revised investigation programme — carried out by the 4602d Air Intelligence Service Squadron under Air Force Regulation 200-2 — had driven the percentage of unexplained cases down from 9% in 1953–1954 to just 3% of the 131 reports received between January and May 1955. Dr J. Allen Hynek of The Ohio State University, who had consulted on the project since 1949, contributed to the scientific framework.

This copy, number 35, was retained by the CIA Archives and Records Center as an Official Historical Record under the Federal Records Act of 1950. The document was marked &quot;For Official Use Only&quot; rather than classified at a higher level.</div>
