  <h1>FBI Interview Records Civilian&#39;s Orb Sightings in Northeastern US</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">2025</span>
    <span class="badge">Northeastern United States</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/e98d37f35a1bfda602ba665ea43cecb740f7aec24e46783b035f14581932af8c.jpg" alt="FBI Interview Records Civilian&#39;s Orb Sightings in Northeastern US thumbnail" loading="lazy" />
  <p>This FBI FD-302 interview record documents a civilian&#39;s account of observing luminous orb-like objects near their home in the northeastern United States in 2025. The witness described basketball- and beach-ball-sized lights hovering near a tree line, a later sighting of white orbs at higher altitude, and an earlier incident involving a red light near power lines — but the document is heavily redacted, with all names, dates, and precise locations removed.</p>
  <div class="narr">This document is an FBI FD-302 — the standard form used to record witness interviews — filed under the designation FBI-UAP-D010. It captures a civilian&#39;s first-hand account of observing unidentified luminous objects near their home in the northeastern United States.

According to the witness, they arrived home around 5:15 p.m. and spotted a yellow ball of light through their windshield, roughly the size of a basketball. A larger, beach-ball-sized light was also present. The objects hovered approximately 30 yards away and 20–30 feet above the ground, near a tree line between the witness&#39;s property and a neighbour&#39;s. A second person came outside and also observed the objects. Both watched as the lights moved laterally to the left, passing behind trees and a neighbouring house before disappearing from view at roughly 75 yards away. The witness reported being able to look at the lights without eye strain or discomfort and said they experienced no health issues afterwards.

Weeks later, the same witness reported seeing several white orbs travelling from west to east over their house at a much higher altitude. The document also references an earlier sighting — possibly dating to 1987 — in which the witness observed a red light circling near power lines, which they compared to the front end of KITT from the television series Knight Rider.

The document is heavily redacted throughout. All witness names, specific dates, and precise locations have been removed, making independent verification impossible. The FBI drew no stated conclusion about what the objects were. The record references related files FBI-UAP-D009 and FBI-UAP-PR004, which may contain additional context not available here.</div>
