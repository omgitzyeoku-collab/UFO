  <h1>Two Aircraft and Radar Tracked Fast-Moving Lights Over Colorado</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5adbdddd9ce7ad7add745b88262df4777152b194e86f53f07a0b84e0cf2d3699.jpg" alt="Two Aircraft and Radar Tracked Fast-Moving Lights Over Colorado thumbnail" loading="lazy" />
  <p>An FAA Washington Operations Center report documents a February 2024 incident near Lamar, Colorado, in which two separate aircraft — a private Gulfstream and an American Airlines flight — independently observed three bright, fast-moving lights at approximately 51,000 feet or higher. The objects were detected on air traffic control radar but not on either aircraft&#39;s collision-avoidance system.</p>
  <div class="narr">On 18 February 2024 at 3:20 AM Mountain Standard Time, the crew of a Gulfstream GLF4 (registration N151SD), flying from Las Vegas to Teterboro, New Jersey, reported seeing three bright lights near Lamar, Colorado. The lights were moving very fast and making dramatic vertical and horizontal manoeuvres at an altitude the crew estimated at FL510 or higher — roughly 51,000 feet, well above the ceiling of most commercial and military aircraft. The crew observed the lights for approximately 20 minutes.

Denver ARTCC (Air Route Traffic Control Center) was advised. A second aircraft, American Airlines flight 2514 — an Airbus A321neo en route from San Francisco to Charlotte — independently reported seeing the same lights while cruising at FL350 (about 35,000 feet). The two sightings corroborating each other is notable because multi-witness reports from separate aircraft reduce the likelihood of a single crew&#39;s misperception.

The objects did not appear on either aircraft&#39;s TCAS (Traffic Collision Avoidance System), which detects transponder-equipped aircraft nearby. However, the objects were observed on the ATC facility&#39;s ground-based radar. This distinction matters: TCAS relies on transponder signals, while ground radar can detect objects that lack transponders.

The FAA report is labelled as preliminary information. No follow-up investigation results, weather data, or conclusions about the identity of the objects are included in this document. The incident is catalogued under FAA reference 237UAP00611.</div>
