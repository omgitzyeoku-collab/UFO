  <h1>NRC Had No Way to Track UAPs at Nuclear Plants</h1>
  <div class="meta">
    <span class="badge">NRC</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/6998f486d5208cad5c37d02419f24b95c57e3b546de10fe49f21403bedff1e52.jpg" alt="NRC Had No Way to Track UAPs at Nuclear Plants thumbnail" loading="lazy" />
  <p>A 2023 internal briefing from the Nuclear Regulatory Commission (NRC) reveals the agency had no process, definition, or guidance for reporting Unidentified Anomalous Phenomena (UAP) at nuclear facilities. The document proposes creating separate UAP reporting categories after a new federal law required the NRC to share UAP data with the Pentagon annually.</p>
  <div class="narr">In 2023, the Nuclear Regulatory Commission — the US agency that oversees nuclear power plants and fuel facilities — produced an internal briefing document acknowledging a significant gap in its security reporting. The NRC had no process, no definition, and no guidance for reporting UAP (Unidentified Anomalous Phenomena) at the nuclear sites it regulates. As the document states plainly: the agency had &quot;no idea&quot; whether UAPs were flying over nuclear power plants or Category I fuel cycle facilities, because there was simply no mechanism to capture that information.

The briefing was prompted by the FY-2023 National Defense Authorization Act, which requires the NRC to provide UAP and drone flyover data each year to the Pentagon&#39;s All-domain Anomaly Resolution Office (AARO). AARO first requested this data from the NRC on 1 May 2023, and the NRC&#39;s security division responded on 5 June 2023. The document was led by Daryl Johnson of the Division of Security Operations.

A core problem identified in the briefing is that without separate reporting categories, nuclear facility operators may have been misreporting UAP sightings as drone incidents — or not reporting them at all. At the time, the NRC received 12 to 25 drone flyover reports per year, but had no way to distinguish whether any of those involved something other than a conventional drone. The document also notes that this lack of differentiation could slow down responses to Freedom of Information Act (FOIA) requests.

The briefing defines UAPs as distinct from conventional aircraft by characteristics such as no visible propulsion, no sound, unusual flight manoeuvres, and the ability to operate in both water and air. These are definitional descriptions used to separate UAPs from drones and other known aircraft — they are not claims about specific observed events at nuclear sites.

The document is marked &quot;Publicly Available&quot; and is a policy proposal, not a report of confirmed UAP incidents. It reveals a bureaucratic gap, not evidence of UAP activity near nuclear facilities.</div>
