  <h1>Southwest Airlines crew reported lights above Memphis later linked to Starlink</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7da0b1db2052014ef149c5c988dcf39b20f6c51301bb15a8f6b5bec0f9e0036c.jpg" alt="Southwest Airlines crew reported lights above Memphis later linked to Starlink thumbnail" loading="lazy" />
  <p>An FAA incident report records that a Southwest Airlines Boeing 737 crew saw a string of lights high above their aircraft while flying at 38,000 feet southeast of Memphis on 17 July 2023. The FAA&#39;s own report notes the lights likely correlate with Starlink satellites, and the case was closed with no further investigation.</p>
  <div class="narr">This document is an FAA SKYWATCH Incident Report — a standard form the Federal Aviation Administration uses to log sightings of unidentified aerial phenomena reported by aircrew. It was filed under the primary code &quot;Unidentified Aerial Phenomenon&quot; and assigned case number 237UAP00273.

On 17 July 2023 at 02:36, the crew of Southwest Airlines flight SWA549, a Boeing 737 flying from Fort Myers (RSW) to St. Louis (STL), reported seeing something unusual. The aircraft was heading northwest at flight level 380 (approximately 38,000 feet), about 81 nautical miles southeast of Memphis. The sighting was logged by Memphis Air Route Traffic Control Centre (ZME).

The crew described what they saw as a string of lights positioned high above the aircraft, travelling in an unknown direction. No law enforcement was notified, and the report contains no mention of radar data or other sensor corroboration — the account rests solely on the crew&#39;s visual observation.

The FAA&#39;s own assessment, recorded within the document, states that the string of lights &quot;appears to correlate with Starlink satellites.&quot; The case is marked as closed, with no indication of further investigation. There is little evidence of redaction in the document.</div>
