  <h1>Delta Crew Reports Red Lights Circling at 40,000 Feet Near Denver</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e9bd516f55fa1e25b7e6b020e26f2137fc859a3d53513d4ceb4db8be6ad9c7ae.jpg" alt="Delta Crew Reports Red Lights Circling at 40,000 Feet Near Denver thumbnail" loading="lazy" />
  <p>This FAA incident report documents a December 2023 sighting by the crew of Delta flight DAL750, who observed a group of red lights circling each other at roughly 40,000 feet while flying at 32,000 feet about 50 miles west of Denver. The lights did not appear on air traffic control radar, and the case was closed without explanation.</p>
  <div class="narr">On 23 December 2023 at 03:46 UTC, the crew of Delta Air Lines flight DAL750 — flying northwest from Tampa, Florida to Seattle, Washington — reported an unidentified aerial phenomenon to air traffic control. The aircraft was at flight level 320 (32,000 feet), approximately 50 nautical miles west of Denver, Colorado.

The crew described a group of red lights circling each other off the left side of the aircraft at roughly flight level 400 (40,000 feet) — about 8,000 feet above them. The lights were not detected on the air traffic control facility&#39;s radar system.

The FAA logged the sighting under its SKYWATCH reporting system as case 237UAP00330. The FAA&#39;s Airway Operations office (AWO) was notified. The case is marked as closed, but the report provides no resolution, identification, or explanation for what the crew observed.

No tail number for the aircraft was recorded in the report. The document contains minimal redaction, but it also contains minimal detail — there is no information about how long the crew watched the lights, how many crew members saw them, or whether any other aircraft in the area were asked to confirm the sighting.</div>
