  <h1>DOW-UAP-PR100, Unresolved UAP Report, Yellow Sea, 2023</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2023</span>
    <span class="badge">Yellow Sea</span>
    
  </div>
  
  <p>The United States Indo-Pacific Command submitted a report of an unidentified anomalous phenomenon to the All-domain Anomaly Resolution Office (AARO) consisting of 4 minutes and 57 seconds of video footage from an electro-optical and infrared sensor system aboard a U.S. military platform in 2023.

Video Description: The overall quality of this video footage progressively degrades over its runtime.
00:01-00:08: In infrared mode, the sensor tracks an area of contrast, keeping it generally within the center of the frame.
00:09-01:03: The sensor zooms in and tracks the area of contrast, holding it generally within the center of the frame.
01:04-01:10: The sensor display switches modes to an electro-optical day time television camera feed (a collection mode that displays visible and near infrared signatures). The video features a dark object superimposed against a blue background.
01:11-01:13: The sensor display changes modes to infrared. The area of contrast is no longer visible within the frame.
01:14-02:16: The sensor zooms in and changes contrast settings. An area of contrast is visible near the center of the frame.
02:17-02:22: The area of contrast repeatedly leaves and enters the sensor field-of-view.
02:23-02:46: The sensor reacquires and tracks the area of contrast, keeping it generally within the center of the frame.
02:47-03:27: The sensor zooms in, tracking the area of contrast.
03:28-03:32: The footage appears to “skip,” or lose coherence.
03:33-03:46: The footage returns to its previous state, and the sensor continues to track the area of contrast generally within the center of the frame.
03:47-04:32: The sensor zooms out.
04:33-04:40: The area of contrast repeatedly leaves and enters the sensor field-of-view.
04:41-04:45: No content.

This video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.</p>
