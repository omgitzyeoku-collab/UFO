  <h1>FBI Files Show 1956 UFO Sighting Report and Hoover Denial</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/423b23b3741786f13d58b5dbd2c23eb0f6081fc406fc35482c621baef44b50aa.jpg" alt="FBI Files Show 1956 UFO Sighting Report and Hoover Denial thumbnail" loading="lazy" />
  <p>This batch of FBI documents from around 1956 includes a witness interview about a silent bright light seen near Henderson, North Carolina, a high school student&#39;s letter asking the FBI about an alleged alien contact story from a popular book, and J. Edgar Hoover&#39;s flat denial that any such matter was ever reported to the Bureau. A separate Air Force counter-intelligence letter forwards a document found inside a book in Alaska.</p>
  <div class="narr">This collection of FBI correspondence, dating to roughly 1956, brings together several unrelated UFO-related items that passed through Bureau channels.

The first document summarises an interview conducted on April 6, 1956, with a woman who reported seeing a bright, flickering, silent object while driving near Henderson, North Carolina, around April 5, 1956. She estimated it was at less than 2,500 feet altitude. The account is a single-witness report with no mention of corroboration.

A second strand involves a student at Technical High School in Springfield, Massachusetts, who wrote to the FBI asking whether a story in Harold Wilkins&#39; book *Flying Saucers Uncensored* was true — specifically, a claim that two supposed Venusians visited a Los Angeles journalist in March 1953. FBI Director J. Edgar Hoover replied to the student&#39;s letter (dated February 12, 1956), stating plainly that no such matter was ever reported to the FBI.

The final piece is a US Air Force counter-intelligence letter addressed to Hoover&#39;s FBI, attention Liaison Agent Daniel J. Sullivan. It concerns a letter found inside a book that a Dr. Kennedy — a dentist and private pilot in Alaska who had previously reported to Air Force intelligence — had loaned to a Mr. Small, a typesetter for the Home Nugget newspaper, over a year earlier. Major Greenhalgh of the Intelligence Service Squadron in Seattle handled the matter. The exact contents of the found letter are largely illegible due to severe scan degradation.

Much of this file is in very poor condition. Heavy degradation from low-quality scanning has rendered large portions unreadable, and some text appears intentionally redacted. Several pages appear to be on Miami, Florida hotel letterhead, but their content is almost entirely illegible.</div>
