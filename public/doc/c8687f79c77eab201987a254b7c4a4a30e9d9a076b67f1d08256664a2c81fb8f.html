  <h1>Military Drone Filmed Mystery Object Near Mt. Etna; Agency Says Balloon</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c8687f79c77eab201987a254b7c4a4a30e9d9a076b67f1d08256664a2c81fb8f.jpg" alt="Military Drone Filmed Mystery Object Near Mt. Etna; Agency Says Balloon thumbnail" loading="lazy" />
  <p>A 2025 report from the All-domain Anomaly Resolution Office (AARO) analyzes infrared video from a U.S. military drone that captured a round object apparently flying at high speed near Mt. Etna, Italy in December 2018. AARO concluded with moderate confidence that the object was a small balloon moving at wind speed, and that its seemingly extraordinary behavior was an optical illusion caused by the drone&#39;s own movement.</p>
  <div class="narr">In December 2018, a U.S. military drone equipped with a shortwave infrared camera was operating near Naval Air Station Sigonella in the Mediterranean Sea, south of Sicily, Italy. During a 12-minute recording, a round object appeared in the footage for about four and a half minutes. The drone operator reported the object was traveling at roughly 345 mph at an altitude of 500 feet and appeared to pass through Mt. Etna&#39;s volcanic ash plume.

AARO&#39;s analysis reached very different conclusions. The agency assessed the object was actually at about 15,000 feet altitude, moving at approximately 24 mph — consistent with local wind speed — and was roughly 170 kilometers (106 miles) away from the volcanic plume, not passing through it. AARO identified the object as a spherical balloon about one foot in diameter. The apparent high speed, the agency said, was caused by motion parallax — an optical effect where a slow-moving object appears to move fast when viewed from a moving platform. AARO built a trajectory model that accurately predicted where the object would appear later in the video, supporting the wind-speed conclusion.

Not all analysts agreed. One AARO partner initially assessed speeds up to 3,400 mph and concluded the object had transited the volcano&#39;s ash plume — a dramatically different reading of the same footage. A bird hypothesis was also considered and rejected; flickering in the video that resembled wing flapping was attributed to thermal turbulence and processing artifacts rather than an actual bird.

AARO&#39;s final assessment: moderate confidence the object was a balloon, and high confidence it did not exhibit anomalous flight characteristics. The report was cleared for publication on April 28, 2025, and AARO itself notes it should not be considered finished intelligence.</div>
