  <h1>WWII Night Fighters Reported Unexplained Lights Over Germany in 1944–1945</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">3/18/45</span>
    <span class="badge">Germany</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/cc709f89f3f3de832ee3979817a3c716727dd03c2f4fe26a545f1904b29fd467.jpg" alt="WWII Night Fighters Reported Unexplained Lights Over Germany in 1944–1945 thumbnail" loading="lazy" />
  <p>This collection of U.S. and British military cables from early 1945 documents repeated encounters by the 415th Night Fighter Squadron with unexplained lights — nicknamed &#39;foofighters&#39; — that followed Allied aircraft over Germany. A separate incident involved an unidentified cylindrical object attacked at 9,000 feet. The British Air Ministry acknowledged the phenomena remained &#39;something of a mystery&#39; with no definitive explanation.</p>
  <div class="narr">Between December 1944 and January 1945, aircrews of the 415th Night Fighter Squadron reported a series of encounters with strange lights while flying night missions over France and Germany. The lights blinked on and off, changed colors, flew in formation with Allied planes, and appeared to be under intelligent control. Combat crews gave them an informal name: foofighters. The sightings were frequent enough that pilots and crews were described as &#39;becoming slightly worried,&#39; and the reports worked their way up the chain of command — from the squadron to XII Tactical Air Command, to First Tactical Air Force, to Supreme Headquarters Allied Expeditionary Force (SHAEF), and ultimately to the British Air Ministry.

In a separate incident on 1 March 1945, a crew reported an aluminum-colored cylindrical object roughly 12 feet long and 1 foot in diameter, floating vertically at 9,000 feet with small fins and a mast projecting from its lower end. The object was attacked and partially deflated, producing a red flame without smoke, but it did not disintegrate. The 107th Photo Reconnaissance Squadron attempted to photograph similar cylindrical objects, but the photos were unsuccessful.

Ground control intercept (GCI) radar was checked during foofighter encounters, but controllers reported no unidentified aircraft in the area. RAF Bomber Command crews had independently been reporting similar phenomena. The Air Ministry suggested that some sightings might be Me 262 jet aircraft or flak rockets, but explicitly acknowledged that these explanations were uncertain. Their formal assessment stated: &#39;The whole affair is still something of a mystery and the evidence is very sketchy and varied so that no definite and satisfactory explanation can yet be given.&#39;

SHAEF took the reports seriously enough to conclude that, given the number of independent accounts, &#39;there must be something more than mere imagination behind the matter.&#39; The file includes cables and memorandums involving officers from multiple commands, but no final resolution or follow-up investigation appears in the documents.</div>
