  <h1>FedEx Cargo Crew Reported Three Unexplained Lights Over Southwest Florida</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/572b06672cb5f88a6da7cfb469e069f996c4bc12f32d4fec966ed5248fe5d4de.jpg" alt="FedEx Cargo Crew Reported Three Unexplained Lights Over Southwest Florida thumbnail" loading="lazy" />
  <p>This FAA operations center notification documents a UAP sighting by the crew of FedEx flight 3184, a Boeing 767-300 cargo aircraft, on November 21, 2023. The crew described three lights arranged vertically and horizontally while flying at 14,000 feet near Fort Myers, Florida. No evasive action was taken and no follow-up investigation is included in the record.</p>
  <div class="narr">On the evening of November 21, 2023, the crew of FedEx flight 3184 — a Boeing 767-300 cargo aircraft flying from Fort Worth to Fort Lauderdale — reported seeing an unidentified aerial phenomenon to Miami ARTCC (Air Route Traffic Control Center). The sighting occurred at 6:40 PM Eastern time while the aircraft was at 14,000 feet, approximately 36 nautical miles east-southeast of Southwest Florida International Airport near Fort Myers.

The crew described the UAP as three lights arranged vertically and horizontally, visible from the 11 o&#39;clock position relative to the aircraft while heading east-southeast. The crew did not take evasive action, and law enforcement was not notified of the incident.

This document is an FAA Washington Operations Center incident notification — essentially a preliminary intake form, not an investigation report. It records the basic facts of what was reported but includes no radar data, no photographs, and no follow-up analysis. The FAA did not reach any conclusion about what the lights were.

The record contains no redactions of note. It appears to be a hastily drafted notification, as evidenced by the phrasing &quot;LEO WERE NOT NOTIFICATION&quot; — an apparent typo for &quot;notified.&quot; The coordinates place the sighting over the Gulf of Mexico approaches to southwest Florida.</div>
