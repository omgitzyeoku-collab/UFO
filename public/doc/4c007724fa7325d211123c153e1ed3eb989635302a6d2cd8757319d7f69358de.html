  <h1>DOE Report Documents Unidentified Object at Pantex Nuclear Weapons Plant</h1>
  <div class="meta">
    <span class="badge">Department of Energy</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/4c007724fa7325d211123c153e1ed3eb989635302a6d2cd8757319d7f69358de.jpg" alt="DOE Report Documents Unidentified Object at Pantex Nuclear Weapons Plant thumbnail" loading="lazy" />
  <p>The Department of Energy released a heavily redacted incident report documenting an unidentified object observed at the Pantex nuclear weapons facility in Texas. The imagery was captured by a ground surveillance radar tower and enhanced by Sandia National Laboratories, but nearly all content — including the images themselves — is withheld under a nuclear security exemption.</p>
  <div class="narr">This document is a &quot;Pantex Unidentified Object Incident Report&quot; from the Department of Energy. Pantex is the United States&#39; primary nuclear weapons assembly and disassembly facility, operated by Consolidated Nuclear Security, LLC. The report documents an object that was captured on imagery from a ground surveillance radar tower at the plant.

The imagery was considered significant enough that Sandia National Laboratories — a major federal research lab — was brought in to produce enhanced images of the object. That inter-laboratory involvement suggests the incident was taken seriously within the DOE&#39;s nuclear security apparatus.

However, the document is almost entirely redacted. Only pages 5 and 6 of the six-page report are represented in the released version, and even those pages contain little beyond page headers and image captions. All imagery, narrative descriptions, dates, and conclusions have been withheld under the (b)(3) UCNI exemption — &quot;Unclassified Controlled Nuclear Information,&quot; a DOE-specific classification used to protect nuclear security details.

No date or time for the incident is available. No description of the object&#39;s appearance, behavior, or size survives the redactions. The document tells us that something was seen, that it was documented and analyzed, but nothing about what it was or what the DOE concluded about it.</div>
