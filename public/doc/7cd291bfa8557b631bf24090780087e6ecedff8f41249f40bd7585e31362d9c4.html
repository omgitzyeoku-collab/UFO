  <h1>FAA Report Documents Pilot Sighting of Bright Rotating Lights in 2022</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/7cd291bfa8557b631bf24090780087e6ecedff8f41249f40bd7585e31362d9c4.jpg" alt="FAA Report Documents Pilot Sighting of Bright Rotating Lights in 2022 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report records a general aviation pilot&#39;s sighting of an unidentified aerial phenomenon on 11 November 2022. The pilot, flying at 3,000 feet near airport 3T5, observed bright rotating lights roughly the size of a small aircraft moving southwest at high speed. The case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed on 11 November 2022 at 02:22. It records a sighting by the pilot of aircraft N1439X, a general aviation PA28, who reported an unidentified aerial phenomenon while flying westbound at 3,000 feet, approximately 10 nautical miles southeast of airport 3T5.

The pilot described the object as having bright rotating lights, roughly the size of a Cessna 172 (a common single-engine aircraft about 8 metres long). It was travelling southwest at a high rate of speed at approximately 4,000 feet — about 1,000 feet above the reporting aircraft. The sighting was logged through FAA facility I90 (a Terminal Radar Approach Control facility), and an entity identified as &quot;TY&quot; was notified.

The report is marked as closed. No resolution, explanation, or identification of the phenomenon is provided in the document. There is no mention of corroborating radar data, additional witnesses, or follow-up investigation.

The document lists the point of departure as DEN and the origin airport as 3T5. No tail number for the observed object or operator details beyond &quot;General Aviation&quot; for the reporting aircraft are recorded. The level of redaction in this document appears low — it is a brief, routine incident form rather than a heavily censored file.</div>
