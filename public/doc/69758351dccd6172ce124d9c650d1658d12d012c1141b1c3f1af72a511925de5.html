  <h1>Spirit Airlines crew reported silver object above their A320 near Houston</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/69758351dccd6172ce124d9c650d1658d12d012c1141b1c3f1af72a511925de5.jpg" alt="Spirit Airlines crew reported silver object above their A320 near Houston thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a Spirit Airlines A320 crew observing a silver, business-jet-sized object less than 1,000 feet above them at 32,000 feet, roughly 110 nautical miles southeast of Houston on 4 February 2024. The object did not appear on air traffic control radar, and the case was closed without further investigation.</p>
  <div class="narr">This is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unidentified aerial phenomenon (UAP) sightings reported by aircrew. It was filed under case number 237UAP00351.

On 4 February 2024, the crew of Spirit Airlines flight NKS1337, an Airbus A320 flying from Cancún (MMUN) to Houston (IAH), reported a UAP while cruising at Flight Level 320 (approximately 32,000 feet). The aircraft was about 110 nautical miles southeast of Houston Intercontinental Airport at the time.

The crew described the object as silver and roughly the size of a small business jet, passing less than 1,000 feet above their aircraft. Air traffic control confirmed the object was not visible on their radar system. The Aviation Weather Office (AWO) was notified.

The FAA marked the case as closed. There is no indication in the document of any follow-up investigation, resolution, or identification of the object. The report is based entirely on the flight crew&#39;s visual observation — no corroborating sensor data exists in the record.</div>
