  <h1>FBI Agents Report Unexplained Lights Near a Pond in Late 2024</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">November, 2024</span>
    <span class="badge">Northeastern United States</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f5cfb310e3064e34c55c4b1a256285da71050915ff3559ea70529b101f248c5c.jpg" alt="FBI Agents Report Unexplained Lights Near a Pond in Late 2024 thumbnail" loading="lazy" />
  <p>An FBI internal report documents two special agents who personally observed unexplained pulsating and moving lights at treetop level during a planned field visit to a witness&#39;s property in the northeastern United States in November 2024. The document is heavily redacted, with all names, specific locations, and exact dates removed.</p>
  <div class="narr">This document is an FBI FD-1057 electronic communication — a standard internal reporting form — filed after two FBI special agents visited a civilian witness&#39;s property somewhere in the northeastern United States in November 2024. The purpose of the visit was to follow up on UAP (Unidentified Aerial Phenomenon) reports and video the witness had been submitting to the FBI over the previous three years.

The agents arrived at approximately 4:45pm in overcast, 48-degree weather with no rain. Shortly after, one agent observed a white pulsating light appear near the northern edge of a pond. It moved horizontally with erratic movements and lasted less than ten seconds. The light appeared at or below treetop level and did not reflect off the water or illuminate the area beneath it. Additional white and blue pulsing lights were later seen at treetop height in the tree line, along with plumes of broad light followed by red or white flashes.

At approximately 5:30pm, both agents simultaneously observed what they described as a bright white light above a bright red light hovering at treetop height at the far end of the pond. The paired lights moved quickly from right to left, disappeared, then reappeared at their original position before repeating the movement and vanishing again. The agents ended their observation at roughly 6:10pm and departed by 6:15pm. Five photos were taken, but they were mostly blurry due to long exposure times without a tripod, providing little useful documentation.

The document does not offer any conclusions about what the lights were. It records the observations without attempting to explain or classify them. The FBI has not publicly stated what, if anything, resulted from this visit or the broader investigation suggested by related documents in the same series (FBI-UAP-D004 through D008).</div>
