  <h1>Pilot Reports Pulsating Lights at 45,000 Feet Over Tennessee</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3137208de7f9c3e22ea05e02c2f9ad53070e454d10fffe53708bf7e73396302b.jpg" alt="Pilot Reports Pulsating Lights at 45,000 Feet Over Tennessee thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH report documents a general aviation pilot&#39;s sighting of white and orange pulsating lights while flying at 45,000 feet near Knoxville, Tennessee on 28 August 2022. The case was closed with no public explanation of what the lights were.</p>
  <div class="narr">On 28 August 2022 at 04:25, the pilot of a general aviation aircraft with callsign N1TK was flying northbound at 45,000 feet on a route from Palm Beach, Florida (PBI) to Fort Wayne, Indiana (FWA). While approximately 35 nautical miles southeast of the Knoxville VOR navigational point in Tennessee, the pilot observed something unusual.

The pilot reported seeing a series of white and orange pulsating lights that appeared to be orbiting above the horizon, estimated at roughly 50 nautical miles to the left of the aircraft. The sighting was logged through the FAA&#39;s SKYWATCH incident reporting system under the jurisdiction of the Atlanta Air Route Traffic Control Centre (ZTL).

The report notes that &quot;AWO advised&quot; — meaning an Aviation Weather Office was notified — but no details are provided about what AWO determined or communicated back. The case status is listed as &quot;Closed,&quot; with no follow-up investigation details or resolution included in the document.

This is a single-page FAA incident record. It contains no radar data, no sensor corroboration, and no explanation of what the pilot saw. The 50-nautical-mile distance to the lights is the pilot&#39;s own estimate, not an instrument measurement.</div>
