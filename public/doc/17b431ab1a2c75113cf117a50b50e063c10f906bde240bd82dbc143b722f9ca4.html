  <h1>Delta Pilots Spotted Unidentified Silver Balloon at 42,000 Feet Over Montana</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/17b431ab1a2c75113cf117a50b50e063c10f906bde240bd82dbc143b722f9ca4.jpg" alt="Delta Pilots Spotted Unidentified Silver Balloon at 42,000 Feet Over Montana thumbnail" loading="lazy" />
  <p>An FAA incident report records that the crew of a Delta Air Lines Boeing 737-900, flying from Seattle to Detroit on 1 February 2023, observed a large silver balloon between 42,000 and 45,000 feet near Glacier Park International Airport in Montana. Air traffic control confirmed no known balloon operations in the area, and the case was closed as an unidentified aerial phenomenon.</p>
  <div class="narr">On 1 February 2023, the crew of Delta Air Lines flight DAL573 — a Boeing 737-900 flying eastbound from Seattle to Detroit — reported seeing a large silver balloon off the left side of their aircraft. The crew was cruising at 33,000 feet; the object appeared to be significantly higher, between 42,000 and 45,000 feet. The sighting occurred roughly 30 nautical miles south of Glacier Park International Airport (FCA) in Montana.

The report was filed through the FAA&#39;s SKYWATCH system and handled by Salt Lake City Center (ZLC), the air traffic control facility covering that airspace. ZLC checked with its weather office and traffic management unit and found no reports of any balloon airborne in the area. No evasive action was taken by the aircraft.

The FAA classified the incident under its primary code of &quot;Unidentified Aerial Phenomenon&quot; and closed the case. The document notes that personnel identified only by the initials TY/JH were notified. No further investigation or resolution is described in the report.

This incident took place on the same day the widely reported Chinese surveillance balloon was tracked over the continental United States in early February 2023, though this FAA report makes no mention of that connection. The document itself does not identify the object or attribute it to any source.</div>
