  <h1>Commercial Pilot Reports Stationary Lights Above 37,000 Feet Near Florida</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a4eb40ab902b059568962c06583d40f0f78363fec1ed1af438bbd51a1bc7468d.jpg" alt="Commercial Pilot Reports Stationary Lights Above 37,000 Feet Near Florida thumbnail" loading="lazy" />
  <p>This FAA incident report documents a commercial pilot&#39;s sighting of stationary lights resembling a Christmas ornament while flying at 37,000 feet on 24 November 2023, approximately 70 nautical miles east of Melbourne, Florida. The object was not detected on air traffic control radar, and the FAA closed the case without explanation.</p>
  <div class="narr">On 24 November 2023 at 00:12 UTC, a commercial flight operating under callsign FFT31 — a Frontier Airlines service travelling from Santo Domingo (MDSD) to Atlanta (ATL) — reported an unidentified aerial phenomenon to air traffic control. The aircraft was flying northwest at FL 370 (37,000 feet), roughly 70 nautical miles east of Melbourne, Florida, when the crew observed something unusual off the left side of the aircraft.

The pilot described the object as stationary straight lights resembling a Christmas ornament, positioned much higher than the aircraft&#39;s own altitude of 37,000 feet. No further details about the duration of the sighting or the number of witnesses aboard are recorded in the document.

Air traffic control checked their radar systems and found nothing. The report states plainly: the UAP was not observed on ATC facility radar. No tail number for the reporting aircraft was recorded in the file.

The FAA filed this under its SKYWATCH incident reporting system and marked the case as closed. No resolution, identification, or explanation for the observed phenomenon is provided in the document. The incident location is listed only by reference to nearby facilities (DEN, ZMA, MLB) rather than precise coordinates.</div>
