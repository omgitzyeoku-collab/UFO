  <h1>United Airlines crew reported erratic lights over Illinois in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/bc434f1e3c35bc7761505a144c19e6378fbb79beece2d1b059ef47c4e2a65057.jpg" alt="United Airlines crew reported erratic lights over Illinois in 2023 thumbnail" loading="lazy" />
  <p>An FAA operations center report documents the crew of United Airlines flight 1605 observing unidentified lights moving erratically off the left side of their aircraft while cruising at 35,000 feet over western Illinois on 23 December 2023. Air traffic control radar did not detect anything at the reported location.</p>
  <div class="narr">This document is an incident log from the FAA&#39;s Washington Operations Center recording a pilot-reported unidentified anomalous phenomenon (UAP). It is a preliminary operations center entry, not a full investigation report.

On 23 December 2023 at 05:35 CST, the crew of United Airlines flight 1605 — an Airbus A320 flying from Los Angeles (LAX) to Baltimore-Washington (BWI) — reported seeing something unusual. While eastbound at flight level 350 (roughly 35,000 feet), approximately 80 nautical miles west of Springfield, Illinois, the crew observed lights off the left side of the aircraft. The lights were described as moving erratically and travelling in random directions at an unknown altitude.

The sighting was relayed through Kansas City Air Route Traffic Control Center (ARTCC). Controllers checked their radar but the object was not observed on air traffic control radar. The coordinates logged in the report (39.83°N, 91.18°W) place the incident in western Illinois near the Missouri border, consistent with the stated location.

The document does not contain any conclusions about what the lights were. There is no indication of a follow-up investigation, no estimate of the object&#39;s size, distance, or altitude, and no corroborating reports from other aircraft or ground observers. The report shows minimal redaction.</div>
