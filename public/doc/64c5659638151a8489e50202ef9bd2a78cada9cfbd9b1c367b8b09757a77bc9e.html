  <h1>American Airlines Crew Reported High-Altitude Balloon in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/64c5659638151a8489e50202ef9bd2a78cada9cfbd9b1c367b8b09757a77bc9e.jpg" alt="American Airlines Crew Reported High-Altitude Balloon in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of American Airlines flight 769 on 3 February 2023: a large balloon estimated at 50,000 feet or above, observed while the aircraft was cruising at 32,000 feet en route from Chicago to Phoenix. The case was closed with no identification or resolution noted.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unidentified aerial phenomenon sightings reported by pilots and air traffic controllers. It was filed through the Denver Air Route Traffic Control Center (ZDV).

On 3 February 2023 at 14:35, the crew of American Airlines flight 769, an Airbus A321 flying westbound from Chicago O&#39;Hare (ORD) to Phoenix (PHX), reported a large balloon off the right side of their aircraft. The plane was at flight level 320, roughly 32,000 feet, approximately 30 nautical miles west of the RBA navigational fix. The crew estimated the balloon was at flight level 500 — around 50,000 feet — or higher.

The report is classified under the FAA&#39;s primary code for &quot;Unidentified Aerial Phenomenon.&quot; It carries a status of Closed, but the document contains no explanation of what the object was, no follow-up investigation notes, and no corroborating evidence such as radar data or additional witness accounts.

The timing is notable: early February 2023 was the period when multiple high-altitude balloon sightings were reported across the United States, including the widely publicised Chinese surveillance balloon that was ultimately shot down on 4 February 2023. This report does not draw any connection to that incident, but the proximity in date is worth noting as context.

No redactions are evident in the document. The information gaps — no object identification, no radar confirmation, no resolution — appear to reflect the limits of what was recorded rather than deliberate removal of content.</div>
