  <h1>Gulfstream Pilot Reports White Lights Over Atlantic at 41,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/86ab9d34b379e1691e0b950dab70cdd9e61979aa56f4b23829e261b6641fc736.jpg" alt="Gulfstream Pilot Reports White Lights Over Atlantic at 41,000 Feet thumbnail" loading="lazy" />
  <p>This is an FAA incident report from February 2023 documenting a private jet pilot&#39;s sighting of unidentified white lights directly ahead while flying at 41,000 feet over the Atlantic Ocean. The report contains no follow-up investigation, no radar data, and no explanation of what was observed.</p>
  <div class="narr">On February 18, 2023, the pilot of a Gulfstream GLF4 business jet (registration N926TT) reported seeing an unidentified aerial phenomenon while flying from Van Nuys, California, to Vieux Fort, St Lucia. The aircraft was heading southeast at flight level 410 — roughly 41,000 feet — over the Atlantic Ocean, approximately 30 nautical miles south of a navigational point called the AMNDA fix.

The pilot described white lights at their 12 o&#39;clock position, meaning directly ahead of the aircraft. Jacksonville Air Route Traffic Control Center (ARTCC) was the controlling air traffic facility at the time. No evasive action was taken, and no law enforcement was notified.

The sighting was logged by the FAA&#39;s Washington Operations Center as part of its standard incident reporting process. The document is a short, structured form — not a detailed investigation. It records the basic facts of the report and nothing more.

Notably, the document contains no radar data, no corroborating witness accounts, no description of the object&#39;s size, shape, or movement beyond &quot;white lights,&quot; and no follow-up investigation or resolution. A formatting error in the original document mislabels the longitude field as &quot;Latitude.&quot;</div>
