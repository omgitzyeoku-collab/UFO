  <h1>UPS Cargo Crew Reports Bright Lights Above 37,000 Feet Over Pennsylvania</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/697480a437a8ecb6e1f320095ace7ebad2a5c0f0e52ded624ec0008421115469.jpg" alt="UPS Cargo Crew Reports Bright Lights Above 37,000 Feet Over Pennsylvania thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of UPS flight 1016, a Boeing 767 flying from Louisville to Boston on 10 February 2023. The crew reported bright lights well above their cruising altitude of 37,000 feet over northeastern Pennsylvania. The FAA marked the case as closed with no explanation provided.</p>
  <div class="narr">On 10 February 2023 at 08:30, the crew of UPS flight 1016 — a Boeing 767 cargo aircraft flying from Louisville (SDF) to Boston (BOS) — reported an unidentified aerial phenomenon to air traffic control. The aircraft was heading northeast at flight level 370 (37,000 feet) when the crew observed bright lights directly ahead of them, in the 12 o&#39;clock position, well above their altitude.

The sighting occurred near coordinates 41.27°N / 76.25°W, which places the aircraft over northeastern Pennsylvania. The report was filed through the FAA&#39;s SKYWATCH system and routed to facility ZNY (New York Center). FAA Technical Operations was notified of the incident.

The case is marked as closed. The FAA record contains no resolution, no identification of the lights, and no mention of corroborating radar or sensor data. No tail number was recorded for the aircraft, which limits independent verification.

The document itself is brief and administrative in nature — a standard FAA incident form rather than an investigation report. It records what the crew said they saw but does not offer any analysis or follow-up findings.</div>
