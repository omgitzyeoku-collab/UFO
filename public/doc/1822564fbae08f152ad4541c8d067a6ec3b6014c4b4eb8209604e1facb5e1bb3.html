  <h1>U.S. Surveillance Flight Over Syria Logged Unidentified Object in May 2022</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">Iraq</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/1822564fbae08f152ad4541c8d067a6ec3b6014c4b4eb8209604e1facb5e1bb3.jpg" alt="U.S. Surveillance Flight Over Syria Logged Unidentified Object in May 2022 thumbnail" loading="lazy" />
  <p>A formerly secret U.S. military mission report documents a 20-hour surveillance flight from Sicily over the Eastern Mediterranean in May 2022. During the mission, the crew observed extensive Russian military activity and spotted a single unidentified aerial phenomenon (UAP) that they were unable to identify, though the object may have been a Russian fighter jet.</p>
  <div class="narr">This document is a U.S. military mission report (MISREP) from the 50th Attack Squadron, operating under U.S. European Command. The aircraft took off from Sigonella Airbase in Sicily on 29 May 2022 and flew a 20-hour, 30-minute intelligence, surveillance, and reconnaissance (ISR) mission over the Eastern Mediterranean, Syria, and Lebanon. The crew collected information on 39 targets and observed 10 essential elements of information during roughly 14 and a half hours on station.

The mission recorded significant Russian military presence. A Slava-class cruiser and a probable Gorshkov-class frigate were seen heading east. An A-50U early-warning aircraft and two IL-38 patrol planes were spotted parked at an airfield. At 2147Z on 29 May, one to three Russian aircraft — including a possible SU-30 fighter — intercepted the U.S. aircraft, approaching within about 5 nautical miles and flying directly beneath it for roughly two minutes. No countermeasures were used by either side, and the crew reported no impact to their mission.

At 0117Z on 30 May, the crew observed a single UAP flying north to northeast. The screener followed the object as long as possible but could not achieve a positive identification. Notably, a probable SU-27/35 fighter had been observed landing at a nearby location about an hour earlier, at 0011Z, and the agency&#39;s own description of this report notes the UAP was described as a &#39;probable SU-27/35&#39; — suggesting the unidentified object may have been a Russian military aircraft rather than something unexplained. The report remains formally unresolved.

The document was originally classified SECRET and releasable to the U.S. and Five Eyes allies, with a scheduled declassification date of 2047. It was declassified early on 8 October 2025 by Major General Richard A. Harrison, USCENTCOM Chief of Staff. Heavy redactions remain throughout: the aircraft type, callsign, tail number, specific coordinates, operation name, and personnel names are all blacked out.</div>
