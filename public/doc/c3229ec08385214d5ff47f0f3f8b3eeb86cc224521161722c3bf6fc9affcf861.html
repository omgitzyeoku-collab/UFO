  <h1>FAA Report: Pilot Spotted Apparent Jet Pack at 11,500 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/c3229ec08385214d5ff47f0f3f8b3eeb86cc224521161722c3bf6fc9affcf861.jpg" alt="FAA Report: Pilot Spotted Apparent Jet Pack at 11,500 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a general aviation pilot&#39;s sighting of an object described as a jet pack with red and green lights at 11,500 feet altitude on 29 August 2021. The pilot manoeuvred to avoid the object, the sighting was reported, and the case was closed with no resolution or follow-up findings documented.</p>
  <div class="narr">On 29 August 2021 at 16:46, a general aviation pilot flying a CRUZ aircraft (callsign N140BF) reported an unidentified aerial phenomenon while heading southeast at 11,500 feet. The aircraft was approximately 33 nautical miles east of FFU, bound for destination 69V.

The pilot described the object as a jet pack displaying red and green lights. The aircraft manoeuvred south to avoid it, and the relevant authority (AWO/RT) was notified of the encounter.

The FAA classified the report under its primary code of &quot;Unidentified Aerial Phenomenon&quot; through its SKYWATCH reporting system. The case status is marked as Closed, but notably, no resolution or follow-up findings appear in the record. There is no indication that the object was ever identified.

The report is a single-page incident log rather than a detailed investigation file. It records the pilot&#39;s account but does not reference any corroborating evidence such as radar data or additional witness statements.</div>
