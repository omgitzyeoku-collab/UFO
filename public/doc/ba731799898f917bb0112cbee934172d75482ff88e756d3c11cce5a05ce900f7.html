  <h1>FAA Report: Pilot Spotted Large Balloon at 50,000 Feet in February 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ba731799898f917bb0112cbee934172d75482ff88e756d3c11cce5a05ce900f7.jpg" alt="FAA Report: Pilot Spotted Large Balloon at 50,000 Feet in February 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a SkyWest Airlines pilot sighting of a large unidentified balloon at approximately 50,000 feet on 3 February 2023. The crew was flying northbound at 37,000 feet on a route from Oklahoma City to Minneapolis–St. Paul when they observed the object roughly 30 nautical miles west of RBA. The case was classified as an &quot;Unidentified Aerial Phenomenon&quot; and marked closed with no resolution details provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed on 3 February 2023 under the classification &quot;Unidentified Aerial Phenomenon.&quot; It records a sighting by the crew of SkyWest flight SKW3758, operating a scheduled route from Oklahoma City (OKC) to Minneapolis–St. Paul (MSP).

The crew reported observing a large balloon off the right side of their aircraft while flying northbound at flight level 370 (37,000 feet), approximately 30 nautical miles west of RBA. They estimated the balloon was at roughly flight level 500 — around 50,000 feet — or higher.

The timing is notable: early February 2023 coincided with a wave of high-altitude balloon sightings across the United States, several of which led to military shoot-downs. While the crew described the object as a &quot;balloon,&quot; that was their characterisation — the report does not include any radar data, sensor confirmation, or independent corroboration of what the object was.

The FAA marked the case as closed. No follow-up investigation details or explanation of the resolution appear in the document.</div>
