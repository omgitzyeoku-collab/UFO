  <h1>FBI Interview Records UAP Sighting at US Test Site</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/29ed0fb7cbe0be3c23965212bb83c58d3890a0de9253938ee4e9c9bb2349d5fe.jpg" alt="FBI Interview Records UAP Sighting at US Test Site thumbnail" loading="lazy" />
  <p>This FBI witness interview report (FD-302 form) documents a first-hand account of an unidentified aerial phenomenon seen at a US test site in September 2023. The witness described an object of constant size and light intensity in airspace that had been restricted for drone testing, and reported disturbed sleep and unusual dreams in the days that followed.</p>
  <div class="narr">This document is page 2 of a two-page FBI FD-302 — a standard witness interview form used by the Bureau to record statements. It captures one person&#39;s account of seeing an unidentified object at a US test site on or around 1 September 2023. The first page, which would contain initial context, is not included.

The witness said the object stayed the same size and maintained the same light intensity for the entire time they watched it. No interference with the witnesses&#39; vehicles was noticed. Notably, the airspace at the site had been restricted at the time for scheduled drone tests, and the witness said she was initially annoyed when she saw the object because it appeared to be violating that restriction. A person in a second vehicle tried to get someone else to see the object but was unsuccessful.

That same night, a storm knocked out the TV in the witness&#39;s hotel room. The witness reported having weird dreams and trouble sleeping for two nights after the sighting, and checked hotel TVs during the storm out of anxiety.

The document is heavily redacted: all witness names, specific dates, and location details have been blacked out. The FBI does not state any conclusion about what the object was. No sensor data, photographs, or independent verification of the sighting is mentioned in this page.</div>
