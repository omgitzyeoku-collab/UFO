  <h1>United Airlines Pilot Reported Hovering Lights Over Montana in 2019</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/27bd2689f947e0de827a01527897fac52c3b7ec36eeb458fe6ed27fff9f3eb58.jpg" alt="United Airlines Pilot Reported Hovering Lights Over Montana in 2019 thumbnail" loading="lazy" />
  <p>An FAA incident report documents a United Airlines pilot observing an unidentified object with red, green, and white lights hovering at roughly 37,000–39,000 feet near Butte, Montana, on 8 February 2019. Air traffic control radar showed no other aircraft in the area.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed under record number 237UAP00388. It records a sighting reported by the pilot in command of United Airlines flight 1104, a Boeing 737 flying from Anchorage, Alaska, to Denver, Colorado.

On 8 February 2019 at 05:26 MST, the pilot reported seeing an unidentified object with red, green, and white lights. The object appeared to be hovering between flight levels 370 and 390 — roughly 37,000 to 39,000 feet — approximately 10 nautical miles southeast of the Coppertown VOR navigational beacon near Butte, Montana. The crew took no evasive action.

Salt Lake City ARTCC (Air Route Traffic Control Center), the radar facility responsible for that airspace, confirmed it did not show any other targets in the area besides United 1104. The FAA&#39;s Air Traffic Security Coordinator provided Salt Lake ARTCC with a UFO call centre telephone number for further reporting.

The document contains no conclusions about what the object was. There is no indication of follow-up investigation findings, additional witness accounts, or photographic evidence. The record appears to have been catalogued or released in 2023, though the underlying event dates to February 2019.</div>
