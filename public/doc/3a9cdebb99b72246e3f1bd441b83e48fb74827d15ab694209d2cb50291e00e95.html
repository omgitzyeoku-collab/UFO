  <h1>Pentagon Email Organized Press Briefing on UAP History Report</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3a9cdebb99b72246e3f1bd441b83e48fb74827d15ab694209d2cb50291e00e95.jpg" alt="Pentagon Email Organized Press Briefing on UAP History Report thumbnail" loading="lazy" />
  <p>This document is an internal Pentagon email from March 5, 2024, inviting selected journalists to an embargoed press roundtable about AARO&#39;s first historical report on U.S. government UAP-related programs. It contains no UAP findings — it is purely a media coordination email arranging logistics for the briefing.</p>
  <div class="narr">This document is an email sent on March 5, 2024, by Sue Gough of Defense Press Operations to a select group of journalists. It invited them to an embargoed roundtable the following day — March 6, 2024, at 3 p.m. EST in the Pentagon Briefing Room — led by Tim Phillips, the acting director of AARO (the All-domain Anomaly Resolution Office).

The subject of the briefing was AARO&#39;s Historical Record Report Volume 1 (HRRV1), described as the first volume of a congressionally directed report examining U.S. government programs related to unidentified anomalous phenomena (UAP). The roundtable was on-record but off-camera, and all reporting was embargoed until the Department of Defense publicly released the unclassified version of the report on March 8, 2024. Journalists who agreed to the embargo would receive an advance copy on the morning of March 6 to read before the session.

The email was marked &quot;off the record / for planning purposes only / not for daybooks,&quot; meaning it was not intended for public disclosure. Attendance was restricted to one person per outlet, and the invitation was not transferable. Journalists were required to reply stating &quot;I agree to the embargo&quot; in order to attend and receive the report.

The BCC list on the email reveals the specific reporters selected for early access, including journalists from several major outlets. This shows the Pentagon managed a controlled media rollout for the HRRV1 report rather than releasing it cold.

Critically, this document contains no substantive information about UAP sightings, investigations, or conclusions. It is an administrative email about scheduling a press event.</div>
