  <h1>Delta crew reported stationary unlit object at 34,000 feet over Nebraska</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/51efd6339cd1f889272f97656f124474cfc1b22ddd6d5e940ed79f280ce9af35.jpg" alt="Delta crew reported stationary unlit object at 34,000 feet over Nebraska thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH report documents a Delta Air Lines crew (flight DAL2230) observing an unidentified object while flying westbound at 34,000 feet near North Platte, Nebraska, on 28 July 2022. The object was stationary, had no lights, and passed beneath the aircraft before its colour or size could be determined. The case was closed with no follow-up investigation indicated.</p>
  <div class="narr">This is an FAA SKYWATCH incident report — a standard form the Federal Aviation Administration uses to log unusual aerial sightings reported by pilots. It covers an event on 28 July 2022 at 01:50, involving Delta flight DAL2230, an Airbus A321 flying from Detroit (DTW) to Salt Lake City (SLC).

While heading westbound at flight level 340 (approximately 34,000 feet), the crew reported an unidentified aerial phenomenon directly ahead at their 12 o&#39;clock position, roughly 35 miles southeast of North Platte Regional Airport (LBF) in Nebraska. The object was described as stationary and untethered with no lights. It passed underneath the aircraft before the crew could determine its colour or size.

The FAA classified the operator as commercial and logged the report through standard channels. The case status is listed as closed, with no indication of any follow-up investigation, additional sensor review, or resolution. No radar data or other corroborating evidence is mentioned in the document.

Notably, the report header lists a 2022 date while the metadata from the broader release assigns a 2023 incident year. The more specific date in the source text — 28 July 2022 — is likely accurate. The report contains minimal redaction and is a straightforward single-page incident log.</div>
