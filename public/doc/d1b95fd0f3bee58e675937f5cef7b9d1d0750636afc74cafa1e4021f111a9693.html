  <h1>Airline Crew Reports Objects Dogfighting at 50,000 Feet Over Pacific</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/d1b95fd0f3bee58e675937f5cef7b9d1d0750636afc74cafa1e4021f111a9693.jpg" alt="Airline Crew Reports Objects Dogfighting at 50,000 Feet Over Pacific thumbnail" loading="lazy" />
  <p>An FAA operations center log from January 2024 records a commercial airline crew on a Taipei-to-San Francisco flight reporting what appeared to be aircraft dogfighting at approximately 50,000 feet over the open Pacific Ocean. Air traffic control confirmed no corresponding objects appeared on radar.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report logged on 27 January 2024. It records a UAP (unidentified aerial phenomenon) sighting reported by the crew of EVA Air flight 008, a China-registered aircraft flying westbound from Taipei, Taiwan to San Francisco at Flight Level 370 (approximately 37,000 feet).

The crew reported seeing what they described as aircraft dogfighting at Flight Level 500 (approximately 50,000 feet), directly ahead of their aircraft at the 12 o&#39;clock position. The sighting occurred roughly 450 nautical miles west of San Francisco, over the open Pacific Ocean, at coordinates 37.33 latitude, -130.56 longitude.

Oakland ARTCC (Air Route Traffic Control Center) was advised of the report. Air traffic control reported that no UAP was observed on their radar, meaning whatever the crew saw did not register on ground-based radar systems.

The document is a preliminary operations center log entry rather than a full investigation report. No conclusion is drawn about what the crew observed, and no follow-up investigation is documented in this record. Redaction levels are low — the report appears largely intact.</div>
