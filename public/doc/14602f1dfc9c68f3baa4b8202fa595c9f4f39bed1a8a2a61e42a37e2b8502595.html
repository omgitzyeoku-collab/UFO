  <h1>United Airlines Crew Reported Flashing Lights Above Their 757 Over Kansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/14602f1dfc9c68f3baa4b8202fa595c9f4f39bed1a8a2a61e42a37e2b8502595.jpg" alt="United Airlines Crew Reported Flashing Lights Above Their 757 Over Kansas thumbnail" loading="lazy" />
  <p>This FAA incident report documents a United Airlines crew observing red, green, and white lights fading in and out high above their aircraft while flying at 39,000 feet over Kansas in December 2022. The report itself notes the lights were possibly satellites, and the case was closed without further analysis.</p>
  <div class="narr">On 17 December 2022, the crew of United Airlines flight UAL2247 — a Boeing 757-200 flying from San Francisco to Washington Dulles — reported an unidentified aerial phenomenon to the FAA. The aircraft was cruising eastbound at approximately 39,000 feet, about 118 nautical miles west of Kansas City, when the crew observed red, green, and white lights fading in and out high above them.

The sighting was logged under the FAA&#39;s SKYWATCH programme, which tracks pilot-reported aerial phenomena. A Mandatory Occurrence Report was initiated, and the incident was assigned the identifier ZKC-M-2022/12/17-0001. The report itself includes a note suggesting the lights were possibly satellites.

The FAA marked the case as closed. No resolution, follow-up analysis, or additional investigation is included in the document. There is no mention of corroborating radar data, sensor recordings, or reports from other aircraft.

The document is a single-page administrative record rather than an investigative file. It records the basic facts of the sighting — who reported it, where, when, and what they saw — but offers no conclusion beyond the crew&#39;s own suggestion that satellites may have been the explanation.</div>
