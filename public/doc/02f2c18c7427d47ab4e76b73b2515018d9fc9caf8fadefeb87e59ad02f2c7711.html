  <h1>Oak Ridge Lab Found Alleged UAP Crash Metal Is Terrestrial</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>The All-Domain Anomaly Resolution Office (AARO) commissioned Oak Ridge National Laboratory to analyze a layered magnesium-zinc specimen claimed to be from a 1947 UAP crash. The lab concluded the material is terrestrial in origin and that its bismuth layers could not have functioned as a terahertz waveguide, contradicting claims of antigravity properties.</p>
  <div class="narr">In February 2023, Oak Ridge National Laboratory (ORNL) — one of 17 U.S. Department of Energy national labs — received access to a metallic specimen that had been claimed as debris recovered from an unidentified anomalous phenomenon (UAP) crash in or around 1947. The analysis was commissioned by AARO, the All-Domain Anomaly Resolution Office, a congressionally mandated body founded in 2022 to investigate UAP incidents. ORNL received one parent sample and three previously derived subsamples, all from the same material.

The specimen turned out to be roughly 97.5% magnesium and 2% zinc, with thin bands containing bismuth and lead in an approximate 1:1 ratio. Supporters of the specimen&#39;s exotic origin had claimed the bismuth and magnesium layers could act as a terahertz waveguide, enabling &quot;inertial mass reduction&quot; — essentially levitation or antigravity. ORNL found this claim unsupported: the bismuth was nanocrystalline and amorphous rather than the pure single-crystalline structure a waveguide would require, and the co-located lead would have disrupted the necessary dielectric properties. Multiple bismuth layers, ORNL noted, could actually interfere with waveguide functionality rather than improve it.

Isotope analysis pointed firmly toward Earth. The magnesium isotope signature fell precisely within expected fractionation trendlines for solar system materials — not in the wide-open range where extrasolar material might appear. The lead isotope composition was fully consistent with terrestrial common lead and distinctly separate from even lunar materials. ORNL concluded with high confidence that the specimen was manufactured on Earth, albeit using an uncommon mixture of elements by modern standards. The material also showed damage consistent with heat exposure and mechanical stress over possibly extended periods.

The specimen had previously been held under a Cooperative Research and Development Agreement (CRADA) between the U.S. Army&#39;s DEVCOM and To the Stars Academy (TTSA), the private organization founded to study UAP-related materials. ORNL&#39;s results aligned with earlier DEVCOM analyses. Despite the thorough characterization, the specimen&#39;s original purpose and intended use remain undetermined.</div>
