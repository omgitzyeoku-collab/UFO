  <h1>US Air Force F-35 Pilot Reported Unidentified Object Over Vermont in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9bfe57482379842ddbd9e9423822d3decafb09944a3e445ac7159a82908ba67e.jpg" alt="US Air Force F-35 Pilot Reported Unidentified Object Over Vermont in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident notification records a US Air Force F-35 pilot (callsign HAMMR31) reporting an unidentified aerial phenomenon on 16 February 2023 while flying at 18,000 feet near Burlington, Vermont. The document is a brief operational alert, not an investigation — it contains no description of the object and no follow-up findings.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — a standardised form the agency uses to log reports from air traffic control. It records that on 16 February 2023 at 09:45 Eastern time, a US Air Force F-35 fighter jet flying under the callsign HAMMR31 reported encountering an unidentified aerial phenomenon.

The aircraft was travelling eastbound at 18,000 feet, approximately 46 nautical miles east-southeast of Burlington, Vermont. The flight had departed from and was returning to Burlington (BTV). Boston Air Route Traffic Control Center relayed the report to the FAA Operations Center.

The notification states that no evasive action was taken by the pilot and that law enforcement was not notified. Beyond these basic operational details, the document provides no description of the object — its appearance, size, speed, or behaviour are not recorded.

This is a preliminary notification only. It does not contain any follow-up investigation, analysis, or conclusion about what the pilot observed. The FAA form captures the bare facts needed for operational awareness, nothing more.</div>
