  <h1>Six Airliners Reported White Object Near El Paso; FAA Linked It to SpaceX Satellites</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0007397dbf1af4dd377fd272fd9325b3879ba2bc5527bad6609d2a84b5dade92.jpg" alt="Six Airliners Reported White Object Near El Paso; FAA Linked It to SpaceX Satellites thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH report documents six commercial aircraft reporting a bright white object travelling eastbound above them near El Paso on 27 August 2023. The FAA correlated the sightings with a SpaceX satellite train, though the incident was still filed under its Unidentified Aerial Phenomenon code.</p>
  <div class="narr">On 27 August 2023 at 02:40, United Airlines flight UAL1491 — a Boeing 737 MAX flying from Las Vegas to Newark — reported an unidentified object while westbound at 36,000 feet, roughly 70 nautical miles east of El Paso. The crew described a white object with a bright white aura travelling eastbound above them.

Five additional aircraft also reported the phenomenon: Alaska Airlines flight ASA25, American Airlines flight AAL2697, Southwest flight SWA4691, ABX Air flight ABX3151, and SkyWest flight SKW3147. All were cruising between 34,000 and 40,000 feet. Some pilots described what they saw as a missile.

The report was handled by Albuquerque Air Route Traffic Control Centre (ZAB). The FAA&#39;s own note states that the sightings correlate with a train of SpaceX satellites moving southwest to northeast — a prosaic explanation. Despite this correlation, the event was logged under the FAA&#39;s formal Unidentified Aerial Phenomenon category and the case is now closed.

The document is a single-page incident report. It contains no further investigative detail beyond the initial pilot observations and the satellite correlation. No tail number is recorded for the primary aircraft, and no specific geographic coordinates are given beyond the 70-nautical-mile reference to El Paso.</div>
