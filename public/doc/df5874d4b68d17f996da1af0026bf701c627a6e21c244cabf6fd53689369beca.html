  <h1>Russian Official Dismissed Georgian Airspace Reports as &#39;UFOs&#39; in 2001 Diplomatic Cable</h1>
  <div class="meta">
    <span class="badge">Department of State</span>
    <span class="badge">10/28/2001-10/29/2001</span>
    <span class="badge">Georgia</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/df5874d4b68d17f996da1af0026bf701c627a6e21c244cabf6fd53689369beca.jpg" alt="Russian Official Dismissed Georgian Airspace Reports as &#39;UFOs&#39; in 2001 Diplomatic Cable thumbnail" loading="lazy" />
  <p>A 2001 U.S. State Department cable from the American Embassy in Moscow documents Russian officials categorically denying that Russian planes bombed Georgia&#39;s Kodori Gorge, with one official sarcastically suggesting the reported aircraft could have been &#39;UFOs.&#39; The document is not a UFO sighting report — it records a diplomatic exchange about alleged military airspace violations and Russian troop withdrawal from a base in Abkhazia.</p>
  <div class="narr">On October 30, 2001, the American Embassy in Moscow sent a confidential diplomatic cable (number 01 MOSCOW 13169) reporting on conversations between U.S. Ambassador Vershbow and senior Russian officials about alleged Russian bombing of the Kodori Gorge in Georgia on October 28–29. Ambassador Vershbow warned that continued airspace violations could be &#39;disastrous for U.S.-Russian relations&#39; and could spoil an upcoming presidential summit.

Russian Deputy Foreign Minister Mamedov quoted the Russian Ministry of Defense as categorically denying any Russian planes were involved. More colorfully, MFA Georgia Desk Chief Tereoken suggested that reports of planes in the area &#39;might as well have been about UFOs,&#39; while simultaneously acknowledging credible reports of Abkhaz helicopters bombing areas &#39;where the terrorists were.&#39;

The cable also covered the status of a Russian military withdrawal from the Gudauta base in Abkhazia. One trainload of equipment had left on October 29, with two more loaded and awaiting permission from Abkhaz authorities. Approximately 600 Russian personnel remained, and Moscow insisted on keeping about 340 as guards. Abkhaz authorities refused to allow any outside observers to witness the withdrawal.

The cable&#39;s author, Political Minister Counselor George Krol, assessed that the Russian denials reflected &#39;a traditional Russian penchant to avoid an awkward admission with a bold lie&#39; and that Russia was likely using its troop presence as a bargaining chip to extract concessions from Georgia on the Boden Paper on Abkhazia and on clamping down on Chechens inside Georgia. The document was originally classified confidential and was declassified in full on February 25, 2026, by Acting-Director John Powers of the U.S. Department of State.</div>
