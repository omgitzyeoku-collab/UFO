  <h1>FAA Report: Diamond-Shaped Object Flew Under Commercial Jet Near Florida</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/7dc9e6354fa1a3aba543c4bd371ff00dc644113cf922078a7da1ff2a4b8000fd.jpg" alt="FAA Report: Diamond-Shaped Object Flew Under Commercial Jet Near Florida thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a June 2021 sighting by the crew of a commercial Envoy Air flight, who observed a white, diamond-shaped object pass beneath their aircraft at roughly 19,500 feet over the Atlantic east of Palm Beach. The case was closed with no explanation or identification of the object.</p>
  <div class="narr">On 12 June 2021, the crew of Envoy Air flight ENY3858 — a commercial Embraer E170 flying from Portland, Maine to Miami — reported an unidentified aerial phenomenon to air traffic control. The aircraft was heading south-southwest at flight level 200 (approximately 20,000 feet) when the crew saw an object pass underneath them roughly 40 nautical miles east-northeast of Palm Beach International Airport, over open water.

The crew described the object as white and diamond-shaped, smaller than their aircraft, and travelling fast on a northbound heading at approximately flight level 195 (around 19,500 feet). That puts the vertical separation at only about 500 feet — close enough to qualify as a near-miss in aviation terms. No specific speed estimate was recorded.

The report was filed through FAA Miami Center (facility code ZMA) and assigned the reference MOR ID ZMA-M-2021/06/12-0006. The Palm Beach Sheriff&#39;s office was notified. The FAA marked the case as closed, but the document contains no resolution — the object was never identified.

The report is a single-page incident form. There is no radar data, photographs, or sensor evidence attached. The entire account rests on the crew&#39;s visual observation alone.</div>
