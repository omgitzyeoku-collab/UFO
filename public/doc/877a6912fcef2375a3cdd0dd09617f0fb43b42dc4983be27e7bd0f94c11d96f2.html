  <h1>FAA Logged Multiple UFO Reports Near Toledo and Detroit in 2022</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/877a6912fcef2375a3cdd0dd09617f0fb43b42dc4983be27e7bd0f94c11d96f2.jpg" alt="FAA Logged Multiple UFO Reports Near Toledo and Detroit in 2022 thumbnail" loading="lazy" />
  <p>This is an internal FAA incident report from September 27, 2022, documenting multiple reports of unidentified aerial phenomena near Toledo and Detroit. Objects were reported at altitudes ranging from 29,000 to 100,000 feet, described as maneuvering aggressively, and the case was closed with no explanation provided.</p>
  <div class="narr">On September 27, 2022, the FAA&#39;s SKYWATCH system — an internal incident-tracking tool — recorded multiple reports of unidentified aerial phenomena in and around the Toledo and Detroit areas. The reports came through ZOB and ZAU, the FAA&#39;s Cleveland and Chicago Air Route Traffic Control Centers, which manage high-altitude airspace across the Great Lakes region.

The objects were reported at three altitude bands: 29,000 feet, 60,000 feet, and 100,000 feet. They were described as maneuvering aggressively in multiple directions. The Air Traffic Services Cell (ATSC) opened an inquiry with ZAU and ZOB to gather more details, and radar replay video files from both facilities were attached to the report. The incident was flagged as serious enough to trigger paging.

The report was filed by JATOC-AWO (the Joint Air Traffic Operations Center — All-Weather Operations) and later exported by a staff member named Nicholas D. Torgerson. Three radar replay files were attached, two from the Chicago center (ZAU) and one from Cleveland (ZOB).

The case status is listed as &quot;Closed,&quot; but the document contains no resolution, identification, or explanation for what was observed. The report simply ends without a conclusion. The radar replay files themselves are not available in this text release, so the nature of what appeared on radar cannot be independently assessed from this document alone.</div>
