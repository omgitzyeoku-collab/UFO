  <h1>Three Airline Crews Reported Twinkling Lights Over South Dakota</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/58fa35d84d9db14c5e1a598b1a72794eb004edcf827b705f7998df0084e7c8c8.jpg" alt="Three Airline Crews Reported Twinkling Lights Over South Dakota thumbnail" loading="lazy" />
  <p>This FAA incident report documents an October 2022 sighting in which the crew of a United Airlines Boeing 737 reported five white twinkling lights while cruising at 35,000 feet over Sioux Falls, South Dakota. Two other commercial flights independently reported seeing similar lights in the same area around the same time. The case was closed with no identification or explanation provided.</p>
  <div class="narr">On October 15, 2022, the crew of United Airlines flight 2492 — a Boeing 737-900 flying from Seattle to Washington Dulles — spotted something unusual while cruising eastbound at 35,000 feet over Sioux Falls, South Dakota. They described five white twinkling lights travelling above the aircraft and off to its left side.

The sighting was not isolated. Two other commercial flights, United Airlines 2059 and American Airlines 276, independently reported observing twinkling lights in the same area around the same time. The Minneapolis Center (ZMP), the FAA&#39;s regional air traffic control facility, confirmed these additional reports.

The FAA&#39;s Denver headquarters requested that an operations supervisor review audio tapes from the incident to identify any additional aircraft involved. The internal FAA office designated AWO/TY was also notified.

Despite the multi-crew corroboration, the FAA closed the case without offering any identification or explanation for what the crews observed. The report contains no reference to radar data, sensor recordings, or follow-up analysis. The filing number (237UAP00125) indicates it was catalogued under the FAA&#39;s UAP reporting system in 2023, though the incident itself occurred in October 2022.</div>
