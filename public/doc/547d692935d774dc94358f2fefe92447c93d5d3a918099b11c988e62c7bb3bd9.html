  <h1>Three Aircraft Report Bright Circling Lights Near Birmingham, Alabama</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/547d692935d774dc94358f2fefe92447c93d5d3a918099b11c988e62c7bb3bd9.jpg" alt="Three Aircraft Report Bright Circling Lights Near Birmingham, Alabama thumbnail" loading="lazy" />
  <p>An FAA operations center report from May 2023 documents a medevac pilot and two other aircraft independently observing bright lights changing in intensity and circling counter-clockwise at high altitude near Birmingham, Alabama. The document is a preliminary incident log with no follow-up investigation or identification of the phenomenon.</p>
  <div class="narr">On 2 May 2023 at 1:21 a.m. Central Time, the FAA&#39;s Washington Operations Center logged an unidentified aerial phenomenon near Birmingham, Alabama. The report originated from Birmingham TRACON, the regional air traffic control facility.

The primary witness was the crew of a medevac Cessna C550 (callsign LN10UH) flying from Pensacola to Birmingham. They reported seeing bright lights off the front of the aircraft that were changing in intensity and circling in a counter-clockwise pattern at high altitude.

Two additional aircraft independently reported the same lights in the same location, though the document provides no details about those aircraft — no callsigns, altitudes, or flight paths are recorded.

The FAA document is a short operational incident report, not an investigation. It records what was reported but offers no analysis, no identification of the lights, and no follow-up conclusions. The report is filed under reference WOC 7-3333.

Notably, the document contains a labelling error: the longitude coordinate is marked as &#39;Latitude&#39; in the original, though the negative value clearly indicates a western longitude near Birmingham. There is minimal redaction in the document.</div>
