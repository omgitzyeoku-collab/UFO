  <h1>United Airlines Pilot Reported 15 Bright Lights Over East Texas</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/93e7a9f04ed5af5f314ef6725ed9b1acad5245f49a72bfd05a1a27e919d9c247.jpg" alt="United Airlines Pilot Reported 15 Bright Lights Over East Texas thumbnail" loading="lazy" />
  <p>An FAA incident report documents a United Airlines A320 crew observing 15 bright lights that appeared and quickly vanished ahead of their aircraft near Lufkin, Texas on 31 July 2023. The case was closed with no evasive action taken and no follow-up investigation noted.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — the system the Federal Aviation Administration uses to log pilot observations of unidentified aerial phenomena (UAP). It records an event reported by the crew of United Airlines flight UAL1409, an Airbus A320 flying commercially from Houston Intercontinental (IAH) to Milwaukee (MKE).

At 03:09 UTC on 31 July 2023, while flying northeast at approximately 26,000 feet near Lufkin, Texas, the crew reported seeing an unidentified aerial phenomenon off the front of the aircraft. The phenomenon was described as 15 bright lights that appeared and then quickly disappeared. The report was logged by Fort Worth Center (ZFW), the air traffic control facility covering that airspace.

The crew took no evasive action, and no law enforcement was notified. The FAA marked the case as closed, with no indication in the document of any follow-up investigation or resolution. No radar data, additional witness accounts, or other corroborating evidence is referenced in the report.

The document contains minimal redaction. However, it is a single-source account — one crew&#39;s observation with no independent verification noted. No aircraft tail number was recorded, which limits the ability to cross-check the flight independently. A minor discrepancy exists between the report&#39;s internal reference date (30 July) and the recorded incident date (31 July), possibly due to timezone differences between local and UTC time.</div>
