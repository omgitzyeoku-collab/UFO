  <h1>Apollo 17 Crew Reported Continuous Light Flashes During 1973 Moon Mission</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">1973</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2c874c40c55505f2348177ddde77c9fd015bf971e6e059c43508a92bc9ee6b30.jpg" alt="Apollo 17 Crew Reported Continuous Light Flashes During 1973 Moon Mission thumbnail" loading="lazy" />
  <p>This is a two-page excerpt from the Apollo 17 Technical Crew Debriefing, dated January 4, 1973, in which astronauts describe seeing nearly continuous light flashes throughout the flight when their eyes were dark-adapted. The flashes — a phenomenon already under scientific study via an onboard experiment — temporarily stopped during a blindfold test, then resumed, and one crew member believed he saw a flash on the lunar surface itself.</p>
  <div class="narr">This document is an excerpt from the official Technical Crew Debriefing for Apollo 17, prepared by the Training Office at NASA&#39;s Manned Spacecraft Center in Houston, Texas, and dated January 4, 1973. It carries the document number MSC-07631 and was originally noted as exempt from public disclosure under the Freedom of Information Act, with an automatic declassification set for 90 days after publication.

In the debriefing, astronaut Harrison Schmitt reported that the crew experienced light flashes &quot;just about continuously during the whole flight&quot; whenever they were dark-adapted — meaning their eyes had adjusted to darkness. Schmitt also said he believed he saw one flash on the lunar surface itself, though this was his personal impression, not something confirmed by instruments. Command Module Pilot Ronald Evans described a separate visual experience: a fireball seen through what looked like a tunnel, with a bright spot in the middle.

The crew participated in the ALFMED (Apollo Light Flash Moving Emulsion Detector) experiment, which required them to wear blindfolds. During that period, all three crew members reported that the flashes stopped entirely. After the blindfolds came off, Schmitt noticed the flashes had returned before he went to sleep. The cessation affected all three astronauts during the same interval.

It is important to note that these light flashes were not unexpected or unexplained at the time. NASA had been studying them across multiple Apollo missions, and they are widely attributed to cosmic rays striking the astronauts&#39; retinas — a known physical effect of spaceflight outside Earth&#39;s magnetic shielding. The ALFMED experiment was specifically designed to investigate this phenomenon.

Only two pages of the broader debriefing are included in this excerpt, so additional context from the full document is not available here.</div>
