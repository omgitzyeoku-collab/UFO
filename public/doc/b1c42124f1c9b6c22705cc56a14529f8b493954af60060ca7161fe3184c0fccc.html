  <h1>NASA Gemini 4 Debriefing Was Classified Under Espionage Laws</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">6/9/65</span>
    <span class="badge">North Atlantic Ocean</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b1c42124f1c9b6c22705cc56a14529f8b493954af60060ca7161fe3184c0fccc.jpg" alt="NASA Gemini 4 Debriefing Was Classified Under Espionage Laws thumbnail" loading="lazy" />
  <p>This is the cover page of a 1965 flight crew debriefing transcript from NASA&#39;s Gemini 4 mission, prepared from voice recordings taken aboard the recovery ship. The document was originally classified as national defence information under U.S. espionage statutes — an unusually high security level for a spaceflight debriefing — and was declassified on 20 November 1973.</p>
  <div class="narr">This document is the title page of a preliminary debriefing transcript from the Gemini 4 mission, dated 9 June 1965. It was prepared by NASA&#39;s Spacecraft Operations Branch, Flight Crew Support Division, from voice recordings made aboard the recovery ship in the North Atlantic Ocean.

What makes this cover page notable is the classification markings. The document was designated as containing national defence information under the Espionage Laws (Title 18, U.S.C., Sections 793 and 794). Transmission of its contents to unauthorised persons was explicitly prohibited by law, and access was restricted to persons within the U.S. Government. This level of security classification is unusually high for a routine spaceflight debriefing.

The document was scheduled for downgrade at three-year intervals and full declassification after twelve years. It was declassified on 20 November 1973. A note on the cover page states that it may be exempt from public disclosure under the Freedom of Information Act (5 U.S.C. 552).

It is important to note that only the cover page is present in this release. The actual debriefing content — including a &quot;Visual Sightings&quot; section reportedly spanning pages 196 to 224 — is not included. The text that is available was extracted via OCR from a photograph of an aged document, and many words are garbled as a result.</div>
