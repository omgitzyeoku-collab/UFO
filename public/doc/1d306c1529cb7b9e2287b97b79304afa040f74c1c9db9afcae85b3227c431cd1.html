  <h1>Five UFO Sightings Reported Over Patuxent at 32,000 Feet in 2018</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/1d306c1529cb7b9e2287b97b79304afa040f74c1c9db9afcae85b3227c431cd1.jpg" alt="Five UFO Sightings Reported Over Patuxent at 32,000 Feet in 2018 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents five separate UFO sightings reported by Washington Center air traffic control over the Patuxent VOR on 15 June 2018, at altitudes between 32,000 and 35,000 feet. The objects appeared on the collision-avoidance displays of nearby aircraft. The Department of Defense noted F-22 fighters were in the area but could not confirm whether they caused the radar returns, and the case was closed without a definitive explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under record 237UAP00034. It records events from 15 June 2018, when Washington Center (ZDC) — the FAA facility that manages high-altitude air traffic over the mid-Atlantic region — logged five UFO reports over the Patuxent VOR, a navigation point in Maryland. The objects were detected between flight levels 320 and 350, roughly 32,000 to 35,000 feet.

What makes the report notable is how the objects were detected: they appeared on the TCAS (Traffic Collision Avoidance System) displays of other aircraft flying in the area. TCAS is an onboard safety system that alerts pilots to nearby traffic, meaning these objects were either transponding a signal or reflecting radar in a way that the system interpreted as real aircraft.

The Department of Defense was contacted and reported that a couple of F-22 fighter jets were operating in the area at the time. However, the DoD stated it was unsure whether the F-22s were the cause of the radar returns. After initial investigation, Washington Center reported no further sightings, and the case was marked as closed with a primary code of &quot;OTHER.&quot;

The incident was closed without a definitive explanation. The F-22s were neither confirmed nor ruled out as the source of the sightings. No pilot statements, radar recordings, or additional corroborating evidence are included in this document. It is worth noting that while the release metadata lists 2023 as the record date, the incident itself occurred on 15 June 2018 — the later date likely reflects when the record was compiled or released as part of the broader disclosure effort.</div>
