  <h1>Airline Pilot Reported Unidentified Object Above 37,000 Feet Over Arkansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/572f76602200ca5413e046fdf6f98d8634b96bdd28ba441a41987863a1ab2911.jpg" alt="Airline Pilot Reported Unidentified Object Above 37,000 Feet Over Arkansas thumbnail" loading="lazy" />
  <p>This FAA notification records that the crew of American Airlines flight 2561, a Boeing 737-800 flying from Dallas/Fort Worth to Charlotte, reported a possible UFO above their cruising altitude of 37,000 feet over Little Rock, Arkansas on 7 August 2022. The document is a brief operational alert relayed by air traffic control, not a full investigation.</p>
  <div class="narr">This document is an incident notification from the FAA&#39;s Washington Operations Center — essentially an internal alert that something unusual was reported during a commercial flight. It is not an investigation report and contains no conclusions about what the object was.

On 7 August 2022, at approximately 1:30 AM Central time, the crew of American Airlines flight 2561 reported a possible UFO sighting while cruising at flight level 370 (roughly 37,000 feet) over Little Rock, Arkansas. The object was described only as being above the aircraft&#39;s altitude. Memphis Air Route Traffic Control Center (ARTCC), the regional air traffic control facility handling the flight, relayed the report to FAA Operations.

The flight was a Boeing 737-800 operating the Dallas/Fort Worth to Charlotte route. The coordinates recorded in the report (34.75°N, 92.29°W) correspond to the Little Rock area.

No description of the object&#39;s appearance, behaviour, speed, or duration of the sighting is included in the document. The pilot himself characterised it as a &quot;possible&quot; UFO sighting, indicating uncertainty. The document is categorised under &quot;Miscellaneous&quot; — a general FAA reporting bucket rather than a specific threat or safety category.

There is no indication of any follow-up investigation, radar data, or corroborating reports from other aircraft or ground observers in this document.</div>
