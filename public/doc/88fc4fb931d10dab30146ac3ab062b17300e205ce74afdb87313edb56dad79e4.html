  <h1>Southwest Crew Reported High-Altitude Balloon Over Missouri in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/88fc4fb931d10dab30146ac3ab062b17300e205ce74afdb87313edb56dad79e4.jpg" alt="Southwest Crew Reported High-Altitude Balloon Over Missouri in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Southwest Airlines crew observing a large balloon at roughly 50,000 feet while flying at 34,000 feet over Missouri on 3 February 2023. The FAA classified it as an Unidentified Aerial Phenomenon and closed the case.</p>
  <div class="narr">On 3 February 2023, the crew of Southwest Airlines flight SWA3125 reported spotting a large balloon while flying westbound at 34,000 feet. The aircraft was operating from Chicago Midway (MDW) to Colorado Springs (COS) and was overhead St. Joseph, Missouri (STJ) at the time. The crew described the object as off the right side of the aircraft, estimating its altitude at approximately 50,000 feet or above.

The FAA logged the sighting under its SKYWATCH system and classified it with the primary code &quot;Unidentified Aerial Phenomenon.&quot; That classification reflects the fact that the object was not positively identified at the time of reporting — the crew themselves described it as a balloon, but the FAA applies the UAP label when an object cannot be confirmed.

The case is now closed. The document contains no indication of follow-up investigation, corroborating radar data, or imagery. It is a single-page incident report with minimal detail beyond the crew&#39;s observation.

The timing is notable: this sighting occurred one day before the US military shot down a Chinese surveillance balloon on 4 February 2023, during a period when multiple high-altitude balloon incursions were detected over North America.</div>
