  <h1>American Airlines Crew Reported Jet Pack Sighting on Final Approach to Dallas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d0d6f796f8bedd04e070058b4c7db2527a6e5bdac3bc5b09c36f8120cefbbf80.jpg" alt="American Airlines Crew Reported Jet Pack Sighting on Final Approach to Dallas thumbnail" loading="lazy" />
  <p>An FAA incident report documents the crew of American Airlines flight AAL1030, a Boeing 787, observing what they described as a jet pack individual roughly 500 feet above them while on final approach to Dallas/Fort Worth airport on 5 March 2023. The case is closed, with no evasive action taken and no corroborating radar or sensor data mentioned.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unidentified aerial phenomenon sightings reported by aircrew. It covers a single event on 5 March 2023 at 21:59.

The crew of American Airlines flight AAL1030, a commercial Boeing 787 flying from Cancún (MMUN) to Dallas/Fort Worth (DFW), reported seeing what they described as a &quot;jet pack individual&quot; approximately 500 feet above their aircraft. At the time, the plane was southbound at 700 feet on final approach. No evasive action was taken. The incident was reported through the DFW facility and assigned case number DFW-M-2023/03/05-0001.

The report notes that TY and AWO were notified, but police department notification was not annotated — meaning it is unclear from the document whether law enforcement was ever informed. The case status is listed as closed.

Notably, although this report is filed under the FAA&#39;s UAP tracking system, the crew themselves attributed the object to a jet pack rather than leaving it unidentified. No independent confirmation of the object&#39;s nature is provided in the document.</div>
