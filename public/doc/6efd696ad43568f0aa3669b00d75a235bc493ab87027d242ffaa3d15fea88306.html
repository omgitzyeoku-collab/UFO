  <h1>Commercial Pilot Reports Unidentified Object at 34,000 Feet Over Gulf of Mexico</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/6efd696ad43568f0aa3669b00d75a235bc493ab87027d242ffaa3d15fea88306.jpg" alt="Commercial Pilot Reports Unidentified Object at 34,000 Feet Over Gulf of Mexico thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a commercial Boeing 767 pilot&#39;s sighting of an unidentified aerial phenomenon on October 24, 2023, approximately 115 nautical miles west of St. Pete–Clearwater (PIE), over the Gulf of Mexico. The object was travelling eastbound at roughly 34,000 feet — about 2,000 feet below the reporting aircraft — and the case was closed with no explanation provided.</p>
  <div class="narr">On October 24, 2023, at 11:54, the crew of a commercial Boeing 767 flying under callsign ATN3331 reported an unidentified aerial phenomenon to the FAA. The aircraft was heading northwest at 36,000 feet on a route from Lakeland, Florida (LAL) to San Bernardino, California (SBD), and was approximately 115 nautical miles west of St. Pete–Clearwater International Airport (PIE) — placing it over the Gulf of Mexico.

The pilot described an unknown phenomenon travelling eastbound at approximately 34,000 feet, roughly 2,000 feet below the aircraft. No physical description of the object&#39;s shape, size, colour, or behaviour is included in the report beyond its altitude and direction of travel.

The FAA logged the event as a SKYWATCH Incident Report with the primary code &quot;Unidentified Aerial Phenomenon.&quot; The case status is marked as &quot;Closed,&quot; but the document provides no resolution, identification, or follow-up explanation for what the pilot observed.

Notably, the report contains no corroborating radar data, no additional witness accounts, and the aircraft tail number field is blank — whether by redaction or omission is unclear. The report is a single-page administrative record, not an investigative file.</div>
