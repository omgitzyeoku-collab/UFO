  <h1>Canadian Airline Crew Reports Three Flashing Lights Over Atlantic</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/71f24f7b19e9c283eaa151a1b9e2cedb9b1c7bda93f7739e8a4f9ce855726bdf.jpg" alt="Canadian Airline Crew Reports Three Flashing Lights Over Atlantic thumbnail" loading="lazy" />
  <p>An FAA incident report from April 2023 documents the crew of Sunwing flight 615, a Canadian Boeing 737 MAX 8 flying from Cuba to Quebec, spotting three flashing lights moving above a thunderstorm roughly 40 miles east of Savannah, Georgia. No evasive action was taken, no follow-up investigation is recorded, and the lights remain unidentified.</p>
  <div class="narr">On 15 April 2023 at roughly midnight Eastern time, the crew of Sunwing flight 615 reported an unidentified aerial phenomenon to Jacksonville Air Route Traffic Control Center (ARTCC). The aircraft, a Canada-registered Boeing 737 MAX 8, was flying north-northeast at flight level 370 — approximately 37,000 feet — on a route from Cayo Largo del Sur, Cuba to Quebec, Canada.

The crew described three lights flashing on and off, positioned about 10 to 15 miles directly ahead of the aircraft and moving above a thunderstorm. The sighting occurred over the Atlantic Ocean, roughly 40 nautical miles east of Savannah, Georgia, at coordinates 32.13°N, 80.52°W. No evasive action was taken and no law enforcement was notified.

The document is an FAA Washington Operations Center incident report — essentially a standardised log entry recording the crew&#39;s call. It contains no radar data, no sensor readings, and no follow-up investigation or determination of what the lights were. The report is a single-source pilot account with no corroboration from other aircraft or ground systems.

The FAA did not classify or explain the phenomenon. The record stands as a filed report with no resolution.</div>
