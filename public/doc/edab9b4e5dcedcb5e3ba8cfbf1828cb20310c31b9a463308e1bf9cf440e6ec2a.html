  <h1>FBI File Contains 1960s UFO Believer Letters to Hoover and NASA</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    
  </div>
  <img class="thumb" src="/extract/thumbs/edab9b4e5dcedcb5e3ba8cfbf1828cb20310c31b9a463308e1bf9cf440e6ec2a.jpg" alt="FBI File Contains 1960s UFO Believer Letters to Hoover and NASA thumbnail" loading="lazy" />
  <p>FBI Part 15 includes correspondence and newsletter material from the International Get Acquainted Program (IGAP), a UFO contactee organisation. The documents feature letters sent to FBI Director J. Edgar Hoover, Queen Juliana of the Netherlands, and NASA, along with an account of a 1967 visit to NASA&#39;s Goddard Space Flight Center where UFO films were shown to officials who were reportedly impressed but declined to make public statements.</p>
  <div class="narr">This section of the FBI&#39;s UFO files is not an investigation report. It is a collection of unsolicited letters and newsletter excerpts from supporters of George Adamski, a controversial figure who claimed contact with extraterrestrials. The material was sent to FBI Director J. Edgar Hoover on August 19, 1961, and appears to have been filed without any visible FBI analysis or response.

The documents include an open letter addressed to Queen Juliana of the Netherlands at Soestdijk Palace, asking her to hear testimony about Adamski&#39;s claimed extraterrestrial contacts. The letter references a reported meeting between the Queen and Adamski at the palace in May 1959. Adamski died in April 1965, and the newsletter material comes from IGAP — the International Get Acquainted Program — an organisation with chapters in countries across Europe, the Americas, and Asia.

A key account describes Fred Steckling, an IGAP associate, filming what he claimed were approximately 40 to 50 UFOs from a train between Mannheim and Frankfurt in West Germany. Steckling later offered to show this film to US Air Force officials and NASA. On February 27, 1967, Steckling and Madeleine Rodeffer visited Building A.1 at NASA&#39;s Goddard Space Flight Center in Greenbelt, Maryland, where they showed UFO films to NASA staff during a two-hour meeting. Paul D. Loseman Jr. of the Geochemistry Laboratory had arranged the visit.

According to Steckling&#39;s own account — the only perspective recorded — the NASA officials were impressed but would not make any open statement about the films. One official reportedly said the film did not prove the objects were extraterrestrial, and they requested more positive proof. No independent NASA account of this meeting appears in the documents.

The newsletter also claims that copies of Adamski&#39;s films loaned to television networks were returned damaged with chemicals, and that a portion of the Rodeffer UFO film was stolen from a hotel room. No corroboration for these claims is provided.</div>
