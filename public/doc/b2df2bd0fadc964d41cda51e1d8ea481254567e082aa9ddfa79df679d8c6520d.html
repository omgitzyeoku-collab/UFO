  <h1>Four Flights Report UFO Over West Virginia With Avionics Issues</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/b2df2bd0fadc964d41cda51e1d8ea481254567e082aa9ddfa79df679d8c6520d.jpg" alt="Four Flights Report UFO Over West Virginia With Avionics Issues thumbnail" loading="lazy" />
  <p>This FAA incident report from April 21, 2022 documents a UFO sighting by a Flexjet business jet flying at 45,000 feet near Kessel, West Virginia. The pilot reported avionics malfunctions while passing beneath the object, and three commercial airline crews independently reported seeing a similar phenomenon in the same area.</p>
  <div class="narr">This is an FAA Washington Operations Center incident report filed on April 21, 2022 at 9:52 PM Eastern. It documents a UFO sighting reported through Washington ARTCC (Air Route Traffic Control Center) involving multiple aircraft over West Virginia.

Flexjet 359, an Embraer Phenom 300 business jet flying from Boston to Huntsville at 45,000 feet, reported observing an unidentified object approximately 10,000 feet above their altitude — roughly 55,000 feet — about 3 nautical miles southwest of the Kessel VOR navigational point in West Virginia (coordinates 39.045°N, 79.073°W). While passing beneath the object, the pilot in command reported that the aircraft&#39;s attitude reference system and autopilot experienced malfunctions.

Three additional commercial flights — Southwest 368, Southwest 1393, and United 46 — independently reported observing a similar phenomenon in the area. No physical description of the object is provided in the document beyond its position relative to the reporting aircraft.

The report is a preliminary incident log only. It contains no follow-up investigation, no conclusions about what the object was, and no resolution. The FAA did not attribute a cause to either the sighting or the reported avionics issues. The document shows minimal redaction.</div>
