  <h1>Pentagon UAP Office Briefed NASA on Sphere-Shaped Sightings and Sensor Limits</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/8344f4ab7f3da9e2ffd85052668330394d22f178adfdd9688de9aec4065687b6.jpg" alt="Pentagon UAP Office Briefed NASA on Sphere-Shaped Sightings and Sensor Limits thumbnail" loading="lazy" />
  <p>In May 2023, the Pentagon&#39;s All-Domain Anomaly Resolution Office (AARO) presented an unclassified briefing to NASA summarising UAP reporting trends, noting that nearly half of reported objects are round or spherical, typically 1–4 metres across, flying at 10,000–30,000 feet with no detectable exhaust. The presentation included two case studies — one unresolved metallic orb observed by a military drone in the Middle East and one Western US sighting likely explained as commercial aircraft distorted by camera autofocus — and concluded with eight recommendations for NASA-AARO collaboration.</p>
  <div class="narr">On 25 May 2023, Dr Seán Kirkpatrick, then director of the All-Domain Anomaly Resolution Office (AARO) within the US Department of Defense, delivered an unclassified briefing to NASA. The presentation covered AARO&#39;s mission, UAP reporting trends spanning 1996–2023, sensor calibration issues, two case studies, and proposals for how NASA could support the investigation effort.

The briefing laid out what a &#39;typical&#39; UAP looks like according to military reporting data: a round or spherical object (47% of reported shapes), white, silver or translucent in colour, 1–4 metres across, observed at altitudes between 10,000 and 30,000 feet. Reported speeds range from stationary to Mach 2, with no thermal exhaust detected. Radar returns are described as intermittent, in the X-band (8–12 GHz). A further 19% of reports were classified as ambiguous sensor contacts rather than distinct objects.

Two case studies were presented. In the first, an MQ-9 military drone in the Middle East in 2022 observed a spherical metallic object using electro-optical sensors. AARO found no demonstration of unusual technical capabilities and no apparent threat to aircraft safety, but the case remains unresolved and sits in the office&#39;s active archive. In the second, a P-3 maritime patrol aircraft over the Western United States recorded what appeared to be equidistant objects. AARO assessed these as likely commercial airliners on known flight paths, with apparent shape changes caused by the sensor&#39;s autofocus system.

The presentation concluded with eight recommendations for NASA, including reviewing earth-sensing satellite data against parameterised UAP target characteristics, evaluating crowd-sourced data, and leading peer-reviewed research into what signatures advanced flight and propulsion capabilities might produce. AARO also noted that smartphone imagery is of limited value for UAP investigation given typical camera resolution.

The document was cleared for open publication under authority of the FY24 National Defence Authorization Act (codified at 44 U.S.C. 2107), with a classification review dated 6 February 2025. There is low evidence of redaction in the released version, though as a summary briefing, underlying data and detailed methodology were not included.</div>
