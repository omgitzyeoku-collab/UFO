  <h1>Spirit Airlines Crew Reports Two White Lights at 49,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/a0168fb3a8c0ff8e45cfd68899ac3f2c9e5c490dba7f82e693b31bf0748cd639.jpg" alt="Spirit Airlines Crew Reports Two White Lights at 49,000 Feet thumbnail" loading="lazy" />
  <p>An FAA preliminary report documents a UAP sighting by the crew of Spirit Airlines flight 1777 on February 23, 2024, while flying from Fort Lauderdale to Newark. The crew observed two white lights that appeared stationary at approximately 49,000 feet directly ahead of their aircraft; the objects were not detected on radar.</p>
  <div class="narr">This document is a preliminary information report from the FAA&#39;s Washington Operations Center. It records a UAP (unidentified aerial phenomenon) sighting reported by the crew of Spirit Airlines flight 1777, an Airbus A321 flying from Fort Lauderdale, Florida, to Newark, New Jersey.

On February 23, 2024, while flying northbound at 35,000 feet and approximately 140 nautical miles south of Wilmington, North Carolina — over open ocean off the coast of the Carolinas — the crew reported two white lights at the 12 o&#39;clock position (directly ahead). The lights appeared stationary at flight level 490, or roughly 49,000 feet. That altitude is above the operational ceiling of most conventional aircraft.

Jacksonville ARTCC (Air Route Traffic Control Center), the air traffic control facility handling the flight, confirmed the UAP was not observed on radar. The document&#39;s metadata places the sighting at coordinates 32.24°N, 77.90°W.

This is a preliminary report only. It contains no follow-up investigation, no resolution, and no conclusion about what the lights were. The FAA recorded the crew&#39;s account but the document ends there.</div>
