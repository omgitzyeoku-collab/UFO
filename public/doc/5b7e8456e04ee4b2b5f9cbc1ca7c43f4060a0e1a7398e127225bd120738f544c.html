  <h1>NRC Proposed New Rules for Reporting UAP Sightings at Nuclear Sites</h1>
  <div class="meta">
    <span class="badge">NRC</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5b7e8456e04ee4b2b5f9cbc1ca7c43f4060a0e1a7398e127225bd120738f544c.jpg" alt="NRC Proposed New Rules for Reporting UAP Sightings at Nuclear Sites thumbnail" loading="lazy" />
  <p>This internal Nuclear Regulatory Commission (NRC) slide deck proposes procedures for reporting unidentified anomalous phenomena (UAP) and unknown-origin drone flyovers at nuclear facilities. The NRC acknowledges it has no data on whether UAPs are flying over nuclear power plants, calling this an explicit information gap.</p>
  <div class="narr">This document is an internal proposal presentation — a slide deck — from the Nuclear Regulatory Commission (NRC), originating from its offices at 11545 Rockville Pike in Rockville, Maryland. It is titled &quot;Current &amp; Future Flyover Reporting Guidance for SIDs: A Proposal&quot; and addresses how the NRC should handle reports of unidentified anomalous phenomena (UAP) or drones of unknown origin near nuclear facilities.

The presentation references a federal legislative mandate requiring the NRC Chairman to be consulted on reported UAP or unknown-origin drone incidents at nuclear sites. The covered facilities include nuclear power generating stations, nuclear fuel storage sites, and other NRC-regulated locations. It also references the All-domain Anomaly Resolution Office (AARO), run by the Secretary of Defense in consultation with the Director of National Intelligence, whose mandate covers material retrieval, analysis, reverse engineering, detection, tracking, and related activities.

The most striking admission in the document is a frank acknowledgement of an information gap. The NRC states plainly: &quot;We have no idea if UAPs are flying over the aerospace of nuclear power plants or Category I fuel cycle facilities.&quot; The proposal appears aimed at closing that gap by establishing reporting procedures.

This is a proposal, not an adopted policy. The document does not describe any specific UAP incidents or sightings, nor does it contain case data. It is procedural in nature — focused on what reporting should look like, not on what has been observed. Redaction levels are low, and the document appears to be largely intact.</div>
