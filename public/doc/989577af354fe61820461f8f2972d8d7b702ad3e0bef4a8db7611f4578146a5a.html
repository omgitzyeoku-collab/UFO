  <h1>Pilot Reports Missile-Like Object Climbing Near Lynchburg, Virginia</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/989577af354fe61820461f8f2972d8d7b702ad3e0bef4a8db7611f4578146a5a.jpg" alt="Pilot Reports Missile-Like Object Climbing Near Lynchburg, Virginia thumbnail" loading="lazy" />
  <p>An FAA incident report documents a general aviation pilot&#39;s sighting of a shiny, missile-like object climbing vertically through 36,000 feet with a visible smoke trail near Lynchburg, Virginia on 26 January 2023. The case was closed with no identification of the object and no law enforcement follow-up.</p>
  <div class="narr">On 26 January 2023, the pilot of aircraft N926FM filed a report through FAA facility ZDC (Washington Center) describing an unidentified aerial phenomenon. The aircraft, a general aviation flight originating from PR16, was descending through flight levels 360 to 340 — roughly 36,000 to 34,000 feet — when the pilot spotted something directly ahead at the 12 o&#39;clock position, approximately 10 miles northeast of Lynchburg, Virginia (LYH).

The pilot described the object as a shiny, missile-like projectile travelling vertically through 36,000 feet with a visible smoke trail, estimated to be 10 to 30 miles south of Lynchburg. The report notes the object was climbing straight up. No radar data or additional witnesses are mentioned anywhere in the document — the entire account rests on this single pilot&#39;s visual observation.

The FAA categorised the report under its SKYWATCH system with the primary code &quot;Unidentified Aerial Phenomenon.&quot; The case status is listed as closed, but the document gives no indication that the object was ever identified or that any resolution was reached. No law enforcement report was filed.

Several fields in the report are blank, including tail number, operator name, and new destination. This appears to be simple omission rather than deliberate redaction — the document shows low evidence of redaction overall.</div>
