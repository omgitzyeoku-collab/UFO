  <h1>FAA Report: Pilot Spotted Two Unexplained White Lights at 49,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/31404c87e35db6358a9dc419842721448d7347a7398886c8ec788dbecca2f472.jpg" alt="FAA Report: Pilot Spotted Two Unexplained White Lights at 49,000 Feet thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a general aviation pilot&#39;s sighting of two stationary white lights at approximately 49,000 feet while flying northbound toward Newark. The objects were not detected on air traffic control radar, and the FAA closed the case without explanation.</p>
  <div class="narr">On 24 February 2024, a general aviation aircraft with callsign N5430G was flying northbound at 45,000 feet, roughly 140 nautical miles south of Wilmington, North Carolina (airport code ILM). The flight had departed from MBPV and was headed to Newark (EWR). At 02:43, the pilot reported seeing two white lights directly ahead that appeared stationary at approximately FL490 — flight level 490, or about 49,000 feet.

The FAA logged the sighting under its SKYWATCH programme as record 237UAP00360, with a corresponding Mandatory Occurrence Report ID of ZJX-M-2024/02/23-0005. Air traffic control checked their radar systems but did not detect anything at the reported location.

The case is now marked closed. The FAA provided no resolution or explanation for what the pilot observed. The tail number and operator fields in the report are blank, which limits independent verification of the reporting aircraft.

The altitude is notable: 49,000 feet sits above the ceiling of most commercial airliners, though some military and experimental aircraft do operate at that height. Without radar corroboration or any sensor data, the report rests entirely on the pilot&#39;s visual observation.</div>
