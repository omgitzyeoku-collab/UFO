  <h1>Air Canada Crew Reports Flashing Lights Above 39,000 Feet Over West Virginia</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c29767cfa48853f908be0dbcd4d2debdf3fe2026d1cd2e6629eadd5f70e7de84.jpg" alt="Air Canada Crew Reports Flashing Lights Above 39,000 Feet Over West Virginia thumbnail" loading="lazy" />
  <p>This is an FAA incident report from April 2023 documenting a UAP sighting by the crew of Air Canada flight 1091, an Airbus A330 flying from Orlando to Toronto. The crew observed 3 to 5 flashing lights well above their cruising altitude of 39,000 feet near Elkins, West Virginia, and other aircraft in the area reported the same phenomenon.</p>
  <div class="narr">On April 16, 2023, the crew of Air Canada flight 1091 — an Airbus A330 travelling from Orlando to Toronto — spotted something unusual off the left side of their aircraft. While cruising northbound at approximately 39,000 feet, about 35 nautical miles south of Elkins, West Virginia, they reported an unidentified aerial phenomenon to air traffic control.

The phenomenon consisted of 3 to 5 flashing lights positioned well above the aircraft&#39;s altitude of 39,000 feet. Washington ARTCC (Air Route Traffic Control Center) was advised of the sighting. Notably, other aircraft in the area independently reported the same phenomenon, though the report does not identify which aircraft or how many.

The FAA&#39;s Washington Operations Center logged the incident but no law enforcement agencies were notified. The report carries a &quot;late report&quot; designation, meaning it was not filed in real time but recorded after the fact, at 00:01 Eastern.

This document is a preliminary operational report — essentially a logbook entry — not a full investigation. It contains no radar data, no sensor readings, and no follow-up analysis. The FAA did not reach any conclusion about what the lights were.</div>
