  <h1>Cargo Plane Crew Reports Erratic Triangle Light Over Vermont</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9d6dbc011e0145cce01d4c9c43c1ffc0838deca302853ecc6210cc554402db29.jpg" alt="Cargo Plane Crew Reports Erratic Triangle Light Over Vermont thumbnail" loading="lazy" />
  <p>This is an FAA incident report from February 2023 in which a Boeing 747 cargo crew and a second aircraft independently observed an unidentified light above 60,000 feet near Burlington, Vermont. The light displayed an unusual repeating pattern — three lights forming a triangle, merging into one, and repeating — but no formal investigation or conclusion is included in the document.</p>
  <div class="narr">On 12 February 2023, the crew of Cargolux Italia flight 93PK — a Boeing 747-8 flying from Chicago O&#39;Hare to Luxembourg — reported an unidentified aerial phenomenon to air traffic control. The aircraft was cruising eastbound at 35,000 feet, roughly 43 nautical miles northwest of Burlington, Vermont.

The pilot described a light estimated to be above 60,000 feet — well above their own altitude and beyond the ceiling of most conventional aircraft. The light was flying in what the crew called an erratic pattern at an unspecified distance ahead. Most distinctively, three lights appeared to form a triangle shape, then converge into a single light, repeating this process several times.

A second aircraft, travelling northbound, independently reported the same observation, providing a degree of corroboration. The report was processed through Boston ARTCC (Air Route Traffic Control Center) and the FAA&#39;s Washington Operations Center.

The document is classified as a &quot;late report,&quot; meaning it was not filed in real time during the sighting. It is a preliminary operations centre record, not a formal investigation or analysis. The FAA document does not offer any explanation or conclusion about what the crew observed.

Redaction in this document appears minimal. The second corroborating aircraft is not identified by callsign or type, but the primary reporting aircraft and its route are fully detailed.</div>
