  <h1>Pilot Reports Flashing Object at 50,000 Feet off Boston Coast</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/c1f0583324f0e3af79e22d9940de10cf84ffdeb62713ab9304e3033b5f3e74a2.jpg" alt="Pilot Reports Flashing Object at 50,000 Feet off Boston Coast thumbnail" loading="lazy" />
  <p>This is an FAA incident report from February 2019 in which the pilot of a transatlantic Airbus A330-300 reported seeing an unidentified object with flashing lights at approximately 50,000 feet, descending rapidly, while flying southeast of Boston. The case was closed with no explanation provided.</p>
  <div class="narr">On 10 February 2019 at 04:58 UTC, the pilot-in-command of flight EWG1113 — an Airbus A330-300 — reported an unidentified flying object to Boston Center (ZBW), the air traffic control facility covering the area. The aircraft was eastbound at 39,000 feet, approximately 90 nautical miles southeast of Boston.

The pilot described an object with flashing lights at flight level 500, roughly 50,000 feet — an altitude above the certified ceiling of most commercial and military aircraft. The object was descending rapidly at the time of observation.

The report is a single-page FAA SKYWATCH incident filing, classified under the primary code &quot;OTHER.&quot; It contains no radar data, no sensor evidence, and no corroborating observations from other aircraft or ground stations. The entire account rests on the pilot&#39;s visual observation alone.

The FAA marked the case as closed. No resolution, identification, or further explanation appears in the document. There is little evidence of redaction — the report is simply very brief, offering minimal detail beyond the basic facts of the sighting.

The flight appears to have been a transatlantic service originating from Düsseldorf, Germany and destined for Newark, though this detail carries slightly lower confidence in the source text.</div>
