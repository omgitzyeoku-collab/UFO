  <h1>U-2 Spy Plane Crew Spotted Large Balloon at 50,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f3c6dee14c0202955a4db2061acab59674d1a29598ff029701830c36a6d77898.jpg" alt="U-2 Spy Plane Crew Spotted Large Balloon at 50,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a U-2 reconnaissance aircraft crew observing a large balloon at approximately 50,000 feet on 3 February 2023, near the Bousquet VOR navigation point. The sighting occurred during the same period as the widely reported Chinese surveillance balloon incidents, though this document does not identify what the balloon was.</p>
  <div class="narr">On 3 February 2023, the crew of a U-2 reconnaissance aircraft — flying under the callsign DRAGN01 — reported spotting a large balloon while cruising westbound at 60,000 feet. The U-2 is a high-altitude surveillance plane operated by the US Air Force, typically flying well above commercial air traffic. The aircraft had departed from and was returning to Beale Air Force Base (BAB) in California.

The balloon was observed off the aircraft&#39;s left side, approximately 10 nautical miles northeast of the Bousquet VOR (a radio navigation point, identified as BQS). It was estimated to be at roughly 50,000 feet or below — high enough to be well above commercial airliners but below the U-2&#39;s cruising altitude. After spotting the balloon, the aircraft circled its location before the incident was closed.

The FAA classified this sighting under its primary code for &quot;Unidentified Aerial Phenomenon.&quot; This does not mean the object was unexplained in any exotic sense — it means that at the time of filing, its origin and purpose had not been confirmed through this reporting channel.

The timing is notable. Early February 2023 was the period when the US military tracked and eventually shot down a Chinese surveillance balloon, along with several other unidentified objects, over North American airspace. This report does not state whether the balloon observed by DRAGN01 was related to those incidents, but the date and description are consistent with that broader episode.</div>
