  <h1>U.S. Military Report Documents Two UAP Sightings in 2020</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">Mediterranean Sea</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/af150a6b5139abc632446c9d5999fd5abc4f3c476c6245f173faabb6e2132d10.jpg" alt="U.S. Military Report Documents Two UAP Sightings in 2020 thumbnail" loading="lazy" />
  <p>A heavily redacted U.S. Department of War mission report records two separate UAP (Unidentified Anomalous Phenomena) sightings in 2020. The first involved a single object traveling at 40 knots at roughly 16,000–17,000 feet; the second involved two possible UAPs estimated at 278 knots that accelerated and turned south.</p>
  <div class="narr">This document is a U.S. military Mission Report (MISREP) originally classified SECRET//REL (releasable to allies). It records two UAP observations made during 2020, though the exact dates are not provided. The report is heavily redacted — the identity of the observers, their military unit, their platform (aircraft, ship, or ground station), and the type of sensor used are all blacked out under national-security exemptions.

The first sighting occurred at 1354Z (1:54 p.m. UTC). An observer reported a single UAP near military grid reference 34SCE7566990098, traveling at a steady 40 knots (about 46 mph) at an altitude between flight level 160 and 170 — roughly 16,000 to 17,000 feet. The object&#39;s speed remained constant throughout the observation.

The second sighting took place later the same day or on a separate occasion at 2243Z (10:43 p.m. UTC). This time the observer reported two &quot;possible UAPs&quot; near grid reference 35TQK1580995057, estimated at 278 knots (approximately 320 mph). During the observation, the two objects increased their speed and changed direction toward the south.

The document&#39;s metadata lists both &quot;Arabian Gulf&quot; in its title and &quot;Mediterranean Sea&quot; as the incident location — two entirely different bodies of water. This inconsistency is unexplained in the released text. The report contains no stated conclusions about what the objects were, and no corroborating sensor data is visible in the released portions.</div>
