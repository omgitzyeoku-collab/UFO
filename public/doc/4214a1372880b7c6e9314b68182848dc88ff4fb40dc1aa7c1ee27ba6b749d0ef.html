  <h1>Pilot Reports Five or Six UFOs at 28,500 Feet on Jacksonville-Newark Flight</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/4214a1372880b7c6e9314b68182848dc88ff4fb40dc1aa7c1ee27ba6b749d0ef.jpg" alt="Pilot Reports Five or Six UFOs at 28,500 Feet on Jacksonville-Newark Flight thumbnail" loading="lazy" />
  <p>This is a single-page FAA SKYWATCH incident report from January 2015 documenting a pilot&#39;s sighting of five or six unidentified objects at 28,500 feet while flying from Jacksonville to Newark. Other aircraft independently reported strobing lights in the same area, and NORAD confirmed no known activity that could explain the sighting. The case was closed with no resolution.</p>
  <div class="narr">On 15 January 2015, at 08:05 UTC, the crew of flight TCF641 — an Embraer 170 travelling from Jacksonville (JAX) to Newark (EWR) — reported spotting five or six unidentified flying objects at an altitude of 28,500 feet, approximately 15 miles east of the 38th parallel north.

The sighting was not isolated. Other aircraft in the vicinity independently reported strobing lights in the same area. The FAA contacted NORAD (North American Aerospace Defense Command), which confirmed it had no known military or other activity in that region. The Eastern Air Defense Sector (EADS) was also notified.

Despite the corroborating reports from other pilots and the absence of any known explanation from NORAD, the FAA closed the case. The report contains no follow-up investigation, no radar data, no sensor corroboration, and no recorded duration of the sighting. It is a single-page summary categorised under the primary code &quot;OTHER.&quot;

The document was released as part of a 2023 FAA series of UAP records, though the incident itself dates to 2015. There is minimal redaction, but equally minimal detail — the report records what the pilot said and who was notified, and nothing more.</div>
