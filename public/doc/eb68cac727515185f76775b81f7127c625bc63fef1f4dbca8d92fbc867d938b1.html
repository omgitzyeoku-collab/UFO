  <h1>Spirit Airlines Crew Reports Five White-Lit Objects Over Orlando</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/eb68cac727515185f76775b81f7127c625bc63fef1f4dbca8d92fbc867d938b1.jpg" alt="Spirit Airlines Crew Reports Five White-Lit Objects Over Orlando thumbnail" loading="lazy" />
  <p>An FAA operations center report documents a Spirit Airlines crew spotting five unidentified objects with white lights above their aircraft at 26,000 feet near Orlando, Florida. No other aircraft confirmed the sighting, no evasive action was taken, and no law enforcement was notified.</p>
  <div class="narr">This document is an FAA (Federal Aviation Administration) Washington Operations Center incident report, filed on April 7, 2024. It records an unidentified aerial phenomenon (UAP) sighting by the crew of Spirit Airlines flight 2321, an Airbus A320 flying from Orlando (MCO) to Newark (EWR).

According to the report, the crew observed five unidentified objects with white lights positioned above their aircraft. The sighting occurred while the plane was heading northeast at Flight Level 260 — roughly 26,000 feet — approximately 10 nautical miles north of Orlando, Florida, at around 11:47 PM Eastern time. The coordinates in the report (28.69°N, 81.33°W) are consistent with the Orlando area.

The crew did not take any evasive action. Jacksonville Air Route Traffic Control Center (ARTCC) was advised of the sighting. No other aircraft in the area reported seeing the objects, and law enforcement was not notified.

The report is marked as preliminary information and does not contain any conclusions about what the objects were. There is no description of how the objects moved, how long the sighting lasted, or how large the objects appeared. The FAA record simply documents what the crew reported — nothing more.</div>
