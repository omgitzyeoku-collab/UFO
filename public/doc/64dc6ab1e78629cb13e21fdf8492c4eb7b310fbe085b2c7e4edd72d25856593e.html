  <h1>Frontier Airlines Crew Reported White Blinking Lights at 35,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/64dc6ab1e78629cb13e21fdf8492c4eb7b310fbe085b2c7e4edd72d25856593e.jpg" alt="Frontier Airlines Crew Reported White Blinking Lights at 35,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident notification records that the crew of Frontier Airlines Flight 2300, flying from Dallas/Fort Worth to Philadelphia on 18 February 2023, reported seeing white blinking lights directly ahead of their aircraft at 35,000 feet, roughly 85 nautical miles southwest of Charleston, West Virginia. The document is a preliminary operational report, not an investigation — no conclusions or follow-up findings are included.</p>
  <div class="narr">This document is a preliminary incident notification from the FAA Washington Operations Center, the agency&#39;s round-the-clock coordination hub. It records a UAP (unidentified aerial phenomenon) sighting reported through normal air-traffic channels on 18 February 2023 at 04:00 Eastern time.

The report came from the crew of Frontier Airlines Flight 2300, an Airbus A321 flying eastbound from Dallas/Fort Worth to Philadelphia. While cruising at flight level 350 (35,000 feet), the crew told Indianapolis Air Route Traffic Control Center (ARTCC) that they observed something at their 12 o&#39;clock position — directly ahead of the aircraft — approximately 85 nautical miles southwest of the Charleston, West Virginia VOR (a ground-based navigation beacon). The coordinates place the sighting at roughly 38.35°N, 81.63°W, over the Appalachian region.

The phenomenon was described simply as white blinking lights. No shape, size, speed, or manoeuvre details appear in the record. The document is marked &quot;PRELIM INFO,&quot; meaning it is an initial notification rather than an analytical assessment or final conclusion.

No follow-up investigation results, radar data, or corroborating witness accounts are mentioned anywhere in the document. The FAA has not attached any explanation — conventional or otherwise — to the sighting in this record.</div>
