  <h1>Southwest Airlines Crew Reports Fast-Moving Lights at 60,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/1e6a44146bbc77a48bc0837b1507d0944151b9cceff80b15b3dba550f07800ba.jpg" alt="Southwest Airlines Crew Reports Fast-Moving Lights at 60,000 Feet thumbnail" loading="lazy" />
  <p>An FAA incident report from 7 December 2023 documents the crew of Southwest Airlines Flight 498, a Boeing 737 flying from Atlanta to Dallas, observing lights moving at high speed at an estimated 60,000 feet while cruising at 40,000 feet near Meridian, Mississippi. The lights were not detected on air traffic control radar, and no evasive action was taken.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed on 7 December 2023 at 8:51 PM Central time. It records a pilot observation of unidentified anomalous phenomena — the term the US government now uses for what were previously called UFOs.

The crew of Southwest Airlines Flight 498, a Boeing 737 en route from Atlanta to Dallas, reported seeing lights moving at a high rate of speed from left to right while the aircraft was westbound at 40,000 feet. The sighting occurred approximately 35 nautical miles west of Meridian, Mississippi, within Memphis Air Route Traffic Control Center airspace. The pilot estimated the lights were at roughly 60,000 feet — well above the ceiling of most commercial and military aircraft.

The flight crew took no evasive action. Air traffic control confirmed the phenomenon was not visible on their radar. The report contains no further description of the lights — no shape, size, colour, or duration is mentioned.

The document is a preliminary operations centre summary rather than a full investigation. It records the observation and the absence of radar corroboration, but draws no conclusions about what the crew saw. There is little evidence of redaction in this particular record.</div>
