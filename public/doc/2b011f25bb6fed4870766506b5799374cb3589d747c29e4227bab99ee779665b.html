  <h1>Federal Agent Reports Three UAP Encounters Over Two Nights in Western US</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">October, 2023</span>
    <span class="badge">Westen United States</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2b011f25bb6fed4870766506b5799374cb3589d747c29e4227bab99ee779665b.jpg" alt="Federal Agent Reports Three UAP Encounters Over Two Nights in Western US thumbnail" loading="lazy" />
  <p>A U.S. federal law enforcement special agent submitted a first-hand narrative to the All-domain Anomaly Resolution Office (AARO) describing three separate encounters with unidentified anomalous phenomena over two days in October 2023 in the western United States. The witness observed bright orb-like lights that expelled smaller red lights in coordinated formations, objects that appeared to mimic conventional vehicles while gliding over rugged terrain, and a light that outpaced a vehicle travelling at 80 mph.</p>
  <div class="narr">This document, dated 2 June 2026 and signed by AARO Director Jon T. Kosloski, is a narrative memorandum from a witness designated &quot;Witness 2&quot; — one of several U.S. federal law enforcement special agents who reported observing unidentified anomalous phenomena. The witness and their partner were originally tasked with surveying an area for individuals launching drones when the encounters occurred over two days in October 2023 in the western United States.

In the first incident, beginning around 1900 hours, the witness observed a bright circular orb-like light above the northern horizon that expelled three or four smaller red lights, each roughly 1/15 its size. These red lights accelerated instantly into a horizontal formation. The process repeated approximately five times across different parts of the horizon, and the red lights hovered above the southern horizon until roughly 2300 hours. Other law enforcement teams in the area confirmed they observed the same objects. No sound, interference, or physiological effects were reported.

The second incident began the following evening around 1845 hours. The witness initially saw what appeared to be vehicle headlights, but the lights transformed into a row of red lights arranged in a triangular formation covering an area the size of a football field. The objects stayed within 20 feet of the ground and appeared to mimic conventional vehicles — the witness compared them to a flying car from the Harry Potter series. At one point, the object came within approximately 50 yards before accelerating instantly, covering at least one mile in under a minute. It later traversed approximately four miles of rugged terrain in about one minute while gliding smoothly. Using night vision equipment, the witness also observed orange and purple lights in a box shape resembling a semi-truck.

During the third incident, the witness pursued an orange orb-like disc hovering at vehicle height above a road. Driving at approximately 80 mph, the witness could not close the distance over 10 to 15 miles. Other vehicles passing on the road did not appear to react to the object. The witness references video footage of at least one incident and notes that AI-generated images included in the document were created roughly two and a half years after the events and are not to exact scale.</div>
