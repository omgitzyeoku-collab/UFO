  <h1>Federal Agent Reports Silent, Semi-Transparent Objects Over Western U.S.</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">October, 2023</span>
    <span class="badge">Westen United States</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/670dbdbe40e70fa5f46485273d8f2c0eef7e604a7487416343ebec8bfc5f30c1.jpg" alt="Federal Agent Reports Silent, Semi-Transparent Objects Over Western U.S. thumbnail" loading="lazy" />
  <p>A U.S. federal law enforcement agent submitted a first-hand account to the All-domain Anomaly Resolution Office (AARO) describing multiple unidentified anomalous phenomena observed over two nights in October 2023 in the western United States. The objects included a large glowing sphere, orange lights that released red lights, and a partially transparent object that appeared to mimic a car before hovering silently and flying away.</p>
  <div class="narr">This document, dated 2 June 2026 and signed by AARO Director Jon T. Kosloski, is a narrative memorandum submitted by a U.S. federal law enforcement special agent describing UAP sightings over two consecutive nights in October 2023 in the western United States. It is a single-witness account written in free-form text, with no photographs, video, or sensor data included.

On the first evening, just before 7 PM at dusk, the witness observed a large glowing circular object near a hillside. The object had a swirly, lava-like pattern and was estimated at over 20 feet in diameter. Through binoculars, it appeared to have a line or spindle extending below it, possibly touching the hillside. The witness initially estimated the distance at 500–600 metres but later measured the hillside at roughly 1,100 metres using a range finder. Despite its brightness, the object cast no visible light on the ground or hillside behind it. It was visible for one to two minutes. Later that night, an orange light appeared over a different hillside several miles away, and three evenly spaced red lights flew out of it at speed before disappearing. A brief flash lit up the sky from beyond the horizon around the same time.

On the second night, the witness encountered what initially looked like a car with mismatched taillights — one round and red, one square and white. As it moved off the road, it did not bounce with the terrain and kicked up no dust. An oncoming vehicle passed without reacting. The object&#39;s lights appeared to remain oriented toward the witness even after changing direction. It then turned off its lights and flew away silently. The witness compared its general shape to a Toyota Prius. Shortly after, the witness observed dust and thick spider-web-like material floating in the air, alongside what appeared to be the same object hovering vertically at 15–20 feet, roughly 200 metres away. It was semi-transparent — a star and hillside vegetation were visible through it.

The document does not include any agency analysis, conclusions, or classification of what the objects were. It is a witness statement only. Other agents and teams are mentioned as having observed unusual lights, but their accounts are not included in this release.</div>
