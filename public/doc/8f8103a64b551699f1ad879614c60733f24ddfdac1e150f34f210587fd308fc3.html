  <h1>JetBlue Crew Reported Large Balloon at 50,000 Feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/8f8103a64b551699f1ad879614c60733f24ddfdac1e150f34f210587fd308fc3.jpg" alt="JetBlue Crew Reported Large Balloon at 50,000 Feet in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a JetBlue flight crew observing a large balloon at approximately 50,000 feet or higher while flying from New York to San Francisco on 3 February 2023. The sighting was logged as an Unidentified Aerial Phenomenon and the case is marked closed with no further explanation.</p>
  <div class="narr">On 3 February 2023 at 17:16 UTC, the crew of JetBlue flight JBU115 — an Airbus A321 flying westbound from JFK (New York) to SFO (San Francisco) — reported seeing a large balloon off the left side of the aircraft. The plane was cruising at flight level 340, roughly 34,000 feet, about 40 nautical miles north of a navigational point identified as BQS.

The crew estimated the balloon was at flight level 500 (approximately 50,000 feet) or above — well beyond the operating ceiling of most commercial aircraft. The sighting was reported through Kansas City Center (ZKC), one of the FAA&#39;s air traffic control facilities.

The FAA logged the incident under its SKYWATCH programme with the primary code &quot;Unidentified Aerial Phenomenon.&quot; The report is now marked as closed. No corroborating radar or sensor data appears in the document, and no further analysis or identification of the balloon is provided.

The timing is notable: this report is from early February 2023, during the same period the United States was tracking and ultimately shooting down a Chinese surveillance balloon and several other unidentified objects at high altitude. The document does not draw any connection to those events.</div>
