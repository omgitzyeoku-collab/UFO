  <h1>FAA Tracked a Homemade Balloon Mistaken for a UFO in 2009</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9853355e490a4c6c2d1f6933443e0cfe262dde27e3029515c09c478b2c5e8898.jpg" alt="FAA Tracked a Homemade Balloon Mistaken for a UFO in 2009 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from October 2009 documenting a homemade helium balloon, built to resemble a UFO, that was tracked over the Denver area after a father reported his six-year-old son might be aboard. The child was later found safe at home and had never been on the balloon — the widely covered &#39;Balloon Boy&#39; incident.</p>
  <div class="narr">This document is an internal FAA incident report filed under the SKYWATCH programme, catalogued as record 237UAP00010. It records events on 16 October 2009 in the Denver, Colorado area. The reporting facility was ZDV (Denver Center), and the case is marked as closed.

At 17:30 local time, a father contacted Denver Center air traffic control directly to report that his six-year-old son had gone airborne in a helium-filled balloon he had built to resemble a UFO. The balloon reached altitudes of 12,000 to 13,000 feet and travelled approximately 30 miles. Because it carried no transponder or Mode-C readout, air traffic control had no way to track its altitude using standard radar resources.

A television news helicopter began filming the balloon within 1 to 1.5 miles of the launch site and followed it for nearly the entire flight. Two Air National Guard helicopters joined the pursuit at around the 15-mile point. The balloon eventually landed softly in a clearing at a point designated DEN026, about 10.4 miles out.

The report notes that the family had previously appeared on a reality television show. CNN later reported that the boy was found safe at home and had never been aboard the balloon. The incident became widely known as the &#39;Balloon Boy&#39; hoax.

This record appears in the PURSUE UAP collection likely because the object was initially unidentified and was designed to look like a UFO. It is not a genuine unidentified aerial phenomenon case — it documents a resolved incident with a known explanation.</div>
