  <h1>FBI Documents Government Employee&#39;s Silent Cigar-Shaped Object Over Military Base</h1>

  <img class="thumb" src="/extract/thumbs/4f462fefe8f38e6445f652067ff0ba418e6b0d4f38ce73b5c8190e857fe352ed.jpg" alt="FBI Documents Government Employee&#39;s Silent Cigar-Shaped Object Over Military Base thumbnail" loading="lazy" />
  <p>An FBI interview report from September 2023 records a US government employee describing a large, silent, cigar-shaped object hovering over a military test site. The object, described as metallic bronze with an intense white light, was also seen by a second witness before it vanished within seconds.</p>
  <div class="narr">This document is an FBI FD-302 — a standard witness interview form — recorded in October 2023. It captures the firsthand account of a US government employee who observed an unidentified object while driving to a test site on a military base on September 4, 2023.

The witness, who had fifteen years of experience at the installation and had restricted the airspace that day for upcoming tests, described a cigar-shaped, metallic bronze object hovering roughly 500 to 3,000 feet above a nearby tree line. She estimated it was the length of two or three Blackhawk helicopters lined up nose to tail. The object carried an intense diamond-white light with a ring around it on its eastern end, bright enough that looking at it was &quot;like looking into the sun.&quot; It drifted slowly from east to west, was completely silent, and then simply disappeared after five to ten seconds. The sky was clear, and the object left no contrails.

A contractor in a second vehicle in the three-vehicle convoy also reported seeing the object. However, no photos or video were taken. The witness noted that a remotely operated gate had malfunctioned three times shortly before the sighting — failing to open fully before succeeding on the fourth try — though the document draws no explicit connection between the gate issue and the object. No interference with her vehicle&#39;s engine was observed.

The witness said she would not have reported the sighting had she been the only observer, and several co-workers mocked her after she filed the report. Despite her extensive familiarity with military aircraft and drones, she stated she had never seen anything like it. The document does not record any conclusions or identification by the FBI.

The report is heavily redacted throughout: the witness&#39;s name, the base&#39;s name, the specific location, supervisor and contractor names, and test details are all blacked out.</div>
