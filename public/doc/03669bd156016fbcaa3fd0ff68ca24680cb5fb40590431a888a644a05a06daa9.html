  <h1>Aeromexico Crew Reports Orbiting Lights Over Central US at 37,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/03669bd156016fbcaa3fd0ff68ca24680cb5fb40590431a888a644a05a06daa9.jpg" alt="Aeromexico Crew Reports Orbiting Lights Over Central US at 37,000 Feet thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH report documents the crew of Aeromexico flight AMX692, a Boeing 737 MAX 8 flying from Mexico City to Toronto, observing several lights performing an orbital pattern at very high altitude roughly 60–80 miles ahead of their aircraft. Neither air traffic control radar nor a nearby FedEx flight could confirm the sighting, and the FAA closed the case without identifying the objects.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00086. It records a UAP (Unidentified Aerial Phenomenon) sighting reported by the flight crew of Aeromexico flight AMX692, a Boeing 737 MAX 8 operating a commercial route from Mexico City (MMMX) to Toronto (CYYZ).

The aircraft was cruising at FL370 (37,000 feet), heading 041 at 504 knots, over the central United States — likely the Kentucky/Indiana area based on navigational references in the report. The crew reported observing several lights performing an orbital pattern at very high altitude, estimated 60 to 80 miles ahead of their position.

Memphis Center (ZME), the FAA air traffic control facility handling the area, checked radar and found no returns showing any objects in the vicinity at any altitude. A FedEx cargo flight, FDX1, was also in the area at FL380 (38,000 feet), approximately 70 miles west of Louisville. That crew reported seeing nothing anomalous.

Memphis Center filed a Mandatory Occurrence Report (MOR) for the record and notified AWO, an FAA operations office. The case is marked Closed with no explanation or identification of the lights provided. No tail number was recorded for the Aeromexico aircraft, which limits further verification.</div>
