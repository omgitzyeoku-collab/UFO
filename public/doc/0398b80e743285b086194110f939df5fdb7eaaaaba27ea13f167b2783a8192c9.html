  <h1>American Airlines Crew Reported High-Altitude Balloon Over Missouri in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0398b80e743285b086194110f939df5fdb7eaaaaba27ea13f167b2783a8192c9.jpg" alt="American Airlines Crew Reported High-Altitude Balloon Over Missouri in 2023 thumbnail" loading="lazy" />
  <p>An FAA incident report records that the crew of American Airlines flight AAL1376, an Airbus A321 flying from Boston to Los Angeles, spotted a large balloon estimated at roughly 50,000 feet near St. Joseph, Missouri on 3 February 2023. The case was closed with no identification or explanation noted.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unidentified aerial phenomenon (UAP) sightings reported by aircrew or air traffic controllers. It was filed under the primary code &quot;Unidentified Aerial Phenomenon&quot; and assigned the identifier 237UAP00170.

On 3 February 2023 at 15:54, the crew of American Airlines flight AAL1376 — an Airbus A321 travelling westbound from Boston (BOS) to Los Angeles (LAX) — reported a large balloon off the right side of their aircraft. The plane was cruising at flight level 320, roughly 32,000 feet. The sighting occurred approximately 4 nautical miles northwest of St. Joseph, Missouri, and was reported through Kansas City Center (ZKC), the FAA facility managing that airspace.

The crew estimated the balloon was at flight level 500 — approximately 50,000 feet — or above. That is an unusually high altitude, well above commercial traffic, and the estimate may reflect the difficulty of judging altitude visually from a moving aircraft.

The report&#39;s status is listed as &quot;Closed.&quot; No resolution, identification, or follow-up findings are included in the document. There is no mention of radar data, photographs, or any corroborating sensor evidence beyond the crew&#39;s visual observation.

The date of this sighting — 3 February 2023 — falls during the same period as the widely reported Chinese surveillance balloon incident that dominated US news in late January and early February 2023. However, this FAA report does not reference or link the sighting to that event.</div>
