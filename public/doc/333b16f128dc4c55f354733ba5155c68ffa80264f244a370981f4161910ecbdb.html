  <h1>Commercial Pilot Reports Three Circling Lights Over South Carolina</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/333b16f128dc4c55f354733ba5155c68ffa80264f244a370981f4161910ecbdb.jpg" alt="Commercial Pilot Reports Three Circling Lights Over South Carolina thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a 2023 sighting by a commercial flight crew of three circling lights maneuvering at 40,000 feet near Florence, South Carolina. Air traffic control confirmed a primary radar return at the reported location, but the case was closed without identifying the object.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP). It records an event from 12 August 2023 involving a commercial aircraft flying under the callsign SCX8727.

According to the report, the flight crew observed an unidentified aerial phenomenon off the right side of their aircraft while heading northbound at 20,000 feet. The phenomenon was described as three circling lights maneuvering at 40,000 feet — roughly double the altitude of the reporting aircraft. The sighting occurred at coordinates 34.25°N 80.09°W, approximately 30 nautical miles southwest of Florence, South Carolina.

Jacksonville Center (ZJX), the FAA air traffic control facility covering that airspace, confirmed that it received a primary radar target at the same coordinates the crew reported. Primary radar detects physical objects by bouncing radio signals off them, as opposed to secondary radar which reads transponder signals from cooperative aircraft.

The case is marked as closed. No identification or resolution of what the lights were is provided anywhere in the document. No tail number for the reporting aircraft is recorded, and the report contains minimal detail beyond the crew&#39;s account and the radar confirmation.

The time of the event is logged as 05:55, which under standard FAA convention is likely UTC — placing the sighting at roughly 1:55 AM local Eastern time, meaning this was a nighttime observation.</div>
