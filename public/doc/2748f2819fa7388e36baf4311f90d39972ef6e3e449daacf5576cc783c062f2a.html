  <p>The United States Indo-Pacific Command submitted a report of an unidentified anomalous phenomenon to the All-domain Anomaly Resolution Office (AARO) consisting of 36 seconds of video footage from an infrared sensor aboard a U.S. military platform in 2024.

Video Description: 
00:01-00:20: The sensor tracks an area of contrast, keeping it generally within the center of the frame.
00:21-00:29: The area of contrast exits the sensor field-of-view at the top of the frame.
00:30-00:36: The sensor zooms out and in several times. No content
