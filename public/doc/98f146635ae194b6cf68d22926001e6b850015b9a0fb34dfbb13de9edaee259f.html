  <h1>Cargo Pilot Reports Metallic Object at 40,000 Feet Near Louisville</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/98f146635ae194b6cf68d22926001e6b850015b9a0fb34dfbb13de9edaee259f.jpg" alt="Cargo Pilot Reports Metallic Object at 40,000 Feet Near Louisville thumbnail" loading="lazy" />
  <p>This FAA incident report documents a cargo airline pilot flying a Boeing 767 who reported seeing a metallic unidentified object at 40,000 feet, roughly 21 nautical miles southwest of Louisville, Kentucky, on 19 September 2023. The case was closed without the object being identified.</p>
  <div class="narr">On 19 September 2023 at 23:01 UTC, the crew of a Boeing 767 cargo aircraft — callsign ATN3443, operated by ABX Air (a commercial cargo carrier running freight routes for companies like DHL and Amazon) — reported an unidentified aerial phenomenon to the FAA. The aircraft was flying northwest at FL400, approximately 40,000 feet, and was about 21 nautical miles southwest of SDF (Louisville Muhammad Ali International Airport) at the time.

The flight crew described the object as metallic. The pilot-in-command was unable to identify it and did not provide any further description beyond that single word. No additional details about the object&#39;s size, shape, movement, or behaviour appear in the report.

The FAA logged this under its SKYWATCH programme with the primary code &quot;Unidentified Aerial Phenomenon.&quot; The case is marked as closed. Notably, the report contains no indication that the object was ever identified or explained — it was simply closed without resolution.

The document shows minimal redaction. It is a single-page incident report rather than a lengthy investigation file, which limits how much can be drawn from it. There is no mention of corroborating radar data, additional witness accounts, or follow-up investigation in the material released.</div>
