  <h1>United Airlines Crew Reports Bright Lights Near Big Dipper at 35,000 Feet</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/c26976c358b539d0955397c18d6d35d630eb57c92fa80e1f6025f36422175368.jpg" alt="United Airlines Crew Reports Bright Lights Near Big Dipper at 35,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident notification records a UAP sighting by the crew of United Airlines flight 980, a Boeing 757-200 flying from Chicago to Dublin on 26 September 2023. At 35,000 feet, the crew observed bright lights orbiting at high altitude near the Big Dipper constellation; no evasive action was taken and no follow-up investigation is included in the document.</p>
  <div class="narr">This document is an incident notification from the FAA&#39;s Washington Operations Center, recording a UAP (unidentified anomalous phenomena) sighting reported by a commercial airline crew on 26 September 2023.

United Airlines flight 980, a Boeing 757-200 operating from Chicago O&#39;Hare to Dublin, Ireland, was cruising at 35,000 feet when the crew observed bright lights orbiting at high altitude in the vicinity of the Big Dipper constellation. The sighting was reported through Boston ARTCC (Air Route Traffic Control Center), the FAA facility managing that airspace.

The crew took no evasive action, and no law enforcement was notified. The document contains no radar data, no sensor readings, and no corroborating reports from other aircraft or ground stations.

The record ends there. No follow-up investigation, resolution, or agency conclusion is included in this document. The FAA notification simply logs what the crew reported and the basic flight details.</div>
