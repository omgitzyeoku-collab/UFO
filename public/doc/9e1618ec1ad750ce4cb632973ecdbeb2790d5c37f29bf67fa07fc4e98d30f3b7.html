  <h1>Pilot at 43,000 Feet Reported Large Balloon Above Them in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9e1618ec1ad750ce4cb632973ecdbeb2790d5c37f29bf67fa07fc4e98d30f3b7.jpg" alt="Pilot at 43,000 Feet Reported Large Balloon Above Them in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a general aviation pilot who spotted a large balloon flying at approximately 50,000 feet while they were cruising at 43,000 feet on 3 February 2023. The FAA classified it as an Unidentified Aerial Phenomenon and closed the case with no further investigation notes included.</p>
  <div class="narr">On 3 February 2023 at 17:26 UTC, the pilot of a general aviation aircraft with callsign N506BA reported seeing a large balloon off the left side of their aircraft. The plane was flying westbound at FL430 — approximately 43,000 feet — and was located 10 nautical miles north of BQS at the time of the sighting.

The pilot estimated the balloon was at FL500 (approximately 50,000 feet) and above, placing it roughly 7,000 feet higher than the observing aircraft. The FAA logged the event under its SKYWATCH system and assigned it the primary classification of Unidentified Aerial Phenomenon.

The case status is listed as closed. The report is brief and contains no follow-up investigation notes, no confirmation of what the balloon was, and no resolution beyond the initial classification. Several fields in the report, including the aircraft&#39;s tail number and operator name, are blank.

The timing is notable: this incident occurred during the first week of February 2023, the same period when multiple high-altitude balloon sightings — including the widely reported Chinese surveillance balloon — were dominating US airspace concerns. The report itself does not connect this sighting to those events, and the object was not formally identified.</div>
