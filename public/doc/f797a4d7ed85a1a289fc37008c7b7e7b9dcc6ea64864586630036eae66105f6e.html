  <h1>Pilot Reports Red Orb Passing Within Feet of Commercial Flight</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f797a4d7ed85a1a289fc37008c7b7e7b9dcc6ea64864586630036eae66105f6e.jpg" alt="Pilot Reports Red Orb Passing Within Feet of Commercial Flight thumbnail" loading="lazy" />
  <p>This FAA incident report documents a commercial airline pilot observing a red orb with black markings pass extremely close to their aircraft at 25,000 feet on April 19, 2021. The case was closed with no further investigation, and a tape review confirmed the close encounter but found the pilot did not use the term &#39;UFO&#39; on the recording.</p>
  <div class="narr">On April 19, 2021, the pilot-in-command of a Bombardier CRJ-900 regional jet (callsign EDV4979) flying from Dayton, Ohio to Atlanta reported an unidentified object while cruising at 25,000 feet. The aircraft was southbound near the Cincinnati area when the pilot observed a red orb with black markings off the right side of the plane, estimating it passed just 30 feet above and 200 feet to the side of the aircraft.

The pilot initially described the object as a UFO, then later suggested it might have been a weather balloon but said they were unsure. Indianapolis Center (ZID), the FAA facility handling the airspace, logged the report through the agency&#39;s SKYWATCH incident reporting system.

The ZID Operations Manager reviewed the recorded air traffic control tapes and determined that the pilot did not actually use the term &#39;UFO&#39; on the recording, though the tapes did confirm the pilot reported the object passing within very close proximity to the aircraft.

The FAA classified the report under its primary code &#39;OTHER&#39; and marked the case as closed. There is no indication in the document that any follow-up investigation was conducted, and no radar data or additional witness accounts are included in the report.</div>
