  <h1>Commercial Flight Crew Reports Flashing Light at 31,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/167a4dce84c9b9305add5271f268d24be5bc87b1ff515fa273e488806ecc1dea.jpg" alt="Commercial Flight Crew Reports Flashing Light at 31,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of commercial flight FFT2146 on 19 February 2023. While flying eastbound at 31,000 feet, the crew observed a flashing light at their eleven o&#39;clock position and compared it to a balloon sighting from weeks earlier. The case is closed with no evasive action taken and no explanation recorded.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — the system the Federal Aviation Administration uses to log unidentified aerial phenomenon (UAP) sightings reported by pilots and air traffic controllers. It covers a single event on 19 February 2023 involving flight FFT2146, a commercial Airbus A320neo operating from Las Vegas to Charlotte.

While cruising eastbound at flight level 310 (31,000 feet), approximately 15 nautical miles west of the SOT navigational fix, the flight crew spotted a flashing light off their eleven o&#39;clock position. The crew noted that the object appeared similar to a balloon incident from several weeks prior — almost certainly a reference to the Chinese surveillance balloon that was tracked across the US and shot down in early February 2023.

No evasive action was taken by the aircraft. The crew notified AWO (the FAA&#39;s internal reporting channel), and no law enforcement notification was made. The FAA has marked this case as closed.

The report contains no radar data, no photographs, and no corroborating observations from other aircraft or ground stations. There is no recorded conclusion about what the object was. The level of redaction in the document appears low — the report is simply brief rather than censored.</div>
