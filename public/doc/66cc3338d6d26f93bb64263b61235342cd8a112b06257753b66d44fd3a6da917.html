  <h1>NetJets Pilot Reported Large Balloon at 50,000 Feet in February 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/66cc3338d6d26f93bb64263b61235342cd8a112b06257753b66d44fd3a6da917.jpg" alt="NetJets Pilot Reported Large Balloon at 50,000 Feet in February 2023 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a commercial pilot&#39;s sighting of a large balloon at approximately 50,000 feet on 3 February 2023. The aircraft, callsign EJA807, was flying westbound at 43,000 feet near the Mercer VOR when the pilot spotted the object directly ahead. The case is closed.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed on 3 February 2023 at 18:41 UTC. It was classified under the primary code &quot;Unidentified Aerial Phenomenon&quot; and reported through Kansas City Center (ZKC), an FAA air traffic control facility.

A commercial aircraft with the callsign EJA807 was flying westbound at FL430 (approximately 43,000 feet) when the pilot reported a large balloon directly ahead at the 12 o&#39;clock position. The aircraft was 15 nautical miles southwest of the Mercer VOR (MCM) at the time. The pilot estimated the balloon was at approximately FL500 (50,000 feet) and below.

The report identifies the operator type as commercial. The named airports in the record — IAD (Washington Dulles) and BUR (Hollywood Burbank) — indicate the flight&#39;s route. DEN (Denver) also appears in the record.

The FAA marked the case as closed. The report contains no imagery, no radar corroboration, and no further analysis or conclusion about what the balloon was. The tail number field is blank.

The date of this sighting — 3 February 2023 — falls during a well-documented period when multiple high-altitude objects, including a Chinese surveillance balloon, were tracked over North America. The altitude of approximately 50,000 feet is consistent with known altitudes of that balloon. However, this document does not explicitly connect the sighting to that event.</div>
