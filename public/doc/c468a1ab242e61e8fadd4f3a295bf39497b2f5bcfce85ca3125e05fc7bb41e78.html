  <h1>Navy C-130 Crew Reported Small Orb at 24,000 Feet Over Wyoming</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c468a1ab242e61e8fadd4f3a295bf39497b2f5bcfce85ca3125e05fc7bb41e78.jpg" alt="Navy C-130 Crew Reported Small Orb at 24,000 Feet Over Wyoming thumbnail" loading="lazy" />
  <p>An FAA operations center notification records that a US Navy C-130 crew observed a small orb-shaped object, roughly 1–2 metres across, moving eastbound while flying at about 24,000 feet near Laramie, Wyoming on 11 May 2024. No evasive action was taken and no further investigation is documented here.</p>
  <div class="narr">This document is an incident notification from the FAA&#39;s Washington Operations Center — essentially a short internal log entry, not a full investigation report. It records a UAP sighting relayed through Denver Air Route Traffic Control Center (ARTCC), the regional facility that manages high-altitude air traffic across the Rocky Mountain states.

On 11 May 2024, at approximately 3:37 PM Mountain time, a US Navy C-130 transport aircraft (callsign CNV3460) reported seeing an orb roughly 1–2 metres in diameter while cruising at Flight Level 240 — about 24,000 feet — in the vicinity of Laramie, Wyoming. The object was moving eastbound. The crew&#39;s origin and destination are listed as unknown in the report.

The notification states that no evasive action was taken by the aircraft and that law enforcement notification was not required. The document ends there — it contains no analysis, no follow-up findings, and no explanation of what the object might have been.

Coordinates included in the report (41.31°N, 105.67°W) are consistent with the Laramie, Wyoming area, though the document contains a labelling error: both coordinate fields are marked &quot;Latitude&quot; when the second value is clearly a longitude. This appears to be a data-entry quirk rather than anything substantive.</div>
