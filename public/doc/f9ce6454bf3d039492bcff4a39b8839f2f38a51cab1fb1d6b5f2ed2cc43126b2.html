  <h1>FBI Agents Photographed Unidentified Aerial Phenomenon in Northeast US</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/f9ce6454bf3d039492bcff4a39b8839f2f38a51cab1fb1d6b5f2ed2cc43126b2.jpg" alt="FBI Agents Photographed Unidentified Aerial Phenomenon in Northeast US thumbnail" loading="lazy" />
  <p>This heavily redacted FBI internal communication documents an investigation into an unidentified aerial phenomenon in the northeastern United States in November 2024. Special agents took photographs on multiple occasions, but nearly all substantive details — including what was observed, agent names, and specific dates — have been blacked out.</p>
  <div class="narr">This document is an FBI Electronic Communication, a standard internal reporting form (FD-1057) used to record investigative activity. It was filed under the classification &quot;Unidentified Aerial Phenomenon&quot; and relates to events in the northeastern United States during November 2024.

The filing confirms that FBI special agents were directly involved in observing and documenting something. The document references enclosed photographs taken by at least two different agents on separate dates in November 2024, indicating the Bureau conducted active fieldwork over multiple occasions rather than simply receiving a report.

The document was formally approved through FBI channels, though the approving official&#39;s name is redacted. A synopsis section exists and references &quot;observations,&quot; but the details of what the agents actually saw are entirely blacked out.

The redaction level is extreme. Agent names, specific dates, case numbers, contact information, and — critically — every substantive detail about the phenomenon itself have been removed. The original text was also captured via image scanning rather than digital text, introducing additional garbled characters that further obscure whatever survives the redactions. As a result, this document confirms an FBI investigation occurred and that agents gathered photographic evidence, but reveals nothing about what they encountered.</div>
