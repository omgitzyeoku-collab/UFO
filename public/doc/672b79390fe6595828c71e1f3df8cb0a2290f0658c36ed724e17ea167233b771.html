  <h1>U.S. Air Force Crew Reported One UAP Over Gulf of Aden in 2024</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">7/14/24</span>
    <span class="badge">Gulf of Aden</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/672b79390fe6595828c71e1f3df8cb0a2290f0658c36ed724e17ea167233b771.jpg" alt="U.S. Air Force Crew Reported One UAP Over Gulf of Aden in 2024 thumbnail" loading="lazy" />
  <p>A formerly secret U.S. military mission report documents a single unidentified anomalous phenomenon (UAP) spotted by an Air Force surveillance crew over the Gulf of Aden on July 14, 2024. The object flew in a straight line, faster than the observing aircraft, and was assessed as non-threatening; heavy redactions obscure most technical details.</p>
  <div class="narr">On July 14, 2024, at 0517 Zulu time (early morning UTC), a crew member from the 124th Attack Squadron, part of the 132 Wing operating under U.S. Central Command (USCENTCOM), observed a single UAP while conducting an intelligence, surveillance, and reconnaissance (ISR) mission in the Gulf of Aden. The aircraft&#39;s primary sensor was full-motion video (FMV). The mission supported Naval Forces Central Command (NAVCENT), and weather was reported as not a factor.

According to the report, the UAP maintained a straight flight path at a constant, low altitude and traveled on a northwest trajectory. Its speed exceeded that of the observing aircraft — though the aircraft&#39;s type and airspeed are redacted. The crew followed the object until it moved too far away to continue tracking. The observer, a Technical Sergeant (E-5), assessed the UAP as benign.

The report states there was no engagement with the object, no interrogation by onboard sensors, and no materials recovered. The UAP had no reported effect on personnel or equipment. Its propulsion method, whether it was under intelligent control, and whether it displayed advanced capabilities were all listed as unknown. No third-party observers were reported, making this a single-source account.

The document was originally classified SECRET and releasable only to the U.S. and Five Eyes allies, with a declassification date of July 14, 2049. Its release was recommended on June 2, 2025, by Major General Brandon R. Tegtmeier, USCENTCOM Chief of Staff. Heavy redactions remain throughout: the aircraft type, tail number, callsign, exact coordinates, speeds, altitudes, sensor specifics, and the physical description of the UAP are all blacked out under national security exemptions.

The document does not offer any conclusion about what the object was. All altitude and velocity figures are noted as estimated rather than instrument-measured, and the UAP description field appears to be cut off or redacted, leaving the object&#39;s appearance unknown from this report alone.</div>
