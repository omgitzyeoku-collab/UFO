  <h1>NASA Internal Memos Detail Gemini 9 Science Experiments and Equipment Failures</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">June 3-6, 1966</span>
    <span class="badge">Low Earth Orbit</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/971d604c8a91acb14a05b818e07f1c6530faf73845dd98f3cdbe0ede6d85c4b8.jpg" alt="NASA Internal Memos Detail Gemini 9 Science Experiments and Equipment Failures thumbnail" loading="lazy" />
  <p>This document is a collection of internal NASA memos and routing slips from 1966, recording the scientific experiments debriefing for the Gemini IX-A mission. It covers experiment results — including zodiacal light photography, airglow imaging, micrometeorite collection, and biological specimens — alongside equipment failures and the infamous &#39;angry alligator&#39; docking target malfunction. It is an administrative record, not a UAP investigation report.</p>
  <div class="narr">In June 1966, NASA flew the Gemini IX-A mission with astronauts Thomas Stafford and Eugene Cernan in low Earth orbit over three days. This document, compiled primarily by J. R. Gill of NASA&#39;s Manned Flight Experiments Office, records the internal communications surrounding the mission&#39;s scientific experiments debriefing, held on 16 June 1966 at the Manned Spacecraft Center in Houston.

The mission carried several experiments but ran into significant problems. The Augmented Target Docking Adapter (ATDA) — the vehicle the crew was supposed to dock with — had a faulty shroud that failed to separate, making it impossible to dock or retrieve the S-10 micrometeorite collection experiment mounted on it. Stafford nicknamed the malfunctioning target &#39;an angry alligator&#39; because of its appearance. The spacewalk proved so physically demanding that hand-held photography was deemed impractical, and the Astronaut Maneuvering Unit exercise failed because controlling body position required both hands, leaving none free for other tasks.

Despite the setbacks, several experiments produced useful results. The zodiacal light photographs, taken on Tri-X film, were judged the best yet obtained, surpassing those from Gemini V. About 40 usable airglow pictures were captured, and the micrometeorite collection surface recorded 9 impacts on the portion analysed. Over 300 colour photographs were taken with Hasselblad and Maurer cameras, and one image revealed a previously unmapped glacial lake in the Andes that posed a potential avalanche hazard to villages below — the Peruvian Embassy was informed and Peru sent a military plane to investigate. Biological experiments found that T-4 bacteriophages and penicillium specimens survived spaceflight, while two other specimens did not, and that areas inside the spacecraft that were contaminated before flight were found sterile afterward.

This document&#39;s inclusion in the war.gov PURSUE UAP release appears to relate to astronaut observations of &#39;flashing lights&#39; and &#39;sparkles&#39; referenced in the release&#39;s catalogue description. However, those specific accounts do not appear in the extracted text of the document — they may be in handwritten portions that could not be read by text extraction, or on pages the OCR process failed to capture. The document itself is administrative in nature, focused on experiment logistics and results rather than anomalous sightings.</div>
