  <h1>NASA&#39;s Gemini 4 Crew Debriefing Covers Spacecraft Systems but Omits Visual Sightings</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">6/9/65</span>
    <span class="badge">North Atlantic Ocean</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2be20f887d364078d11c7340380c21800348ac84beb5722c5932ef0be3e57c57.jpg" alt="NASA&#39;s Gemini 4 Crew Debriefing Covers Spacecraft Systems but Omits Visual Sightings thumbnail" loading="lazy" />
  <p>This 1965 NASA document is the second part of a preliminary debriefing transcript from the Gemini 4 mission, featuring astronauts James McDivitt and Edward White discussing spacecraft systems performance. Although the table of contents lists a Visual Sightings section — the portion most relevant to UAP research — that section&#39;s content does not appear in the extracted text.</p>
  <div class="narr">In June 1965, NASA conducted a debriefing of astronauts James McDivitt and Edward White following the Gemini 4 mission. The session began aboard the recovery ship USS Wasp on 9 June 1965 and concluded at the Manned Spacecraft Center on 12 June. The Spacecraft Operations Branch published this preliminary transcript — Part II — on 18 June 1965, nine days after splashdown in the North Atlantic Ocean.

The bulk of what survives in this extracted text covers spacecraft engineering: the Orbital Attitude and Maneuvering System (OAMS) started at 75 degrees and roughly 2,800 psi, and fuel never dropped below 50 percent across four days of flight. The Reaction Control System (RCS) heater lights began cycling around the 64th–65th hour. Cabin temperature peaked near 100 degrees on the first orbit before settling at 82–83 degrees for the rest of the mission. White reported his EVA suit bottles were full at 3,400 pounds and that he logged over 50 hours in his flight suit. He also flagged a missing blood-pressure plug as a safety concern for extravehicular activity.

The document was originally classified under espionage laws (Title 18 U.S.C. Sections 793 and 794), with a downgrade schedule of three-year intervals and full declassification after twelve years. The table of contents lists a Visual Sightings section spanning pages 188–213, covering observations during countdown, powered flight, orbital flight, and re-entry. However, the actual content of that section does not appear in this extracted portion of the document — meaning the observations most relevant to UAP research are absent from what is currently available.

The transcript is explicitly labelled preliminary. NASA noted at the time that it had not been thoroughly reviewed and that an official version would follow. OCR artefacts in the digitised scan further reduce the reliability of individual word-level details.</div>
