  <h1>Airline Crew Reports Two Unidentified Objects Orbiting Above Their Flight</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/8e8ddb1c810e92188a02657d024850b16bf500cd397553c86ac4786e96d8f534.jpg" alt="Airline Crew Reports Two Unidentified Objects Orbiting Above Their Flight thumbnail" loading="lazy" />
  <p>An FAA operations center log records that the crew of Envoy Air flight 3781, flying an Embraer E170 from Chattanooga to Dallas-Fort Worth, reported seeing two unidentified aircraft orbiting roughly 10,000 feet above them near Shreveport, Louisiana on 27 December 2023. The document is a brief preliminary log entry, not a full investigation, and includes no radar data or follow-up findings.</p>
  <div class="narr">On 27 December 2023 at approximately 8:34 PM Central time, the flight crew of Envoy Air flight 3781 — an Embraer E170 operating from Chattanooga, Tennessee to Dallas-Fort Worth, Texas — reported an unusual sighting to air traffic control. The aircraft was cruising westbound at flight level 300 (approximately 30,000 feet) near Shreveport, Louisiana when the crew observed two objects directly ahead of them, orbiting roughly 10,000 feet above their altitude, placing the objects at around 40,000 feet.

The crew described the objects as &quot;orbiting aircraft&quot; but provided no further detail about their shape, size, lighting, or speed. Dallas-Fort Worth ARTCC (Air Route Traffic Control Center), the regional radar facility, was advised of the sighting. The crew took no evasive action, and no law enforcement notification was reported.

This document is a Washington Operations Center log entry from the FAA — essentially a short preliminary incident record. It is not a full investigation report and contains no conclusions about what the objects were. There is no corroborating radar data, no additional witness accounts, and no follow-up analysis included in the record.</div>
