  <h1>Delta 757 Crew Reports Unidentified Object at 38,000 Feet Over Florida</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d72041906685d30e653b73f5f606656f8c767325d58b5500d82cc103fa01de24.jpg" alt="Delta 757 Crew Reports Unidentified Object at 38,000 Feet Over Florida thumbnail" loading="lazy" />
  <p>An FAA operations center notification records that the crew of Delta flight 8934, a Boeing 757-200 flying from Miami to New Orleans, reported an unidentified aerial phenomenon directly ahead of their aircraft at 38,000 feet on January 23, 2023. No evasive action was taken, and the UFO Reporting Center was notified.</p>
  <div class="narr">This document is a preliminary incident notification from the FAA&#39;s Washington Operations Center, not a full investigation report. It records a pilot-reported sighting of an unidentified aerial phenomenon (UAP) — the current official term for what was previously called a UFO.

On January 23, 2023, at 2:38 AM Eastern time, the crew of Delta flight 8934 — a Boeing 757-200 operating the Miami to New Orleans route — reported a UAP at their 12 o&#39;clock position, meaning directly ahead of the aircraft. The plane was flying northwest at flight level 380 (approximately 38,000 feet), roughly 40 nautical miles southwest of St. Petersburg-Clearwater International Airport in Florida. Miami Air Route Traffic Control Center (ARTCC) was the facility handling the flight.

The crew took no evasive action in response to the sighting. The FAA&#39;s UFO Reporting Center was notified of the incident.

The document provides no description of the object&#39;s appearance, size, movement, or behaviour. There is no radar data, sensor evidence, or follow-up investigation included. It is strictly an initial notification — a record that the event was reported, not an analysis of what was observed.</div>
