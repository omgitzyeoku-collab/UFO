  <h1>Two Airliners Reported a Bright Light Over US Airspace in 2019</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/68eaa6787801da1a8f90d894ce8c8e358d22f1cdcb8d2ebdd7e09ca54c18b17e.jpg" alt="Two Airliners Reported a Bright Light Over US Airspace in 2019 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a March 2019 sighting in which two commercial aircraft crews — Aeromexico flight 636 and United Airlines flight 1065 — independently observed a bright unidentified light near their flight paths. The FAA&#39;s follow-up review found numerous conventional aircraft in the area but made no definitive identification of the light, and the case was closed without a specific explanation.</p>
  <div class="narr">On 4 March 2019, at approximately 0115 Zulu time (coordinated universal time), the crew of Aeromexico flight 636 — a Boeing 737-800 flying from Montreal to Mexico City — reported a bright light in the vicinity of their aircraft to Memphis Center (FAA facility code ZME). The crew of United Airlines flight 1065 independently confirmed seeing the same light. The Aeromexico crew explicitly used the term &quot;UFO&quot; to describe what they saw.

No evasive action was taken by either aircraft, suggesting the crews did not perceive an immediate collision risk. The report contains minimal technical detail: there is no radar data, no altitude or bearing for the object, and no estimate of how long it was visible.

The FAA&#39;s AJI Safety division assisted Denver (DEN) with a FALCON review — a system used to analyse air traffic data around reported incidents. The review identified numerous conventional aircraft operating in the vicinity of the reporting aircraft at the time. However, no other crews filed UAP (unidentified anomalous phenomena) reports, and no definitive identification of the bright light was established.

The case was closed with a primary code of &quot;OTHER,&quot; meaning the FAA did not assign a specific UAP classification or conventional explanation. The document is a brief administrative record rather than an in-depth investigation file.</div>
