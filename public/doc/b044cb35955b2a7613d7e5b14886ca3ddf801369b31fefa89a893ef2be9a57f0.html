  <h1>Pilot Reports Three Lights in Row at 45,000 Feet Over North Carolina</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b044cb35955b2a7613d7e5b14886ca3ddf801369b31fefa89a893ef2be9a57f0.jpg" alt="Pilot Reports Three Lights in Row at 45,000 Feet Over North Carolina thumbnail" loading="lazy" />
  <p>This FAA incident report documents a pilot sighting of three lights in a row above their aircraft at approximately 45,000 feet, roughly 95 nautical miles southeast of Wilmington, North Carolina, on 14 August 2022. Several other aircraft independently reported the same sighting, but no radar data or sensor evidence is included in the document.</p>
  <div class="narr">This document is an incident report from the FAA&#39;s Washington Operations Center (WOC) recording a pilot&#39;s UFO sighting on 14 August 2022 at 3:22 AM Eastern time. The pilot of aircraft N782HG, flying westbound at flight level 450 (approximately 45,000 feet), reported an unidentified object at the 11 o&#39;clock position — ahead and slightly to the left — above their aircraft.

The pilot described three lights arranged in a row, stating the lights appeared to be in a &quot;geosynchronous orbit.&quot; That phrasing is the pilot&#39;s own description, not a confirmed scientific determination of the object&#39;s altitude or motion.

The sighting gained additional weight because several other aircraft in the area reported seeing the same thing. However, no details about those corroborating reports — such as aircraft identifiers or descriptions — are included in this document.

The report places the sighting at coordinates 34.27°N, 77.90°W, roughly 95 nautical miles southeast of Wilmington, NC. Notably, the document&#39;s own metadata labels this as a 2023 incident, but the text within clearly dates it to August 2022 — a minor administrative discrepancy.

The FAA document does not include any conclusions about what the lights were. There is no radar data, photographic evidence, or sensor corroboration — only the visual accounts from pilots.</div>
