  <h1>FAA Report: Crew Spots Unexplained White Lights Above Their Airliner</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/516ab8f47c9111f363e005bce5c9db4f2860ca3537cdd5fcc6fad1743212a44b.jpg" alt="FAA Report: Crew Spots Unexplained White Lights Above Their Airliner thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents white lights circling above American Airlines flight AAL1468 at approximately 37,000 feet over the Gulf of Mexico on 26 October 2024. The lights were not detected on air traffic control radar, and the case was closed without explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00386. It records an unidentified aerial phenomenon observed by a commercial aircraft crew. The FAA&#39;s primary code for the event is &quot;Unidentified Aerial Phenomenon.&quot;

On 26 October 2024, at 02:05, the crew of American Airlines flight AAL1468 — flying westbound from Miami (MIA) to San Antonio (SAT) at FL360 (36,000 feet) — reported seeing white lights circling above their aircraft at approximately FL370 (37,000 feet). The sighting occurred roughly 170 nautical miles west of RSW (Southwest Florida International Airport), placing it over the Gulf of Mexico.

The FAA report notes that the phenomenon was not observed on the air traffic control facility radar system. No corroborating radar data or instrument confirmation accompanied the crew&#39;s visual report. No tail number for the aircraft was recorded in the report.

The case is marked as closed. No resolution or explanation for the observed lights is provided in the document. The report remains a single-source pilot observation with no further follow-up documented.</div>
