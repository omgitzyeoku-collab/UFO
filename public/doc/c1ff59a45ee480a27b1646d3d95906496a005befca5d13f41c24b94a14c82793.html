  <h1>CIA Sent Secret Cable on Zimbabwe High-Alert Status in 2008</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">July, 2008</span>
    <span class="badge">Harare, Zimbabwe</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c1ff59a45ee480a27b1646d3d95906496a005befca5d13f41c24b94a14c82793.jpg" alt="CIA Sent Secret Cable on Zimbabwe High-Alert Status in 2008 thumbnail" loading="lazy" />
  <p>In July 2008, the CIA distributed a secret intelligence cable about Zimbabwe being placed on high alert due to perceived aggressive foreign posturing. The document was sent to dozens of US military and intelligence agencies, but its entire body text is redacted, leaving the specific details unknown.</p>
  <div class="narr">On 3 July 2008, CIA Washington DC issued a classified intelligence cable titled &quot;Placement on High Alert Due to Perceived Aggressive Foreign Posturing,&quot; concerning events in Zimbabwe in early July 2008. The cable was marked SECRET/NOFORN, meaning it was secret-level and not to be shared with foreign governments.

The distribution list was unusually wide. Recipients included the White House Situation Room, the Defense Intelligence Agency (DIA), the National Security Agency (NSA), the FBI, the Secret Service, the Federal Aviation Administration (FAA), the Department of Homeland Security, and numerous military commands across the United States and Europe — from Fort Bragg, North Carolina to RAF Molesworth in the United Kingdom and Stuttgart, Germany. This breadth suggests the report was considered operationally significant at the time.

The CIA itself flagged this as &quot;not finally evaluated intelligence,&quot; meaning the underlying reporting had not been fully verified or assessed when the cable went out. It was preliminary information, not a confirmed conclusion.

Critically, the entire substantive body of the cable is redacted. Only the header, subject line, classification markings, and distribution list are readable. There is no visible text explaining what the perceived threat was, who was posturing, or what specific alert measures were taken. The document was approved for public release in 2026 under Section 1842.</div>
