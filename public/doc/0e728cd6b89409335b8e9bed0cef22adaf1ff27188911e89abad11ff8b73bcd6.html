  <h1>Commercial Pilot Reports Fast-Moving Orange Object Near Albany, NY</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0e728cd6b89409335b8e9bed0cef22adaf1ff27188911e89abad11ff8b73bcd6.jpg" alt="Commercial Pilot Reports Fast-Moving Orange Object Near Albany, NY thumbnail" loading="lazy" />
  <p>This FAA incident report documents a January 2024 sighting by the crew of a commercial Embraer E145 flight, who observed a bright orange object that repeatedly jumped between their cruising altitude (26,000 feet) and roughly 50,000 feet near Albany, New York. The case was closed with no explanation provided.</p>
  <div class="narr">On 2 January 2024 at 01:43 UTC, the crew of commercial flight PDT5795 — an Embraer E145 travelling southwest at 26,000 feet — reported an unidentified aerial phenomenon roughly 25 nautical miles south-southwest of Albany, New York. The object was described as bright orange, moving quickly at near-level altitude before jumping to approximately 50,000 feet (FL500), then repeating the pattern.

The pilot continued to observe and report the same manoeuvres over a significant distance, all the way toward the DNY intersection. According to the report, some radar data was captured during the event until 01:55 UTC, though that radar data is not included in the document itself.

The FAA logged this under its SKYWATCH programme, which tracks unidentified aerial phenomena reported by pilots. The case was assigned the identifier 237UAP00336 and the mandatory occurrence report ID ZBW-M-2024/01/01-0002.

The case is marked as closed. No resolution, explanation, or follow-up findings are provided in the document. There is no indication of what the object was or whether any further investigation took place.</div>
