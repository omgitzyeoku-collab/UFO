  <h1>Commercial Flight Crew Reported Stationary Object Near Seattle in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2d0a77a97364902f27f4e0ae6263788ac4aea6460bfaa48bdb89914c7fe66342.jpg" alt="Commercial Flight Crew Reported Stationary Object Near Seattle in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a UAP sighting by a Jazz Aviation flight crew on 15 July 2023 near Seattle. The crew first observed a stationary object at roughly 20,000–22,000 feet, then reported it moving northbound. No evasive action was taken and no physical description of the object is included.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed on 15 July 2023 at 12:30 PM Pacific time. It records a sighting of an unidentified anomalous phenomenon — the official term for what used to be called a UFO — reported by the crew of a commercial aircraft near Seattle, Washington.

The reporting aircraft was Jazz Aviation flight 653, a Canada-registered De Havilland DH8D turboprop flying from Portland, Oregon to Vancouver, Canada. The crew told Seattle TRACON (Terminal Radar Approach Control, the regional air traffic facility) that they had observed a stationary object at flight level 200–220, which translates to roughly 20,000–22,000 feet above sea level, about 10 nautical miles north-northwest of Seattle.

The crew later reported that the same object was now moving northbound, approximately 13 nautical miles east-northeast of Seattle. No evasive action was taken by the aircraft, and no law enforcement notification is recorded in the report.

The document is marked as preliminary information and contains no description of the object&#39;s shape, size, colour, or other physical characteristics. There is no mention of radar data, photographs, or corroborating observations from other aircraft or ground witnesses. The report is referenced internally as WOC 7-3333 DJ/MO.

No conclusion or identification of the object appears in the report. It is a factual log of what the flight crew told air traffic control, nothing more.</div>
