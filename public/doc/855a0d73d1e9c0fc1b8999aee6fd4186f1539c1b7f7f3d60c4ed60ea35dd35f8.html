  <h1>CIA Memo Shows Air Force UFO Project Running on Skeleton Staff in 1953</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">December, 1953</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/855a0d73d1e9c0fc1b8999aee6fd4186f1539c1b7f7f3d60c4ed60ea35dd35f8.jpg" alt="CIA Memo Shows Air Force UFO Project Running on Skeleton Staff in 1953 thumbnail" loading="lazy" />
  <p>A December 1953 internal CIA memo reports that the US Air Force&#39;s UFO investigation programme, Project Bluebook, was staffed by just three people and that roughly ten percent of sightings remained unexplained. The project was being transferred from its home base to Air Defense Command because that unit was already doing most of the fieldwork.</p>
  <div class="narr">On 17 December 1953, the CIA&#39;s Physics and Electronics Division sent an internal memorandum to the Assistant Director of Scientific Intelligence summarising the state of the US Air Force&#39;s UFO investigation effort. The division had taken over responsibility for the CIA&#39;s own monitoring of the subject the previous May.

The memo describes a programme running on minimal resources. Project Bluebook (officially No. 10073) was operated out of the Air Technical Intelligence Center (ATIC) by just one officer — Captain Charles A. Hardin — one airman, and a secretary, working within the Aerial Phenomena Section of the Electronics Branch. ATIC staff no longer went into the field themselves; instead, investigations were delegated to Air Force intelligence officers closer to sighting locations, primarily from Air Defense Command and the Airways and Air Communications Service.

The document notes that roughly ten percent of UFO reports over the preceding year were tagged as unsolved. Despite this, the Air Force&#39;s interest in the subject was described as &quot;apparently decreasing.&quot; At the time of writing, the project was being transferred from ATIC to Air Defense Command headquarters — according to Lt. Col. Harry Johnston, because ADC had already been doing most of the investigative legwork.

The CIA&#39;s own role, as described here, was limited to monitoring other agencies and maintaining files rather than conducting independent research. The Aerial Phenomena Section also worked directly with the Air Force&#39;s Public Information Office on preparing UFO-related material for public release.

The extracted text of this document cuts off mid-sentence, meaning additional content from later pages is missing. Moderate redaction is also evident throughout.</div>
