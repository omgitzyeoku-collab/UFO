  <h1>Commercial Crew Reports Bright Lights Over Nebraska at 35,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/86973ff2f282f92acb7c10570319a6747533bf815dead4d7635037c19555135a.jpg" alt="Commercial Crew Reports Bright Lights Over Nebraska at 35,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH report documents a March 2024 sighting by the crew of a commercial cargo flight (callsign BOX473) who observed 2–3 bright white lights moving erratically near Scottsbluff, Nebraska, at 35,000 feet. The lights did not appear on air traffic control radar, and the FAA closed the case without explanation.</p>
  <div class="narr">On 3 March 2024, the crew of a commercial flight operating under callsign BOX473 reported an unidentified aerial phenomenon to Denver Center (ZDV), the FAA&#39;s air traffic control facility covering that airspace. The aircraft was flying northeast at 35,000 feet on a route from Los Angeles (LAX) to Frankfurt, Germany (EDDF), and was approximately 49 nautical miles west of Scottsbluff, Nebraska, when the sighting occurred.

The crew described 2–3 bright white lights, possibly more, positioned at their 12 to 1 o&#39;clock — meaning roughly straight ahead and slightly to the right. The lights moved in multiple directions: up, down, left, and right. This erratic movement is what distinguished the objects from conventional aircraft or known phenomena in the crew&#39;s account.

Air traffic control checked their radar and found nothing. The report states plainly: the unidentified phenomenon was not observed on the ATC facility radar system. The incident was logged under MOR ID ZDV-M-2024/03/03-0001.

The FAA marked the case as closed. No resolution, identification, or follow-up explanation is provided in the document. The report contains no corroborating evidence beyond the crew&#39;s visual observation.</div>
