  <h1>Commercial Pilot Reported Balloon-Like Object at 37,000 Feet in 2023</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/24b346855cbfc9788c81d8a695561402af3b74905375a84140232b45fc97569d.jpg" alt="Commercial Pilot Reported Balloon-Like Object at 37,000 Feet in 2023 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a commercial pilot sighting of a large balloon-like object at high altitude near Billings, Montana in early February 2023. The case was closed with no identification or resolution noted in the document.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00147. It records a pilot-reported unidentified aerial phenomenon (UAP) observed during a commercial flight in early February 2023 — a period when US attention to high-altitude balloons was heightened following the Chinese surveillance balloon incidents.

The reporting aircraft, flying under callsign QXE2084 (a Horizon Air commercial flight), was travelling westbound at Flight Level 340 — approximately 34,000 feet — when the crew spotted an object roughly 73 nautical miles from Billings, Montana. They described it as appearing to be a large balloon at an altitude between approximately 37,000 and 39,000 feet, several thousand feet above their own position.

The report notes that an entity or office abbreviated as &quot;JH&quot; was notified of the incident, though the document does not define what JH stands for. The case is marked as closed. No resolution, formal identification, or follow-up findings appear in this document.

It is worth noting that the crew&#39;s description of the object as a balloon is their impression, not a confirmed identification. The document contains no mention of corroborating radar data, sensor readings, or independent observations from other aircraft or ground stations.</div>
