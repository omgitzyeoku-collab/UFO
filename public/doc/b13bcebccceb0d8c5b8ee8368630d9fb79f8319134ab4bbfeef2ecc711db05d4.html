  <h1>CIA Memo Shows Agency Gave Evasive Answers to Civilian UFO Inquirer</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1958</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b13bcebccceb0d8c5b8ee8368630d9fb79f8319134ab4bbfeef2ecc711db05d4.jpg" alt="CIA Memo Shows Agency Gave Evasive Answers to Civilian UFO Inquirer thumbnail" loading="lazy" />
  <p>A January 1958 internal CIA memorandum documents a closed case involving Dr. Leon Davidson, a civilian who had been inquiring about a &#39;space message and its transmitter.&#39; The memo reveals the CIA acknowledged giving Davidson deliberately evasive and unfair answers, and that Davidson did not know he was dealing with the CIA.</p>
  <div class="narr">This document is an internal CIA memorandum dated 9 January 1958, addressed to the Chief of the Contact Division. It concerns a closed case — Case 17708 — and a telephone conversation held on 8 January 1958 with a civilian named Dr. Leon Davidson.

Davidson had been making inquiries about what the document describes as a &#39;space message and its transmitter,&#39; though the exact nature of this object is never explained in the surviving text. He had submitted material to Pentagon security review personnel, believing his submission was mild enough to pass their review. He also hinted he might revisit the matter at a later date.

What makes the memo notable is that the CIA internally acknowledged that the evasive answer they were instructed to give Davidson was unfair and unlikely to be accepted by him. The document also states there was nothing in the record to show Davidson knew he was dealing with the CIA — his contacts were through individuals named Walker and Skakich.

The document is heavily redacted, with multiple blacked-out sections, and the original text is badly degraded, making many passages only partially legible. What survives paints a picture of an agency knowingly stonewalling a civilian&#39;s questions while concealing its own involvement.</div>
