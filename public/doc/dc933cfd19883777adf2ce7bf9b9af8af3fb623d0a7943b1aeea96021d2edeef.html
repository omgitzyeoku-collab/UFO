  <h1>Multiple Pilots Reported Unidentified Lights Near RZC VOR in 2024</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/dc933cfd19883777adf2ce7bf9b9af8af3fb623d0a7943b1aeea96021d2edeef.jpg" alt="Multiple Pilots Reported Unidentified Lights Near RZC VOR in 2024 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents multiple commercial pilots observing between one and five white lights of varying brightness near the RZC VOR navigation point on 17 February 2024. The report itself notes that Starlink satellites have characteristics matching what was observed, and the case was closed with no further investigation.</p>
  <div class="narr">On 17 February 2024, between 09:50 and 10:08 UTC, multiple pilots flying eastbound at high altitude reported seeing unidentified lights in the distance near the RZC VOR radio navigation point. The initial report was filed under callsign UAL2484, a United Airlines Boeing 737 flying from Phoenix (PHX) to Newark (EWR). The FAA logged it as a SKYWATCH Incident Report under the primary code &quot;Unidentified Aerial Phenomenon.&quot;

The pilots described one to five white lights of different brightness levels that moved both vertically and horizontally, appearing and disappearing rapidly. All the aircraft that reported the lights were travelling eastbound on headings between 070 and 090 degrees at altitudes between flight level 350 and 370 (roughly 35,000 to 37,000 feet).

Notably, the report itself flags a prosaic explanation: it states that &quot;Starlink does have these characteristics,&quot; referring to the satellite constellation known to produce visible light trails at certain angles and times. No radar, infrared, or other sensor data is referenced in the report — the observations were entirely visual.

The case status is listed as &quot;Closed.&quot; No resolution details, follow-up investigation notes, or formal conclusions are provided beyond the Starlink observation. The tail number field for the reporting aircraft is blank, which limits traceability.</div>
