  <h1>Civilian Pilot Reports White UAP Over West Texas at 14,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/badff8c4bc8bb72bd43b1c81c2bf234e5532a39bd6a229fe62f11eae164b1abe.jpg" alt="Civilian Pilot Reports White UAP Over West Texas at 14,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident notification records a civilian pilot&#39;s sighting of a white unidentified aerial phenomenon near Fort Stockton, Texas, on 22 April 2023. The pilot took no evasive action, and the report was relayed through air traffic control to FAA Operations as a preliminary notification — no investigation or conclusion is included.</p>
  <div class="narr">On 22 April 2023 at approximately 6:20 PM Central time, the pilot of a Cirrus SR22 light aircraft (registration N781CW) reported seeing a white unidentified aerial phenomenon while flying westbound at 14,000 feet. The sighting occurred roughly 24 nautical miles northwest of Fort Stockton, Texas — remote desert terrain in the western part of the state.

The pilot did not take evasive action, suggesting the object was not perceived as an immediate collision threat. Albuquerque Air Route Traffic Control Center (ARTCC), which manages high-altitude airspace in that region, relayed the report to FAA Operations in Washington. Law enforcement was not notified.

The document itself is a Washington Operations Center incident notification — essentially a short-form intake record. It is not an investigation report. It contains no analysis, no radar data, no photographs, and no conclusion about what the pilot saw. The UAP is described only as &quot;white&quot;; no size, speed, shape, altitude, or behaviour of the object is recorded.

This is a single-source pilot report with no mentioned corroboration from other aircraft, ground observers, or radar returns. The FAA filed it as a preliminary notification, and there is no indication in the document that any follow-up investigation was conducted.</div>
