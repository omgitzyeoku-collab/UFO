  <h1>Civilian Jet Crew Reported Kite-Like UFO Near Houston Airport in 2009</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/43756556d62eaf1bebd0b64e08d328c4c79772ec71bca2818f6b2c1ef33f9e9f.jpg" alt="Civilian Jet Crew Reported Kite-Like UFO Near Houston Airport in 2009 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a 2009 sighting by the crew of a Canadair Challenger 604 business jet, who reported encountering an object resembling a very large kite at 25,000 feet near Houston Intercontinental Airport. The case was closed with no further investigation documented.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed on 23 April 2009 at 00:45. It records that the crew of a Canadair Challenger 604 business jet, flying under the registration N97DK, reported encountering an unidentified flying object while airborne near Houston, Texas.

According to the report, the aircraft was approximately five miles north of George Bush Intercontinental Airport (IAH) at Flight Level 250 — roughly 25,000 feet — when the crew observed the object. They described it as resembling a very large kite. The sighting was logged by Houston Air Route Traffic Control Centre (ARTCC), identified by its FAA code ZHU.

The report is extremely brief. Beyond the single-sentence description of the object, the document states only: &quot;No further details.&quot; There is no record of corroborating radar data, additional witness accounts, or any follow-up investigation. The FAA classified the incident under its general category &quot;OTHER&quot; rather than a dedicated UAP code. The case status is marked as closed.

Several fields in the report — including the aircraft&#39;s origin, destination, and operator — are blank, which limits context about the flight. Notably, the incident dates to 2009, well before the current US government UAP disclosure effort, suggesting this is a historical record surfaced during the broader review process.

The document was released as part of the Department of War&#39;s PURSUE public collection. It is a single-page administrative record, not an analytical assessment or investigation finding.</div>
