  <h1>Delta 384 crew reported circling lights over Iowa at 37,000 feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/0a24d6c703f272588542504bb0723f47bd9bbd989ad83228d7ae8fccd7123d04.jpg" alt="Delta 384 crew reported circling lights over Iowa at 37,000 feet thumbnail" loading="lazy" />
  <p>An FAA incident report documents the crew of Delta flight 384 observing lights circling off the left side of their Boeing 737-800 at 37,000 feet near Iowa City on 11 February 2023. The FAA noted that similar reports the previous week had been attributed to a chain of satellites.</p>
  <div class="narr">On 11 February 2023 at 03:07 CST, the crew of Delta flight 384 — a Boeing 737-800 flying from San Diego to New York JFK — reported unusual lights while cruising eastbound at 37,000 feet near Iowa City, Iowa. The lights were described as circling off the left side of the aircraft at the same altitude or higher. Chicago Air Route Traffic Control Center relayed the report to the FAA Washington Operations Center.

The FAA&#39;s report includes a notable detail: similar phenomena had been reported the previous week and were determined to be a chain of satellites — almost certainly a Starlink train, though the document does not name the satellite constellation. Law enforcement was not notified about the incident.

The document is a preliminary information report from the FAA&#39;s Washington Operations Center. It records what the crew saw and how it was routed through air traffic control, but it contains no formal investigation, no final determination about what the lights were, and no mention of corroborating radar or sensor data. The record is not heavily redacted — the information is simply limited in scope, as is typical for this type of operational log.

The coordinates in the report place the sighting at approximately 41.66°N, 91.53°W, consistent with the Iowa City area. No people are named in the document beyond the flight and facility identifiers.</div>
