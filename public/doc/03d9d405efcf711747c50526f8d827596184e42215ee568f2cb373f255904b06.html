  <h1>Commercial Jet Crew Reports Two Bright Lights Trailing Aircraft at 45,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/03d9d405efcf711747c50526f8d827596184e42215ee568f2cb373f255904b06.jpg" alt="Commercial Jet Crew Reports Two Bright Lights Trailing Aircraft at 45,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH report documents a November 2022 incident in which the crew of a commercial aircraft (callsign EJA817) reported two bright lights following their plane from behind while flying at 45,000 feet near Goodland, Kansas. The case was closed with no resolution or explanation provided in the document.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP) from pilots and air traffic controllers.

On 26 November 2022 at 03:18, the crew of a commercial aircraft flying under callsign EJA817 reported an unidentified aerial phenomenon off the rear of their plane. The aircraft was travelling northwest at FL450 (flight level 450, roughly 45,000 feet) on a route from Dulles International Airport (IAD) near Washington, D.C., to Provo Municipal Airport (PVU) in Utah. At the time of the sighting, the aircraft was approximately 16 nautical miles northwest of Goodland, Kansas.

The crew described the phenomenon as two bright lights following the aircraft. A person or entity identified only as &quot;JH&quot; was notified of the incident, though the document does not explain who JH is or what role they played.

The case is marked as closed. No resolution, explanation, or follow-up findings are provided in this document. There is no corroborating radar data or additional witness testimony included. The aircraft&#39;s tail number field is blank, which limits the ability to independently verify which specific aircraft was involved.

It is worth noting that the metadata supplied with this release lists the incident year as 2023, but the document itself clearly states the date as 26 November 2022.</div>
