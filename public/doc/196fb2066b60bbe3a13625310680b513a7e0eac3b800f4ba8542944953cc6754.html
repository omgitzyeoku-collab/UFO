  <h1>American Airlines Crew Reported Bright Lights Near Tulsa in 2022</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/196fb2066b60bbe3a13625310680b513a7e0eac3b800f4ba8542944953cc6754.jpg" alt="American Airlines Crew Reported Bright Lights Near Tulsa in 2022 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a sighting by the crew of American Airlines flight AAL500 on September 20, 2022. While flying a Boeing 737-800 from Denver to Miami at 35,000 feet, the crew observed flare-like bright lights traveling eastbound at high altitude, approximately 45 nautical miles east of Tulsa. The case was closed with no explanation recorded.</p>
  <div class="narr">This document is an FAA SKYWATCH Incident Report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP) from pilots and air traffic controllers. It was filed under the primary code &quot;Unidentified Aerial Phenomenon&quot; and assigned case ID 237UAP00113.

On September 20, 2022, at 08:55, the crew of American Airlines flight AAL500 — a commercial Boeing 737-800 flying from Denver (DEN) to Miami (MIA) — reported something unusual. While heading southeast at 35,000 feet, approximately 45 nautical miles east of Tulsa, Oklahoma, the crew observed an unidentified aerial phenomenon off the left side of the aircraft. They described it as flare-like or bright lights traveling eastbound at high altitude.

The report notes that AWO/TY were notified, though the document does not explain what those designations refer to. No radar data, sensor readings, or corroborating observations from other aircraft or ground stations are mentioned in the report.

The case is marked as closed. No resolution, identification, or explanation for the observed phenomenon is provided anywhere in the document. The FAA recorded the sighting but, based on what is available here, did not reach a conclusion about what the crew saw.</div>
