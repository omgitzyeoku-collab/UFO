  <h1>NASA Scientists Traced Astronaut Glenn&#39;s Glowing Particles to Spacecraft Condensation</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">1962-1963</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/35e904ddb6652ca72281ff13cf00f71d9563aab3672e399273335215bebb5184.jpg" alt="NASA Scientists Traced Astronaut Glenn&#39;s Glowing Particles to Spacecraft Condensation thumbnail" loading="lazy" />
  <p>This collection of NASA internal memoranda and scientific debriefings from 1962–1963 documents the investigation into luminous particles observed by astronauts John Glenn and Scott Carpenter during Mercury orbital flights. Scientists concluded the particles were not extraterrestrial but were most likely snowflakes formed from the spacecraft&#39;s life-support system steam exhaust.</p>
  <div class="narr">During the first American orbital spaceflight in early 1962, astronaut John Glenn reported seeing mysterious glowing particles drifting past his Mercury capsule window. The particles appeared yellow-green, became fluorescent in sunlight, and some were estimated to be extraordinarily bright — between 10 and 100 times brighter than the moon. They moved at a consistent speed and direction across all three of Glenn&#39;s orbits, which immediately suggested to investigators that they were tied to the spacecraft rather than coming from the surrounding environment.

Astronaut Scott Carpenter, flying the next Mercury mission (MA-7) on 24 May 1962, performed what NASA scientists called the &quot;decisive experiment.&quot; He struck the capsule walls with his hand, and the blows promptly produced large numbers of the same particles. Carpenter described them as between 1 mm and 1 cm in size, with a strong visual resemblance to snowflakes. NASA inspector Frank Crichton ran tests ruling out dye marker and shark repellent packs as the source, since neither material escaped its packaging in a vacuum.

The leading conclusion, documented across multiple internal memoranda, was that the particles were snowflakes. They formed between the cabin bulkhead and the heat shield from steam vented by the capsule&#39;s life-support system. Capsule exterior temperatures dropped to −35°C before sunrise and rose to +10°C after, creating conditions suitable for ice crystal formation.

The same document collection also covers a haze layer Glenn reported at the horizon. A Los Alamos scientist named Bob E. Watt proposed that nitrogen peroxide (NO₂) could account for the absorbing layer, noting that Glenn&#39;s colour description matched NO₂ vapour. Separately, Carpenter used a narrow-band filter during his flight to identify a luminous band as the 5577 Ångström airglow layer, with its densest point measured at 89 kilometres altitude — consistent with existing rocket data. Glenn&#39;s lightning observations from orbit were also noted as pointing toward potential satellite-based storm monitoring.

These are internal NASA working documents — rough drafts, memoranda, and correspondence — not final peer-reviewed publications. The source PDF suffers from heavy OCR degradation, leaving some passages partially illegible.</div>
