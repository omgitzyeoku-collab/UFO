  <h1>Multiple Pilots Reported Orange Flashing Lights Over California Desert</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/97aca79318ca2537209ea0ee1d6d9c8de987384c7d7bc163308648fcf503b6c6.jpg" alt="Multiple Pilots Reported Orange Flashing Lights Over California Desert thumbnail" loading="lazy" />
  <p>An FAA operations centre log from January 2024 records that several aircraft flying over the Mojave Desert reported an unidentified aerial phenomenon with orange flashing lights ahead of them at high altitude. No aircraft took evasive action and no law enforcement was notified.</p>
  <div class="narr">This document is a preliminary incident notification from the FAA Washington Operations Center. It logs a report relayed by Los Angeles Air Route Traffic Control Center (ARTCC) — the facility that manages high-altitude air traffic across the region.

On 26 January 2024, multiple eastbound aircraft flying between approximately 26,000 and 32,000 feet reported an unidentified aerial phenomenon directly ahead of them (the 12 o&#39;clock position), roughly 25 nautical miles southwest of Goffs, California — a sparsely populated area in the Mojave Desert. The pilots described orange flashing lights.

None of the aircraft took evasive action, which suggests the object was not perceived as an immediate collision risk. The log also notes that no law enforcement notification was provided.

The document is labelled preliminary information and does not include any follow-up investigation, sensor data, or conclusion about what the pilots saw. It is a single operational log entry — essentially a timestamped note that the sighting was reported through official channels. The report was logged at 9:38 PM Pacific time on 25 January 2024, the evening before the incident date recorded in the header.

There are no named witnesses, no aircraft identifiers, and no detail on how many aircraft were involved beyond the word &quot;multiple.&quot; A formatting error in the original document mislabels the longitude field as a second latitude entry.</div>
