  <h1>Twelve Aircraft Reported Unidentified Object Over Colorado in 2007</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/da6f785791e1870a973f5a6a4b7288e5bebc6a8158ef75befd5503f50bf46e36.jpg" alt="Twelve Aircraft Reported Unidentified Object Over Colorado in 2007 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a February 2007 event in which at least 12 aircraft visually observed an unidentified object between 34,000 and 40,000 feet near Hayden, Colorado. The object produced no radar return and appeared to be tracking the aircraft. The case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under record number 237UAP00001. It describes an event on 20 February 2007 at 08:30, in which at least 12 aircraft reported seeing an unidentified flying object in the Hayden, Colorado area. The object was observed at flight levels between FL340 and FL400 — roughly 34,000 to 40,000 feet.

Despite being visually observed by multiple flight crews, the object produced no radar return. The report also states that the object appeared to be tracking the aircraft, though no methodology or data supporting that assessment is included.

The FAA classified the incident under the primary code &quot;OTHER&quot; and marked the case as closed. No follow-up analysis, witness statements, radar data, or conclusions are included in the document. There is no indication of what, if anything, was determined about the object&#39;s identity or origin.

The report itself is very brief — a single-paragraph summary. It was originally created in 2007 but was released as part of a 2023 FAA UAP records series, so no context about how the case was handled at the time is available.</div>
