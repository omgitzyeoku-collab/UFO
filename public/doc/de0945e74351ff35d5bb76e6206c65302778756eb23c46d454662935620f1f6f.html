  <h1>SkyWest Crew Reported Jetpack at 11,000 Feet Near Los Angeles</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/de0945e74351ff35d5bb76e6206c65302778756eb23c46d454662935620f1f6f.jpg" alt="SkyWest Crew Reported Jetpack at 11,000 Feet Near Los Angeles thumbnail" loading="lazy" />
  <p>This FAA incident report documents the crew of SkyWest flight SKW5329 observing what appeared to be a manned jetpack at 11,000 feet, about 17 nautical miles northwest of Los Angeles International Airport, on 25 September 2021. The FAA classified the object as an Unidentified Aerial Phenomenon and closed the case.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00069. It records an observation made by the crew of SkyWest Airlines flight SKW5329, an Embraer E175 regional jet flying from Arcata, California to Los Angeles on 25 September 2021.

At 15:34 local time, while descending southeast-bound at 11,000 feet approximately 17 nautical miles northwest of LAX, the crew reported seeing what appeared to be a manned jetpack off their left side. The object was travelling northbound and below the aircraft. No evasive action was taken. The report was filed through Southern California TRACON (SCT), the radar facility managing approach traffic in the Los Angeles area.

The FAA classified the sighting under its primary code as an Unidentified Aerial Phenomenon. The case is marked as closed. The report contains no radar data, photographs, or corroborating observations from other sources — it relies entirely on the crew&#39;s visual account.

This sighting is one of several reported jetpack observations near LAX during 2020 and 2021, a cluster of incidents that was never publicly resolved. Notably, 11,000 feet is well above the operational ceiling of any known commercially available jetpack, which raises questions about what the crew actually saw. The FAA&#39;s classification as an Unidentified Aerial Phenomenon reflects this uncertainty — the crew&#39;s description of a jetpack is their impression, not a confirmed identification.</div>
