  <h1>Pilot Reports White Cylindrical Object at 19,000 Feet Near JFK</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d7b7a9b24cb6d9e0cd14b5bdf94e4febe51741f2875a3322dfb0fcef697b7182.jpg" alt="Pilot Reports White Cylindrical Object at 19,000 Feet Near JFK thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents a pilot&#39;s sighting of a white, cylindrical unidentified aerial phenomenon on May 29, 2023, while flying at 19,000 feet approximately 10 nautical miles south of JFK airport. The object, estimated to be about the size of three bowling balls, passed the right side of the aircraft; no evasive action was taken and no follow-up investigation is indicated.</p>
  <div class="narr">On May 29, 2023, at 6:10 PM Eastern time, the pilot of a Cessna C25A operated by LGM Enterprises (flight 785) reported an unidentified aerial phenomenon to air traffic control. The aircraft was flying westbound at flight level 190 — roughly 19,000 feet — on a route from Savannah to Poughkeepsie, and was approximately 10 nautical miles south of John F. Kennedy International Airport at the time.

The pilot described the object as white, cylindrical, and roughly the size of three bowling balls. It passed on the right side of the aircraft. The pilot did not take evasive action. New York ARTCC (Air Route Traffic Control Center) was the facility that received the report.

No law enforcement agency was notified of the incident. The document is labelled as a preliminary information report from the FAA&#39;s Washington Operations Center — it is not a completed investigation, and there is no indication of any follow-up or final determination about what the object was.

The report contains minimal redaction. The coordinates recorded place the sighting at approximately 40.53°N, 73.66°W, consistent with the area south of JFK. Beyond the pilot&#39;s own account, the document does not reference any corroborating radar data or additional witnesses.</div>
