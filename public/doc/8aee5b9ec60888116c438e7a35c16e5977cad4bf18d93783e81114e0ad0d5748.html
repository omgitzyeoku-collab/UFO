  <h1>Two Cargo Flights Report Rocket-Like Flash Over Alaska&#39;s Aleutian Islands</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/8aee5b9ec60888116c438e7a35c16e5977cad4bf18d93783e81114e0ad0d5748.jpg" alt="Two Cargo Flights Report Rocket-Like Flash Over Alaska&#39;s Aleutian Islands thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents two commercial cargo flights (Atlas Air callsigns GTI8050 and GTI617) that independently observed an unidentified aerial phenomenon resembling a rocket with a flash while flying at 35,000 feet near Shemya, Alaska. NORAD was notified, but the case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form used by the Federal Aviation Administration to log reports of unidentified aerial phenomena observed by pilots or air traffic controllers. It is classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot;

The incident involved two commercial cargo flights, GTI8050 and GTI617, both operating at flight level 350 (approximately 35,000 feet) on a route from Hong Kong to Anchorage. The crews reported observing an object that appeared to be a rocket with a flash, travelling northwest at an altitude above their aircraft. The fact that two independent flight crews corroborated the same sighting is notable, as it reduces the likelihood of a single observer&#39;s misperception.

Following the report, the FAA&#39;s headquarters in Denver contacted the NORAD FAA Air Traffic Security Coordination Service (ATSCS) — the channel through which the military is alerted to potential airspace threats. An individual identified only by the initials &quot;JH&quot; was also notified.

The case is marked &quot;Closed,&quot; but the document provides no resolution, identification of the object, or follow-up explanation. There is no indication of what, if anything, NORAD determined about the phenomenon.

The sighting occurred near Shemya in the Aleutian Islands, a location that hosts Eareckson Air Station, a site with known military radar and missile-warning infrastructure. The document itself does not draw any connection between the installation and the sighting, but readers should be aware of that geographic context.</div>
