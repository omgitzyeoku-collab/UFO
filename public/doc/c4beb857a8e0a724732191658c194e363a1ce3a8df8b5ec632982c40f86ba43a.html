  <h1>FBI Used Forensic Sketch Artist to Draw a UAP Sighting</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">2022</span>
    <span class="badge">Colorado Springs, Colorado, U.S.</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/c4beb857a8e0a724732191658c194e363a1ce3a8df8b5ec632982c40f86ba43a.jpg" alt="FBI Used Forensic Sketch Artist to Draw a UAP Sighting thumbnail" loading="lazy" />
  <p>This FBI document is a forensic sketch interview form (FD-1057) recording an interview conducted to produce a visual reconstruction of an unidentified aerial phenomenon (UAP) reported near Colorado Springs, Colorado. Nearly all substantive details — the witness&#39;s identity, the description of the object, and key dates — are redacted, leaving only the procedural framework visible.</p>
  <div class="narr">This document is an FBI form known as an FD-1057 — the same type of forensic sketch interview form the Bureau uses when a witness sits down with a sketch artist to reconstruct what they saw. In this case, the subject was not a criminal suspect but an unidentified aerial phenomenon, or UAP.

The interview was conducted by a forensic artist from the FBI&#39;s Operational Projects Unit (OPU). A witness provided information to help produce a visual recreation of the UAP. A sketch draft was produced and enclosed with the document, though the sketch itself is not available in the extracted text — only the interview form survives.

The incident is catalogued as occurring near Colorado Springs, Colorado, in 2022, but the document header carries a date of July 2020. The interview itself is noted as taking place on 7/24, with the year redacted. The relationship between these dates is unclear.

The level of redaction is extreme. Nearly all identifying details — the witness&#39;s name, the interviewing agents, specific locations, and crucially, the actual description of what the witness saw — have been blacked out. No substantive account of the UAP survives. The document confirms that the FBI took the report seriously enough to deploy a forensic sketch process, but reveals almost nothing about the sighting itself.

The FBI reached no stated conclusion in the visible portions of this document. The report remains categorised as unresolved.</div>
