  <h1>Military Jets Scrambled After Unidentified Radar Target Near Washington D.C.</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ee2a8c0344276a6d69d3cfa2a8c4f77706b60649c76863c9a74e96a206264499.jpg" alt="Military Jets Scrambled After Unidentified Radar Target Near Washington D.C. thumbnail" loading="lazy" />
  <p>This FAA incident report documents an unidentified radar target detected near Washington, D.C. restricted airspace on 24 February 2023. Military jets were scrambled from Joint Base Andrews and battle stations were declared, but the object left the area before anyone could visually identify it.</p>
  <div class="narr">On 24 February 2023 at 4:10 p.m., the National Capital Region Coordination Center (NCRCC) logged a radar contact heading east at 100 knots near the restricted airspace surrounding Washington, D.C. The object was tracked at 16,000 feet by WADS (Western Air Defense Sector) radar. No transponder signal or radio communication was established — three separate air traffic facilities (Potomac TRACON, Manassas Regional Airport, and Dulles Approach) all tried and failed to make contact.

The military response was immediate. Interceptor jets using the callsign BLACKJACK were scrambled from Joint Base Andrews, and battle stations were declared at the base. However, because the target was heading outbound — away from the most restricted zone around the capital — the jets were held inside the Flight Restricted Zone rather than sent to pursue.

By 4:40 p.m., roughly thirty minutes after the initial detection, the target had exited the Special Flight Rules Area entirely. All tactical actions were cancelled, and the BLACKJACK jets returned to base. WADS radar continued tracking the object, but no visual confirmation was ever achieved by any asset. The incident was closed.

The document is categorised under the FAA&#39;s SKYWATCH system and is tagged with the secondary code &quot;Unidentified Aerial Phenomenon.&quot; It is a single operational log entry — a record of what controllers and military personnel did in real time — not an investigation or analysis of what the object was. The report does not offer any conclusion about the nature of the target.</div>
