  <h1>Pentagon Office Concludes GoFast UFO Video Shows No Extraordinary Flight</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f4fb5b5bcff6bf90866689de750043de15790c1b73c882d71b7cbb8ac31e1935.jpg" alt="Pentagon Office Concludes GoFast UFO Video Shows No Extraordinary Flight thumbnail" loading="lazy" />
  <p>The All-domain Anomaly Resolution Office (AARO) analyzed the well-known &#39;Go Fast&#39; Navy infrared video from January 2015 and concluded with high confidence that the object did not demonstrate anomalous speed or performance. The object&#39;s apparent velocity was an optical illusion caused by the fast-moving jet, and the object was likely a small drone or bird-sized object drifting roughly with the wind at 13,000 feet.</p>
  <div class="narr">In January 2015, a U.S. Navy F/A-18F pilot flying off the eastern coast of Florida recorded a small object using the jet&#39;s infrared camera. The footage — known as the &#39;Go Fast&#39; video — became one of three famous UAP (unidentified anomalous phenomena) clips released by the Department of Defense in 2020. The video appeared to show an object racing at high speed just above the ocean surface, and it fueled widespread public interest in UFOs.

On February 6, 2025, AARO published its case resolution for the video. Using standard geospatial intelligence methods from the National Geospatial-Intelligence Agency, analysts reconstructed the geometry of the encounter. They determined the object was not skimming the ocean at all — it was at roughly 13,000 feet altitude, about halfway between the jet (at 25,000 feet) and the sea. The impression of extreme speed was caused by motion parallax: the jet itself was traveling at roughly 190 meters per second (about 425 mph), and the camera&#39;s movement across the background made the slower object appear to streak by.

AARO calculated the object&#39;s raw speed at between 72 and 161 mph, but after accounting for strong westerly winds of 69 mph at that altitude, the object&#39;s own intrinsic speed dropped to somewhere between 5 and 92 mph. In every simulation, the object moved in roughly the same direction as the wind and never flew against it — its heading deviated at most 32 degrees from the wind direction. Pixel analysis suggested it was about one meter across or smaller, comparable in size to a small drone or bird.

The agency assessed with high confidence that the object showed no anomalous performance characteristics. However, AARO did not positively identify what the object was — only that its behavior fell within ordinary physical parameters. The agency was also unable to interview the aircrew who recorded the video, and witness accounts were never obtained.

Several limitations shaped the analysis. The original sensor recording and its metadata are no longer available; analysts worked from a compressed video file, which reduced the precision of their measurements. The jet&#39;s exact position and compass heading during the recording are unknown, so AARO could only calculate a range of possible speeds and trajectories rather than a single answer. Historical weather data stood in for actual atmospheric conditions at the time. AARO itself cautioned that its quantitative results should be used only to qualitatively evaluate the object&#39;s properties, not taken as literal measurements.</div>
