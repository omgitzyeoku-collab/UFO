  <h1>Gulfstream Crew Reports Multiple Unidentified Lights at 45,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/1aa9c262aeba7dbb88fe1abb66feeae3ac3b0e72549368dac877b53cdc4911c2.jpg" alt="Gulfstream Crew Reports Multiple Unidentified Lights at 45,000 Feet thumbnail" loading="lazy" />
  <p>An FAA incident report documents a commercial Gulfstream V crew observing 4–5 bright, blinking lights above their aircraft and one below while flying at 45,000 feet on 5 October 2023. The case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log pilot sightings of unidentified aerial phenomena (UAP). It was filed under case number 237UAP00304, with an internal identifier of ZBW-M-2023/10/05-0001.

On 5 October 2023 at 07:20 UTC, the crew of a Gulfstream V flying under the callsign JNY58 reported a UAP sighting while cruising at flight level 450 (approximately 45,000 feet). The aircraft was operating a commercial flight from Morristown Municipal Airport (MMU) to Lehigh Valley International Airport (ABE). The crew observed 4–5 bright, blinking lights positioned at their 11 to 12 o&#39;clock (roughly straight ahead and slightly left), estimated at 5,000 to 10,000 feet above the aircraft. A single additional light appeared roughly 1,000 feet below.

According to the report, the lights appeared to change direction and speed. No evasive action was taken by the crew. The case is marked as closed, but the report includes no resolution, identification, or explanation for what the crew observed.

No corroborating radar data, additional witness accounts, or follow-up investigation notes are included in the released document. The aircraft&#39;s tail number was not recorded.</div>
