  <h1>U.S. Military Report Documents Balloon-Like Object Over Arabian Gulf</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c4cae44b6ac7b4f4916ddff140d47b1e2a6ddc80ed72985877c07401d17fd76a.jpg" alt="U.S. Military Report Documents Balloon-Like Object Over Arabian Gulf thumbnail" loading="lazy" />
  <p>A 2020 U.S. military mission report describes a military operator tracking an unidentified object over the Arabian Gulf that resembled a balloon drifting with the wind at about 31,000 feet. The object produced a strong enough sensor return to be classified as a weapons-quality track, but the report is heavily redacted and no formal identification was made.</p>
  <div class="narr">This document is a U.S. Department of War mission report from 2020, originally classified SECRET, describing an encounter with an unidentified anomalous phenomenon (UAP) in the Arabian Gulf region. The report was filed by a single military operator.

The operator observed an object that, in their words, &quot;looks like a balloon&quot; and was &quot;traveling with the winds&quot; at approximately 31,000 feet above sea level. The object was noted as similar to a UAP previously reported by the 48th Fighter Wing, suggesting this was not a one-off sighting. The operator tracked the object as a &quot;weapons quality 1 track&quot; — meaning the sensors produced a reliable enough return that the object could theoretically have been engaged as a target. The operator confirmed they achieved a targeting solution (described as &quot;next to shoot&quot;) and visually identified the object using the aircraft&#39;s targeting forward-looking infrared (TFLIR) sensor, an infrared camera used for precision targeting.

Despite this detailed tracking, the document does not contain a formal conclusion about what the object was. The operator&#39;s own description — balloon-like, wind-driven, not self-propelled — points toward something conventional, but no definitive identification appears in the unredacted portions.

Significant portions of the report are redacted under classification markings for national security information. Full location coordinates, operational details, and potentially important context are blacked out, making it impossible to independently verify the full scope of the encounter from this document alone.</div>
