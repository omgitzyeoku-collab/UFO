  <h1>NRC Emails Show Unidentified Object Near Pilgrim Nuclear Plant Stumped Multiple Agencies</h1>
  <div class="meta">
    <span class="badge">NRC</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ca96d1ff5dedfe434cfd466f053985fd0dd7c601255cab8df9904fad96893e07.jpg" alt="NRC Emails Show Unidentified Object Near Pilgrim Nuclear Plant Stumped Multiple Agencies thumbnail" loading="lazy" />
  <p>This internal email chain from the Nuclear Regulatory Commission (NRC) records an unidentified object spotted near the Pilgrim Nuclear Power Station in Plymouth, Massachusetts in late September 2015. Plymouth Police, the FAA, and Massachusetts State Police all responded but none could identify the object, which was officially classified as a UFO; a weather balloon was suggested but never confirmed.</p>
  <div class="narr">In late September and early October 2015, staff at the Nuclear Regulatory Commission exchanged emails about an unidentified object spotted near the Pilgrim Nuclear Power Station in Plymouth, Massachusetts. The object was at thousands of feet altitude and was indiscernible from the ground.

Plymouth Police arrived on site, the Federal Aviation Administration was contacted, and Massachusetts State Police dispatched a helicopter — but none of these agencies could identify the object. A weather balloon was floated as a possible explanation, but as the emails note, &quot;no one was definite.&quot; The object was officially classified as a UFO.

Despite the sighting occurring near a nuclear facility, NRC staff determined it posed no threat and no security incident report was filed. One staff member noted drily, &quot;For the record we don&#39;t regulate UFOs.&quot; Senior NRC official Raymond Lorson added a sardonic reference to the Air Force using the weather balloon explanation frequently in the 1950s — a nod to the historical pattern of such explanations during the Project Blue Book era.

The emails involve several named NRC personnel including Brett Klukan (Region I Regional Counsel), Dana Caron, Anthony Dimitriadis, John Cherubini, and Raymond Lorson. The tone throughout is informal and candid, reflecting internal discussion rather than a formal investigation.

This document is notable not for what it proves but for what it reveals about how a federal nuclear safety agency handled an unexplained sighting near a sensitive facility: multiple agencies responded, none could explain it, and the matter was closed without further action.</div>
