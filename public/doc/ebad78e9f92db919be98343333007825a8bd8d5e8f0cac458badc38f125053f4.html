  <h1>US Intelligence Review Found 143 of 144 UAP Cases Unexplained</h1>
  <div class="meta">
    <span class="badge">ODNI</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ebad78e9f92db919be98343333007825a8bd8d5e8f0cac458badc38f125053f4.jpg" alt="US Intelligence Review Found 143 of 144 UAP Cases Unexplained thumbnail" loading="lazy" />
  <p>This June 2021 report from the Office of the Director of National Intelligence (ODNI) examined 144 unidentified aerial phenomena (UAP) incidents reported by US government sources between 2004 and 2021. Only one was identified — a deflating balloon — while the rest remained unexplained due to limited data. The report flagged UAP as flight safety hazards and potential national security concerns.</p>
  <div class="narr">In June 2021, the Office of the Director of National Intelligence (ODNI) delivered a preliminary assessment on unidentified aerial phenomena (UAP) to Congressional committees. The report was mandated by the Senate as part of the Intelligence Authorization Act for Fiscal Year 2021 and drew on input from across the US intelligence and defence establishment, including the DIA, FBI, NSA, NGA, and all military branches.

The assessment examined 144 UAP reports collected from US government sources between November 2004 and March 2021. Of those, 80 involved observation by multiple sensors — radar, infrared, electro-optical, or weapon seekers — suggesting most UAP probably represent physical objects rather than instrument glitches. Despite this, only one case was resolved with high confidence: a large deflating balloon. The remaining 143 stayed unexplained.

Among the unresolved cases, 18 incidents (described across 21 reports) involved unusual movement patterns or flight characteristics. Some UAP appeared to hover in high winds, move against the wind, manoeuvre abruptly, or travel at considerable speed with no visible propulsion. A small amount of data appeared to show acceleration or &quot;signature management&quot; — the ability to reduce detectability. In a small number of cases, military aircraft systems also picked up radio frequency energy associated with UAP sightings. Eleven documented near-miss incidents between pilots and UAP were reported.

The report proposed five broad categories to explain UAP: airborne clutter (birds, balloons, drones), natural atmospheric phenomena, US government or industry developmental programmes, foreign adversary systems, and a catch-all &quot;other&quot; bin. It found no data indicating any UAP were part of a foreign intelligence collection programme or represented a major technological breakthrough by a potential adversary.

The ODNI noted that no standardised reporting mechanism had existed before the Navy created one in March 2019, with the Air Force following in November 2020. Sociocultural stigma around reporting UAP was identified as a barrier — aviators and analysts described disparagement when observing, reporting, or discussing UAP with colleagues. The report recommended standardised reporting, expanded data collection, and increased investment in research.</div>
