  <h1>Delta 767 Crew Reported &#39;Jet Pack Man&#39; Near LAX in 2022</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/288c8b699e55e8b9fee3f6594a5a12f2b6bda24e4fadbd481a6e0db4ab3c17e1.jpg" alt="Delta 767 Crew Reported &#39;Jet Pack Man&#39; Near LAX in 2022 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a January 2022 sighting by the crew of Delta flight DAL326, a Boeing 767 flying from New York to Los Angeles, who reported seeing what they described as a &#39;jet pack man&#39; at roughly 2,400 feet while on approach near LAX. No other aircraft or police helicopters confirmed the sighting, and the FAA closed the case.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under the classification &quot;Unidentified Aerial Phenomenon.&quot; It records an event on 27 January 2022 at 00:50, involving Delta Air Lines flight DAL326, a Boeing 767 operating a commercial service from John F. Kennedy International Airport (JFK) in New York to Los Angeles International Airport (LAX).

While flying westbound at 2,200 feet, approximately 5 nautical miles east of LAX, the flight crew reported an unidentified object off the right side of the aircraft. They described it as a &quot;jet pack man&quot; at roughly 2,400 feet — about 200 feet above their own altitude.

The FAA&#39;s report notes that no other aircraft and no airborne police helicopter confirmed the sighting. The case was subsequently closed. The document gives no indication that any follow-up investigation was conducted or that the object was ever identified.

This report is one of several &quot;jet pack man&quot; sightings reported in the LAX area during this general period, though this particular document does not reference any of the others. The description &quot;jet pack man&quot; is the crew&#39;s own characterisation of what they saw, not a confirmed identification by the FAA or any other authority.</div>
