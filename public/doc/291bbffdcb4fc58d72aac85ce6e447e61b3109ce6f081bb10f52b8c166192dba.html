  <h1>Proposed DHS Program to Study Non-Human Materials Was Rejected and Never Operated</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>KONA BLUE was a proposed Department of Homeland Security special access program intended to investigate &quot;non-human biologics&quot; and advanced aerospace vehicles, building on earlier Pentagon-funded research. It was shut down six months after being proposed in 2011 due to inadequate justification, and no materials, data, or funding were ever transferred to it.</p>
  <div class="narr">This document, published by the All-domain Anomaly Resolution Office (AARO), is a historical summary of a proposed government program called KONA BLUE. It is not the proposal itself — it is AARO&#39;s account of what was proposed, what happened, and why the program never got off the ground.

KONA BLUE grew out of an earlier effort called AAWSAP/AATIP (Advanced Aerospace Weapon System Application Program / Advanced Aerospace Threat Identification Program), which was run by the Defense Intelligence Agency (DIA) from 2009 to 2012. That program was funded through congressional earmarks, with Bigelow Aerospace — a Nevada-based company — serving as the primary contractor. The DIA eventually terminated AAWSAP/AATIP, citing a lack of merit and lack of utility in the reports Bigelow produced.

In 2011, the DHS Under Secretary for Science and Technology established KONA BLUE as a Prospective Special Access Program (PSAP), describing it as a sensitive compartment to protect the retrieval and exploitation of &quot;non-human biologics.&quot; Congressional interest and possible homeland security impacts were cited as justification. Six months later, the DHS Deputy Secretary disapproved the program and ordered its immediate termination, citing inadequate justification and insufficient information on personnel and budget.

AARO states plainly that no data or material of any kind was ever transferred to or collected by DHS under KONA BLUE. Information from the earlier AAWSAP/AATIP program remains in DIA&#39;s archived holdings. The documents were declassified jointly by the Department of Defense and DHS for public release. Most redactions were made by the DoD, with a single attorney-client redaction by DHS on page 38.</div>
