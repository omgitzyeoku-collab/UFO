  <h1>CIA Cable Reports Disc-Shaped Object Over Harare Airport in 2008</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">July, 2008</span>
    <span class="badge">Harare, Zimbabwe</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/4332ebe48c3fcb1ef53e9186d90f38142e8465f553388a5d8dff277c87a92b16.jpg" alt="CIA Cable Reports Disc-Shaped Object Over Harare Airport in 2008 thumbnail" loading="lazy" />
  <p>A classified CIA intelligence cable from July 2008 reports that an unidentified disc-shaped object with rotating lights was observed hovering over Harare International Airport in Zimbabwe, possibly detected by both radar and optical means. The sighting prompted Zimbabwe to place its forces on high alert, and unnamed individuals debated whether the object was a foreign reconnaissance device or extraterrestrial in origin.</p>
  <div class="narr">This document is a CIA intelligence cable classified SECRET/NOFORN (meaning secret, not releasable to foreign nationals), distributed on 3 July 2008. It reports that on the afternoon of 2 July 2008, an unidentified object was observed hovering at high altitude over Harare International Airport in Zimbabwe, possibly detected by both radar and optical means.

Observers described the object as disc-like in shape with a hollow centre and a series of rotating lights on the underside of its airframe. At one point during the observation, &quot;beams&quot; were seen emanating from the object. The sighting ended when the rotating lights shifted colours and the object rapidly ascended to higher altitudes, moving out of visual range.

The incident prompted Zimbabwe to place its forces on high alert. Unnamed individuals — whose identities are fully redacted — debated two possible explanations: that the object was an advanced reconnaissance device belonging to a foreign government, or that it was of extraterrestrial origin. The cable does not indicate which explanation, if either, was favoured.

The cable was distributed widely across the US government, reaching dozens of agencies including the White House Situation Room, the Director of National Intelligence, the Defence Intelligence Agency, the NSA, the FBI, and the Secret Service. However, the document itself carries a header stating it is an &quot;information report, not finally evaluated intelligence&quot; — meaning the CIA had not verified the claims at the time it was circulated.

Heavy redactions throughout the document obscure who the observers were, what organisation they belonged to, and significant portions of the narrative text. Without knowing who reported the sighting or their credibility, the evidentiary weight of the account is difficult to assess.</div>
