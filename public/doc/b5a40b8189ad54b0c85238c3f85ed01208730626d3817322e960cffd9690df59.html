  <h1>FAA Report: American Airlines Crew Spotted Unidentified Balloon Near Chicago</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/b5a40b8189ad54b0c85238c3f85ed01208730626d3817322e960cffd9690df59.jpg" alt="FAA Report: American Airlines Crew Spotted Unidentified Balloon Near Chicago thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a February 2023 sighting by the crew of American Airlines flight AAL2297, who observed a balloon-like object off the right side of their aircraft while flying at 34,000 feet near Chicago. The object was estimated at approximately 50,000 feet altitude, and the case was closed without a stated identification.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP) in US airspace. It was classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On 3 February 2023, the crew of American Airlines flight AAL2297, a commercial flight travelling from Dallas/Fort Worth (DFW) to Boston (BOS), reported seeing a balloon off the right side of their aircraft. At the time, the plane was heading southbound at flight level 340 (approximately 34,000 feet), positioned about 30 nautical miles east of Chicago Executive Airport (PWK). The crew estimated the balloon was at approximately flight level 500 — roughly 50,000 feet — or above.

The report is notable for its timing: early February 2023 saw widespread reports of high-altitude balloon sightings across North America, including the widely publicised Chinese surveillance balloon incident. However, the document itself does not draw any connection to those events.

The FAA marked this case as closed. No resolution or identification of the object is recorded in the available text. The sighting was reported solely by the flight crew, with no independent sensor confirmation documented in this report.

Redaction levels appear low — the document is largely readable — but the absence of a conclusion or identification means the report raises a question it does not answer.</div>
