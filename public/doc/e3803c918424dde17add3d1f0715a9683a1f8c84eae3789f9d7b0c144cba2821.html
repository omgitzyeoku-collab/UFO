  <h1>FAA Report: Gulfstream Crew Spotted Jet Pack at 9,000 Feet Near Teterboro</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e3803c918424dde17add3d1f0715a9683a1f8c84eae3789f9d7b0c144cba2821.jpg" alt="FAA Report: Gulfstream Crew Spotted Jet Pack at 9,000 Feet Near Teterboro thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a sighting by a Gulfstream IV crew departing Teterboro Airport, New Jersey. The crew reported an object they described as a manned jet pack flying in circles at roughly 8,000 to 9,000 feet. The case was closed with no resolution or follow-up findings documented.</p>
  <div class="narr">This document is an FAA (Federal Aviation Administration) SKYWATCH incident report filed under case number 237UAP00055. It records a sighting classified under the FAA&#39;s primary code for an Unidentified Aerial Phenomenon.

On 10 June 2021, the crew of a Gulfstream IV business jet (callsign N865JM), a general aviation aircraft departing Teterboro Airport (TEB) in New Jersey, reported seeing an unidentified object while climbing through 9,000 feet on a northeast heading. The crew described the object as what appeared to be a manned jet pack, manoeuvring in circles at approximately 8,000 to 9,000 feet altitude. The sighting was reported through FAA facility N90, the New York Terminal Radar Approach Control (TRACON).

The crew took no evasive action in response to the sighting. Law enforcement notification was recorded as &quot;not reported&quot;, meaning the document does not confirm whether police or other agencies were contacted. The FAA flagged the report internally (marked as &quot;Paged: YES&quot;).

The case status is listed as Closed. Notably, no resolution, follow-up investigation findings, or confirmed identification of the object appears in the document. There is no mention of corroborating radar data or independent witnesses.</div>
