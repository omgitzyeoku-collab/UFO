  <h1>United Airlines crew reported unidentified object over Pennsylvania in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/65f75b57ad013260179f38f1a253438640d13d6b90e2cb22b6ca5f1c3d2e759e.jpg" alt="United Airlines crew reported unidentified object over Pennsylvania in 2023 thumbnail" loading="lazy" />
  <p>This FAA operations center log records that the crew of United Airlines Flight 665, a Boeing 737-900, reported seeing an unidentified aerial phenomenon from 12,000 feet near Yardley, Pennsylvania on August 28, 2023. No evasive action was taken, and New Jersey State Counter Terrorism was notified.</p>
  <div class="narr">On August 28, 2023, the crew of United Airlines Flight 665 — a Boeing 737-900 flying from Santiago, Dominican Republic to Newark — reported an unidentified aerial phenomenon (UAP) to air traffic control. The sighting occurred at 12,000 feet altitude, approximately 20 nautical miles south of the Yardley VOR navigational beacon in Pennsylvania. The object was visible from the left side of the aircraft.

The crew did not take evasive action. Washington ARTCC (Air Route Traffic Control Center) was advised of the sighting. New Jersey State Counter Terrorism was also notified. The report was logged at 6:45 PM Eastern time and flagged as a &quot;late report,&quot; meaning there was a delay between the observation and its formal filing.

This document is a brief operations center log entry from the FAA&#39;s Washington Operations Center — not a full investigation. It records the basic facts of the sighting but provides no description of the object&#39;s shape, size, colour, movement, or behaviour. There is no mention of radar data, photographs, or corroborating witness accounts from other aircraft or ground observers.

The coordinates place the sighting at roughly 39.96°N, 74.85°W, which is in the airspace over southern New Jersey, consistent with the approach path into Newark. The document contains no conclusions about what the crew saw.</div>
