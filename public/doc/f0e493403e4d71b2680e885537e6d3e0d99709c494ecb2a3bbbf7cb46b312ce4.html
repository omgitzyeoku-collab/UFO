  <h1>AARO Documents Eleven Failed Attempts to Interview UFO Whistleblower David Grusch</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  
  <p>An internal memo from the Pentagon&#39;s UFO office (AARO) records at least eleven unsuccessful attempts between June 2023 and January 2024 to interview whistleblower David Grusch about his claims that the U.S. Government possesses extraterrestrial material and runs reverse-engineering programs. Grusch repeatedly declined, citing concerns about whether AARO had proper security clearances to hear his information, and once agreed to an interview but failed to show up.</p>
  <div class="narr">This document is an unclassified memorandum for record dated January 8, 2024, written by the All-domain Anomaly Resolution Office (AARO) — the Pentagon office responsible for investigating unidentified anomalous phenomena (UAP). It was cleared for public release on June 13, 2025, with some names and contact details redacted for personal privacy. The memo&#39;s purpose is to document AARO&#39;s efforts to interview David Grusch, a former intelligence official who publicly claimed the U.S. Government possesses extraterrestrial material and operates secret reverse-engineering programs.

According to the memo, AARO&#39;s director and staff made at least eleven documented contact attempts between June 2023 and January 2024, both directly and through intermediaries including Chris Mellon, a former Defense Department official. An intermediary reported that Grusch had &quot;bad blood with Sean going back to 2015,&quot; referring to AARO Director Sean Kirkpatrick, which complicated the outreach. Despite this, Grusch contacted AARO on November 10, 2023, and agreed to sit for an interview on November 14 — but failed to appear at the agreed location and time.

Grusch raised specific procedural objections throughout the process. He questioned whether AARO was authorized to receive classified information from agencies outside the Department of Defense, such as the Department of Energy and the National Security Council. He stated the interview would need to be conducted at a highly restricted classification level — HCS-Operations Restricted Handling — to protect information he had previously given to the Intelligence Community Inspector General and congressional intelligence committees. AARO responded by providing memorandums from the DoD Special Access Programs Central Office and the Office of the Director of National Intelligence confirming its authority to receive such information. A formal November 19 invitation was coordinated with the Department of Defense Office of General Counsel.

AARO&#39;s conclusion is blunt: the office determined that Grusch &quot;had no intention of providing AARO with information regarding his claims.&quot; The document is assigned case number 330UAP000032 and was produced in support of the Congressionally directed Historical Record Report. Several names are blacked out under privacy exemptions, making it impossible to identify all intermediaries involved.</div>
