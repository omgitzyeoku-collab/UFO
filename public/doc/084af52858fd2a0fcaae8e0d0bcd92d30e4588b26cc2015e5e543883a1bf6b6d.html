  <h1>NASA-UAP-D008, Apollo 12 Medical Debriefing - Tape 12, 1969</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">1969</span>
    <span class="badge">Texas</span>
    
  </div>
  
  <p>During a medical debriefing of the crew of the Apollo 12 mission, Commander Charles “Pete” Conrad, Command Module Pilot Richard “Dick” F. Gordon, and Lunar Module Pilot Alan L. Bean describe their observations of instances of light flashes or “streaks of lights.” The astronauts each reported that these experiences occurred in the dark as they tried to sleep.
The NASA medical team considered whether similar phenomena reported by Apollo 11 Lunar Module Pilot Buzz Aldrin had been attributable to exposure of the retina by cosmic rays. NASA later determined that the phenomena reported by the Apollo 12 flight crew were internal to the astronauts’ vision rather than external light sources.</p>
