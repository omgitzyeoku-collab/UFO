  <h1>Apollo 12 Crew Reported Seeing Light Flashes in Space</h1>
  <div class="meta">
    <span class="badge">NASA</span>

    <span class="badge">verified</span>

  <p>This is an auto-transcribed audio recording of a post-mission medical debriefing in which the Apollo 12 crew described seeing flashes and streaks of light while trying to sleep in the darkened spacecraft. NASA&#39;s medical team discussed whether cosmic rays striking the retina could explain the phenomenon, noting they had photographed astronaut retinas since the Mercury programme but never found visible damage.</p>
  <div class="narr">This document is an audio recording from 1969, captured during a medical debriefing of the Apollo 12 crew after their return. The recording has been automatically transcribed, and the text quality is poor — many passages are garbled or unintelligible, and it is not possible to tell which crew member is speaking at any given point.

During the debriefing, the astronauts described seeing flashes and streaks of light with their eyes closed while in the darkened spacecraft. The streaks appeared roughly horizontal, slightly above the centre of their visual field, and seemed to move from right to left. One crew member compared the flashes to someone shining a small point of light at them. Multiple crew members reported similar experiences in similar locations in their field of vision. The phenomenon had also been reported on an earlier Apollo flight.

NASA&#39;s medical team assessed the flashes as internal to the astronauts&#39; vision rather than external light sources. The leading hypothesis discussed was that cosmic ray particles were striking individual retinal cells, producing the sensation of light. NASA had been photographing astronaut retinas since the Mercury programme to look for evidence of cosmic ray damage but had never found any visible streaks or marks.

The discussion in the recording is exploratory — the medical team and crew were working through possible explanations rather than presenting firm conclusions. One crew member also mentioned seeing a red line while looking at equipment, though the context is unclear due to transcription quality.</div>
