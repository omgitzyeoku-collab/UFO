  <h1>AARO Lab Analysis Finds Ohio UAP-Linked Metal Is Ordinary Aluminum</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9c50120ca616867e05e8b06aa7a3e2b27e75bb0cd2b7f6a99c8b06fd5ef0614a.jpg" alt="AARO Lab Analysis Finds Ohio UAP-Linked Metal Is Ordinary Aluminum thumbnail" loading="lazy" />
  <p>A January 2026 supplement from the All-domain Anomaly Resolution Office (AARO) reports that a metallic specimen allegedly linked to a UAP sighting near Flint Ridge State Park, Ohio, was analyzed by Oak Ridge National Laboratory and found to be an ordinary aluminum alloy with no unusual properties. AARO concludes the material most likely came from conventional industrial or commercial sources.</p>
  <div class="narr">In 2024, the All-domain Anomaly Resolution Office (AARO) — the Pentagon body responsible for investigating unidentified anomalous phenomena — contracted Oak Ridge National Laboratory (ORNL) to examine a metallic specimen. The specimen had reportedly been recovered from private property near Flint Ridge State Park, Ohio, in the mid-1990s. The property owner claimed to have observed a large unidentified airborne object before finding the material on their land.

ORNL&#39;s analysis determined the specimen is consistent with an ordinary aluminum alloy made for common applications. Its composition most closely matches Aluminum Association alloys 369.1 and A413.1, which belong to the 300-series — a family of aluminum alloys that has been in widespread industrial production since the 1970s and now accounts for over 90% of all shaped aluminum castings. The specimen showed large grain sizes, interconnected pores up to 1 millimeter across, and needle-like silicon precipitates — features that indicate casting defects rather than advanced engineering. It also lacked strengthening additives such as strontium or sodium. ORNL tested for radioactive emissions and found none.

Based on these findings, ORNL concluded that the specimen&#39;s features are inconsistent with a component designed for an advanced application. AARO concurs, assessing the material as most likely an ordinary, conventionally manufactured aluminum alloy — possibly originating from engine components, industrial by-products, or recycled alloys. However, AARO states it cannot definitively attribute the specimen to a specific source or manufacturing process.

The document presents several plausible mundane origins but does not confirm any single one. The witness report of a large airborne object remains a single, unverified claim with no corroborating evidence presented in the document.</div>
