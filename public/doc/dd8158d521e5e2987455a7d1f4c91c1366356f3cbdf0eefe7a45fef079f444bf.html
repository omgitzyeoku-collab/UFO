  <h1>Alaska Radar Detected Possible Balloon, Later Ruled Erroneous Data</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/dd8158d521e5e2987455a7d1f4c91c1366356f3cbdf0eefe7a45fef079f444bf.jpg" alt="Alaska Radar Detected Possible Balloon, Later Ruled Erroneous Data thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH report documents a radar detection on 6 February 2023 of an unidentified aerial phenomenon roughly 115 nautical miles north of Kotzebue, Alaska. The object was tentatively identified as a possible balloon at high altitude, but the case was closed the same day after the detection was determined to be erroneous radar data with no confirming aircraft or sensor.</p>
  <div class="narr">On 6 February 2023 at 20:16 UTC, Alaska NORAD (the North American Aerospace Defense Command&#39;s Alaska region) reported an unidentified aerial phenomenon to the FAA. The detection occurred approximately 115 nautical miles north of Kotzebue, Alaska, at coordinates 68°45&#39;N 161°39&#39;W.

The object appeared on radar as a possible unverified balloon travelling northeast at 27 knots (roughly 31 mph) at approximately flight level 300 — around 30,000 feet. No aircraft were in the area to visually confirm what the radar was showing, and the initial detection did not come from any aircraft source.

The FAA logged the event under its SKYWATCH incident reporting system with primary code &quot;Unidentified Aerial Phenomenon.&quot; However, after review, the report was closed the same day. The agency determined the detection was erroneous and uncorrelated radar data — meaning the radar return could not be matched to any real object or aircraft.

The timing is notable: this incident occurred during early February 2023, a period when multiple high-altitude balloon detections were being tracked across North American airspace, which may have contributed to heightened radar scrutiny. The document itself shows low evidence of redaction.</div>
