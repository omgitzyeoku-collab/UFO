  <h1>Federal Agent Reports Orange Orbs and Evasive Vehicle in Western US</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">October, 2023</span>
    <span class="badge">Westen United States</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/3c369f9660a3528455b6140d03dfef6bc94b1cf430b85ce26938e5adf1dd1e9d.jpg" alt="Federal Agent Reports Orange Orbs and Evasive Vehicle in Western US thumbnail" loading="lazy" />
  <p>A U.S. federal law enforcement special agent submitted a first-hand account to the All-domain Anomaly Resolution Office (AARO) describing two UAP encounters over consecutive nights in October 2023 in the western United States. The sightings included a colour-shifting orange orb that expelled smaller red orbs, red lights hovering in formation over an airfield, and a ground vehicle that evaded pursuit by apparently floating off-road without leaving tracks.</p>
  <div class="narr">This document is a witness narrative memorandum submitted to the All-domain Anomaly Resolution Office (AARO), the Pentagon body responsible for investigating unidentified anomalous phenomena (UAP). It was signed by AARO Director Jon T. Kosloski and dated 02 June 2026, roughly two and a half years after the events it describes.

The witness, identified only as &quot;Witness 3,&quot; is a U.S. federal law enforcement special agent who was one of several agents reporting UAP sightings over two days in mid-October 2023 in the western United States. The specific location is not disclosed.

During the first event, at approximately 7 p.m. at dusk, the witness observed a large orange orb that alternated between orange and clear every two to three seconds. It moved roughly 20 degrees across the sky in three to five seconds, then expelled three smaller red orbs in what the witness described as a mechanical action. The red orbs moved south in a straight line. No sound or exhaust trails were observed. The entire event lasted about 30 to 45 seconds.

The second event occurred either the same night or the following night, between 8 and 8:30 p.m. Using night vision goggles, the witness saw four red lights travel from north to south, covering about 90 degrees in five to ten seconds, then stop and hover in a square formation over the four corners of an airfield. Orange orbs were also seen near a ridgeline. On the ground, an unidentified vehicle flashed its headlights at a regular tempo. When the witnesses attempted to approach, the vehicle maintained a distance of roughly 100 yards and then appeared to float off-road across rough terrain. A later search found no tire tracks. When the vehicle disappeared, the aerial objects were gone as well. This event lasted about two to three minutes.

The document does not include any agency conclusion about what was observed. No sensor data, photographs, or radar tracks accompany the narrative. AARO has not attributed the sightings to any specific origin in this document.</div>
