  <h1>UPS Cargo Crew Reports Bright Lights Moving Above Their Aircraft</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/3978a75c081100cb1912227b74bbad7af919f9a7cb4d3cda35433f7d0ec50bba.jpg" alt="UPS Cargo Crew Reports Bright Lights Moving Above Their Aircraft thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a UPS cargo flight crew observing a line of equally spaced bright lights moving eastward high above their aircraft near the CSN navigational beacon. A second aircraft independently reported the same sighting, but the case was closed with no further investigation noted.</p>
  <div class="narr">This document is an FAA (Federal Aviation Administration) SKYWATCH incident report filed under case number 237UAP00091, classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot; It records an observation made by the crew of UPS flight 1114, a commercial MD-11 cargo aircraft.

While flying northeast at flight level 310 (approximately 31,000 feet) over the CSN VORTAC — a type of ground-based navigational beacon — the crew reported seeing an equally spaced line of very bright lights directly ahead of their aircraft. The lights were moving eastward and appeared to be well above their altitude.

The sighting was not limited to one crew. A second aircraft, callsign VTE611, independently reported seeing the same phenomenon. Despite the corroboration, law enforcement was not notified, and the flight crew was directed to a website to file their own report.

The FAA marked the case as closed. The document contains no reference to radar data, sensor recordings, or any follow-up investigation. No explanation for the lights is offered in the report.

The level of redaction in this document is low — most fields are readable. However, the report is brief and provides no analytical conclusions about what the crew observed.</div>
