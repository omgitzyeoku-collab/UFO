  <h1>FBI Interview Records Witness Account of Luminous Orbs in Northeastern US</h1>
  <div class="meta">
    <span class="badge">FBI</span>

  <img class="thumb" src="/extract/thumbs/b612cbe81c33546e3cea6f047ada247df054cbb294a84977d4600a0c72ffeb4d.jpg" alt="FBI Interview Records Witness Account of Luminous Orbs in Northeastern US thumbnail" loading="lazy" />
  <p>This FBI FD-302 interview report documents a witness who observed two luminous orbs — one basketball-sized, one beach-ball-sized — hovering near their home in the northeastern United States around 9:15pm in 2025. The document is heavily redacted, contains no FBI conclusions, and relies primarily on a single witness account with partial corroboration from one other person.</p>
  <div class="narr">This document is an FBI FD-302, a standard form used to record witness interviews. It captures a first-hand account from a person in the northeastern United States who reported seeing unidentified anomalous phenomena near their home in 2025.

The witness stated that upon arriving home around 9:15pm, they noticed a yellow ball of light roughly the size of a basketball through their windshield. Shortly after, they saw a second, larger ball of light about the size of a beach ball. Both objects were approximately 30 yards away and 20 to 30 feet above the ground. A second person came outside and also observed the objects. Both witnesses watched the orbs move laterally to the left, passing behind trees and a neighbour&#39;s house. At some point, one orb appeared to merge into the other before both abruptly vanished. The primary witness reported no health issues or eye discomfort from watching the lights.

Weeks later, the same witness reported seeing white orbs travelling from west to east at a higher altitude. The witness also recalled a separate 1987 sighting of a red light near power lines, which they described as resembling the front of the car from the television show Knight Rider. They said the object hovered and then landed near a power station.

The FBI document states explicitly that it contains neither recommendations nor conclusions from the bureau. Photos were taken by FBI agents at the scene with the witness&#39;s permission, but no photographic evidence is included in the released text — they are referenced only as attachments. All witness names, specific dates, and precise locations are redacted throughout.</div>
