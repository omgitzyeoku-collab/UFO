  <h1>Southwest Airlines crew reported bright lights near LAX, likely Starlink satellites</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a4370d719c8711bf512dfda51e488f1c853fee32e3343d704e5cc095c96133a4.jpg" alt="Southwest Airlines crew reported bright lights near LAX, likely Starlink satellites thumbnail" loading="lazy" />
  <p>An FAA preliminary incident report documents the crew of Southwest Airlines Flight 986 observing bright lights that appeared orbiting or stationary at roughly 60,000 feet while flying at 40,000 feet near Los Angeles. The FAA noted the object correlates with a Starlink satellite map, suggesting a likely conventional explanation.</p>
  <div class="narr">This document is a preliminary incident report from the FAA&#39;s Washington Operations Center (record 237UAP00637). It records a UAP sighting reported by the crew of Southwest Airlines Flight 986, a Boeing 737 operating from San Diego to Oakland.

According to the report, the crew observed bright lights from the right side of the aircraft that appeared to be orbiting or stationary at approximately 60,000 feet. The aircraft was northbound at 40,000 feet, about 16 nautical miles southwest of Los Angeles International Airport (LAX). The sighting was relayed through Los Angeles Air Route Traffic Control Center (ARTCC). No evasive action was taken.

The FAA&#39;s own note on the report states that the observed object &quot;correlates with Starlink map,&quot; indicating the agency identified a match between the lights and known positions of SpaceX Starlink satellites. This is a preliminary operations center report rather than a full investigation, and no further conclusions or follow-up findings are included in the document.

The report contains minimal redaction. Coordinates place the sighting at roughly 33.78°N, 118.61°W, consistent with the area southwest of LAX over the Pacific.</div>
