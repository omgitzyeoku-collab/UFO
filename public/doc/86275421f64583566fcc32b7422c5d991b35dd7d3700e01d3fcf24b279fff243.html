  <h1>U.S. Air Force crew spotted glowing sphere over Gulf of Oman</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">6/7/24</span>
    <span class="badge">Gulf of Oman</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/86275421f64583566fcc32b7422c5d991b35dd7d3700e01d3fcf24b279fff243.jpg" alt="U.S. Air Force crew spotted glowing sphere over Gulf of Oman thumbnail" loading="lazy" />
  <p>A declassified U.S. military mission report documents a single UAP sighting by an Air Force Special Operations crew during a surveillance flight over the Gulf of Oman on 7 June 2024. The object — a glowing, hot sphere with a vertical bar beneath it — flew low over the water at 140 knots, showed no reaction to the aircraft, and was assessed as benign.</p>
  <div class="narr">On the night of 6–7 June 2024, a crew from the 3rd Special Operations Squadron flew a 10-hour surveillance mission over the Gulf of Oman as part of Operation Enduring Sentinel, under U.S. Central Command. The aircraft, whose type is redacted, was equipped with an AN/DAS-1 targeting pod and carried a Full Motion Video feed. The mission itself was cut short — the crew never reached their assigned station because of weather and returned to base.

During the return leg, at 0457Z (just before 5 a.m. UTC), an operator aboard the aircraft spotted a single unidentified object. The report describes it as a glowing, hot, solid sphere with a vertical, unwavering cylindrical pole or bar attached to its underside. The crew noted a possible reflection from the object visible on the water below. It was flying straight, just above the water&#39;s surface, at an estimated 140 knots. The observing aircraft was at roughly 24,000 feet, traveling at 163 knots on a heading of 294 degrees.

The crew did not attempt to interrogate, engage, or intercept the object. The UAP showed no change in behaviour in response to the aircraft&#39;s presence. The observer — a Senior Airman (E-4) — assessed it as benign. The report states the object displayed no advanced capabilities, had no effect on personnel, and no material was recovered. Its propulsion method was listed as unknown.

The document was originally classified SECRET//NOFORN and was declassified on 24 October 2025 by Major General Richard A. Harrison, USCENTCOM Chief of Staff. It is heavily redacted: the aircraft type, callsign, specific coordinates, mission number, target names, and personnel details are all blacked out under national-security and privacy exemptions. There is also an unexplained discrepancy — the document&#39;s title references October 2023, but the incident clearly occurred in June 2024.</div>
