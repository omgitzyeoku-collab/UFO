  <h1>Commercial Pilot Reports Stationary Flashing Lights at 50,000 Feet Over Virginia</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d43dd178a93cb6b282e30d718fb7a01163862e634761537bf8fbb225e23e6616.jpg" alt="Commercial Pilot Reports Stationary Flashing Lights at 50,000 Feet Over Virginia thumbnail" loading="lazy" />
  <p>This FAA incident report documents a commercial airline crew on a flight from LaGuardia to Chattanooga who observed bright white and yellow flashing lights hovering at an estimated 50,000–60,000 feet near Leesburg, Virginia on 22 October 2024. Air traffic control radar did not detect the object, and the FAA closed the case without providing an explanation.</p>
  <div class="narr">On 22 October 2024 at 01:54 UTC, the crew of a commercial flight operating under callsign EDV4925 reported an unidentified aerial phenomenon to Washington Center (ZDC), the FAA&#39;s air traffic control facility covering the region. The aircraft was flying southwest at 36,000 feet on a route from LaGuardia Airport (LGA) in New York to Chattanooga (CHA), Tennessee.

The crew described bright white and yellow flashing lights off the left side of their aircraft, in the vicinity of LDN — likely a reference to Leesburg Executive Airport in Virginia, a common navigation point near Washington, DC. The lights appeared stationary at an estimated altitude of 50,000 to 60,000 feet, well above the aircraft&#39;s own cruising altitude and above the ceiling of most conventional aircraft.

Air traffic control checked their radar systems but did not detect any object at the reported location. The sighting rested entirely on the flight crew&#39;s visual observation, with no independent radar confirmation.

The FAA logged the incident under its SKYWATCH programme, which tracks unidentified aerial phenomena reports. The case status is listed as &quot;Closed,&quot; but the document provides no resolution, identification, or explanation for what the crew observed. No tail number for the reporting aircraft was recorded in the report.</div>
