  <h1>FBI Agent Documents Police Officer&#39;s 1964 UFO Sighting in Socorro, New Mexico</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9a98bf803016c9a2252c03ea960d61d0e35652c88a9098018ebf8f953141c9a8.jpg" alt="FBI Agent Documents Police Officer&#39;s 1964 UFO Sighting in Socorro, New Mexico thumbnail" loading="lazy" />
  <p>This is an FBI field investigation report from May 1964 in which Special Agent D. Arthur Byrnes Jr. documented Socorro police officer Lonnie Zamora&#39;s account of seeing an oval-shaped, aluminum-white object lift off from the ground near Socorro, New Mexico on April 24, 1964. The agent personally inspected the landing site and found rectangular ground depressions, burned grass, and circular marks in the earth.</p>
  <div class="narr">On the evening of April 24, 1964, at approximately 5:45 PM, Socorro Police Officer Lonnie Zamora was chasing a speeding car when he broke off pursuit to investigate what he believed was an explosion near a dynamite shack. Instead, he reported seeing a shiny, oval-shaped, aluminum-white object sitting about three and a half feet off the ground on leg-like supports. He also observed two figures in white coveralls standing near the object, one of whom appeared startled upon noticing his police car. The object bore a red insignia roughly two and a half feet high and two feet wide.

According to Zamora&#39;s account, the object then lifted off with a loud roar — unlike a jet engine — producing a blue-orange flame from its underside. It traveled southwest at roughly ten to fifteen feet above the ground, clearing a nearby dynamite shack by about three feet, before disappearing from view over Box Canyon or Six Mile Canyon Mountain. Zamora radioed dispatch during the encounter, initially reporting a possible accident.

FBI Special Agent D. Arthur Byrnes Jr., who happened to be at the Socorro State Police Office on unrelated business that afternoon, went to the site and personally inspected it. He found four rectangular depressions in the ground — each approximately sixteen by six inches and about two inches deep — along with three burned patches of grass inside the depression area and three smooth circular marks about four inches in diameter. New Mexico State Police Sergeant M. S. Chavez also arrived at the scene and confirmed the burned brush and tracks. Chavez noted that Zamora was sweating, white, and very pale.

The FBI report describes Zamora as &quot;well regarded as a sober, industrious, and conscientious officer and not given to fantasy.&quot; Zamora stated he was in good health and had not consumed alcohol for over a month. He drew the object&#39;s insignia before Sergeant Chavez arrived. No other persons or inhabited dwellings were noted in the area that night.

The report explicitly states that it contains &quot;neither recommendations nor conclusions of any kind&quot; — the FBI documented the account and the physical evidence at the site without offering any explanation for what Zamora saw.</div>
