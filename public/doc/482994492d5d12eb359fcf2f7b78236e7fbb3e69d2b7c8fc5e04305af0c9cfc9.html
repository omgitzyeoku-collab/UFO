  <h1>1953 CIA Memo Shows Air Force UFO Project Running on Skeleton Crew</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">December, 1953</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/482994492d5d12eb359fcf2f7b78236e7fbb3e69d2b7c8fc5e04305af0c9cfc9.jpg" alt="1953 CIA Memo Shows Air Force UFO Project Running on Skeleton Crew thumbnail" loading="lazy" />
  <p>A December 1953 internal CIA memo reviews the status of the Air Force&#39;s UFO investigation, Project Blue Book. It reveals the project had been reduced to just one officer, one airman, and a secretary, with field investigations halted and resources being transferred to Air Defense Command.</p>
  <div class="narr">This document is an internal CIA memorandum dated 17 December 1953, sent from the Chief of the Physics and Electronics Division to the Assistant Director of Scientific Intelligence. It was prepared at the verbal request of a Mr. Brent in the Executive office of Scientific Intelligence, and provides a status update on how the Air Force was handling its UFO investigation programme.

The memo describes the Air Force&#39;s Project Blue Book (officially designated No. 10073), which was run out of the Air Technical Intelligence Center (ATIC). By late 1953, the entire project was staffed by just three people: Captain Charles A. Hardin, Airman First Class Max G. Futch, and a secretary. The CIA&#39;s Physics and Electronics Division had taken on responsibility for monitoring the project earlier that year.

ATIC had stopped sending its own personnel to investigate UFO sightings in the field. Instead, it relied on USAF intelligence officers stationed closer to sighting locations and confined its own work to receiving and processing reports from a desk. The memo also notes that ATIC was in the process of transferring resources to Air Defense Command, and that a section within ATIC worked directly with the Public Information Office of the Secretary of the Air Force.

Only the first page of what appears to be a multi-page memo is available — the document cuts off mid-sentence. Some passages are redacted or obscured, and the original scan quality is poor, making portions of the text difficult to read with certainty.</div>
