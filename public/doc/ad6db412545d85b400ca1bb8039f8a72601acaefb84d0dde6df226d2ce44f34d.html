  <h1>United Airlines Crew Reported Lights Near Boise; FAA Attributed to Starlink</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/ad6db412545d85b400ca1bb8039f8a72601acaefb84d0dde6df226d2ce44f34d.jpg" alt="United Airlines Crew Reported Lights Near Boise; FAA Attributed to Starlink thumbnail" loading="lazy" />
  <p>An FAA incident report documents a United Airlines crew sighting unusual lights in a triangular or linear pattern while flying at 35,000 feet near Boise, Idaho on 22 February 2023. The FAA concluded the lights were consistent with a Starlink satellite train and closed the case.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — the system the Federal Aviation Administration uses to log pilot sightings of unidentified aerial phenomena (UAP). It covers an event on 22 February 2023 involving United Airlines flight 1325, a Boeing 737-900 operating a commercial route from Denver to Portland.

While flying northwest at 35,000 feet near Boise, Idaho, the flight crew reported seeing lights arranged in a triangular or linear pattern roughly 15–20 degrees above the horizon. The sighting was logged under the identifier 237UAP00226, with a corresponding mandatory occurrence report number ZLC-M-2023/02/21-0008.

The FAA assessed the lights as consistent with a known Starlink satellite train — a line of SpaceX communications satellites that can appear as a string of bright dots moving in formation, a sight frequently reported by pilots and ground observers alike. The case was closed with that explanation.

No corroborating radar data or imagery is referenced anywhere in the document. The report is based solely on the flight crew&#39;s account.</div>
