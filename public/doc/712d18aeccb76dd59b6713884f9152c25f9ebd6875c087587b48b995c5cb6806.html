  <h1>American Airlines Crew Reported Unexplained Lights Near Los Angeles in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/712d18aeccb76dd59b6713884f9152c25f9ebd6875c087587b48b995c5cb6806.jpg" alt="American Airlines Crew Reported Unexplained Lights Near Los Angeles in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of American Airlines flight AAL266 on 21 July 2023, who observed multiple lights that appeared to separate while approaching Los Angeles at 14,000 feet. NORAD checked its systems and found nothing; the case was closed with no further investigation noted.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAP) from pilots and air traffic controllers. It was filed by the Los Angeles Air Route Traffic Control Centre (ZLA) on 21 July 2023.

The crew of American Airlines flight AAL266, an Airbus A321 flying from Lihue, Hawaii to Los Angeles, reported seeing an unidentified aerial phenomenon while eastbound at 14,000 feet, roughly 16 nautical miles west-southwest of Camarillo, California. They described the phenomenon as multiple lights that appeared to separate. The crew did not take any evasive action.

FAA headquarters in Denver asked NORAD (North American Aerospace Defense Command) to check their systems for any tracked objects. NORAD returned negative results — meaning nothing was detected on military radar or sensors. The Aviation Weather Office was also advised of the incident.

The report is marked as closed. There is no indication of follow-up investigation, no corroborating radar data, and no identified explanation for what the crew observed. The level of redaction in this document is low — the core details are intact and readable.</div>
