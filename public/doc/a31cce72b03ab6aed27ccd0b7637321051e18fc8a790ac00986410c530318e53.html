  <h1>DOE-UAP-D004, Los Alamos Conference on Aerial Phenomena, 1949</h1>
  <div class="meta">
    <span class="badge">Department of Energy</span>
    <span class="badge">3/22/49</span>
    <span class="badge">New Mexico</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/a31cce72b03ab6aed27ccd0b7637321051e18fc8a790ac00986410c530318e53.jpg" alt="DOE-UAP-D004, Los Alamos Conference on Aerial Phenomena, 1949 thumbnail" loading="lazy" />
  <p>This document is a transcript of a 1949 conference held at Los Alamos Scientific Laboratory (now Los Alamos National Laboratory), Los Alamos, New Mexico. Attendees included several eminent scientists and physicists, many of whom had contributed to the development of the first nuclear weapons during the Manhattan Project. The purpose of the conference was to discuss and gather hypotheses to account for the nature and origin of a phenomenon involving “green fireballs” that had been reported over a period of several months in the vicinity of the laboratory. The group did not come to a consensus on a likely attribution for the phenomenon, though a leading hypothesis was that the observations may have been related to meteors entering the atmosphere at a shallow angle and high altitude. Dr. Edward Teller suggested that if not a “material body,” an “electron phenomenon” might be the cause, while Dr. Lincoln LaPaz, an expert specializing in meteorics, expressed that “nothing like this, to [his] knowledge, has ever been observed in the case of meteorite drops.”</p>
