  <h1>FAA Report: Pilot Spotted Pulsating Lights at 50,000 Feet Over the Atlantic</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bc7b6b96f372c9b78500fc7846e9a9b03b1c3bcb382a2dbe23ccaf8688d2295c.jpg" alt="FAA Report: Pilot Spotted Pulsating Lights at 50,000 Feet Over the Atlantic thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a pilot sighting of stationary pulsating lights at approximately 50,000 feet on 10 March 2023, observed from a commercial flight cruising at 33,000 feet about 70 nautical miles northeast of Nantucket. The case was closed with no explanation provided.</p>
  <div class="narr">On 10 March 2023, the crew of a commercial flight operating under callsign OAE573 reported an unidentified aerial phenomenon to the FAA. The aircraft was flying northeast at 33,000 feet, roughly 70 nautical miles northeast of Nantucket, Massachusetts, en route from HOP to Shannon, Ireland.

The crew described stationary pulsating lights positioned off the front of their aircraft at approximately FL500 — around 50,000 feet, well above their cruising altitude. That altitude is above the ceiling of most commercial and military aircraft, which makes the observation unusual, though the crew&#39;s altitude estimate was visual and inherently imprecise at that distance.

The FAA logged the sighting as a SKYWATCH Incident Report under the primary code &quot;Unidentified Aerial Phenomenon&quot; and assigned it tracking number ZBW-M-2023/03/10-0001. The relevant authority (noted as &quot;AWO&quot;) was advised, but no follow-up action or response from AWO appears in the document.

The case status is marked as &quot;Closed.&quot; No resolution, identification, or explanation for the observed phenomenon is provided anywhere in the report. No corroborating radar data or sensor evidence is referenced — the entire record rests on the pilot&#39;s account alone.</div>
