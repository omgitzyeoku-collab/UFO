  <h1>Federal Agents Reported Four UAP Sightings in Western US, October 2023</h1>
  <div class="meta">
    <span class="badge">Department of War</span>

  <img class="thumb" src="/extract/thumbs/ecd580d2053fae09115c5aafef88a14db42324582ff5a7ee19f5454c48150330.jpg" alt="Federal Agents Reported Four UAP Sightings in Western US, October 2023 thumbnail" loading="lazy" />
  <p>This Department of War document is an illustrative map depicting four unidentified anomalous phenomena (UAP) incidents reported by U.S. federal law enforcement agents over several days in October 2023 in the western United States. The objects described include orbs and kite-shaped phenomena, but all imagery in the document is artificially generated — no photographs or sensor data are included.</p>
  <div class="narr">The Department of War released this document (DOW-UAP-D078) as a notional — meaning illustrative, not photographic — map showing four separate UAP incidents in the western United States. The sightings were reported by U.S. federal law enforcement special agents over several days in October 2023.

The four incidents each involved distinct phenomena. In the first, dubbed &quot;Orbs Launching Orbs,&quot; agents reported seeing an orange &quot;mother orb&quot; that appeared to launch smaller red orbs. The second, &quot;Fiery Orb,&quot; involved a large fiery orb seen against a ridgeline at roughly 1,000 yards. The third and fourth incidents involved kite-shaped objects: a dark one with one red and one white light observed at close range (&quot;Dark Kite&quot;), and a translucent version also at close range (&quot;Translucent Kite&quot;).

Critically, this document contains no photographs, sensor readings, or physical evidence. Every image in it was artificially generated using the military&#39;s genai.mil platform. All locations, distances, and object sizes shown on the map are explicitly labelled as notional and not to scale.

The document is based entirely on verbal reports from the law enforcement agents involved. The Department of War did not include any conclusions about what the objects were, nor any corroborating evidence from radar, video, or other sensors.</div>
