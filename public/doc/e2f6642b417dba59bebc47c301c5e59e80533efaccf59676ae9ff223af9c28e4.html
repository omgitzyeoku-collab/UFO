  <h1>United Airlines crew reported unexplained lights at 35,000 feet over South Dakota</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e2f6642b417dba59bebc47c301c5e59e80533efaccf59676ae9ff223af9c28e4.jpg" alt="United Airlines crew reported unexplained lights at 35,000 feet over South Dakota thumbnail" loading="lazy" />
  <p>This FAA incident report documents a United Airlines Boeing 737 MAX 9 crew observing lights appearing and disappearing directly ahead of their aircraft at or above 35,000 feet, roughly 25 nautical miles south of Sioux Falls, South Dakota, on 11 February 2023. The case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — the system the Federal Aviation Administration uses to log pilot reports of unidentified aerial phenomena. It covers an event on 11 February 2023 involving United Airlines flight 1786, a Boeing 737 MAX 9 flying eastbound from Los Angeles (LAX) to Cleveland (CLE) at 35,000 feet.

While passing approximately 25 nautical miles south of Sioux Falls, South Dakota, the flight crew reported seeing lights directly ahead of the aircraft that were &quot;coming and going&quot; at or above their altitude. The sighting was logged by Minneapolis Air Route Traffic Control Centre (ZMP), the FAA facility overseeing that airspace. The report notes that &quot;TY&quot; was notified, though this abbreviation is unexplained — it likely refers to an internal FAA office, person, or system.

The case is marked as closed. No resolution, explanation, or follow-up findings appear in the record. There is no mention of corroborating radar data or sensor evidence. Notably, no tail number was recorded for the aircraft, which is unusual for FAA incident documentation.

The report is brief and administrative in nature. It records what the crew said they saw and the basic flight details, but offers no analysis of what the lights might have been. The FAA classified the event under its primary code for Unidentified Aerial Phenomenon.</div>
