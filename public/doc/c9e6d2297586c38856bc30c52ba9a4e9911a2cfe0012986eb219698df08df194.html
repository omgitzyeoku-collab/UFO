  <h1>Pentagon Analysis Finds &#39;Go Fast&#39; UFO Video Was an Optical Illusion</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/c9e6d2297586c38856bc30c52ba9a4e9911a2cfe0012986eb219698df08df194.jpg" alt="Pentagon Analysis Finds &#39;Go Fast&#39; UFO Video Was an Optical Illusion thumbnail" loading="lazy" />
  <p>This is AARO&#39;s official case resolution for the well-known &#39;Go Fast&#39; Navy infrared video from January 2015. The analysis concludes with high confidence that the object&#39;s apparent high speed was an optical illusion caused by motion parallax, and that its actual speed — after accounting for wind — was between 5 and 92 mph, consistent with a small wind-borne object.</p>
  <div class="narr">In January 2015, a U.S. Navy F/A-18F Super Hornet pilot flying at roughly 25,000 feet over the Atlantic Ocean off Florida&#39;s eastern coast recorded an object using the aircraft&#39;s forward-looking infrared (FLIR) sensor. The object appeared to streak across the ocean surface at extraordinary speed. The Department of Defense officially released the video in 2020, and it became one of the most widely discussed pieces of UAP footage in the public domain.

The All-domain Anomaly Resolution Office (AARO) published this case resolution on 6 February 2025. Their central finding: the object was not skimming the ocean surface at all — it was at approximately 13,000 feet altitude. The impression of extreme speed was caused by motion parallax, an optical effect created by the fast-moving aircraft filming a much slower object far below it. AARO assessed the object&#39;s raw speed at 72–161 mph, but after compensating for a 69 mph wind blowing from the west at that altitude, the object&#39;s intrinsic speed dropped to between 5 and 92 mph. The object never moved against the wind in any of AARO&#39;s simulation scenarios, and its heading deviated no more than 32 degrees from the wind direction.

AARO assessed the object as spherical or oblate ellipsoid in shape and roughly one metre or smaller — comparable to a small drone or bird. That size estimate came from pixel analysis performed by an unnamed Intelligence Community partner. Despite this detailed analysis, AARO states it cannot definitively identify what the object was. It concluded only that the object displayed no anomalous or exceptional performance characteristics.

Several limitations constrain the analysis. The original sensor recording and its metadata are no longer available; AARO worked from a compressed .wmv video file. The aircraft&#39;s exact geographic position and compass heading during the recording are unknown, so AARO calculated a range of possible speeds and headings rather than a single definitive answer. Wind data came from historical records sourced within 15–20 minutes of the reported event time, not from direct measurements at the scene.</div>
