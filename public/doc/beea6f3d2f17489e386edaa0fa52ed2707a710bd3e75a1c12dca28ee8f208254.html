  <h1>Commercial Airline Crew Reports Three Unexplained Lights Over Iowa</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/beea6f3d2f17489e386edaa0fa52ed2707a710bd3e75a1c12dca28ee8f208254.jpg" alt="Commercial Airline Crew Reports Three Unexplained Lights Over Iowa thumbnail" loading="lazy" />
  <p>An FAA preliminary report documents a UAP sighting by the crew of a Virgin Atlantic Boeing 787 flying from Las Vegas to London on 10 March 2023. The crew observed three lights of varying brightness near Fort Dodge, Iowa, at 37,000 feet, and multiple other aircraft reported similar sightings in the area.</p>
  <div class="narr">This is a preliminary information report from the FAA&#39;s Washington Operations Center — essentially a first-pass incident log, not a full investigation. It records a sighting reported by the crew of Virgin Atlantic flight 156, a Boeing 787-9 travelling from Las Vegas to London Heathrow on 10 March 2023.

At around 03:00 Central Standard Time, while flying east-northeast at flight level 370 (37,000 feet) near Fort Dodge, Iowa, the crew reported seeing three lights at their 11 o&#39;clock position. The lights had varying brightness and intensity. Minneapolis Air Route Traffic Control Center (ARTCC) was advised of the sighting.

The crew took no evasive action, and no law enforcement was notified. Notably, the report states that multiple other aircraft reported similar sightings in the same area, though the identities and details of those aircraft are not included in the document.

The FAA report does not offer any conclusion about what the lights were. It contains no radar data, sensor readings, or photographic evidence — it is based entirely on pilot testimony relayed through air traffic control. No follow-up investigation is referenced in the document.</div>
