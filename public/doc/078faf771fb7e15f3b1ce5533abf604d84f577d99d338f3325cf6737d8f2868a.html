  <h1>Southwest Airlines crew reported unidentified object ahead at 34,000 feet over Idaho</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/078faf771fb7e15f3b1ce5533abf604d84f577d99d338f3325cf6737d8f2868a.jpg" alt="Southwest Airlines crew reported unidentified object ahead at 34,000 feet over Idaho thumbnail" loading="lazy" />
  <p>An FAA preliminary incident report documents the crew of Southwest Airlines Flight 111, a Boeing 737 MAX 8 flying from Denver to Portland, reporting an unidentified aerial phenomenon directly ahead of their aircraft at 34,000 feet over southern Idaho on the night of 22 December 2023. No evasive action was taken and no law enforcement was notified.</p>
  <div class="narr">This document is a preliminary incident report from the FAA&#39;s Washington Operations Center (reference WOC 73333). It records a pilot-reported sighting of an unidentified aerial phenomenon — the FAA&#39;s formal term for something in the sky that the crew could not identify.

On the evening of 22 December 2023, at 9:15 PM Mountain Standard Time, the crew of Southwest Airlines Flight 111 reported an object at their 12 o&#39;clock position — meaning directly ahead of the aircraft. The Boeing 737 MAX 8 was flying northeast-bound at flight level 340 (approximately 34,000 feet) on a scheduled route from Denver to Portland. The sighting occurred roughly 41 nautical miles south-southwest of Pocatello, Idaho, at coordinates 42.35°N, 112.87°W. Salt Lake City Air Route Traffic Control Center was advised.

The report states that no evasive action was taken by the flight crew and no law enforcement was notified. The document does not describe the object&#39;s appearance, size, behaviour, or how long the crew observed it.

This is a preliminary report only. It records that something was reported, not what it was. No investigation conclusions, radar data, or corroborating witness accounts are included in the document.</div>
