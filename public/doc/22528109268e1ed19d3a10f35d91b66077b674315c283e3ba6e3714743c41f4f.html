  <h1>FBI Interview Records Unresolved UAP Sighting Near Cheyenne Mountain in 2022</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">February, 2022</span>
    <span class="badge">Colorado Springs, Colorado, U.S.</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/22528109268e1ed19d3a10f35d91b66077b674315c283e3ba6e3714743c41f4f.jpg" alt="FBI Interview Records Unresolved UAP Sighting Near Cheyenne Mountain in 2022 thumbnail" loading="lazy" />
  <p>This FBI FD-302 interview record documents a March 2025 interview with a military witness who, along with four fellow service members, observed an unidentified object hovering motionless over Cheyenne Mountain near Fort Carson, Colorado, on a clear afternoon in early February 2022. The sighting remains unresolved, no photographic evidence exists, and the document is heavily redacted.</p>
  <div class="narr">This document is an FBI FD-302 — a standard interview summary form — recording a conversation conducted via Microsoft Teams in March 2025. The FBI interviewed a military service member about something that happened three years earlier: a daytime UAP sighting near Fort Carson, Colorado, close to Cheyenne Mountain.

According to the witness, on a workday in early February 2022, at roughly 1:00 or 2:00 PM under clear blue skies, five members of the same military unit observed an unusual object hovering over a saddle point on Cheyenne Mountain. The witness described it as bean-shaped, matte white or off-white, non-metallic in appearance, and covered in intersecting lines or ridges forming an abstract polygon pattern across its entire surface. The object was completely motionless and silent. The group watched it for approximately three to five minutes, and it did not drift or change position relative to the mountain — the witness said this ruled out wind as an explanation.

When all five looked away briefly to decide who should retrieve a phone from their vehicle, the object vanished. None of them had a phone on them at the time, so no photographs or video were captured. Afterwards, each witness independently drew what they remembered, and the drawings were consistent with one another — all showing a horizontal, white, bean-shaped object with abstract crossing lines. The witness believed an official report was made to the Army. The Pentagon&#39;s All-domain Anomaly Resolution Office (AARO) contacted the witness in early 2024 but never conducted a formal interview.

The document is heavily redacted: all names, ranks, and unit identifiers have been removed. The FBI drew no stated conclusion about what the object was. The sighting remains officially unresolved.</div>
