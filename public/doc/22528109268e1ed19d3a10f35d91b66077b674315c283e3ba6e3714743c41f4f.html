  <h1>FBI-UAP-D001, FD-302, Unresolved UAP Report, Colorado Springs, 2022</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">February, 2022</span>
    <span class="badge">Colorado Springs, Colorado, U.S.</span>
    
  </div>
  
  <p>This document is a Federal Bureau of Investigation (FBI) FD-302, a form the FBI uses to record interviews. This FD-302 contains a summary of an interview with a U.S. military service member in March 2025 regarding a February 2022 incident potentially involving unidentified anomalous phenomena (UAP). The individual described the phenomenon as being “bean shaped,” “matte white” or “off-white” in color, with a surface covered in “intersecting lines or ridges which formed an abstract polygon pattern.” The individual described the phenomenon as “motionless” and that “no sound could be heard coming from it.” FBI Note: AARO has since been in contact with the interviewee to conduct subsequent interviews to inform its analysis of this incident.</p>
