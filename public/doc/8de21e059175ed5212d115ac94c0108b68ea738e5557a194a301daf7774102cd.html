  <h1>Airline Crew Reports Red and White Lights Over Atlantic Near New York</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/8de21e059175ed5212d115ac94c0108b68ea738e5557a194a301daf7774102cd.jpg" alt="Airline Crew Reports Red and White Lights Over Atlantic Near New York thumbnail" loading="lazy" />
  <p>An FAA incident notification records that the crew of a Canadian Sunwing Airlines Boeing 737 reported seeing red and white lights orbiting at roughly 37,000 feet over the Atlantic southeast of East Hampton, New York on 10 April 2023. The document is a preliminary notification only — no investigation findings or explanation are included.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — essentially a short internal alert that something unusual was reported. It is not an investigation report, and it contains no conclusions about what the lights were.

On 10 April 2023, at approximately 2:25 a.m. Eastern time, the crew of Sunwing Airlines flight 383 — a Boeing 737-800 flying from Holguin, Cuba to Halifax, Canada — reported observing red and white lights orbiting at flight level 370, or roughly 37,000 feet. Their own aircraft was cruising at flight level 350 (about 35,000 feet), meaning the lights appeared roughly 2,000 feet above them. The sighting occurred 46 nautical miles southeast of the Hampton VORTAC navigational aid, placing it over the Atlantic near East Hampton, New York.

New York ARTCC (Air Route Traffic Control Center), the air traffic control facility handling that airspace, relayed the report to the FAA. The coordinates recorded in the document — approximately 40.58°N, 71.47°W — are consistent with that location over the Atlantic south of Long Island.

The record ends there. No radar data, photographs, or corroborating sensor information appears in the document. No follow-up investigation or resolution is documented. The observation rests entirely on the flight crew&#39;s visual report.</div>
