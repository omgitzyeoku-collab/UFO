  <h1>Pilots Reported Mystery Lights Over Iowa; FAA Identified Starlink Satellites</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f6613d14176c52ac6a4d9cbb36fc8290943884063815a0787e9d78f6fd5eade9.jpg" alt="Pilots Reported Mystery Lights Over Iowa; FAA Identified Starlink Satellites thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting on 7 February 2023 in which multiple commercial aircraft crews reported bright flashing lights above 60,000 feet, roughly 50 nautical miles north of Des Moines, Iowa. The case was closed after FAA and NORAD confirmed the lights were a Starlink satellite train of approximately 20 satellites.</p>
  <div class="narr">On 7 February 2023, crews aboard several commercial aircraft — including United Airlines flight UAL1164 — reported seeing bright flashing lights roughly 50 nautical miles north of Des Moines, Iowa. The lights were moving east-southeast at altitudes the pilots described as &quot;well above them,&quot; estimated at more than 60,000 feet. The crews said the lights resembled aircraft landing lights, which is what made them notable enough to report.

Air traffic control instructed the pilots to file UAP (Unidentified Aerial Phenomenon) mandatory occurrence reports. The sighting was logged under FAA SKYWATCH, the agency&#39;s system for tracking such incidents, with the identifier 237UAP00203.

The case did not stay unidentified for long. FAA&#39;s Air Traffic Security Coordinator (ATSC) and Operations Management Integration Center (OMIC) correlated the reports to a Starlink satellite train — a formation of roughly 20 SpaceX satellites arranged in 3–4 groups of 4 units. NORAD (the North American Aerospace Defense Command) reviewed the finding and concurred. The case was closed.

The document itself is a single-page administrative summary, not a detailed investigation file. No pilot names or specific aircraft registration numbers appear in the report. There is minimal evidence of redaction.</div>
