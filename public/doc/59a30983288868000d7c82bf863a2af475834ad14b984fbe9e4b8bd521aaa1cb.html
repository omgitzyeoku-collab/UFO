  <h1>1948 U.S. intelligence study weighs the origin of reported flying objects</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">4/28/49</span>
    <span class="badge">Virginia</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/59a30983288868000d7c82bf863a2af475834ad14b984fbe9e4b8bd521aaa1cb.jpg" alt="1948 U.S. intelligence study weighs the origin of reported flying objects thumbnail" loading="lazy" />
  <p>This is a 1948 U.S. Air Force Air Intelligence Division study (Air Intelligence Division Study No. 203, dated 10 December 1948) reviewing about 210 reported &#39;flying saucer&#39; or unidentified flying object sightings across the United States. It concludes that some kind of object has genuinely been seen, but that its identity and origin cannot be determined from the available reports. It offers two possible explanations — that the objects are domestic devices, or that they are foreign, most logically Soviet — and urges that they be treated as a potential threat if no domestic explanation can be established.</p>
  <div class="narr">This document is a classified analytical study produced in 1948 by the Air Intelligence Division of the U.S. Air Force, issued through the Directorate of Intelligence at Headquarters United States Air Force together with the Office of Naval Intelligence at the Navy Department. It is catalogued as Air Intelligence Report No. 100-203-79 / Air Intelligence Division Study No. 203 and is dated 10 December 1948. It reviews roughly 210 reported incidents of unidentified flying objects across the United States and sorts the reported objects into three shapes: disk-shaped, rough cigar-shaped, and balls of fire.

The study&#39;s central finding is cautious: it states that some object has been seen, but that its identification cannot be readily accomplished from the reports available. Sightings were most concentrated in the states along the Atlantic and Pacific coasts and in the central states of Ohio and Kentucky. Some accounts came from trained observers — for example, U.S. Weather Bureau staff at Richmond, Virginia, reported seeing strange metallic disks through a theodolite (a surveying instrument) on four occasions during weather-balloon observations in April 1947.

Rather than confirm any single explanation, the report lays out two possibilities it calls reasonable. One is that the objects are domestic devices such as weather balloons, rockets, or experimental flying-wing aircraft. The other is that they are foreign, in which case it argues the most logical source would be the Soviet Union, potentially exploiting captured German flying-wing designs. The report notes it had been claimed that the U.S.S.R. was planning to build a fleet of 1,800 Horten flying-wing aircraft, and that since 1945 the Soviets had enlisted a German scientist, Dr. Guenther Bock, who had led flying-wing development in Germany. The study recommends that if no domestic explanation can be firmly established, the objects should be treated as a threat warranting active identification and interception.

The report is also frank about the limits of its own data. It records that 18 of the roughly 210 incidents — about nine per cent — were positively identified: three were hoaxes, two came from unreliable witnesses, and the remaining thirteen turned out to be celestial bodies, meteorological or carnival balloons, or airborne cosmic-ray experimental equipment. One specific case, an object seen on 19 August 1948 at Godman Air Force Base, Kentucky, was determined to be the planet Venus by the head astronomer at the University of Louisville. The document also records that on 7 January 1948 a National Guard pilot was killed while trying to chase an unidentified object up to 30,000 feet.

The copy in this archive has since been declassified (original declassification authority NND 857011, from originally Top Secret handling) and shows little sign of redaction. Because it is a scan of a 1948 typed original, its optical character recognition is imperfect: some names, figures and place names are garbled (for example &#39;Rollman&#39; for Holloman and &#39;Gedman&#39; for Godman) and should be checked against the original PDF.</div>
