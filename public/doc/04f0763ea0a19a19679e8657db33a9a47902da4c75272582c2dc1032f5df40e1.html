  <p>The United States Northern Command submitted a report of an unidentified anomalous phenomenon to the All-domain Anomaly Resolution Office (AARO) consisting of 39 seconds of video footage from an infrared sensor aboard a U.S. military platform in 2016.

Video Description: 
00:01-00:11: The sensor zooms in and out to track on an area of contrast, panning to keep it generally within the center of the frame.
00:12-00:29: The sensor switches modes. A white reticle surrounds the area of contrast.
00:30-00:36: The sensor stops tracking the object, causing it to exit the right side of the frame.
00:37-00:38: An area of contrast enters the sensor field-of-view from the right side of the frame.

This video description is provided for informational purposes only. Readers should not interpret any part of this description as reflecting an analytical judgment, investigative conclusion, or factual determination regarding the described event’s validity, nature, or significance.</p>
