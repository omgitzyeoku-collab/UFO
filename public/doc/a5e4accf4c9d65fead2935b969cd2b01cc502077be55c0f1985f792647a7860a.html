  <h1>Pilot Reports Bright Moving Light Near Ely, Nevada in 2007</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/a5e4accf4c9d65fead2935b969cd2b01cc502077be55c0f1985f792647a7860a.jpg" alt="Pilot Reports Bright Moving Light Near Ely, Nevada in 2007 thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents a pilot flying a Beech King Air 350 who reported seeing a bright light that moved rapidly, stopped, then moved rapidly again, roughly 30 miles southeast of Ely, Nevada on 11 December 2007. A second pilot on an American Airlines flight in the same area saw a similar light but judged it to be a planet low on the horizon. The case was closed with no further resolution.</p>
  <div class="narr">This is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unusual aerial sightings reported by pilots. It was filed through the Salt Lake City Air Route Traffic Control Centre (ARTCC facility code ZLC) and classified under the primary code OTHER.

On 11 December 2007, the pilot of aircraft N933CL, a Beech Super King Air 350, reported sighting an unidentified object approximately 30 nautical miles southeast of Ely, Nevada. The pilot described it as a bright light that moved rapidly, became stationary, and then moved rapidly again.

A corroborating report came from American Airlines flight 197, a Boeing 757-200 flying from Boston to San Francisco, which was about 60 miles southwest of Ely at the time. That crew also observed a bright light in a similar position. However, the American Airlines crew assessed the light as probably a planet sitting low on the horizon. The corroborating report was logged at 0533Z (UTC), placing the sighting in pre-dawn hours — a timeframe consistent with bright planets being visible near the horizon.

The case status is marked Closed. The report contains no radar data, no sensor confirmation, and no resolution narrative beyond the two pilot accounts. There is no indication of significant redaction in this document.</div>
