  <h1>American Airlines Pilot Reported Unexplained Lights Over Kansas at 39,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/cdaea7c52f827dd02a82e8a6754313afcab12fb55d5f0dc58fc85f6a81dc0580.jpg" alt="American Airlines Pilot Reported Unexplained Lights Over Kansas at 39,000 Feet thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a pilot aboard American Airlines flight AAL2654, a Boeing 737-800, reporting red, green, and white lights fading in and out high above the aircraft while flying at 39,000 feet near Kansas City on 17 December 2022. The FAA noted the lights were possibly satellites and closed the case without further analysis.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form used by the Federal Aviation Administration to log pilot-reported unidentified aerial phenomena (UAPs). It was filed under case number 237UAP00137 and assigned MOR ID ZKC-M-2022/12/17-0001 by the Kansas City Air Route Traffic Control Center (ZKC).

On 17 December 2022, the crew of American Airlines flight AAL2654, a commercial Boeing 737-800 flying from Las Vegas to Chicago O&#39;Hare, reported seeing something unusual while eastbound at flight level 390 (39,000 feet). The aircraft was approximately 38 nautical miles northwest of Kansas City (MCI) at the time.

The pilot described red, green, and white lights fading in and out, positioned high above the aircraft. The report itself notes a possible prosaic explanation: satellites. No corroborating radar data or sensor evidence is mentioned in the document.

The case is marked as closed. No resolution, follow-up investigation, or additional analysis is documented. No tail number for the aircraft was recorded in the report.</div>
