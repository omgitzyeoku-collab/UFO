  <h1>Lab Tests Find Alleged Alien Crash Metal Is Ordinary Terrestrial Alloy</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b51a197ba6259ad28412a337fab7e14d761a6e14ffc7951f8ce5de5d567af1b1.jpg" alt="Lab Tests Find Alleged Alien Crash Metal Is Ordinary Terrestrial Alloy thumbnail" loading="lazy" />
  <p>AARO and Oak Ridge National Laboratory tested a magnesium alloy specimen publicly claimed to be debris from a 1947 extraterrestrial vehicle crash. Their analysis found the material&#39;s isotopic composition is consistent with terrestrial origin, it cannot function as the terahertz waveguide claimed by proponents, and its properties match mid-20th century magnesium alloy manufacturing.</p>
  <div class="narr">The All-domain Anomaly Resolution Office (AARO) published this supplement in July 2024 to accompany Oak Ridge National Laboratory&#39;s (ORNL) analysis of a metallic specimen. The specimen — a magnesium alloy — had been publicly alleged to be a component recovered from a crashed extraterrestrial vehicle in 1947, and proponents claimed it could function as a terahertz waveguide capable of generating antigravity effects.

AARO contracted ORNL to conduct materials testing on the specimen. ORNL&#39;s findings were straightforward: the magnesium and lead isotopic ratios in the specimen fall within standard terrestrial values. The bismuth in the specimen, which would theoretically need to exist as a pure crystalline layer for any waveguide function, was found to be intermixed with lead — meaning it never existed as the pure layer required for the claimed properties. The specimen&#39;s zinc concentration of 1–4% by weight and its columnar magnesium grain structure are consistent with known alloy compositions and manufacturing techniques from that era.

AARO&#39;s historical research found that domestic magnesium alloy research began around 1915 and peaked during World War II. The specimen&#39;s characteristics — including features consistent with vapor deposition in a vacuum chamber — match what would be expected from a test object, manufacturing byproduct, or aerospace performance study material from mid-20th century research programs. The Falcon GAR-1 air-to-air missile was cited as one example of magnesium alloy use in aerospace applications of that period.

The specimen shows signs of degradation over time, including delamination and oxidation, and AARO concluded it probably does not represent its original configuration, condition, or application. The specimen&#39;s chain of custody is undocumented, with unverifiable and conflicting personal accounts complicating any attempt to trace its actual history. Neither AARO nor ORNL could attribute it to a specific research project, in part because failed experiments from that era were rarely documented in detail.</div>
