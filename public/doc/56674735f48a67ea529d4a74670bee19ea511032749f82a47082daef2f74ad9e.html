  <h1>Pentagon Cleared Its UAP Insider Reporting Guide for Public Release in 2023</h1>
  <div class="meta">
    <span class="badge">AARO</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/56674735f48a67ea529d4a74670bee19ea511032749f82a47082daef2f74ad9e.jpg" alt="Pentagon Cleared Its UAP Insider Reporting Guide for Public Release in 2023 thumbnail" loading="lazy" />
  <p>This document package shows the Pentagon&#39;s All-domain Anomaly Resolution Office (AARO) submitted its 20-page guide for reporting UAP knowledge to a security review in December 2023 and received clearance for public release three days later. The guide explains how current or former government employees, military members, and contractors can report firsthand knowledge of U.S. Government UAP-related programs dating back to 1945, with legal protections against retaliation.</p>
  <div class="narr">In December 2023, the All-domain Anomaly Resolution Office — the Pentagon body responsible for investigating Unidentified Anomalous Phenomena — sent a 20-page user guide through a routine security review process before posting it on its public website, aaro.mil. The guide was submitted on December 8, 2023, and cleared for open publication on December 11, 2023, four days ahead of the requested deadline. Both internal reviewers and the Secretary of Defense&#39;s office returned no objections to its release. At the time, AARO was led by Acting Director Timothy A. Phillips, and the guide itself was written by a contractor holding the title of Senior Engineer.

The user guide describes a self-reporting mechanism aimed at a specific audience: current or former U.S. Government employees, service members, or contractor personnel who have direct, firsthand knowledge of government programs or activities related to UAP going as far back as 1945. It is not a tool for the general public to report sightings. The guide defines UAP broadly, covering airborne objects not immediately identifiable, transmedium objects or devices, and submerged objects or devices, drawing its definition from the National Defense Authorization Act for Fiscal Year 2023.

Notably, the guide states that individuals may report to AARO without violating the terms of any nondisclosure agreements, and that reporters are explicitly protected from reprisal under law. AARO is authorized to receive all UAP-related information regardless of classification level or access controls. However, the online form itself explicitly prohibits submission of classified national security information. Civilian pilots are separately instructed to report sightings to air traffic control, with AARO receiving all UAP-related pilot reports from the Federal Aviation Administration.

The document also warns that knowingly making false reports can result in fines, imprisonment, or both under federal law. Anyone who believes they have faced reprisal for reporting is directed to file a complaint with the relevant Inspector General&#39;s office. Most staff names in the security review paperwork are redacted under a privacy exemption, with Timothy A. Phillips being the only named individual.</div>
