  <h1>Frontier Airlines Pilot Reports Unexplained Flashes Over Kansas at 36,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>

    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/d5e6da51e1b5f74bdf808399b1ce7590cdbf33ef7becf0d89ffa39ffd32515ce.jpg" alt="Frontier Airlines Pilot Reports Unexplained Flashes Over Kansas at 36,000 Feet thumbnail" loading="lazy" />
  <p>An FAA incident report documents a Frontier Airlines pilot observing unexplained flashes off the right side of the aircraft while flying at 36,000 feet near Kansas City on 2 March 2023. The pilot suggested the flashes might be space debris; the FAA closed the case with no further investigation noted.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the agency uses to log pilot-reported unidentified aerial phenomena. It covers an event on 2 March 2023 at 02:10 UTC involving Frontier Airlines flight FFT647, an Airbus A320neo flying from Cincinnati (CVG) to Denver (DEN).

While heading westbound at flight level 360 (36,000 feet), approximately 73 nautical miles north-northeast of Kansas City, the pilot reported seeing flashes off the right side of the aircraft. The pilot&#39;s own assessment was that the flashes might be space junk to the north of their position. The report was filed through FAA facility ZKC (Kansas City Center) under mandatory occurrence report ID ZKC-M-2023/03/01-0009.

The case status is listed as closed. No law enforcement information was provided in the report, and no follow-up investigation or additional corroboration is mentioned. No tail number for the aircraft was recorded.

The document contains minimal redaction. What it lacks is not blacked-out information but rather any corroborating evidence — there are no radar returns, no sensor data, and no mention of additional witnesses. The entire report rests on a single pilot observation.</div>
