  <h1>United Airlines Pilot Reported Silver Object Near Washington Dulles in 2012</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/53b001d0a96a9a89a70f969cf6d5b8f029be7ec9c51d50f16e02ba738156dc2f.jpg" alt="United Airlines Pilot Reported Silver Object Near Washington Dulles in 2012 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a United Airlines Boeing 777 pilot who spotted a circular, silver unidentified flying object at roughly 12,500 feet while approaching Washington Dulles from Dubai in August 2012. A JetBlue flight 25 miles behind on the same route saw nothing, radar systems found no matching targets, and the FAA closed the case with no further action.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — the standard form the agency uses to log pilot sightings of unidentified flying objects. It was filed by Potomac TRACON (PCT), the radar facility that manages air traffic in the Washington, D.C. region, and later surfaced as part of the Department of War&#39;s 2023 PURSUE public release of UAP-related records.

On 19 August 2012, the pilot-in-command of United Airlines flight 976, a Boeing 777-200 flying from Dubai to Washington Dulles, reported seeing a circular, silver object at approximately 12,500 feet, about 5 nautical miles southeast of GAI. The sighting was reported through the procedure laid out in FAA Order JO 7110.65U, which governs how air traffic controllers handle UFO reports.

The FAA attempted to corroborate the sighting in two ways. First, JetBlue flight 1260, which was on the same route 25 miles behind the United flight, was asked whether its crew saw anything — they did not. Second, two radar systems, ADAPT and EADS, were checked. Neither detected any targets matching the reported object. EADS also conducted a playback of its radar tapes covering the time window and found nothing.

With no corroboration from a second aircraft and no radar evidence, the FAA closed the report with no further action taken. The document shows minimal redaction.</div>
