  <h1>American Airlines Crew Reported Colored Lights Over Kansas at 37,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/942229a07fc1d281f8c54ac8e715bb1cf42bd0ab64337709334791df77f7daf0.jpg" alt="American Airlines Crew Reported Colored Lights Over Kansas at 37,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of American Airlines flight AAL661 on 17 December 2022, who observed red, green, and white lights fading in and out at high altitude while flying east of Kansas City at 37,000 feet. The report itself notes the lights were possibly satellites, and the case is closed.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — the system the Federal Aviation Administration uses to log pilot reports of unidentified aerial phenomena. It covers a sighting reported by the crew of American Airlines flight AAL661, an Airbus A321 flying from Las Vegas to Philadelphia on 17 December 2022.

At 09:55 UTC, while eastbound at flight level 370 (37,000 feet) and approximately 95 nautical miles east of Kansas City, the crew reported seeing an unidentified aerial phenomenon. They described it as red, green, and white lights fading in and out at high altitude above them.

The report itself offers a possible explanation: satellites. No corroborating sensor data or additional witness accounts are documented in the record. The case has been closed by the FAA under reference number ZKC-M-2022/12/17-0001.

No tail number for the aircraft was recorded in the report, and no named individuals appear in the document. The incident location is not redacted but is described only by its position relative to Kansas City.</div>
