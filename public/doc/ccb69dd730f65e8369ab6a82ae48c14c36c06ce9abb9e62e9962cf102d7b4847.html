  <h1>FBI Quit UFO Investigations After Army Called Their Work Chasing Toilet Seats</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    
  </div>
  <img class="thumb" src="/extract/thumbs/ccb69dd730f65e8369ab6a82ae48c14c36c06ce9abb9e62e9962cf102d7b4847.jpg" alt="FBI Quit UFO Investigations After Army Called Their Work Chasing Toilet Seats thumbnail" loading="lazy" />
  <p>This 1947 FBI file documents flying disc sighting reports from across the United States, the FBI&#39;s short-lived investigation of them, and the bureaucratic falling-out that ended it. Director J. Edgar Hoover pulled the Bureau out after learning the Army Air Forces described the FBI&#39;s role as chasing &#39;ash can covers, toilet seats and whatnot.&#39; Physical specimens submitted as alleged flying saucer debris were analysed at Wright Field and declared a hoax.</p>
  <div class="narr">This file is a collection of internal FBI memoranda, field office reports, and letters from mid-1947 — the summer when flying disc sightings swept the United States. The FBI had been drawn into the investigation after the Army Air Forces suggested that communist sympathizers might be behind the sightings, potentially trying to trigger mass hysteria. Under Bureau Bulletin No. 42, dated July 30, 1947, FBI field offices were instructed to investigate each reported sighting.

The reports span the country. A witness near Ellensburg, Washington reported a silver object that nose-dived and disintegrated on May 5, 1947, leaving a pillar of gas in the sky. Near Canyon Ferry, Montana, three witnesses described a bright polished disc hovering and fluttering before swooping northeast at tremendous speed and vanishing within 200 feet. In Logan, Utah, observers reported multiple groups of 35 to 60 yellowish-white objects circling the city at high speed. A sighting over Philadelphia described a bluish-white flame-emitting object travelling at an estimated 400 to 500 miles per hour. Not all sightings held up: a black triangular object seen floating over Boeing Field in Seattle was identified by the control tower operator as a large piece of burnt paper blown across the runway, and a white cylindrical object at the same location was attributed to a weather balloon by a Weather Bureau official.

Physical evidence fared no better. Specimens submitted as parts of a flying saucer were sent to Wright Field for laboratory analysis. The conclusion was blunt: the materials were plaster of paris, old radio parts, bakelite coils, and an outdated magnetic speaker diaphragm first patented in 1910 by the Nathaniel Baldwin Company. Wright Field called it a hoax that &#39;could be perpetrated by most anyone seeking publicity.&#39; The specimens were also confirmed to have no connection to Project Mogul or any other military research programme. A separate alleged instrument found in Danville, Illinois was likewise classified as a hoax.

The file&#39;s most notable thread is the institutional clash between the FBI and the Army Air Forces. A letter from Air Defense Command, signed by order of Lieutenant General Stratemeyer, described the FBI&#39;s role as relieving the Air Forces of &#39;the task of tracking down all the many instances which turned out to be ash can covers, toilet seats and whatnot.&#39; The FBI&#39;s San Francisco office flagged the letter&#39;s language as insulting. Hoover agreed. He wrote formally to Major General George C. McDonald: &#39;I cannot permit the personnel and time of this organization to be dissipated in this manner.&#39; By late September 1947, the Bureau had discontinued all flying disc investigations. Its own review found no evidence of subversive individuals behind any of the reported sightings.

Several witness names throughout the file are redacted under privacy exemptions. Two named individuals, Keith Hughes and Joan Crookston, denied ever seeing flying discs despite being quoted in the Salt Lake Tribune — a reminder that newspaper accounts from the period were not always reliable.</div>
