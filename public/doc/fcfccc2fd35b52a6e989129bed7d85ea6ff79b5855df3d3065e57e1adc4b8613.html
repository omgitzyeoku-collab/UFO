  <h1>Pilot Reports Erratic White Lights at 39,000 Feet Over South Carolina</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/fcfccc2fd35b52a6e989129bed7d85ea6ff79b5855df3d3065e57e1adc4b8613.jpg" alt="Pilot Reports Erratic White Lights at 39,000 Feet Over South Carolina thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a general aviation pilot&#39;s sighting of an unorganised group of white lights moving erratically at 39,000–41,000 feet near Florence, South Carolina, on 28 August 2023. The case was closed with no explanation provided.</p>
  <div class="narr">On 28 August 2023 at 04:01 UTC, a general aviation aircraft with callsign N224LD was flying northbound from Opa-locka (OPF) to Teterboro (TEB) at flight level 390 — roughly 39,000 feet. Approximately 40 nautical miles east-northeast of Florence, South Carolina, the pilot observed something unusual off the left side of the aircraft.

The pilot described an unorganised group of white lights moving erratically at approximately FL390 to FL410 (39,000–41,000 feet). The sighting was reported through Jacksonville Air Route Traffic Control Center (ZJX) and logged under FAA case number 237UAP00294 via the agency&#39;s SKYWATCH reporting system, with the Denver (DEN) office listed as the point of distribution.

The case is marked as closed. No resolution, identification, or explanation for the lights is provided in the document. There is no mention of corroborating radar data, additional witnesses, or follow-up investigation.</div>
