  <h1>Gulfstream Pilot Reports Unidentified Object Below at 43,000 Feet Over Nebraska</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/29af670ce479a6f3da42667673add78335b3e2cd7cf136e64c6f8bb3d9da5b88.jpg" alt="Gulfstream Pilot Reports Unidentified Object Below at 43,000 Feet Over Nebraska thumbnail" loading="lazy" />
  <p>An FAA incident report documents a Gulfstream GLF4 pilot spotting an unidentified aerial phenomenon below their aircraft at roughly 43,000 feet over western Nebraska on 2 December 2023. The pilot took no evasive action, and the report contains no description of the object&#39;s appearance or behaviour.</p>
  <div class="narr">On the evening of 2 December 2023, at 21:15 Central Standard Time, the pilot of a Gulfstream GLF4 business jet (registration N461GT) reported seeing an unidentified aerial phenomenon while flying westbound at flight level 430 — approximately 43,000 feet. The object was below the aircraft, at the 1 o&#39;clock position. The sighting occurred roughly 57 nautical miles west-northwest of O&#39;Neill, Nebraska.

The report was relayed by Denver ARTCC (Air Route Traffic Control Center) to the FAA&#39;s Washington Operations Center. No evasive action was taken by the pilot, and no law enforcement notification was reported.

The document itself is brief. It records the time, location, aircraft details, and relative position of the phenomenon, but includes no description of the object&#39;s shape, size, colour, or behaviour. There is no mention of radar data, photographs, or corroborating witnesses.

The FAA report does not offer any conclusion about what the pilot saw. It is a procedural incident log — a record that a sighting was reported through official channels, not an investigation or analysis of the sighting itself.</div>
