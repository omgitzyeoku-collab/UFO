  <h1>UPS Cargo Pilot Reported Bright Lights Above 37,000 Feet Over Pennsylvania</h1>
  <div class="meta">
    <span class="badge">FAA</span>

    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/4e5c7fedf483d9f9513f272a69f3d2d224ed2ad8a6724df97f0b7c3ed1ee0f62.jpg" alt="UPS Cargo Pilot Reported Bright Lights Above 37,000 Feet Over Pennsylvania thumbnail" loading="lazy" />
  <p>This FAA incident report documents a UPS cargo flight crew observing bright lights well above their cruising altitude of 37,000 feet over north-central Pennsylvania on 10 February 2023. The case was closed with no explanation or resolution provided.</p>
  <div class="narr">On 10 February 2023, the crew of UPS flight 1052 — a commercial Boeing 757-200 — reported an unidentified aerial phenomenon to the FAA while flying northeast-bound at flight level 370 (approximately 37,000 feet). The crew described bright lights well above their aircraft, off the 12 o&#39;clock position, meaning directly ahead.

The observation was logged at coordinates 41.27°N / 76.25°W, which places it over north-central Pennsylvania. The FAA classified the report under its SKYWATCH system with a primary code of &quot;Unidentified Aerial Phenomenon.&quot; An internal party identified only as &quot;TY&quot; was notified.

The case is marked as closed. No resolution or explanation for the lights is recorded in the document. There is no mention of corroborating radar data, sensor evidence, or follow-up investigation.

The report is sparse. No tail number was recorded for the aircraft, and the coordinates do not fall on the direct route between the departure and arrival airports listed elsewhere in the filing, which may reflect a different flight segment or a data entry issue.</div>
