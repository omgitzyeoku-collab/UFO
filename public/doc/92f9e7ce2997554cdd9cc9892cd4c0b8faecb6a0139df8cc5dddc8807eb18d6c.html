  <h1>Avianca Crew Reported Four Green-Lit Objects Over Atlantic in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/92f9e7ce2997554cdd9cc9892cd4c0b8faecb6a0139df8cc5dddc8807eb18d6c.jpg" alt="Avianca Crew Reported Four Green-Lit Objects Over Atlantic in 2023 thumbnail" loading="lazy" />
  <p>An FAA incident report records that the crew of Avianca flight 062, an Airbus A320 flying from Cali, Colombia to JFK, observed four green-lit unidentified aerial phenomena at 37,000 feet over the open Atlantic east of the Bahamas in July 2023. Multiple other aircraft in the area reportedly saw similar phenomena, and no evasive action was taken.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed under record number 237UAP00528. It describes a sighting reported by the crew of Avianca flight 062, a Colombia-registered Airbus A320 operating from Cali, Colombia to New York&#39;s JFK airport.

On or around 21 July 2023, while flying northbound at 37,000 feet approximately 130 nautical miles north-northeast of Freeport, Bahamas — over open ocean east of Florida — the crew reported four unidentified aerial phenomena. The objects emitted green light and were observed climbing and descending rapidly before disappearing. The coordinates in the report (28.275°N, 77.827°W) place the sighting over the Atlantic.

Miami Air Route Traffic Control Center (ARTCC) was advised of the sighting. The report notes that multiple other aircraft in the same area reported similar phenomena, though none of those aircraft are identified and their reports are not included. The crew of Avianca 062 took no evasive action.

The FAA report does not offer any explanation or identification of the objects. There is no radar data, photographs, or other sensor evidence included — the record is a single operational log entry based on the crew&#39;s verbal report. The report contains two dates one day apart (21 and 22 July 2023), likely reflecting the difference between UTC and local time.</div>
