  <h1>Airline Crew Reports Jet Pack Figure Near Dallas-Fort Worth Airport</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/ea3043fa1ad2c05b56c24c6f85e532b6f425a9739836c680fe958d50d23d2676.jpg" alt="Airline Crew Reports Jet Pack Figure Near Dallas-Fort Worth Airport thumbnail" loading="lazy" />
  <p>An FAA preliminary incident report documents the crew of American Airlines flight 1030 reporting a &quot;jet pack man&quot; approximately 500 feet above their Boeing 787 while on final approach to Dallas-Fort Worth International Airport on 5 March 2023. No other observers corroborated the sighting, no evasive action was taken, and the FAA recorded no impact to operations.</p>
  <div class="narr">This document is a preliminary incident report from the FAA&#39;s Washington Operations Center, filed under record number 237UAP00489. It records a UAP sighting reported by the flight crew of American Airlines flight 1030, a Boeing 787 operating from Cancún, Mexico to Dallas-Fort Worth.

On 5 March 2023 at approximately 4:16 p.m. Central time, the crew reported seeing what they described as a &quot;jet pack man&quot; roughly 500 feet above their aircraft. At the time, the plane was heading southbound on short final approach to Runway 18R at DFW. The Dallas-Fort Worth Air Traffic Control Tower was advised of the report.

The crew took no evasive action, and the FAA noted no impact to airport operations. Notably, no other aircraft or ground observers reported seeing the object. The report records the object&#39;s altitude as unknown — the 500-foot figure describes the object&#39;s position relative to the aircraft, not its altitude above the ground.

This is a preliminary report only. No follow-up investigation results are included in the document, and the term &quot;jet pack man&quot; reflects the crew&#39;s own description rather than a confirmed identification by the FAA or any other authority. Redaction levels in the document are low.</div>
