  <h1>U.S. Drone Over Iran Recorded Two Unidentified Objects Five Minutes Apart</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">11/2/20</span>
    <span class="badge">Iran</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/8422fceb10b2eafcab525690cc9aff6827fc78d5ae5e34b44174d9cc78abbb7c.jpg" alt="U.S. Drone Over Iran Recorded Two Unidentified Objects Five Minutes Apart thumbnail" loading="lazy" />
  <p>A formerly classified U.S. military mission report from November 2, 2020, documents a long-duration surveillance drone flight over the Arabian Gulf and Gulf of Oman during which the crew recorded two unidentified anomalous phenomena (UAP) five minutes apart using onboard video. The report is heavily redacted, and no explanation for the objects is provided.</p>
  <div class="narr">On November 2, 2020, a single aircraft from the 482nd Attack Squadron, operating under U.S. Central Command (USCENTCOM) and the 432nd Air Expeditionary Wing, took off at 0608Z on an armed reconnaissance mission over the Arabian Gulf, Strait of Hormuz, and Gulf of Oman. The mission&#39;s purpose was to monitor vessel traffic, drone activity near Iranian ports, and establish patterns of normal behavior in the area. The flight lasted 20 hours and 42 minutes — with nearly 19 hours spent on station — and the aircraft&#39;s low airspeed of roughly 105–107 knots strongly suggests it was a remotely piloted drone, not a manned fighter.

At 2143Z (9:43 p.m. UTC), while flying at 22,000 feet on a heading of 110 degrees, the crew observed an unidentified object via the aircraft&#39;s full-motion video (FMV) sensor. The object was at an unknown altitude, bearing 080 degrees true from the aircraft, in a location within the military grid zone 39RWK. Five minutes later, at 2148Z, a second UAP was observed in the same general grid area, this one traveling northwest. Both sightings were captured on video, and the footage was sent to the Defense Office of Prepublication and Security Review&#39;s exploitation arm (DOSI) for analysis — but the results of that analysis are not included in this report.

Earlier in the mission, at 1012Z, the aircraft had been contacted on the emergency guard radio frequency by Iranian Air Defense. The report describes the tone of the contact as professional, and it had no impact on the mission. Haze during the flight degraded the ability to collect imagery intelligence. The report notes that no intelligence gap was filled by the mission.

The document was declassified on March 16, 2026, by Major General Richard A. Harrison, USCENTCOM Chief of Staff — nearly 19 years ahead of its original scheduled declassification date of March 2045. Much of the report remains redacted: the aircraft type, tail number, callsign, crew names, exact coordinates of the UAP sightings, and other operational details are all blacked out under multiple classification exemptions.</div>
