  <h1>FAA Report: Airline Pilot Saw Stationary Lights at 37,000 Feet, Radar Found Nothing</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/ea50a5eca4f69c296038158662a17cbc49e59e71546c66f976c197388bc88a48.jpg" alt="FAA Report: Airline Pilot Saw Stationary Lights at 37,000 Feet, Radar Found Nothing thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a UFO sighting by the pilot of a United Airlines Boeing 737-700 (flight UAL1104) flying between Denver and Anchorage. The pilot described a stationary object with red, green, and white lights at 37,000–39,000 feet, but Salt Lake City air traffic control radar showed no other aircraft in the area. The case was closed with no explanation recorded.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unusual aerial observations. It records a sighting reported by the pilot-in-command of United Airlines flight 1104, a Boeing 737-700 travelling from Denver (DEN) to Anchorage (ANC).

While flying on airway CPN14010 at an altitude between FL370 and FL390 (roughly 37,000 to 39,000 feet), the pilot reported seeing an unidentified object. The pilot described it as having red, green, and white lights and being stationary. The FAA&#39;s Salt Lake City Center (ZLC) checked radar and found no other targets in the area besides UAL1104 itself.

The FAA provided the pilot with a UFO call centre number, relayed through ZLC. The report is categorised under the primary code &quot;OTHER&quot; and its status is marked as &quot;Closed&quot; — but the document records no resolution, conclusion, or follow-up explanation for what the pilot observed.

The dated events in the report point to 8 February 2019. No identifying details about the pilot are included in the document. There is little evidence of redaction; the document appears to be a brief, routine incident log rather than an in-depth investigation file.</div>
