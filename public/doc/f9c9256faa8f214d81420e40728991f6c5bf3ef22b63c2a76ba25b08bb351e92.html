  <h1>CIA Report Detailed Soviet Research on Pilot Fatigue and Fitness</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">November, 1976</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f9c9256faa8f214d81420e40728991f6c5bf3ef22b63c2a76ba25b08bb351e92.jpg" alt="CIA Report Detailed Soviet Research on Pilot Fatigue and Fitness thumbnail" loading="lazy" />
  <p>This November 1976 CIA intelligence report summarises Soviet aerospace medical research into crew fatigue, including studies on phosphenes (flashes of light seen by pilots during night flying) and mandatory fitness testing for Aeroflot crewmembers. The document is heavily redacted and was produced from a degraded image scan, leaving significant portions unreadable.</p>
  <div class="narr">This document is a CIA Foreign Intelligence Information Report from November 1976, produced by the agency&#39;s Domestic Collection Division. It focuses on Soviet aerospace medical research — specifically, how the USSR was studying and countering fatigue in flight crews.

Among the topics covered, Soviet researchers were investigating phosphenes — a phenomenon where pilots perceive flashes of light during night flying, attributed to particles interacting with the eye. A researcher identified as Dr Akstin, based at the Civil Aviation Institute of Leningrad, studied pilot physiological performance. The report also describes automated biological testing equipment designed to measure crewmembers&#39; motor ability and function, with plans to reduce test time to just one to three minutes once prototype equipment became operational.

The document notes that Aeroflot, the Soviet state airline, provided exercise facilities at all major airports, supervised by aviation athletes. The fitness regime was mandatory: a crewmember who failed the fitness assessment was not permitted to fly.

Heavy redaction throughout the document obscures significant portions of the content. The source material is an OCR scan of a degraded image, meaning many words are garbled or uncertain. As a result, the full scope of what this report originally covered cannot be determined from the surviving text alone.</div>
