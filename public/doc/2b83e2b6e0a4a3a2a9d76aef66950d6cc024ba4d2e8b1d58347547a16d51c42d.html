  <h1>Multiple Aircraft Report Hovering Lights Near Turks and Caicos</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2b83e2b6e0a4a3a2a9d76aef66950d6cc024ba4d2e8b1d58347547a16d51c42d.jpg" alt="Multiple Aircraft Report Hovering Lights Near Turks and Caicos thumbnail" loading="lazy" />
  <p>An FAA operations center report documents a UAP sighting by a Gulfstream business jet and at least two other aircraft over the Caribbean Sea near Grand Turk, Turks and Caicos Islands. The crew described a group of hovering lights directly ahead of them at 43,000 feet; no evasive action was taken and no investigation outcome is recorded.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed under record number 237UAP00629. It records a UAP — unidentified aerial phenomenon — observed near Grand Turk in the Turks and Caicos Islands, at coordinates roughly 21.3°N, 71.2°W over the Caribbean Sea. The report was logged at 00:26 local time on 25 May 2024.

The primary reporting aircraft was N513MA, a Gulfstream GLF5 business jet flying northwest from Port of Spain, Trinidad and Tobago to Miami at flight level 430 (approximately 43,000 feet). The crew reported seeing an unidentified aerial phenomenon directly ahead of them, located about 10 nautical miles south-southwest of the Grand Turk VOR navigation beacon. They described it as a group of hovering lights. The crew took no evasive action.

Miami ARTCC (Air Route Traffic Control Center) was advised of the sighting. Two additional aircraft — identified by callsigns FFT1745 and JBU2054 — independently reported the same phenomenon, providing some degree of corroboration. Law enforcement was not notified.

The document is a preliminary operations center report, not a completed investigation. It contains no conclusion about what the lights were, no follow-up analysis, and no indication that the matter was referred for further study. There is little evidence of redaction in the document.</div>
