  <h1>US Military Drone Recorded a UAP Over the Strait of Hormuz in 2020</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">9/16/20</span>
    <span class="badge">Strait of Hormuz</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/36708d3c6121b00c55394ac4a648fbcbe5411c8b2c00ea8f42f9ca0e502c6b13.jpg" alt="US Military Drone Recorded a UAP Over the Strait of Hormuz in 2020 thumbnail" loading="lazy" />
  <p>A declassified US Air Force mission report documents a nearly 21-hour armed reconnaissance flight over the Strait of Hormuz on September 16, 2020, during which a remotely piloted aircraft from the 482nd Attack Squadron captured an unidentified anomalous phenomenon on full-motion video. The report is heavily redacted, and the UAP entry contains almost no descriptive detail — no shape, size, or behavior is recorded.</p>
  <div class="narr">This document is a Mission Report (MISREP) from the 482nd Attack Squadron, operating under the 432nd Air Expeditionary Wing and US Central Command. The mission was an armed reconnaissance flight over the Arabian Gulf, Strait of Hormuz, and Gulf of Oman in support of Naval Forces Central Command (NAVCENT). Its stated objectives were to monitor Iranian and Islamic Revolutionary Guard Corps Navy vessels, drone activity, port operations, and to establish a pattern of life in the region. The aircraft took off at 2302Z on September 15, 2020 and landed just under 21 hours later.

During the mission, Iranian Air Defense hailed the aircraft on guard frequency three separate times — at 0408Z, 0421Z, and 1141Z. The first two calls were described as directive in tone; the third was described as professional. None had an impact on the mission. The crew also observed two possible Houdong-class warships docked pierside at 1321Z.

The aircraft experienced two electromagnetic interference (EMI) events of unknown origin that caused complete loss of the data link. The first, at 1248Z, lasted 11 minutes. The second, at 1414Z, lasted 27 minutes. Both caused the aircraft to deviate from its planned flight path. These events occurred roughly two to three hours before the UAP sighting; the report does not state any connection between them.

At 1732Z, while flying at approximately 18,000 feet and 90 knots, the aircraft&#39;s full-motion video captured what the report labels a UAP. The location is given as a partially redacted military grid reference (39RVM5). No description of the object&#39;s shape, size, movement, or behavior appears in the readable text. The video footage was sent to the Defense General Supply Intelligence (DGSI) for analysis, but no results of that analysis are included in this report.

The document is heavily redacted throughout. The aircraft type, callsign, tail number, precise coordinates, operation name, and affected electronic systems are all blacked out under national security exemptions. The report was originally classified with a scheduled declassification date of March 1, 2045, but was declassified on January 22, 2026.</div>
