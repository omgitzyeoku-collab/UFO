  <h1>Navy Drone Crew Reported Three Unidentified Objects Over Arabian Gulf</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">8/31/20</span>
    <span class="badge">Arabian Gulf</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/d52431b354af55b1e86cb454e61fd61993af3b023a38f2d9e014a9c9d18d16b4.jpg" alt="Navy Drone Crew Reported Three Unidentified Objects Over Arabian Gulf thumbnail" loading="lazy" />
  <p>This is a U.S. Navy Range Fouler Debrief form documenting an unauthorized airspace intrusion observed on August 31, 2020, over the Arabian Gulf. A pilot from an MQ-9 Reaper drone squadron reported tracking three unidentified objects on sensor screens that moved amongst each other at varying speeds. The document was approved for public release under USCENTCOM MOR 26-0028.</p>
  <div class="narr">This document is a Range Fouler Debrief Form — a standard U.S. military report used when something enters controlled airspace without authorization during active operations. It was filed by the Department of War and later approved for public release under USCENTCOM MOR 26-0028.

On August 31, 2020, at dusk, a pilot with the rank of O-2 (First Lieutenant) from the 482nd Attack Squadron (482 ATKS) was conducting an ISR (Intelligence, Surveillance, and Reconnaissance) mission over the Arabian Gulf. The 482 ATKS operates MQ-9 Reaper drones, meaning the pilot was observing remotely through the aircraft&#39;s sensor feed, not from a manned cockpit. The pilot first spotted an object moving across the sensor screen and began tracking it. A second object of the same size and shape then overtook the first at a much higher speed. Eventually, three objects were visible simultaneously, moving amongst each other. The objects were at approximately 18,000 feet and their altitude remained constant. Their shape was categorized only as &quot;Other&quot; on the form.

The document is partially redacted. The observer&#39;s name, email, and squadron contact details have been removed. The MGRS grid reference for the initial contact begins with 39RWL — consistent with the Arabian Gulf — but the remaining digits are cut off, preventing precise geolocation. Latitude and longitude fields appear blank or redacted. Multiple redaction exemptions under (b)(1) (national security) and (b)(6) (personal privacy) are marked throughout.

The form does not include any agency conclusion about what the objects were. It records one pilot&#39;s account of what appeared on a sensor screen. No corroborating sensor data, radar tracks, or additional witness statements are included in this document.</div>
