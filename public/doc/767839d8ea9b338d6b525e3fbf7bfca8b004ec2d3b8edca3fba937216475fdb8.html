  <h1>FBI Files Bundle Seven Unrelated Flying Disc Reports From 1948–1949</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/767839d8ea9b338d6b525e3fbf7bfca8b004ec2d3b8edca3fba937216475fdb8.jpg" alt="FBI Files Bundle Seven Unrelated Flying Disc Reports From 1948–1949 thumbnail" loading="lazy" />
  <p>This section of the FBI Vault contains a grab-bag of unrelated flying saucer materials from 1948–1949, including the well-known Chiles-Whitted airline pilot sighting near Montgomery, Alabama, a cigar-shaped object seen across Virginia, a toy manufacturer&#39;s promotional letter, and Robert Ripley&#39;s debunked claim to possess a Japanese flying saucer. No cases reached a firm conclusion.</p>
  <div class="narr">This FBI file is not a single investigation but a bundle of loosely related correspondence, internal memos, and newspaper clippings about flying disc reports from 1948 and 1949. The materials range from serious pilot testimony to a toy company&#39;s marketing pitch to a woman&#39;s claim that flying discs were weapons in a spiritual war.

The most substantial item is a set of newspaper clippings from the Atlanta Journal covering the Chiles-Whitted sighting of July 24, 1948. Eastern Air Lines pilots C. S. Chiles and John B. Whitted reported a wingless craft near Montgomery, Alabama, describing a 100-foot fuselage with brilliantly lighted square windows and a fiery tail 25 to 50 feet long. However, the only awake passenger, C. L. McKelvie of Columbus, Ohio, said he saw a continuous light but no ship-like form. The Army Air Forces and Weather Bureau suggested the pilots may have seen a radar weather balloon with tinfoil reflectors, but no explanation was confirmed. General George C. Kenney, chief of Strategic Air Command, said the Army did not have anything like the object described.

Other items include an FBI Richmond office memo forwarding newspaper clippings about a cigar-shaped object with a bright red nose and trailing smoke seen across Virginia and Tennessee on May 12, 1949 — the Richmond office noted it conducted no investigation. A letter from J. Edgar Hoover dated May 25, 1949, replied to a woman in Nobleboro, Maine, who had reported seeing a small object resembling a double bloom in the sky, possibly a weather balloon. Three flying disc sightings in New Orleans on May 10, 19, and 23, 1949 were investigated by Army Intelligence; the Navy suggested the objects may have been weather balloons. Robert Ripley of &#39;Believe It or Not&#39; fame claimed via telegram to possess an authentic Japanese flying saucer, but Army and Air Force investigation found no evidence any flying saucers had been recovered in the United States.

The file also contains promotional materials from the Southern California Plastic Co. in Glendale, California, about a toy &#39;Flyin-Saucer&#39; disc invented by Fred Morrison — apparently forwarded to the FBI as correspondence — and a memo about a Chicago woman who told the FBI that flying discs were explosives used in warfare between good and bad souls of deceased people, whom the agent assessed as &#39;somewhat mentally unbalanced.&#39; Several witness names and addresses are partially redacted throughout.</div>
