  <h1>Copa Airlines Crew Reports Flashing White Light Over Florida Keys</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e5dbc0ea41508167ce1fec726bf2f4dc3efe4543a150851a30f4cc34c516a5bc.jpg" alt="Copa Airlines Crew Reports Flashing White Light Over Florida Keys thumbnail" loading="lazy" />
  <p>This FAA incident notification records a UAP sighting by a Copa Airlines Boeing 737 crew flying at 37,000 feet near the Florida Keys on 10 June 2023. The pilots described a stationary white light that switched on and off periodically, and multiple other aircraft in the area reported seeing the same thing.</p>
  <div class="narr">On 10 June 2023 at 02:26 Eastern time, the crew of Copa Airlines flight 404 — a Panama-registered Boeing 737-800 flying from Panama City to Washington Dulles — reported an unidentified aerial phenomenon to Miami Air Route Traffic Control Centre (ARTCC). The aircraft was heading north at 37,000 feet, roughly 3.1 nautical miles southwest of Florida Keys Marathon International Airport.

The crew described the object as a stationary white light directly ahead of them (the &quot;12 o&#39;clock position&quot;) that turned on and off periodically. They did not take evasive action, and the sighting had no reported impact on flight operations.

Notably, the report states that multiple other aircraft in the vicinity also reported similar sightings, though none of those aircraft are identified by name or flight number in the document.

This record is a preliminary notification from the FAA&#39;s Washington Operations Center — it documents the initial report, not the outcome of any investigation. No radar data, sensor recordings, or photographs are referenced. The description relies entirely on what the pilots saw with their eyes.

The document shows minimal redaction. The coordinates place the sighting at approximately 24.69°N, 81.09°W, over the waters near Marathon, Florida.</div>
