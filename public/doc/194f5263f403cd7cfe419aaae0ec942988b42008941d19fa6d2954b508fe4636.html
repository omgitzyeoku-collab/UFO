  <h1>Southwest Airlines Crew Reports Flash of Light at 40,000 Feet</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/194f5263f403cd7cfe419aaae0ec942988b42008941d19fa6d2954b508fe4636.jpg" alt="Southwest Airlines Crew Reports Flash of Light at 40,000 Feet thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting an unidentified aerial phenomenon observed by a Southwest Airlines Boeing 737 crew flying from Minneapolis to Denver. The crew, at 40,000 feet near O&#39;Neill VOR in Nebraska, described seeing a flash of light or possible space debris. The case was closed with no resolution.</p>
  <div class="narr">This document is a one-page FAA SKYWATCH incident report filed under case number 237UAP00078. It records an unidentified aerial phenomenon (UAP) observed by the crew of Southwest Airlines flight SWA1695, a Boeing 737 flying from Minneapolis-Saint Paul (MSP) to Denver (DEN).

The crew was travelling southwest-bound at FL400 — aviation shorthand for 40,000 feet — in the vicinity of O&#39;Neill VOR (ONL), a navigation point in Nebraska, when they observed something unusual. The phenomenon was described as a flash of light or space debris. The report was logged through Minneapolis Center (ZMP), the air traffic control facility covering that airspace.

The FAA classified the primary code as &quot;Unidentified Aerial Phenomenon&quot; and the case status is marked as closed. The report contains no mention of corroborating radar data, sensor evidence, or follow-up investigation findings. No resolution or explanation is provided.

The document is notably brief — a single page with minimal detail. The crew themselves offered two possible explanations (a flash of light or space debris), which suggests they were uncertain about what they observed. No other witnesses or data sources are referenced.</div>
