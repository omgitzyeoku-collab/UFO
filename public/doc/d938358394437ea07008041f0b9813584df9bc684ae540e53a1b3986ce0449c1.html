  <h1>FAA Report: Airline Crew Spotted Large Balloon at 50,000 Feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d938358394437ea07008041f0b9813584df9bc684ae540e53a1b3986ce0449c1.jpg" alt="FAA Report: Airline Crew Spotted Large Balloon at 50,000 Feet in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from 3 February 2023. The crew of a commercial Airbus A320 flying from Denver to Kansas City reported a large balloon off the left side of their aircraft, estimated at approximately 50,000 feet — well above their own altitude of 13,000 feet. The case is closed.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report coded as an &quot;Unidentified Aerial Phenomenon.&quot; It records an observation made on 3 February 2023 at 15:44 UTC by the crew of flight FFT566, a commercial Airbus A320 flying southeast-bound from Denver (DEN) to Kansas City (MCI).

While at 13,000 feet, the crew reported a large balloon off the left side of the aircraft. They estimated the balloon was at approximately FL500 — flight-level nomenclature for roughly 50,000 feet — or above. That altitude is unusually high, and the estimate was made visually from over 37,000 feet below.

The reporting facility was MCI (Kansas City). The FAA categorised the sighting under its SKYWATCH system as a UAP, though the crew themselves described the object as a balloon, not as something unknown. The case status is listed as closed. There is no mention in the report of corroborating radar data or follow-up investigation findings.

The date is worth noting: early February 2023 was the period when Chinese surveillance balloons were widely reported over US airspace, which may be relevant context for this sighting.</div>
