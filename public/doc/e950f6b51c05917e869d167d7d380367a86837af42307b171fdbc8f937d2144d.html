  <h1>American Airlines crew reported two white lights above their aircraft near Memphis</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/e950f6b51c05917e869d167d7d380367a86837af42307b171fdbc8f937d2144d.jpg" alt="American Airlines crew reported two white lights above their aircraft near Memphis thumbnail" loading="lazy" />
  <p>This FAA incident report documents a March 2023 sighting by the crew of American Airlines flight AAL421, who observed two white lights well above their aircraft while cruising at 35,000 feet northeast of Memphis. The case was closed with no explanation or follow-up recorded.</p>
  <div class="narr">On 14 March 2023, the crew of American Airlines flight AAL421 — an Airbus A321 flying from Las Vegas to Charlotte — reported an unidentified aerial phenomenon to air traffic control. The aircraft was cruising eastbound at flight level 350 (approximately 35,000 feet), about 78 nautical miles northeast of Memphis, when the crew spotted something off the front of the aircraft.

The phenomenon was described as two white lights positioned much higher above the aircraft. The sighting was logged through Memphis Air Route Traffic Control Centre (ARTCC), facility code ZME, under the FAA&#39;s SKYWATCH reporting system. The report was flagged with a page notification, indicating it was treated with some urgency at the time.

The FAA classified the incident under its primary code for Unidentified Aerial Phenomenon. No tail number for the specific aircraft was recorded in the report, and there is no mention of radar data, photos, or any other sensor corroboration — only the crew&#39;s visual observation.

The case is marked as closed. No resolution, explanation, or follow-up investigation is recorded in the document. The report is brief, consisting of the basic incident fields and a short narrative description.</div>
