  <h1>Multiple Aircraft Crews Reported Bright Light Over Southern US Airspace</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/bfc4d2bd8818a63005c58edf05185b1dcef447d3a66e0e47af4ff139df81e83d.jpg" alt="Multiple Aircraft Crews Reported Bright Light Over Southern US Airspace thumbnail" loading="lazy" />
  <p>This is an FAA incident report documenting a bright white light seen high above a general aviation aircraft flying at 40,000 feet on 28 February 2023. Multiple aircraft crews across two air traffic control regions independently reported the same phenomenon, but the case was closed with no explanation provided.</p>
  <div class="narr">On 28 February 2023, at 01:26 UTC, a general aviation aircraft with callsign N4200K was flying westbound at 40,000 feet on a route from Opa-locka Executive Airport in Florida to Houston Hobby Airport in Texas. The crew reported seeing a bright white light travelling high above their aircraft, off the left side, approximately 63 nautical miles west of the LBV navigation point.

The sighting was not isolated. Multiple aircraft operating in both Miami Center (ZMA) and Jacksonville Center (ZJX) airspace reported the same phenomenon. This cross-witness corroboration across two separate air traffic control regions is notable, though the report does not reference any independent sensor data such as radar returns.

The FAA logged this under its SKYWATCH programme and classified it with the primary code &quot;Unidentified Aerial Phenomenon.&quot; A notification was sent to an entity abbreviated as &quot;TY&quot; — the acronym is not defined in the document.

The case is marked as Closed. No resolution, identification, or explanation is provided in the report. The document is a single-page summary with minimal technical detail — no radar data, speed estimates, or duration of observation are included.</div>
