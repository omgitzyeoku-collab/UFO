  <h1>FAA Report: Pilot Saw Multicoloured Lights Larger Than Aircraft Over California</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/b49fab05bf4d8cc5e2ab0943303a6ab48e019a2d84fcc258a5344bdbcc8aeec6.jpg" alt="FAA Report: Pilot Saw Multicoloured Lights Larger Than Aircraft Over California thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a general aviation pilot&#39;s sighting of multicoloured lights near Fresno and Visalia, California on 16–17 March 2023. The pilot, flying at 40,000 feet, described orange, purple, green, and red lights that appeared larger than an aircraft. The case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00241, with a Mandatory Occurrence Report ID of ZOA-M-2023/03/16-0004. It records a pilot&#39;s sighting of an unidentified aerial phenomenon during a general aviation flight in March 2023.

The pilot was flying a Citation Excel (a business jet) under callsign N760ED, travelling north-northwest at FL400 — that is, 40,000 feet. The flight originated from Thermal, California (TRM) and was heading for Aurora, Oregon (UAO). While in the vicinity of Fresno (FAT) and Visalia (VIS) in central California, the pilot reported seeing multicoloured lights — orange, purple, green, and red — that appeared to be larger than an aircraft.

The sighting was reported through Oakland Air Route Traffic Control Centre (ZOA), which handles air traffic across much of California and Nevada. The FAA classified the event under its primary code for Unidentified Aerial Phenomenon.

The case status is listed as Closed, but the report provides no resolution or explanation for what the pilot observed. There is no mention of corroborating radar data or additional witnesses. The tail number field on the report is blank, which limits independent verification of the aircraft involved despite the callsign being recorded.

The time of the event is recorded as 05:00 UTC, which corresponds to late evening local time in the Pacific time zone — a detail relevant to understanding the light conditions under which the pilot made the observation.</div>
