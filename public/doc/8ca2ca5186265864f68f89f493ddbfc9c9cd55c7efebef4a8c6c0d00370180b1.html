  <h1>Mercury Atlas 8 Pilot Reported White Objects and Light Burst in Orbit</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">10/3/62</span>
    <span class="badge">Low Earth Orbit</span>
    <span class="badge">verified</span>
  </div>
  
  <p>This is an auto-transcribed audio excerpt from NASA&#39;s Mercury Atlas 8 (Sigma 7) mission on 3 October 1962, in which the pilot reported small white objects drifting from the capsule and an unidentified burst of light near orbital sunset. The pilot himself attributed the white objects to capsule debris, likening them to lathe shavings.</p>
  <div class="narr">On 3 October 1962, during the Mercury Atlas 8 mission — also known as Sigma 7 — NASA recorded audio of pilot communications from low Earth orbit. This excerpt, designated NASA-UAP-D012, captures the pilot describing two visual observations made during orbital flight.

The first observation involved small white objects that appeared to originate from the capsule itself and drifted away. The pilot described them as resembling lathe shavings — fine curls of metal left over from manufacturing. He noted the particles kept drifting relative to him regardless of the capsule&#39;s orientation.

The second observation was a burst of light seen through the window. The pilot noted he was approaching an orbital sunset at the time, suggesting the light may have been related to that transition rather than anything unexplained. He stated plainly that he did not know what the burst of light was.

NASA released this audio as part of its UAP-related document collection. The excerpt contains no agency conclusions or analysis — it is simply a record of what the pilot communicated during the flight. There is no indication of significant redaction.</div>
