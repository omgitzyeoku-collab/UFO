  <h1>US Intelligence Logged 510 UAP Reports by August 2022</h1>
  <div class="meta">
    <span class="badge">ODNI</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/839c8ba6d5d9686bf1051ad26870450653a8d46528bc6c1789597abbf92c435a.jpg" alt="US Intelligence Logged 510 UAP Reports by August 2022 thumbnail" loading="lazy" />
  <p>This is the Office of the Director of National Intelligence&#39;s annual report to Congress on Unidentified Aerial Phenomena, covering fiscal year 2022. It documents 510 total UAP reports as of 30 August 2022 — a sharp increase from the 144 in the original 2021 preliminary assessment — and describes the creation of a new office to investigate them, though 171 reports remained unexplained.</p>
  <div class="narr">In January 2023, the Office of the Director of National Intelligence (ODNI) delivered its congressionally mandated annual report on Unidentified Aerial Phenomena (UAP) — the government&#39;s term for what most people call UFOs. The report was required by Section 1683 of the Fiscal Year 2022 National Defense Authorization Act and covers activity through 30 August 2022.

The headline number: 510 total UAP reports had been catalogued by that date. That is a dramatic jump from the 144 reports that covered 17 years of data in the ODNI&#39;s preliminary assessment published on 25 June 2021. Of the 366 newly identified reports, 247 came in during the 17 months after the preliminary assessment, with another 119 discovered or reported late from the earlier period. The ODNI attributed the surge partly to reduced stigma around UAP reporting and a better understanding of the potential threats these objects may pose. Most reports came from US Navy and US Air Force aviators.

Analysts managed to categorise some of the new reports: 163 were identified as balloon or balloon-like objects, 26 as unmanned aircraft systems (drones) or drone-like objects, and 6 as clutter. That left 171 reports uncharacterised and unattributed. The report notes that some of these uncharacterised UAP appeared to demonstrate unusual flight characteristics or performance capabilities, but provides no specific details in this unclassified version.

The report also documents the establishment of the All-Domain Anomaly Resolution Office (AARO) on 20 July 2022, replacing the earlier UAP Task Force. AARO has broader authority, coordinating UAP efforts across the Department of Defense, intelligence community, and other government agencies. Notably, the definition of UAP was expanded to include objects in the air, sea, and those that move between mediums. No collisions between US aircraft and UAP were reported, and no UAP encounters were confirmed to have caused adverse health effects. UAP events continued to occur in restricted or sensitive airspace.</div>
