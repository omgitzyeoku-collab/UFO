  <h1>FBI Interviewed Detroit Man Who Reported Seeing Circular Vehicle in Wartime Germany</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    <span class="badge">11/7/57</span>
    <span class="badge">Germany</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d71c2f57a9f173b56220eb6a7f5b867a6d0ed296a0c997cd4997e26fc895f29b.jpg" alt="FBI Interviewed Detroit Man Who Reported Seeing Circular Vehicle in Wartime Germany thumbnail" loading="lazy" />
  <p>This FBI file documents a November 1957 interview with Wladyslaw Krasuski, a Polish-born Detroit resident and former prisoner of war, who reported witnessing a large circular vehicle rise from a concealed enclosure near a German military site in 1944. The account is uncorroborated, no physical evidence was collected, and several pages of the document are heavily degraded.</p>
  <div class="narr">In November 1957, Wladyslaw Krasuski — a Polish immigrant living in Detroit and working at the Gobel Brewery — wrote a letter to Robert Cutler, Special Assistant to the President, after hearing a news report about a mysterious vehicle in Texas that allegedly stalled car engines. The letter was forwarded to the FBI, and Special Agent Cassius Rathbun interviewed Krasuski on November 7, 1957.

Krasuski recounted that in 1944, while held as a prisoner of war near Gut Alt Golssen, roughly 30 miles east of Berlin, he witnessed something unusual. He described a circular enclosure about 100 to 150 yards across, surrounded by a tarpaulin wall roughly 50 feet high, near a German military compound. From approximately 500 feet away, he observed a large circular vehicle — which he estimated at 75 to 100 yards in diameter and about 14 feet high — slowly rise vertically from the enclosure and then move horizontally. The vehicle had dark gray top and bottom sections and what appeared to be a rapidly spinning middle section. He reported a high-pitched whining noise, similar to a large electric generator, and said that tractor engines stalled whenever the noise was audible. He also described thick uninsulated metal cables, possibly copper, running between the enclosure and a concrete structure.

Krasuski said he was part of a work crew of 16 to 18 prisoners of war — Russian, French, and Polish — guarded by SS personnel. He could not recall the exact month of the 1944 observation, had not been in contact with any crew members since 1945, and noted that when he revisited the site after the war, the area was submerged under water and the cables had been removed.

The interviewing agent noted no signs of irrational or abnormal behaviour during the interview. The FBI did not collect physical evidence or locate other witnesses. The file also contains a 1966 letter from the Oklahoma UFO Research Association requesting UFO sighting information, which the Detroit FBI office declined. Several pages of the document are heavily degraded and largely illegible.</div>
