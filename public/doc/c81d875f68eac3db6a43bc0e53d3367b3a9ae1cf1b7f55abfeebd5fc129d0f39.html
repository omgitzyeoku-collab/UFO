  <h1>Airline Crew and Other Pilots Reported White Lights Over Oklahoma</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/c81d875f68eac3db6a43bc0e53d3367b3a9ae1cf1b7f55abfeebd5fc129d0f39.jpg" alt="Airline Crew and Other Pilots Reported White Lights Over Oklahoma thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents a sighting by the crew of United Airlines flight 2484 on 17 February 2024, in which 1–5 white lights of varying brightness were observed moving vertically and horizontally at 37,000 feet near Ardmore, Oklahoma. Other eastbound aircraft at similar altitudes independently reported the same phenomenon.</p>
  <div class="narr">On 17 February 2024 at approximately 3:54 AM Central time, the crew of United Airlines flight 2484 — a Boeing 737 MAX 8 flying from Phoenix to Newark — reported an unidentified aerial phenomenon to Fort Worth Air Route Traffic Control Center (ARTCC). The aircraft was eastbound at 37,000 feet, roughly 20 nautical miles north of Ardmore, Oklahoma.

The crew described the UAP as between one and five white lights of differing brightness. The lights moved both vertically and horizontally and would appear and then quickly disappear. No onboard sensor data is referenced in the report; the observations are entirely visual from the cockpit.

Other eastbound aircraft flying between 35,000 and 37,000 feet also reported seeing the same phenomenon, though the report does not name or count those corroborating aircraft.

The document is a preliminary information report from the FAA&#39;s Washington Operations Center, filed under reference WOC 7-3333. It records the initial sighting details but does not contain any conclusions, identification of the lights, or evidence of further investigation. There is little sign of redaction in the document.</div>
