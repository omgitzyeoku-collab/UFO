  <h1>Military Infrared Video Captures Unidentified Object Over CENTCOM Region</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2020</span>
    <span class="badge">CENTCOM</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/0e961dd8c5d4417c8a7319411674a5a3057fae0fd28c341aa2829b6cfc396a96.jpg" alt="Military Infrared Video Captures Unidentified Object Over CENTCOM Region thumbnail" loading="lazy" />
  <p>This nearly five-minute infrared video, recorded from a U.S. military platform in the CENTCOM area of responsibility in August 2020, shows an unidentified area of contrast moving across the sensor&#39;s field of view. The video was found on a classified network by the All-domain Anomaly Resolution Office (AARO) after a congressional request, but it lacks a verified chain of custody and much of the footage contains no visible content.</p>
  <div class="narr">In August 2020, a U.S. military platform operating in the area covered by United States Central Command (CENTCOM) — which spans the Middle East and Central Asia — recorded a short infrared video. The footage, catalogued as DOW-UAP-PR088, runs just under five minutes, though the first minute and twenty-one seconds contain no content at all. Starting around the 1:22 mark, an area of contrast appears in the upper-left corner, moves across the frame, and exits at the bottom. The sensor then cycles through different zoom levels before the video ends.

The video was uploaded to a classified network in August 2020. It came to public attention after eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records on 6 March 2026. AARO — the Department of War&#39;s office responsible for investigating unidentified anomalous phenomena — identified this video among responsive materials held on that classified network.

AARO assesses that the video is &quot;likely&quot; derived from an infrared sensor aboard a U.S. military platform, but that word &quot;likely&quot; matters: the provenance is not confirmed. The agency also notes that many of the materials in this collection lack a substantiated chain of custody, meaning the handling history and authenticity of the video cannot be fully verified.

The object itself is described only as &quot;an area of contrast&quot; — no shape, size, speed, or behaviour details are provided. The callsigns in the document title are redacted, so the specific platform and unit that recorded the video cannot be identified. The official description of the video&#39;s content appears to have been truncated mid-word, leaving the full account incomplete.</div>
