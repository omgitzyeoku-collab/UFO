  <h1>FBI Memos Cover a Michigan UFO Photo Inquiry and a Denver Flying Saucer Lecture</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/db87b2051dc434188f23e59904c375d0b52b3692763d48ef6163a0f309554da3.jpg" alt="FBI Memos Cover a Michigan UFO Photo Inquiry and a Denver Flying Saucer Lecture thumbnail" loading="lazy" />
  <p>This FBI file contains two 1960 field office memoranda: one from Detroit about a citizen&#39;s complaint that FBI agents seized UFO photographs (which the Bureau denied), and one from Denver where an agent attended a public lecture by a self-described aviation veteran who claimed personal contact with extraterrestrials. Neither memo contains FBI conclusions or endorsements of any claims made.</p>
  <div class="narr">This file from the FBI&#39;s records — designated &quot;UFO Part 14&quot; — consists of internal memoranda from two field offices, both dated spring 1960. The documents are heavily redacted and the underlying scans suffer from severe OCR corruption, making portions difficult to read.

The first memo, dated 20 May 1960, originates from the Detroit office. It concerns Joseph Perry of Grand Blanc, Michigan, who had taken a photographic slide of the moon that appeared to show a flying object nearby. Perry delivered the slide to Selfridge Air Force Base on 3 May 1960. The Air Force returned it with a letter stating the apparent object was a defect caused by improper development of the negative. A citizen then contacted the FBI, alleging that agents had &quot;snatched&quot; the photographs — a claim the Detroit office firmly denied, stating the FBI &quot;does not investigate flying saucers.&quot; Perry reportedly planned to send the slide to Eastman Kodak for independent analysis.

The second memo, dated 26 April 1960, comes from the Denver office. A Special Agent attended a public lecture on 17 April 1960 given by an unnamed speaker who claimed over 30 years in aviation and said he operated a private airfield in California. The lecturer asserted he had been personally visited by &quot;space people,&quot; claimed these beings communicate telepathically and possess &quot;crystal batteries&quot; that bend light to render them invisible, and alleged the US Air Force suppresses UFO information out of fear of being disbanded. He also tied his claims to religious themes, saying space people had seeded life on Earth. The attending agent characterised it as &quot;more of a religious-economics lecture rather than one of unidentified flying objects.&quot; The audience was described as mostly older individuals, majority female, with few young people present.

Both memos are marked as containing &quot;neither recommendations nor conclusions&quot; — they are raw field reports, not FBI assessments. The lecturer&#39;s name is redacted, as are other identifying details throughout. Distribution copies went to FBI headquarters and the Los Angeles, San Diego, and San Francisco offices.</div>
