  <h1>United Airlines crew reported lights manoeuvring above their 737 over Iowa</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/50c7f7a7430609249dadf392685ec83e6a3bd95b402e07e3449c8b1e354a0795.jpg" alt="United Airlines crew reported lights manoeuvring above their 737 over Iowa thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents United Airlines flight UAL1046 observing an unidentified aerial phenomenon with visible lights near Sioux City, Iowa on 3 February 2023. The crew reported the object appeared to be manoeuvring at roughly 40,000 feet — above their cruising altitude of 36,000 feet. The case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log reports of unidentified aerial phenomena (UAPs) in US airspace. It records a sighting by the crew of United Airlines flight UAL1046, a Boeing 737-800 flying from Chicago O&#39;Hare to Seattle.

On 3 February 2023 at 04:01 UTC, while cruising westbound at flight level 360 (approximately 36,000 feet) and positioned 37 nautical miles northeast of Sioux City, Iowa, the crew reported an unidentified aerial phenomenon above them. The object had visible lights and appeared to be manoeuvring at approximately flight level 400 (around 40,000 feet) or above — meaning it was at least 4,000 feet higher than the reporting aircraft.

The FAA classified the report under its primary code for &quot;Unidentified Aerial Phenomenon.&quot; The case status is listed as closed, but the document provides no resolution, identification, or follow-up explanation for what the crew observed.

Notably, the report contains no corroborating radar data, no additional witness accounts from other aircraft or ground stations, and no tail number for the aircraft — an omission the document does not explain. The description of the object manoeuvring is the crew&#39;s subjective impression rather than an instrumentally confirmed observation.</div>
