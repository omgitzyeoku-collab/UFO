  <h1>Skylab Astronauts Reported Unexplained Lights and an Unidentified Object in Orbit</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">1973</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/49e232c72a77f16f7e06593789a36882d614888d882a74d71eabcc7d2ce94fb6.jpg" alt="Skylab Astronauts Reported Unexplained Lights and an Unidentified Object in Orbit thumbnail" loading="lazy" />
  <p>This NASA document compiles excerpts from crew debriefings after all three Skylab missions (1973–1974), in which astronauts described light flashes, an unidentified bright reddish object tracked for about 10 minutes, and flashing lights moving outside the station. The most notable observation — a rotating reddish object in a similar orbit — was never identified by NASA despite the crew&#39;s request for an explanation.</p>
  <div class="narr">Between 1973 and 1974, NASA conducted three crewed missions aboard Skylab, America&#39;s first space station. After each mission, the crews sat down at the Johnson Space Center in Houston, Texas for technical debriefings. This document pulls together excerpts from those debriefings where the astronauts discussed unusual things they saw in orbit.

The first crew — Conrad, Kerwin, and Weitz — described frequent light flashes they saw mostly at night with their eyes closed, peaking at two or three per minute. These appeared as spots, sunbursts, and streaks, mostly in peripheral vision. Some crew members could tell the flashes were occurring in only one eye. Weitz reported seeing what he believed were cosmic particles producing entrance and exit streaks. This phenomenon is well documented in spaceflight and is understood to be caused by cosmic rays interacting with the retina, not by anything outside the spacecraft.

The most significant observation came from the second crew — Bean, Lousma, and Garriott. About a week before their splashdown, they spotted a bright reddish object that was brighter than any planet. It appeared to be slowly rotating with a roughly 10-second brightness cycle, and they tracked it for about 10 minutes before sunset. Based on how quickly it followed Skylab into Earth&#39;s shadow — roughly 5 seconds later — the crew estimated it was only 30 to 50 nautical miles away in a very similar orbit. They tried using onboard monitors to get a closer look but could never resolve it as anything more than a bright light. The object was never seen on any earlier or later orbit, and the crew recorded the sighting with precise timing and location data on channel A. Despite requesting an identification, NASA never explained what the object was. The crew themselves believed it was likely a satellite, but noted that no one could confirm which one.

The third crew — Carr, Pogue, and Gibson — reported seeing flashing lights outside the station with definite motion relative to Skylab. One or two of the objects appeared to be tumbling, based on the oscillation of their light. The crew presumed these were other pieces of Skylab or possibly other satellites, and reported the sightings on dump tapes as they occurred.</div>
