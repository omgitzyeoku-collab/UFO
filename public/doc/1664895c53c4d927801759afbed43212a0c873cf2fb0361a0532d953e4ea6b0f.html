  <h1>Commercial Flight Crew Reports Unidentified Lights at 36,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/1664895c53c4d927801759afbed43212a0c873cf2fb0361a0532d953e4ea6b0f.jpg" alt="Commercial Flight Crew Reports Unidentified Lights at 36,000 Feet thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report documents the crew of a commercial Embraer E170 flight observing multiple unidentified lights while cruising at 36,000 feet on 20 January 2024. The lights were not detected on air traffic control radar, the crew could not determine their distance or altitude, and the case was closed without explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under record number 237UAP00340. It records a sighting by the crew of commercial flight ENY3914, an Embraer E170 operating from Lexington, Kentucky (LEX) to Dallas/Fort Worth (DFW), on 20 January 2024 at 02:35.

While flying westbound at 36,000 feet, approximately 33 nautical miles north of MKS (coordinates 3605N/8851W), the crew reported seeing multiple lights off the right side of the aircraft. The lights were dimming and intensifying. The crew was unable to determine the distance or altitude of whatever they were observing.

The observation was purely visual — no onboard instruments or equipment were used during the sighting. The phenomenon did not appear on the air traffic control (ATC) facility radar system. The FAA&#39;s Airway Operations (AWO) office was notified.

The case is marked as Closed. The report contains no identification or resolution of what the lights were. There is little evidence of redaction in the document, but the record includes no tail number for the aircraft and no corroborating data from radar or other sources.</div>
