  <h1>American Airlines Crew Reports Multiple Separating Lights Near California Coast</h1>
  <div class="meta">
    <span class="badge">FAA</span>

    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/8a30a06d807dab84de3d1baf428eda159800257de4aa3e413bf4af41ea777aad.jpg" alt="American Airlines Crew Reports Multiple Separating Lights Near California Coast thumbnail" loading="lazy" />
  <p>This FAA preliminary notification records a UAP sighting by the crew of American Airlines Flight 266 on July 20, 2023, while approaching Los Angeles at 14,000 feet. The crew described multiple lights that appeared to separate; no evasive action was taken, and no follow-up investigation is included in this document.</p>
  <div class="narr">On July 20, 2023, the crew of American Airlines Flight 266 — an Airbus A321 flying from Lihue, Hawaii to Los Angeles — reported an unidentified aerial phenomenon to air traffic control. The aircraft was eastbound at 14,000 feet, roughly 16 nautical miles west-southwest of Camarillo, California, when the sighting occurred.

The crew described the phenomenon as multiple lights that appeared to separate. Los Angeles ARTCC (Air Route Traffic Control Center), the regional air traffic control facility, was advised of the report. The crew did not take evasive action, indicating the object or lights were not perceived as an immediate collision threat.

The document itself is an FAA Washington Operations Center preliminary incident notification — essentially a standardised form used to log the initial report as relayed through air traffic control. It is not an investigation report and contains no radar data, sensor evidence, photographs, or any independent corroboration of what the crew observed.

The FAA assigned the record identifier 237UAP00525 and reference number WOC 7-3333. The coordinates logged place the sighting over the Pacific Ocean just off the Ventura County coastline. A minor date discrepancy exists: the report timestamp reads July 20, 2023 at 21:53 Pacific time, while the document title references July 21, 2023, likely reflecting the UTC calendar date.

No conclusion about the nature of the phenomenon is offered anywhere in the document. The FAA recorded what the crew reported and nothing more.</div>
