  <h1>Airline Crew Reports Splitting Light at 50,000 Feet Over Buffalo</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/bba0cab014bec0a2133a4acaa60de7061bd3b0188524eda84a313cdc08e8c39e.jpg" alt="Airline Crew Reports Splitting Light at 50,000 Feet Over Buffalo thumbnail" loading="lazy" />
  <p>An FAA incident report records that the crew of United Airlines flight 541, flying from Denver to Boston on 28 October 2023, observed a single light split into two lights moving in a criss-cross pattern at 50,000–60,000 feet over the Buffalo, NY area. No evasive action was taken, and the report is marked as preliminary.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed on 28 October 2023 at approximately 04:20 Eastern time. It records a UAP sighting reported by the crew of United Airlines flight 541, a Boeing 737 MAX 8 operating from Denver to Boston.

According to the report, the flight crew observed a single light that split into two lights flying in a criss-cross pattern. The objects were estimated at flight level 500–600, corresponding to roughly 50,000–60,000 feet — well above the service ceiling of most commercial and military aircraft. The sighting occurred over the Buffalo, NY area, at coordinates 42.84°N, 79.51°W. The crew did not take evasive action.

The observation was relayed through Cleveland Air Route Traffic Control Center (ARTCC) to FAA Operations. The report carries the reference code WOC 7-3333 JGJF.

The document is labelled &#39;PRELIM INFO&#39;, meaning it represents an initial account rather than a completed investigation. There is no indication in the report of any follow-up analysis, radar corroboration, or agency conclusion about what the crew observed.</div>
