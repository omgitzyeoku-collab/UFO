  <h1>U.S. Air Force Drone Spotted One UAP Over Strait of Hormuz</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">10/1/20</span>
    <span class="badge">Strait of Hormuz</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/ad3b37eb9fbd20e6dc75152e486514e58ff8a1edde3d32615887ea0d19727884.jpg" alt="U.S. Air Force Drone Spotted One UAP Over Strait of Hormuz thumbnail" loading="lazy" />
  <p>A heavily redacted U.S. military mission report describes a 21-hour unmanned surveillance flight over the Strait of Hormuz on 1–2 October 2020, during which the operator logged one Unidentified Anomalous Phenomenon (UAP) at 1829Z. The actual description of what was observed is redacted — the report references an &quot;Observation Line 1&quot; that does not appear in the released text.</p>
  <div class="narr">This document is a Mission Report (MISREP) from the 482nd Attack Squadron, a U.S. Air Force unit operating under U.S. Central Command (CENTCOM). It covers a roughly 21-hour aerial reconnaissance flight that took off from OKAS airfield on 1 October 2020 and landed the following day. The unmanned aircraft was supporting U.S. Naval Forces Central Command (NAVCENT) operations across the Arabian Gulf, Strait of Hormuz, and Gulf of Oman.

During the flight, the operator received five radio challenges — known as guard calls — from Iranian air defense. These were described as professional or directive in tone and had no impact on the mission. The aircraft also made conventional observations: an unidentified plane on the runway at Abu Musa Island, later assessed to be an ATR 72-500 turboprop, and a possible NASER-class fast-attack craft docked near the Bushehr boatyard in Iran.

At 1829Z on 2 October, the operator recorded one UAP. The report directs readers to &quot;Observation Line 1&quot; for details, but that section is either missing or redacted from the released document. No description of the object&#39;s shape, size, movement, or behavior survives in the available text.

Heavy haze throughout the mission limited the usefulness of imagery intelligence (IMINT), and the report notes that no intelligence gaps were filled. Full-motion video from the flight was processed by DGS-1, a ground-based exploitation unit, but the results are not included in this release.

The document was declassified on 16 March 2026 by Major General Richard A. Harrison, CENTCOM Chief of Staff. Substantial portions remain redacted, including the aircraft type, callsign, operation name, personnel names, grid coordinates, and — critically — the UAP observation itself.</div>
