  <h1>FAA Report: Green Fireball Seen Near Memphis in November 2021</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/0c210e7e0eac54a3baa71911efdbc78a45d489ec00446ef2592f18242222e117.jpg" alt="FAA Report: Green Fireball Seen Near Memphis in November 2021 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a large green fireball observed by Harding County residents and independently by an off-duty air traffic controller approximately 82 nautical miles east of Memphis on 20 November 2021. The case was closed with no identification or resolution noted.</p>
  <div class="narr">This document is a single-page FAA SKYWATCH incident report filed under the classification &quot;Unidentified Aerial Phenomenon.&quot; It describes an event that took place at approximately 06:10 on 20 November 2021, roughly 82 nautical miles east of Memphis.

Residents of Harding County reported a large green fireball to the Harding County Sheriff. They described it as travelling like a shooting star. Separately, a controller at the Memphis Air Route Traffic Control Centre (ZME) observed the same phenomenon while on break, providing an independent second account.

The FAA&#39;s Airway Operations (AWO) office was notified. The report was flagged as paged, meaning it triggered an alert within the FAA&#39;s notification system. Despite this, the document is only a single page and contains no references to radar data, instrument recordings, or any follow-up investigation.

The case status is listed as &quot;Closed,&quot; but no resolution or identification of the object is provided. The report does not conclude what the phenomenon was — it simply records the observations and closes the file.

The description of a fast-moving green fireball is consistent with what astronomers would call a meteor or bolide, though the FAA report itself does not offer that or any other explanation.</div>
