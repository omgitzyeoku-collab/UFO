  <h1>CIA-UAP-D020, Memorandum on Unconventional Aircraft Sightings, 1955</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1955</span>
    <span class="badge">Azerbaijan</span>
    
  </div>
  <img class="thumb" src="/extract/thumbs/973be877f06b55373da6c7a1022ca25345fdeb7864414fe4ae29d83ef963b7e9.jpg" alt="CIA-UAP-D020, Memorandum on Unconventional Aircraft Sightings, 1955 thumbnail" loading="lazy" />
  <p>This memorandum summarizes a Central Intelligence Agency (CIA) debriefing of a group of four individuals who reported observing a “flying saucer” or “unconventional aircraft” in 1955. The group, which included U.S. Senator Richard Russell, a U.S. military service member, and two U.S. Government officials, reported observing a luminescent “greenish-yellow” phenomenon, as seen from aboard a train while traveling within the Soviet Union, in present-day Azerbaijan, between Baku and Tiflis (Tbilisi, Georgia). The document concludes by stating that the observation can “probably be explained as steep climbing aircraft or missiles,” and that “the evidence does not appear sufficiently firm to warrant the conclusion that the Soviets have developed […] a radically new type of aircraft.” The document “CIA-UAP-D021” contains a contemporary analysis of the incident.</p>
