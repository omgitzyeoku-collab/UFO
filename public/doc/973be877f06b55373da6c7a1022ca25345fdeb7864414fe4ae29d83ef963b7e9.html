  <h1>1955 CIA memo weighs Soviet train sighting of a luminous object</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1955</span>
    <span class="badge">Azerbaijan</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/973be877f06b55373da6c7a1022ca25345fdeb7864414fe4ae29d83ef963b7e9.jpg" alt="1955 CIA memo weighs Soviet train sighting of a luminous object thumbnail" loading="lazy" />
  <p>This is a two-page Top Secret internal memorandum from the US Central Intelligence Agency (CIA), dated 1 November 1955, summarising a debriefing of witnesses who reported seeing a luminous object from a moving train inside the Soviet Union. The memo concludes the sighting can probably be explained as steep-climbing aircraft or missiles, and that the available evidence is not firm enough to say the Soviets had built a radically new type of aircraft. It was signed by H. H. Scoville, Jr. of the CIA&#39;s Office of Scientific Intelligence.</p>
  <div class="narr">This document is an internal CIA memorandum marked Top Secret, running to two pages, with a Top Secret signature and cover routing sheet attached. It records a debriefing — an after-the-event interview — of a group of witnesses who reported an unusual sighting.

According to the memo, the witnesses observed a luminous object rising into the sky while travelling on a train inside the Soviet Union. War.gov&#39;s catalogue assigns the incident to 1955 in Azerbaijan, which was then part of the Soviet Union; the specific place names come from that catalogue rather than from clearly legible text in the document itself.

The CIA&#39;s assessment was cautious. The memo concludes the sighting can probably be explained as steep-climbing aircraft or missiles, and that the evidence was not solid enough to conclude the Soviets had developed a radically new type of aircraft. In other words, the agency treated the report as an ordinary phenomenon rather than as confirmation of anything extraordinary.

The memorandum is dated 1 November 1955, drafted the previous day (31 October 1955), and signed by H. H. Scoville, Jr. of the CIA&#39;s Office of Scientific Intelligence (OSI), the branch that analysed foreign scientific and technical developments.

Rather than being blacked out, the main difficulty with this record is legibility: the scanned text is heavily degraded, so several passages are hard to read and some details had to be reconstructed. Little appears to be formally redacted, but the poor scan quality means some quotations should be checked against the original.</div>
