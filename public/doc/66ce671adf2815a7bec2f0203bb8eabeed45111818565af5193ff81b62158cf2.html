  <h1>CIA Filed Unevaluated Report on Flying Objects Seen Over Budapest</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1956</span>
    <span class="badge">Budapest, Hungary</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/66ce671adf2815a7bec2f0203bb8eabeed45111818565af5193ff81b62158cf2.jpg" alt="CIA Filed Unevaluated Report on Flying Objects Seen Over Budapest thumbnail" loading="lazy" />
  <p>This 1956 CIA information report documents unusual flying object sightings and related scientific activity reported by a sub-source in Budapest, Hungary. The document is almost entirely illegible due to extreme redaction and degradation, and the CIA marked it as unevaluated — meaning it never assessed whether the information was reliable.</p>
  <div class="narr">In 1956, the CIA produced an information report titled &quot;Report of Unusual Flying Object Sightings and Attendant Scientific Activity,&quot; based on reporting from a sub-source in Budapest, Hungary. The document is classified as an image-type record — a photostatic copy of an original letter held by the CIA Library.

The substance of the report is almost entirely unreadable. The document suffers from extreme redaction and severe degradation, likely the result of poor-quality scanning and optical character recognition. What little text survives is garbled fragments that do not form coherent sentences. The contextual details — Budapest as the location, 1956 as the date, and references to flying object sightings — come primarily from the catalogue metadata rather than legible text within the document itself.

The CIA stamped the report as &quot;unevaluated,&quot; a designation visible in the surviving text (rendered in the degraded scan as &quot;UNCYALUATED&quot;). This means the agency filed the information but never made a judgement about whether the source or the claims were credible.

No named witnesses, specific object descriptions, or agency conclusions can be extracted from the visible portions of the document. The report stands as a record that the CIA received and catalogued a sighting report from Cold War-era Hungary, but the actual content of that report remains effectively inaccessible.</div>
