  <h1>FedEx Crew and Second Pilot Report Three-Light UAP Over Florida</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/dd12334aae2912f9192f44ba2668d5109dd8ecf662965f97e81acb386e15d0dd.jpg" alt="FedEx Crew and Second Pilot Report Three-Light UAP Over Florida thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting on 22 November 2023 in which the crew of a FedEx Boeing 767 observed three lights arranged vertically then horizontally while flying at 14,000 feet east of Southwest Florida International Airport. A second aircraft independently confirmed the sighting, but the object did not appear on air traffic control radar, and the case was closed without identification.</p>
  <div class="narr">On 22 November 2023 at 00:42 UTC, the crew of FedEx flight FDX3184 — a Boeing 767 on a commercial route from JPX to Fort Lauderdale (FLL) — reported an unidentified aerial phenomenon off the left side of their aircraft. They were flying eastbound at 14,000 feet, approximately 36 nautical miles east of RSW (Southwest Florida International Airport).

The crew described the phenomenon as three lights that appeared first in a vertical arrangement, then shifted to a horizontal orientation, at the same altitude as the aircraft. The sighting was independently corroborated by a second aircraft, a Learjet 60 with registration N516WP, which was routing from PTK to FXE and confirmed seeing the same thing.

Despite two separate flight crews observing the phenomenon, air traffic control radar did not detect any object in the area. The FAA logged the event through its SKYWATCH incident reporting system.

The report is marked as closed. No resolution or identification of the phenomenon is recorded in the document. No physical evidence or sensor data beyond the visual observations of the two flight crews was collected.</div>
