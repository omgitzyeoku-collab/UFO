  <h1>JetBlue Crew Reported Flashing Lights Over Kansas at 36,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/357adb68ffd2fdedc759bdbfc01542912b11f690eb828ae8ae66af9131cd62bb.jpg" alt="JetBlue Crew Reported Flashing Lights Over Kansas at 36,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident notification records a February 2023 sighting by the crew of JetBlue flight 1211, who observed multi-coloured flashing lights directly ahead of their Airbus A321neo while cruising at 36,000 feet south of Kansas City. The document is a preliminary report only — no explanation for the lights is offered and no follow-up investigation is included.</p>
  <div class="narr">On the evening of 3 February 2023, the crew of JetBlue flight 1211 — an Airbus A321neo flying from New York&#39;s JFK to Las Vegas — reported an unusual sighting to air traffic control. While heading westbound at flight level 360 (approximately 36,000 feet), roughly 36 nautical miles south of Kansas City International Airport, the crew observed multi-coloured flashing lights directly ahead of their aircraft at the 12 o&#39;clock position.

Kansas City Air Route Traffic Control Center (ARTCC), the regional ATC facility responsible for high-altitude traffic in that area, relayed the report to the FAA&#39;s Washington Operations Center. The crew did not take evasive action, and no law enforcement notification was made.

The document itself is a standard FAA operations centre incident notification — essentially a log entry recording what was reported, when, and by whom. It does not identify or resolve what the lights were. There is no radar data, no corroborating witness accounts from other aircraft, and no record of a follow-up investigation in this filing.

This is one of hundreds of UAP-related records released by the Department of War&#39;s PURSUE programme. On its own it establishes only that a commercial flight crew saw something they could not immediately explain and reported it through normal channels. The FAA logged it; that is as far as this particular document goes.</div>
