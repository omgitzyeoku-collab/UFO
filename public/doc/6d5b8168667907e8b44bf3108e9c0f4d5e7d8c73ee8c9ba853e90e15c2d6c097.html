  <h1>Southwest Airlines Pilot Reported Flashing Diamond-Pattern Lights Over Arkansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/6d5b8168667907e8b44bf3108e9c0f4d5e7d8c73ee8c9ba853e90e15c2d6c097.jpg" alt="Southwest Airlines Pilot Reported Flashing Diamond-Pattern Lights Over Arkansas thumbnail" loading="lazy" />
  <p>An FAA SKYWATCH incident report records a Southwest Airlines Boeing 737 crew observing flashing lights in a diamond pattern at high altitude while flying from Dallas to Nashville on 8 August 2022. The case was closed with no follow-up investigation details included in the document.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log pilot-reported sightings of unidentified aerial phenomena (UAP). It is classified under the primary code &quot;Unidentified Aerial Phenomenon&quot; and carries case number 237UAP00099.

On 8 August 2022, the crew of Southwest Airlines flight SWA2413, a Boeing 737 flying from Dallas Love Field (DAL) to Nashville (BNA), reported an unusual sighting while cruising at Flight Level 370 (approximately 37,000 feet). The crew described flashing lights travelling west to east in a diamond pattern at high altitude, observed off the left side of the aircraft while the plane was heading northeast. The sighting occurred roughly 15 nautical miles southeast of Little Rock, Arkansas.

The incident was reported through Memphis Air Route Traffic Control Center (ZME), and the FAA&#39;s UFO Reporting Center was notified by FAA headquarters in Denver (DEN). The report&#39;s status is marked as closed, but the document contains no details of any follow-up investigation, no radar data, and no additional witness statements.

The document is brief and administrative in nature. It records the pilot&#39;s account but offers no analysis, explanation, or conclusion about what was observed. The tail number field is blank, which limits the ability to independently verify the specific aircraft involved.</div>
