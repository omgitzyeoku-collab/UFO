  <h1>Delta Crew Reports Unidentified Object West of Denver at 32,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/6faf94b21fa769deeb0933515a9cbf8f3bf325230983ffda91e15f82f7df88a0.jpg" alt="Delta Crew Reports Unidentified Object West of Denver at 32,000 Feet thumbnail" loading="lazy" />
  <p>An FAA incident notification records that the crew of Delta flight 750, flying from Tampa to Seattle on 22 December 2023, reported an unidentified aerial phenomenon to their left while cruising at 32,000 feet roughly 50 nautical miles west of Denver. No evasive action was taken and no further investigation is documented here.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — essentially a short-form alert that something unusual was reported during a commercial flight. It is not an investigation, an analysis, or a conclusion. It simply records what was relayed to the FAA.

On the evening of 22 December 2023 at 9:00 PM Mountain Standard Time, the crew of Delta flight 750 — an Embraer E55P flying from Tampa to Seattle — reported seeing an unidentified aerial phenomenon at their 9 o&#39;clock position (to the left of the aircraft). The plane was heading northwest at flight level 320, which corresponds to approximately 32,000 feet, about 50 nautical miles west of Denver, Colorado. The coordinates given in the report (39.86°N, 105.61°W) place the aircraft in the Colorado Front Range area, consistent with that description.

The crew did not take evasive action, and no law enforcement was notified. Denver ARTCC (Air Route Traffic Control Center) relayed the report to FAA Operations. The document does not describe what the object looked like, how it moved, or how long it was visible.

No follow-up investigation, radar data, or additional witness accounts are included in this record. The FAA filing is a preliminary notification only — it documents that a report was made, not what the object was.</div>
