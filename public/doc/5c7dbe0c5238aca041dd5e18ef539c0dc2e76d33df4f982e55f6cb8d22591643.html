  <h1>Republic Airways Crew Reports Rapidly Moving Lights Over Pennsylvania</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/5c7dbe0c5238aca041dd5e18ef539c0dc2e76d33df4f982e55f6cb8d22591643.jpg" alt="Republic Airways Crew Reports Rapidly Moving Lights Over Pennsylvania thumbnail" loading="lazy" />
  <p>This FAA notification documents a January 2024 sighting by the crew of Republic Airways flight 4809, who reported two white and red rapidly moving lights while flying at 20,000 feet over central Pennsylvania. The document is a preliminary incident report, not a completed investigation, and contains no conclusions about what the lights were.</p>
  <div class="narr">On the evening of 26 January 2024, the crew of Republic Airways flight 4809 — an Embraer E75S operating from New York&#39;s JFK to Pittsburgh — reported an unidentified aerial phenomenon to air traffic control. The aircraft was flying westbound at Flight Level 200 (approximately 20,000 feet) near Philipsburg, Pennsylvania, at coordinates 40.89°N, 78.98°W.

The crew described seeing two rapidly moving lights that were white and red. Cleveland Air Route Traffic Control Center (ARTCC) relayed the pilot report to the FAA&#39;s Washington Operations Center at approximately 9:20 PM Eastern time. No evasive action was taken by the flight crew, and law enforcement was not notified.

The document itself is a standard FAA Operations Center incident notification — essentially a logging form used to record the initial report. It is not an investigation, and the FAA reached no conclusion about what the crew observed. There is no radar data, no corroborating witness accounts, and no follow-up analysis included.

The record carries minimal redaction. The initials JF/RL appear at the end, likely referring to the FAA operations staff who processed the report, but these individuals are not further identified. Beyond the colour and rapid movement of the lights, no additional details about the object&#39;s shape, size, or behaviour are provided.</div>
