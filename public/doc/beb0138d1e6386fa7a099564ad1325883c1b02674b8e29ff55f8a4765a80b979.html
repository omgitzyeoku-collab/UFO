  <h1>FAA Report: Pilot Spotted Balloon-Like Object at 37,000 Feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/beb0138d1e6386fa7a099564ad1325883c1b02674b8e29ff55f8a4765a80b979.jpg" alt="FAA Report: Pilot Spotted Balloon-Like Object at 37,000 Feet in 2023 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from 3 February 2023 documenting a pilot&#39;s sighting of a balloon-like unidentified aerial phenomenon with something hanging from its bottom. The case was closed with no resolution or identification noted.</p>
  <div class="narr">On 3 February 2023, the pilot of Alaska Airlines flight ASA402 — a Boeing 737 flying southeast from Seattle (SEA) toward Charleston (CHS) — reported an unidentified aerial phenomenon while cruising at flight level 370 (37,000 feet). The object appeared directly ahead at 12 o&#39;clock, roughly 20 nautical miles away, near the aviation fix MCM230025 in central US airspace.

The pilot in command described the object as balloon-like, with something hanging from the bottom. The FAA classified the report under its primary code for &quot;Unidentified Aerial Phenomenon&quot; and categorised the object description as a balloon.

The report is marked closed, but no resolution or formal identification of the object is recorded. There is no mention of radar data, photographs, or any corroborating evidence beyond the single pilot&#39;s account.

The timing is notable: this sighting occurred just days after the US military shot down a Chinese surveillance balloon in early February 2023, a period when pilots and controllers nationwide were on heightened alert for airborne objects. The pilot&#39;s categorisation of the object as a balloon may reflect that heightened awareness.</div>
