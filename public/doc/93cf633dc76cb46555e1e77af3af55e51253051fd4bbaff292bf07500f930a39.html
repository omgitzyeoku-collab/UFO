  <h1>Two Spirit Airlines Crews Reported Unexplained Lights Over the Atlantic in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/93cf633dc76cb46555e1e77af3af55e51253051fd4bbaff292bf07500f930a39.jpg" alt="Two Spirit Airlines Crews Reported Unexplained Lights Over the Atlantic in 2023 thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents two separate Spirit Airlines flights reporting an unidentified aerial phenomenon on 27 June 2023 over the Atlantic/Caribbean region. Both crews described lights high above them, possibly satellites, and the case was closed with no further investigation documented.</p>
  <div class="narr">This is a one-page FAA SKYWATCH incident report filed under case number 237UAP00271. It records an unidentified aerial phenomenon observed on 27 June 2023 at 04:11 UTC. The report was generated within the Miami Air Route Traffic Control Center (ZMA) under Mandatory Occurrence Report ID ZMA-M-2023/06/27-0001.

Spirit Airlines flight NKS1900, an Airbus A319 flying from Aguadilla, Puerto Rico (BQN) to Orlando (MCO), reported the phenomenon while heading northwest at 38,000 feet over coordinates 24.05N, 74.57W — roughly over the Bahamas. A second Spirit Airlines flight, NKS1246, independently reported the same phenomenon while at 34,000 feet over 21.42N, 70.51W, a position further southeast near the Turks and Caicos Islands.

Both crews described what they saw as lights high above them, and both suggested the lights may have been satellites. The report notes that no law enforcement information was provided on the Mandatory Occurrence Report.

The case is marked as Closed. No follow-up analysis, radar data, sensor data, or supplementary investigation materials are included in this document.</div>
