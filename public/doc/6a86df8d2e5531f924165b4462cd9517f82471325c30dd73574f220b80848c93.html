  <h1>Two Commercial Flights Reported UAP Over Indiana in 2022</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/6a86df8d2e5531f924165b4462cd9517f82471325c30dd73574f220b80848c93.jpg" alt="Two Commercial Flights Reported UAP Over Indiana in 2022 thumbnail" loading="lazy" />
  <p>An FAA operations center log from December 2022 records that crews aboard a UPS cargo flight and a JetBlue passenger flight independently reported unidentified aerial phenomena directly ahead of them near Winamac, Indiana. The object appeared to be travelling eastbound at 50,000–60,000 feet — well above the altitude ceiling of either aircraft — and neither crew took evasive action.</p>
  <div class="narr">This document is a brief incident notification from the FAA&#39;s Washington Operations Center, logged on 12 December 2022 at 3:30 AM Central Standard Time. It is not a full investigation report — it is the kind of short-form entry air traffic operations staff file when something unusual is called in.

Two commercial flights reported the same unidentified aerial phenomena at roughly the same time and place: UPS flight 2897, a Boeing 767-300 cargo aircraft, and JetBlue flight 2924, an Airbus A321 passenger jet. Both crews described the object as being at their 12 o&#39;clock position — directly ahead. The location was approximately 20 nautical miles west of Rensselaer, Indiana, near the town of Winamac.

The log notes the phenomena appeared to be travelling eastbound at an altitude between FL500 and FL600, which translates to 50,000–60,000 feet. That range is significant because it sits well above the maximum operating ceiling of both aircraft types involved, which top out around 40,000–45,000 feet. Neither crew took evasive action, and no law enforcement agency was notified.

The FAA categorised the event as &quot;Miscellaneous,&quot; which suggests it was not escalated for further investigation at the time of filing. No follow-up report, radar data, or additional corroboration is included in this release.</div>
