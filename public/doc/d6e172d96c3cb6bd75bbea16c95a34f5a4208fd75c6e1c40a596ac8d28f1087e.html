  <h1>USAF F-35 pilot reported sensor and visual detection of unidentified object over Arizona</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d6e172d96c3cb6bd75bbea16c95a34f5a4208fd75c6e1c40a596ac8d28f1087e.jpg" alt="USAF F-35 pilot reported sensor and visual detection of unidentified object over Arizona thumbnail" loading="lazy" />
  <p>This FAA operations centre notification records a February 2023 incident in which a US Air Force F-35 fighter jet detected an unidentified object both on its sensors and visually while flying near Glendale, Arizona. The pilot could not identify the object, which was travelling in a different direction and at a higher altitude than the jet.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification dated 27 February 2023. It is a preliminary internal report, not a completed investigation or case file. The notification was relayed by Albuquerque Air Route Traffic Control Center (ARTCC), the air-traffic facility responsible for that airspace.

According to the report, a US Air Force F-35 fighter jet operating under the callsign BLOOD01 was flying westbound at 12,500 feet, approximately 68 nautical miles west-northwest of Luke Air Force Base near Glendale, Arizona. At 12:10 PM local time (MST), the pilot reported both a sensor hit and a visual sighting of an object at the aircraft&#39;s 2 o&#39;clock position. The unidentified object was travelling northeast at flight level 185 — roughly 18,500 feet, some 6,000 feet above the F-35.

The pilot in command could not identify the object. The document provides no description of the object&#39;s shape, size, speed, or behaviour beyond its heading and altitude. There is no indication that the FAA or any other agency conducted a follow-up investigation based on this notification alone.

The report shows minimal redaction. It is a single-page operational log entry rather than a detailed analytical product. No radar data, photographs, or additional witness accounts are included.</div>
