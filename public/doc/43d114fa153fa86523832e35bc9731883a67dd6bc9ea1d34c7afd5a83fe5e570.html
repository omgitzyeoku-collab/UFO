  <h1>U.S. Military Infrared Video Shows Unidentified Object Over Yellow Sea</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2023</span>
    <span class="badge">Yellow Sea</span>
    <span class="badge">verified</span>
  </div>
  
  <p>This is a 1-minute-10-second infrared video, likely recorded by a U.S. military platform above the Yellow Sea in January 2023, showing an unidentified area of contrast moving through the sensor&#39;s field of view. The video was part of a collection of materials on a classified network that the Pentagon&#39;s UAP office flagged as lacking a verified chain of custody.</p>
  <div class="narr">In January 2023, a U.S. military platform operating above the Yellow Sea recorded a roughly 70-second infrared video. The footage shows an area of contrast — an anomaly visible on the heat-sensing camera — entering the frame from the left and exiting toward the right while the camera operator pans and adjusts zoom. The person who uploaded it to a classified network in June 2024 titled it &quot;Spherical UAP in clouds,&quot; though that label is informal and not an official determination of what the object is.

The video came to public attention after eight members of the U.S. House of Representatives requested access to 51 potentially UAP-related records on 6 March 2026. The All-domain Anomaly Resolution Office (AARO) — the Pentagon body responsible for investigating unidentified aerial phenomena — identified a collection of responsive materials held on a classified network, of which this video is one.

AARO noted a significant caveat: many of these materials lack a substantiated chain of custody, meaning their authenticity and origin cannot be fully verified. The office also uses the word &quot;likely&quot; when attributing the video to a U.S. military platform, indicating it is not certain of the source.

The document falls under the Indo-Pacific Command (INDOPACOM) area of responsibility. Beyond the infrared imagery itself, no details about the object&#39;s shape, size, altitude, speed, or behaviour have been officially confirmed. The object is described only as &quot;an area of contrast&quot; on the sensor — nothing more.</div>
