  <h1>FAA Report: Pilot Spotted Balloon-Like Object at 50,000 Feet Over Kansas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/92b3ec59d9160a3510ed5537035ee17725e3762e0b4df5fc90a3e247cc1d97bc.jpg" alt="FAA Report: Pilot Spotted Balloon-Like Object at 50,000 Feet Over Kansas thumbnail" loading="lazy" />
  <p>This is a closed FAA incident report from February 2023 in which a commercial pilot flying at 34,000 feet reported an unidentified balloon-like object at roughly 50,000 feet over northwest Kansas. The FAA classified it as an Unidentified Aerial Phenomenon and closed the case without a public explanation.</p>
  <div class="narr">On 3 February 2023 at 14:34 UTC, a commercial aircraft with the callsign SCX8941 — a Sun Country Airlines flight travelling southbound from Minneapolis-Saint Paul (MSP) to Kelly Field/Lackland AFB (SKF) in San Antonio — reported an unusual sighting to air traffic control. The crew was flying at FL340, roughly 34,000 feet, when they observed an unidentified object well above them.

The object was described as balloon-like and was estimated at approximately FL500, or 50,000 feet — far above normal commercial flight altitudes. Its position was logged as about 15 nautical miles west-northwest of the Sabetha VOR (RBA) navigation point, roughly 60 nautical miles northwest of Kansas City (MCI). The report was handled by the Denver (DEN) office and routed through Kansas City Center (ZKC).

The FAA filed this under its SKYWATCH programme with the primary code &quot;Unidentified Aerial Phenomenon.&quot; The case status is listed as Closed. No resolution or identification of the object appears in the released document.

The date is notable: 3 February 2023 fell during the wave of high-altitude balloon incidents over the United States, including the Chinese surveillance balloon that was eventually shot down on 4 February. Whether this sighting is connected to those events is not stated in the report.</div>
