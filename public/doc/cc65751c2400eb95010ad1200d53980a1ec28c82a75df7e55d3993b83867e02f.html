  <h1>FBI Interview Records Witness Account of Two Red Orbs in Northeast US</h1>

  <p>This FBI FD-302 interview report documents a witness describing two luminous red spheres, each roughly one metre across, hovering below the tree line in their backyard in the northeastern United States one evening in February 2026. The document is heavily redacted — all names, locations, employers, and interviewing agents are blacked out — and the text cuts off mid-sentence before the full account is complete.</p>
  <div class="narr">This document is an FBI FD-302 — the Bureau&#39;s standard form for recording witness interviews. In February 2026, FBI agents interviewed a witness via Microsoft Teams videoconference about an unusual sighting in the northeastern United States. The witness holds a bachelor&#39;s degree in economics and finance; beyond that, nearly all identifying details — name, employer, educational institution, and precise location — are redacted.

According to the witness, the incident occurred at approximately 9:15 PM EST as they arrived home. They noticed an intensely bright light hovering below the tree line in the middle of their backyard. They attempted to retrieve their phone from their vehicle to record video. A second person in the household checked security cameras, saw the witness standing by their vehicle looking into the yard, and came outside to observe as well.

The witness described the object as a red sphere about one metre in diameter. They called the colour &quot;brilliant and beautiful&quot; and unlike any shade of red they had seen before. At the centre of the sphere, they reported what they described as a &quot;white plasma sun&quot; roughly the size of a basketball. After a period of observation, the orb moved upward and to the witnesses&#39; left. At that point, both witnesses noticed a second, identical orb hovering nearby. The document cuts off mid-sentence at this point, so the full account of the second object is incomplete.

The FBI&#39;s interview record does not contain any stated conclusion about what the objects were. It is a witness statement, not an analytical finding. The document references two related FBI files — FBI-UAP-D010 and FBI-UAP-PR004 — which may contain further information but are not included here.</div>
