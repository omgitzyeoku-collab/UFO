  <h1>U.S. Air Force Crew Spotted Diamond-Shaped Object Over the Mediterranean in 2024</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">1/25/24</span>
    <span class="badge">Mediterranean Sea</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bd5478d2e420f6ff46fb06014e39027e1caa415f55efdc9bd70a849ff6990356.jpg" alt="U.S. Air Force Crew Spotted Diamond-Shaped Object Over the Mediterranean in 2024 thumbnail" loading="lazy" />
  <p>A formerly secret U.S. military mission report describes a single diamond-shaped unidentified object observed by a special operations surveillance aircraft over the eastern Mediterranean on 25 January 2024. The object was only visible on an infrared camera, traveled at an estimated 434 knots, and the roughly two-minute encounter ended without incident.</p>
  <div class="narr">This document is a U.S. military Mission Report originally classified SECRET and shared with Five Eyes allies. It was declassified on 24 October 2025 by Major General Richard A. Harrison, chief of staff at U.S. Central Command — notably 25 years ahead of its original 2049 declassification date, suggesting it was released as part of a broader disclosure effort rather than an individual review.

On 25 January 2024, an intelligence, surveillance, and reconnaissance (ISR) aircraft from the 33rd Special Operations Squadron took off from a base in Cyprus at 0109Z on a mission lasting over 20 hours. At 0509Z, while in transit over the eastern Mediterranean at 25,000 feet, a crew member — a Senior Airman, a relatively junior enlisted rank — spotted a single unidentified object roughly 5,000 feet below the aircraft. The object was described as a solid, round diamond shape with a straight, non-maneuvering probe or tail at its bottom. It was heading west at an estimated 434 knots, more than twice the observing aircraft&#39;s speed of 176 knots. The object held a steady flight path and did not change direction, though it varied slightly in altitude.

Critically, the object appeared only on the aircraft&#39;s Short-Wave Infrared (SWIR) camera, showing as a white-hot signature. No other sensor detected it, no IFF (identification friend-or-foe) interrogation was attempted, and no other aircraft or ground station independently observed it. The encounter lasted approximately two minutes, ending at 0511Z. The crew assessed the object as benign. It had no effect on the aircraft&#39;s equipment or personnel, and no materials were recovered.

The report is heavily redacted. The aircraft type, callsign, tail number, exact coordinates, operation name, and the observer&#39;s identity are all blacked out under national security and privacy exemptions. All speed, altitude, and position figures for the object are explicitly marked as estimates rather than instrument measurements. The report does not offer any conclusion about what the object was — its propulsion and whether it was under intelligent control are both listed as unknown.</div>
