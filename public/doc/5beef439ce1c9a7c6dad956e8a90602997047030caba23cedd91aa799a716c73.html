  <h1>Four Airline Crews Report Green-White Lights Above Denver at Night</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5beef439ce1c9a7c6dad956e8a90602997047030caba23cedd91aa799a716c73.jpg" alt="Four Airline Crews Report Green-White Lights Above Denver at Night thumbnail" loading="lazy" />
  <p>This FAA operations center notification documents a UAP sighting on August 25, 2023, in which the crew of United Airlines flight 369 and three other aircraft reported seeing 2–4 white lights with a green hue moving in a circular pattern above them near Denver, Colorado. No evasive action was taken and no investigation findings are included — this is a preliminary incident report, not a conclusion.</p>
  <div class="narr">On the night of August 25, 2023, at approximately 12:25 AM Mountain time, the crew of United Airlines flight 369 — a Boeing 737 MAX 8 flying from Newark to Las Vegas — reported unusual lights to Denver Air Route Traffic Control Center (ARTCC). The aircraft was cruising at flight level 340, roughly 34,000 feet, in the vicinity of Denver, Colorado (coordinates approximately 39.86°N, 104.67°W).

The crew described seeing 2 to 4 unidentified aerial phenomena: white lights with a green hue moving in a circular motion above the aircraft. Pilots noted the activity appeared near the Big Dipper constellation at what they judged to be high altitude — well above their own cruising level.

Three other aircraft — identified as CMP477, SWA5298, and N8TZ — independently reported similar sightings. No evasive action was taken by any crew, and no law enforcement was notified.

This document is an FAA Washington Operations Center incident notification — essentially an internal alert that something was reported. It is not a completed investigation. There is no mention of radar data, sensor corroboration, or any follow-up analysis. The document records what pilots saw and reported; it draws no conclusions about what the objects were.</div>
