  <h1>FedEx Cargo Crew Reports Triangle Lights Over Atlantic at 40,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/164129e7889a81708f80002940e604df3647c55a9afb0e5dce7861eb153b67b3.jpg" alt="FedEx Cargo Crew Reports Triangle Lights Over Atlantic at 40,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident notification records a May 2023 sighting by a FedEx cargo flight crew who observed triangle-shaped lights brightening and dimming while flying at 40,000 feet over oceanic airspace near Miami. A second aircraft independently reported a similar sighting, but no investigation findings are included — this is a preliminary report only.</p>
  <div class="narr">On May 29, 2023, the crew of FedEx flight 64 — an MD-11 cargo aircraft flying from San Juan, Puerto Rico, to Memphis, Tennessee — reported an unidentified aerial phenomenon to air traffic control. The aircraft was cruising at flight level 400 (approximately 40,000 feet) in Miami ARTCC oceanic airspace, over the Atlantic.

The crew described triangle-shaped lights that were brightening and dimming, visible from their 2 o&#39;clock position (to the front-right of the aircraft) as they flew northeast. They did not take evasive action. No law enforcement was notified.

The sighting was corroborated by a second aircraft, identified as CMP64, which reported a similar observation. However, no details of that second sighting are provided in this document.

This record is an FAA Washington Operations Center incident notification — essentially a preliminary intake form. It contains no radar data, no sensor readings, no photographs, and no investigation conclusions. The coordinates listed (25.76, -80.19) correspond to central Miami and likely represent the reporting facility, not the exact location of the sighting, which occurred in oceanic airspace.

The document is marked as preliminary information. There is no indication that a full investigation followed, nor any explanation offered for what the lights were.</div>
