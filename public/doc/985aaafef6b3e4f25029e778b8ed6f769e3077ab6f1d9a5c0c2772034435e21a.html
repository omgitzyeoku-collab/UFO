  <h1>Pilot Reports Shiny Object and Contrail at 33,000 Feet Over US</h1>
  <div class="meta">
    <span class="badge">FAA</span>

    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/985aaafef6b3e4f25029e778b8ed6f769e3077ab6f1d9a5c0c2772034435e21a.jpg" alt="Pilot Reports Shiny Object and Contrail at 33,000 Feet Over US thumbnail" loading="lazy" />
  <p>This FAA incident report from August 2014 documents a commercial airline pilot observing an unidentified contrail and a shiny object roughly 1,000 feet above their aircraft. FAA radar showed no traffic in the area, and the case was closed with the pilot referred to the National UFO Reporting Center.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under record number 237UAP00019. It records an event on 10 August 2014 at 07:30, when the pilot-in-command of flight SKW2393 — a Canadair Challenger 800 regional jet (designated CRJ2) — reported seeing a UFO contrail and something shiny at flight level 330 (approximately 33,000 feet). The aircraft was assigned flight level 320 at the time, meaning the object appeared about 1,000 feet above them. The sighting location is recorded as MLS330040, an FAA navigational reference point.

The flight originated from PSC (Tri-Cities Airport in Washington state) and was routed to FAR (Hector International Airport in Fargo, North Dakota). When the report reached FAA headquarters in Denver, their radar equipment showed no traffic in the reported area — meaning whatever the pilot saw did not appear on conventional tracking systems.

The FAA closed the case without further investigation. Denver headquarters referred the pilot to the National UFO Reporting Center, following standard FAA procedure under Order 7210.3, section 4-7-4. The report was categorised under the primary code &quot;OTHER.&quot; No identification of the object was attempted or recorded.</div>
