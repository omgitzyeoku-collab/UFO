  <h1>Federal Agent Reports Hours of Orange Lights Over Western US</h1>
  <div class="meta">
    <span class="badge">Department of War</span>

  <img class="thumb" src="/extract/thumbs/30fdaa89551833873ad688b6417e3af25ccddc855b48813ee5c2d90d760295d6.jpg" alt="Federal Agent Reports Hours of Orange Lights Over Western US thumbnail" loading="lazy" />
  <p>This unclassified memorandum from the Office of the Under Secretary of War contains a first-person account from a U.S. federal law enforcement special agent (designated Witness 4) who reported observing multiple unidentified lights and orbs over a 2–3 hour period one evening in October 2023 in the western United States. The document is a single-witness narrative with no accompanying sensor data, photographs, or video.</p>
  <div class="narr">This document, dated 2 June 2026 and issued by the Office of the Under Secretary of War, is a witness narrative submitted to the All-domain Anomaly Resolution Office (AARO). It recounts a sighting by a federal law enforcement special agent — one of several agents who reported observing unidentified anomalous phenomena over a two-day period in October 2023 in the western United States. This particular account covers only Witness 4&#39;s experience.

Just after sunset, around 7 PM, the witness reported seeing a bright ball of light streak across a hillside less than a quarter mile away, lasting one to two seconds. The light shifted in colour from amber to orange to yellow to white. No mechanical sounds or aircraft noise were heard. Using night vision goggles, the witness then observed additional lights not visible to the naked eye, some organised in evenly spaced lines of three at various altitudes above the skyline.

Over the following hours, the witness described very bright orange lights that appeared to eject smaller orange lights — a behaviour the witness likened to &quot;hatching&quot; — occurring at least five times. The smaller ejected lights travelled downward like falling stars. At one point, nine lights formed a stationary horizontal line above a ridgeline, evenly spaced and visible for more than 30 seconds, with smaller lights clustering below them in groups of three. The lights eventually disappeared and then reappeared directly behind the witness. All observations occurred within a continuous 2–3 hour span.

The document does not present any conclusions, identifications, or analysis of what the lights were. It is strictly the witness&#39;s first-person account. No corroborating evidence — sensor data, photographs, or video — is included. The document is marked UNCLASSIFIED and shows low evidence of redaction.</div>
