  <h1>FBI Files Show Bureau Forwarded Citizen UFO Reports to Air Force</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/e24a99efc7719ce63bef015b75413e02beed234aced91b450d84f70b11db06fe.jpg" alt="FBI Files Show Bureau Forwarded Citizen UFO Reports to Air Force thumbnail" loading="lazy" />
  <p>This section of the FBI&#39;s UFO files contains internal memos and letters from roughly 1947 to 1952 in which citizens reported flying saucer sightings to the Bureau. The FBI&#39;s consistent response was that the matter fell under Air Force jurisdiction, and it forwarded the reports accordingly. The documents are heavily redacted and many pages are nearly unreadable due to poor scan quality.</p>
  <div class="narr">This batch of FBI records — designated UFO Part 09 — compiles internal memoranda, telegrams, and citizen correspondence handled by the Bureau between approximately 1947 and 1952. The documents are not a single investigation but a collection of separate reports that landed on the FBI&#39;s desk, most of which were passed along to Air Force Intelligence.

The most detailed account comes from a July 1949 memo about a letter sent to newspaper columnist Walter Winchell. The letter described an August 1947 encounter in the mountains near Los Angeles, where a witness claimed to have seen a large silver-green metallic object shaped like a child&#39;s top, roughly the size of a county fair balloon, with two windows and partially transparent metal. The witness said the object lifted off silently in about one second and knocked him to the ground. He speculated that its occupants came from another planet and had solved what he called negative gravity. Winchell asked the FBI to keep the matter confidential, and the Bureau recommended that the Los Angeles office discreetly check the witness&#39;s background and interview him.

Other documents include a 1952 letter in which FBI Director J. Edgar Hoover acknowledged a flying saucer report from Charleston, South Carolina and forwarded it to the Air Force; a July 1952 report of 16 to 20 twin-trail bombers flying in formation near Thessalon Lake in Ontario, Canada, from which objects were dropped that then spurred vapor and flew off at high speed to the southwest; a citizen from Baltimore who proposed that flying saucers were simply lights caused by radio and television beams illuminating moist vapour; and a woman from Staunton, Virginia who wrote to the FBI, Air Force Intelligence, and the Justice Department claiming her own flying saucer theory had been stolen after she mailed it to the Air Force.

Throughout these records, the FBI&#39;s position was consistent: flying saucer matters belonged to the Department of the Air Force. The Bureau did not conduct its own investigations into whether the reported objects were real. Heavy redaction obscures witness names and other identifying details across nearly every document, and several pages are so degraded that almost no content can be reliably read.</div>
