  <h1>Civilian Pilot Reports Airliner-Sized Object Hovering Near Tampa</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/09c299345846771bc762678dab2d99d0dab712b1ca8f62d4f05e549da5d7a0f0.jpg" alt="Civilian Pilot Reports Airliner-Sized Object Hovering Near Tampa thumbnail" loading="lazy" />
  <p>An FAA preliminary incident notification records a civilian pilot reporting a large unidentified aerial phenomenon, described as the size of an airliner, hovering at approximately 25,000 feet about 40 nautical miles northwest of Tampa, Florida on November 19, 2023. The document is a single-page notification with no investigation conclusions or corroborating evidence included.</p>
  <div class="narr">On November 19, 2023, at approximately 5:40 PM Eastern time, the pilot of a Cessna Citation Latitude (a mid-size business jet, registration N518KB) reported seeing a large unidentified aerial phenomenon while flying from Fort Lauderdale Executive Airport to Omaha. The object was described as the &quot;size of an airliner&quot; and was hovering at flight level 250 — roughly 25,000 feet — about 40 nautical miles northwest of Tampa International Airport, over or near the Gulf of Mexico coast.

The FAA&#39;s Washington Operations Center logged the sighting as a preliminary incident notification under reference 237UAP00574. According to the record, the pilot took no evasive action and no law enforcement notification was reported. The coordinates recorded in the document (28.39°N, 83.00°W) are consistent with the described location northwest of Tampa.

This document is a preliminary notification only. It does not contain any follow-up investigation, radar data, photographs, or conclusions about what the object was. There is no indication that additional witnesses or sensors corroborated the pilot&#39;s account. The record shows low evidence of redaction, meaning what you see is likely close to the full content of this particular filing.

The FAA routinely logs pilot-reported sightings of unidentified phenomena through its Operations Centers. This record is one such filing — a factual log of what a pilot reported, not an assessment of what was observed.</div>
