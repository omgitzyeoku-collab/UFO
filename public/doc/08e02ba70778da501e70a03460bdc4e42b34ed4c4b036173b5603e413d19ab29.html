  <h1>Delta Crew Reported Unidentified Phenomenon at 38,000 Feet Over Florida</h1>
  <div class="meta">
    <span class="badge">FAA</span>

    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/08e02ba70778da501e70a03460bdc4e42b34ed4c4b036173b5603e413d19ab29.jpg" alt="Delta Crew Reported Unidentified Phenomenon at 38,000 Feet Over Florida thumbnail" loading="lazy" />
  <p>This FAA incident report documents a January 2023 sighting by the crew of a Delta Air Lines Boeing 757, flying at 38,000 feet near St. Petersburg, Florida. The crew observed an unidentified aerial phenomenon that changed altitude, speed, and light intensity. The case was closed with no explanation provided.</p>
  <div class="narr">On 23 January 2023 at 02:28 UTC, the crew of Delta Air Lines flight DAL8934 — a Boeing 757-200 flying from Miami to New Orleans — reported an unidentified aerial phenomenon ahead of their aircraft. The plane was travelling northwest at flight level 380 (approximately 38,000 feet), about 40 nautical miles southwest of St. Petersburg-Clearwater International Airport (PIE) in Florida.

According to the FAA&#39;s SKYWATCH incident report, the unknown phenomenon changed altitude, vertical speed, and light intensity while being observed. No further detail is given about its size, shape, or duration of the encounter.

The FAA notified the UFO Reporting Center and AWO (Airway Operations) about the sighting. The report is filed under case reference ZMA-M-2023/01/22-0003, managed by the Miami Air Route Traffic Control Center.

The case is marked as closed. No identification or explanation for the phenomenon is provided in the document. There is no mention of corroborating radar data, additional witnesses, or follow-up investigation.</div>
