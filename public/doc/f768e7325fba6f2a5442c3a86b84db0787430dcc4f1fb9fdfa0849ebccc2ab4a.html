  <h1>Pentagon Office Explains Three Famous UAP Videos as Balloons and Sensor Illusions</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/f768e7325fba6f2a5442c3a86b84db0787430dcc4f1fb9fdfa0849ebccc2ab4a.jpg" alt="Pentagon Office Explains Three Famous UAP Videos as Balloons and Sensor Illusions thumbnail" loading="lazy" />
  <p>These unclassified briefing slides from the All-Domain Anomaly Resolution Office (AARO) were presented to a Senate subcommittee, analyzing UAP reporting trends from 1996–2024 and resolving three well-known incidents — the Puerto Rico Object, Go Fast, and Mt. Etna Object — as balloons or wind-borne objects misidentified due to sensor effects. Of all closed UAP cases, 75% were attributed to balloons.</p>
  <div class="narr">On February 5, 2025, the Pentagon&#39;s All-Domain Anomaly Resolution Office (AARO) released a set of unclassified briefing slides prepared by its director, Dr. Jon Kosloski, for the Senate Armed Services Subcommittee on Emerging Threats and Capabilities. The slides cover UAP (Unidentified Anomalous Phenomena) reporting trends spanning from January 1, 1996 to October 10, 2024, and walk through AARO&#39;s analysis of three incidents that had drawn significant public attention. AARO operates under authority granted by the FY24 National Defense Authorization Act, codified at 44 U.S.C. 2107.

The first case examined is the Puerto Rico Object from April 26, 2013, captured on infrared video by a U.S. Customs and Border Protection aircraft. The object appeared to split in two and move at high speed. AARO concluded with high confidence that there were actually two distinct objects drifting at wind speed — approximately 3.6 metres per second — over land the entire time. The apparent splitting was an illusion caused by changing sensor viewing angles, and the impression of high speed was attributed to motion parallax. The objects never entered the water, contrary to earlier claims.

The second case is the Go Fast video from January 2015, recorded by a U.S. Navy aircraft off Florida&#39;s east coast. The object appeared to skim the ocean surface at extreme speed. AARO assessed with high confidence that it was actually at approximately 13,000 feet altitude, travelling at roughly 45 mph (39 knots) — well below the wind speed of about 60 knots at that altitude. This is consistent with a wind-borne object such as a balloon, not a craft under its own power. AARO noted, however, that precise positional analysis was limited by a lack of exact positional data from the observing aircraft.

The third case involves an object recorded in 2018 by a U.S. drone over the Mediterranean Sea near Italy&#39;s Mt. Etna during a volcanic eruption. The object appeared to fly through the ash plume, which would imply unusual durability or propulsion. AARO assessed with moderate confidence — a lower level than the other two cases — that the object was a balloon drifting with the wind approximately 170 kilometres from the volcano, and used pixel luminosity analysis to disprove that it had passed through the plume.

Across all closed UAP cases in the dataset, AARO reported that 75% were resolved as balloons and 16% as unmanned aerial systems (drones). The most commonly reported UAP shapes were lights (46%) and orbs or spheres (31%). The slides are a summary presentation; the underlying detailed technical analysis is not included.</div>
