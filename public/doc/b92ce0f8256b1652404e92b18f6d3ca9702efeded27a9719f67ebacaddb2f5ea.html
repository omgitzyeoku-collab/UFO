  <h1>Commercial Pilot Reports Large Balloon at 50,000 Feet Near Kansas City</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/b92ce0f8256b1652404e92b18f6d3ca9702efeded27a9719f67ebacaddb2f5ea.jpg" alt="Commercial Pilot Reports Large Balloon at 50,000 Feet Near Kansas City thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a commercial airline pilot observing a large balloon at approximately 50,000 feet or higher while flying at 32,000 feet near Kansas City on 3 February 2023. The FAA classified the sighting as an Unidentified Aerial Phenomenon and closed the case without further explanation.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unusual aerial sightings reported by pilots. It was filed under case number 237UAP00161 and classified with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On 3 February 2023, the crew of a commercial Airbus A321 flying under callsign ROU1721 reported spotting a large balloon ahead of their aircraft. The plane was heading southwest at flight level 320 (roughly 32,000 feet), on a route from Toronto, Canada (CYYZ) to Phoenix, Arizona (PHX). The sighting occurred approximately 51 nautical miles east of Kansas City&#39;s airport (MCI).

The crew estimated the balloon was at flight level 500 or above — approximately 50,000 feet or higher. That altitude is well above normal commercial air traffic and near the upper limits of where conventional weather balloons typically operate. The report does not include any radar data, photographs, or other sensor evidence to corroborate the pilot&#39;s visual observation.

The case status is listed as closed. The report does not describe any resolution, identification of the balloon, or follow-up investigation. The aircraft&#39;s tail number field is blank, which limits the ability to independently verify which specific plane was involved. Notably, this incident occurred in early February 2023, during a period of intense public and military attention to unidentified balloons over North America following the Chinese surveillance balloon incidents.</div>
