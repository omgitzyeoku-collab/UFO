  <h1>Military Infrared Video Shows Spherical Object Over Afghanistan in 2020</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">2020</span>
    <span class="badge">CENTCOM</span>
    <span class="badge">verified</span>
  </div>
  
  <p>This 47-second infrared video, recorded by a U.S. military sensor platform in November 2020, shows a spherical object moving in and out of clouds over Afghanistan. The Department of War notes the video was digitally altered before being uploaded to a classified network in 2024, and it lacks a verified chain of custody.</p>
  <div class="narr">In November 2020, a U.S. military sensor platform operating in the U.S. Central Command (CENTCOM) area of responsibility — which covers the Middle East and Central Asia — captured a 47-second infrared video over Afghanistan. The footage shows a spherical object moving in and out of clouds. The video opens with a black screen displaying the text &quot;zoomed in,&quot; followed by an area of contrast that appears on screen.

The video was uploaded to a classified network by an unidentified user in June 2024. The All-domain Anomaly Resolution Office (AARO) — the Pentagon body responsible for investigating unidentified anomalous phenomena — later identified it as part of a collection of potentially UAP-related materials held on that network. On 6 March 2026, eight members of the U.S. House of Representatives requested access to 51 such records, of which this video was one.

AARO states that the video was digitally altered before it was uploaded to the classified network, though the nature and extent of the alteration are not specified. The agency presents the footage &quot;as received.&quot; AARO also uses hedging language about the source, saying the video is &quot;likely derived from&quot; an infrared sensor on a military platform rather than confirming it outright.

The document carries several significant limitations. AARO notes that many of the responsive materials in this collection lack a substantiated chain of custody, meaning their origins cannot be independently verified. The video&#39;s description text appears truncated, suggesting incomplete metadata or possible redaction. No original source text was extractable from the document itself — all available facts come from accompanying metadata.</div>
