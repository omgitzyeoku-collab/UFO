  <h1>United Airlines Crew Reports Splitting Light at 50,000 Feet Near Buffalo</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/eb1b4228d0a9658c40244bf3d20ce0f2365004b86bf53480bea2946c1790e7d0.jpg" alt="United Airlines Crew Reports Splitting Light at 50,000 Feet Near Buffalo thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of United Airlines flight 541 on 28 October 2023. While flying at 39,000 feet near Buffalo, New York, the crew observed a single light that split into two lights moving in a crisscross pattern at an estimated 50,000–60,000 feet. The case is closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — the system the Federal Aviation Administration uses to log unidentified aerial phenomena reported by pilots and air traffic controllers. It was filed under case number 237UAP00309 and classified under the primary code &quot;Unidentified Aerial Phenomenon.&quot;

On 28 October 2023 at 08:20, the crew of United Airlines flight 541, a Boeing 737-800 flying from Denver to Boston, reported something unusual while cruising eastbound at flight level 390 (approximately 39,000 feet). About 40 nautical miles west of Buffalo, they observed a light off the left side of the aircraft. The light appeared to split into two separate lights, which then flew in a crisscross pattern. The crew estimated the phenomenon was at flight level 500 to 600 — roughly 50,000 to 60,000 feet, well above their own altitude and above the ceiling of most conventional aircraft.

The sighting was reported through Cleveland Center (the FAA&#39;s air traffic control facility covering that region, known by the code ZOB). No radar data, sensor readings, or corroborating reports from other aircraft are included in the document.

The FAA marked the case as closed. The document provides no resolution, identification, or explanation for what the crew observed. No tail number for the specific aircraft was recorded.</div>
