  <h1>FAA Report: Multiple Pilots Saw Bright Wiggling Lights at 41,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/3e209244286fd544fa917f6cc85f573800b8ab6ac58c32ed378226efe81a965d.jpg" alt="FAA Report: Multiple Pilots Saw Bright Wiggling Lights at 41,000 Feet thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a UAP sighting by a commercial aircraft (callsign EJA316) flying near McCook, Nebraska at 41,000 feet. The crew described bright lights that dimmed, moved rapidly, and wiggled; multiple other aircraft reported similar phenomena in the area, but nothing appeared on air traffic control radar. The case is closed with no identification or resolution noted.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00361. It records an unidentified aerial phenomenon observed by a commercial aircraft with the callsign EJA316, flying eastbound at Flight Level 410 — roughly 41,000 feet — near McCook (MCK), within Denver Center (ZDV) airspace. The report is coded under MOR ID ZDV-M-2024/03/02-0002.

The crew described seeing bright lights that then dimmed, moving rapidly and wiggling around at approximately the same altitude as their aircraft. The report notes that multiple aircraft in the vicinity of McCook reported similar phenomena, though no details about those additional reports are included in this document.

Notably, the UAP was not detected on the air traffic control facility radar system, meaning the sighting rests entirely on pilot visual observations. No tail number was recorded for the reporting aircraft.

The case is marked as Closed, but no resolution or identification of the phenomenon is provided. The FAA did not indicate what the lights were or offer any explanation in the document.</div>
