  <h1>Pilot Reports Unidentified Object Above Aircraft Near Yardley, Pennsylvania</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/bc80be33d2a55d908fcf2ab186117ebabe72819b5eea678fa9c939f421844b9e.jpg" alt="Pilot Reports Unidentified Object Above Aircraft Near Yardley, Pennsylvania thumbnail" loading="lazy" />
  <p>This FAA incident report documents a November 2023 sighting by a pilot flying a Pilatus PC-12 near Yardley, Pennsylvania. The pilot observed an unidentified object with lights approximately 1,200 feet above the aircraft at around 19,000 feet altitude; air traffic control saw it on radar but received no transponder signal or radio contact from the object.</p>
  <div class="narr">On the evening of November 3, 2023, at approximately 8:10 PM Eastern time, a pilot flying a Pilatus PC-12 (a single-engine turboprop, registration N822NG) reported an unidentified aerial phenomenon to air traffic control. The aircraft was en route from Farmingdale, New York to DeKalb-Peachtree Airport near Atlanta, travelling southwest at flight level 190 — roughly 19,000 feet.

The pilot observed the object about 1,200 feet above the aircraft, approximately 3 nautical miles northwest of Yardley VOR (a navigation reference point near Yardley, Pennsylvania, at coordinates 40.28°N, 74.89°W). The pilot reported that the object had lights suggesting it was an aircraft. New York ARTCC (Air Route Traffic Control Center) was advised of the sighting.

Air traffic control confirmed that the object appeared on primary radar only — meaning it showed up as a radar return but was not transmitting a transponder signal and was not in radio communication with controllers. No transponder signal and no radio contact are unusual for conventional aircraft operating at that altitude in controlled airspace.

The report does not document any follow-up investigation or resolution. There is no conclusion from the FAA about what the object was. The document shows low evidence of redaction — the information appears to be presented largely as recorded.</div>
