  <h1>FAA Report: Pilot Saw Bright Light Following Aircraft in 2007</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/40f0f7786a2e76067fb690461852923921f62066c098df2b1c5216f59faa0d3e.jpg" alt="FAA Report: Pilot Saw Bright Light Following Aircraft in 2007 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from 31 August 2007 in which the pilot of a Mitsubishi MU-2 aircraft (callsign RUF442) reported a bright white light above the plane at 13,000 feet, roughly 45 nautical miles south-southwest of DRYER VOR. The FAA closed the case without explanation and forwarded the report to the National UFO Center, a private organisation in Davenport, Washington.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed on 31 August 2007. It records a UFO sighting by the pilot of RUF442, a Mitsubishi MU-2/LR-1 aircraft operated by RUF, while flying at 13,000 feet approximately 45 nautical miles south-southwest of DRYER VOR (identifier DJB). The report was handled by the NCRCC (National Capital Region Coordination Center) operations centre.

The pilot described seeing a bright white light above the aircraft. The light appeared stationary yet seemed to follow the plane during flight. No additional details about the object&#39;s size, shape, or behaviour beyond this description are included in the report.

The FAA classified the incident under the primary code &quot;OTHER&quot; and marked the case as closed. No resolution, identification, or explanation for the sighting is provided in the document. Rather than investigating further, the FAA forwarded the information to the National UFO Center in Davenport, Washington — a private organisation, not a government agency.

The report contains no corroborating radar data, no additional witness accounts, and no follow-up analysis. It is a single pilot&#39;s account, logged and closed.</div>
