  <h1>UPS Cargo Pilot Reports Torpedo-Shaped Object Near Palm Springs</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>

  <img class="thumb" src="/extract/thumbs/aef35e64c156457e27b29b67f3643ca668eeb4b0d3088859ec5877af7d4a9f49.jpg" alt="UPS Cargo Pilot Reports Torpedo-Shaped Object Near Palm Springs thumbnail" loading="lazy" />
  <p>This FAA incident report documents a UPS cargo pilot&#39;s sighting of a fast-moving, white, torpedo-shaped object that passed roughly 500 feet below the aircraft near Palm Springs, California on 18 May 2021. The pilot explicitly ruled out a drone, no evasive action was taken, and the National UFO Reporting Office was notified.</p>
  <div class="narr">This document is a preliminary incident report from the FAA&#39;s Washington Operations Center. It records an observation made by the pilot of UPS flight 913, a Boeing 757-200 cargo aircraft, while flying eastbound at approximately 24,000 feet, 29 miles west of Palm Springs, California on 18 May 2021.

According to the report, the pilot observed a white, torpedo-shaped object pass roughly 500 feet below the aircraft&#39;s left wing. The object was described as fast-moving. The pilot explicitly stated it was not a UAS (unmanned aerial system, commonly called a drone). No evasive action was taken.

SoCal TRACON — the regional air traffic control facility — was advised of the sighting, and the National UFO Reporting Office was notified. The report is marked as preliminary information and was filed as a late report.

The document contains no follow-up investigation, no radar corroboration, and no conclusion about what the object was. It is a single-source account based entirely on the pilot&#39;s observation. Notably, the metadata lists the incident year as 2023, but the document itself clearly dates the event to 18 May 2021.</div>
