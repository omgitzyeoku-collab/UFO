  <h1>1948 Air Force Memos Set Up Flying Disc Reporting and Rejected Intercept Plans</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">6/15/48</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/34d59dc7578ffe7e072a6164c6050f45cff30b634313a87141c0886aa93d15c7.jpg" alt="1948 Air Force Memos Set Up Flying Disc Reporting and Rejected Intercept Plans thumbnail" loading="lazy" />
  <p>This collection of 1948 US Air Force internal memos established Project SIGN and the official chain for reporting &quot;flying disc&quot; sightings, routed through Air Materiel Command at Wright-Patterson AFB. It includes a specific sighting report from Hobson, Ohio, references to German Horten Brothers flying wing designs being evaluated in connection with the phenomenon, and records the Air Force&#39;s rejection of a proposal to keep fighter jets on continuous alert to chase the objects.</p>
  <div class="narr">In early 1948, the US Department of the Air Force produced a series of internal memorandums that created the official system for handling reports of unidentified objects in the sky. Air Materiel Command at Wright-Patterson Air Force Base in Dayton, Ohio was designated as the lead agency to collect, evaluate, and distribute all information about &quot;flying disc&quot; sightings. All Air Force installations were instructed to send their reports directly there. This bureaucratic infrastructure became known as Project SIGN.

One specific sighting documented in these files occurred on the night of 8 May 1948 in Hobson, Ohio. The report did not come from Air Force personnel directly — it was forwarded by FBI Special Agent D.K. Brown in Cleveland. The object was described as round, phosphorescent, with a glowing trail, heading at 90 degrees with &quot;great speed&quot; at an estimated altitude of six to eight miles. The witness said it appeared about nine inches in diameter from the ground, though at that altitude, the actual object would have been far larger. The Eleventh Air Force explicitly stated it was not initiating any investigation into the sighting.

Separately, near Bakersfield, California, two incidents in March 1948 involved observers reporting objects falling to earth — one pair on 5 March trailing smoke and debris, another pair on 8 March with one apparently on fire producing red and black smoke. Search parties, aircraft, and rescue units all failed to locate anything.

The files also reveal that the Air Force was evaluating a report on German Horten Brothers flying wing aircraft designs in connection with the flying saucer phenomenon. A 1947 US Military Attaché report from Moscow claimed the Soviet Union planned to build 1,800 aircraft based on the Horten VIII design — a six-engine flying wing with a 131-foot wingspan. The Air Force made contact with the Horten Brothers and directed European Command intelligence to interrogate them. Meanwhile, a proposal to station fighter aircraft on continuous alert at Air Force bases to intercept flying discs was formally rejected. The reasons given were straightforward: the cost in aircraft and personnel would be too high relative to results, and the Air Force simply could not provide the complete radar coverage needed to make interceptions possible.</div>
