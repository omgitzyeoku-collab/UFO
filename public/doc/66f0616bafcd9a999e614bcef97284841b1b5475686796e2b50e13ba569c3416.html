  <h1>Emirates Crew Reports Two Unidentified Aircraft Over Mid-Atlantic Ocean</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/66f0616bafcd9a999e614bcef97284841b1b5475686796e2b50e13ba569c3416.jpg" alt="Emirates Crew Reports Two Unidentified Aircraft Over Mid-Atlantic Ocean thumbnail" loading="lazy" />
  <p>An FAA incident report documents two unidentified objects observed by the crew of Emirates flight UAE9918 over the Atlantic Ocean on 10 August 2022. The objects appeared to fly in a racetrack formation pattern at high altitude roughly 1,050 miles east of the Carolinas. The case was closed with no identification or resolution provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under the code &quot;Unidentified Aerial Phenomenon.&quot; It records an observation made by the crew of Emirates flight UAE9918, which was flying a route from BQN (Aguadilla, Puerto Rico) to EHAM (Amsterdam) on 10 August 2022. The report was logged at 02:59 UTC.

The crew, flying north-northeast at FL330 (approximately 33,000 feet), observed two objects to the north of their position over the open Atlantic Ocean, roughly 1,050 miles east of the Carolinas at coordinates 32°08&#39;N / 57°50&#39;W. The objects were estimated to be 40–50 miles ahead and at or above FL400 (approximately 40,000 feet).

According to the report, the two objects were operating in formation, flying a north-to-south racetrack pattern with left-hand turns. Each lap took an estimated 3–5 minutes, with one object trailing the other by about 5 seconds. The crew noted the objects appeared to have landing lights illuminated and described them as resembling fast jet aircraft, though this was not confirmed.

The FAA case was closed without any resolution or identification of the objects. Law enforcement was not notified. No radar data or corroborating sensor evidence is included in the report — the entire account rests on the crew&#39;s visual observation.</div>
