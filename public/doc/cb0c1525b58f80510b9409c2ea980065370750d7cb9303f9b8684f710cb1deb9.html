  <h1>Apollo 17 Crew Reported Bright Fragments Outside Spacecraft in 1972</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    <span class="badge">12/7/72</span>
    <span class="badge">Cislunar Space</span>
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/cb0c1525b58f80510b9409c2ea980065370750d7cb9303f9b8684f710cb1deb9.jpg" alt="Apollo 17 Crew Reported Bright Fragments Outside Spacecraft in 1972 thumbnail" loading="lazy" />
  <p>This is an auto-transcribed audio excerpt from the Apollo 17 mission on 7 December 1972, released as part of the US Department of War&#39;s PURSUE collection. During transit to the Moon, the crew observed bright, flat, flake-like fragments drifting near the spacecraft and speculated they were mundane debris — possibly paint chips or material from the Saturn rocket&#39;s S-IVB upper stage.</p>
  <div class="narr">On 7 December 1972, during the Apollo 17 mission&#39;s transit from Earth to the Moon (known as cislunar space), the crew reported seeing unusual objects outside their spacecraft. This audio excerpt, catalogued as NASA-UAP-D009, captures their real-time observations and was released as part of the PURSUE public collection.

The crew described &quot;very bright particles or fragments&quot; that appeared flat, flake-like, and angular, with some estimated at roughly six inches across. Most of the fragments seemed to be twinkling and slowly drifting away from the spacecraft, with no apparent motion between the individual pieces. Occasionally, a fragment moving at considerably higher velocity would cross the window, though this was rare.

The crew&#39;s own leading explanation was mundane debris — possibly material shed from the Saturn V rocket&#39;s S-IVB upper stage, which had been part of the launch vehicle. As one crew member put it regarding the S-IVB theory, &quot;it&#39;s a wild guess.&quot; They attempted to photograph the fragments, noting they would shoot at frame 70.

NASA drew no formal conclusion in this excerpt. The document records observations only, with no ground-based or instrument corroboration documented. The crew treated the sighting as something worth reporting and photographing, but their own hypothesis pointed toward ordinary spacecraft debris rather than anything anomalous.</div>
