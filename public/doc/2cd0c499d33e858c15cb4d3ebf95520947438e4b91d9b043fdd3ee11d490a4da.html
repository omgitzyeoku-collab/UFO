  <h1>Pilot and Air Traffic Control Both Saw Colored Lights Over Alabama</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/2cd0c499d33e858c15cb4d3ebf95520947438e4b91d9b043fdd3ee11d490a4da.jpg" alt="Pilot and Air Traffic Control Both Saw Colored Lights Over Alabama thumbnail" loading="lazy" />
  <p>This FAA incident report documents a pilot flying a Cessna C208 between Birmingham and Huntsville, Alabama, who reported seeing multiple colored lights on August 17, 2023. What makes this report notable is that controllers at Birmingham&#39;s air traffic control tower independently confirmed they could also see the lights.</p>
  <div class="narr">On August 17, 2023, at 1:15 AM Central time, a pilot flying a Cessna C208 cargo plane (registration N414CY) on a route from the Huntsville area to McCollum Field in Kennesaw, Georgia, reported seeing multiple colored lights while flying between Birmingham and Huntsville, Alabama.

The sighting was relayed through Memphis ARTCC (Air Route Traffic Control Center, the facility that manages high-altitude air traffic in that region). What elevates this beyond a single witness account is that Birmingham&#39;s airport control tower independently reported being able to see the same lights.

The FAA&#39;s Washington Operations Center logged the incident but the report contains limited detail. No altitude, speed, or size information was recorded for whatever the pilot and controllers observed. The document simply describes &quot;multiple colored lights&quot; without further characterisation.

Law enforcement was not notified of the sighting, and no follow-up investigation is documented in this record. The report appears to be a standard FAA incident notification rather than the result of any in-depth inquiry.

The document itself is a brief operational log entry — not a lengthy analysis or conclusion. The FAA did not offer an explanation for what was observed.</div>
