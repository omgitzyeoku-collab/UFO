  <h1>Multiple Airline Crews Reported Fast-Moving Bright Light Over Idaho</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/546ff53a9e5f7c02d157c96977a9d47eb81079dd2a5c5e63023e9e5cac403d70.jpg" alt="Multiple Airline Crews Reported Fast-Moving Bright Light Over Idaho thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a May 2015 sighting in which the crews of United Airlines flight 935 and Alaska Airlines flight 794, both cruising near 40,000 feet over southwestern Idaho, independently reported a bright light above them moving northeast at excessive speed. Multiple other aircraft in the area corroborated the sighting, and the FAA notified the Western Air Defense Sector.</p>
  <div class="narr">This document is a single-page FAA SKYWATCH Incident Report, a standardised form the Federal Aviation Administration uses to log unusual airspace events. It was filed at 23:46 UTC on 17 May 2015 through Salt Lake City Air Route Traffic Control Center (ZLC) and later released as part of a 2023 batch of FAA UAP records.

The report describes an incident over rural southwestern Idaho, at coordinates 44°35&#39;N / 116°48&#39;W. The crew of United Airlines flight 935, a Boeing 777-200 flying from Los Angeles to London Heathrow at 40,000 feet, reported a bright light above them traveling northeast at what they called an excessive rate of speed. The crew of Alaska Airlines flight 794, flying at 39,000 feet in the same area, independently reported the same object. Multiple additional aircraft also confirmed the sighting.

The FAA&#39;s Denver headquarters instructed Salt Lake City center to forward the report to the UFO Reporting Center and notified WADS, the Western Air Defense Sector, for situational awareness. The report&#39;s status is marked &quot;Closed.&quot;

No identification of the object is offered anywhere in the document. It is described only as a bright light — no size, shape, altitude estimate, or radar data is referenced. The report contains no follow-up investigation, no sensor data, and no photographs. The FAA did not reach or record a conclusion about what the object was.</div>
