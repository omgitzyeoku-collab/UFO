  <h1>FAA Report: Balloon Nearly Hit Aircraft at 38,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/11703bcfaba3e959dedbf49be89feb320614af40d1fe9a64eefc81c6d6082e43.jpg" alt="FAA Report: Balloon Nearly Hit Aircraft at 38,000 Feet thumbnail" loading="lazy" />
  <p>This FAA incident report documents a near mid-air collision between a general aviation aircraft (callsign N500GF) and a large balloon at 38,000 feet on 26 February 2022, approximately 42 nautical miles southwest of Springfield, Illinois. The case was classified as an Unidentified Aerial Phenomenon and closed with no further analysis.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under the agency&#39;s Unidentified Aerial Phenomenon classification. It records an encounter that took place on 26 February 2022 at 17:25, when a general aviation aircraft with callsign N500GF was flying eastbound at FL380 — 38,000 feet — on a route from Houston (HOU) to Aurora, Illinois (ARR).

Approximately 42 nautical miles southwest of Springfield, Illinois, the crew encountered an object they described as a balloon roughly 25 feet in diameter. The pilot in command reported a near mid-air collision (NMAC), meaning the object passed close enough to pose a genuine collision risk at cruising altitude.

The FAA classified the event as an Unidentified Aerial Phenomenon and marked the case as Closed. No further analysis, follow-up investigation, or corroborating evidence — such as radar data or additional witness accounts — is documented in the report.

The balloon identification comes solely from the crew&#39;s visual assessment. No independent confirmation of the object&#39;s nature or origin appears in the file. The report contains minimal redaction.</div>
