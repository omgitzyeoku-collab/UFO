  <h1>Frontier Airlines crew reported airliner-sized object hovering near Tampa</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/96a935898ffbcd3d6c46c833e1dba33d5114ce285dc6de9c9e3f93abb87af46f.jpg" alt="Frontier Airlines crew reported airliner-sized object hovering near Tampa thumbnail" loading="lazy" />
  <p>An FAA operations center log from 19 November 2023 records the crew of Frontier Airlines flight 2402 reporting a large unidentified aerial phenomenon — described as the size of an airliner — hovering at roughly 25,000 feet, about 40 nautical miles northwest of Tampa, Florida. No evasive action was taken and no law enforcement was notified.</p>
  <div class="narr">This document is an incident log from the FAA&#39;s Washington Operations Center, initially relayed by the Eastern Regional Operations Center (E-ROC). It records a pilot sighting reported on 19 November 2023 at 5:40 PM Eastern time.

The crew of Frontier Airlines flight 2402 — an Airbus A320neo flying from Dallas/Fort Worth to Tampa — reported observing a large unidentified aerial phenomenon at flight level 250 (approximately 25,000 feet). The crew described the object as the &quot;size of an airliner&quot; and said it was hovering roughly 40 nautical miles northwest of Tampa, over the Gulf of Mexico off Florida&#39;s west coast. The coordinates logged in the report place the sighting at approximately 28.4°N, 83.0°W.

The crew did not take evasive action, and no law enforcement notification was reported. The document is a preliminary operations center log entry — not a full investigation or final conclusion. The FAA did not offer an explanation for what the crew observed.

There is minimal redaction in this record. However, the report is notable for what it lacks: no radar data, no corroborating witness accounts from other aircraft, and no follow-up investigation are included in this document.</div>
