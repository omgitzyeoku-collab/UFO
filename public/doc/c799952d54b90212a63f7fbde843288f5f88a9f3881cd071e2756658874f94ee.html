  <h1>Civilian Pilot Reports Unknown Object Over Cleveland at 6,500 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/c799952d54b90212a63f7fbde843288f5f88a9f3881cd071e2756658874f94ee.jpg" alt="Civilian Pilot Reports Unknown Object Over Cleveland at 6,500 Feet thumbnail" loading="lazy" />
  <p>This FAA incident notification documents a civilian pilot&#39;s report of an unknown aerial object near Cleveland, Ohio on July 26, 2023. The pilot, flying a Cirrus SR22 at 6,500 feet, reported the object to air traffic control; no evasive action was taken and local law enforcement was notified. No investigation findings or object identification are included.</p>
  <div class="narr">On July 26, 2023, the pilot of a Cirrus SR22 (registration N1446C) reported spotting an unknown aerial object while flying westbound at 6,500 feet. The aircraft was en route from Erie to Appleton, approximately 5 nautical miles north of Burke Lakefront Airport in Cleveland, Ohio.

The Cleveland Air Traffic Control Tower relayed the report through the FAA&#39;s Washington Operations Center, which generated this incident notification. The pilot did not take evasive action, and local law enforcement was notified at a Cleveland-area phone number.

The document describes the object only as an &quot;unknown aerial object&quot; — no details about its shape, size, speed, or behaviour are included. There is no radar data, no photographs, and no additional witness accounts.

This is an administrative notification, not an investigation report. The FAA logged the sighting and passed it along through standard channels, but the document contains no analysis, no follow-up findings, and no conclusion about what the object was. It represents the first step in the reporting chain rather than any kind of resolution.</div>
