  <h1>Delta Airlines crew reported bright lights off California coast in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9ca8ca62118bbe52164a3d4ec310f113ad8bcf6911f5363636787bd303a2fc01.jpg" alt="Delta Airlines crew reported bright lights off California coast in 2023 thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents a July 2023 sighting by the crew of Delta Air Lines Flight 2110, who observed a set of bright lights offshore while flying at roughly 21,000 feet near Oceanside, California. The crew took no evasive action, and no conclusions about the lights&#39; origin are drawn in the document.</p>
  <div class="narr">On the evening of 20 July 2023, at approximately 9:55 PM Pacific time, the crew of Delta Air Lines Flight 2110 reported an unidentified aerial phenomenon to air traffic control. The aircraft was flying southeast at Flight Level 210 — roughly 21,000 feet — about 15 nautical miles west-northwest of the Oceanside VORTAC navigational aid, off the coast of southern California.

From the right side of the aircraft, the crew observed what they described as a set of bright lights offshore. Los Angeles ARTCC (Air Route Traffic Control Center) was advised of the sighting and relayed the report to the FAA&#39;s Washington Operations Center. The crew did not take any evasive action.

The document is a preliminary information report from the FAA Operations Center — essentially an initial log entry, not a completed investigation or final determination. It records the basic facts of what was reported but does not offer any explanation or conclusion about what the lights were.

The coordinates given in the report (33.28°N, 117.62°W) place the sighting over the Pacific Ocean off the coast of San Diego County. There is minimal redaction in the document. A minor date discrepancy exists between the report header (20 July) and the document title (21 July), likely reflecting the difference between Pacific and UTC time zones.</div>
