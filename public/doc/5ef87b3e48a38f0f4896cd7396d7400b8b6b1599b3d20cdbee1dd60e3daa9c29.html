  <h1>Airline Crew Reports Three Bright Lights Over Nebraska at 39,000 Feet</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/5ef87b3e48a38f0f4896cd7396d7400b8b6b1599b3d20cdbee1dd60e3daa9c29.jpg" alt="Airline Crew Reports Three Bright Lights Over Nebraska at 39,000 Feet thumbnail" loading="lazy" />
  <p>This FAA preliminary report documents a sighting by the crew of a commercial flight travelling from Las Vegas to Minneapolis on 4 October 2023. The crew reported three stationary bright white lights blinking in sequence off the left side of their aircraft at approximately 39,000 feet over western Nebraska. No evasive action was taken and no follow-up investigation is included in the document.</p>
  <div class="narr">This document is a preliminary incident report from the FAA&#39;s Washington Operations Center, filed after a commercial airline crew reported an unidentified aerial phenomenon (UAP) during a routine flight.

On 4 October 2023 at 3:25 AM Mountain Daylight Time, the crew of a Boeing 737-900 operating from Las Vegas to Minneapolis reported seeing three stationary bright white lights from the left side of their aircraft. The lights were described as blinking left to right and right to left. The aircraft was at Flight Level 390 — roughly 39,000 feet — approximately 83 nautical miles northeast of Scottsbluff, Nebraska. Denver Air Route Traffic Control Center (ARTCC) was advised of the sighting.

The crew took no evasive action in response to the lights, and no law enforcement notification was reported. The report contains only the initial notification passed through the FAA&#39;s operations centre; no radar data, sensor recordings, or corroborating witness accounts are attached.

The FAA did not reach any conclusion about what the lights were. This is a preliminary report only — no follow-up investigation or resolution is documented. The record stands as a single data point: one flight crew&#39;s observation, logged through standard FAA channels.</div>
