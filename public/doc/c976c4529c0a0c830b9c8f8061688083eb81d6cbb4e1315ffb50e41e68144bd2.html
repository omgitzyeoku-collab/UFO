  <h1>United Airlines Crew Reported Large Balloon at 50,000 Feet in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/c976c4529c0a0c830b9c8f8061688083eb81d6cbb4e1315ffb50e41e68144bd2.jpg" alt="United Airlines Crew Reported Large Balloon at 50,000 Feet in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a United Airlines Boeing 737 MAX 8 crew observing a large balloon well above their cruising altitude on 3 February 2023. The sighting was reported to Kansas City Center air traffic control, and the case was closed with no identification or resolution provided.</p>
  <div class="narr">On 3 February 2023, the crew of United Airlines flight UAL597 — a Boeing 737 MAX 8 flying from Newark to Las Vegas — spotted a large balloon off the right side of their aircraft. They were cruising westbound at 34,000 feet, approximately 30 nautical miles west of a navigational point identified as RBA. The crew estimated the balloon was at roughly 50,000 feet or higher, well above their own altitude.

The sighting was reported to Kansas City Center (ZKC), the FAA air traffic control facility covering that region. The FAA logged it under its SKYWATCH system with the primary code &quot;Unidentified Aerial Phenomenon.&quot;

The case is marked as closed. The document provides no further identification of the object, no follow-up investigation details, and no conclusion about what the balloon was. There is minimal redaction in the report itself — the information is simply sparse rather than hidden.

The timing is notable: this incident occurred on 3 February 2023, one day before the US military shot down a Chinese surveillance balloon off the coast of South Carolina. That period saw a wave of balloon sightings and heightened attention to objects in US airspace. This report does not draw any connection to those events, but the date places it squarely in that window.</div>
