  <h1>Hawaiian Airlines Crew Reports Unexplained Lights Over South Dakota</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/1ab6723653335db074a9b46d2eb11c2fb900d5da0bc23a7d0482df1a6ed276aa.jpg" alt="Hawaiian Airlines Crew Reports Unexplained Lights Over South Dakota thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of Hawaiian Airlines flight 90, who observed lights &quot;coming and going&quot; at cruising altitude while flying over South Dakota on 11 February 2023. The report is a preliminary filing with no follow-up investigation or explanation on record.</p>
  <div class="narr">On 11 February 2023, at approximately 3:32 AM Central time, the crew of Hawaiian Airlines flight 90 — an Airbus A330-200 flying from Honolulu to Boston — reported seeing unexplained lights while cruising between 35,000 and 37,000 feet. The aircraft was roughly 25 nautical miles south of Sioux Falls, South Dakota, heading eastbound.

The crew described the lights as &quot;coming and going&quot; at the same altitude or higher than their aircraft. Minneapolis Air Route Traffic Control Center (ARTCC), the regional radar facility responsible for that airspace, relayed the report to the FAA&#39;s Washington Operations Center.

The FAA filed this as a preliminary UAP (unidentified anomalous phenomena) incident report. Law enforcement was not notified. The document contains no mention of radar data, sensor readings, or corroborating observations from other aircraft or ground stations.

No follow-up investigation or resolution is documented in this record. The report stands as a single filing capturing what the crew told air traffic control, with no agency conclusion about what the lights were.</div>
