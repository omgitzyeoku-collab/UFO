  <h1>Commercial Jet Crew Reports Lights at 45,000 Feet Near Albany</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/734cc531836d5a3a8e41c15097ea0a7c836f464d09f42e3c1d6ae6d203b38c95.jpg" alt="Commercial Jet Crew Reports Lights at 45,000 Feet Near Albany thumbnail" loading="lazy" />
  <p>An FAA incident report documents a UAP sighting by the crew of a Gulfstream business jet flying at approximately 45,000 feet about 50 nautical miles west-northwest of Albany, New York, on 5 October 2023. The crew described an unidentified aerial phenomenon with lights at their 11 o&#39;clock position; no evasive action was taken and no further investigation is documented here.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident report filed on 5 October 2023 at 03:20 Eastern time. It records a sighting reported by the crew of Journey Aviation flight 58, a Gulfstream GV business jet, while flying eastbound at flight level 450 — roughly 45,000 feet.

The crew reported an unidentified aerial phenomenon with lights at their 11 o&#39;clock position, meaning slightly to the left and ahead of the aircraft. The sighting occurred approximately 50 nautical miles west-northwest of Albany, New York, placing it over upstate New York. Boston Air Route Traffic Control Center (ARTCC), the regional air traffic control facility, relayed the report.

The crew took no evasive action, and no law enforcement notification was made. The report is marked as preliminary information.

The document is brief and contains no description of the object&#39;s shape, size, speed, or behaviour beyond the presence of lights. There is no mention of radar data, photographs, or corroborating reports from other aircraft or ground observers. The FAA did not include any conclusion or identification of what the crew observed.</div>
