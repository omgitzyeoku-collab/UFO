  <h1>Commercial Pilot Reports Object Circling and Vanishing Over Iowa City</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/4a1059354c8d107435a82d160f1b9947ded03b08ac0092748ce81f403fd9a8b8.jpg" alt="Commercial Pilot Reports Object Circling and Vanishing Over Iowa City thumbnail" loading="lazy" />
  <p>This FAA SKYWATCH incident report documents a commercial pilot on a Los Angeles-to-Pittsburgh flight who observed what appeared to be an aircraft circling at or above 37,000 feet over Iowa City on 11 February 2023, repeatedly appearing and disappearing. The FAA&#39;s Air Traffic Organization Operations Center (AMOC) noted a similar report the prior week had been attributed to a satellite train, and the case was closed without further investigation.</p>
  <div class="narr">On 11 February 2023 at 09:05, the crew of Spirit Airlines flight NKS656 — a commercial flight travelling eastbound from Los Angeles (LAX) to Pittsburgh (PIT) — reported an unidentified aerial phenomenon to air traffic control. The aircraft was at flight level 370 (37,000 feet) over Iowa City, Iowa, when the crew observed something off the left side of the aircraft.

The crew described what looked like an aircraft circling at or above their altitude that kept appearing and disappearing. The sighting was logged by Chicago Center (reporting facility ZAU) and classified under the FAA&#39;s primary code for an Unidentified Aerial Phenomenon.

The FAA&#39;s AMOC (Air Traffic Organization Operations Center) noted that a similar report had come in the previous week and had been attributed to a &quot;train&quot; of satellites — a line of satellites visible in sequence, often associated with commercial satellite constellations. However, the report does not confirm that this specific sighting was caused by a satellite train.

The case was marked as closed. No corroborating radar data or sensor evidence is included in the report, and no tail number for the reporting aircraft was recorded. The level of redaction in the document is low — the information provided is relatively straightforward, though limited in scope.</div>
