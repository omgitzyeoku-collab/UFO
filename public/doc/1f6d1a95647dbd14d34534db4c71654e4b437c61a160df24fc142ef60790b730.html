  <h1>CIA Relayed 1955 Hungarian Letter Describing Fast-Moving Aerial Objects</h1>
  <div class="meta">
    <span class="badge">CIA</span>
    <span class="badge">1955</span>
    <span class="badge">Hungary</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/1f6d1a95647dbd14d34534db4c71654e4b437c61a160df24fc142ef60790b730.jpg" alt="CIA Relayed 1955 Hungarian Letter Describing Fast-Moving Aerial Objects thumbnail" loading="lazy" />
  <p>A CIA information report passed along a secondhand account from a private letter written by a woman in Budapest, describing &#39;flying saucers&#39; that had been observed over Hungary for several weeks in 1955 and were estimated to travel at 12,000 km/h. The CIA filed the report as unevaluated information with no independent verification.</p>
  <div class="narr">In November 1955, a naturalised US citizen of Hungarian origin received a letter from his niece in Budapest. She described widespread public anxiety over fast-moving aerial objects — referred to as &#39;flying saucers&#39; or &#39;rockets&#39; — that had been seen over Hungary for several weeks. According to the letter, the objects were estimated to travel at 12,000 kilometres per hour, and scores of scientists were said to be actively studying the phenomena. The letter also included a sketch suggesting a flight path from Budapest toward Moscow.

The CIA prepared and disseminated the report (number 00-B-93674) based entirely on this single piece of personal correspondence. The agency explicitly stamped it as &#39;unevaluated information&#39; — meaning it had not been verified or analysed. A photostatic copy of the original Hungarian letter, along with an English translation, was held at the CIA Library.

The report was classified for limited distribution only — restricted to full-time employees of the CIA, the Atomic Energy Commission (AEC), the FBI, and State and Defence intelligence components. No foreign dissemination was permitted. The document carries moderate redactions, which obscure the identities of the source, his niece, and other family members mentioned in the correspondence.

This was the first time the niece had mentioned such objects in her letters, according to the source. The report offers no analysis, no corroboration from other intelligence channels, and no conclusion about what the objects were.</div>
