  <h1>U.S. Central Command Sent Unresolved UAP Report to Pentagon Office</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    
    <span class="badge">Iraq</span>

  <img class="thumb" src="/extract/thumbs/1ff8c16256579734969188915ad0e80062e1d5639bc424c6a207340e892c6dc6.jpg" alt="U.S. Central Command Sent Unresolved UAP Report to Pentagon Office thumbnail" loading="lazy" />
  <p>This document is a recommendation from U.S. Central Command (USCENTCOM) to the All-domain Anomaly Resolution Office (AARO) regarding an unresolved UAP sighting linked to Iraq. The document is heavily redacted, so the actual findings, description of the object, and analytical conclusions are not visible in the released version.</p>
  <div class="narr">In October 2025, Major General Richard A. Harrison, then Chief of Staff at U.S. Central Command (USCENTCOM), signed a recommendation forwarding an unresolved Unidentified Anomalous Phenomena (UAP) report to the All-domain Anomaly Resolution Office (AARO) — the Pentagon body responsible for investigating such cases. The recommendation was dated 8 October 2025 and processed under case references USCENTCOM MDR 25-0094 through MDR 25-0099.

The document was cleared for open publication on 10 March 2026 by the Department of War. Its title references Kuwait, though associated metadata lists Iraq as the incident location — the exact geography is ambiguous. An accompanying still image was captured by a U.S. military system, but the original reporter digitally altered the image before submitting it, which may limit its analytical value.

The substance of the report — what was seen, how it moved, and why it remains unresolved — is not available. The released text consists almost entirely of administrative headers, clearance markings, and case reference numbers. The heavy redaction means the public can confirm the report exists and was formally forwarded through military channels, but cannot evaluate what was actually observed or what conclusions, if any, were reached.

The document was reviewed under reference number 10/17/25 001 and carries the joint staff tracking code JS-250710-TM8S.</div>
