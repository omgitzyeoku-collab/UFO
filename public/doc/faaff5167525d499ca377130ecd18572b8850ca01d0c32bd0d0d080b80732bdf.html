  <h1>Pilot Reports Jet Pack at 5,400 Feet Near Long Beach</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/faaff5167525d499ca377130ecd18572b8850ca01d0c32bd0d0d080b80732bdf.jpg" alt="Pilot Reports Jet Pack at 5,400 Feet Near Long Beach thumbnail" loading="lazy" />
  <p>This FAA incident report documents a Cessna 182 pilot who reported seeing a jet pack flying at 5,400 feet and travelling northwest near Long Beach, California on 25 June 2021. Long Beach Police were notified but said they lacked the manpower to investigate, and the case was closed without identifying anyone.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under reference 237UAP00059. It records an event on 25 June 2021 in which the pilot of a Cessna 182 (callsign N974PA), a general aviation aircraft, reported seeing what they described as a jet pack at 5,400 feet, travelling northwest near Long Beach, California. The sighting was logged by Southern California TRACON (SCT), the FAA radar facility covering the region.

The pilot did not take evasive action. SCT notified Long Beach Police Department, but LBPD was initially uncertain what action to take. FAA headquarters then advised SCT to call the police back, emphasising that the object was a hazard to aviation, and to request that officers attempt to make contact and collect identifying information.

Despite this follow-up, Long Beach PD stated they did not have the manpower to search for the individual. The case was subsequently closed. No identification of the person or object was ever established.

This report is part of a broader series of jet pack sightings reported near the Los Angeles and Long Beach area during 2020 and 2021, none of which were conclusively explained. The document itself contains minimal redaction.</div>
