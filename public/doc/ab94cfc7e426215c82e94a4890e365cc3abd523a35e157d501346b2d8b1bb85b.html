  <h1>Helicopter Crew Reports UAP Near Reagan National Airport in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>

  <img class="thumb" src="/extract/thumbs/ab94cfc7e426215c82e94a4890e365cc3abd523a35e157d501346b2d8b1bb85b.jpg" alt="Helicopter Crew Reports UAP Near Reagan National Airport in 2023 thumbnail" loading="lazy" />
  <p>This FAA document is an operational notification from the Washington Operations Center recording a UAP sighting by a helicopter crew on 1 February 2023. The helicopter, callsign FFX1, was orbiting at 1,200 feet about 8 miles southwest of Reagan National Airport when the crew spotted an unidentified aerial phenomenon off the left side of the aircraft. No evasive action was taken, and the National Capital Region Coordination Center was notified.</p>
  <div class="narr">On 1 February 2023 at 7:59 PM Eastern, the FAA&#39;s Washington Operations Center logged an incident notification: a helicopter crew had reported seeing something they could not identify in the sky near Washington, DC. The document is a short operational alert, not a full investigation.

The helicopter, flying under the callsign FFX1, was orbiting at 1,200 feet roughly 8 miles southwest of Reagan National Airport (DCA), near coordinates 38.76°N, 77.13°W. The crew reported an unidentified aerial phenomenon visible from the left side of the aircraft. The record notes that no evasive action was taken.

The FAA notified the National Capital Region Coordination Center (NCRCC), the body responsible for airspace security around the capital. The document does not describe what the object looked like, how it moved, or how long it was visible.

There is no follow-up investigation, resolution, or conclusion recorded in this document. It is a single preliminary notification — a record that the sighting was reported and that the relevant authority was informed, nothing more.</div>
