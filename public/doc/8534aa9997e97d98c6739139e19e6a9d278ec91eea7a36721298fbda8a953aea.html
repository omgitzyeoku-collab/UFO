  <h1>FedEx Cargo Crew Reports Unidentified Object Over Atlantic Ocean</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>

  <img class="thumb" src="/extract/thumbs/8534aa9997e97d98c6739139e19e6a9d278ec91eea7a36721298fbda8a953aea.jpg" alt="FedEx Cargo Crew Reports Unidentified Object Over Atlantic Ocean thumbnail" loading="lazy" />
  <p>An FAA incident notification records that on August 7, 2023, the crew of FedEx flight 52 — an MD-11 cargo aircraft flying from San Juan, Puerto Rico to Memphis — reported an unidentified anomalous phenomenon 2,000 feet above them over the Atlantic Ocean. No evasive action was taken, no law enforcement was notified, and no follow-up investigation is documented.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — essentially a brief internal log entry recording that something unusual was reported by a flight crew. It is not an investigation report or an official conclusion about what happened.

On August 7, 2023, at approximately 11:00 PM, the crew of FedEx flight 52, an MD-11 cargo aircraft en route from San Juan, Puerto Rico (TJSJ) to Memphis (MEM), reported unidentified anomalous phenomena (UAP) activity. The object was observed at their 12 o&#39;clock position — directly ahead — approximately 2,000 feet above their altitude of flight level 380 (roughly 38,000 feet). The sighting occurred over the Atlantic Ocean at coordinates 24°29&#39;N / 72°50&#39;W, in oceanic airspace managed by Miami Air Route Traffic Control Center (ARTCC).

The crew took no evasive action, and no law enforcement notification was made. The document contains no description of the object&#39;s appearance, behaviour, size, or how long it was visible. It is a bare-bones notification rather than a detailed report.

No follow-up investigation or resolution is documented in this record. The FAA filing records the event but draws no conclusions about what the crew observed.</div>
