  <p>This file documents the 1966-1967 deliberations and recommendations of the U.S. Air Force (USAF) Scientific Advisory Board’s Ad Hoc Committee to Review Project Blue Book. Project Blue Book was a 1952-1969 USAF program to investigate the nature and origin of unidentified flying objects (UFO). The Committee recommended that the USAF contract a scientific team composed of university-affiliated representatives to investigate selected UFO sightings. The USAF subsequently adopted the Committee’s recommendation.</p>
