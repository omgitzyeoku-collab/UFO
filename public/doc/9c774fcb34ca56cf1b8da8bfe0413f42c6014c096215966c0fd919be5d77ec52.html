  <h1>Air Force Committee&#39;s 1966 Review Led to University-Based UFO Study</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">4/17/67</span>
    <span class="badge">Various</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9c774fcb34ca56cf1b8da8bfe0413f42c6014c096215966c0fd919be5d77ec52.jpg" alt="Air Force Committee&#39;s 1966 Review Led to University-Based UFO Study thumbnail" loading="lazy" />
  <p>This is a compiled file of 1966–1969 US Air Force memoranda, meeting records, attendance lists, and correspondence documenting the Scientific Advisory Board&#39;s Ad Hoc Committee review of Project Blue Book, the Air Force&#39;s UFO investigation programme. The committee, chaired by Dr. Brian O&#39;Brien, met on 3 February 1966 and recommended the Air Force contract a university-based scientific team to investigate selected UFO sightings; Air Force Secretary Harold Brown accepted the recommendation, which led to the University of Colorado (Condon) study. The file also contains an April 1967 meeting attendance list, 1953 Robertson Panel material, and 1969 correspondence about the completed Condon Report.</p>
  <div class="narr">This document is not a single report but a bundle of separate US Air Force records — memoranda, meeting notes, attendance lists, and letters — gathered from 1965 to 1969. They trace how the Air Force decided to bring outside scientists in to look at UFO reports. The papers are marked in places &#39;For Official Use Only&#39;, and because the file was scanned by optical character recognition from old typewritten and photocopied pages, some names and numbers carry transcription errors.

At the centre is the Scientific Advisory Board&#39;s Ad Hoc Committee, chaired by Dr. Brian O&#39;Brien, which met on 3 February 1966 at HQ Foreign Technology Division (FTD), Wright-Patterson Air Force Base, Ohio. The review had been requested by General LeBailly in a memo dated 28 September 1965. The committee recommended that the Air Force contract a university-affiliated scientific team to investigate certain selected UFO sightings in depth. On 5 April 1966, Secretary of the Air Force Harold Brown wrote that the recommendations should be accepted. General Ferguson was given responsibility for implementing them, with Lt Colonel Robert Hippler as project officer.

The documents record some context about Project Blue Book, the Air Force&#39;s UFO programme run since 1948 under Air Force Regulation 200-2. As of 30 June 1965, a total of 9,267 reports had been investigated, of which 663 could not be explained. The file states that, to date, the Air Force had found no evidence that any UFO reports reflected a threat to national security. Dr. J. Allen Hynek, chairman of the Dearborn Observatory at Northwestern University, was the programme&#39;s scientific consultant.

The university effort eventually went to the University of Colorado, with Dr. Edward V. Condon as principal investigator and 21 senior scientists associated with the project, budgeted over an 18-month period — though the file notes that the University of Dayton had initially been suggested because of its proximity to HQ FTD. Related papers include an attendance list from a 17 April 1967 meeting with Dr. James McDonald of the University of Arizona at the Pentagon, cover material from the 1953 Scientific Advisory Panel (the Robertson Panel, which met 14–18 January 1953 and reviewed films from Tremonton, Utah and Great Falls, Montana), and 1969 correspondence about the completed Condon Report.

Redaction is moderate. Several of the 1953 Robertson Panel pages have names and details obscured or blanked, so some panel attendees cannot be identified from the text. Where the file records opinions on UFO origin — such as the view that UFOs are extra-terrestrial solid objects — these are attributed to named individuals as their personal views, not as established fact.</div>
