  <h1>American Airlines Crew Reported Spinning Lights Over Nebraska in 2023</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/2e4d64c379a580e3efa19a5d4ca5275b4ba103b30a323030ac86071591624122.jpg" alt="American Airlines Crew Reported Spinning Lights Over Nebraska in 2023 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of American Airlines flight AAL1308 on 3 December 2023. While flying at approximately 32,000 feet over Nebraska, the crew observed spinning flashing lights above their altitude that did not appear on air traffic control radar.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — part of the agency&#39;s system for logging unidentified aerial phenomena reported by pilots and air traffic controllers. It covers an event on 3 December 2023 at 03:15, involving American Airlines flight AAL1308, an Airbus A321 travelling from Philadelphia to San Francisco.

While flying westbound at Flight Level 320 (approximately 32,000 feet), the crew reported seeing spinning flashing lights above their altitude. The sighting occurred 31 nautical miles south-southwest of O&#39;Neill, Nebraska. The report was filed through Denver Air Route Traffic Control Centre (ZDV).

Air traffic control radar did not detect the object. The Aviation Weather Office was notified. The case was assigned the identifier 237UAP00327 and the internal reference ZDV-M-2023/12/02-0004.

The FAA marked the case as closed. No resolution or explanation for the sighting is provided in the document.</div>
