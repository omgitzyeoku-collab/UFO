  <h1>Pilot Reports Large Silver Balloon at Extreme Altitude Over Nebraska</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/de20bf3d567c81bf33933cd8b60963edb3b48f3946ba614a6b7d0afbd4dfd691.jpg" alt="Pilot Reports Large Silver Balloon at Extreme Altitude Over Nebraska thumbnail" loading="lazy" />
  <p>This FAA incident report documents a commercial pilot&#39;s sighting of a large silver or white balloon approximately 20,000 feet above their cruising altitude over Nebraska on 3 February 2023. The case was classified as an Unidentified Aerial Phenomenon and closed without any identification or resolution.</p>
  <div class="narr">On 3 February 2023, a commercial aircraft with the callsign MWT650 was flying from SNA (John Wayne Airport, Orange County) to FCM (Flying Cloud Airport, Minneapolis) at flight level 390 — roughly 39,000 feet. While passing about 101 nautical miles west of the O&#39;Neill VOR navigation beacon in Nebraska, the pilot reported spotting a large silver or white balloon an estimated 20,000 feet above them, placing the object at roughly 59,000 feet. The object was described as moving east-northeast.

The FAA logged the sighting under its SKYWATCH programme and classified it with the primary code &quot;Unidentified Aerial Phenomenon.&quot; The case was marked as closed. No resolution or identification of the object is provided in the document, and no corroborating radar data or follow-up investigation appears in the released material.

The timing is notable. This sighting occurred just one day before the US military shot down a Chinese surveillance balloon on 4 February 2023, during a period of heightened awareness of high-altitude balloon incursions into US airspace. The description — a large, light-coloured balloon at very high altitude — is consistent with the type of objects being tracked during that period, though this document does not draw any such connection.

No tail number is listed for the reporting aircraft, and no named individuals appear in the record. The document shows minimal redaction but also minimal detail — it is a brief incident log rather than a full investigation file.</div>
