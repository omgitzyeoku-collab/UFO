  <h1>Navy Drone Unit Tracked Unidentified Round Object Over Gulf of Aden</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">9/4/20</span>
    <span class="badge">Gulf of Aden</span>
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2565433b0ac938d6123c611be75b30ec6cf99c192e71dbf4ef53c40a6852ca00.jpg" alt="Navy Drone Unit Tracked Unidentified Round Object Over Gulf of Aden thumbnail" loading="lazy" />
  <p>A September 2020 military reporting form documents an 8-minute encounter between a U.S. Navy drone unit and a single round, thermally cold object over the Gulf of Aden. The object was traveling at 277 mph, made abrupt directional changes, and was detected on infrared sensors at a range of about 6 nautical miles.</p>
  <div class="narr">On the night of September 4, 2020, a crew from the 1172nd Attack Squadron — a unit that typically operates MQ-9 Reaper drones — was conducting an intelligence, surveillance, and reconnaissance (ISR) mission over the Gulf of Aden when they detected an unidentified object on their infrared sensor. The encounter lasted eight minutes, from 21:09 to 21:17 Zulu time, and was logged on a standard Range Fouler Reporting Form, which is the military&#39;s paperwork for unauthorized intrusions into controlled airspace.

The object was described as round and thermally &quot;cold.&quot; The infrared camera was set to &quot;black hot&quot; mode, meaning hot objects appear dark and cold objects appear bright — and this object showed up bright white. It was traveling roughly south-southeast on a heading of 168 degrees at 277 mph and made several abrupt directional changes during the encounter. The sensor operator was looking 39 degrees below the aircraft&#39;s altitude of 23,819 feet, at a slant range of 6.1 nautical miles (about 8.81 km ground distance).

The document is heavily redacted. The observer&#39;s name, exact coordinates (both military grid and latitude/longitude), email addresses, and other contact details are all blacked out. The form was marked &quot;For Official Use Only&quot; under the jurisdiction of U.S. Central Command (USCENTCOM) and was approved for release on March 16, 2026.

The form records what the operator observed but does not include any conclusion about what the object was. No corroborating sensor data, radar tracks, or independent witness accounts appear in this document. The Department of War&#39;s description notes that all language in the report reflects the reporter&#39;s subjective interpretation at the time of the event.</div>
