  <h1>Alaska Airlines Crew Reports Lights Above at 36,000 Feet Over California</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9d8070169f7d22ec1b7c984f6f4685f9cc2a8337dbb05cd35e29ebac6d7cddd9.jpg" alt="Alaska Airlines Crew Reports Lights Above at 36,000 Feet Over California thumbnail" loading="lazy" />
  <p>This FAA notification documents a UAP sighting by the crew of Alaska Airlines flight 1233 on October 27, 2023. While flying at 36,000 feet near Ukiah, California, the crew reported unexplained lights above them at the 12 o&#39;clock position. No evasive action was taken, and no further investigation or conclusion is included in this document.</p>
  <div class="narr">On the evening of October 27, 2023, the crew of Alaska Airlines flight 1233 — a Boeing 737-900 flying from Los Angeles to Seattle — reported seeing lights from above at the 12 o&#39;clock position (directly ahead). The aircraft was cruising northwest at flight level 360, roughly 36,000 feet, about 20 nautical miles west-southwest of the Mendocino VORTAC navigation point near Ukiah, California.

The sighting was logged by the FAA&#39;s Washington Operations Center as an incident notification. Oakland ARTCC (Air Route Traffic Control Center), the regional air traffic control facility handling the flight, relayed the report to FAA Operations. The crew did not take evasive action.

The document is a preliminary notification only — a short form recording the basics of the report. It does not contain any analysis, follow-up investigation, or conclusion about what the lights were. No radar data, photographs, or corroborating witness accounts appear in the record.

Beyond the description &quot;lights from above,&quot; the document provides no detail on the object&#39;s shape, size, colour, movement pattern, or how long the crew observed it. The record is assigned reference number WOC 7-3333 and coordinates place the sighting at approximately 39.08° N, 123.57° W.</div>
