  <h1>Pilot Reports Black Drone Near Dallas Love Field at Low Altitude</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/24ed64c20bb60f3af8b9c7e3fba86a841b8c4e46f9cda14e92350bbefe5c0cfa.jpg" alt="Pilot Reports Black Drone Near Dallas Love Field at Low Altitude thumbnail" loading="lazy" />
  <p>An FAA Operations Center log from March 10, 2024, records a pilot flying a Pilatus PC-12 near Dallas Love Field reporting a black unmanned aircraft system (drone) while at 1,500 feet. The document is a preliminary notification, not an investigation — no follow-up findings or conclusions are included.</p>
  <div class="narr">This document is an FAA Washington Operations Center incident notification — essentially an internal log entry — recording a UFO/UAP sighting reported by a pilot near Dallas Love Field airport in Texas on March 10, 2024, at 7:45 PM CDT.

According to the log, the pilot of aircraft N628MC, a Pilatus PC-12, reported observing a black UAS (unmanned aircraft system, commonly called a drone) while flying southeast-bound at 1,500 feet, approximately 4 nautical miles northwest of Dallas Love Field. The Dallas Love Field Air Traffic Control Tower relayed the report to the FAA Operations Center.

Law enforcement was notified: the record states that Dallas Fort-Worth DPS (Department of Public Safety) was contacted. The coordinates logged place the sighting just northwest of the airport.

The document is marked as preliminary information. It contains no investigation findings, no radar corroboration, and no final determination of what the object was. The pilot described it as a black UAS, but that is the pilot&#39;s identification — not a confirmed classification by the FAA or any other agency.</div>
