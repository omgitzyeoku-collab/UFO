  <h1>Federal Agent Reports Orange Hovering Light Near Western US Park</h1>
  <div class="meta">
    <span class="badge">Department of War</span>
    <span class="badge">October, 2023</span>
    <span class="badge">Westen United States</span>

  <img class="thumb" src="/extract/thumbs/28bb1f188c146a2cc6eb27d938fa437a9d6dd2e63896541e691a14e474b9d0f3.jpg" alt="Federal Agent Reports Orange Hovering Light Near Western US Park thumbnail" loading="lazy" />
  <p>A U.S. federal law enforcement special agent provided a first-hand written statement to the All-domain Anomaly Resolution Office (AARO) describing a large orange light that appeared to hover motionless over a ridge line near a Wildlife National Park in the western United States in October 2023. The document is heavily redacted, covers only the first page of what appears to be a longer narrative, and contains no instrument or sensor data to corroborate the observation.</p>
  <div class="narr">This unclassified memorandum, dated 02 June 2026 and issued by the Office of the Under Secretary of War, records the fifth witness narrative from a series of UAP (unidentified anomalous phenomena) sightings in the western United States. The witness, designated Witness 5, was one of several U.S. federal law enforcement special agents who reported observing UAP over two days in October 2023.

According to the statement, Witness 5 and a colleague departed around 1630 and were driving on an unpaved road near a Wildlife National Park. At 1858, they noticed a large orange light over a distinctive peak in a ridge line. The light appeared to hover with zero resistance or movement, with nothing visible holding it up. It lasted less than or about one minute — longer than a brief flash, but not a sustained presence.

Before the sighting, the agents encountered two men on the road who said they were taking pictures, along with several vehicles including a trailer, a white minivan, a white Jeep Wrangler, and a red Volkswagen van. The relationship of these individuals to the sighting, if any, is not established in the available text.

The document is heavily redacted: the specific national park, gate names, road names, and witness identifiers are all obscured. The released page appears to be only the first page of a longer narrative, meaning the full account — including any second-day observations — is not available here. No conclusions or analysis from AARO are included in this portion of the document.</div>
