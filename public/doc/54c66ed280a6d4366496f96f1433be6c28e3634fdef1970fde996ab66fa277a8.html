  <h1>CIA Document on 1968 UFO Sightings in South Asia Is Heavily Redacted</h1>
  <div class="meta">
    <span class="badge">CIA</span>

  <img class="thumb" src="/extract/thumbs/54c66ed280a6d4366496f96f1433be6c28e3634fdef1970fde996ab66fa277a8.jpg" alt="CIA Document on 1968 UFO Sightings in South Asia Is Heavily Redacted thumbnail" loading="lazy" />
  <p>This CIA document is titled as a report on UFO sightings in Ladakh, Nepal, Sikkim and Bhutan from 1968, but the readable portion is limited to a newspaper clipping quoting two prominent American UFO investigators. The actual sighting reports are not recoverable from the available text due to heavy redaction and severe image degradation.</p>
  <div class="narr">This document, catalogued as CIA-UAP-016, is described as covering seven UFO sightings across Ladakh, Nepal, Sikkim and Bhutan from February to March 1968. However, the document is an image file rather than a text PDF, and the text that can be extracted from it is severely degraded — most of the content is garbled or unreadable.

What is legible appears to be a newspaper clipping or informational sidebar rather than the sighting reports themselves. It quotes two figures from the American UFO investigation scene: Donald E. Keyhoe, director of the National Investigations Committee on Aerial Phenomena (NICAP), who was described as convinced that UFOs are intelligently controlled from outer space; and Dr. Edward Condon, former head of the National Bureau of Standards, who had been appointed director of the Air Force-sponsored civilian UFO investigation based at the University of Colorado in Boulder.

The actual details of the seven sightings referenced in the document&#39;s title — what was seen, by whom, and under what circumstances — are not present in the extractable text. The document carries heavy redaction evidence.

A more redacted version of this report was previously available on the CIA&#39;s public website, which suggests the version held here may contain additional material not seen in earlier releases. Even so, the poor image quality means that any additional content remains effectively unreadable.</div>
