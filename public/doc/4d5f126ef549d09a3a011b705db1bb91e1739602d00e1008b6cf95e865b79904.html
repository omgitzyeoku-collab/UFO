  <h1>Southwest Airlines Crew Reports Spinning Lights at 40,000 Feet</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/4d5f126ef549d09a3a011b705db1bb91e1739602d00e1008b6cf95e865b79904.jpg" alt="Southwest Airlines Crew Reports Spinning Lights at 40,000 Feet thumbnail" loading="lazy" />
  <p>An FAA incident report documents a Southwest Airlines Boeing 737 crew observing three lights in a circular, spinning pattern while cruising at 40,000 feet on 4 November 2023. The case was closed with no explanation provided.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — a standardised form the Federal Aviation Administration uses to log unidentified aerial phenomena reported by pilots and air traffic controllers. It records an observation made by the crew of Southwest Airlines flight SWA3147, a Boeing 737 flying from Tampa (TPA) to Nashville (BNA).

On 4 November 2023 at 02:13 UTC, while cruising northwest-bound at flight level 400 (approximately 40,000 feet) over the SZW navigational fix, the crew reported an unidentified aerial phenomenon off the left side of their aircraft. They described three lights arranged in a circular pattern, spinning and appearing to hold position.

The sighting was logged by Jacksonville Center (ZJX), the FAA air traffic control facility covering that airspace, and personnel were paged in response. The case is marked as closed, but the report contains no resolution, no follow-up investigation details, and no explanation for what the crew observed.

The document contains minimal redaction. However, it is a brief, single-page form with limited detail — there is no mention of radar data, photographs, other witness accounts, or weather conditions at the time of the sighting.</div>
