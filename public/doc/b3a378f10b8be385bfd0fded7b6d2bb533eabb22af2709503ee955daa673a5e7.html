  <h1>CIA Cover Sheet References Air Force UFO Analysis Report</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/b3a378f10b8be385bfd0fded7b6d2bb533eabb22af2709503ee955daa673a5e7.jpg" alt="CIA Cover Sheet References Air Force UFO Analysis Report thumbnail" loading="lazy" />
  <p>This document is a CIA cover sheet for the US Air Force&#39;s Project Blue Book Special Report No. 14, which analysed reports of unidentified aerial objects. The released image contains only the routing page — not the actual analysis — and was held by the CIA Archives and Records Center.</p>
  <div class="narr">This record is a CIA cover sheet referencing Project Blue Book Special Report No. 14, a US Air Force study that analysed reports of unidentified aerial objects. The document itself is an image-format page rather than a full text report.

The page carries a clear instruction: &quot;RETURN IMMEDIATELY AFTER USE TO THE CIA ARCHIVES AND RECORDS CENTER,&quot; confirming the CIA held a copy of the Air Force report in its own archives. A handwritten note is reported on the first page, but its content was not captured in the available text.

Critically, this release contains only the cover or routing page — not the substantive analytical content of Special Report No. 14 itself. The original image is heavily degraded, and the text extracted by optical character recognition is mostly fragmentary and unreadable. Very little information beyond the title and the archival routing instruction can be reliably drawn from this document.</div>
