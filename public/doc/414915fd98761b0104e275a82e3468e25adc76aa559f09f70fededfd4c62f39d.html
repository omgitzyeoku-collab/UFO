  <h1>Virgin Atlantic Crew Reported Three Rotating Lights Over Iowa</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/414915fd98761b0104e275a82e3468e25adc76aa559f09f70fededfd4c62f39d.jpg" alt="Virgin Atlantic Crew Reported Three Rotating Lights Over Iowa thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of a Virgin Atlantic Boeing 787 on 10 March 2023. While flying at 37,000 feet near Fort Dodge, Iowa, the crew observed three very bright lights high above them, rotating around each other with varying brightness. The FAA closed the report with no identification of the phenomenon.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report — the system the Federal Aviation Administration uses to log unidentified aerial phenomena reported by pilots. It covers a sighting on 10 March 2023 by the crew of Virgin Atlantic flight VIR156T, a Boeing 787 flying from Las Vegas to London Heathrow.

The crew was heading east-northeast at 37,000 feet, in the vicinity of Fort Dodge, Iowa, when they observed an unidentified aerial phenomenon off the left side of the aircraft. They described three very bright lights positioned high in the sky above them — notable given the aircraft was already at cruising altitude. The lights varied in brightness and were rotating around each other rapidly.

The crew did not take evasive action, indicating the phenomenon was not considered an immediate collision risk. The Airways Weather Office was advised of the sighting. The FAA assigned the report the identifier 237UAP00238 and the mandatory occurrence report ID ZMP-M-2023/03/10-0001.

The report&#39;s status is marked as Closed. No resolution or identification of the lights is recorded in the document. There is no mention of corroborating radar data, additional witness accounts from other aircraft, or any follow-up investigation.</div>
