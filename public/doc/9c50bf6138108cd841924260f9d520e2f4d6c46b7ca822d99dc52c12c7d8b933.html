  <h1>FBI Files from 1950: Hoaxes, Radar Blips, and Jurisdictional Confusion</h1>
  <div class="meta">
    <span class="badge">FBI</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9c50bf6138108cd841924260f9d520e2f4d6c46b7ca822d99dc52c12c7d8b933.jpg" alt="FBI Files from 1950: Hoaxes, Radar Blips, and Jurisdictional Confusion thumbnail" loading="lazy" />
  <p>This FBI file compiles internal memos and press clippings from 1950 covering a cardboard flying saucer hoax near Elmira, NY, a dubious letter from Mexico claiming scientific study of flying discs, and a detailed but inconclusive investigation into radar detections of an object at roughly 100,000 feet over the Oak Ridge nuclear facility in Tennessee. Names of nearly all witnesses and military officers are redacted throughout.</p>
  <div class="narr">This collection of FBI documents from 1950 brings together several unrelated flying saucer reports that crossed the Bureau&#39;s desk. The most straightforward is from Buffalo, NY: a reported flying saucer near Elmira airport turned out to be a corrugated cardboard box, 40 inches across and a foot thick, painted aluminium and fitted with a radio tube and a trucker&#39;s red flare. The FBI noted it was too fragile to have ever flown, and no one had witnessed it in the air. Case closed as a hoax.

A second thread involves a letter dated 19 March 1950 from Veracruz, Mexico, claiming scientific investigation of flying discs. The FBI&#39;s New York office reviewed it and could not confirm whether the claims were genuine, concluding the author was possibly &quot;psychotic or neurotic.&quot; The Bureau did not pursue the matter further.

The most substantial portion of the file concerns radar detections over Oak Ridge, Tennessee — home to Atomic Energy Commission (AEC) facilities — in early March 1950. A civilian near Knoxville, locally regarded as a reputable citizen and skilled radio technician, reported picking up returns on his surplus APN-7 radar set at approximately 100,000 feet directly over Oak Ridge. Observations began on 3 March and continued over subsequent days. Agents from the Counter Intelligence Corps (CIC) and the Office of Special Investigations (OSI) visited the civilian and observed radar &quot;pips&quot; consistent with his reports. A scientist consulted on the matter stated that while an aircraft sustaining 100,000 feet was &quot;highly improbable,&quot; it was &quot;absolutely possible from a scientific and engineering standpoint.&quot;

However, military evaluators who examined the civilian&#39;s equipment found it &quot;haphazard at best&quot; and said no great reliability could be placed in its readings. The AEC stated it lacked authority to request proper radar equipment for verification, since area air defence fell to the 3rd Army. No agency appeared to take decisive ownership of the investigation. The file also includes a U.S. News &amp; World Report article — a press clipping, not an FBI assessment — speculating that flying saucers were US-built jet-propelled disks based on German wartime designs, only 25 feet in diameter with a top speed of 400–500 mph. The article also referenced the Navy&#39;s &quot;Flapjack&quot; experimental disk project by Chance Vought, which it said had been dropped.</div>
