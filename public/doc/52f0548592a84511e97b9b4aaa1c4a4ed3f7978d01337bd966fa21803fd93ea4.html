  <h1>FAA Closed a 2010 UFO Report Near Charleston Without Follow-Up</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>

  <img class="thumb" src="/extract/thumbs/52f0548592a84511e97b9b4aaa1c4a4ed3f7978d01337bd966fa21803fd93ea4.jpg" alt="FAA Closed a 2010 UFO Report Near Charleston Without Follow-Up thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from September 2010 documenting a civilian sighting of a possible UFO approximately 25 miles east of Charleston. The FAA attempted to contact the witness but could not reach them, and the case was closed with no further investigation noted.</p>
  <div class="narr">This document is an FAA (Federal Aviation Administration) SKYWATCH incident report — a standard form used when air traffic control receives a report of unusual aerial activity. It was filed on 7 September 2010 at 07:12 and categorised under the primary code &quot;OTHER&quot;.

According to the report, Charleston air traffic control (CHS) received a call from a civilian identified as Mr. Rogers, who reported seeing a possible UFO roughly 25 miles east of Charleston. No description of the object&#39;s appearance, behaviour, or how long it was visible is included in the document — only that it was reported as a &quot;possible UFO&quot;.

The FAA attempted a single follow-up by phone, but the witness&#39;s voicemail box was full and no message could be left. No page was sent. The case was then marked as closed, with no indication of any further investigation, radar review, or corroboration from pilots or other observers.

The witness&#39;s phone number is partially redacted under a FOIA (Freedom of Information Act) exemption, which limits the ability to independently verify the account. No other personal details beyond the name are visible in the released version.</div>
