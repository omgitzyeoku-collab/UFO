  <h1>FAA Report: Pilot Saw Three Flashing Lights at 36,000 Feet</h1>
  <div class="meta">

  <img class="thumb" src="/extract/thumbs/089d0c7a3f2a54f66be31dbf36240d1885df7818e49712f35e6a8295bfc3c1d9.jpg" alt="FAA Report: Pilot Saw Three Flashing Lights at 36,000 Feet thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report documenting a pilot sighting of three stationary flashing lights during a commercial flight from San Juan to Tampa. The case was closed with no explanation of what the lights were.</p>
  <div class="narr">This document is an FAA SKYWATCH incident report filed under case number 237UAP00097. It records an unidentified aerial phenomenon observed by the crew of a commercial flight operating under callsign NKS539, flying from San Juan, Puerto Rico (SJU) to Tampa, Florida (TPA).

The sighting occurred while the aircraft was heading northwest at Flight Level 360 — roughly 36,000 feet — approximately 115 nautical miles southeast of the ZQA navigation aid. The crew reported three lights off the right side of the aircraft that were stationary, positioned above the horizon, and turning on and off. The UFO reporting centre was notified of the incident.

The FAA marked the case as closed. Notably, the report contains no investigation findings, no radar data, no sensor evidence, and no explanation of what the lights might have been. The aircraft tail number field is blank, which limits the ability to independently verify which specific aircraft was involved.

The document is a single-page administrative record rather than a detailed investigation file. It captures what the crew reported but does not attempt to identify or explain the phenomenon.</div>
