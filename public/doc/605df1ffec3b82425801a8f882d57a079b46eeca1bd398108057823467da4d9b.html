  <h1>UPS Cargo Crew Reports Three Lights Above 60,000 Feet Near Las Vegas</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/605df1ffec3b82425801a8f882d57a079b46eeca1bd398108057823467da4d9b.jpg" alt="UPS Cargo Crew Reports Three Lights Above 60,000 Feet Near Las Vegas thumbnail" loading="lazy" />
  <p>This FAA incident report documents a sighting by the crew of UPS flight 917, a Boeing 767-300 cargo aircraft, on 27 August 2023 near Las Vegas, Nevada. The crew reported three white orbiting lights above 60,000 feet that moved roughly 15,000 feet vertically and 100 miles horizontally — figures that, if accurate, describe movement well beyond conventional aircraft behaviour.</p>
  <div class="narr">On 27 August 2023 at 02:05 AM Pacific time, the crew of UPS flight 917 — a Boeing 767-300 flying from Ontario, California to Louisville, Kentucky — reported an unusual sighting to the FAA&#39;s Washington Operations Center. The aircraft was in the vicinity of Las Vegas, Nevada, at coordinates roughly 36.08°N, 115.15°W.

The crew described three white lights that appeared to be orbiting. According to the report, the lights moved up and down by approximately 15,000 feet and swept horizontally across roughly 100 miles. The crew estimated the lights were above Flight Level 600, meaning above 60,000 feet — well above the ceiling of commercial airliners and most military aircraft.

The FAA logged this as a preliminary UAP (Unidentified Anomalous Phenomena) report through its W-ROC (Washington Regional Operations Center) channel. The document does not contain any final determination about what the lights were, nor does it reference corroborating radar data or additional witnesses.

The report is short and largely unredacted, but it is also a single-source account. The distances and altitudes were estimated by the flight crew, not confirmed by instruments. In particular, the claimed 100-mile horizontal range is an exceptionally large figure that the crew may have misjudged from a distance at night.</div>
