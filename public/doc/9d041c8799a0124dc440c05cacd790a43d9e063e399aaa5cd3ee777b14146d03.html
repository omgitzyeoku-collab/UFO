  <h1>Apollo 17 Astronauts Reported Bright Objects Near Spacecraft in 1972</h1>
  <div class="meta">
    <span class="badge">NASA</span>

    <span class="badge">Moon</span>

  <img class="thumb" src="/extract/thumbs/9d041c8799a0124dc440c05cacd790a43d9e063e399aaa5cd3ee777b14146d03.jpg" alt="Apollo 17 Astronauts Reported Bright Objects Near Spacecraft in 1972 thumbnail" loading="lazy" />
  <p>This document is an excerpt from the Apollo 17 mission&#39;s air-to-ground radio transcript from 1972, highlighting moments when astronauts reported seeing bright particles, a distant flashing object, and a flash on the lunar surface. The crew themselves proposed ordinary explanations for most observations — spacecraft debris, ice, peeling paint, or a meteorite impact — and none were treated as unexplained by the crew or Mission Control.</p>
  <div class="narr">This NASA document is a selected excerpt from the official Apollo 17 air-to-ground voice transcript — the radio communications between astronauts Gene Cernan, Ron Evans, and Jack Schmitt and Houston Mission Control during their 1972 Moon mission. The excerpt focuses on several periods where the crew reported observing unusual visual phenomena.

Early in the mission, around three and a half hours in, the crew noticed bright particles drifting past the spacecraft during a maneuver. They described the fragments as jagged, angular, and flat — some possibly six inches across — tumbling slowly nearby. One astronaut compared the view out the window to a Fourth of July fireworks display. Photos were taken. The crew speculated the fragments were ice chunks or peeling paint from the S-IVB rocket stage, and a ground crew member mentioned noticing peeling material on the rocket during a pre-launch elevator trip.

Later, the astronauts observed a bright object at great distance — estimated at 10 to 12 Earth diameters from Earth — that appeared to rotate, producing a rhythmic pattern of one bright flash followed by one dull flash per cycle. Commander Cernan stressed it was a physical object at distance, not a nearby particle. After watching it for roughly 24 hours, the crew tentatively identified it as the S-IVB stage or SLA (Spacecraft-Lunar Module Adapter) panels. Two similar flashers were eventually noted. Mission Control took the reports seriously, offering to use spacecraft instruments to help locate and track the objects.

Two other observations appear in the excerpt. Commander Cernan reported seeing bright flashes and streaks — including one he compared to a bright headlight — while trying to sleep, a phenomenon consistent with cosmic rays striking the retina, which NASA was actively studying during Apollo missions. Separately, Schmitt reported a bright flash and a thin streak of light on the lunar surface north of Grimaldi crater, which the crew suggested could be a small meteorite impact.</div>
