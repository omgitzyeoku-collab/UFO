  <h1>Airline Crew Reported Mysterious Lights Over North Carolina in 2022</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/d07e3de991d3179d80cd684ab49aca7d44c176175226ded879eb385740a36c91.jpg" alt="Airline Crew Reported Mysterious Lights Over North Carolina in 2022 thumbnail" loading="lazy" />
  <p>This FAA incident report documents a commercial airline crew&#39;s sighting of 5 to 6 unidentified lights making circular movements at high altitude over the Raleigh-Durham area on 8 August 2022. A second pilot independently observed the same lights and suggested they were Starlink satellites, but the case was closed without a formal determination.</p>
  <div class="narr">On 8 August 2022 at 04:48 UTC, the crew of commercial flight LRC662 — an Airbus A320 flying northbound at 37,000 feet — reported an unidentified aerial phenomenon off the left side of their aircraft while over Wilmington, North Carolina. They described 5 to 6 lights making 360-degree movements at very high altitude over the Raleigh-Durham area.

A second pilot, flying under the callsign FFT1242, independently observed the same lights and offered the opinion that they were Starlink satellites — SpaceX&#39;s constellation of low-orbit internet satellites, which are frequently visible as moving points of light.

The FAA logged the incident through its SKYWATCH reporting system. FAA headquarters in Denver notified the UFO Reporting Center, and additional internal notifications were made.

The case is marked as closed. Notably, the report contains no formal conclusion or determination about what the lights were. No radar data, photographs, or sensor evidence is referenced in the document. The Starlink attribution came from a single pilot&#39;s opinion, not from any agency analysis.

The document itself is a single-page administrative log rather than a detailed investigation. It records what was reported and who was notified, but offers no independent assessment of the sighting.</div>
