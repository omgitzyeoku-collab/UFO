  <h1>Pilot Reports String of White Lights Over Alabama in 2020</h1>
  <div class="meta">
    <span class="badge">FAA</span>

  <img class="thumb" src="/extract/thumbs/d0018427de7d07eb4a34540ed4f9edb27b373e77eb1876bcda22bd273f46afcf.jpg" alt="Pilot Reports String of White Lights Over Alabama in 2020 thumbnail" loading="lazy" />
  <p>This is an FAA SKYWATCH incident report from 7 January 2020 in which a private jet pilot flying near Talladega, Alabama reported seeing a string of white lights at a higher altitude off the left side of the aircraft. The case was reported to the UFO Reporting Center and is now closed, with no evasive action taken and no further explanation recorded.</p>
  <div class="narr">On 7 January 2020, the pilot-in-command of a Cessna Citation CJ1 (a small private jet, callsign N28QA) filed a report through the FAA&#39;s SKYWATCH system — the agency&#39;s mechanism for logging unusual aerial sightings. The aircraft was on a general aviation flight from CTJ to BTR, travelling westbound at 24,000 feet, approximately 30 nautical miles southeast of Talladega, Alabama.

The pilot described seeing an unidentified object off the left side of the aircraft. It appeared as a string of white lights at an estimated altitude of 35,000 feet — roughly 11,000 feet above the aircraft&#39;s own position. No evasive action was taken, suggesting the pilot did not consider the object an immediate collision threat.

The sighting was reported through Atlanta Air Route Traffic Control Center (ZTL) and the UFO Reporting Center was notified. The FAA classified the incident under its &quot;OTHER&quot; primary code, meaning it did not fit standard aviation hazard categories.

The report&#39;s status is listed as closed. The document contains no further analysis, no radar corroboration, and no conclusion about what the pilot observed. It is a single-page incident log, not an investigation file.</div>
