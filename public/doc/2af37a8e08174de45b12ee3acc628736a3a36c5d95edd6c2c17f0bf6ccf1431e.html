  <h1>French Military Officials Urged Governments to Take UFOs Seriously in 1999 Report</h1>
  <div class="meta">
    <span class="badge">NASA</span>
    
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/2af37a8e08174de45b12ee3acc628736a3a36c5d95edd6c2c17f0bf6ccf1431e.jpg" alt="French Military Officials Urged Governments to Take UFOs Seriously in 1999 Report thumbnail" loading="lazy" />
  <p>This document is the English translation of the COMETA Report, a 1999 study by retired French military and civilian officials examining well-documented UFO cases from multiple countries. Accompanied by a cover letter from Carol Rosin (former spokesperson for Wernher von Braun) to a NASA contact, the report recommended that authorities treat UFO phenomena seriously, including considering the extraterrestrial hypothesis and its defence implications.</p>
  <div class="narr">This document pairs two things: a personal cover letter dated April 30, 2001, from Carol Rosin to a NASA official named Dan, and the English translation of the French COMETA Report. Rosin, who described herself as a former spokesperson for Wernher von Braun, sent the report ahead of a scheduled meeting at the NASA office. The COMETA Report itself was originally published in VSD magazine in France in July 1999.

COMETA — the Committee for In-Depth Studies — was a French association chaired by General Denis Letty, an Air Force general. The report grew out of work connected to the Institut des Hautes Etudes de Défense Nationale (IHEDN), France&#39;s Institute of Higher Studies for National Defence. Its foreword was written by Professor André Lebeau, former chairman of France&#39;s national space agency (CNES), and its preface by General Bernard Norlain, a former IHEDN director. The committee included retired military officers, engineers, and scientists.

The report presented detailed case studies of UFO encounters from France, the United Kingdom, the United States, Iran, Russia, and Argentina, many involving military and civilian pilots with radar confirmation. Among them: Air France Flight AF 3532 crew observed a brown, lens-shaped object roughly 250 metres long near Coulommiers on January 28, 1994, confirmed by military radar. In Tehran on September 18–19, 1976, an F-4 Phantom&#39;s instruments and communications failed at 45 kilometres from a bright object whose radar signature resembled a Boeing 707 — the U.S. Defence Intelligence Agency later called it &quot;an outstanding report&quot; and &quot;a classic.&quot; Over Pereslavl-Zalesski in Russia, air defence forces tracked a disc estimated at 100 to 200 metres across, moving at speeds two to three times faster than modern jet fighters. In Argentina on July 31, 1995, a power outage struck San Carlos de Bariloche at the precise moment a three-lighted object appeared alongside a Boeing 727.

The report recommended that governments treat UFO phenomena as a legitimate subject of study, including weighing the extraterrestrial hypothesis and its strategic, political, and religious implications. It noted that France had already created a dedicated government unit within CNES — first called GEPAN, later SEPRA — to investigate such cases.

Only a portion of the full report (roughly the first 21 of 90-plus pages) is included in this extracted document. Several pages contain largely illegible handwritten notes. The document carries low evidence of redaction.</div>
