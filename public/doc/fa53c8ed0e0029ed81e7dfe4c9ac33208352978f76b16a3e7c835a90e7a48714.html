  <h1>Pentagon UAP Office Reports 757 Sightings, Finds No Alien Evidence</h1>
  <div class="meta">
    <span class="badge">OSD</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/fa53c8ed0e0029ed81e7dfe4c9ac33208352978f76b16a3e7c835a90e7a48714.jpg" alt="Pentagon UAP Office Reports 757 Sightings, Finds No Alien Evidence thumbnail" loading="lazy" />
  <p>The Department of Defense&#39;s All-domain Anomaly Resolution Office (AARO) released its fiscal year 2024 annual report covering May 2023 to June 2024. Of 757 reports received, every resolved case turned out to be ordinary objects like balloons, birds, or drones, and AARO states it has found no evidence of extraterrestrial technology — though nearly 60% of cases remain unresolved due to insufficient data.</p>
  <div class="narr">This is the annual report from AARO, the Pentagon office established to investigate unidentified anomalous phenomena (UAP). It covers reports received between May 2023 and June 2024 and was cleared for public release on 7 November 2024, with a formal release date of 5 February 2025. AARO received 757 UAP reports during this period: 485 from incidents within the reporting window, and 272 older cases from 2021–2022 that had not previously been submitted. Of those 757 reports, 392 came from a bulk transfer of all Federal Aviation Administration UAP reports since 2021.

Of the cases AARO was able to resolve — 118 during the reporting period, plus 174 pending formal closure — all were identified as ordinary objects: balloons, birds, unmanned aerial systems (drones), satellites including the Starlink constellation, and conventional aircraft. None indicated advanced foreign technology or aerospace breakthroughs. AARO states explicitly that it has discovered no evidence of extraterrestrial beings, activity, or technology.

However, 444 cases — 59% of the total — were placed in an &quot;Active Archive&quot; because they lacked sufficient data for analysis, and 170 reports (22.4%) contained too little information to even describe the shape of what was observed. Only 21 cases were flagged as meriting deeper analysis by intelligence community and science partners. Notably, AARO received no data from the United States&#39; most capable sensor systems — its national signals intelligence (SIGINT), geospatial intelligence (GEOINT), and measurement and signature intelligence (MASINT) platforms contributed zero reports.

The report highlights several specific incidents. Three reports described pilots being trailed or shadowed by UAP, though AARO has no confirmation these are linked to foreign adversaries. A commercial aircrew reported a near miss with a cylindrical object over the Atlantic Ocean off the coast of New York. Eighteen incidents involved drones near U.S. nuclear infrastructure, including a crashed drone recovered at the D.C. Cook Nuclear Power Plant in Michigan on 3 August 2023 and six consecutive nights of drone flyovers at a nuclear fuel facility in Lynchburg, Virginia, in October 2023. No adverse health effects were reported by any observers.

On the technology front, AARO introduced GREMLIN, a prototype sensor system developed by the Georgia Tech Research Institute, which successfully collected data during a test in March 2024. The office also launched its public website, aaro.mil, on 31 October 2023, and coordinated with Oak Ridge National Laboratory on a materials analysis of an alleged UAP sample, with results posted publicly.</div>
