  <h1>Two Cargo Flights Reported Circling White Lights at Extreme Altitude Over Nevada</h1>
  <div class="meta">
    <span class="badge">FAA</span>
    <span class="badge">2023</span>
    
    <span class="badge">verified</span>
  </div>
  <img class="thumb" src="/extract/thumbs/9b3782070fbaa405b96fce01b56751add17c3af68f28a21c02e84b393b10c5da.jpg" alt="Two Cargo Flights Reported Circling White Lights at Extreme Altitude Over Nevada thumbnail" loading="lazy" />
  <p>This FAA incident report documents a November 2022 sighting by a UPS flight crew of 2–3 white lights circling at an estimated 74,000 feet — far above any known conventional aircraft ceiling — west of Ely, Nevada. A FedEx crew independently reported the same phenomenon from the same location at the same time. The FAA closed the case with no explanation provided.</p>
  <div class="narr">On 11 November 2022, the crew of UPS flight 834, flying northbound at 36,000 feet, reported an unidentified aerial phenomenon to air traffic control. The sighting occurred approximately 74 nautical miles west of Ely, Nevada, within the Salt Lake City (ZLC) air traffic control area.

The crew described 2–3 white lights circling at an estimated altitude of 74,000 feet — roughly double the cruising altitude of commercial airliners and well above the operational ceiling of any known conventional aircraft. Altitude estimates made visually from a cockpit are inherently imprecise, so the 74,000-foot figure should be treated as approximate.

The report was corroborated by a second, independent observation: the crew of FedEx flight 1879, a Boeing 767 flying eastbound at 37,000 feet between Oakland and Salt Lake City, reported the same phenomenon from the same location at the same time.

The FAA logged the incident under its SKYWATCH programme, which tracks pilot-reported sightings of unidentified aerial phenomena. The case was assigned reference number 237UAP00129 and MOR ID ZLC-M-2022/11/11-0001. It is marked as closed, but the document provides no resolution, identification, or explanation for what was observed.

No radar data or sensor corroboration is mentioned in the document. The tail number field for the reporting aircraft is blank, and the incident location field in the record metadata is not filled in, though the narrative text places the sighting west of Ely, Nevada.</div>
